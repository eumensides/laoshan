","炒勺内倒入清汤，加精盐、料酒、味精烧沸撇沫，湿淀粉勾芡，淋上葱油，浇在柿椒上即成，"]},{"i":502,"n":"鱼鳞茄子","r":"鲁菜","o":"鲁菜300种","f":"茄子片形赛如鱼鳞，软嫩香美，常作筵席上的应时饭莱。","c":"热菜","m":["爆炒"],"g":["鱼肉","茄子","猪肉","鸡蛋"],"s":["盐","料酒","酱油","味精","葱","姜","淀粉","花椒"],"t":["炒锅","蒸锅"],"v":0,"a":"主料：茄子3个（约300克）猪五花硬助肉200克｜调料：精盐4克酱油2铁料酒15克味精1克甜235面酱5克鸡蛋清1个·葱姜末4克湿淀粉10克花椒面2.5克花椒油10克花生油500克（约耗80克）","p":["1。将茄子削皮去把，直刀破成4大块，再用坡刀切成夹刀片。2：猪肉剁碎效在碗内，加入葱姜末、花椒面、精盐、酱浊、甜面酱调匀成馅，酿在每片茄夹内。","鸡蛋清、湿淀粉放一个碗内调合成稠糊，涂在茄子的夹馅口处。4。炒勺内倒入花生油，烧至七成热时，将茄夹放入炸至深黄色，捞出摆在碗内呈鱼鳞斜叠样式，加入酱油、清汤，上笼蒸20分钟，取出扣在另一个盘内，原汤凈入炒勺内，加清汤，用湿淀粉勾芡烧沸，加味精，再淋上花椒油浇在茄子上。"]},{"i":503,"n":"炒八宝辣椒丁","r":"鲁菜","o":"鲁菜300种","f":"：此菜多种颜色，香辣可口，增进食欲。","c":"热菜","m":["爆炒"],"g":["辣椒","猪肉","豆腐","面筋","山药","豌豆"],"s":["盐","葱","姜","料酒","酱油","高汤"],"t":["炒锅"],"v":0,"a":"主料：柿子辣椒100克干红辣椒2个熟瘦猪肉煮熟花生米豆腐干炸豆腐山药水面筋鲜藕各25克青豆10克｜调料：精盐3克酱油5克葱姜丝2.5克料酒10克236清汤50克花椒油10克花生油40克","p":["1。","将柿椒洗净去籽切成1厘米方丁，山药、藕削去皮切成方丁，熟猪肉、豆腐干、炸豆腐、·面筋也均切成方丁，熟花生米的软皮捏去，和青豆以上各料都用沸水焯一遍，·控净水分。","干红辣椒切成丁。","2。","炒勺内放入花生油，烧至七成热时烹入葱姜和干红辣椒丁，略炸出香味，随即将以上各料均倒入勺内煸炒，加酱油、精盐、清汤、料酒，继续翻炒至熟，淋上花椒油即成。"]},{"i":504,"n":"余芙蓉黄管","r":"鲁菜","o":"鲁菜300种","f":"汤清澈透明呈微淡黄色，黄管呈蜗形美观，芙蓉软嫩清口，气味香醇，是宴席名菜。","c":"热菜","m":["蒸"],"g":["猪肉","鸡肉","鸡蛋","黄瓜","火腿","香菇"],"s":["盐","高汤","料酒","味精","酱油"],"t":["炒锅","蒸锅"],"v":0,"a":"主料：猪黄管4大条鸡料子150克鸡蛋清10个｜配料：黄瓜皮火腿香菇各50克｜调料：精盐3克清汤1000克.料酒15克·味精1.5克酱油3克","p":["1。","黄管洗净放入锅内加水用小火煮至八成熟时捞出，清水洗过拟净脂皮，用竹筷子顶住一头将其翻过来，放在板上，用刀划成形。","取其两大条平铺在盘子上，将鸡料子抹入黄管内。","黄瓜皮、火腿。","香菇均切小细段，分别沾在黄管刀口翻开处，上笼蒸透取出，截成6厘米长的段，其余两条同样截成6厘米长的段，沸水焯透捞出。","2372．鸡蛋清磕入大汤碗内，加清汤（250克）、精盐（1克）用筷子搅打均匀，上笼蒸熟成为芙蓉底。","将以上两样黄管间隔整齐地摆在芙蓉上。","3。","炒勺内倒入清汤，加精盐、料酒、味精、酱油烧沸撇沫，浇在黄管碗内。"]},{"i":505,"n":"炒合菜","r":"鲁菜","o":"鲁菜300种","f":"此菜咸香味美，佐酒下饭皆可，最宜家庭制做，如不用白菜、蒜苗，可按季节选用韭莱、芹菜、黄瓜亦可。238","c":"热菜","m":["爆炒"],"g":["猪肉","冬笋","青蒜","豆腐","白菜","粉丝粉皮"],"s":["盐","甜面酱","酱油","葱","姜","料酒","味精","高汤"],"t":["炒锅"],"v":0,"a":"主料：猪肉100克｜配料：笋丝蒜苗炸豆腐丝各50克嫩白菜心丝鲜粉皮各100克·｜调料：精盐1.5克酱油25克甜面酱15克葱姜丝5克料酒10克味精0.5克清汤100克花椒油5克花生油50克","p":["1。先将猪肉切成长6厘米、粗3毫米的丝条。鲜粉皮切成长5厘米、宽2厘米的条片与冬笋，炸豆腐丝均用沸水焯过，","炒勺内倒入花生油烧至六成热时烹入葱姜丝、肉丝煸炒至发白色，“飞”入甜面酱炒至放香加酱油煸炒，再放入所有配料（除蒜苗）、清汤、料酒、精盐放入翻炒1分钟，出锅前加蒜苗、味精、花椒油颠翻均匀即成。"]},{"i":506,"n":"脆皮里脊鱼肉卷","r":"鲁菜","o":"鲁菜300种","f":"外皮酥脆色金黄，内里鱼肉鲜香嫩美，清爽利口。239三O〇火锅（一）涮锅涮锅，多在冬季使用，且是一种在餐桌上对食物加热的器","c":"热菜","m":["炸"],"g":["猪肉","鱼肉","猪腰","鸡蛋"],"s":["盐","料酒","味精","葱","姜","淀粉","花椒","香油"],"t":["炒锅"],"v":0,"a":"主料：猪通脊肉200克净鲜肉鱼100克猪肥腰肉50克｜调料：精盐2克料酒10克味精1克葱姜末5克鸡蛋清1个湿淀粉100克.花椒面2.5克香油2.5克花生油1000克（约耗100克）","p":["1。将猪通脊肉上的筋膜片去，切成长5厘米、宽4厘米的薄片共12片。鱼肉、肥腰肉剁成细泥放入一-个碗内，加入精盐、味精、料酒、鸡蛋清、葱姜末、香油顺一个方向搅匀成馅。","将肉片逐片铺平在板上，每片中心顺长抹上鱼肉馅，卷成长5厘米的卷。","锅内倒入花生油烧至五成热时，将卷逐个沾上一层淀粉糊下入油内炸至漂起油冒细泡外皮金黄色时捞出，整齐地摆入平盘内即成。上桌时外带花椒面随意蘸食，"]},{"i":507,"n":"三丝黄瓜卷","r":"鲁菜","o":"山东菜巧作指导","f":"色泽：外皮翠绿油亮，卷心红、绿、黑三色相间。口味：咸鲜适中。质感：脆嫩。","c":"热菜","m":[],"g":["黄瓜","冬笋","香菇","萝卜"],"s":["盐","味精","香油"],"t":["炒锅"],"v":1,"a":"黄瓜350克、莴笋100克、水发冬菇100克、胡萝卜100克、精盐8克、味精8克、香油20克。","p":["初步加工：黄瓜去头和尾，胡萝卜和莴笋刮去表皮，水发冬菇去蒂，洗净备用。","原料成形：黄瓜切成长约7厘米的段，采用上片或下片的方法滚动原料片成厚约0.2厘米的片（用黄瓜表皮部分）。胡萝卜、水发冬菇、莴笋改刀成长约4厘米、宽约0.2厘米的丝。","原料焯水：将胡萝卜丝、莴笋丝、冬菇丝分别入沸水锅焯水，过凉沥水备用。","加工制卷：黄瓜皮置器皿内，加精盐拌匀腌渍约10分钟。另将三丝置器皿内，加精盐、味精和香油拌匀腌渍入味。取黄瓜皮一片平放在案板上（瓜皮面朝下），放上三丝，从一端卷成中指粗细的卷。依此法将其余原料均制成卷，然后在瓜皮表面抹上香油，放器皿内即可食用。"]},{"i":508,"n":"炝黄瓜皮","r":"鲁菜","o":"山东菜巧作指导","f":"色泽：瓜皮翠绿。口味：甜酸适中，微有麻味。质感：脆嫩。","c":"凉菜","m":["烧扒焖"],"g":["黄瓜"],"s":["盐","味精","白糖","醋"],"t":["炒锅"],"v":1,"a":"黄瓜500克、精盐2克、味精2克、白糖25克、白醋25克、花椒油15克。","p":["初步加工：选择条直、粗细均匀的鲜嫩黄瓜，洗净备用。","原料成形：黄瓜去头和尾切成长约7厘米的段，采用上片或下片的方法滚动原料片成厚约0.3厘米的片（用黄瓜表皮部分，黄瓜另作它用），再切成长约7厘米、宽约2厘米的长条片待用。","烹调成茶：黄瓜片放器皿内，加精盐、味精、白糖和白醋调匀，腌渍约10分钟。炒勺置灶口上，加花椒油烧热后浇淋在黄瓜上，盖上盖焖约5分钟即可食用。"]},{"i":509,"n":"酒醉冬笋","r":"鲁菜","o":"山东菜巧作指导","f":"色泽：淡黄。口味：咸甜鲜香，酒味醇厚。质感：脆嫩。","c":"热菜","m":["蒸"],"g":["冬笋"],"s":["料酒","白糖","盐","味精","高汤"],"t":["蒸锅"],"v":1,"a":"罐装冬笋500克、白酒25克、白糖25克、精盐2克、味精2克、鸡油25克、鸡汤100克。","p":["初步加工：冬笋削去表皮洗净。","原料成形：冬笋改刀切成长约3.5厘米、宽约0.5厘米的条。","冬笋焯水：冬笋放沸水锅中焯水后，过凉沥水。","烹调成荣：冬笋条放碗内，加入鸡汤、精盐、味精、白酒、白糖、鸡油，用保鲜膜将碗口封严，上屉蒸约10分钟后，取出晾凉沥汁，将冬笋条摆码在器皿内，即可食用。"]},{"i":510,"n":"虾籽冬笋","r":"鲁菜","o":"山东菜巧作指导","f":"色泽：淡黄。口味：咸鲜适中。质感：脆嫩。","c":"热菜","m":["烧扒焖"],"g":["虾","冬笋"],"s":["盐","味精","料酒","白糖","香油","高汤"],"t":["炒锅"],"v":0,"a":"罐装冬笋750克、虾籽3克、精盐1克、味精3克、料酒5克、白糖2克、香油10克、鸡汤250克。","p":["初步加工：冬笋削去表皮洗净。","原料成形：冬笋切成长约5厘米、宽约2厘米、厚约0.5厘米的片。","冬笋焯水：冬笋片放沸水锅中焯水，捞出过凉沥水。","烹调成茶：炒勺置灶口上，添入鸡汤，放入冬笋片、精盐、味精、料酒、白糖，汤汁烧沸后找口，转用小火烧，待汤汁将尽，放入虾籽收浓汤汁，汤汁将尽时淋入香油，将原料翻拌均匀，即可出勺晾凉后装入器皿便可食用。"]},{"i":511,"n":"糖醋素排骨","r":"鲁菜","o":"山东菜巧作指导","f":"色泽：棕红油亮。口味：甜酸适中。质感：软嫩。","c":"热菜","m":["爆炒"],"g":["面筋","山药"],"s":["白糖","醋","盐","高汤","香油","姜"],"t":["炒锅"],"v":1,"a":"生水面筋150克、山药100克、白糖75克、糖色5克、米醋25克、精盐2克、鸡汤200克、香油25克、老姜15克、熟花生油1000克（约耗75克）。","p":["初步加工：山药、老姜刮去表皮洗净。","原料成形：山药切成筷子条”，老姜切片，生水面筋拉成长条状并逐条缠绕在山药条中部（两端各露出约0.5厘米）制成“素排骨”生坯。","烹调成荣：炒勺置灶口上，放入宽油加热，油温升至六七成热时，将“素排骨”入油浸炸至金黄色，捞出沥油。炒勺内留底油放入姜片煸炒出香味后，添入鸡汤、糖色、精盐、白糖，待鸡汤烧沸后，放入“素排骨”、米醋烧，待汤汁渐浓将尽时淋入香油，翻勺使汁均匀地挂在“素排骨”上，出勺晾凉后装入器皿即可食用。"]},{"i":512,"n":"滑炝肉丝","r":"鲁菜","o":"山东菜巧作指导","f":"色泽：肉丝光润色白。味：咸鲜清香。质感：软嫩。","c":"凉菜","m":["烧扒焖"],"g":["猪肉","辣椒","冬笋","萝卜","豆芽","鸡蛋"],"s":["料酒","盐","味精","淀粉","高汤"],"t":["炒锅"],"v":0,"a":"猪通脊肉250克、青椒100克（也可用冬笋、胡萝卜、豆芽等脆性原料）、料酒5克、精盐2克、味精3克、鸡蛋清25克、湿淀粉25克、花椒油15克，熟花生油500克（约耗20克）、鸡汤10克。","p":["初步加工：猪通脊肉弃板筋，青椒去蒂、籽，洗净备用。","原料成形：将通脊肉顺丝切成长约5厘米、约0.3厘米见方的丝状，用清水浸泡去尽血渍，青椒切成同样粗细的丝待用。","肉丝上浆：肉丝用干毛巾掘干表面水分放器皿内，加入精盐、味精和料酒确定好底口搅拌均匀，然后放入湿淀粉、鸡蛋清顺向轻轻搅拌至滋润。","青椒绰水：将青椒丝放沸水锅中焯水，过凉沥水备用。","肉丝滑油：炒勺置灶口上烧热，放入宽油，视油温升至四五成热时，放入上浆的肉丝滑散，视肉丝伸展发白至断生，倒入漏勺沥油。将滑油的肉丝放入温水中漂去油分，捞出沥水放器皿内待用。","烹调成菜：肉丝、青椒丝放碗内，加入精盐、味精、鸡汤，添入烧热的花椒油调拌均匀晾凉即可装入器Ⅲ内食用。"]},{"i":513,"n":"芝麻肉丝","r":"鲁菜","o":"山东菜巧作指导","f":"色泽：颜色棕红。口味：咸甜香微辣。质感：干酥。","c":"热菜","m":["烧扒焖"],"g":["芝麻","猪肉","辣椒"],"s":["酱油","白糖","料酒","盐","味精","葱","姜","八角","辣椒油","桂皮"],"t":["炒锅"],"v":0,"a":"猪通脊肉500克、芝麻25克、酱油15克、白糖75克、料酒15克、精盐2克、味精3克、大葱15克、老姜10克、干辣椒2克、辣椒油10克、大料1克、桂皮3克、清水500克、熟花生油1000克（约耗50克）。","p":["初步加工：猪通脊肉弃板筋，干辣椒去蒂、籽，大葱去根须和老叶留葱白，老姜刮去表皮，洗净备用。","原料成形：猪通脊肉改刀成长约5厘米、约0.5厘米见方的丝。将葱白切成段，干辣椒浸泡稍软后切成节，老姜切片待用。","配荣组合：肉丝、芝麻、葱段、辣椒节和姜片分放在配菜器皿内。","烹调成菜：炒勺置灶口上烧热，用布擦净勺后放入芝麻，炒熟出香味，倒入盘内晾凉。肉丝放碗内，添入酱油拌匀，腌渍入味。炒勺置灶口上烧热，加宽油烧至三四成热时，放入肉丝滑散后沥油，再将油烧至七八成热时，倒入肉丝浸炸并用手勺拨散，视肉丝呈浅棕色，水分驱尽时，倒入漏勺沥油。另起炒勺烧热，放入底油3克，加入白糖25克，用小火将白糖炒成棕红色时，添入清水50克，倒入肉丝烹入料酒，加入精盐翻拌离火。另起炒勺置灶口上烧热，加底油20克烧热后放入葱段、姜片、干辣椒、大料和桂皮煸炒出香味，添入清水、白糖，倒入肉丝，待汤汁烧沸后转用小火烧，视汤汁将尽时用竹筷拣弃葱段、姜片、干辣椒、大料、桂皮不用，随即放入味精和辣椒油收汁，待汤汁收尽撒上熟芝麻翻拌均匀，即可出勺装入器皿，晾凉后即可食用。"]},{"i":514,"n":"蛋皮肉卷","r":"鲁菜","o":"山东菜巧作指导","f":"色泽：黄白相间。口味：咸鲜适口。质感：软嫩。","c":"热菜","m":["蒸"],"g":["鸡蛋","猪肉"],"s":["盐","味精","胡椒","淀粉","葱","姜","香油"],"t":["炒锅","蒸锅"],"v":0,"a":"猪瘦肉750克、鸡蛋黄400克、鸡蛋清50克、精盐5克、味精5克、胡椒粉1克、湿淀粉50克、干淀粉50克、大葱5克、老姜10克、清水75克、香油50克、熟花生油15克。","p":["初步加工：猪瘦肉去筋膜，大葱去老叶留葱白，老姜刮去表皮，洗净备用。","原料成形：猪瘦肉剁成细末，葱白、老姜分别切末。","吊制蛋皮：鸡蛋黄放碗内，加精盐和湿淀粉调和均匀。炒勺置灶口上烧热，用干布沾油在炒勺内涂抹，然后昏鸡蛋黄放炒勺内，摊成薄薄的蛋膜，用微火加热，视蛋膜表面凝固且熟透后即成蛋皮取出。依此方法将剩余的鸡蛋黄全部制成蛋皮。","调制肉馅：猪肉末放碗内，加清水、鸡蛋清、湿淀粉、精盐、味精、胡椒面、香油和葱姜末顺向搅拌至滋润。","卷制蛋卷：另用蛋黄与干淀粉调成蛋糊。用刀将蛋皮从中切开呈半圆形。然后把蛋皮平铺在案板上，将肉馅均匀地涂抹在蛋皮上，卷成直径约3厘米粗细的长卷，用蛋黄糊封口，依此法用蛋皮把其余肉馅全部卷成蛋卷。","蒸制蛋卷：蛋卷平放在器皿内，放蒸锅内上汽蒸约15分钟至熟，然后取出晾凉。顶刀切成厚约0.2厘米的片码放在器Ⅲ内即可食用。"]},{"i":515,"n":"叉烧肉","r":"鲁菜","o":"山东菜巧作指导","f":"色泽：枣红色。口味：以咸为主，略带甜口。质感：酥软。","c":"热菜","m":["烧扒焖"],"g":["猪肉"],"s":["盐","料酒","白糖","酱油","八角","桂皮","花椒","葱","姜","香油"],"t":["炒锅"],"v":0,"a":"猪通脊肉（或猪后腿肉）1000克、精盐6克、料酒10克、白糖50克、酱油50克、桂皮5克、大料8克、花椒2克、大葱50克、老姜50克、清水1000克、香油5克、熟花生油750克（约耗50克)。","p":["初步加工：猪通脊肉弃板筋，大葱去老叶留葱白，老姜刮去表皮，洗净备用。","原料成形：将通脊肉改刀成约10厘米大小的长方块，在肉平整的一面顺纤维纹路上深约0.3厘米、宽约0.5厘米的一字刀纹。葱白切成寸段，姜拍松切块待用。","加工魔制：通脊肉块放器皿内，加入酱油、料酒、精盐、葱段、姜块、花椒、大料和桂皮腌制约60分钟，然后拣出肉块待用。","烹调成菜：灼勺置灶口上，倒入宽油烧热，视油温升至七八成热时，将腌好的肉块入油冲炸至肉外表呈浅棕色，捞出沥油。炒勺内留底油20克，加入白糖10克，用小火将白糖炒至棕红色，添入清水150克，随即加精盐、料酒、酱油、白糖和猪通脊肉块，待汤汁烧沸后，转用小火烧焖约60分钟，待肉熟透入味后将肉块取出放器皿内。再将炒勺置旺火上收浓卤汁，淋入香油，然后再把浓卤汁浇在肉块上晾凉，将肉顶刀切成厚约0.3厘米的片，整齐地码放在器皿内即可食用。"]},{"i":516,"n":"风桂花通脊肉","r":"鲁菜","o":"山东菜巧作指导","f":"色泽：颜色棕红。口味：甜咸醇厚。质感：酥软。","c":"热菜","m":["蒸"],"g":["猪肉"],"s":["桂花酱","盐","白糖","料酒","香油"],"t":["炒锅","蒸锅"],"v":0,"a":"猪通脊肉2500克、桂花酱250克、精盐25克、白糖350克、白酒125克、香油250克。","p":["初步加工：猪通脊肉剔去板筋，洗净备用。","加工腌制：将猪通脊肉放容器内，用桂花酱、精盐、白糖拌匀腌制4天，中途翻拌几次，然后取出通脊肉用绳捆扎挂在阴凉通风处风干，约两个月即可。","烹调成茶：取风干的通脊肉，解去绳洗净。将肉放入器皿内加入白酒，继续腌制约12小时，然后放入蒸锅内蒸约40分钟至熟，取出抹上香油晾凉后，将其顶刀切成厚约0.2厘米的片码放在器皿中即可食用。"]},{"i":517,"n":"水晶肘子","r":"鲁菜","o":"山东菜巧作指导","f":"色泽：光润晶莹，卤冻透明。口味：咸鲜适中，蒜香味浓。质感：肉质酥软。","c":"甜品","m":["蒸"],"g":["猪肉","虾"],"s":["盐","料酒","花椒","味精","醋","葱","姜","蒜","高汤","香油"],"t":["蒸锅"],"v":0,"a":"带皮猪肘子1000克、猪肉皮500克、精盐10克、料酒30克、花椒5克、味精2克、米醋1克、虾油1克、大葱30克、老姜20克、大蒜20克、清水1000克、清汤1500克、香油2克。","p":["初步加工：猪肘子及肉皮刮净表面残毛，大葱去老叶留葱白，大蒜剥去表皮，老姜刮去表皮，均洗净备用。","初步熟处理：猪肘子及肉皮放冷水锅中，加入料酒用小火煮制约1小时，捞出沥水待用。","原料成形：猪肘剔骨，改刀成两块，肉皮切成细丝。大蒜捣成蒜泥。葱白切寸段。老姜分别切片和末。花椒用纱布包好备用。","调对滋汁：取一小碗放入姜末、蒜泥、香油、虾油和米醋调匀，即为滋汁。","烹调成菜：把肘肉放入盆内（皮面朝下），撒上肉皮丝，加入葱段、姜片、花椒袋、料酒、精盐和味精，添入清汤放进蒸，用旺火蒸约2小时，视其酥软，肉皮丝溶化后，拣出葱段、姜片及花椒袋，将肘肉晾凉成冻再改刀切成长约5厘米、宽约3厘米、厚约1厘米的片，码入器皿内，上席时带滋汁蘸食。"]},{"i":518,"n":"酱牛肉","r":"鲁菜","o":"山东菜巧作指导","f":"色泽：酱红色。口味：以咸为主，略有甜味，酱香味浓。质感：酥软。","c":"热菜","m":["爆炒"],"g":["牛肉","猪肉"],"s":["酱油","白糖","盐","味精","料酒","甜面酱","黄酱","八角","桂皮","花椒","葱","姜","香油"],"t":["炒锅"],"v":0,"a":"牛腱子肉5000克、酱油500克、白糖100克、精盐100克、味精20克、料酒100克、甜面酱250克（或用黄酱）、桂皮10克、大料10克、花椒10克、砂仁10克、豆蔻10克、小茴香5克、大葱100克、老姜80克、糖色5克、清水适量、香油50克、熟花生油20克。","p":["初步加工：牛腱子肉去表层筋膜，洗净。大葱去老叶留葱白，老姜刮去表皮，洗净。砂仁和豆蔻拍碎与桂皮、大料、花椒、小茴香一起用纱布包好。","原料成形：牛腱子肉改刀成拳头大小的块。葱切寸段，老姜拍松。","腌溃牛肉：牛肉块放器皿内，加甜面酱、酱油、精盐、葱段、老姜拌和，腌渍约12小时。","烹调成菜：酱锅置灶口上，加底油20克，放入甜面酱炒出香味，添入清水（以清水没过牛肉为准），加入酱油、料酒、白糖、精盐、糖色、肉料袋和牛肉块，用旺火烧沸后，转用小火酱制约3小时左右，待牛肉块完全酥软离火，将牛肉捞出并刷上香油，晾凉后顶刀切成长约4厘米、宽约2厘米、厚约0.2厘米的长方形，整齐地码放在器皿内即可食用。"]},{"i":519,"n":"拌鸡丝","r":"鲁菜","o":"山东菜巧作指导","f":"色泽：鸡丝洁白，滋汁棕红。口味：咸鲜适中。质感：鸡丝软嫩，黄瓜脆嫩。","c":"凉菜","m":[],"g":["鸡肉","猪肉","黄瓜","鸡蛋"],"s":["淀粉","酱油","料酒","醋","盐","香油","味精","姜"],"t":["炒锅"],"v":0,"a":"鸡脯肉250克、水发琼脂50克、黄瓜80克、鸡蛋清10克、湿淀粉20克、·酱油15克、料酒5克、米醋3克、香油2克、精盐1克、味精1克、老姜10克、熟花生油800克（约耗20克）。","p":["初步加工：鸡脯肉去掉筋膜洗净，琼脂漂洗干净，老姜刮去表皮和黄瓜分别洗净。","原料成形：鸡脯肉顺纤维纹路切成长约5厘米、约0.2厘米见方的丝，黄瓜切成丝，琼脂切成长约4厘米的段，老姜切末。","鸡丝上浆：用干毛巾干鸡丝表面水分，放入碗内，加料酒、精盐、味精入底口，再放鸡蛋清、湿淀粉搅拌至滋润。","调对滋汁：将酱油、米醋、香油、姜末放入碗内调和均匀备用。成热时，抖散下入浆好的鸡丝，待鸡丝滑散断生后，倒入漏勺沥油。随即放入温水中漂洗去油渍，捞出沥水置器皿内与琼脂拌匀。另将黄瓜丝置器血中堆好，再将拌匀的鸡丝和琼脂堆放在黄瓜丝上面，浇淋上滋汁即可食用。"]},{"i":520,"n":"麻辣鸡块","r":"鲁菜","o":"山东菜巧作指导","f":"色泽：滋汁棕红，油红光润。口味：麻辣咸鲜微甜。质感：酥软。","c":"热菜","m":["爆炒"],"g":["鸡肉"],"s":["酱油","料酒","味精","白糖","花椒","盐","高汤","葱","辣椒油","姜"],"t":["炒锅"],"v":0,"a":"净鸡1只（约重1000克）、酱油50克、料酒15克、味精2克、白糖15克、花椒面15克、精盐2克、鸡汤800克、花椒油10克、辣椒油15克、大葱20克、老姜10克、熟花生油1000克（约耗50克）。","p":["初步加工：将鸡腹剖开去除内脏，剁去鸡头和爪洗净血污，大葱去老叶留葱白，老姜刮去表皮，洗净。","原料成形：鸡从脊背劈开成两半，改刀成约3厘米见方的块，葱白切寸段，老姜切片。","腌渍鸡块：鸡块放器皿内，加酱油、料酒、精盐拌匀，腌渍入味。","烹调成菜：炒勺置灶口上，倒入宽油烧热，视油温升至六七成热时，放入鸡块浸炸，待鸡块呈金黄色时，倒入漏勺沥油。另起炒勺留底油15克，加葱段、姜片煸炒出香味，烹入料酒、酱油、鸡汤、鸡块、白糖、精盐调好口味，待汤汁烧沸后撇去浮沫，转用小火烧，视鸡块酥软、汤汁将尽时加辣椒油、花椒油、味精、花椒面并用旺火收汁翻拌，待汁将尽盛出鸡块，抹弃葱姜，晾凉后即可装入器皿食用。"]},{"i":521,"n":"水晶鸭","r":"鲁菜","o":"山东菜巧作指导","f":"色泽：鸭肉色白，晶莹透明。口味：咸鲜适中，微酸，蒜香味醇。质感：鸭肉酥软，水晶冻入口即化。","c":"甜品","m":["蒸"],"g":["鸭肉"],"s":["料酒","盐","味精","酱油","醋","香油","葱","姜","蒜"],"t":["蒸锅"],"v":0,"a":"净仔鸭1只（约重1000克）、料酒25克、精盐5克、味精3克、酱油50克、米醋10克、香油10克、水晶汁500克、大葱50克、老姜20克、大蒜15克。","p":["初步加工：鸭子开膛，去除内脏和油脂并洗净血污，大葱去老叶留葱白，老姜刮去表皮，大蒜剥去表皮均洗净。","鸭子熟处理：将鸭子放沸水锅中焯水，然后捞出洗净血污，再置沸水锅中煮约10分钟后，捞出用清水冲洗干净。","原料成形：鸭子从脊骨剖开去骨，再剁成小骨牌块，葱白切成寸段，老姜切片，大蒜捣成蒜泥。","调对滋汁：取酱油、米醋、香油置碗内调匀备用。","烹调成茶：将鸭块有序地码放在大碗内，放葱段、姜片、料酒和水晶汁，然后上屉蒸约40分钟后取出拣弃葱段、姜片，将汤汁入勺内，然后置灶口上加热，汤汁烧沸后撇去浮油沫，加料酒、精盐、味精调好口味，把汤汁过细箩倒入盛鸭块的碗内，晾凉后置冰箱内冷凝，待成冻后将其翻扣在器皿中即成，食时随带滋汁和蒜泥。"]},{"i":522,"n":"茅台鸭卷","r":"鲁菜","o":"山东菜巧作指导","f":"色泽：浅黄。口味：咸鲜适中，酒香味醇。质感：酥软。","c":"热菜","m":["蒸"],"g":["鸭肉","核桃仁"],"s":["料酒","盐","味精","白糖","胡椒","葱","姜","香油"],"t":["炒锅","蒸锅"],"v":0,"a":"净仔鸭1只、茅台酒50克、核桃仁100克、料酒20克、精盐15克、味精5克、白糖3克、胡椒粉2克、大葱50克、老姜20克、香油10克。、","p":["初步加工：鸭子开膛后，去除内脏、膛油，洗净血污，剁去头颈、脚爪（另作它用）。核桃仁放碗内用温水浸泡，剥去外膜，大葱去老叶留葱白，老姜刮去表皮，均洗净。","鸭子成形：从鸭子脊背横划-一刀，然后剔出所有骨骼。核桃仁成小块，葱白切段，老姜拍松切块。","腌渍鸭子：将去骨鸭肉置器皿内，加料酒、精盐、茅台酒、味精、胡椒粉、白糖、葱段、姜块拌匀，加盖腌渍约6小时。","烹调成菜：将腌渍入味的鸭肉拣弃葱段、姜块、皮面朝下平铺在案板上，放上核桃仁，从鸭肉一端卷起，卷成直径约5厘米的圆柱形，用湿纱布包裹紧实后，再用线绳捆扎住。放蒸锅内用大火蒸制约1小时，取出晾凉后解去绳和纱布，刷上香油切成厚约0.3厘米的圆片，码放在器皿内即可食用。"]},{"i":523,"n":"五香鸭子","r":"鲁菜","o":"山东菜巧作指导","f":"色泽：棕红光润。口味：以咸为主，回味略甜，五香味浓。质感：酥软。","c":"热菜","m":["烧扒焖"],"g":["鸭肉"],"s":["酱油","料酒","盐","味精","白糖","八角","花椒","桂皮","葱","姜"],"t":["炒锅"],"v":0,"a":"净鸭1只、酱油50克、料酒100克、精盐15克、味精2克、白糖25克、大料1克、花椒2克、桂皮8克、丁香1克、茴香1克、清水2000克、大葱20克、老姜15克、熟花生油1000克（约耗70克）。","p":["初步加工：鸭子开膛，去除内脏和油脂并洗净。大葱去老叶，老姜刮去表皮，洗净。花椒、桂皮、丁香、茴香装纱布袋中。","原料成形：鸭子剁去头颈和爪（另作它用），从脊背劈开成两半。葱切成寸段，老姜切片。","腌溃鸭子：鸭子置器皿中，加料酒、精盐、酱油、葱段、姜片拌匀，腌渍约12小时后拣弃葱段、姜片。","烹调成荣：炒勺置灶口上，倒入宽油加热，视油温升至七八成热时，下入腌渍入味的鸭子浸炸，视其表面呈金黄色时，捞出沥油。另起酱锅置灶口上，放入清水、白糖、精盐、酱油、料酒、香料袋、葱段、姜片和鸭子，汤汁烧沸后调好口味，转用小火烧制约50分钟，捞出鸭子沥水置器皿内，抹弃葱段、姜片和香料袋。用旺火将汤汁烧沸·加入味精收汁，待汤汁变浓后浇在鸭身上，待晾凉后去鸭骨，将鸭肉改刀成块码入器皿内即可食用。"]},{"i":524,"n":"茄汁鸭子","r":"鲁菜","o":"山东菜巧作指导","f":"色泽：粉红色。口味：甜酸适口。质感：酥软。","c":"热菜","m":["爆炒"],"g":["鸭肉","西红柿"],"s":["料酒","醋","盐","白糖","香油","葱","姜"],"t":["炒锅"],"v":0,"a":"净鸭1只、番茄酱40克、料酒50克、米醋10克、精盐3克、白糖100克、香油50克、大葱25克、老姜10克、清水1000克、熟花生油1000克（约耗80克）。","p":["初步加工：鸭子开膛后，去除内脏和油脂，洗净血污。大葱去老叶留葱白，老姜刮去表皮，洗净。葱白分别切成寸段和葱末。老姜分别切成片和姜米。","腌渍鸭子：鸭子放器血内，加料酒、精盐、葱段、姜片腌渍约6小时入味后，拣弃葱段、姜片。","烹调成菜：炒勺置灶口上，倒入宽油加热，视油温升至七八成热时，下入腌渍入味的鸭子浸炸，待其表面呈浅黄色时捞出沥油。另起炒勺置灶口上，放底油10克，下葱末、姜米煸炒出香味时，放番茄酱煸炒，随即加清水、精盐、白糖和鸭子，待汤汁烧沸后转用小火烧制约1小时，待鸭肉酥软入味后捞出。勺内汤汁添入米醋，用中火收浓汤汁，淋入香油，浇在鸭身上，晾凉后去骨，鸭肉改刀成块放入器血内即可食用。"]},{"i":525,"n":"葱辣鸭块","r":"鲁菜","o":"山东菜巧作指导","f":"色泽：金黄。口味：咸鲜香辣，葱味浓郁。质感：酥软。","c":"热菜","m":["爆炒"],"g":["鸭肉","辣椒"],"s":["葱","酱油","料酒","盐","味精","白糖","香油","高汤","姜"],"t":["炒锅"],"v":0,"a":"净鸭1只、酱油20克、料酒75克、精盐8克、味精5克、白糖2克、干辣椒3克、香油50克、鸡汤1500克、大葱100克、老姜50克、熟花生油1500（约耗100克）。","p":["初步加工：鸭子开膛，去除内脏和油脂，洗净血污。干辣椒去蒂和籽，大葱去老叶留葱白，老姜刮去表皮，均洗净。","原料成形：鸭子去头颈、翅膀及脚爪，剔去胸骨（均另作它用)。鸭肉改刀成长约5厘米、宽约2厘米的长条块。葱白切寸段，老姜切片。","腌渍鸭块：鸭块置器血内，加料酒、精盐、酱油、葱段、姜片腌渍约45分钟入味，拣弃葱段、姜片。","烹调成菜：炒勺置灶口上，倒入宽油加热，视油温升至六七成热时，放入鸭块浸炸，视其表面硬结呈金黄色时，倒入漏勺沥油。另起炒勺放入香油加热，加干辣椒煸炒出香辣味时，加葱段、姜片煸出葱香味，添入鸡汤、料酒、酱油、精盐、味精、白糖，待汤汁烧沸后调好颜色和口味，撇去浮沫，转用小火烧煤约40分钟，待肉质酥软汤汁稠浓时即可出勺。拣弃葱段、姜片、干辣椒，鸭块晾凉后码放在器皿内即可食用。"]},{"i":526,"n":"红花鸭子","r":"鲁菜","o":"山东菜巧作指导","f":"色泽：滋汁红润。味：咸鲜微甜。质感：酥软。","c":"热菜","m":["爆炒"],"g":["鸭肉"],"s":["盐","味精","料酒","白糖","姜","葱","香油"],"t":["炒锅"],"v":0,"a":"净鸭1只、藏红花15克、精盐15克、味精5克、料酒30克、白糖50克、清水2000克、老姜20克、大葱25克、香油25克、熟花生油1500克（约耗50克）。","p":["初步加工：鸭子开膛，去除内脏和油脂，洗净血污，剁去头颈、脚爪（另作它用）。大葱去老叶，老姜刮去表皮，洗净后拍松。藏红花用少量清水稍煮红后，过箩滤出红汁倒入碗内。","腌渍鸭子：鸭子放盆内，加料酒、精盐涂抹在鸭身上，放葱姜腌渍约50分钟入味后，掠弃葱姜。","烹调成菜：炒勺置灶口上，倒入宽油加热，视油温升至七八成热时，将腌渍入味的鸭子入油浸炸，待其表面硬结并呈金黄色时，倒入漏勺沥油。另起炒勺置灶口上，放入底油，下葱、姜煸炒出香味，烹入料酒，添入清水、味精、精盐、白糖、红花汁和鸭子，待汤汁烧沸调好口味，转用小火烧至肉质软烂，汤汁将尽时，用大火将汤汁收浓，再将鸭子取出，拣弃葱、姜，在鸭体表面涂抹香油，晾凉后去骨，鸭肉改刀成指条状装入器皿内即可食用。"]},{"i":527,"n":"芥末鸭掌","r":"鲁菜","o":"山东菜巧作指导","f":"色泽：浅黄。口味：咸辛辣微酸。质感：脆嫩。","c":"热菜","m":["烧扒焖"],"g":["鸭肉"],"s":["盐","味精","醋","白糖","葱","姜","香油"],"t":["炒锅"],"v":0,"a":"鲜鸭掌20只、精盐1克、味精2克、芥末10克、米醋5克、白糖1克、大葱15克、老姜5克、香油2克。","p":["初步加工：鲜鸭掌去爪尖，大葱去老叶留葱白，老姜刮去表皮，洗净。","原料成形：葱白切成寸段，老姜拍松切成块。","调对滋汁：芥末放碗内，加适量温开水调邂成糊状。加盖焖制约10分钟，放米醋、精盐、味精、香油、白糖、清汤调兑成芥末汁。","烹调成茶：鸭掌放沸水锅中，加葱段、姜块烧沸后撇去浮沫，转用小火煮制，待鸭掌断生，捞出过凉去尽掌骨，洗净沥水，有序地码放在器皿内，浇上芥末汁即可拌食。"]},{"i":528,"n":"五香鱼","r":"鲁菜","o":"山东菜巧作指导","f":"色泽：棕红。口味：咸鲜回甜，五香味浓郁。质感：酥软。","c":"热菜","m":["爆炒"],"g":["鱼肉","鲤鱼"],"s":["酱油","料酒","醋","盐","味精","白糖","花椒","葱","姜","香油"],"t":["炒锅"],"v":0,"a":"活鲤鱼2尾（约重2000克）、酱油50克、料酒50克、米醋10克、精盐10克、味精5克、白糖50克、五香粉15克、花椒1克、大葱50克、老姜45克、清水1000克、香油25克、熟花生油1500克（约耗50克）。","p":["初步加工：鱼刮去鳞片，去鱼鳃，开膛去内脏洗净，大葱去老叶留葱白，老姜刮去表皮，洗净。","原料成形：鱼去头、尾及脊骨（另作它用），改刀成瓦块形。葱白、老姜拍松。","腌溃鱼块：鱼块放器血内，加料酒、酱油、精盐、花椒、葱、姜拌匀，腌渍约6小时入味后，拣弃葱、姜和花椒。","烹调成荣：炒勺置灶口上，倒入宽油加热，视油温升至七八成热时，将鱼块入油浸炸至呈金黄色时捞出沥油。另起炒勺放底油加热，放葱姜煸炒出香味，加清水、酱油、料酒、味精、白糖、精盐、米醋和炸好的鱼块，汤汁烧沸后调好颜色和口味，转用小火煤约45分钟后（汤汁剩1/3），将鱼块捞出沥汁（弃葱姜）放器皿内，另将五香粉放入原汤内用大火收汁，淋入香油，再把汤汁浇在鱼块上。晾凉后将鱼块有序地码放在器皿内即可食用。"]},{"i":529,"n":"葱椒鱼条","r":"鲁菜","o":"山东菜巧作指导","f":"色泽：棕黄。口味：咸鲜适中，葱椒味浓。质感：酥软。","c":"热菜","m":["爆炒"],"g":["鱼肉","青鱼"],"s":["葱","花椒","料酒","白糖","盐","味精","姜","香油"],"t":["炒锅"],"v":0,"a":"活青鱼1尾（约重1000克）、葱椒10克、料酒40克、糖色10克、精盐5克、味精5克、大葱25克、老姜15克、香油15克、清水500克、熟花生油1000克（约耗50克）。","p":["初步加工：活青鱼刮鳞、去鳃，开膛去内脏洗净，大葱去老叶留葱白，老姜刮去表皮，洗净。","原料成形：鱼去头、尾及脊骨（另作它用），鱼肉片厚片切成指条。葱白切寸段。老姜拍松切块。","腌溃鱼条：鱼条放器皿内，加精盐、料酒、葱段、姜块腌渍约30分钟入味后，抹弃葱段、姜块。","烹调成茶：炒勺置灶口上，倒入宽油加热，视油温升至六七成热时，将鱼条入油浸炸至呈金黄色，倒入漏勺沥油。另起炒勺放底油加热，加葱段、姜块煸炒出香味，烹入料酒，加清水、糖色、精盐、味精，待汤汁烧沸后调好口味和颜色，放入鱼条转用小火烧，视汤汁将尽时，拣弃葱段、姜块，用中火收浓汤汁，再放入葱椒，淋入香油翻勺，视汤汁油亮时出勺，晾凉后装入器皿即可食用。"]},{"i":530,"n":"紫菜虾卷","r":"鲁菜","o":"山东菜巧作指导","f":"色泽：黑白交映。口味：咸鲜适中。质感：软嫩。","c":"热菜","m":["蒸"],"g":["虾","猪肉","鸡蛋"],"s":["盐","味精","淀粉","胡椒","葱","姜","香油"],"t":["蒸锅"],"v":0,"a":"鲜虾仁300克、猪肥膘100克、紫菜5张、精盐2克、味精2克、鸡蛋清50克、湿淀粉30克、胡椒粉1克、大葱10克、老姜5克、香油15克。","p":["初步加工：虾仁挑去虾线洗净，大葱去老叶洗净留葱白，老姜刮去表皮洗净。","原料成形：虾仁、肥膘分别砸成茸泥状。葱白、老姜拍松，放碗内加清水浸泡成葱姜水。","调制馅心：虾肉茸泥放碗内，加少量清水邂开，掺入肥膘茸泥搅拌，再加葱椒水、精盐、味精、胡椒粉调拌，确定底口后，放入湿淀粉、鸡蛋清顺向搅拌至滋润。","卷制成形：紫菜逐张平铺在木案上，将虾肉馅均匀平铺涂抹在紫菜上面，再从一端卷起，卷成直径约4厘米的椭圆形长卷，再用洁净的纱布包卷好，待用。5。烹调成菜：将卷成的紫菜虾卷上屉用中火蒸约10分钟，熟后取出晾凉，解开纱布，在虾卷表面涂抹上少许香油，改刀成厚约0.3厘米的椭圆形片，有序地码放在器皿内即可食用。"]},{"i":531,"n":"麻酱三鲜","r":"鲁菜","o":"山东菜巧作指导","f":"色泽：红、黄、黑三色相间。口味：咸鲜适中，麻酱味浓。质感：软、脆、嫩兼备。","c":"热菜","m":[],"g":["海参","虾","猪肉","冬笋"],"s":["芝麻酱","盐","味精","白糖","姜","香油"],"t":["炒锅"],"v":0,"a":"水发海参100克、青虾肉100克、罐装冬笋尖100克、麻酱50克、精盐3克、味精2克、白糖2克、老姜5克、香油5克。","p":["初步加工：海参去尽泥沙，洗净污物。青虾挑去虾线，老姜刮去表皮，洗净。","原料成形：青虾肉、海参均改刀成抹刀片。冬笋切成象眼片。老姜切成末状。","调对滋汁：麻酱放碗内，加入少量凉开水邂开，然后放精盐、味精、香油、白糖、姜末调匀成麻酱滋汁。","烹调成荣：海参片、虾片、冬笋片分别放沸水锅","中余熟，捞出沥水，倒入器皿内，浇上滋汁拌食即成。"]},{"i":532,"n":"滑炒肉片","r":"鲁菜","o":"山东菜巧作指导","f":"色泽：芡汁棕红。芡汁：利汁抱芡。口味：咸鲜。质感：软嫩。","c":"热菜","m":["爆炒"],"g":["猪肉","木耳","冬笋","鸡蛋"],"s":["酱油","料酒","盐","味精","葱","姜","高汤","淀粉"],"t":["炒锅"],"v":0,"a":"主料：瘦猪肉200克。｜配料：水发木耳30克、冬笋50克。｜调料：酱油10克、料酒5克，精盐1克、味精1克、大葱10克、老姜5克、毛汤40克、湿淀粉15克、水淀粉15克、鸡蛋液20克、熟花生油600克（约耗50克）。","p":["初步加工：选新鲜瘦肉，去净表面筋膜，大葱择去老叶取葱白，老姜刮去表皮，大蒜剥表皮与木耳均洗净。","原料成形：猪肉顶刀切成长约4厘米、宽约3厘米、厚约0.2厘米的片。葱白切成豆瓣葱，老姜拍碎沏成姜水。冬笋顺丝切成薄厚和大小似肉片的片。木耳撕成大小均匀的小朵。","主料上浆：肉片放碗中，加入酱油、料酒、精盐、味精，确定好“底口”，搅拌均匀。再放入鸡蛋液、湿淀粉搅拌至“吃浆上劲\"。","配菜组合：肉片、冬笋片、木耳、豆瓣葱分别放配菜器皿内。","冬笋焯水：冬笋片放沸水锅中焯水，捞出过凉并沥水。","调对碗芡：将酱油、料酒、精盐、味精、毛汤、豆瓣葱及姜水放碗中，加入水淀粉调成碗芡。","烹调成菜：炒勺烧热放入宽油，视油温升至三四成热时，放入浆好的肉片滑散，然后下入笋片一起加热，木耳放漏勺中，视主料断生后，把肉片、笋片连同油一起倒入漏勺中沥净油。将过油的肉片、冬笋片及木耳倒回炒勺，随即倾入碗芡，用旺火迅速翻炒，视芡汁熟透发亮并均匀包裹住原料后，淋少许明油即可出勺。","成品装盘：菜肴采用“盛入法”装入器皿，呈堆落状。"]},{"i":533,"n":"滑溜肉片","r":"鲁菜","o":"山东菜巧作指导","f":"色泽：芡汁洁白。芡汁：溜芡@。味：咸鲜。质感：主料软嫩，配料脆嫩。","c":"热菜","m":["烧扒焖"],"g":["猪肉","冬笋","鸡蛋"],"s":["料酒","盐","味精","葱","姜","高汤","淀粉"],"t":["炒锅"],"v":0,"a":"主料：猪通脊肉200克。｜配料：冬笋50克。｜调料：料酒5克、精盐2克、味精1克、大葱10克、老姜6克、清汤70克、湿淀粉10克、水淀粉10克。鸡蛋清40克、大油750克（约耗50克）。","p":["初步加工：新鲜猪通脊肉去净板筋。大葱择去老叶，老姜刮去表皮，均洗净。","原料成形：肉顶刀切成长约4.5厘米，宽约3厘米，厚约0.2厘米的片。葱白切豆瓣葱。姜用刀拍松，用沸水沏成姜水。冬笋顺丝切成略小于肉片的片。","主料上浆：肉片用清水漂净血污，捞出挤水后放碗中，加入精盐、味精、料酒确定好“底口\"搅拌均匀，再放入蛋清、湿淀粉，顺向搅拌至“吃浆上劲\"。","配荣组合：肉片、冬笋片、豆瓣葱，分别放配菜器皿中。","冬笋绰水：冬笋片放沸水锅中焯水，捞出过凉并沥水。","调对碗芡：料酒、精盐、味精、清汤、水淀粉、豆瓣葱、姜水放碗中，调成碗芡。","烹调成荣：炒勺置中火上烧热，放入宽油，视油温升至三四成热时，放入浆好的肉片滑散，然后下入笋片一起加热，视主料断生后，将肉片、笋片倒回炒勺中，随即倾入碗芡翻炒，视芡汁熟透发亮并均匀包裹住原料后，淋入明油即可出勺。","成品装盘：菜肴采用“盛入法”盛入器皿，呈自然流邂状。"]},{"i":534,"n":"番茄肉片","r":"鲁菜","o":"山东菜巧作指导","f":"色泽：芡汁粉红。芡汁：溜芡の。口味：甜酸。感：主料软嫩，配料脆嫩。","c":"热菜","m":["爆炒"],"g":["西红柿","猪肉","荸荠","鸡蛋"],"s":["料酒","盐","味精","白糖","淀粉","葱","姜"],"t":["炒锅"],"v":0,"a":"主料：猪通脊肉200克。｜配料：荸荠50克。｜调料：料酒7克、精盐2克、味精0.5克、白糖15克、湿淀粉10克、水淀粉15克、鸡蛋清40克、番茄酱15克、大葱15克、老姜15克、熟花生油750克（约耗50克）。","p":["初步加工：新鲜猪通脊肉去净板筋及筋膜。大葱择去老叶取葱白，老姜刮去表皮，洗净。","原料成形：荸荠片成厚约0.2厘米的圆片，肉顶刀切成长约4厘米、宽约3厘米、厚约0.2厘米的片。葱白用刀拍松切寸段。姜切大薄片。葱、姜放碗中，加清水50克制葱姜水。","主料上浆：肉片用清水漂洗去净血污后，挤净水分，加入精盐、味精、料酒，确定好“底口\"搅拌均匀，再放入蛋清、湿淀粉，顺向搅拌至“吃浆上劲\"。","配菜组合：肉片、荸荠片分别放配菜器皿中。","调对碗芡：番茄酱、白糖、料酒、精盐、葱姜水、水淀粉放碗中调成碗芡。","烹调成菜：炒勺烧热后放入宽油，视油温升至三四成热时，放入浆好的肉片滑散，随即放入荸荠片，视肉片发白断生后，把肉片、荸荠片连同油一起倒入漏勺沥油。炒勺留少量底油，倒入碗芡，视芡汁熟透发亮，下入肉片及荸荠片翻炒，待芡汁均匀包裹住原料后淋入明油即成。：·.7.成品装盘：菜肴采用“盛入法”装入器皿，呈自然流邂状。"]},{"i":535,"n":"焦溜肉片","r":"鲁菜","o":"山东菜巧作指导","f":"色泽：芡汁棕黄。芡汁：溜芡。口味：咸鲜。质感：外焦里嫩。","c":"热菜","m":["烧扒焖"],"g":["猪肉"],"s":["酱油","料酒","醋","盐","味精","葱","姜","蒜","淀粉","高汤"],"t":["炒锅"],"v":0,"a":"主料：猪硬五花肉150克。｜配料：此菜无｜配料：，可酌加点缀装饰料。｜调料：酱油7克、料酒10克、米醋7克、精盐2克、味精1克、大葱7克、毛姜水10克、大蒜5克、水淀粉20克、湿淀粉100克、毛汤40克、熟花生油700克（约耗50克）。","p":["初步加工：选肥三瘦七的猪硬五花肉洗净，大葱择去老叶取葱白，大蒜剥去表皮，洗净。","原料成形：猪肉顶刀切成长约3.5厘米、宽约2.5厘米、厚约0.3厘米的片。葱白切成眉毛葱，蒜切成片。","主料挂糊：肉片放碗内，加入精盐、味精、料酒，确定好“底口”搅拌均匀，再加入湿淀粉搅拌，使肉片均匀挂上湿淀粉。","配菜组合：挂糊的肉片、眉毛葱、蒜片分别放配菜器血中。","调对碗芡：酱油、料酒、米醋、精盐、味精、毛姜水、眉毛葱、蒜片、水淀粉、毛汤放碗中，调成碗芡。","烹调成菜：炒勺置火上烧热，加宽油烧至六七成热时，将肉片逐一入勺浸炸，随后将油勺移小火上，浸炸至断生，用漏勺捞出。油勺重新移中火上，待油温升到七八成热时，迅速下入肉片冲炸。待肉片表面呈浅黄色且酥脆后，连同油一起倒入漏勺沥油。炒勺置中火上，倒入碗芡，待芡汁稠浓发亮后，迅速倒入肉片翻炒待芡汁均匀包裹住主料后，淋入明油即可出勺。","成品装盘：菜肴采用“盛入法”装入器皿呈堆落状。"]},{"i":536,"n":"糖醋肉片","r":"鲁菜","o":"山东菜巧作指导","f":"色泽：芡汁棕黄。芡汁：溜芡。口味：甜酸。质感：外焦里嫩。","c":"热菜","m":["爆炒"],"g":["猪肉"],"s":["白糖","醋","酱油","料酒","盐","葱","姜","蒜","淀粉","高汤"],"t":["炒锅"],"v":0,"a":"主料：猪肉200克。｜配料：此菜无｜配料：，可酌加点缀装饰料。｜调料：酱油7克、料酒10克、米醋15克、精盐1克、白糖20克、大葱10克、老姜5克、大蒜8克、水淀粉20克、湿淀粉100克、毛汤30克、熟花生油700克（约耗50克）。","p":["初步加工：选肥三瘦七的去皮猪肉刮洗干净。大葱择去老叶取葱白，老姜刮去表皮，大蒜剥去表皮，洗净。","原料成形：猪肉顶刀切成长约3.5厘米、宽约2.5厘米、厚约0.3厘米的片。葱姜蒜分别切成末。","主料挂糊：肉片放碗内，加入精盐、料酒，确定好“底口\"搅拌均匀，再加入湿淀粉使其均匀包裹住肉片。","配荣组合：肉片、葱姜蒜末分别放配菜器皿中。","调对碗芡：酱油、料酒、米醋、精盐、白糖、毛汤、水淀粉放碗中，调成碗芡。","烹调成菜：炒勺置火上烧热，加宽油烧至六七成热时，将肉片逐一入油浸炸，随后将勺移小火上，用温油将肉片浸炸至断生捞出。炒勺重新移中火上，待油温升至七八成热时，迅速下入肉片冲炸。待肉片表面呈金黄色且酥脆后，连同油一起倒入漏勺沥油。炒勺置旺火上，加底油倒入葱姜蒜末炒出香味，随即倒入碗芡，待芡汁稠浓发亮后，迅速倒入肉片翻炒，使芡汁均匀包裹主料后，淋入明油即可出勺。","成品装盘：菜肴采用“扣入法”盛入器皿，呈堆落状。"]},{"i":537,"n":"花棍里脊","r":"鲁菜","o":"山东菜巧作指导","f":"色泽：芡汁洁白，主、配料白、黄、红、绿、褐各色相间。芡汁：利汁抱芡。口味：咸鲜。质感：主料软嫩、配料脆嫩。","c":"热菜","m":["爆炒"],"g":["猪肉","冬笋","香菇","鸡蛋"],"s":["盐","味精","料酒","淀粉","高汤","姜"],"t":["炒锅"],"v":0,"a":"主料：猪里脊肉250克。｜配料：罐装冬笋25克、红柿子椒25克、绿柿子椒25克、水发冬菇25克。｜调料：精盐3克、味精3克、料酒10克、干淀粉10克、水淀粉20克、清汤75克、鸡蛋清50克、老姜25克、葱姜油10.克、熟花生油1000克（约耗25克）。","p":["初步加工：选新鲜里脊肉，去净表面筋膜，柿子椒去蒂、籽，水发冬菇去蒂，冬笋去表皮，老姜刮去表皮均洗净。","原料成形：将里脊肉切成约5厘米长、3厘米宽、0.2厘米厚的片，冬笋、红绿柿子椒、水发冬菇均切成约5厘米长、0.2厘米见方的丝，老姜用刀拍松后置碗内加水浸泡成毛姜水待用。","肉片上浆：将里脊片置碗内用清水漂洗后，控尽水分，加料酒、精盐、味精确定好底口，再放入干淀粉、鸡蛋清，搅拌至吃浆上劲の。","配菜组合：将冬笋丝、柿子椒丝、冬菇丝分别放在浆好的里脊片上，顺长从其一端卷起成卷，按此方法一片卷一丝，将其余原料均卷成卷，即为“花棍里脊”的半成品。将其放置配菜器皿内待用。","调对碗芡：把料酒、毛姜水、清汤、精盐、味精、水淀粉放碗内，调成碗芡备用。","烹调成茶：将炒勺置灶口上加热，勺内注入宽油，视油温升至四五成热时，将里脊卷入油滑至断生，并倒入漏勺沥尽油分。勺内留底油，里脊卷回勺随即倾入碗芡，用旺火翻炒，待芡汁熟透发亮并均匀包裹住原料后，淋入葱姜油翻炒片刻即可出勺。","成品装盘：菜肴采用“盛入法”装入器皿，呈堆落状。"]},{"i":538,"n":"炒腰果里脊","r":"鲁菜","o":"山东菜巧作指导","f":"色泽：芡汁浅棕红色。芡汁：利汁抱芡。口昧：咸鲜。质感：主料软嫩，配料酥脆。","c":"热菜","m":["爆炒"],"g":["猪腰","猪肉","鸡蛋"],"s":["盐","味精","料酒","酱油","淀粉","葱","高汤","姜","香油"],"t":["炒锅"],"v":0,"a":"主料：猪里脊肉250克。｜配料：腰果100克。｜调料：精盐2克、味精2克、酱油7克、料酒10克、鸡蛋液50克、湿淀粉10克、水淀粉15克、清汤100克、大葱15克、老姜10克、香油10克、熟花生油1000克（约耗75克）。","p":["初步加工：选新鲜里脊肉，去净表面筋膜，大葱去根须、老叶留葱白，老姜刮去表皮均洗净。","原料成形：将里脊肉改刀成约5厘米长、3厘米宽、0.2厘米厚的片，葱白切成豆瓣葱，老姜用刀拍松后置碗内加水浸泡成毛姜水待用。","配料熟处理：将炒勺置灶口上加热，注入宽油，视油温升至五六成热时，放入腰果，将其炸呈浅金黄色，质酥脆时，倒入漏勺内沥油。","主料上浆：将里脊片置碗内用清水漂洗后，控尽水分，加酱油、料酒、精盐、味精确定好底口，再放入湿淀粉、鸡蛋液，搅拌至吃浆上劲。","配茶组合：将炸好的腰果放在浆好的里脊片上，颐长从其一端卷起成卷，一片卷一粒腰果，依此法将其余原料均卷成卷状待用。","调对碗芡：将酱油、料酒、毛姜水、清汤、精盐、味精、水淀粉、豆瓣葱放碗内，调成碗芡。","烹调成菜：将炒勺置灶口上，注入宽油加热，待油温升至四五成热时，把里脊卷入油滑至断生后，倒入漏勺沥尽油分。勺内留底油，倒入滑好的里脊卷，随即倾入碗芡用旺火翻炒，待芡汁熟透发亮并均匀包裹住原料后，淋入香油翻炒片刻即可出勺。","成品装盘：菜肴采用“盛入法”装入器皿，呈堆落状。"]},{"i":539,"n":"挂霜酥肉","r":"鲁菜","o":"山东菜巧作指导","f":"色泽：白里泛黄。芡汁：无汁无芡。口味：香甜。质感：酥脆。","c":"热菜","m":["炸"],"g":["猪肉","鸡蛋","面粉"],"s":["白糖"],"t":["炒锅"],"v":0,"a":"主料：猪肥膘肉50克。｜配料：此菜无｜配料：，可酌加点缀装饰料。｜调料：白糖150克、鸡蛋黄50克、熟花生油750克（约耗50克）、面粉80克、大油10克。","p":["初步加工：猪肥腰肉去皮刮洗干净。","原料成形：肥膘肉切成长约3.5厘米、宽约2.5厘米、厚约0.2厘米的片。","调制油酥糊：将面粉、鸡蛋黄、大油放碗内调成稠油酥糊。","主料挂糊：肉片用面粉逐一沾匀，放油酥糊中搅拌均匀。","烹调成荣：炒勺置火上烧热，放宽油烧至三四成热时，将挂匀糊的肉片逐一入油浸炸定型后，转用七八成热的油温冲炸至炸透、炸酥，肉片连油一起倒入漏勺沥油。炒勺涮净后置火上，加入清水20克及白糖，用小火炒至粘稠，表面有大量的小气泡时，将肉片倒入炒勺翻动，视肉片挂匀糖浆起霜，即可出勺装盘。","成品装盘：将挂霜后的肉片逐一码入器皿中。"]},{"i":540,"n":"滑炒肉丝","r":"鲁菜","o":"山东菜巧作指导","f":"色泽：洁白。芡汁：利汁抱芡口味：咸鲜。质感：主料软嫩，配料脆嫩。","c":"热菜","m":["爆炒"],"g":["猪肉","冬笋","鸡蛋"],"s":["料酒","盐","味精","葱","姜","淀粉","高汤"],"t":["炒锅"],"v":0,"a":"主料：猪通脊150克。｜配料：冬笋50克。｜调料：料酒5克、精盐3克、味精1克、大葱15克、老姜10克、湿淀粉10克、水淀粉10克、鸡蛋清40克、清汤20克、大油：500克：（约耗40克）。","p":["初步加工：新鲜猪通脊肉去净板筋及筋膜，大葱择去老叶，老姜刮去表皮洗净。.2.原料成形：肉顺丝切成长约5厘米、约0.3厘米见方的丝，冬笋顺丝切成长约4厘米、约0:2厘米见方的丝，葱姜用刀拍松并将葱切成段，放碗中用凉清汤浸泡成葱姜水。","主料上浆：肉丝放碗内，加入精盐、味精，料酒确定好“底口”搅拌均匀，放入蛋清、湿淀粉，顺向搅拌至“吃浆上劲\"","配荣组合：肉丝、冬笋丝，分别放配菜器皿内。","调对碗芡：从盛有清汤的碗中，捞出葱姜不用，加入精盐、料酒、味精、水淀粉调成碗芡。","烹调成菜：炒勺烧热后放入宽油，视油温升至三四成热:74*时，放入浆好的肉丝滑散，倒人笋丝一起加热。视主料断生后，把肉丝、笋丝同油一起倒入漏勺沥油。将沥油的肉丝、笋丝倒回炒勺，随即倾入碗芡，用旺火迅速翻炒，淋入少许明油即可出勺。","成品装盘：菜肴采用“盛入法”装入器皿，呈堆落状。"]},{"i":541,"n":"荒爆肉丝","r":"鲁菜","o":"山东菜巧作指导","f":"色泽：肉丝洁白，香菜碧绿。灵汁：有少许清汁，不用勾芡。口味：咸鲜。质感：主料软嫩，配料脆嫩。","c":"热菜","m":["爆炒"],"g":["猪肉","鸡蛋"],"s":["香菜","料酒","醋","盐","味精","胡椒","葱","姜","蒜","淀粉","香油","高汤"],"t":["炒锅"],"v":0,"a":"主料：猪通脊肉200克。｜配料：香菜50克。｜调料：料酒10克、米醋5克、精盐2克、味精1克、胡椒粉0.5克、大葱15克、老姜10克、大蒜10克、湿淀粉20克、香油2克、清汤30克、鸡蛋清30克、大油750克（约耗40克）。","p":["初步加工：新鲜猪通脊肉去净板筋及筋膜，大葱择去老叶，老姜刮去表皮，大蒜剥去表皮，香菜择去大叶、老叶并洗净。","原料成形：肉顺丝切成长约5厘米、约0.3厘米见方的丝，香莱切成长约3厘米的段，葱白切成眉毛葱，大蒜切片，老姜放碗中捶茸后挤出姜汁放小碗中。","主料上浆：肉丝放碗中，加入精盐、味精、料酒，确定好“底口”搅拌均匀，放入蛋清、湿淀粉顺向搅拌滋润。","配荣组合：肉丝、香菜、眉毛葱、蒜片，分别放配菜器皿中，姜汁放在小碗中。","调对碗汁：清汤、精盐、料酒、米醋、胡椒粉、姜汁放碗内，调成碗汁。再将香菜段、眉毛葱、蒜片一并放碗中。","烹调成茶：炒勺烧热后放入宽油，视油温升至三四成热@时，放入浆好的肉丝滑散，肉丝断生后，同油一起倒入漏勺沥油，勺回火重新烧热，肉丝倒入炒勺中，随即倒入碗汁，用旺火迅速翻炒，淋入香油即可出勺。","成品装盘：菜肴采用“盛入法”装入器皿，呈堆落状。"]},{"i":542,"n":"炒肉丝拉皮（做法二）","r":"鲁菜","o":"山东菜巧作指导","f":"色泽：金黄色。芡汁：不用勾芡，略有汤汁。口味：咸鲜适中，蒜味浓郁。质感：软嫩。","c":"凉菜","m":["爆炒"],"g":["猪肉","粉丝粉皮"],"s":["淀粉","酱油","料酒","盐","味精","葱","香油","蒜","姜"],"t":["炒锅"],"v":0,"a":"主料：肥瘦猪肉150克、绿豆淀粉600克。｜配料：此菜无｜配料：、可酌加点缀装饰料。｜调料：酱油15克、料酒10克、芥末粉20克、精盐2克、味精3克、香油5克、大葱15克、大蒜15克、老姜10克、熟花生油50克。","p":["初步加工：选肥瘦适度的猪肉去皮、筋膜洗净。芥末粉放碗内，倒入沸水调匀，加盖焖约10分钟。绿豆淀粉加清水调匀呈稀糊状，待用。大葱去叶留葱白，大蒜剥去表皮，老姜刮净表皮均洗净，老姜用刀拍松后置碗内加水浸泡成毛姜水待用。","原料成形：将肥瘦肉顺丝切成约5厘米长、约0.3厘米见方的丝状，葱白切丝，蒜斩成茸状。","旋制粉皮：汤勺置旺火上加入清水烧沸，将调湃好的水淀粉分数次倒入铜旋子内，放在沸水上面，用手转动旋子，再稍停反复数次，视粉皮成熟将旋子倾斜，使勺中的沸水流入旋子内，略烫一下旋子内已凝结的粉皮，再将沸水倒出，取出旋子放凉清水中浸凉，然后揭下粉皮，切成宽约0.5厘米的条状，放入清水中即可。","粉皮焯水：炒勺置旺火上放入沸水倒入粉皮，视粉皮呈半透明状时，倒入漏勺内控尽水分即可。","烹调成茶：炒勺置旺火上，放入底油，油热后加葱丝煸出香味，再下入肉丝煸炒至断生，添入毛姜水、料酒、酱油、精盐、味精，再放入蒜茸翻炒，放入粉皮翻拌均匀，淋入香油即成。","成品装盘：菜肴采用：盛入法”装入器皿，使菜肴呈自然堆落状。食时拌入芥末糊。"]},{"i":543,"n":"樱桃肉","r":"鲁菜","o":"山东菜巧作指导","f":"色泽：粉红。芡汁：溜芡の。口味：酸甜。质感：外酥里嫩。","c":"热菜","m":["爆炒"],"g":["猪肉","西红柿","鸡蛋"],"s":["料酒","盐","白糖","醋","姜","高汤","淀粉"],"t":["炒锅"],"v":0,"a":"主料：猪肥肉150克。｜配料：此菜无｜配料：，可酌加点缀装饰料。｜调料：番茄酱20克、料酒10克、精盐0.5克、白糖25克、米醋5克、姜水15克、毛汤75克、干淀粉75克、鸡蛋液100克、水淀粉10克、熟花生油750克（约耗50克）。","p":["初步加工：将猪肥肉去皮洗净备用。","原料成形：猪肥肉改刀@切成1.2厘米见方的丁状。","制全蛋糊：鸡蛋液放碗内加于淀粉调匀制成全蛋糊。","烹调成荣：将炒勺内注入宽油置灶口上加热，待油温升至五六成热时，把肉丁挂糊入油浸炸，视其体表定型，呈浅金黄色、断生时倒入漏勺内沥油。炒勺留底油，加番茄酱、料酒、姜水、毛汤、精盐、白糖调味调色，待汤汁烧沸后，用水淀粉勾芡，芡汁熟透发亮放入过油的主料翻炒均匀淋入明油即可。","成品装盘：将菜肴采用“盛入法”装入器皿内，呈堆落状即成。"]},{"i":544,"n":"炸芝麻肉条","r":"鲁菜","o":"山东菜巧作指导","f":"色泽：金黄。芡汁：无汁无芡。口味：咸鲜。质感：外酥里嫩。","c":"热菜","m":["炸"],"g":["芝麻","猪肉","鸡蛋"],"s":["酱油","盐","味精","淀粉","葱","姜"],"t":["炒锅"],"v":0,"a":"主料：猪通脊肉200克。｜配料：芝麻仁50克。｜调料：酱油5克、精盐2克、味精1克、湿淀粉75克、鸡蛋清50克、大葱10克、老姜8克、熟花生油500克（约耗50克）。","p":["初步加工：新鲜猪通脊去净筋膜，大葱择老叶，老姜刮去表皮，均洗净。","原料成形：通脊肉片成约1厘米厚的片，两面上多十字花刀，再切成长约3.5厘米、宽约1.5厘米的条，葱用刀拍松后切成段，老姜切成大薄片。","主料腌渍：肉条放碗内，加入精盐、味精、酱油、葱段、姜片，搅拌均匀，腌渍约20分钟，使其充分入味。","调制蛋清糊：鸡蛋清放碗内，加入湿淀粉搅拌均匀。","生坯成形：肉条去掉葱姜不用，逐条沾上蛋清糊及一层芝麻仁，即成芝麻肉条生坯。然后，放配菜器皿内待用。","烹调成菜：炒勺置中火上烧热，放宽油烧至四五成热时，将肉条生坯逐个入油炸至断生捞出，待油温升至七八成热时，再入油冲炸，视其呈金黄色时捞出沥油。","·成品装盘：将炸制好的芝麻肉条码入器皿内。"]},{"i":545,"n":"炸板肉","r":"鲁菜","o":"山东菜巧作指导","f":"色泽：金黄。芡汁：无汁无芡。口味：咸鲜。质感：外酥里嫩。","c":"热菜","m":["炸"],"g":["猪肉","面粉","鸡蛋"],"s":["白糖","料酒","盐","味精","胡椒","香油","淀粉","葱","姜"],"t":["炒锅"],"v":0,"a":"主料：猪通脊肉250克。｜配料：无糖面包100克。｜调料：料酒7克、精盐1克、味精1克、鸡蛋液50克、胡椒粉0.1克、香油2克、干淀粉20克、大葱5克、老姜4克、熟花生油750克（约耗50克）。","p":["初步加工：新鲜猪通脊肉去净筋膜，大葱择去老叶取葱白，老姜刮去表皮，均洗净。面包去掉黄色表皮。","原料成形：通脊肉片厚约0.3厘米的大片，两面上十字花刀。葱姜分别切末。面包切成0.2厘米见方的粒。","主料腌渍：通脊放碗内，加入精盐、味精、料酒、胡椒粉、香油、葱姜丝搅拌均匀，腌渍约20分钟，使其充分入味。","主料挂糊：去掉肉片中的葱姜丝，肉片逐片沾上干淀粉，在鸡蛋液中拖过，沾上面包粒，然后放配菜器皿内待用。","烹调成茶：炒勺置中火上烧热，放宽油烧至四五成热时，将肉片逐一入油炸至定形，待浸炸呈金黄色肉熟时捞起沥油。","成品装盘：将炸好的成品改刀成一字条码在器血中，呈过桥形。"]},{"i":546,"n":"番茄腰柳","r":"鲁菜","o":"山东菜巧作指导","f":"色泽：芡汁粉红光润。芡汁：溜芡。口味：甜酸适中。质感：外酥里嫩。","c":"热菜","m":["爆炒"],"g":["西红柿","猪腰","猪肉","冬笋","香菇","豌豆","鸡蛋"],"s":["醋","盐","白糖","淀粉","葱","姜"],"t":["炒锅"],"v":0,"a":"主料：猪通脊肉200克。｜配料：冬笋8克、水发香菇10克、鲜豌豆12克。｜调料：米醋5克、精盐2克、番茄酱70克、白糖35克、水淀粉10克、干淀粉50克、大葱5克、老姜5克、鸡蛋液100克、大油40克、熟花生油750克（约耗60克）。","p":["初步加工：鲜通脊肉去净筋膜，大葱择去老叶取葱白，老姜刮去表皮，香菇去柄，均洗净。","原料成形：猪通脊肉片成厚约0.6厘米的片，再用刀膛拍成厚约0.4厘米的片，在原料两面上十字花刀。冬笋、香茹切成约0.5厘米见方的丁。葱白、老姜分别切米状。","配茱组合：肉片、冬笋丁、香菇丁、豌豆、葱姜米分别放配菜器皿中。","调对碗芡：碗内放入番茄酱、白糖、精盐、米醋、清水40克、水淀粉调成碗芡。","主料挂糊：肉片放碗内，加入精盐，确定好“底口”再将肉片两面均沾上干淀粉。取大碗，放入干淀粉、大油和鸡蛋液调成油酥糊。肉片逐一在油酥糊中拖过、挂匀糊。","烹调成荣：炒勺烧热后放入宽油，视油温升至五六成热@时，放入挂糊的肉片，适时翻面，视肉片炸至两面金黄捞出。待油温升至六七成热时，再倒入肉片冲炸捞出。炒勺置火上，放入底油烧热，放葱姜米炒出香味，下入冬笋丁、香菇丁、豌豆略炒，随即倒入碗芡，视芡汁熟透发亮，淋入明油即成。","成品装盘：肉片改刀成一字条叠码于盛菜器皿内。再将炒好的芡汁均匀浇淋在肉条表面即成。"]},{"i":547,"n":"红烧丸子","r":"鲁菜","o":"山东菜巧作指导","f":"色泽：棕红。芡汁：溜芡。口味：以咸为主，略带甜口。质感：软嫩。","c":"小吃","m":["烧扒焖"],"g":["猪肉","香菇","冬笋","鸡蛋"],"s":["酱油","料酒","盐","味精","白糖","葱","姜","蒜","高汤","淀粉"],"t":["炒锅"],"v":0,"a":"主料：猪肉250克。｜配料：水发冬菇30克、冬笋30克。｜调料：酱油8克、料酒7克、精盐2克、味精1克、白糖5克、糖色3克、大葱8克、老姜10克、大蒜5克、鸡蛋液30克、毛汤300克、湿淀粉20克、水淀粉30克、熟花生油750克（约耗40克）、大油25克。","p":["初步加工：选肥三成、瘦七成的猪肉，大葱择去老叶取葱白，老姜刮去表皮，大蒜剥皮，水发冬菇去柄，均洗净。","原料成形：猪肉剁成细末状，葱白切成豆瓣葱，取姜5克切细末，5克切小片，蒜切片，冬菇切抹刀片，冬笋顺丝切成片。","调制肉馅：肉末放置容器内，加入精盐、味精、姜末，确定好“底口\"搅拌均匀，再加入鸡蛋液、湿淀粉、毛汤，顺向搅拌至滋润。","配荣组合：冬笋、冬菇、豆瓣葱、姜蒜片分别放配菜器Ⅲ中，肉馅放碗中。","肉丸成形：炒勺置旺火上烧热加入宽油，烧至六七成热时，将肉馅挤成直径约2厘米的丸子，逐个入油炸制，视丸子表面硬结时捞出沥油。","烹调成茶：炒勺置旺火上，放入大油，烧至四五成热时，放入豆瓣葱、姜蒜片炒出香味，再加入笋片、冬菇及丸子，烹入料酒并添毛汤烧沸后，放入酱油、糖色、精盐、味精、白糖，烧沸后改用小火烧制，待丸子松软入味后，用水淀粉勾芡，视芡汁熟透发亮时翻勺，使芡汁均匀包裹住丸子，淋入明油即成。","成品装盘：菜肴采用盛入法装入器皿，呈自然堆落状。"]},{"i":548,"n":"清氽丸子","r":"鲁菜","o":"山东菜巧作指导","f":"色泽：汤汁清澈，丸子洁白。芡汁：不用勾芡，汤汁较宽。口味：咸鲜适口。质感：软嫩。","c":"小吃","m":["烧扒焖"],"g":["猪肉","海米","木耳","鸡蛋"],"s":["料酒","盐","味精","葱","姜","高汤"],"t":["炒锅"],"v":0,"a":"主料：猪瘦肉200克。｜配料：水发海米10克、油菜10棵、水发木耳25克。｜调料：料酒5克、精盐2克、味精1克、大葱7克、老姜5克、鸡蛋清25克、清汤500克、鸡油3克、大油5克。","p":["初步加工：猪瘦肉去表面筋膜，油菜择去老叶取心，大葱择去老叶取葱白，老姜刮去表皮洗净。","原料成形：肉顶刀切成厚片放大碗中，加入清水漂洗后捞出，鲜猪皮平铺在菜墩上，放上肉片用刀背捶成细茸放大碗内。葱白、老姜分别切成细末，木耳撕成小朵，油莱心根茎部用小刀削成圆锥形并划上十字刀。","调制肉泥：在装有肉茸的碗中加上精盐、味精、葱末、姜末顺向搅动，随搅随加入清水和鸡蛋清，视搅至滋润起粘性后，添入大油搅匀。","配荣组合：莱心、木耳、海米分别放配菜器皿中。肉泥放在碗中。","油荣焯水：汤勺加入清水烧沸，下入油菜心焯水，捞出过凉。","烹调成菜：汤勺加入清汤烧开，移至小火上，将肉泥挤成直径约1.3厘米的丸子，逐个下勺中。汤保持微开，待丸子浮出汤面后撇净浮沫，加入精盐、料酒、味精、木耳、海米、油菜心，烧沸即成。","成品装碗：将氽熟的丸子、配料和汤一起盛入大汤碗，淋上鸡油。"]},{"i":549,"n":"山东蒸丸","r":"鲁菜","o":"山东菜巧作指导","f":"色泽：汤汁清澈，呈淡黄色。芡汁：不用勾芡，汤汁较宽。口味：酸辣咸鲜。质感：软嫩。","c":"热菜","m":["蒸"],"g":["猪肉","海米","鹿角菜","鸡蛋"],"s":["香菜","料酒","醋","盐","味精","胡椒","葱","姜","香油","高汤"],"t":["蒸锅"],"v":0,"a":"主料：猪瘦肉250克、猪肥肉200克。｜配料：海米25克、鹿角菜15克、香菜50克。｜调料：料酒50克、米醋15克、精盐3克、味精1克、胡椒粉1克、鸡蛋液50克、大葱30克、老姜10克、香油5克、清汤300克。","p":["初步加工：新鲜猪瘦肉去净表面筋膜。鹿角菜、香菜择洗干净。海米洗净泥沙。大葱择去老叶取葱白，老姜刮皮并洗净。","原料成形：肥瘦肉剁成末。海米、鹿角菜均剁成末。香菜切成3厘米长的段，葱白切成眉毛葱，老姜取5克切成细末，另5克切成细丝。","调制肉馅：取大碗放入肉末、姜末、海米及鹿角菜末，再加入精盐、味精，搅拌均匀找好“底口\"，再放入鸡蛋液搅拌至滋润。","配荣组合：香菜段、葱丝、姜丝、肉馅分别放配菜器皿内。","烹调成菜：取大蒸盘，将肉馅挤成直径约3.3厘米的丸子放蒸盘内。将丸子入屉蒸约8分钟后取出。汤勺置中火上，添入清汤烧沸，加入精盐、味精、料酒、胡椒粉、米醋调好口味，再下葱姜丝、香菜段，淋香油后即可出勺。","成品装碗：丸子移入大汤碗中再将汤倒入即成。"]},{"i":550,"n":"干肉条","r":"鲁菜","o":"山东菜巧作指导","f":"色泽：棕红。芡汁：不用勾芡。口味：以咸为主，略带甜味。质感：酥软。","c":"热菜","m":["烧扒焖"],"g":["猪肉","冬笋","香菇"],"s":["酱油","料酒","盐","味精","白糖","葱","姜","高汤"],"t":["炒锅"],"v":0,"a":"主料：带皮猪硬肋肉200克。｜配料：冬笋25克、冬菇20克。｜调料：酱油5克、料酒5克、精盐1克、味精1克、白糖20克、大葱30克、老姜30克、清汤400克、酱汤750克、熟花生油1000克（约耗30克）。","p":["初步加工：肥瘦相间的猪硬肋肉刮洗干净。大葱择去老叶，老姜刮去表皮，冬菇去柄，均洗净。","原料成形：冬笋、冬菇切成约0.4厘米见方的丁。葱用刀拍松切成寸段。老姜5克切细末其余切片。","原料熟处理：汤勺置旺火上，加入多量的清水及硬肋肉，烧沸后撇去浮沫，放入葱段、姜片并转用小火加热，再添入酱汤卤制，直至肉软烂上色后捞出。","主料过油：油勺置旺火上，加入宽油烧热，视油温升至七八成热时，放入卤好的硬肋肉浸炸，待肉皮表面起皱呈棕红色时捞出沥油，晾凉后将肉切成长约10厘米、厚约0.3厘米、宽约5厘米的肉条。","配菜组合：肉条皮朝下与冬笋丁、冬菇丁及姜末分别放配菜器皿中。","烹调成茶：炒勺置旺火上，放底油烧热，随即下入姜末煸炒出香味，再下入冬笋丁、冬菇丁，烹入料酒，加入清汤烧沸，再将肉条整齐地移入勺中，然后加入酱油、味精、精盐、白糖、清汤，调好口味。汤汁烧沸后，转用小火，待肉条酥软入味，汤汁将尽时，将肉条翻过来，使肉条皮面朝上，再用旺火收浓汤汁即可出勺。","成品装盘：菜肴采用“倒入法”装入器Ⅲ。"]},{"i":551,"n":"九转肥肠","r":"鲁菜·济南","o":"山东菜巧作指导","f":"色泽：棕红。芡汁：不用勾芡，有少量浓滋汁。口味：甜咸适中。质感：酥软。","c":"热菜","m":["爆炒"],"g":["猪大肠","猪肉"],"s":["香菜","料酒","醋","盐","味精","白糖","姜","酱油","葱","胡椒","高汤","香油"],"t":["炒锅"],"v":0,"a":"主料：猪大肠1500克。｜配料：香菜10克。｜调料：料酒25克、米醋5克、精盐2克、味精1克、白糖40克、酱油5克、老姜30克、毛姜水10克、大葱100克、清汤250克、胡椒粉0.5克、香油15克、熟花生油20克。","p":["初步加工：选新鲜猪大肠（肠头）用套洗的方法，里外翻洗几遍，去掉杂物、粪便后放一盆内，撒点盐、醋揉搓几遍，除去粘液，再用清水将大肠里外漂洗几次。大葱择去老叶，切寸段，老姜刮去表皮切成大片，香菜去老叶、根，洗净后将香菜切成细末。","大肠熟处理：汤勺加入清水上火，放入大肠用旺火烧沸，转用小火煮至五六成熟时，重新换清水，加入葱段、姜片继续加热煮制，直至软烂后捞出并过凉，再将大肠切成长约2.5厘米的段。","配荣组合：大肠、香菜末分别放配菜器皿内。","烹调成菜：炒勺置中火上烧热，加底油（香油）和白糖20克，炒成棕红色时，下入大肠段翻炒，待大肠上色后烹入料酒，随即加入清汤、酱油、米醋、精盐、味精、白糖、胡椒粉，烧沸后转用小火，中途将大肠翻动1次。待汤汁浓时翻勺。视汤汁均匀包裹住原料后淋入明油即可出勺。","成品装盘：大肠逐个抹入器皿中码好，香菜末撒在大肠表面即成。"]},{"i":552,"n":"溜肝尖","r":"鲁菜","o":"山东菜巧作指导","f":"色泽：棕红。芡汁：溜芡。口味：咸鲜适口，蒜香味浓。质感：软嫩。","c":"热菜","m":["烧扒焖"],"g":["猪肉","木耳","黄瓜"],"s":["酱油","料酒","醋","盐","味精","淀粉","葱","高汤","蒜","姜"],"t":["炒锅"],"v":0,"a":"主料：猪肝200克。｜配料：水发木耳25克、黄瓜25克。｜调料：酱油10克、料酒15克、米醋2克、精盐1克、味精1克、干淀粉5克、水淀粉10克、毛汤75克、大葱10克、大蒜15克、姜水10克、熟花生油750克（约耗50克）。","p":["初步加工：将猪肝去筋膜，黄瓜去头、尾，大葱去根须、老叶，大蒜去表皮均洗净。","原料成形：把猪肝切成约4厘米长、2厘米宽、0.3厘米厚的片，黄瓜切成菱形片，水发木耳切成小朵，葱切成豆瓣葱，蒜切片备用。","猪肝上浆：把猪肝放器皿中，加精盐、干淀粉浆拌均匀。","调对碗芡：将酱油、料酒、米醋、毛汤、姜水、精盐、味精、豆瓣葱、蒜片、水淀粉放入碗内调对成碗芡待用。",".配菜组合：把浆的猪肝、水发木耳、黄瓜片分放在配莱器皿内备用。","烹调成菜：将炒勺内注入宽油、置灶口上加热，待油温升至四五成热时，把浆好的猪肝入油滑散至断生，然后倒入漏勺内沥油。炒勺内留底油，放入滑好的猪肝、水发木耳、黄瓜片翻炒，随即倾入碗芡烹制，视芡汁熟后且翻炒均匀淋入明油即可。","成品装盘：将成品采用“盛入法”装置器皿中，呈自然堆落状即成。"]},{"i":553,"n":"荒爆肚仁","r":"鲁菜","o":"山东菜巧作指导","f":"色泽：白绿相间。芡汁：清汁。口味：咸鲜。质感：脆嫩。","c":"热菜","m":["爆炒"],"g":["猪肚"],"s":["香菜","盐","味精","料酒","醋","胡椒","香油","葱","高汤","姜","蒜"],"t":["炒锅"],"v":0,"a":"主料：净猪肚头400克。｜配料：芜萎（香菜）100克。｜调料：精盐2克、味精1克、料酒10克、米醋5克、胡椒粉0.5克、香油4克、清汤50克、大葱10克、老姜5克、大蒜8克、大油1000克（约耗40克）。","p":["初步加工：新鲜猪肚头放大碗内，加入精盐、米醋搓洗后，用清水漂洗至肚头发白。大葱择去老叶取葱白，老姜刮去表皮，大蒜剥皮，荒荽择去老叶、根，分别洗净。","原料成形：肚头剖开，上刀距约0.3厘米、刀深为原料厚度2/3的多十字花刀，再切成长宽约2.5厘米的方块。葱白切眉毛葱，姜切细丝，大蒜切片，荒萎切成寸段。","配茶组合：肚块、荒萎段、葱姜丝、蒜片分别放配菜器皿中。","调对碗汁：清汤、料酒、米醋、精盐、味精、胡椒粉放碗中调成碗汁。","肚块焯水：炒勺置旺火上，添入宽水烧沸，将肚块放水中焯水，迅速捞出并沥净水分。","烹调成荣：炒勺置旺火上烧热，加入宽油，视油温升至七八成热时，放入肚块过油，然后迅速将肚块同油一起倒入漏勺沥油。炒勺留底油烧热，下入葱姜丝、蒜片炒出香味，将肚块倒入炒勺中，随即倒入碗汁、撒入荒萎，用旺火迅速翻炒均匀，淋入香油即可。","成品装盘：菜肴采用“盛入法”装入器皿，呈堆落状。"]},{"i":554,"n":"油爆肚仁","r":"鲁菜","o":"山东菜巧作指导","f":"色泽：芡汁乳白。芡汁：利汁抱芡口味：咸鲜。质感：脆嫩。","c":"热菜","m":["爆炒"],"g":["猪肚","冬笋"],"s":["料酒","盐","味精","葱","蒜","姜","高汤","淀粉"],"t":["炒锅"],"v":0,"a":"主料：净猪肚头400克。｜配料：冬笋50克。｜调料：料酒6克、精盐3克、味精1克、大葱15克、大蒜10克、毛姜水6克、清汤50克、水淀粉50克、大油700克（约耗50克）。","p":["初步加工：猪肚头放盆内，加入精盐、米醋搓洗后，用清水漂洗至肚头白净。大葱择去老叶取葱白，大蒜剥去表皮与冬笋一并洗净。","原料成形：肚头上刀距约0.3厘米、刀深为原料厚度2/3的多十字花刀，再改刀成长宽约2.5厘米的块，冬笋切成边长约1厘米的菱形丁。葱白切成豆瓣葱，蒜切片。","配荣组合：肚块、豆瓣葱、蒜片、冬笋丁，分别放配菜器皿内。","调对碗芡：清汤、料酒、精盐、味精、豆瓣葱、毛姜水、蒜片、水淀粉放碗中，调成碗芡。","肚块焯水：炒勺置旺火上，添入清水烧沸，将肚块放入水中焯水3，随即迅速捞出并沥净水分。","烹调成菜：炒勺置旺火烧热，加入宽油，视油温升至七八成热时，放入肚块、冬笋丁过油，并迅速将肚块、冬笋丁同油一起倒入漏勺沥油。炒勺留底油烧热，将肚块、冬笋丁倒入炒勺中，随即倒入碗芡，快速翻炒均匀，视芡汁熟透均匀包裹住原料后，淋入明油即可出勺。","成品装盘：菜肴采用“扣入法”装入器皿，呈馒头形。"]},{"i":555,"n":"油爆双脆（做法二）","r":"鲁菜","o":"山东菜巧作指导","f":"色泽：芡汁乳白，原料白、褐、绿三色相间。芡汁：利汁抱芡。口味：咸鲜。质感：脆嫩。","c":"热菜","m":["爆炒"],"g":["猪肚","鸭肉","青蒜"],"s":["料酒","醋","盐","味精","葱","姜","蒜","淀粉","高汤"],"t":["炒锅"],"v":0,"a":"主料：净猪肚头150克、净鸭盹100克。｜配料：青蒜10克。｜调料：料酒15克、米醋5克、精盐3克、味精1克、大葱7克、老姜5克、大蒜8克、水淀粉30克、清汤15克、花椒油10克、大油500克（约耗50克）。","p":["初步加工：新鲜猪肚头放容器中，加入精盐和米醋，反复搓洗，并用清水漂净。大葱择去老叶取葱白，老姜刮去表皮，大蒜剥宏表皮，青蒜择去老叶与鸭腌均洗净。","原料成形：肚头上十字花刀，改刀成长对角线约为2.5厘米、短对角线约为1.5厘米的菱形块。鸭盹劈开片去筋皮，上刀距约为0.2厘米、深度为鸭腌厚度3/4的多十字花刀。葱白切豆瓣葱，姜剁成细末并用热清汤浸泡成姜水，大蒜切成片，青蒜切寸段。","配荣组合：肚块、鸭盹、青蒜段、豆瓣葱、蒜片分别放配菜器皿中，姜水放碗中。·","调对碗芡：将姜水、料酒、米醋、精盐、味精、豆瓣葱、蒜片、青蒜段、水淀粉放碗内，调成碗芡。","烹调成荣：炒勺置旺火上，加入清水烧沸，下入好刀的肚头及鸭腌焯水后迅速用漏勺捞出沥水。炒勺置火上，倒入宽油烧热，视油温升到七八成热时，下入肚块及鸭盹，随即快速将原料同油一起倒入漏勺沥油。炒勺留底油烧热再倒入肚块和鸭盹，立即倾入碗芡翻炒均匀，视芡汁熟透发亮、均匀包裹住原料后，淋入明油（花椒油）即可出勺。","成品装盘：菜肴采用“盛入法”装入器皿，呈堆落状。"]},{"i":556,"n":"酱爆鸡丁","r":"鲁菜","o":"山东菜巧作指导","f":"色泽：枣红光润。芡汁：不用勾芡，酱汁紧包。口味：咸中带甜。质感：软嫩。","c":"热菜","m":["爆炒"],"g":["鸡肉","猪肉","鸡蛋"],"s":["黄酱","料酒","盐","味精","白糖","姜","淀粉","香油"],"t":["炒锅"],"v":0,"a":"主料：鸡脯肉300克。｜配料：此菜无｜配料：。｜调料：黄酱25克、料酒8克、精盐1克、味精1克、白糖25克、姜水10克、鸡蛋清10克、湿淀粉15克、香油10克、大油700克（约耗35克）。","p":["初步加工：新鲜鸡脯肉去筋洗净。","原料成形：鸡脯肉表面上多十字花刀，再切成约1.2厘米见方的丁。","主料上浆：鸡丁放碗中，加入精盐、味精、料酒，确定好底口，再加入鸡蛋清、湿淀粉搅拌滋润，放配菜器皿中。","烹调成菜：炒勺置灶口上，放入宽油加热，待油温升至三四成热时，下入鸡丁滑散，待鸡丁断生后同油一起倒入漏勺沥油。炒勺置旺火上，放入香油10克，随后放入黄酱炒制，待黄酱炒出香味、熟透后烹入料酒，再加入白糖，待糖溶化后，加入姜水、精盐，炒至酱稠浓时，放入鸡丁翻炒均匀，待酱汁均匀包裹住鸡丁后，淋入明油即可。","成品装盘：菜肴采用“扣入法”装入器皿，呈馒首形。"]},{"i":557,"n":"鸡里蹦","r":"鲁菜","o":"山东菜巧作指导","f":"色泽：洁白光润。芡汁：利汁抱芡。口味：咸鲜。质感：鸡丁软嫩，虾仁脆嫩。","c":"热菜","m":["爆炒"],"g":["鸡肉","猪肉","虾","鸡蛋"],"s":["料酒","醋","盐","味精","葱","姜","蒜","淀粉","高汤"],"t":["炒锅"],"v":0,"a":"主料：鸡脯肉100克、虾仁100克。｜配料：此菜无｜配料：，可酌加点缀装饰料。｜调料：料酒15克、米醋1克、精盐2克、味精1克、大葱10克、姜水5克、大蒜8克、湿淀粉50克、水淀粉50克、鸡蛋清50克、清汤70克、大油1000克（约耗70克）。","p":["初步加工：选新鲜的虾仁，挑出虾线，鸡脯肉去皮和筋络，大葱择去老叶取葱白，大蒜剥去表皮，均洗净。","原料成形：鸡脯肉表面上多十字花刀，切成约1.2厘米见方的丁，葱白切成豆瓣葱，蒜切片。","主料上浆：鸡丁放碗中加入精盐、味精、料酒，确定好底口，再加入鸡蛋清、湿淀粉搅拌至滋润。虾仁按上述方法上浆。","配茱组合：鸡丁、虾仁、豆瓣葱、蒜片分别放配菜器皿中。","调对碗芡：取料酒、米醋、味精、清汤、豆瓣葱、蒜片、姜水、水淀粉放碗内，调成碗芡。","烹调成荣：炒勺置灶口上，放入宽油烧热，视油温升至三四成热时，把鸡丁放入油中滑散，待鸡丁断生后，再漏勺捞出。油温回升至四五成热时，再把虾仁放入勺中滑散至断生后，连油一起倒入漏勺沥油。勺中留底油，倒入滑好的鸡丁和虾仁，倾入碗芡翻炒均匀，视芡汁熟透发亮，均匀包裹住原料后，淋入明油即成。","成品装盘：菜肴采用“盛入法”装入器血，呈堆落状。也可采用“扣入法”装盘。"]},{"i":558,"n":"纸包鸡（做法二）","r":"鲁菜","o":"山东菜巧作指导","f":"色泽：白色透明（白里泛黄)。芡汁：无汁无芡。口味：咸鲜。质感：软嫩。","c":"热菜","m":["炸"],"g":["鸡肉","猪肉"],"s":["料酒","盐","味精","胡椒","香油","葱","姜"],"t":["炒锅"],"v":0,"a":"主料：鸡里肌肉200克。｜配料：玻璃纸24张（四边约长9厘米）。｜调料：料酒15克、精盐3克、味精1克、胡椒粉0.1克、香油40克、大葱8克、老姜10克、熟花生油250克（约耗40克)。","p":["初步加工：鸡里肌去筋，大葱择老叶取葱白，老姜刮去表皮，均洗净。","原料成形：鸡里肌抹刀片成薄片，葱和老姜均切末。","鸡片入味：鸡片放碗中加入精盐、味精、料酒、葱姜末、胡椒粉、香油，调好底口，搅拌均匀。","纸包鸡成形：将调好味的鸡片分成24等份，每份分别放在每张玻璃纸上包起来呈长方形，制成纸包鸡胚料。","烹调成菜：炒勺置火上，放入宽油烧热，视油温升至五六成热时，把纸包鸡放入油中浸炸，用手勺轻轻翻动，视纸包鸡浮出油面捞出沥油即成。","成品装盘：纸包鸡码在器皿中呈过桥形。"]},{"i":559,"n":"鸡丝掐菜","r":"鲁菜","o":"山东菜巧作指导","f":"色泽：洁白光润。芡汁：不用勾芡，略有少量滋汁。口味：咸鲜。质感：主料软嫩，配料脆嫩。","c":"热菜","m":["爆炒"],"g":["鸡肉","猪肉","豆芽","鸡蛋"],"s":["料酒","盐","味精","淀粉","葱","姜","高汤"],"t":["炒锅"],"v":0,"a":"主料：鸡脯肉150克。｜配料：绿豆芽80克。｜调料：料酒10克、精盐1.5克、味精1克、湿淀粉10克、大葱10克、老姜10克、鸡蛋清30克、清汤20克、葱椒油“5克、猪大油1000克（约耗30克）。","p":["初步加工：鸡脯肉去筋膜，绿豆芽掐去豆瓣和根须，大葱择去老叶取葱白，老姜刮去表皮，均洗净。","原料成形：鸡脯肉顺丝切成长约5厘米、约0.2厘米见.方的细丝，葱姜切碎放碗中，用凉清汤泡成葱姜水。","主料上浆：鸡丝放碗中，加入精盐、味精、料酒，调好“底口\"，再加入鸡蛋清、湿淀粉搅拌滋润。","配菜组合：豆芽菜、肉丝分别放配菜器皿中。．","调对碗汁：将葱姜水、精盐、味精、料酒放碗内，调成碗汁。·","配料焯水：炒勺置灶口上，加入清水烧沸，下入豆芽菜焯水断生后捞出沥水。","烹调成荣：将炒勺置灶口上，加入宽油加热，视油温升至三四成热时，放入鸡丝滑散，视鸡丝伸展、断生后，连油一起倒入盛有豆芽菜的漏勺中沥油。勺中留底油，倒入鸡丝和豆芽菜，随即烹入碗汁，用旺火快速翻炒均匀，淋入葱椒油即可出勺。","成品装盘：菜肴采用“盛入法”装入器皿，呈自然堆落状。"]},{"i":560,"n":"炒龙凤丝","r":"鲁菜","o":"山东菜巧作指导","f":"色泽：洁白光润。芡汁：利汁抱芡。口味：咸鲜。质感：软嫩。","c":"热菜","m":["爆炒"],"g":["鸡肉","猪肉","鱼肉","鸡蛋"],"s":["料酒","盐","味精","淀粉","葱","姜","高汤"],"t":["炒锅"],"v":0,"a":"主料：鸡脯肉100克、净黑鱼肉100克。｜配料：此菜无｜配料：，可酌加点缀装饰料。｜调料：料酒5克、精盐2克、味精1克、水淀粉10克、湿淀粉10克、大葱10克、老姜10克、清汤50克、葱椒油5克、鸡蛋清40克、大油1000克（约耗200克）。","p":["初步加工：鸡脯肉去筋膜，黑鱼肉去皮、刺，大葱择去老叶取葱白，老姜刮去表皮，均洗净。","原料成形：鸡脯肉顺丝切成长约5厘米、粗细约0.2厘米的丝。鱼肉成形与鸡丝相同，葱姜切碎后放碗中并用凉清汤浸泡。","主料上浆：鸡丝放碗中，加入精盐、料酒，调好底口，再加入鸡蛋清及湿淀粉搅拌均匀。鱼丝按鸡丝上浆方法浆好。","配菜组合：浆好的鸡丝、鱼丝分别放配菜器皿中。","调对碗芡：将葱姜水、精盐、味精、料酒、水淀粉放碗内，调成碗芡。","烹调成菜：炒勺润透后放旺火上，加入宽油烧热，视油温升至三四成热时，先放鸡丝滑散，再入鱼丝滑散，视原料伸展断生后，将鸡丝、鱼丝同油一起倒入漏勺沥油。勺中留底油，倒入鸡丝和鱼丝，随即倾入碗芡翻炒，视芡汁熟透发亮并均匀包裹住原料后淋入明油即成。","成品装盘：菜肴采用“盛入法”盛入器血·呈自然堆落状。"]},{"i":561,"n":"炸鸡卷","r":"鲁菜","o":"山东菜巧作指导","f":"色泽：金黄。芡汁：无汁无芡。口味：咸鲜。质感：外酥里嫩。","c":"热菜","m":["炸"],"g":["鸡肉","猪肉","荸荠","面粉","鸡蛋"],"s":["盐","味精","料酒","葱","姜","淀粉"],"t":["炒锅"],"v":0,"a":"主料：鸡腿500克。｜配料：猪肥膘肉50克、罐装清水南荠25克、面包渣150克。｜调料：精盐2克、味精1克、料酒10克、葱姜水10克、湿淀粉10克、干淀粉10克、鸡蛋黄液50克、熟花生油750克（约耗75克）。","p":["初步加工：将鸡腿去骨、皮及筋膜，猪肥膘肉去皮刮洗干净，南荠洗净备用。","原料成形：把鸡腿肉、猪肥膘肉、南荠均改刀成米粒状。","调制馅心：将鸡腿肉粒、猪肥膘肉粒、南荠粒放入器皿内，加精盐、味精、料酒、葱姜水、湿淀粉、鸡蛋黄液顺向调拌至上劲。","鸡卷成形：将调制的馅心制成长约3厘米的橄榄形状待用。","鸡卷挂糊：把鸡卷逐一拍上干淀粉，拖入鸡蛋黄液，粘裹上面包渣备用。","炸制成菜：炒勺内注入宽油置灶口上加热，待油温升至四五成热时，将鸡卷逐一入油浸炸，其表面呈浅金黄色时捞出，当油温升至六七成热时，鸡卷冲炸至体表呈金黄色，倒入漏勺沥油即成。","成品装盘：将菜肴成品采用“倒入法”装入器血中，呈堆落状即可。"]},{"i":562,"n":"芜爆鸡条","r":"鲁菜","o":"山东菜巧作指导","f":"色泽：鸡条洁白，芜药（香菜）碧绿。芡汁：清汁”。口味：以咸鲜为主，略有酸辣味。质感：软嫩。","c":"热菜","m":["爆炒"],"g":["鸡肉","猪肉","鸡蛋"],"s":["香菜","料酒","醋","盐","味精","胡椒","葱","姜","蒜","淀粉","香油","高汤"],"t":["炒锅"],"v":0,"a":"主料：鸡脯肉300克。｜配料：芜荽（香菜）100克。｜调料：料酒10克、米醋5克、精盐3克、味精1克、胡椒粉0.5克、大葱15克、老姜6克、大蒜8克、湿淀粉25克、鸡蛋清30克、香油3克、清汤40克、大油1000克（约耗50克）。","p":["初步加工：鸡脯肉去筋膜，大葱择去老叶取葱白，老姜刮去表皮，大蒜剥去表皮，荒萎择去根和老叶，均洗净。","原料成形：鸡脯肉顺丝切*成长约5厘米、粗细0.6厘米的条，荒切成寸段，葱白切成眉毛葱，大蒜切片，老姜切细丝。","主料上浆：鸡条放碗中，加入精盐、味精、料酒，确定好“底口”，搅拌均匀，再放入鸡蛋清、湿淀粉，顺向搅拌至滋润。","配菜组合：鸡条、荒荽段、眉毛葱、蒜片、姜丝分别放配菜器皿中。","调对碗汁：将尧荽段、眉毛葱、蒜片、姜丝、清汤、精盐、味精、料酒、米醋、胡椒粉放碗内，调成碗汁。","烹调成菜：炒勺烧热后放入宽油，视油温升至三四成热零时，放入浆好的鸡条滑散，视鸡条断生后，连油一起倒入漏勺沥油。炒勺上火烧热，将鸡条倒回炒勺中，随即倒入碗汁，用旺火迅速翻炒，淋入香油后即可出勺。","成品装盘：菜肴采用“盛入法”盛入器皿，呈堆落状。"]},{"i":563,"n":"炸烹鸡条","r":"鲁菜","o":"山东菜巧作指导","f":"色泽：金黄。芡汁：清汁@。口味：咸鲜。质感：外酥里嫩。","c":"热菜","m":["炸"],"g":["鸡肉","猪肉","鸡蛋"],"s":["料酒","醋","盐","味精","葱","姜","蒜","淀粉","香油","高汤"],"t":["炒锅"],"v":0,"a":"主料：鸡脯肉300克。｜配料：此菜无｜配料：，可酌加点缀装饰料。｜调料：料酒10克、米醋5克、精盐2克、味精1克、大葱15克、老姜10克、大蒜6克、湿淀粉40克、鸡蛋黄120克、香油3克、清汤40克、大油1000克（约耗40克）。","p":["初步加工：鸡脯肉去筋膜，大葱择去老叶取葱白，老姜刮去表皮，大蒜剥去表皮，分别洗净。","原料成形：鸡脯肉片成约0.6厘米厚的片，刹上刀距约为0.2厘米的多十字花刀，深度为原料厚度的1/5，再顺丝切成长约5厘米、宽约0.6厘米的条，葱白切成丝，老姜切成细丝，大蒜切成片。","鸡条挂糊：鸡条放碗中，加入精盐、味精、料酒，确定好“底口”，搅拌均匀，再放入鸡蛋黄、湿淀粉，搅拌至滋润。","配荣组合：鸡条、葱姜丝、蒜片分别放配菜器血内。","调对碗汁：将清汤、精盐、料酒、味精、米醋、葱丝、蒜片、姜丝放碗内，调成碗汁","烹调成荣：炒勺置灶口上，放入宽油烧热，视油温升至五六成热时，放入鸡条浸炸，此时用旺火加热，使油温逐步升高，视鸡条呈金黄色并外酥里嫩时，将鸡条同油一起倒入漏勺沥油。炒勺重新烧热，将鸡条倒回炒勺中，迅速烹入碗汁，用旺火快速翻炒。出勺要迅速。","成品装盘：菜肴采用“盛入法”盛在器皿中，呈堆落状。"]},{"i":564,"n":"红烧鸡翅","r":"鲁菜","o":"山东菜巧作指导","f":"色泽：芡汁棕红。芡汁：溜芡の。口味：咸鲜。质感：酥软。","c":"热菜","m":["烧扒焖"],"g":["鸡肉","冬笋","香菇"],"s":["酱油","料酒","盐","味精","葱","姜","白糖","淀粉","高汤"],"t":["炒锅"],"v":0,"a":"主料：生鸡翅500克。｜配料：冬笋100克、水发冬菇50克。｜调料：酱油5克、料酒30克、精盐3克、味精1克、大葱20克、老姜10克、糖色1克、水淀粉10克、毛汤500克、大油1000克（约耗50克）。","p":["初步加工：选新鲜鸡翅摘净残毛，洗净，大葱择去老叶取葱白，老姜刮去表皮，冬菇去柄，均洗净。","原料成形：斩去翅尖，再将鸡翅从关节弯曲处斩成两段。葱白剖开，切成寸段。姜切成薄片。冬笋顺丝切成长约","厘米、宽约2厘米、厚约0.3厘米的片。冬菇逐个切成两片。：：：","配荣组合：鸡翅、葱段、姜片、冬笋及冬菇分别放配菜器皿中。","浸炸鸡翅：炒勺置旺火上，加入宽油烧热，视油温升至七八成热时，放入鸡翅，待鸡翅表面上色和肉皮紧缩后，迅速捞出沥油。","烹调成荣：炒勺置中火上，放入底油烧热，加入葱段、姜片炒出香味，添入毛汤烧沸，稍煮出味后，用漏勺捞出葱姜不用，放入鸡翅、冬笋、冬菇，用酱油、味精、糖色、料酒、精盐调好口味和颜色，烧沸后撇去浮沫，转用小火烧至鸡翅酥软，然后转用中火并用水淀粉勾芡，视芡汁熟透发亮并均匀包裹住原料后，淋入明油即成。","成品装盘：菜肴采用“盛入法”装入器皿，呈堆落状。"]},{"i":565,"n":"香蕉锅炸","r":"鲁菜","o":"山东菜巧作指导","f":"色泽：金黄。芡汁：无汁无芡。口味：香甜。质感：外脆里嫩。","c":"甜品","m":["炸"],"g":["鸡蛋","米粉","面粉"],"s":["白糖"],"t":["炒锅"],"v":1,"a":"主料：鸡蛋黄150克。｜配料：此菜无｜配料：，可酌加点缀装饰料。｜调料：玉米粉50克、面粉50克、白糖100克、香蕉精1滴、熟花生油1000克（约耗40克）、清水400克。","p":["调对浆液：取大碗，放入香蕉精、鸡蛋黄、面粉、玉米粉20克、白糖60克，用筷子搅匀，再加清水100克搅至滋润。","炒制浆液：炒勺置灶口上，加入清水300克烧沸，用手勺顺-一个方向搅动，边搅边倒入调兑好的浆液，用微火炒成稠糊，视浆液熟透发亮并凝结后，盛入盘中晾凉，即成锅炸坏料。","坏料成形：将晾凉的锅炸坏料切成长对角线为4厘米、短对角线约为2.5厘米的菱形块，再将锅炸块沾上-一层干玉米粉放入盘中。","烹制成荣：炒勺置灶口上，放入宽油烧热，视油温升至六七成热时，放入锅炸块浸炸，待锅炸块呈浅黄色并浮起后，捞出即成。"]},{"i":566,"n":"象眼鸽蛋","r":"鲁菜","o":"山东菜巧作指导","f":"色泽：金黄。芡汁：无汁无芡。口味：咸鲜。质感：酥脆与软嫩相间。","c":"热菜","m":["炸"],"g":["虾","猪肉","面粉","火腿","鸡蛋"],"s":["白糖","香菜","盐","味精","姜","淀粉"],"t":["炒锅"],"v":0,"a":"主料：鸽蛋6个、青虾150克、猪肥膘40克、无糖面包150克。｜配料：熟火腿15克、荒荽（香菜）5克。｜调料：精盐2克、味精1克、鸡蛋清50克、毛姜水10克、湿淀粉15克、干淀粉2克、大油1000克（约耗75克）。","p":["初步加工：青虾去壳和虾线用清水漂洗干净，猪肥膘刮去表面污物，荒荽择取嫩叶，洗净，面包切去表皮。","煮制鸽蛋：将鸽蛋放入冷水锅中，用小火煮熟后捞出，随即放入凉水中浸凉，剥去蛋壳。","原料成形：鸽蛋从中间剖开。熟火腿、荒萎叶均切成细末。选用一大张鲜猪肉皮，表皮向下铺在菜墩上，放上青虾肉、肥膘肉，用刀背砸成细茸状。面包切成长对角线约为6厘米、短对角线约为3厘米、厚约为0.7厘米的菱形片。","调对虾茸：虾茸放大碗内，放入精盐、味精、鸡蛋清、毛姜水和湿淀粉搅拌至滋润成虾泥。","加工坯料：虾泥按12等份逐一平抹在面包片的一面。鸽蛋逐个对剖两瓣，剖面沾上干淀粉，再逐个镶嵌在虾茸上面。用火腿末、荒荽末分别点缀在虾茸和鸽蛋两端。","·烹调成菜：炒勺置火上，放入宽油烧热，待油温升至四五成热时，逐个把象眼鸽蛋生坯放入油中，用中火加热，使油温渐渐升温，视面包炸成金黄酥脆后即成。","成品装盘：将菜肴码放在器皿中，呈放射状摆放。"]},{"i":567,"n":"炸芝麻鱼条","r":"鲁菜","o":"山东菜巧作指导","f":"色泽：金黄。芡汁：无汁无芡。口味：咸鲜。质感：外酥里嫩。","c":"热菜","m":["炸"],"g":["芝麻","鱼肉","青鱼","鸡蛋"],"s":["盐","料酒","味精","淀粉","葱","姜"],"t":["炒锅"],"v":0,"a":"主料：青鱼1尾（约重1000克）。｜配料：白芝麻80克。｜调料：精盐3克、料酒15克、味精3克、蛋黄液150克、干淀粉100克、大葱50克、老姜15克、熟花生油1000克（约耗70克）。","p":["初步加工：青鱼刮鳞、去腮开膛、去内脏、去头尾（另作它用）．洗净。从鱼背部入刀，剔去脊骨及胸刺，片去鱼皮留鱼肉。大葱择去老叶留葱白·老姜刮去表皮，洗净。","原料成形：鱼肉切成长约5厘米、粗细1厘米的条，葱姜拍松，湖成葱姜水。","腌溃鱼条：鱼条放器皿内，加料酒、精盐、味精、葱姜水抓拌均匀，腌渍约10分钟。","拍粉拖蛋沾芝：鱼条拍上干淀粉，然后逐条放入蛋黄液中，随即取出放芝麻上，沾裹在鱼条表面上。","烹调成菜：炒勺置旺火上，加入宽油，当油温升至四五成热时，把鱼条逐个人油浸炸至断生捞出，待油温升至七八成热时，再入油冲炸至表面呈金黄色，捞出沥油。","成品装盘：炸制好的芝麻鱼条采用“码入法”，码入器皿。"]},{"i":568,"n":"酥炸鱼条","r":"鲁菜","o":"山东菜巧作指导","f":"色泽：金黄。芡汁：无汁无芡。口味：咸鲜。质感：外酥里嫩。","c":"热菜","m":["炸"],"g":["鱼肉","鲤鱼","鸡蛋"],"s":["料酒","盐","味精","淀粉","葱","姜","椒盐"],"t":["炒锅"],"v":0,"a":"主料：鲤鱼1尾（约重500克）。｜配料：此菜无｜配料：，可酌加点缀装饰料。｜调料：料酒10克、精盐2克、味精2克、鸡蛋黄70克、干淀粉80克、大油25克、大葱20克、老姜10克、熟花生油1000克（约耗50克）、花椒盐5克。","p":["初步加工：将鱼刮鳞，去鳃开膛取出内脏，去头和尾。由鱼尾处沿脊骨片进，去掉脊骨和胸刺留鱼肉，洗净。大葱去老叶留葱白，老姜刮去表皮，洗净。","原料成形：鱼肉去掉鱼皮切成长约5厘米、1厘米见方的条状，葱白切寸段，老姜切片放碗内，用清水浸泡制成葱姜水。","腌溃鱼条：鱼条放器皿内，加料酒、精盐、味精、葱姜水腌拌均匀，腌渍约10分钟。","鱼条挂糊：鸡蛋黄置器皿内调散，加干淀粉调成糊状，再加入大油，调成油酥糊，把鱼条放入糊内拌匀。","烹调成菜：炒勺置灶口上，倒入宽油烧热，视油温升至五六成热时，将挂糊的鱼条逐条入油浸炸，视挂糊的鱼条定形后，捞出，待油温升至七八成热时，再将鱼条入油冲炸至表面呈金黄色时捞出沥油。","成品装盘：鱼条置器皿内，随椒盐上席。"]},{"i":569,"n":"抓炒鱼条","r":"鲁菜","o":"山东菜巧作指导","f":"色泽：浅棕红色。芡汁：溜芡。口味：甜酸微咸。质感：外焦里嫩。","c":"热菜","m":["爆炒"],"g":["鱼肉","草鱼"],"s":["酱油","料酒","醋","盐","白糖","高汤","葱","姜","淀粉"],"t":["炒锅"],"v":0,"a":"主料：活草鱼1尾（约重750克）。｜配料：此菜无｜配料：，可酌加点缀装饰料。｜调料：酱油5克、料酒5克、米醋10克、精盐2克、白糖15克、毛汤100克、大葱10克、老姜10克、水淀粉15克、熟花生油1000克（约耗75克）、湿淀粉100克。","p":["初步加工：将活草鱼刮鳞、去鳃、开膛取内脏，去头、尾、骨刺及鱼皮留取鱼肉洗净。大葱去根须、老叶，老姜刮去表皮洗净备用。","原料成形：将草鱼肉改刀\"成约4厘米长、1厘米粗细的条状，葱、姜均切成末。","鱼条挂糊：鱼条置器皿内，加精盐、料酒抓拌均匀，放入湿淀粉使鱼条均匀挂上水粉糊待用。","调对碗芡：把酱油、料酒、米醋、精盐、白糖、毛汤、葱末、姜末、水淀粉放入碗内调兑成碗芡备用。","烹调成荣：将炒勺置灶口上，注入宽油加热，待油温升至五六成热时，把挂好糊的鱼条逐条入油浸炸，视其定型捞出，待油温升至七八成热时，人油冲炸至鱼条体表呈浅金黄色时，倒入漏勺内沥油。炒勺内留底油，油热后倾入碗芡，芡汁熟后迅速倒入炸好的鱼条翻炒，芡汁均匀裹在鱼条上，淋入明油即可。","成品装盘：将菜肴成品采用“盛入法”盛至器Ⅲ中即成。"]},{"i":570,"n":"滑炒鱼丝","r":"鲁菜","o":"山东菜巧作指导","f":"色泽：洁白。芡汁：利汁抱芡。口味：咸鲜。质感：软嫩。","c":"热菜","m":["爆炒"],"g":["鱼肉","猪肉","冬笋","鸡蛋"],"s":["料酒","盐","味精","淀粉","葱","姜","高汤"],"t":["炒锅"],"v":0,"a":"主料：净黑鱼肉250克。｜配料：冬笋80克。｜调料：料酒2克、精盐2克、味精1克、湿淀粉10克、水淀粉10克、鸡蛋清20克、大葱10克、老姜10克、清汤20克、大油1000克（约耗50克）。","p":["初步加工：选新鲜质优的黑鱼肉片去胸刺，漂洗干净。大葱去老叶取葱白，老姜刮去表皮，洗净。","原料成形：鱼肉片去皮，切成长约5厘米、0.3厘米见方的丝。冬笋顺丝切成长约4厘米、宽约0.2厘米的细丝。葱姜切末，用清水浸泡，制成葱姜水。","主料上浆：鱼丝放碗中，加精盐、味精和料酒，再放入鸡蛋清、湿淀粉搅匀。","配荣组合：鱼丝、冬笋丝分别放配菜器皿内。","调对碗芡：清汤、精盐、料酒、味精、葱姜水、水淀粉放碗内，调成碗芡。","烹调成荣：炒勺置旺火上烧热，倒入宽油烧至三四成热，放入鱼丝滑散至伸展断生，随即放入冬笋丝预热，倒入漏勺沥油。炒勺内留底油，倒入鱼丝和冬笋丝，随即倾入碗芡翻炒，待芡汁熟透并均匀包裹住原料后，淋入明油即成。","成品装盘：菜肴采用“盛入法”盛入器皿，呈自然堆落状。"]},{"i":571,"n":"糟溜鱼片","r":"鲁菜","o":"山东菜巧作指导","f":"色泽：淡黄色。芡汁：溜芡。口味：咸甜适中，糟香味浓。质感：软嫩。","c":"热菜","m":["烧扒焖"],"g":["鱼肉","草鱼","木耳","鸡蛋"],"s":["香糟","料酒","盐","味精","白糖","淀粉","葱","姜","高汤"],"t":["炒锅"],"v":0,"a":"主料：.草鱼1尾（约重1000克）。｜配料：水发木耳25克。｜调料：香糟酒100克、精盐3克、味精5克、白糖20克、干淀粉15克、鸡蛋清40克、水淀粉20克、大葱20克、老姜10克、清汤100克、熟花生油1000克（约耗50克）、葱姜油15克。","p":["初步加工：将鱼刮鳞，去鳃，开膛取出内脏，去头尾及鱼骨（另作它用）留鱼肉，洗净。水发木耳清洗干净，大葱去老叶留葱白，老姜刮去表皮洗净备用。","原料成形：将鱼肉去鱼皮抹刀片\"成约5厘米长、3厘米宽、0.3厘米厚的片，水发木耳撕成小朵，葱白切段，老姜切片放碗内加清水泡成葱姜水。","鱼片上浆：将鱼片放器皿内，加入精盐、味精、料酒、干淀粉、鸡蛋清调拌均匀至上劲。","配荣组合：将鱼片、水发木耳放置配菜器皿内备用。","烹调成菜：先将汤勺置灶口上，加入沸水，水发木耳入水焯透后捞出，沥水，置盛菜器皿内。然后另用炒勺置灶口上，倒入宽油烧热，视油温升至四五成热“时，逐一将鱼片入油滑散至断生，倒入漏勺内沥油。炒勺置灶口上，放入香糟酒、清汤、白糖、味精、精盐。烧沸后调好口味，下鱼片转用中火加热，烧沸后，用水淀粉勾芡，待芡汁熟后淋入葱姜油，即成。","成品装盘：将烹制好的菜肴采用“拖入法”装入器皿内，覆盖在水发木耳上面。"]},{"i":572,"n":"清蒸鱼","r":"鲁菜","o":"山东菜巧作指导","f":"色泽：汤汁淡黄。芡汁：不需勾芡，略有汤汁。味：咸鲜适口。质感：软嫩。","c":"热菜","m":["蒸"],"g":["鱼肉","草鱼","猪肉"],"s":["料酒","盐","味精","葱","姜","胡椒","高汤"],"t":["蒸锅"],"v":0,"a":"主料：草鱼1尾（约重750克）。｜配料：不需｜配料：，可酌加点缀装饰料。｜调料：料酒40克、精盐5克、味精2克、大葱15克、老姜30克、胡椒粉0.5克、猪网油250克、清汤500克。","p":["初步加工：活草鱼去鳞、鳃，剖腹去内脏洗净。大葱去老叶取葱白，老姜刮去表皮，洗净。选用新鲜无异味的猪网油。","草鱼烫皮：汤勺置火上，添入清水烧沸，手提鱼尾入沸水略余烫一下取出，再放冷水中用小刀刮去鱼表面的黑膜并洗净。","原料成形：鱼体两面肉厚处各上斜·一字刀纹，每面各副6至7刀。葱白切寸段，老姜切成大片。","原料腌渍：用精盐、料酒、葱姜和胡椒粉在鱼身内外腌渍入味约20分钟。","烹调成菜：先将鱼腹朝下放在蒸盘内，上面覆盖猪网油，上汽后将其入蒸锅蒸约5分钟至断生取出，去掉猪网油、葱姜不用。汤勺置旺火上，加清汤和蒸鱼的原汁一起烧沸，撇去浮沫后加入精盐、味精，调好口味。","成品装盘：把蒸熟的鱼起放在鱼盘内摆好，将调好味的清汤浇在鱼身上即成。"]},{"i":573,"n":"干烧鲤鱼","r":"鲁菜","o":"山东菜巧作指导","f":"色泽：棕红油润。芡汁：不用勾芡，菜肴四周有多量红油分布。口味：咸辣微甜、微酸。质感：酥软。","c":"热菜","m":["烧扒焖"],"g":["鲤鱼","猪肉","冬笋","辣椒"],"s":["酱油","料酒","盐","味精","醋","白糖","蒜","高汤"],"t":["炒锅"],"v":0,"a":"主料：鲤鱼1尾（约重750克）。｜配料：肥猪肉50克、雪里50克、冬笋50克。｜调料：酱油15克、料酒25克、精盐3克、味精3克、米醋15克、白糖50克、干辣椒末5克、大蒜20克、毛汤800克、熟花生油1000克（约耗100克）。","p":["初步加工：将鱼去鳞、去鳃，开膛取内脏，洗净。大葱去老叶留葱白，老姜刮去表皮，大蒜剥去表皮，均洗净。","原料成形：鱼体两侧均刹上刀距约为0.5厘米宽的斜一字刀纹，刀口深度约为0.2厘米。肥肉切成约0.6厘米见方的丁。冬笋、雪里均切成粒状。葱白切成豆瓣葱”，姜切成似豆瓣葱大小的薄片，蒜切片备用。","浸炸主料：灼勺置灶口上，倒入宽油烧热，视油温升至七八成热时，放入鱼浸炸，至体表呈金黄色时，捞出沥油。","配荣组合：将鱼、冬笋粒、雪里粒、肥肉丁、豆瓣葱、姜片、蒜片放配菜器皿内。","烹调成菜：炒勺置灶口上，放入多量底油烧热，放豆瓣葱、姜片、蒜片、干辣椒末、肥肉丁一同煸炒至红油渗出有香味时，下入雪里粒、冬笋粒，烹入料酒、米醋，添入毛汤、酱油、精盐、味精、白糖，汤汁烧沸后调好口味和颜色，再将鱼放入汤中，转用小火焖烧约7-一8分钟后，将鱼翻身1次烧另…一面，待汤汁烧至将尽，鱼肉酥软入味时，起出鱼，用旺火将汤汁收尽淋入明油即成。","成品装盘：将鱼起出放鱼盘内，再将配料和红油浇淋在鱼身上即成。"]},{"i":574,"n":"酱汁瓦块鱼","r":"鲁菜","o":"山东菜巧作指导","f":"色泽：棕红光润。芡汁：不用勾芡，酱汁稠浓。口味：咸甜适中。质感：酥软。","c":"热菜","m":["爆炒"],"g":["鱼肉","鲤鱼"],"s":["香菜","酱油","料酒","盐","味精","白糖","黄酱","葱","高汤","姜","香油"],"t":["炒锅"],"v":0,"a":"主料：鲤鱼1尾（约重1000克)。｜配料：香菜10克。｜调料：酱油15克、料酒10克、精盐1克、味精1克、白糖30克、黄酱35克、毛汤500克、大葱25克、老姜20克、熟花生油1000克（约耗100克）、香油15克。","p":["初步加工：将鱼去鳞、去鳃，开膛取净内脏，去头、尾，从尾端沿脊骨对剖成两片洗净，香莱去根择去黄叶，大葱去老叶留葱白，老姜刮去表皮洗净。","原料成形：将鱼体表上--字花刀然后改刀成约4厘米宽的瓦块状，香菜切成末，葱白切寸段，老姜一半切薄片，另一半切末，备用。","腌渍主料：将鱼块置器皿内，加酱油、料酒、精盐、味精拌匀腌渍约30分钟即可。","主料过油：将炒勺置灶口上，倒入宽油，视油温升至七八成热时，放入鱼块冲炸，待其表面上色呈金黄色时，倒入漏勺内沥油。","配荣组合：将炸好的鱼块、香菜末、姜片、葱段、姜末置配菜器皿内，待用。","烹调成菜：将炒勺置灶口上，放入香油烧热，加黄酱煸炒出香味后，烹入料酒，添入毛汤、葱段、姜片、白糖，调好口味和颜色，再倒入鱼块，视汤汁烧沸后，转用小火烧制，待其入味汤汁渐尽时，抹弃葱段、姜片，并将鱼块取出，将汤汁用中火收浓，淋入香油即可。","成品装盘：将烹制好的鱼块整齐地码在盛菜器血内，再把·160*酱汁浇在鱼块上，撒上香菜末、姜末即成。"]},{"i":575,"n":"醋椒鲤鱼","r":"鲁菜","o":"山东菜巧作指导","f":"色泽：汤汁乳白。芡汁：不用勾芡，汤汁较宽。口味：酸辣咸鲜香。质感：酥软。","c":"热菜","m":["爆炒"],"g":["鲤鱼"],"s":["醋","香菜","料酒","盐","味精","胡椒","葱","香油","姜","高汤"],"t":["炒锅"],"v":0,"a":"主料：鲤鱼1尾（约1000克）。｜配料：香菜20克。｜调料：料酒20克、精盐5克、味精4克、米醋40克、白胡椒粉4克、香油10克、大葱50克、老姜20克、奶汤1000克、大油1000克（约耗40克）。","p":["初步加工：先将鱼刮鳞、去鳃，开膛取出内脏，冲洗干净。香菜去根及黄叶，大葱去老叶留葱白，老姜刮去表皮，洗净。","主料余烫：汤勺置灶口上，添入清水烧热，待水温度升至约70一85C时，放入鲤鱼略烫后捞出。用刀刮去鱼表皮上的黑膜，再入凉水中漂净，沥水。","原料成形：在鱼身两侧十字刀纹，刀距约2厘米，进刀深度约为0.3厘米（脊背处可稍深些）。香菜切寸段。葱白-半切成段，另一半切成眉毛葱，老姜切丝待用。","主料过油：炒勺置灶口上，倒入宽油烧热，待油温升至七八成热时，放入鱼冲炸，随即捞出沥油。","配荣组合：将鱼、香菜段、眉毛葱、葱段、姜丝置配菜器皿内待用。","烹调成菜：炒勺置灶口上，放底油烧热，加入白胡椒粉、葱段、姜丝煸炒出香味后，添入奶汤、料酒、精盐、味精烧沸后，再将鱼放入炒勺内，转用中小火煮制约15分钟，待其入味、肉质熟透后，放入米醋、香油即成。","成品装碗：鱼捞出放汤碗内，再将汤过箩滤去杂质，淋入香油倒入碗内，撒上眉毛葱、香菜段即成。"]},{"i":576,"n":"氽鱼丸","r":"鲁菜","o":"山东菜巧作指导","f":"色泽：汤汁清澈、鱼丸洁白光润。芡汁：不用勾芡，汤汁较宽。口味：咸鲜。质感：软嫩。","c":"热菜","m":["烧扒焖"],"g":["鱼肉","鸡蛋"],"s":["料酒","盐","味精","胡椒","高汤","葱","姜"],"t":["炒锅"],"v":0,"a":"主料：净黑鱼250克。｜配料：油菜12棵。｜调料：料酒3克、精盐3克、味精2克、胡椒粉0.2克、鸡蛋清50克、清汤1500克、大葱10克、老姜10克、大油5克。","p":["初步加工：用刀沿鱼脊两侧片成两扇，去掉脊骨和肋刺骨。将鱼皮朝下放在墩面上，用刀背捶砸鱼肉至松软后，刮取鱼肉。油菜去老帮取菜心，大葱去老叶取葱白，老姜刮去表皮，洗净。葱姜切末，用清水浸泡成葱姜水。","浸漂鱼肉：鱼肉放碗内，加入清水浸泡片刻，将血渍漂净，使鱼肉洁白。","鱼肉成茸：鲜猪肉皮表皮朝下铺于菜墩上，放上净鱼肉，用刀背捶成细茸。","调制鱼泥：鱼茸放碗内，加精盐、料酒、味精和清汤100克搅拌滋润，再加入鸡蛋清搅拌均匀后过箩滤去筋及小刺，添入大油搅拌滋润即成。","烹调成茶：汤勺置火上，添入清汤烧沸后移置小火上（保持水面微沸），将鱼泥挤成鱼丸入清汤余制，加精盐、料酒、味精、葱姜水调好口味，待鱼丸浮出汤面后，撇去浮沫，放入油菜心即成。","成品装碗：鱼丸、菜心和汤一起盛入大汤碗内。"]},{"i":577,"n":"葱烧海参","r":"鲁菜","o":"山东菜巧作指导","f":"色泽：棕红光润。芡汁：溜芡立。味：咸鲜微甜，葱香味浓。质感：酥软。","c":"热菜","m":["烧扒焖"],"g":["海参"],"s":["葱","酱油","料酒","盐","味精","白糖","高汤","姜","淀粉"],"t":["炒锅"],"v":0,"a":"主料：水发海参500克。｜配料：大葱200克。｜调料：酱油10克、料酒10克、精盐3克、味精2克、清汤250克、白糖5克、糖色1克、老姜20克、水淀粉30克、熟花生油75克。","p":["初步加工：海参膛内及表面用清水洗净。大葱择去老叶取葱白，老姜刮去表皮，洗净。","原料成形：海参抹刀片\"成约5厘米长、约2厘米宽的条。葱白切成约1.5厘米的段。老姜切片。","海参焯水：海参放冷水锅，加料酒、精盐烧沸，煮透捞出沥水。","配荣组合：海参、葱段、姜片放配菜器皿内。","烹调成菜：炒勺置灶口上，放油烧热，油热后放入姜片、葱段，炸出葱香味后，倒入碗内即为葱油。炒勺放约15克葱油，加入酱油、料酒、糖色、清汤、海参、精盐、味精、白糖，待汤汁烧沸后调好颜色和口味，转用中小火烧约4一5分钟，待原料入味汤汁渐少时，转用大火并用水淀粉勾芡，芡汁熟透后，淋入葱油即成。","成品装盘：菜肴采用“盛入法”装器血内，呈自然堆落状，葱段有序围码在海参周围。"]},{"i":578,"n":"乌龙戏珠","r":"鲁菜","o":"山东菜巧作指导","f":"色泽：棕红光润。芡汁：溜芡。味：咸鲜为主，略有甜味。质感：海参酥软，油菜脆嫩。","c":"热菜","m":["爆炒"],"g":["海参","鸡蛋"],"s":["酱油","料酒","盐","白糖","味精","淀粉","姜","高汤"],"t":["炒锅"],"v":0,"a":"主料：水发海参500克。｜配料：鹤鹑蛋10个、油菜20棵。｜调料：酱油20克、料酒10克、精盐3克、白糖10克、味精3克、水淀粉25克、清汤500克、老姜25克、葱姜油75克。","p":["初步加工：将海参去皮及膛内杂质洗净。油菜择去老帮、黄叶，留菜心，老姜刮去表皮，洗净。","原料成形：海参改刀成粗条状，老姜切末后放碗内加水沏成姜水。","原料熟处理：海参置沸水锅中加热焯透后捞出沥水。鹤鹑蛋置冷水锅中加热煮熟，捞出剥去外壳。油菜心放沸水锅中焯水，捞出过凉。","配荣组合：海参条、鹤鹑蛋、油菜心，分放配菜器皿内。","烹调成菜：炒勺置灶口上，放入葱姜油，油稍热后加酱油、料酒、清汤、姜水、精盐、白糖、味精，待汤烧沸调好颜色和口味，放入海参条、鹑蛋，用小火烧制待入味后，用水淀粉勾芡，视芡汁熟透发亮后，淋鸡油即成。另取炒勺置灶口上，放入底油（葱姜油），油热后放入油菜心、精盐、味精、料酒，翻炒片刻即成。","成品装盘：先将海参、鹤鹑蛋盛入盘中间，呈自然堆落状。再将油菜心有序围码在海参与鹤鹑蛋四周，呈螺旋形。"]},{"i":579,"n":"山东海参","r":"鲁菜","o":"山东菜巧作指导","f":"色泽：汤汁浅棕色。芡汁：不用勾芡，汤汁略宽。口味：以咸鲜为主，微辣微酸。质感：软嫩。","c":"热菜","m":["烧扒焖"],"g":["海参","猪肉","鸡蛋","海米"],"s":["香菜","盐","酱油","味精","料酒","醋","葱","姜","淀粉","胡椒","香油","高汤"],"t":["炒锅"],"v":0,"a":"主料：水发海参100克。｜配料：猪通脊肉50克、鸡蛋皮1张、海米10克、香菜15克。｜调料：酱油5克、精盐5克、味精3克、料酒10克、米醋3克、大葱20克、老姜10克、鸡蛋液5克、湿淀粉5克、胡椒粉1克、香油5克、鸡汤750克。","p":["初步加工：海参去净杂质，通脊肉去筋膜，香菜去根和老叶，老姜刮去表皮，大葱去老叶留葱白，洗净。海米放碗内加沸水浸泡，回软后漂洗干净。","原料成形：海参抹刀片成约5厘米长、3厘米宽、厚0.3厘米的片。鸡蛋皮切成菱形片。通脊肉顶刀切成约3厘米长、2厘米宽、0.2厘米厚的片。葱白切成眉毛葱。老姜切细丝。香菜切寸段。","肉片上浆：肉片放器皿内，加精盐、味精、湿淀粉、鸡蛋液顺向搅拌均匀。","配荣组合：海参、肉片、鸡蛋皮、海米、香菜段、葱丝、姜丝放配菜器皿内。，","初步熟处理：汤勺置灶口上加入沸水，将肉片放入水中氽熟后捞出放汤碗内，另取汤勺加水烧沸，放入海参煮制片刻，然后捞出倒入汤碗内。再将海米、鸡蛋皮、葱丝、姜丝、香菜段放汤碗内。","烹调成荣：汤勺置灶口上，倒入鸡汤，加精盐、酱油、料酒、味精、米醋、胡椒粉调好口味，视汤汁烧沸后撇去浮沫，淋入香油即成。","成品装碗：烹制好的汤采用“倒入法”装入汤碗中。"]},{"i":580,"n":"三鲜锅巴","r":"鲁菜","o":"山东菜巧作指导","f":"色泽：浅棕红。芡汁：溜芡邻口味：咸鲜：质感：锅巴酥脆、配料软嫩、脆嫩兼有。","c":"热菜","m":["爆炒"],"g":["海参","鸡肉","猪肉","虾","冬笋","白菜","香菇","鸡蛋"],"s":["料酒","酱油","味精","盐","高汤","淀粉","葱","姜"],"t":["炒锅"],"v":0,"a":"主料：锅巴75克、水发海参75克、鸡脯肉75克、青虾肉75克。｜配料：冬笋25克、油菜心25克、水发冬菇25克。｜调料：酱油10克、料酒10克、味精1克、精盐1克、毛汤300克、鸡蛋清液10克、干淀粉10克、水淀粉30克、熟花生油1000克（约耗50克）、葱姜水20克。","p":["初步加工：将水发海参膛内肠、沙洗净，鸡脯肉去筋膜、青虾仁挑去虾线，水发冬菇去柄，油菜心洗净备用。","原料成形：把锅巴成小块，水发海参、鸡脯肉抹刀成片，冬笋切成象眼片，水发冬菇切成半圆片待用。","原料上浆：把鸡片、虾肉分放器皿内，加精盐、味精、料酒、干淀粉、鸡蛋清液浆拌均匀。","原料焯水：将炒勺内注人清水置灶口加热，水沸后分别放入海参片、冬笋片、油菜心、冬菇片焯水，捞出沥水过凉。","配荣组合：把锅巴、海参片、鸡片、青虾肉、冬笋片、冬菇片、油菜心分放在配菜器皿内备用。","烹调成荣：炒勺内注入宽油置灶口上加热，待油温升至三四成热时，将鸡片、虾肉分别入油滑散至断生，倒入漏勺内沥油。炒勺内留底油加热，油热后放入冬笋片、冬菇片、海参片、鸡片、虾肉翻炒，加酱油、料酒、毛汤、葱姜水、精盐、味精调色调味，汤汁烧沸后放入油菜心，淋水淀粉勾芡，芡汁熟后倒入汤碗内待用。炒勺内注入宽油加热，油温升至七八成热时，将锅巴置油锅中，视其膨胀酥脆、呈浅金黄色时捞出，放入盘内淋少量热油即可。","成品装盘：将炸好的锅巴装盘后与芡汁一同上桌，把芡汁均匀浇在锅巴上，即可食用。"]},{"i":581,"n":"荒爆鱿鱼卷","r":"鲁菜","o":"山东菜巧作指导","f":"色泽：黄绿相间。芡汁：清汁。口味：咸鲜为主，微辣微酸。质感：脆嫩。","c":"热菜","m":["爆炒"],"g":["鱿鱼"],"s":["香菜","盐","味精","料酒","葱","姜","蒜","高汤","胡椒","醋","香油"],"t":["炒锅"],"v":0,"a":"主料：水发鱿鱼300克。｜配料：香菜50克。｜调料：精盐2克、味精2克、料酒10克、大葱20克、老姜10克、大蒜15克、清汤25克、白胡椒粉1克、米醋5克、香油5克、熟花生油1000克（约耗40克）。","p":["初步加工：鱿鱼去膜洗净。香菜去根、叶留梗，大葱去老叶留葱白，老姜刮去表皮，大蒜剥去外皮，洗净。","原料成形：在鱿鱼里侧一面上斜十字花刀，横竖刀距约0.3厘米，进刀深度约是原料厚度的4/5，再改刀成约5厘米长、4厘米宽的长方形片。香菜梗切成约3厘米长的段。葱白切成眉毛葱。老姜切细末放碗内，加水湖成姜水。大蒜切片。","鱿鱼焯水：鱿鱼置沸水锅内焯水，待其成卷后捞出。","配荣组合：鱿鱼卷、香菜段、眉毛葱、蒜片放配菜器皿内。","调对碗汁：眉毛葱、蒜片、精盐、味精、白胡椒粉、料酒、米醋、清汤、姜水、香油放碗内，调成碗汁。","烹调成菜：炒勺置灶口上，倒入宽油烧热，视油温升至七八成热时，将鱿鱼卷倒入油内，并迅速将鱿鱼卷与油倒入漏勺内，沥油。炒勺烧热放底油，倒入鱿鱼卷，随即倾入碗汁，迅速翻炒即成。","成品装盘：菜肴采用“盛入法”装入器皿内，呈自然堆落状。"]},{"i":582,"n":"虾籽烧蹄筋","r":"鲁菜","o":"山东菜巧作指导","f":"色泽：棕红光润。芡汁：溜芡の。口味：以咸鲜为主，略有回甜。质感：软嫩。","c":"热菜","m":["烧扒焖"],"g":["虾","蹄筋","猪肉","香菇","冬笋"],"s":["酱油","盐","味精","葱","姜","白糖","料酒","高汤","淀粉"],"t":["炒锅"],"v":0,"a":"主料：水发猪蹄筋500克。｜配料：水发冬菇15克、冬笋15克。｜调料：酱油25克、精盐1克、味精3克、虾籽2克、大葱5克、老姜5克、白糖2克、料酒10克、毛汤250克、水淀粉z0克、葱姜油10克、熟花生油10克。","p":["初步加工：水发猪蹄筋去尽腐肉洗净。水发冬菇去柄，大葱去老叶留葱白，老姜刮去表皮，洗净。","原料成形：水发蹄筋切成小段，水发冬菇切成月牙片。冬笋切成菱形片。葱白、老姜分别切成米状。","配菜组合：水发猪蹄筋、水发冬菇、冬笋、葱姜米放配菜器皿内。","烹调成茱：汤勺置灶口上，倒入沸水加热，放入蹄筋、冬菇、冬笋，焯透后捞出沥水。另取炒勺置灶口上，放底油烧热，加葱姜米，虾籽略煸，然后添入酱油、毛汤、料酒、精盐、味精、白糖，汤汁烧沸后调好颜色和口味，再放入蹄筋、冬菇、冬笋片，用中火烧至入味。入味后用水淀粉勾芡，视芡汁熟透发亮后淋入葱姜油即成。","成品装盘：菜肴采用“盛入法”装入器皿内，呈自然堆落状。"]},{"i":583,"n":"炸鲜贝串（做法二）","r":"鲁菜","o":"山东菜巧作指导","f":"色泽：金黄芡汁：无汁无芡。口味：咸鲜。质感：外酥里嫩。","c":"热菜","m":["炸"],"g":["鲜贝","面粉","鸡蛋"],"s":["盐","味精","料酒","胡椒","淀粉","葱","姜"],"t":["炒锅"],"v":0,"a":"主料：鲜贝250克。｜配料：面包150克。｜调料：精盐2克、味精2克、料酒10克、白胡椒粉0.5克、干淀粉15克、鸡蛋黄75克、大葱15克、老姜10克、熟花生油750克（约耗75克）。","p":["初步加工：鲜贝去筋，大葱去老叶留葱白，老姜刮去表皮，洗净。","原料成形：面包去黄皮切成小粒状。葱白切寸段。老姜切片。","腌渍主料：鲜贝放器皿内，加料酒、精盐、味精、白胡椒粉、葱段、姜片腌拌均匀，约15分钟后拣弃葱段、姜片。","拍粉拖蛋沾面包：将腌渍入味的鲜贝用竹签穿成数串。再将鲜贝串逐串拍上干淀粉，拖上蛋黄液，随即沾裹上面包粒。","烹调成荣：炒勺置灶口上，倒入宽油加热，待油温升至四五成热时，把鲜贝串入油浸炸至其表面呈浅金黄色捞出，待油温升至六七成热时入油冲炸，使其表面呈金黄色，捞出沥油。","成品装盘：将鲜贝串整齐地码放在盛菜器皿内，呈“过桥形”。"]},{"i":584,"n":"油爆鲜贝（做法四）","r":"鲁菜","o":"山东菜巧作指导","f":"色泽：洁白间碧绿。芡汁：利汁抱芡。口味：咸鲜。质感：主料软嫩，配料脆嫩。","c":"热菜","m":["爆炒"],"g":["鲜贝","黄瓜","荸荠","冬笋","鸡蛋"],"s":["盐","味精","料酒","葱","高汤","姜","淀粉"],"t":["炒锅"],"v":0,"a":"主料：鲜贝250克。｜配料：黄瓜50克（也可用南荠、莴笋等原料代替）。｜调料：精盐3克、味精2克、料酒10克、清汤25克、大葱15克、老姜10克、干淀粉10克、鸡蛋清15克、水淀粉5克、熟花生油1000克（约耗50克）。","p":["初步加工：鲜贝去筋，黄瓜去柄和尾尖，大葱去老叶留葱白，老姜刮去表皮，洗净。","原料成形：黄瓜切成约1.2厘米见方的丁，葱白切成豆瓣葱，老姜切末彻成姜水。","·鲜贝上浆：鲜贝掘干表面水分放入器皿，加精盐、味精、料酒、干淀粉、鸡蛋清顺向抓拌均匀。","配荣组合：鲜贝、黄瓜丁分放配菜器皿内。","调对碗芡：精盐、味精、料酒、清汤放碗内，加豆瓣葱、姜水、水淀粉调成碗芡。","烹调成荣：炒勺放宽油烧热，视油温升至四五成热时，放入鲜贝滑散至断生，随即放入黄瓜丁预热，倒入漏勺沥油，勺内留余油，再将主配料倒入勺内，倾入碗芡，翻炒均匀，淋入明油即成。","成品装盘：菜肴采用“盛入法”盛入器皿。"]},{"i":585,"n":"香辣鲜贝","r":"鲁菜","o":"山东菜巧作指导","f":"色泽：浅棕红。芡汁：利汁抱芡口味：咸鲜香辣。质感：软嫩。","c":"热菜","m":["爆炒"],"g":["鲜贝","冬笋","鸡蛋"],"s":["酱油","料酒","醋","盐","味精","高汤","淀粉","葱","姜","蒜","香油","辣椒油"],"t":["炒锅"],"v":0,"a":"主料：鲜贝300克。｜配料：冬笋20克、柿子椒20克。｜调料：酱油15克、料酒5克、米醋2克、精盐2克、味精3克、毛汤50克、干淀粉15克、水淀粉20克、鸡蛋液5克、大葱15克、老姜10克、大蒜10克、香油5克、辣椒油20克、熟花生油1000克（约耗40克）。","p":["初步加工：鲜贝去筋，柿子椒去蒂、籽，大葱去老叶留葱白，老姜刮去表皮，大蒜剥去表皮，洗净。","原料成形：冬笋、柿子椒分别切成小菱形片。葱白切成豆瓣葱。姜蒜切小薄片。","鲜贝上浆：鲜贝用洁净干毛巾辗干表面水分后置器皿内，加精盐、味精、料酒、干淀粉、鸡蛋液顺向搅拌均匀。","配荣组合：鲜贝、冬笋、柿子椒、豆瓣葱、姜片、蒜片分别放配菜器血内。","调对碗芡：酱油、料酒、米醋、毛汤、精盐、味精、水淀粉、豆瓣葱、蒜片、姜片放碗内调成碗芡。","烹调成荣：炒勺置灶口上，倒入宽油烧热，视油温升至四五成热时，将鲜贝入油滑散至断生后，随即放入冬笋及柿子椒预热，倒入漏勺沥油。勺内留底油，倒入鲜贝、冬笋、柿子椒及碗芡翻炒均匀，芡汁熟后淋入香油、辣椒油即成。","成品装盘：菜肴采用“盛入法”装入器皿，呈自然堆落状。"]},{"i":586,"n":"鲜贝瓜球","r":"鲁菜","o":"山东菜巧作指导","f":"色泽：色白光润。芡汁：溜芡。口味：咸鲜。质感：软嫩。","c":"热菜","m":["爆炒"],"g":["鲜贝","冬瓜","鸡蛋"],"s":["盐","味精","料酒","淀粉","葱","高汤","香油","姜"],"t":["炒锅"],"v":0,"a":"主料：鲜贝200克。｜配料：冬瓜100克。｜调料：精盐5克、味精3克、料酒5克、鸡蛋清10克、干淀粉20克、水淀粉20克、清汤50克、香油5克、大葱10克、老姜5克、熟花生油700克（约耗40克)。","p":["初步加工：鲜贝去筋洗净。冬瓜削去表皮，大葱去老叶留葱白，老姜刮去表皮，均洗净。","原料成形：冬瓜用小球勺成球状，葱白、老姜均切成末状。","鲜贝上浆：鲜贝放器血内，加精盐、味精、料酒、干淀粉、蛋清液顺向调拌均匀。","瓜球掉水：瓜球用沸水锅焯水至断生后捞出沥水。","配菜组合：鲜贝、瓜球分放配菜器血内。","烹调成菜：炒勺置灶口上，放入宽油烧热，视油温升至四五成热时，将鲜贝抖散入油滑至断生，倒入漏勺沥油。另取炒勺放底油加热，加入葱姜末略煸出香味，再放入清汤、精盐、味精和瓜球，用中火烧至入味，然后倒入鲜贝，用水淀粉勾芡，视芡汁熟透发亮后翻拌均匀，淋入香油即成。","成品装盘：菜肴采用“盛入法”装入器皿，呈自然堆落状。"]},{"i":587,"n":"清炒虾仁","r":"鲁菜","o":"山东菜巧作指导","f":"色泽：白、绿相间。芡汁：清汁。口味：咸鲜。质感：脆嫩。","c":"热菜","m":["爆炒"],"g":["虾","豌豆","鸡蛋"],"s":["盐","料酒","味精","胡椒","葱","姜","淀粉","高汤"],"t":["炒锅"],"v":0,"a":"主料：青虾仁250克。｜配料：鲜豌豆50克。｜调料：精盐2.克、料酒10克、味精2克、白胡椒粉1克、大葱25克、老姜10克，干淀粉10克、鸡蛋清10克、葱姜油10克、清汤10克、熟花生油1000克（约耗50克）。","p":["初步加工：青虾仁挑去虾线。鲜豌豆洗净。大葱择去老叶留葱白，老姜刮去表皮，洗净。","原料成形：葱白切成小豆瓣葱，老姜切末后，湖成姜水。","豌豆掉水：豌豆放沸水锅内焯水，待其呈翠绿色时，捞出过凉。．","虾仁上浆：虾仁用干毛巾掘干表面水分，放入器皿，加料酒、精盐、味精、干淀粉、鸡蛋清顺向搅至滋润。","配荣组合：虾仁、豌豆分放配菜器皿内。","调对碗汁：精盐、味精、料酒、清汤、姜水、豆瓣葱、白胡椒粉放碗内，调成碗汁。","烹调成菜：炒勺置灶口上，倒入宽油加热，视油温升至四五成热时，放入虾仁滑散至断生，随即放入豌豆，预热后即倒入漏勺沥油。再将虾仁、豌豆倒勺内，随即倾入碗汁，翻炒均匀，淋入葱姜油即成。","成品装盘：菜肴采用“盛入法”装入器皿，呈堆落状。"]},{"i":588,"n":"炒五彩虾丝","r":"鲁菜","o":"山东菜巧作指导","f":"色泽：虾丝洁白。芡汁：清汁。口味：咸鲜。质感：软嫩。","c":"热菜","m":["爆炒"],"g":["虾","香菇","火腿","冬笋","鸡蛋","白菜","木耳"],"s":["盐","味精","料酒","淀粉","葱","姜","高汤"],"t":["炒锅","蒸锅"],"v":0,"a":"主料：青虾仁200克。｜配料：水发冬菇20克、火腿20克、冬笋10克、蛋黄糕20克、油菜心12棵、水发木耳10克。｜调料：精盐3克、味精2克、料酒10克、干淀粉25克、鸡蛋清20克、清汤50克、大葱10克、老姜10克、熟猪油750克（约耗50克）。","p":["初步加工：青虾仁挑去虾线，水发冬菇去柄，水发木耳择洗干净，大葱去老叶留葱白，老姜刮去表皮与油菜心一并洗净。","原料成形：虾仁掘干表面水分，用刀背砸成茸状。火腿、水发冬菇、冬笋、水发木耳、蛋黄糕均切成长约4厘米、约0.3厘米见方的丝状。葱白切寸段、老姜切片均置碗内放清水沏成葱姜水。","调制虾泥：虾茸放置碗内，加精盐、味精、葱姜水、鸡蛋清及干淀粉顺向搅拌至滋润。","虾泥蒸制：器皿内抹一层熟猪油，把调制好的虾泥放入器皿抹平后上屉蒸约3分钟取出，晾凉后改刀成约5厘米长、约0.3厘米见方的丝。","配茶组合：虾丝、火腿丝、冬菇丝、冬笋丝、木耳丝、油菜心、蛋黄糕丝分放配菜器皿内。","调对腕汁：精盐、味精、料汤、清汤、葱姜水放碗内，调成碗汁。","烹调成荣：炒勺置灶口上，加入宽油烧热，待油温升至三四成热时，放入虾丝、冬菇丝、冬笋丝预热后倒入漏勺沥油。勺内留底油，将虾丝、冬菇丝、冬笋丝、油菜心、蛋黄糕丝、火腿丝、木耳丝放入，倒入碗汁翻炒均匀，淋入明油即成。","成品装盘：菜肴采用“盛入法”装入器血即可。"]},{"i":589,"n":"雪花虾片","r":"鲁菜","o":"山东菜巧作指导","f":"色泽：洁白。芡汁：溜芡。味：咸鲜。质感：软嫩。","c":"热菜","m":["爆炒"],"g":["虾","鸡蛋"],"s":["盐","味精","料酒","姜","高汤","淀粉"],"t":["炒锅"],"v":0,"a":"主料：青虾500克。｜配料：青红柿子椒各50克、鸡蛋清100克。｜调料：精盐4克、味精2克、料酒5克、毛姜水10克、清汤300克、熟鸡油10克、干淀粉15克、水淀粉20克、熟花生油1000克（约耗50克）。","p":["初步加工：青虾去头、尾，去壳，挑去虾线，柿子椒去蒂、去籽，均洗净。","原料成形：青虾抹刀片成片状，柿子椒切成菱形片。","虾片上浆：虾片置器Ⅲ内，加精盐、料酒、味精、干淀粉及少许蛋清调拌滋润。","配荣组合：虾片、柿子椒分别放在配菜器皿内。","烹调成：先将鸡蛋清放大碗内，用筷子顺向搅成泡沫状。炒勺置灶口上，注入宽油烧热，视油温升至四五成热时，将虾片抖散入油滑散至断生，随即将配料入油预热后，倒入漏勺沥油。另取汤勺置灶口上，放入清汤，加精盐、毛姜水、料酒、味精，汤汁烧沸后调好口味，再用水淀粉勾芡，视芡汁熟透发亮后倒入搅成泡沫的鸡蛋清，用手勺轻轻推动，待其成熟后，放入虾片及柿子椒翻炒均匀，淋入鸡油即成。","成品装盘：菜肴采用“盛入法”置器皿内，呈自然堆落状。"]},{"i":590,"n":"面包虾仁","r":"鲁菜","o":"山东菜巧作指导","f":"色泽：棕黄。芡汁：溜芡。口味：咸鲜。质感：虾仁脆嫩，面包酥脆。","c":"热菜","m":["爆炒"],"g":["面粉","虾","豌豆","青蒜","鸡蛋"],"s":["料酒","酱油","盐","味精","淀粉","高汤"],"t":["炒锅"],"v":0,"a":"主料：青虾300克。｜配料：咸面包80克、青豆15克、青蒜10克。｜调料：酱油10克、料酒10克，精盐2克、味精3克、水淀粉15克、毛汤50克、干淀粉15克、鸡蛋清25克、葱姜油10克、熟花生油1000克（约耗60克）。","p":["初步加工：青虾去头尾，去壳，并挑去虾线。面包切去表皮。青蒜去根须及老叶。青豆洗净。","原料成形：青蒜从中间剖开切寸段，面包切成约3厘米长、约0.8厘米见方的条。","虾仁上浆：虾仁放器皿内，加料酒、精盐、味精、干淀粉、鸡蛋清，顺向搅拌均匀至上劲。","配荣组合：虾仁、青豆、面包条、青蒜段置配菜器皿内。","调对碗芡：酱油、料酒、毛汤、味精、水淀粉置碗内调成碗芡","烹调成茶：炒勺置灶口上，倒入宽油烧热，视油温升至五六成热时，放入面包条浸炸至酥脆，表面金黄时捞出置器皿内，再将虾仁入油滑散，待其断生后放入青豆预热，倒入漏勺沥油，炒勺内留底油，放入虾仁、青豆，随即倾入碗芡翻炒，芡汁熟后倒入面包条及青蒜段，淋入葱姜油翻拌均匀即成。","成品装盘：成品采用“盛入法”置器皿内，呈自然堆落状。"]},{"i":591,"n":"腰丁虾仁","r":"鲁菜","o":"山东菜巧作指导","f":"色泽：棕红光润。芡汁：利汁抱芡口味：酸咸适口。质感：脆嫩。","c":"热菜","m":["爆炒"],"g":["猪腰","虾","荸荠","豌豆"],"s":["料酒","酱油","盐","高汤","醋","淀粉","葱","姜","蒜"],"t":["炒锅"],"v":0,"a":"主料：猪腰子150克、虾仁150克。｜配料：南荠25克、青豆25克。｜调料：酱油15克、料酒10克、清汤40克、精盐1克、米醋20克、水淀粉15克、干淀粉10克、大葱10克、老姜10克、大蒜10克、熟花生油750克（约耗50克）。","p":["。","初步加工：将腰子片开，片去腰躁。虾仁挑去虾线，洗净。大葱去根须留葱白，老姜刮去表皮、大蒜去表皮洗净备用。","原料成形：在腰子剖面上刀距0.2厘米宽的十字花刀，然后改刀成约1.5厘米见方的丁状。南荠切丁，葱姜蒜切成米待用。","夏丁悼水：将炒勺置于灶口，注入沸水加热，水沸后把腰丁放入沸水锅内焯水，遇热后迅速捞出沥水。","虾仁上浆：洗净的虾仁掘干水分后放器皿内，加料酒、精盐、干淀粉抓拌均匀待用。","调对豌芡：将酱油、料酒、清汤、水淀粉、葱米、姜米、蒜米、米醋放入碗内，调成碗芡备用。","配菜组合：把腰丁、浆好的虾仁、南荠丁、青豆分放在配菜器皿内待用。","烹调成菜：炒勺内倒入宽油，置灶口上加热，视油温至四五成热时，将虾仁入油滑散，随即放入南荠丁、青豆，遇热后倒入漏勺内沥油。勺内留底油，倒入腰丁、虾仁、南荠丁、青豆翻炒片刻后，倾入碗芡，视芡汁均匀包裹住原料，且芡汁熟后淋入明油即可。","成品装盘：将成品采用“盛入法”置器皿内，呈堆落状。"]},{"i":592,"n":"生大虾","r":"鲁菜","o":"山东菜巧作指导","f":"色泽：鲜红光润。芡汁：不用勾芡，略有浓汁。口味：咸甜适中。质感：软嫩。","c":"热菜","m":["爆炒"],"g":["虾"],"s":["盐","味精","白糖","料酒","醋","高汤","葱","姜"],"t":["炒锅"],"v":0,"a":"主料：对虾14只（约重1000克）。｜配料：此菜无｜配料：，可酌加点缀装饰料。｜调料：精盐3克、味精2克、白糖15克、料酒20克、米醋2克、清汤200.克、大葱25克、老姜15克、熟花生油70克。","p":["初步加工：大虾剪去腿、须和头部前端，并剪开虾背壳，挑出虾线，再从虾头部剪开一个小口，挑出沙袋。大葱去老叶留葱白，老姜刮去表皮，洗净。","原料成形：在对虾脊背部逐个横划一刀，再逐个等分剁成两段。葱白切段，老姜切厚片。","配菜组合：虾段、葱段、姜片放配莱器皿内。","烹调成茶：炒勺置灶口上，放入底油烧热，加葱段、姜片煸炒出香味后，转用中小火放入对虾煎出红油，待对虾表面颜色加深，烹入料酒、米醋，添入清汤、精盐、味精、白糖，用微火制约10分钟，待虾熟汁渐少时，将对虾取出。将勺内汤汁中的葱段、姜片抹弃，淋入明油用中火收浓滋汁并炒透发亮即可。","成品装盘：将虾段按虾原形摆放整齐，淋上滋汁即成。"]},{"i":593,"n":"清炒凤尾虾","r":"鲁菜","o":"山东菜巧作指导","f":"．色泽：主料粉红、配料碧绿。芡汁：清汁。味：咸鲜。质感：脆嫩。","c":"热菜","m":["爆炒"],"g":["虾","辣椒","鸡蛋"],"s":["盐","味精","料酒","高汤","淀粉","葱","姜"],"t":["炒锅"],"v":0,"a":"主料：青虾500克。｜配料：青椒50克。｜调料：精盐1克、味精1克、料酒10克、清汤30克、熟花生油750克（约耗50克）、干淀粉10克、鸡蛋清10克、葱姜水5克。","p":["初步加工：将青虾去头、壳、留尾，挑去虾线。青椒去柄、籽，洗净备用。","原料成形：顺沿虾背部轻划一刀，青椒改刀成菱形片待用。","主料上浆：把虾放器皿内，加精盐、料酒、味精、干淀粉、鸡蛋清抓拌均匀。","调对碗汁：将精盐、味精、料酒、葱姜水、清汤置碗内，调兑成碗汁。","配荣组合：把浆好的虾肉、青椒片分放在配菜器皿内备用。","烹调成茶：炒勺内注入宽油，置灶口上加热，待油温升至四五成热时，把浆好的虾肉放入油中滑至断生，随即放入青椒片，遇热后倒入漏勺内沥油。勺内留少许底油，虾肉、青椒片回勺，倒入碗汁迅速翻炒均匀，淋入明油即可。"]},{"i":594,"n":"翡翠虾环","r":"鲁菜","o":"山东菜巧作指导","f":"色泽：虾肉粉红、黄瓜翠绿。芡汁：清汁。口味：咸鲜。质感：脆嫩。","c":"热菜","m":["爆炒"],"g":["虾","黄瓜","鸡蛋"],"s":["盐","味精","淀粉","葱","姜","高汤"],"t":["炒锅"],"v":0,"a":"主料：青虾500克。｜配料：黄瓜150.克。｜调料：精盐2克、味精1克、干淀粉10克、鸡蛋清10克、清汤30克、葱姜水10克、熟花生油750克（约耗25克）。","p":["初步加工：将青虾去头、壳，留尾。挑去虾线，黄瓜去头、尾、心，均洗净备用。","原料成形：将黄瓜顶刀切成约0.3厘米厚的片待用。","主料上浆：把虾放器皿中，加精盐、味精、料酒、干淀粉、鸡蛋清抓拌均匀。","调对碗汁：把精盐、味精、料酒、清汤、葱姜水放入碗内调兑成碗汁备用。","配茶组合：取虾肉一只、黄瓜一片，由虾尾部穿入黄瓜片，中央，使黄瓜紧套在虾肉上，依此法将其余虾肉、黄瓜片穿在一起，置配菜器Ⅲ内备用。","烹调成荣：炒勺内注入宽油，置灶口上加热，视油温升至四五成热时，把虾肉放入油中，待其断生后，倒入漏勺内沥油。勺内留底油，倒入虾肉烹入碗汁，迅速翻炒淋明油即可。","盛品装盘：将成品采用“盛入法”置器皿内，呈堆落状。"]},{"i":595,"n":"玉米大虾","r":"鲁菜","o":"山东菜巧作指导","f":"色泽：芡汁洁白，原料红、黄、绿色交相辉映。芡汁：溜芡。口味：咸鲜。质感：软嫩。","c":"热菜","m":["蒸"],"g":["虾","猪肉","白菜","萝卜","鸡蛋"],"s":["盐","味精","料酒","淀粉","葱","姜","高汤","胡椒"],"t":["炒锅","蒸锅"],"v":0,"a":"主料：鲜大虾肉250克、熟玉米粒75克。｜配料：嫩油菜心75克、胡萝卜75克、猪肥膘25克。｜调料：精盐1克、味精1克、料酒5克、鸡蛋清15克、干淀粉15克、清汤25克、熟鸡油10克、葱姜水10克、白胡椒粉0.5克、水淀粉5克。","p":["初步加工：将大虾肉挑去沙线，油菜心去根蒂，胡萝卜去表皮，肥膘均洗净待用。","原料成形：把大虾肉及肥膘切成小米粒状，油菜心略加修整，胡萝卜改刀切成细丝备用。","原料焯水：将油菜心、胡萝卜丝分别置沸水锅内焯水，捞出待用。","调制馅心：把虾、肥膘粒置容器内，加葱姜水、精盐、味精、白胡椒粉、鸡蛋清、料酒、干淀粉调拌均匀。","配菜组合：将调好味的馅心挤成橄榄形（长约5厘米、宽约1厘米）再把熟玉米粒有序地镶嵌在其表面上，依此法将其余的馅心及熟玉米粒制成“小玉米”的形状，置盘内待用。","烹调成荣：将“小玉米”放蒸锅内，用中火加热至熟后，取出。另将炒勺放置灶口上加清汤、葱姜水、精盐、味精调好口味，汤汁烧沸后加水淀粉勾薄芡，待芡汁熟后淋入熟鸡油即可。","成品装盘：将胡萝卜丝堆置盘子的中心，熟小玉米逐一地镶在油菜心内，菜心朝胡萝卜丝呈放射形摆放整齐，再把芡汁均匀地淋在小玉米及菜心上即成。"]},{"i":596,"n":"炸虾球","r":"鲁菜","o":"山东菜巧作指导","f":"色泽：金黄。芡汁：无汁无芡。口味：咸鲜。质感：外酥里嫩。","c":"热菜","m":["炸"],"g":["虾","猪肉","荸荠","面粉","鸡蛋"],"s":["白糖","盐","味精","料酒","葱","姜","淀粉"],"t":["炒锅"],"v":0,"a":"主料：青虾500克。｜配料：猪肥膘肉50克、罐装清水南荠25克、配餐无糖咸味面包150克。·｜调料：精盐2克、味精1克、料酒10克、葱姜水15克、干淀粉100克、鸡蛋液100克、熟花生油1000克（约耗50克）。","p":["初步加工：青虾去头、尾及壳，挑去虾线，猪肥膘肉去皮并洗净。配餐面包切去四边待用。","原料成形：将青虾肉、猪肥膘肉、南荠、配餐面包分别切成米粒状。","调制虾馅：将切好的青虾肉、猪肥膘肉、南荠放一器皿内，加入料酒、精盐、味精、葱姜水、鸡蛋液、干淀粉顺向调拌均匀备用。","挤制虾球：把调制的虾馅，用手挤制成直径约2厘米的圆球形，放置器血内待用。","虾球挂糊：将虾球逐一进行拍粉（干淀粉），然后拖入蛋液，最后上一层面包粒即可。","烹调成菜：炒匀内注入宽油置灶口上加热，待油温升至四五成热时，将挂糊的虾球入油浸炸，视其定型、呈金黄色，且虾球浮至油面时，倒入漏勺沥油即可。","成品装盘：将成品采用“倒入法”装入盛菜器皿中即成。"]},{"i":597,"n":"炸藕盒","r":"鲁菜","o":"山东菜巧作指导","f":"色泽：金黄。芡汁：无汁无芡。口味：咸鲜。质感：外脆里嫩。","c":"热菜","m":["炸"],"g":["猪肉","鸡蛋","面粉"],"s":["酱油","盐","味精","料酒","淀粉","葱","姜","香油"],"t":["炒锅"],"v":0,"a":"主料：鲜藕250克。｜配料：猪肥瘦肉馅100克。｜调料：酱油5克、精盐3克、味精2克、料酒2克、鸡蛋液70克、湿淀粉10克、面粉50克、大葱10克、老姜5克、香油2克、熟花生油1000克（约耗50克）。","p":["初步加工：鲜藕刮净表皮洗净，大葱去老叶留葱白，老姜刮去表皮，洗净。·","鲜藕焯水：鲜藕放入冷水锅内焯水后，过凉沥水。","原料成形：鲜藕顶刀切成合页片，厚度约0.3厘米。葱白、老姜切末。","调制馅心：肥瘦肉馅放器皿内，加入葱末、姜末、酱油、料酒、香油、湿淀粉、精盐、味精，顺向调拌均匀至上劲。","填制藕盒：将调好的肉馅分别填在合页形藕片之间，制成藕盒。","藕盒挂糊：鸡蛋液放碗内，放入面粉调成全蛋糊，再将藕盒放入逐个挂糊。","烹调成茶：炒勺置灶口上，倒入宽油烧热，视油温升至五六成热时，将挂糊的藕盒入油浸炸，待藕盒浮起，油表面气泡渐小且匀时，藕盒表面呈金黄色后，捞出沥油。","成品装盘：藕盒逐个码放在器皿内即可。"]},{"i":598,"n":"红烧茄子（做法二）","r":"鲁菜","o":"山东菜巧作指导","f":"色泽：芡汁棕红光润。芡汁：溜芡の。口味：咸鲜微甜、微酸，蒜香味浓。质感：软嫩。","c":"热菜","m":["烧扒焖"],"g":["茄子","猪肉","鸡蛋"],"s":["酱油","料酒","醋","盐","味精","白糖","淀粉","葱","高汤","姜","蒜","香油"],"t":["炒锅"],"v":0,"a":"主料：茄子500克。｜配料：猪肥瘦肉100克、柿子椒80克。｜调料：酱油10克、料酒5克、米醋3克、精盐3克、味精3克、白糖5克、水淀粉15克、湿淀粉10克、鸡蛋液10克、毛汤150克、大葱15克、老姜10克、大蒜20克、熟花生油1000克（约耗80克）、香油10克。","p":["初步加工：猪肥瘦肉洗净。茄子去蒂去皮，柿子椒去蒂去籽，大葱去老叶留葱白，老姜刮去表皮，洗净。","原料成形：茄子切成厚约3厘米的大片，然后改刀呈鱼鳃块。猪肥瘦肉顶刀切成长约3厘米、宽约2厘米、厚约0.2厘米的片。柿子椒切成小块。葱白切豆瓣葱，老姜切末，大蒜剁成末。","肉片上浆：肉片放器皿内，加酱油、料酒、精盐、味精、湿淀粉、鸡蛋液顺向搅拌均匀。","配荣组合：茄子块、柿子椒、肉片、豆瓣葱、姜末，蒜末分放配菜器血内。","烹调成茶：炒勺置灶口上，加入宽油烧热，视油温升至兰四成热时，将肉片入油滑散至断生，随即放柿子椒预热后迅速捞出。油勺继续加热，待油温升至五六成热时，放入茄子块浸炸至表面呈金黄色时倒入漏勺沥油。勺内留底油烧热，然后依次加入豆瓣葱、姜末、酱油、料酒、毛汤、精盐、味精、白糖、米醋及炸好的茄子块，调好颜色和口味后放入肉片、柿子椒，待入味后用水淀粉勾芡，芡汁熟后放入蒜末翻炒均匀，淋入香油即成。","成品装盘：菜肴采用“盛入法”装入器血，呈自然堆落状。"]},{"i":599,"n":"炒金针菇","r":"鲁菜","o":"山东菜巧作指导","f":"色泽：棕、黑、白三色相间。芡汁：清汁口味：咸鲜。质感：脆嫩。","c":"热菜","m":["爆炒"],"g":["香菇","冬笋"],"s":["盐","味精","料酒","高汤","葱","姜"],"t":["炒锅"],"v":1,"a":"主料：鲜金针菇250克（也可用罐装金针菇代用）。｜配料：水发冬菇50克、冬笋50克。‘｜调料：精盐3克、味精2克、料酒5克、清汤20克，大葱30克、老姜25克、葱椒油25克、熟花生油20克。","p":["初步加工：金针菇去根须，水发冬菇去柄，大葱去叶留葱白，老姜刮去表皮，洗净。","原料成形：水发冬菇、冬笋均切成约5厘米长，约0.2厘米见方的丝。葱白切成眉毛葱，姜切成细丝。","原料绰水：金针菇、冬菇丝、冬笋丝置沸水锅内，焯制片刻捞出沥水。","配茶组合：金针菇、冬笋丝、冬菇丝、葱丝、姜丝分放配菜器皿内。","烹调成菜：炒勺置灶口上加底油，油热后放姜丝、葱丝，煸炒出香味后放入冬笋丝、冬菇丝、金针菇，加料酒、清汤、精盐、味精翻炒片刻，淋入葱椒油即成。","成品装盘：菜肴采用“盛入法”放器皿内，呈自然堆落状。"]},{"i":600,"n":"口蘑菜心","r":"鲁菜","o":"山东菜巧作指导","f":"色泽：浅棕黄色。芡汁：溜芡の。口味：咸鲜。质感：软嫩。","c":"热菜","m":["爆炒"],"g":["口蘑","白菜"],"s":["盐","酱油","味精","淀粉","高汤"],"t":["炒锅"],"v":1,"a":"主料：小白菜500克。｜配料：水发口蘑50克。｜调料：酱油5克、精盐3克、味精2克、水淀粉20克、清汤250克、花椒油35克。","p":["初步加工：小白菜去根须、老叶、留菜心并洗净，水发口蘑去蒂洗净。","原料成形：小白菜心根部削整齐，水发口蘑抹刀片成厚片。","原料博水：菜心放沸水锅内焯水，过凉沥水，另起沸水锅把口蘑片放入焯水后捞出。","配茶组合：小白菜心、口蘑片放配菜器皿内。","烹调成茶：炒勺置灶口上，加入清汤、酱油、口蘑片、精盐、味精及小白菜心，用小火将汤汁烧沸，调好颜色和口味，再用水淀粉勾芡翻炒均匀，待芡汁熟透后淋入花椒油即成。","成品装盘：菜肴采用“倒入法”倒入器皿内即可。"]},{"i":601,"n":"海米扒菜心","r":"鲁菜","o":"山东菜巧作指导","f":"色泽：芡汁乳白光润。芡汁：溜芡の。口味：咸鲜。质感：软嫩。","c":"热菜","m":["烧扒焖"],"g":["海米","白菜"],"s":["盐","味精","料酒","高汤","淀粉","葱","姜"],"t":["炒锅"],"v":0,"a":"主料：油菜心500克。｜配料：海米25克。｜调料：精盐2克、味精2克、料酒5克、清汤200克、水淀粉20克、鸡油10克、熟花生油25克、大葱10克、老姜5克。","p":["初步加工：将油菜去根，去老帮、老叶，留菜心，海米放碗内加温水泡软，大葱去老叶留葱白，老姜刮去表皮，洗净。","原料成形：用小刀将菜心根部修整齐，上十字刀纹。葱白、老姜均切成丝状。","莱心焯水：菜心放沸水锅中焯水，捞出过凉沥水：","配茶组合：先将海米放配菜盘中，再将菜心整齐地码放在海米上面。","烹调成菜：炒勺置灶口上，放底油，加葱姜丝煸炒出香味后，添入清汤、料酒、精盐、味精，调好口味，轻轻地推入海米-及油莱心，待其入味后用水淀粉勾芡，芡汁熟透后淋入鸡油，大翻勺即成。","成品装盘：菜肴采用“拖入法”装器皿内。"]},{"i":602,"n":"糟煨白","r":"鲁菜","o":"山东菜巧作指导","f":"色泽：浅黄色。芡汁：溜芡”。口味：咸鲜微甜，糟香味浓。质感：软嫩。","c":"热菜","m":["炖煨"],"g":["香菇","冬笋"],"s":["香糟","盐","味精","白糖","料酒","高汤","淀粉","葱","姜"],"t":["炒锅"],"v":1,"a":"主料：菱白500克。｜配料：水发冬菇20克、冬笋25克。｜调料：精盐2克、味精2克、白糖2克、香糟酒25克、清汤150克、水淀粉20克、大葱10克、老姜10克、葱姜油10克、熟花生油*50克。","p":["初步加工：茭白削去表皮洗净。水发冬菇去柄，大葱去老叶留葱白，老姜刮去表皮，洗净。","原料成形：白切成大滚料块。水发冬菇切成月牙片。冬，笋切成菱形片。葱白、老姜切成米状。","配荣组合：茭白块、冬菇片、冬笋片、葱姜米放置配菜器皿中。","烹调成茱：炒勺置灶口上，放底油烧热，加葱姜米煸炒出香味，放入菱白块，烹入香糟酒，加入冬菇片、冬笋片，添入清汤、精盐、味精、白糖、汤汁烧沸后调好口味，转用小火煨制，待其入味转用旺火，用水淀粉勾芡，视芡汁熟后，翻拌均匀，淋入葱姜油即成。","成品装盘：菜肴采用“盛入法”装入器皿内，呈自然堆落状。"]},{"i":603,"n":"素烧豆腐","r":"鲁菜","o":"山东菜巧作指导","f":"色泽：棕红光润。芡汁：溜芡。口味：咸鲜为主，略带甜味。、质感：酥软。","c":"热菜","m":["烧扒焖"],"g":["豆腐","木耳"],"s":["酱油","料酒","盐","味精","白糖","淀粉","高汤","香油","葱","姜"],"t":["炒锅"],"v":1,"a":"主料：北豆腐250克。｜配料：油菜100克、水发木耳25克。｜调料：酱油10克、料酒10克、精盐3克、味精2克、白糖5克、水淀粉15克、毛汤300克、香油10克、熟花生油1000克（约耗50克）、大葱15克、老姜10克。","p":["初步加工：油菜去根、老帮、黄叶，水发木耳择去杂质，大葱去老叶留葱白，老姜刮去表皮，洗净。","原料成形：豆腐切成长约5厘米、宽约3厘米、厚约0.4厘米的片。木耳撕成小朵。油菜抹刀片成片状。葱白切成豆瓣葱。老姜切片后放碗内用清水浸泡成姜水。","配荣组合：豆腐片、油菜、水发木耳、豆瓣葱分别放配菜器皿内。","烹调成菜：炒勺置灶口上加宽油，视油温升至七八成热时，将豆腐片入油浸炸至表面呈金黄色，倒入漏勺沥油。另取炒勺加底油，放入豆瓣葱、酱油、姜水、料酒、精盐、味精、毛汤、白糖烧沸后找好颜色和口味。放入炸好的豆腐片转用中火烧制，待其入味，加入木耳、油菜，再用水淀粉勾芡，视芡汁熟透后淋入香油。","成品装盘：菜肴采用“盛入法”放器皿内，呈自然堆落状。"]},{"i":604,"n":"红烧豆腐丸子","r":"鲁菜","o":"山东菜巧作指导","f":"色泽：棕红光润。芡汁：溜芡の。口味：咸鲜微甜。质感：酥软。","c":"小吃","m":["烧扒焖"],"g":["豆腐","黄瓜","木耳","冬笋","鸡蛋"],"s":["料酒","酱油","醋","盐","味精","白糖","淀粉","葱","姜","高汤","香油"],"t":["炒锅"],"v":1,"a":"主料：南豆腐250克。｜配料：黄瓜75克、水发木耳25克、冬笋15克。｜调料：酱油10克、料酒5克、米醋5克、精盐3克、味精2克、白糖2克、干淀粉25克、鸡蛋黄50克、水淀粉15克、毛汤300克、大葱15克、老姜10克、香油10克、熟花生油1000克（约耗50克）。","p":["初步加工：黄瓜去柄，水发木耳去杂质，大葱择去老叶留葱白，老姜刮去表皮，洗净。","原料成形：南豆腐过箩制成茸状。冬笋切成末状。黄瓜切成菱形片。水发木耳撕成小朵。葱白切成豆瓣葱。老姜切片放碗内加清水沏成姜水。","调豆腐茸：豆腐茸放器皿内，加精盐、味精、鸡蛋黄、冬笋末、干淀粉，顺向搅拌均匀。","配茱组合：豆腐茸、黄瓜片、豆瓣葱、水发木耳分放配莱器皿内。","烹调成荣：炒勺置灶口上，倒入宽油烧热，视油温升至五六成热时，用手将豆腐茸挤制成直径2.5厘米的丸子，放入油中浸炸，待其定形表面呈金黄色时，倒入漏勺沥油，勺内留底油，放入豆瓣葱略煸出香味，再放入酱油、料酒、毛汤、姜水、米醋、精盐、味精、白糖，汤汁烧沸后调好颜色和口味，倒入炸好的丸子，用小火将丸子烧制入味，待丸子松软后再放入木耳、黄瓜片，用水淀粉勾芡，视芡汁熟透发亮后淋入香油即成。","成品装盘：菜肴采用“盛入法”装入器皿，呈自然堆落状。"]},{"i":605,"n":"清汤银耳","r":"鲁菜","o":"山东菜巧作指导","f":"色泽：汤汁清澈。芡汁：不用勾芡，汤汁较宽。味：咸鲜。质感：脆嫩。","c":"甜品","m":["烩汆"],"g":["豌豆"],"s":["高汤","盐","料酒","胡椒"],"t":["炒锅"],"v":1,"a":"主料：水发银耳25克。｜配料：豌豆苗10克。｜调料：清汤1500克、精盐4克、料酒10克、白胡椒粉0.5克。","p":["初步加工：选择洁白的水发银耳并去蒂及杂质，豌豆苗均洗净。分放配莱器皿内。","烹调成荣：先将银耳撕成小朵。汤勺置灶口上，添入清汤，加精盐、白胡椒粉、银耳烧沸后撇去浮沫，用小火加热约10分钟即成。"]},{"i":606,"n":"余虾蘑海","r":"鲁菜","o":"山东菜巧作指导","f":"色泽：原料粉红、褐、绿三色相间。芡汁：汤汁较宽。口味：咸鲜。质感：脆嫩、软嫩兼有。","c":"热菜","m":[],"g":["虾","口蘑","海参"],"s":["香菜","盐","味精","料酒","胡椒","高汤"],"t":["炒锅"],"v":0,"a":"主料：大虾100克、水发口蘑50克、水发海参50克。｜配料：香菜10克。｜调料：精盐1克、味精1克、料酒10克、白胡椒粉0.5克、清汤500克。","p":["初步加工：将大虾去头、尾及壳，挑去虾线。水发海参、水发口蘑、香菜洗净。","原料成形：把大虾肉、水发口蘑、水发海参片成大片·香菜切寸段。","原料焯水：汤勺内注入清水置灶口上加热，水沸后分别将大虾肉片、水发口蘑片、水发海参片放入沸水锅内进行焯水处理。然后把上述原料捞出沥水，放汤碗中待用。","烹调成茶：将汤勺置灶口上，放入清汤加热，添加料酒、精盐、味精、白胡椒粉调味，汤沸后撇去浮沫即可。","成品装碗：将汤汁采用“倒入法”倒入盛有汤料的汤碗中，撒上香菜段即成。"]},{"i":607,"n":"酸辣汤","r":"鲁菜","o":"山东菜巧作指导","f":"色泽：浅棕黄色。芡汁：米汤芡。口味：酸辣咸鲜。质感：软嫩。","c":"汤羹","m":["烩汆"],"g":["豆腐","鸡肉","鸡蛋"],"s":["高汤","香菜","酱油","料酒","醋","盐","味精","胡椒","淀粉","蒜","香油","葱","姜"],"t":["炒锅"],"v":0,"a":"主料：南豆腐50克、鸡血豆腐50克。｜配料：鸡蛋皮5克、香菜5克。｜调料：酱油3克、料酒5克、米醋10克、精盐5克、味精2克、白胡椒粉3克、水淀粉20克、毛汤500克、香油2克、大蒜10克、大葱15克、老姜10克。","p":["初步加工：南豆腐、鸡血豆腐用清水洗净。香菜去根须、黄叶，大葱去老叶，留葱白，老姜刮去表皮，大蒜剥去外皮，洗","原料成形：南豆腐、鸡血豆腐切成约5厘米长、0.4厘米见方的丝。香莱切成末、鸡蛋皮切成0.3厘米宽的丝。葱白切成眉毛葱，姜切丝，蒜切片。","豆腐掉水：南豆腐丝、鸡血豆腐丝置沸水锅内焯水，预“热后即捞出沥水。","配菜组合：南豆腐丝、鸡血豆腐丝、蛋皮丝、香菜末、眉毛葱、蒜片、姜丝放配菜器皿内。","烹调成茶：汤勺置灶口上，将汤倒入勺内，加酱油、料酒、精盐、味精、姜丝、蒜片，汤汁烧沸后调好口味和颜色，放入南豆腐丝，用水淀粉勾芡。视芡汁熟后放入米醋搅匀即成。","成品装碗：将烹好的汤采用“倒入法”倒汤碗内，然后再在汤面上均匀撒上白胡椒粉、香菜末、蛋皮丝、眉毛葱，淋入香油即可上桌，食用时调匀。"]},{"i":608,"n":"拔丝莲子","r":"鲁菜","o":"山东菜巧作指导","f":"色泽：金黄。芡汁：不用勾芡，糖浆紧裹在主料上。口味：甜香。质感：外脆里嫩。","c":"甜品","m":["蒸"],"g":["莲子","面粉"],"s":["白糖","淀粉"],"t":["炒锅","蒸锅"],"v":1,"a":"主料：净莲子100克。｜配料：青红丝5克。｜调料：白糖150克、干淀粉150克、面粉100克、熟花生油1000克（约耗50克）。","p":["初步加工：莲子放器皿内加热水浸泡，然后放入蒸锅内，约蒸15分钟后取出，沥水，去尽莲子芯洗净。","莲子拍粉：莲子置沸水锅中略余即出，沥水，沾裹上一层干淀粉及面粉。","配菜组合：莲子及青红丝放配菜器皿内。","烹调成茶：炒勺置灶口上，勺内倒入宽油烧热，视油温升至五六成热时，下入莲子浸炸至表面呈浅黄色时，倒入漏勺沥油，勺内留少许底油，放入白糖用小火炒至完全溶化呈金黄色时，将莲子放入糖浆中翻拌均匀，撒入青红丝即成。","成品装盘：菜肴采用“倒入法”装入器皿内，呈堆落状。土桌时蘸凉开水后食用。"]},{"i":609,"n":"茄汁苹果","r":"鲁菜","o":"山东菜巧作指导","f":"色泽：芡汁粉红。芡汁：溜芡@。口味：甜酸。质感：软嫩。","c":"甜品","m":["炸"],"g":["西红柿","鸡蛋","面粉"],"s":["盐","白糖","淀粉","姜"],"t":["炒锅"],"v":1,"a":"主料：国光苹果300克。｜配料：此菜无｜配料：，可酌加点缀装饰料。｜调料：精盐0.5克、番茄酱15克、白糖15克、鸡蛋清100克、干淀粉10克、面粉10克、姜水20克、水淀粉10克、熟花生油750克（约耗50克）。","p":["初步加工：将苹果削去表皮、核，洗净备用。","主料成形：苹果切成约3厘米长、0.5厘米见方的条状，然后削成橄榄形待用。","调制蛋泡糊：将鸡蛋清放大碗内，用打蛋器顺向抽打成蛋泡状，加入面粉、干淀粉调成糊状备用。","烹调成荣：将炒勺内倒入宽油置灶口上加热，待油温升至四五成热时，把苹果逐条挂上蛋泡糊，放入油中浸炸，视其膨账定型呈浅黄时捞出。待油温升至六七成热时入油冲炸至表面星金黄倒入漏勺沥油。炒勺留底油，放入番茄酱、姜水、清水、精盐加热，待汤汁烧沸后，倒入炸好的苹果条，加白糖调味，苹果条烧透入味后，用水淀粉勾芡，视芡汁熟透发亮淋入明油即可。","成品装盘：将菜品采用“盛入法”装入器皿中，呈自然堆落状。"]},{"i":610,"n":"拔丝苹果（做法二）","r":"鲁菜","o":"山东菜巧作指导","f":"色泽：金黄。芡汁：无汁无芡，糖浆均匀包裹在主料上。口味：甜香。质感：脆嫩。","c":"甜品","m":["爆炒"],"g":["芝麻","面粉"],"s":["白糖","淀粉"],"t":["炒锅"],"v":1,"a":"主料：国光苹果300克。｜配料：芝麻10克。｜调料：白糖100克、面粉500克、干淀粉20克、发酵粉2克、熟花生油1000克（约耗50克）。","p":["初步加工：苹果去皮、核，洗净。","原料成形：苹果切成长约3厘米、宽约1厘米见方的条状，或改刀成桔瓣状，然后再将苹果条均匀沾裹上一层干淀粉，待用。","调制发粉糊：面粉放碗内，加发酵粉、水调制成发粉糊。","炒制芝麻：芝麻放勺内用小火炒熟。","烹调成荣：炒勺置灶口上，加入宽油烧热，视油温升至四五成热时，将苹果条逐个挂上发粉糊入油浸炸，待其膨胀定型呈浅黄时捞出。待油温升至六七成热时再次入油冲炸，倒入漏勺沥油。另取炒勺，放少许清水，加入白糖炒至完全溶化呈金黄色时，倒入苹果翻勺，此时将炒勺离火，边翻勺边撒芝麻，使糖浆和芝麻均匀包裹在苹果上后即成。","成品装盘：菜肴采用“倒入法”装入器血呈堆落状。为使糖汁香脆，上席时随凉开水碗，供食时蘸用。"]},{"i":611,"n":"蜜汁鲜桃","r":"鲁菜","o":"山东菜巧作指导","f":"色泽：浅黄。芡汁：不用勾芡，糖浆粘浓并依附在原料上。口味：甜香。质感：软嫩。","c":"甜品","m":["蒸"],"g":["山楂"],"s":["白糖","蜂蜜"],"t":["蒸锅"],"v":1,"a":"主料：鲜桃500克。｜配料：山楂糕15克。｜调料：白糖100克、蜂蜜25克、糖桂花2克、清水100克。","p":["初步加工：鲜桃洗净，放沸水中稍烫后，剥去表皮。","原料成形：鲜桃用刀从中间对剖成两瓣，去桃核，再改刀","成月牙瓣，山楂糕切成1厘米见方的丁。","配荣组合：鲜桃瓣及山楂糕丁放配菜器皿内。","烹调成荣：白糖15克放碗内，整齐地把桃瓣摆入，再撒些白糖，上屉蒸制约10分钟，致使其软嫩，取出去汤汁，把桃翻扣在器皿上。另取汤勺置灶口上，加清水、白糖，用微火烧沸，加入蜂蜜、糖桂花搅匀，视糖汁熬至粘稠后即成。","成品装盘：在桃上浇淋，在其表面撒上山楂糕丁即成。"]},{"i":612,"n":"余黄管脊髓","r":"鲁菜","o":"中国菜谱·山东","f":"特点此菜汤汁清澈，呈淡黄色，味道香醇，常作筵席汤菜。","c":"热菜","m":["烧扒焖"],"g":["猪肉"],"s":["高汤","酱油","盐","葱","花椒","料酒","味精"],"t":["炒锅"],"v":0,"a":"猪黄管③ 五条 猪脊髓 五条 清汤 二斤 酱油 二钱 精盐 三分 葱椒绍酒② 三钱 味精 二分","p":["用清水把黄管洗净，放入锅内加清水在旺火上煮沸后，移至微火上，盖上锅盖煮二小时，至八成烂捞出用清水洗净，撕去脂肪，再入沸水烫过，取出，用净布干水分，然后用筷子顶住黄管的细端，把里面翻出来，清水洗净，用刀尖划成状（如图），泡入清水碗内。","把猪脊髓洗净，从齐头的一端用剪刀将外皮剪破，撕净外皮、血丝，用清水轻轻洗净，切成五寸长的段。锅内放入清水（一斤），用中火烧至五成热，放入切好的脊髓，加上精盐（一分半)，待烧沸后，撤净浮沫，捞入开水碗内。","将黄管放入沸水中焯过。炒勺内放入清汤（五两)、酱油(一钱)、葱椒绍酒(一钱)，在旺火上烧沸后，放入黄管煮二分钟，捞出放在汤碗的一边；随即把脊髓放入勺内烧沸，捞出后整齐地摆在汤碗的另一边。","炒勺内放入清汤、精盐、酱油烧沸，撇去浮沫，加入葱椒绍酒、味精，倒人汤碗内（不要将脊髓冲破）即成。"]},{"i":613,"n":"绝纱肉","r":"鲁菜","o":"中国菜谱·山东","f":"特点此菜肉烂味美，汤稠而鲜，并带有甜味。因色红油亮，皮面终起一层丝纹，故名。","c":"热菜","m":["蒸"],"g":["猪肉"],"s":["白糖","酱油","高汤","料酒","葱","姜","八角","味精"],"t":["炒锅","蒸锅"],"v":0,"a":"斤 猪肘肉 白糖 二钱 酱油 六钱 清汤④ 一两半 绍酒 三钱 葱、姜 各一片 姜末 五分 味精 八角 两粒 糖色② 二分 花生油 二斤（约耗三钱）","p":["用铁筷子将猪肉叉起，在旺火上将肉皮燎湖，再放在热水内浸透，然后用刀刮净湖皮洗净。将肉放入汤锅内，用中火煮至五成熟时捞出，用刀在皮面刹上（深度为肉皮厚度的一半）浅“十”字刀纹，涂上一层糖色（或甜面酱）。","炒勺内放入花生油，在旺火上烧至八成热时，将肉放入炸至肉皮发红时捞出。","取大碗一个，将八角用刀拍碎、撒在碗底；将猪肉（皮朝下）放入碗内，加入清汤、酱油、绍酒、葱、姜片，入笼屉蒸烂取出，把猪肉扣在汤盘里（皮朝上）。将蒸肉的汤筏人炒勺内，加入白糖和姜末，在小火上一分钟左右，加味精搅匀，浇在肉上即成。"]},{"i":614,"n":"螺丝肉","r":"鲁菜","o":"中国菜谱·山东","f":"特点此菜淡红色，油光发亮，软嫩咸香。肉卷形似螺丝，故名。","c":"热菜","m":["蒸"],"g":["猪肉"],"s":["淀粉","葱","花椒","料酒","酱油","高汤","味精","姜"],"t":["炒锅","蒸锅"],"v":0,"a":"带皮猪肉（臀尖） 一斤二两 川冬菜 一两 湿淀粉 七钱 葱椒绍酒② 四钱 酱油 一两七钱 清汤 六两 味精 一分 葱姜末 一钱 嫩汁③ 一钱 葱油③ 三钱","p":["将猪肉皮上的毛刮净，顺着肉纹切成五寸宽的长条，再横着切成二分厚的片（共十二片)，逐片平铺在板上，横着肉皮每隔二分宽奇一分深的直刀，放入碗内，加入酱油（七钱）、葱椒绍酒（一钱）、葱油（一钱）和嫩汁拌匀浸溃待用。","将川冬菜择洗干净，沥干水分，放入碗内，加入葱椒绍酒（一钱）、葱油（一钱）和葱姜末拌匀待用。","将浸渍过的肉片（刀纹朝下）平铺在板上，把冬菜分为十二分，均匀地放在肉上，逐片卷成肉卷，将带皮的一头朝下竖着放在粗磁碗内，倒入清汤(三两）、酱油（七钱)和浸渍肉片的汁，入笼用旺火蒸两小时取出。将汤汁人碗内，把肉卷扣人汤盘。","炒勺内放入清汤（三两）、蒸肉的汁和酱油（三钱），用旺火烧沸后，撇去浮沫，加湿淀粉勾芡，再放入葱椒绍酒（二钱）、味精、葱油用手勺搅匀，浇在肉卷上即成。"]},{"i":615,"n":"糟蒸肉","r":"鲁菜","o":"中国菜谱·山东","f":"特点此菜呈枣红色，有浓郁的糟香味，肉肥而不腻。一O、把子肉原料猪硬肋肉..十斤冰糖..四两酱油二斤半五香面（用布包扎）五","c":"热菜","m":["蒸"],"g":["猪肉"],"s":["香糟","葱","姜","盐","高汤","酱油"],"t":["炒锅","蒸锅"],"v":0,"a":"带皮猪肉（去骨） 一斤四两 葱丝 三钱 姜丝 二钱 香糟 一两 精盐 二分 清汤① 一两 酱油 二两 花生油 一斤半（约耗一两）","p":["将猪肉（选用腹部以上，硬肋以下部位）刮洗干净，切成三寸长、五分厚的片，放入碗内，加精盐（一分)渍匀。","炒勺内放入花生油，用旺火烧至七成热时，放入肉片炸五分钟，呈金黄色时捞出，肉皮朝下摆放在粗磁碗内（成马鞍状），撒上葱姜丝。","碗内放入清汤、香糟调匀后，用洁净白纱布过滤，再加酱油、精盐（一分）调匀，浇在肉片上。放入笼屉内用旺火蒸两小时半，取出扣在盘内即成。"]},{"i":616,"n":"滑炒肉丝（做法二）","r":"鲁菜","o":"中国菜谱·山东","f":"特点此菜色泽白亮，肉嫩蒜香，味鲜清口。","c":"热菜","m":["爆炒"],"g":["猪肉","青蒜","鸡蛋"],"s":["盐","淀粉","葱","高汤","香油"],"t":["炒锅"],"v":0,"a":"猪里脊肉 四两 蒜苗 二两 鸡蛋清 精盐 五分 湿淀粉 二钱 葱丝 *五钱 清汤④ 一两 花生油 一斤（约耗一两） 芝麻油 五分","p":["将猪里脊肉片成一分厚的薄片，再顺丝切成一寸半长、一分粗的丝，放入碗内，加入蛋清、湿淀粉抓匀。青蒜洗净，切成寸段。将盐、清汤放入碗内兑成汁。","炒勺内放入花生油，用中火烧至五成热，放入肉丝用筷子划开，倒入漏勺内。勺内留少量的油烧热后，放入葱丝略妙，至有香味时，即放入蒜苗、肉丝，倒人对好的汁，用手勺搅匀，颠翻几下，淋上芝麻油即成。"]},{"i":617,"n":"琉璃肉（做法二）","r":"鲁菜","o":"中国菜谱·山东","f":"特点此菜外皮光亮如琉璃，酥脆香甜，食之不腻。","c":"热菜","m":["爆炒"],"g":["猪肉","面粉","鸡蛋"],"s":["白糖","淀粉","香油"],"t":["炒锅"],"v":0,"a":"猪臀尖肥肉 半斤 白糖 三两 湿淀粉 一两 面粉 少许 鸡蛋清 一个 花生油 二斤（约耗一两） 芝麻油 五钱","p":["将猪肉切成长一寸、宽厚各三分的条，放在碗内，加入鸡蛋清、湿淀粉、面粉拌匀。","炒勺内放入花生油，用旺火烧至六成热时，放入肉条，炸至起酥（呈金黄色）时捞出。","另将芝麻油放入净炒勺内，微火烧热后，加入白糖熬至糖溶化、起黄泡时（火口要适度，动作要快，否则容易过火，使糖有苦味），放入炸好的肉条，迅速用手勺推动，颠翻炒勺，使糖汁沾在肉上之后，倒在案板上，用筷子拨开，晾凉即成。"]},{"i":618,"n":"网油三丝卷","r":"鲁菜","o":"中国菜谱·山东","f":"特点此菜外皮黄亮酥脆，卷内肉嫩。可作拼冷荤盘用。","c":"热菜","m":["炸"],"g":["猪肉","鸡肉","冬笋","鸡蛋","面粉"],"s":["盐","料酒","葱","姜","香油"],"t":["炒锅"],"v":0,"a":"猪网油 二张 猪里脊肉 二两 鸡脯肉 二两 水发冬笋 一两 鸡蛋清 三个 面粉 二两 精盐 一钱 绍酒 三钱 葱丝 五钱 姜丝 二钱 芝麻油 五钱 花生油 二斤(约耗一两）","p":["先将猪肉、鸡肉、冬笋都切成一寸长、一分粗的细丝，放在碗内，加鸡蛋清（-一个）、葱丝、姜丝、绍酒、盐、芝麻油渍好待用。鸡蛋清（二个）和面粉在另一碗内搅成稀糊。，","将网油洗净，用洁净纱布振干水，切三寸宽的片（共六片），顺序地放在案板上。将渍好的肉料分成六份，放在网油上面，卷成六条长卷。","炒勺内放入花生油，用中火烧至六成热时，将网油卷逐条沾满蛋粉糊，放入油内炸，至猪肉、鸡肉、冬笋熟透，外皮呈浅黄色时，捞出，沥净油。每条油卷再切成四块，整齐地摆入盘内即成。"]},{"i":619,"n":"烤网油千","r":"鲁菜","o":"中国菜谱·山东","f":"特点此莱外皮酥脆，肉嫩适口。","c":"热菜","m":["烤"],"g":["猪肉","鸡蛋"],"s":["淀粉","酱油","高汤","料酒","味精","葱","姜"],"t":["烤箱"],"v":0,"a":"四两 猪肉 猪网油 四两 鸡蛋清 二个 湿淀粉 三钱 酱油 六钱 清汤④ 二两 三钱 绍酒 味精 三分 葱丝 三钱 姜丝 一钱","p":["将猪肉切成一寸二长、一分粗的丝，加葱丝、姜丝、酱油、绍酒、味精、清汤、湿淀粉（一钱半）、鸡蛋清（一个半）拌匀。","将猪网油切成三块，每块长一尺，宽五寸。将拌好的猪肉丝均匀地分成三份，分别放在网油上包成长八寸、宽（）（一），一成糊，沾住“油千”封口处，放入烤箱内用旺火烤二十分钟（烤时先烤封口的一面，再翻过来烤），待“油千”呈金黄色时取出。再切成长一寸、宽五分的长方块，整齐地摆在盘内即成。"]},{"i":620,"n":"烤大肠","r":"鲁菜","o":"中国菜谱·山东","f":"特点此菜大肠呈金黄色，味香而脆，食之不腻。","c":"热菜","m":["烤"],"g":["猪大肠"],"s":["葱","姜","高汤","酱油","味精"],"t":["炒锅","烤箱"],"v":0,"a":"熟大肠 葱 五钱 姜 五钱 鸡汤 五两 酱油 一两 味精 三分 熟猪油 一两 花生油 一斤（约耗一两）","p":["1。将熟大肠用竖刀从中间剖开（不要剖断），切成三寸长的段，抹上酱油（三分）；葱切寸段，姜用刀拍扁。","炒勺内倒入花生油，在旺火上烧至九成热，放入大肠炸呈金黄色取出，放在烤盘内，加酱油、猪油、葱、姜、鸡汤、味精，上烤炉内约烤七分钟取出，去掉葱、姜，将大肠切成三分宽、一寸半长的条，装入盘内，浇上余汤即成。"]},{"i":621,"n":"炒腰花","r":"鲁菜","o":"中国菜谱·山东","f":"特点此菜腰花形似麦穗，色泽红润，脆嫩味鲜。","c":"热菜","m":["爆炒"],"g":["猪腰","木耳","冬笋","荸荠","白菜"],"s":["淀粉","高汤","醋","酱油","盐","葱","姜","蒜"],"t":["炒锅"],"v":0,"a":"猪腰子 五两 水发木耳 五钱 水发玉兰片 五钱 荸荠 一两 嫩菜心 五钱 湿淀粉 五钱 清汤 一两 酱油 三钱 醋 三钱 精盐 二分 葱末 三分 姜末 一分 蒜末 一分 花生油 一斤（约耗一两）","p":["将猪腰子除去外皮、片去腰，用刀从中间片为两片。在片开的一面，剞成一分宽的斜十字花刀，再切成五分宽、一寸长的块，放入湿淀粉（一钱）、精盐拌匀。","荸荠削去皮，切成片；玉兰片切成五分宽、一寸长的片；木耳切两瓣；菜心切段；均用沸水焯过。清汤、酱油、湿淀粉放入碗内对成芡汁。","炒勺内倒人花生油，在旺火上烧至九成热，放入腰花，用铁筷子拨散，迅速捞出。炒勺内留油（四钱），放入葱、姜、蒜末，炸出香味随即烹入醋，再加入荸荠、玉兰片、菜心、木耳、腰花，倒入芡汁，颠翻两下，盛人盘内即成。"]},{"i":622,"n":"醉腰丝","r":"鲁菜","o":"中国菜谱·山东","f":"特点此菜淡红、白、绿、褐四色相间，味清香，质地脆嫩，为爽口凉菜。","c":"热菜","m":["爆炒"],"g":["猪腰","香菇","冬笋","白菜"],"s":["葱","花椒","料酒","盐","味精","酱油","姜"],"t":["炒锅"],"v":0,"a":"猪腰子 水发香菇 二两 水发玉兰片 二两 嫩菜心 五钱 葱椒绍酒② 一两 精盐 一分 酱油 两 味精 三分 40。 姜末 三分","p":["用清水将猪腰洗净，撕去外面脂皮，用刀片成两半，片去腰臊，坡刀每隔二分一刀，深为猪腰厚度的二分之一，再横着刀纹切成一寸半长的丝，在清水中泡去血水和臊味。","将玉兰片、菜心均切成一寸半长的丝，香菇切成丝，用沸水过捞出，加精盐拌匀。","炒勺内放入清水（一斤半），在旺火上烧至八成热，随即放入腰丝，用手勺搅动一下迅速捞至（以免烫老）凉开水中浸一下，捞出挤干水分，放入碗内，加入玉兰片、木耳、嫩菜心、酱油、葱椒绍酒、味精拌匀，腌二十分钟后，装人盘内，撒上姜末即成。"]},{"i":623,"n":"炸麻花腰子","r":"鲁菜","o":"中国菜谱·山东","f":"特点此菜形似麻花，香脆可口，宜于热吃。","c":"热菜","m":["炸"],"g":["猪腰","猪肉","面粉"],"s":["花椒","料酒","盐","酱油"],"t":["炒锅"],"v":0,"a":"猪腰子 七两 猪肥内肉 四两 面粉 二钱 花椒面 一钱 绍酒 二钱 精盐 五分 酱油 一钱 花生油 一斤半 (约耗一两半)","p":["将猪腰撕去脂皮，从中片为两片，去掉腰臊，与肥肉均切成一寸八分长、五分宽、一分厚的片，每片从中间划三条口（如图1），两头不要切断，放入碗内，加入酱油、精盐、绍酒渍匀。","用腰子、肥肉各一18寸片，对准中间刀口罗叠整齐，将一头从中心刀口穿过去，即套成“麻花”状（如图2），共十二套，每套均沾上一层薄面粉。","炒勺内放入花生油，在中火上烧至五成热时，移至小火上，把“麻花腰”逐个下人油内炸，用小铲拨动，然后移至中火上炸至呈淡黄色时捞出即成。吃时蘸花椒面。"]},{"i":624,"n":"大葱烧蹄筋","r":"鲁菜","o":"中国菜谱·山东","f":"特点此菜色泽红润，葱香筋烂，滋味浓醇。*章邱大葱：为山东章邱县特产，葱茎长而粗，直径约一寸，茎高一尺半左右，大的每棵重约","c":"热菜","m":["烧扒焖"],"g":["蹄筋","猪肉"],"s":["葱","淀粉","高汤","酱油","白糖","料酒"],"t":["炒锅","蒸锅"],"v":0,"a":"猪蹄筋（发好的） 章邱大葱* 三两 湿淀粉 二钱 清汤④ 一斤 酱油 六钱 白糖 三钱 绍酒 五分 一斤（约耗五钱） 花生油 一两 熟猪油","p":["把蹄筋洗净，切成一寸半长的条，放入沸水中烫过捞出，沥干水分。·","炒勺内放入猪油，在中火上烧至八成热，加入白糖炒至红色时，放入蹄筋妙至上色后，再加酱油（三钱）、清汤（三两），用微火烧至汤汁将干，盛入盘的一边。","将大葱切成二寸长段。炒勺内放入花生油，中火烧至八成热时，放入大葱炸呈黄色捞在碗内，加酱油(一钱)、绍酒上笼蒸烂（约十五分钟）后，盛入蹄筋盘的另一边。","勺内放入清汤烧沸后，加入酱油(二钱)、湿淀粉勾芡，浇在蹄筋、葱条上即成。"]},{"i":625,"n":"排骨","r":"鲁菜","o":"中国菜谱·山东","f":"特点此菜色泽深红，表面光亮，口味甜、咸、香。","c":"热菜","m":["爆炒"],"g":["猪肉"],"s":["白糖","葱","花椒","高汤","酱油","醋","姜","料酒"],"t":["炒锅"],"v":0,"a":"猪排骨 白糖 二两半 葱椒泥@ 二分 清汤④ 四两 酱油 六钱 醋 六钱 葱、姜丝 各一钱 绍酒 五钱 花生油 二斤（约耗二两）","p":["将猪排骨剁成八分长的段，用酱油（三钱）、绍酒（三钱）拌匀渍好。","炒勺内放入花生油，在旺火上烧至八成热时，把排骨放入，炸至淡黄色时捞出。炒勺内留油（一两半），放入葱、姜丝稍炒，随即用手勺拨至勺边。炒勺内放进白糖（三钱），炒至血红色时，烹人醋和绍酒（二钱）、酱油(三钱)，再放入白糖（二两二钱）、清汤和炸好的排骨，与葱姜丝一起拌炒几下，用微火，至汤将干时，放入葱椒泥拌匀即成。"]},{"i":626,"n":"烤猪大排骨","r":"鲁菜","o":"中国菜谱·山东","f":"特点此菜色棕红，肉酥烂、鲜香、味醇。","c":"热菜","m":["烤"],"g":["猪肉","生菜","萝卜"],"s":["葱","姜","味精","料酒","八角","酱油","高汤"],"t":["烤箱"],"v":0,"a":"猪大排骨 斤二两 大葱 五钱 姜 五钱 味精 一分 绍酒 五钱 大料 一瓣 酱油 两五钱 高汤 六两 生菜 二两 胡萝卜 二两 土豆 二两 葱油③ 五钱","p":["将猪排剁成三大片，逐片在肉面上十字花纹，然后一拍。葱切大段。姜拍松。将生菜洗净消毒，切成五分宽、二寸长的段。土豆、胡萝卜去皮洗净切成滚刀块，人九成热的油一炸取出。","将排骨放入烤盘内，加上葱、姜、绍酒、大料、味精、胡萝卜、土豆；加入高汤，浇上酱油，淋上葱油。","将盛有排骨的烤盘，装入烤炉内，用旺火烤七分钟，取出排骨切成五分宽的条块，摆入盘内呈马鞍形，将土豆、胡萝卜放在排骨一边；把生菜放在另一边，再把烤制的原汤浇上即成。"]},{"i":627,"n":"白扒猪脑","r":"鲁菜","o":"中国菜谱·山东","f":"特点此菜色如白雪，油光发亮，软嫩滑润，宜于下饭。","c":"热菜","m":["烧扒焖"],"g":["猪肉"],"s":["淀粉","高汤","盐","味精","料酒","姜"],"t":["炒锅"],"v":0,"a":"猪脑 湿淀粉 二钱 奶汤① 五两 精盐 二钱 味精 二分 绍酒 五钱 姜汁 “一钱 熟猪油 一两半","p":["将猪脑用清水浸泡三十分钟后洗净，去掉脑上的血筋和薄膜，放入锅中沸水内，加精盐（一钱）煮熟捞出，沥于水分。再将大的猪脑每个切为两半（小的则不切）。","炒勺内放入猪油（一两），在中火上烧至六成热，加奶汤、绍酒（三钱）、精盐（一钱）、姜汁，放入猪脑，用旺火烧沸，撒去浮沫，移至微火上煨炖至汤汁剩三分之一时，将猪脑用漏勺轻轻捞出盛入盘内，勺内原汤放入绍酒（二钱）、味精、猪油、湿淀粉勾芡，浇在猪脑上即成。"]},{"i":628,"n":"罐儿蹄","r":"鲁菜","o":"中国菜谱·山东","f":"特点此菜蹄色酱红，软烂味香，人口即化。","c":"热菜","m":["烧扒焖"],"g":["猪肉"],"s":["酱油","白糖","桂皮","葱","姜","八角"],"t":["砂锅"],"v":0,"a":"猪蹄（肥大的） 四个（约重三斤） 酱油 五两 冰糖 两 肉桂 三钱 葱 二钱 姜 一钱 八角 二钱","p":["将猪蹄在火上燎去毛，放在温水内浸泡十分钟，用刀刮净脏污，拔净蹄叉缝间细毛，用清水洗净。葱切寸段，姜切大片。","取坛子一个洗净，坛底外糊上一层耐火土泥（以防·50。被火烧裂），将猪蹄、酱油、冰糖、肉桂、八角、葱、姜放坛内，加清水（水漫过蹄），用盘子盖住坛口，放在旺火上烧沸，然后移至微火上炖约七小时即成。"]},{"i":629,"n":"大葱爆羊肉丁","r":"鲁菜","o":"中国菜谱·山东","f":"特点此菜羊肉滑嫩，大葱鲜香，油润光亮。","c":"热菜","m":["爆炒"],"g":["羊肉","猪肉","鸡蛋"],"s":["葱","淀粉","盐","酱油","料酒","味精","香油"],"t":["炒锅"],"v":0,"a":"羊肉 半斤 大葱 半斤 湿淀粉 七钱 精盐 五分 酱油 五分 鸡蛋清 一个 绍酒 三钱 味精 二分 花生油 一斤(约耗一两） 芝麻油 一钱","p":["将羊肉片成四分厚的片，两面用刀交叉奇上深、宽各一分半的刀纹，再切成四分宽的长条，顶刀切成方丁，放入碗内，加入精盐、鸡蛋清、湿淀粉(四钱)拌匀；大葱劈为两半，再切成五分长的小段。","炒勺内放入花生油，用中火烧至六成热时，将羊肉丁放入，用铁筷子拨散，再放入葱段搅散，迅速捞出。勺内留油五钱，将羊肉丁、大葱、精盐、酱油、绍酒、味精、湿淀粉（三钱）、芝麻油放入，在旺火上搅妙，颠翻三至四次，盛人盘内即成。"]},{"i":630,"n":"扒牛肉条（做法二）","r":"鲁菜","o":"中国菜谱·山东","f":"特点此菜色泽红润，牛肉酥烂，味鲜适口。水产菜类","c":"热菜","m":["烧扒焖"],"g":["牛肉","猪肉"],"s":["葱","姜","八角","淀粉","酱油","盐","料酒","香油"],"t":["炒锅","蒸锅"],"v":0,"a":"牛脊肉 斤半 葱段 两 姜片 钱 八角 三瓣 湿淀粉 三钱 酱油 两 精盐 钱 绍酒 五钱 芝麻油 五钱","p":["将牛肉整块放入冷水内泡透，洗净血水，放入沸水锅内炖透，捞出洗净。锅内加清水四斤，放入牛肉、大葱段（五钱）、姜片（五分），旺火烧沸，撤净浮沫，锅上加盖，用小火焖煮二至三小时，熟透捞出晾凉。切去肉上的脂皮及不整齐的边，横着肉纹切成三寸长、一寸宽、一分半厚的肉条，光面朝下，整齐地放在碗内，加入酱油（五钱）、精盐、绍酒、葱段、姜片、八角及煮牛肉的原汤，上笼用旺火蒸二十分钟取出，去掉八角、葱姜，将牛肉扣入平盘内。","将蒸肉的原汤倒人炒勺内（汤少可酌加），加入酱油（五钱），烧沸后用湿淀粉勾芡，淋上芝麻油，浇在牛肉上即成。"]},{"i":631,"n":"清炖加吉鱼*","r":"鲁菜","o":"中国菜谱·山东","f":"特点此菜汤呈白色，汁清味浓，鱼肉鲜美，滋味醇厚适口。","c":"热菜","m":["炖煨"],"g":["加吉鱼","鱼肉","猪肉","白菜"],"s":["盐","高汤","料酒","味精","葱","姜"],"t":["炒锅"],"v":0,"a":"加吉鱼 一条（约重一斤半） 加吉鱼系黄海、渤海重要海产鱼之一，分红、褐色两种，以红色为最 佳。 肥猪肉 一两 青菜 二两 清汤④ 二斤 精盐 一钱 绍酒 二钱 味精 三分 葱 五钱 姜 二钱 花生油 二两","p":["将加吉鱼去腮、刮鳞，剖腹挖去内脏，洗净后，在鱼身两面每隔五分宽刹上斜十字花刀；肥猪肉切成一寸长、半寸宽、一分厚的薄片；葱切成寸段，姜用刀拍碎，青菜切成一寸长的条。","炒勺内放入花生油，在中火上烧至六成热，把鱼放入，两面煎成浅黄色，随即加清汤、葱、姜、肥猪肉片、绍酒、精盐，用微火炖二十分钟。鱼炖熟后，捞出葱姜不用，将鱼盛在碗内。勺内鱼汤加青菜、味精烧沸，浇在鱼上即成。"]},{"i":632,"n":"干蒸加吉鱼","r":"鲁菜","o":"中国菜谱·山东","f":"特点此菜饰以红、白、褐色的配料，色泽美观，鱼肉鲜嫩清口。五O、红烧桂鱼原料桂鱼一条（约重一斤半）鲜玉兰片…五钱猪肉 (肥","c":"热菜","m":["蒸"],"g":["加吉鱼","香菇","猪肉","火腿","冬笋"],"s":["葱","姜","盐","料酒","味精"],"t":["蒸锅"],"v":0,"a":"鲜加吉鱼 一条（约重一斤左右） 水发冬菇 五钱 肥猪肉 五钱 火腿 冬笋 五钱 葱丝 三分 姜丝 二分 精盐 五分 绍酒 味精 五分 熟猪油 一两","p":["鲜加吉鱼去鳞后，在其肛门处切约四分深的小口，再揭开腮盖。从腮口取出腮和内脏（没有取净的内脏从肛门开口处挤出，不要将鱼腹破开，以保持鱼身完整)，洗净后，在鱼身两面每隔五分宽打上斜十字花刀。然后，手提鱼尾，在沸水中稍烫，立即取出，用洁布干水分，将精盐、绍酒、味精撒在鱼上，放在盘中。","将肥肉、葱、姜、冬笋、冬菇、火腿切成丝，一起拌匀，撒在鱼身上。再在鱼身上淋上猪油，上笼蒸二十分钟取出即成。"]},{"i":633,"n":"糖熠鲤鱼","r":"鲁菜","o":"中国菜谱·山东","f":"特点此菜鱼皮略焦，汁红润发亮，味道香甜。","c":"热菜","m":["爆炒"],"g":["鲤鱼"],"s":["白糖","酱油","醋","盐","葱","蒜","淀粉","高汤"],"t":["炒锅"],"v":0,"a":"鲜鲤鱼 一条（一斤半） 白糖 三两半 酱油 五钱 醋 八钱 精盐 三分、 葱末 二钱 蒜末 三钱 湿淀粉 一两半 清汤④ 四两 花生油 三斤（约耗四两）","p":["将鱼去鳞、腮，开膛掏去内脏，洗净后干水分，然后坡刀在鱼的两面每隔五分宽入一刀，深度一寸（切到鱼脊骨为止),在刀口内撒进精盐，两面沾上酱油(三钱)、湿淀粉（一两）。将白糖、湿淀粉(五钱)、酱油(二钱)、清汤放入碗内对成为汁。","炒勺内放入花生油，在旺火上烧至六成热时，手提鱼尾放入油内，两面共约炸五分钟，至鱼皮面呈褐色稍焦时捞出。","炒勺内放入油一两半，用中火烧至六成热时，放进葱蒜末、醋，炸出香味，再把炸好的鱼放入勺内，随即将对好的汁顺锅周围淋入(随淋随晃动炒勺，使鱼转动)，让汁均匀地挂在鱼肉上。捞出鱼摆入盘内，把炒勺内余汁浇到鱼上即成。"]},{"i":634,"n":"干蒸鲤鱼","r":"鲁菜","o":"中国菜谱·山东","f":"特点此菜鲤鱼肉质细嫩，味道鲜美，清香不腻。","c":"热菜","m":["蒸"],"g":["鲤鱼","冬笋","鸡肉","香菇","火腿"],"s":["葱","姜","白糖","盐","酱油","料酒","高汤","味精"],"t":["蒸锅"],"v":0,"a":"鲜鲤鱼 一条（约重一斤半） 冬菜 一两 水发玉兰片 一两 鸡蛋糕 一两 水发冬菇 三钱 火腿 三钱 葱丝 五分 姜丝 五分 白糖 二钱 精盐 三分 酱油 二钱 清汤 一两 绍酒 三钱 味精 二分 鸡油 一钱","p":["将鱼去鳞、腮，开膛掏去内脏，洗净后，在开水内稍烫一下，刮去鱼身上的薄黑皮，干水分，用斜坡刀在鱼的两面每隔六分宽切一刀(切至脊骨为止)，深度为一寸。将鱼尾提起，再放在开水内稍烫（使鱼肉刀口张开），干水分，用精盐、绍酒（二钱）浸渍片刻，放入盘内。玉兰片、鸡蛋糕、火腿均切成一寸半长、半分粗的丝；冬菇切半分粗的丝。以上切好的四种丝和葱姜丝，均按不同颜色，相间地摆在鱼上。冬菜用清水洗净，挤净水分。","将清汤、酱油、白糖、绍酒(钱)、味精、冬菜、葱、鸡油均装在小碗内，调匀成汁，和鱼盘一同放在笼屉里用旺火蒸十五分钟。取出鱼盘去水分，换装在另一个盘里，把同蒸的冬菜及汁均匀地浇在鱼上即成。"]},{"i":635,"n":"酱鱼","r":"鲁菜","o":"中国菜谱·山东","f":"特点此菜酱汁入鱼肉内，味香醇浓。","c":"热菜","m":["爆炒"],"g":["鱼肉","鲤鱼"],"s":["酱油","
