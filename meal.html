<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@600;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef1ee;--panel:#fff;--ink:#17232e;--mute:#5b6b78;--line:#d3dbd6;--blue:#23486b;--blue-ink:#fff;--gold:#e3a72a;--red:#b23a2e;--chip:#e4eae6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1a22;--panel:#16252f;--ink:#e6edf0;--mute:#93a4af;--line:#2a3d4a;--blue:#8fb8e0;--blue-ink:#0f1a22;--gold:#e8b84a;--red:#ef7d70;--chip:#1f333f}}
:root[data-theme="dark"]{--bg:#0f1a22;--panel:#16252f;--ink:#e6edf0;--mute:#93a4af;--line:#2a3d4a;--blue:#8fb8e0;--blue-ink:#0f1a22;--gold:#e8b84a;--red:#ef7d70;--chip:#1f333f}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.65 "Noto Sans SC",system-ui,sans-serif}
header{padding:28px 20px 8px;max-width:1180px;margin:auto}
h1{font:900 clamp(30px,5vw,46px)/1.1 "Noto Serif SC",serif;margin:0 0 8px;letter-spacing:.04em}

main{max-width:1180px;margin:auto;display:grid;grid-template-columns:minmax(300px,380px) 1fr;gap:20px;padding:16px 20px 90px}
@media(max-width:820px){main{grid-template-columns:1fr}}
.pick{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px 16px;align-self:start;position:sticky;top:8px;max-height:calc(100vh - 16px);overflow:auto}
@media(max-width:820px){.pick{position:static;max-height:none}}
.pick h2{font:600 17px "Noto Serif SC",serif;margin:14px 0 6px}.pick h2:first-child{margin-top:0}
.pick h3{font:500 13px "Noto Sans SC";color:var(--mute);margin:10px 0 4px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:999px;padding:3px 11px;font:inherit;font-size:13.5px;cursor:pointer}
.chip small{color:var(--mute);margin-left:3px}
.chip[aria-pressed=true]{background:var(--blue);border-color:var(--blue);color:var(--blue-ink)}.chip[aria-pressed=true] small{color:inherit;opacity:.7}
.chip:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:8px 0}
.btn{background:var(--gold);color:#1b1405;border:0;border-radius:4px;padding:9px 18px;font:700 15px "Noto Sans SC";cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);font-weight:500}
input[type=search],select{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:4px;padding:7px 10px;font:inherit}
input[type=search]{flex:1;min-width:140px}
.menu{background:var(--blue);color:var(--blue-ink);border-radius:6px;padding:16px 18px;margin-bottom:16px}
.menu h2{font:900 20px "Noto Serif SC",serif;margin:0 0 8px}.menu ul{margin:0;padding:0;list-style:none;display:grid;gap:6px}
.menu li{display:flex;gap:10px;align-items:baseline}.menu b{font-weight:700;min-width:3em}.menu a{color:inherit;text-underline-offset:3px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;margin-bottom:10px}
.card summary{list-style:none;cursor:pointer;padding:12px 16px;display:grid;grid-template-columns:1fr auto;gap:2px 12px}
.card summary::-webkit-details-marker{display:none}
.card .t{font:600 18px "Noto Serif SC",serif}.card .f{grid-column:1/-1;color:var(--mute);font-size:13.5px}
.tag{font-size:12.5px;border:1px solid var(--line);border-radius:3px;padding:0 6px;margin-left:6px;color:var(--mute);white-space:nowrap}
.tag.v{border-color:#5a9a5f;color:#3f7d45}
.have{font-size:13.5px;text-align:right}.miss{color:var(--red)}
.body{padding:0 16px 14px;border-top:1px dashed var(--line)}
.body h4{margin:12px 0 4px;font:500 13px "Noto Sans SC";color:var(--mute)}
.body ol{margin:0;padding-left:1.3em}.body li{margin:3px 0;max-width:70ch}
.empty{border:1px dashed var(--line);border-radius:6px;padding:28px 20px;color:var(--mute)}
.bar{display:none}
@media(max-width:820px){.bar{display:flex;position:fixed;left:0;right:0;bottom:0;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:var(--panel);border-top:1px solid var(--line);gap:10px;align-items:center;justify-content:space-between;z-index:5}}
.note{font-size:12.5px;color:var(--mute);margin-top:18px}
</style></head><body>
<header><h1>鲁菜灶台</h1><p>勾选手头的食材、调料和厨具，立刻列出能做的鲁菜，并告诉你还缺什么、怎么做。目前收录 <b id="total"></b> 道山东菜谱，以鲁菜为主，也有少量其他菜系。</p></header>
<main>
<section class="pick" aria-label="选择食材">
 <h2>我有的食材</h2><div id="ingr"></div>
 <h2>我有的调料</h2><div class="chips" id="sea"></div>
 <p class="note" style="margin:6px 0 0">油、清水默认都有；高汤没有可用清水代替。</p>
 <h2>我有的厨具</h2><div class="chips" id="tools"></div>
 <div class="row"><button class="btn ghost" id="clear" type="button">清空选择</button></div>
</section>
<section aria-live="polite">
 <div class="row"><input type="search" id="q" placeholder="直接搜菜名或食材，如 海参、糖醋" aria-label="搜索菜谱">
  <select id="cat" aria-label="类别"><option value="">全部类别</option><option>热菜</option><option>汤羹</option><option>小吃</option><option>甜品</option><option>凉菜</option><option>火锅</option></select>
  <select id="reg" aria-label="地区菜系"><option value="">全部菜系</option></select>
  <select id="lack" aria-label="允许缺少的食材"><option value="0">食材齐全</option><option value="1">最多缺 1 种</option><option value="2" selected>最多缺 2 种</option><option value="9">不限</option></select>
  <label><input type="checkbox" id="veg"> 只看素菜</label></div>
 <div class="row"><button class="btn" id="gen" type="button">生成今日菜单</button><button class="btn ghost" id="rnd" type="button">随便来一道</button><span id="count" style="color:var(--mute)"></span></div>
 <div id="menu"></div><div id="list"></div>
 <p class="note">菜谱整理自多本山东菜谱资料（见每道菜“来源”），用量为原书份量，可按人数自行折算；火候与时间请以实际灶具为准。</p>
</section></main>
<div class="bar"><span id="count2"></span><button class="btn" id="gen2" type="button">生成今日菜单</button></div>
<script>
const DATA=[{"i":0,"n":"沙锅牛尾","r":"鲁菜","o":"鲁菜","f":"营养丰富，牛尾软烂，汤味醇厚","c":"热菜","m":["爆炒"],"g":["牛肉","鸡肉","火腿","干贝"],"s":["料酒","味精","盐","葱","姜","花椒","高汤"],"t":["炒锅","砂锅"],"v":0,"a":"主料： 牛尾(带皮)2公斤，净母鸡半只，熟火腿100克，干贝50克。｜调料： 熟大油、料酒各100克，味精10克，盐14克，葱段100克，姜块50克，花椒5克，鸡汤3公斤。","p":["先用小燎去牛尾小毛，然后刷洗干净，去掉尾根大骨后剁成段，用开水将母鸡紧透，捞出，去血沫洗净。火腿切成片。干贝去筋洗净。","铁锅将熟大油烧热，放入花椒和50克葱、24克姜煸出香味，然后下入牛尾段，用旺火把牛尾煸出血水，烹入50克料酒后直炒至牛尾断生。取出牛尾洗净，把水分控干。","把鸡汤放入沙锅内加入葱50克和拍松和姜块25克、料酒、盐，同时把牛尾段、干贝、火腿片和母鸡块都放入沙锅中，用小火腿煨4小时，中间可加汤一次，待牛尾炖烂时，拣出葱、恙和母鸡块(另用)，加入味精撇去浮抹即可。"]},{"i":1,"n":"扒原壳鲍鱼","r":"鲁菜","o":"鲁菜","f":"口味鲜醇，鲍鱼软糯","c":"热菜","m":["烧扒焖"],"g":["鲍鱼","火腿","冬笋","白菜","香菇"],"s":["盐","味精","高汤","葱","姜"],"t":["蒸锅"],"v":0,"a":"带壳大鲍鱼100克，火腿、笋片、菜心、冬菇、高汤、盐、味精、油、葱、姜各适量。","p":["一、将大鲍鱼洗净,去原壳焯水,在肉身正面剞花刀,放汤碗内加清汤、葱、姜上笼蒸烂，鲍鱼壳摆入盘中。","二、火腿、笋、菜心、冬菇改刀成小象眼片,焯水备用。","三、起锅入汤,下鲍鱼、调味料，丰润放入料头煨透，勾芡使汤汁稠浓，淋入明油，将鲍鱼摆在原壳中，浇上芡汁既成。"]},{"i":2,"n":"山东包子","r":"鲁菜","o":"鲁菜","f":"鲜美适口，别有风味","c":"小吃","m":["蒸"],"g":["面粉","猪肉","鹿角菜","白菜"],"s":["香菜","香油","葱","味精","盐","黄酱","姜"],"t":["蒸锅"],"v":0,"a":"主料： 发面500克， 猪肉，香菜300克、 水鹿角菜各50克，嫩白菜帮100克。｜调料： 香油25克，碎葱50克，味精3克，盐2克，黄酱35克，姜末15克。","p":["把白菜猪肉都切成小丁，放入盆中，加入鹿角菜(洗净后切成小段)、碎葱、姜末、香菜末、盐、香油、味精和黄酱拌匀，把味调好制成馅。","把发面对好碱分成30个剂子，用面杖擀成皮，把馅放在皮中捏20余个摺包好。把包好的包子先放10分钟醒一下，然后上屉用旺火蒸10分钟即可。"]},{"i":3,"n":"油爆鲜贝","r":"鲁菜","o":"鲁菜","f":"味鲜美，肉嫩脆。","c":"热菜","m":["爆炒"],"g":["鲜贝","青蒜"],"s":["蒜","料酒","姜","葱","盐","味精","淀粉","高汤"],"t":["炒锅"],"v":0,"a":"主料： 扇贝200克，蒜瓣15克，青蒜25克。｜调料： 植物油500克(实耗约50克)，料酒10克，姜5克，葱25克，盐2克，味精3克，湿淀粉40克，清汤100克。","p":["先将贝壳表面粘液洗掉，撬开贝壳取出贝肉，洗去污物去掉筋，将每个贝肉切成段,放入碗内，加入清汤、料酒、味精和盐、湿淀粉对成汁。","炒勺上旺火，将植物油烧开后，将贝肉放入爆炒几分钟，即倒入漏勺内沥油。","将原勺留底油烧热，再将贝肉倒入，立即烹入对好的汁，颠翻几次，淋上香油即成。"]},{"i":4,"n":"糟煨冬笋","r":"鲁菜","o":"鲁菜","f":"有糟香味，冬笋鲜脆。","c":"热菜","m":["炖煨"],"g":["冬笋"],"s":["香糟","料酒","味精","盐","白糖","高汤"],"t":["炒锅"],"v":1,"a":"主料：鲜冬笋400克， 香糟酒400克。｜调料：鸡油少许，味精5克，盐3克，白糖15克，奶汤500克","p":["先将冬笋的外皮剥去一破两半，再将笋里边的细皮撕去，切掉笋根清洗干净后，放入开水锅中氽透，捞出放于凉水中，再将笋块切成两瓣拍松撕成小条。","炒勺上火，将奶汤烧热，加入白糖、香糟酒、盐和味精，随将冬笋也放入汤内用旺火烧开再移至微火上煨2分钟左右，再转旺火，用湿淀粉勾芡，淋入鸡油即可。"]},{"i":5,"n":"铁素四色球","r":"鲁菜","o":"鲁菜","f":"色彩艳，造型美，味道鲜","c":"热菜","m":["烧扒焖"],"g":["发菜","萝卜","荸荠","口蘑","冬笋"],"s":["味精","料酒","盐","高汤"],"t":["炒锅","蒸锅"],"v":1,"a":"主料：干发菜15克，红根、罐头南荠各200克，罐头鲜蘑20克，青笋200克。｜调料：鸡油15克，葱姜油150克，味精、料酒各10克。盐7克，鸡汤750克。","p":["将发菜用水泡发，洗去泥沙，连同盐2克放入100克鸡汤中，烧开煨透把青笋、戏根均去皮洗净，削荸荠球状，用开水分别煮透，捞出后放于凉水中。鲜蘑码入碗内，放鸡汤适量和味精、料酒各5克，上屉蒸透。","炒勺上火，把葱姜油烧热后，烹入料酒、味精、盐各5克，鸡汤650克，把红根球、青笋球和南荠也放入汤内，煨5分钟后捞出，将汤控去。","将蒸好的鲜蘑扣入盘中，外周围上发菜，并把红根球、青笋球、南荠、码入盘中。","将勺中原汤烧开，用调稀的湿淀粉勾成流芡，淋入鸡油烧在盘内四色球上即可。"]},{"i":6,"n":"奶油扒菜芯","r":"鲁菜","o":"鲁菜","f":"汤乳白鲜美，菜嫩烂可口","c":"热菜","m":["烧扒焖"],"g":["白菜","牛奶"],"s":["料酒","味精","盐","淀粉","高汤"],"t":["炒锅"],"v":1,"a":"主料：青口白菜芯3棵，牛奶100克。｜调料：鸡油、料酒各15克，葱姜油25克，味精、盐各4克，湿淀粉25克，鸡汤600克。","p":["先将白菜芯洗净，顺刀叶连着切成6瓣。","炒勺上火，放入鸡汤500克，加入盐、味精各2克，同时把白菜芯也放入汤内炖烂捞出，控去汤，顺着菜芯撕开，摆入盘中。","汤勺上火，将葱姜油烧热，烹入100克鸡汤和料酒，加入盐味精各2克，烧开后下入菜芯，小火煨5分钟后，再加入牛奶，汤开后用调好的稀淀粉勾芡，淋入少量葱姜油，大翻勺，再淋入鸡油即可。"]},{"i":7,"n":"吉祥干贝","r":"鲁菜","o":"鲁菜","f":"","c":"热菜","m":["爆炒"],"g":["干贝","鸡肉","鸡蛋"],"s":["蒜","高汤"],"t":["炒锅"],"v":0,"a":"水 发 干 贝100 克,鸡 里 脊50 克,眉 毛 蒜1 克,三 套 汤100 克,鸡 蛋 清4 个","p":["水发干贝用毛汤氽后撕成丝鸡里脊去筋制茸,加蛋清,三套汤,湿淀粉,精盐,料酒调成鸡汁","猪大油在炒勺内烧至4成热时,慢慢倒入鸡汁,边倒边搅,用慢火炒熟","一半盛入汤盘,一半在勺内与干贝搅匀后盛入汤盘,撒上眉毛蒜即成."]},{"i":8,"n":"蟹黄鱼翅","r":"鲁菜","o":"鲁菜","f":"甘香软滑，鲜嫩可口，营养丰富，宴客雅肴。","c":"热菜","m":["爆炒"],"g":["螃蟹","鱼翅","白菜","冬笋"],"s":["葱","高汤","姜","料酒","盐","白糖","酱油","味精","淀粉"],"t":["炒锅","蒸锅"],"v":0,"a":"鱼翅，鸡汤，葱，姜片，绍酒，油菜心，笋片，酱油,精盐，白糖，味精，湿淀粉，猪油。","p":["将水发鱼翅洗净放入碗内，加鸡汤，葱,姜片，绍酒，上笼蒸软取出，再入沸水锅焯过，蟹黄切成片，油菜心洗净切成寸段，经热油煸炒成熟，炒锅烧热，放油，葱段，姜片，煸出香味捞出不用，加鸡汤，笋片，油菜心，酱油,精盐，白糖，绍酒烧沸，撇去浮沫后，用漏勺捞出笋片和油菜心放入汤盘内，再将鱼翅，蟹黄入锅在原汤锅内烧沸，加味精少许，稠浓卤汁，下湿淀勾芡，淋上猪油推匀，倒在笋片和菜心上即成。"]},{"i":9,"n":"扒龙须鲍鱼","r":"鲁菜","o":"鲁菜","f":"色美，菜嫩，鱼鲜。","c":"热菜","m":["烧扒焖"],"g":["鲍鱼","芦笋"],"s":["料酒","味精","盐","淀粉","白糖","高汤"],"t":["炒锅"],"v":0,"a":"主料： 罐头鲍鱼250克，罐头龙须菜300克。｜调料： 鸡油25克，料酒15克，味精7克，盐3克，湿淀粉50克，白糖少许，鸡汤400克。","p":["将鲍鱼沙去掉剞上一字花刀，顶刀切成3厘米厚的片，放在盘中。将龙须菜剥去老皮。","炒勺上旺火，放入200克鸡汤，同时加入料酒7克、盐2克白糖和味精，并把龙须菜也放入汤内，把汤烧开后用湿淀粉勾芡，淋上鸡油，盛入盘内码成两排。","另用炒勺放入鸡汤200克，加入料酒8克，盐1克，把鲍鱼也放入汤内用水火烧开后改旺火，用适量湿淀粉勾芡，淋上鸡油，拖入盘中龙须菜上即成。"]},{"i":10,"n":"红扒鱼唇","r":"鲁菜","o":"鲁菜","f":"色泽红亮，鱼唇软烂，味香鲜美。","c":"热菜","m":["烧扒焖"],"g":["鱼唇"],"s":["料酒","酱油","味精","盐","淀粉","高汤"],"t":["炒锅"],"v":0,"a":"主料： 水发鱼唇1公斤。｜调料： 葱姜油75克，鸡油15克，酱油、料酒、毛妻水各20克，味精8克盐3克湿淀粉50克，鸡汤1公斤。","p":["把鱼唇切成长4.5厘米宽2厘米的条，在开水锅中氽透，捞出控去水分后放入炒勺内。勺中放500克鸡汤，加入2克盐、7克酱和味精、料酒5克，用微火煨至汤汁剩1/3时，倒入漏勺里滤去汤汁。","另起勺放入50克葱姜油，烧热后煮入15克料酒加和毛姜水、13克酱油、1克盐、3克味精和500克鸡汤。同时把鱼唇条放入汤内，用微火煨10分钟左右，再用湿淀粉勾成稠芡，淋入25克葱姜油，大翻勺，再淋入鸡油，拖入盘中即可。"]},{"i":11,"n":"油泼青鱼","r":"鲁菜","o":"鲁菜","f":"鱼肉鲜嫩，味美可口","c":"热菜","m":["蒸"],"g":["青鱼","萝卜","豌豆","香菇","鸡蛋"],"s":["葱","香菜","料酒","盐","酱油","味精","姜","胡椒"],"t":["炒锅","蒸锅"],"v":0,"a":"主料： 活青鱼1条(约1.5公斤)红根、豆瓣葱15克，鲜豌豆25克，香菜段50克，加工好的水香菇10克。｜调料：植物油100克，料酒15克，酱油50克，盐5克，味精8克，葱段、姜块各10克姜末5克，胡椒粉少许，鸡蛋适量。","p":["香菇和红根切成小丁，在炒勺的开水中稍烫控去水分，和豌豆放在一起，注入鸡汤煨透后，捞出把汤控净。","将活青鱼宰杀放血，刮鳞去鳃和内脏，洗净后放入鱼盘，加入盐、料酒、姜块(拍松)、葱段，上屉蒸20分钟，取出将汤沥去，另把酱油、味精、胡椒粉放入碗内随鱼上屉。","把蒸好的酱油浇在鱼上，撒上豌豆、香菇丁、红根丁，再撒上豆瓣葱和姜末。","再用炒勺将植物油烧开后浇在鱼身上，撒上香菜段即成。"]},{"i":12,"n":"胡椒海参汤","r":"鲁菜","o":"鲁菜","f":"清淡爽口，味鲜微辣。","c":"汤羹","m":["烩汆"],"g":["海参"],"s":["胡椒","高汤","葱","料酒","盐","味精","姜","香油","酱油"],"t":["炒锅"],"v":0,"a":"主料： 水发海参750克，胡椒粉3克。｜调料： 熟大油、葱各25克，料酒15克，盐4克，味精5克，生姜水10克，香油、酱油少许，鸡汤750克。","p":["把发好的海参放于清水中，逐个细心抠去腹内黑膜，洗净泥沙、片成大片，在开水中氽透控出水分。香菜择好洗净切成3厘米长的段。","炒勺上旺火，将熟大油烧热放入葱丝稍炒，烹入料酒加入鸡汤、味精、毛姜水、酱油盐和胡椒粉，将海参片也放入汤内，汤开后将浮抹撇去调好味，淋入香油盛入大汤碗中，撒上葱丝和香菜段即可。"]},{"i":13,"n":"糖炒虾瓣","r":"鲁菜","o":"鲁菜","f":"虾瓣鲜嫩，味甜美微酸。","c":"热菜","m":["爆炒"],"g":["虾","豌豆"],"s":["白糖","料酒","醋","葱","姜","香油","蒜","盐","淀粉","高汤"],"t":["炒锅"],"v":0,"a":"主料： 鲜大虾750克，罐头豌豆15克。｜调料： 植物油900克(实约100克)，料酒50克，白糖50克，米醋25克，香油、葱丝、姜丝、蒜片各10克，盐3克，干淀粉3克，鸡汤500克。","p":["香菇切成丝。将虾须、虾枪、虾爪剪去，挑出沙包除沙肠，从脊部片开成一大片。虾皮朝下，把筋扦断后，将每只虾剁成3段。用1克盐、10克料酒腌上，并撒上干淀粉。","将虾段下到烧至8成熟的植物油中，炸至金黄色，倒入漏勺中将油滤去。","另用炒勺放入100克植物油烧热，加入葱、姜丝和蒜片煸出味，烹入25克料酒，加入白糖、米醋、鸡汤和2克盐，再把豌豆和香菇丝放入，把炸好的虾段也放入，待把汤炒干，淋入香油即成。"]},{"i":14,"n":"炖口蘑龙凤珠","r":"鲁菜","o":"鲁菜","f":"汤色乳白，味道鲜美，肉质软嫩。","c":"热菜","m":["炖煨"],"g":["口蘑","鸡肉","猪肉","虾","白菜"],"s":["味精","盐","料酒","姜","葱","高汤"],"t":["炒锅"],"v":0,"a":"主料： 母鸡肉1.3公斤，口蘑25克，对虾肉500克，净菠菜芯10棵。｜调料： 植物油900克(实耗约70克)，熟大油25克，味精、盐各10克，料酒、鸡油姜块各15克，葱段25克，奶汤1.5公斤。","p":["将母鸡肉剁成三角块，放入烧至6成热的植物油炒勺中，稍炸后捞出沥油。虾肉切成厚片。口蘑泡后把泥沙洗去。","炒勺上旺火,把熟大油烧热，放入拍松的姜块煸炒，烹入料酒加入盐、奶汤，把鸡块和口蘑也放入汤内，而后改用小火炖烂。","然后将葱、姜拣出，再放入虾片,汤开后撇去浮沫,放入菠菜芯,淋入鸡油即成"]},{"i":15,"n":"珊瑚豌豆","r":"鲁菜","o":"鲁菜","f":"色美味鲜，曾为宫廷风味菜。","c":"热菜","m":["爆炒"],"g":["豌豆","虾"],"s":["料酒","味精","姜","盐","葱","高汤"],"t":["炒锅"],"v":0,"a":"主料：鲜豌豆荚2公斤，大虾脊背油7条。｜调料：葱姜油50克，鸡油、料酒各15克，味精、毛姜水各10克，盐5克，姜块20克，葱段25克，鸡汤150克。","p":["剥出豌豆粒洗净后，将水控干。","炒勺上火，放入50克清水，加入拍松的葱、姜、料酒5克、盐1克，将汤烧开后，把大虾油放入开水勺中煮熟后捞出。","炒勺再回到火上，放入鸡油，加入4克盐、毛姜水、味精和10克料酒以及葱姜油同时把虾油和豌豆也放入汤内，用中火将汤煨干盛盘，淋入鸡油即可。"]},{"i":16,"n":"扒海羊","r":"鲁菜","o":"鲁菜","f":"色泽金黄，味鲜汁浓","c":"热菜","m":["烧扒焖"],"g":["羊肉","海参","猪腰","猪肉"],"s":["花椒","酱油","葱","盐","姜","味精","料酒","淀粉","高汤"],"t":["炒锅"],"v":0,"a":"主料： 水发海参500克，羊腰窝肉500克。｜调料： 鸡油15克，葱姜油100克，酱油6克，花椒10克，葱段50克，盐5 克，姜块25克，味精5克，料酒20克，湿淀粉50克，鸡汤2公斤。","p":["将水发海参洗净片成大片，在开水中氽透，捞出控去水分。锅中先放鸡汤1.5公斤，加入花椒，葱、姜(拍松)和15克料酒，把羊腰窝肉放在锅内煮烂，捞出后，切成10厘米长、3厘米宽的大片码入盘内。","炒勺上旺火把葱姜油烧热，烹入5克料酒，加入500克鸡汤、酱油、盐、味精，同时把海参片羊肉片也放入汤内，然后用小火10分钟，用湿淀粉勾流汁芡翻动后，淋入鸡油即可。"]},{"i":17,"n":"沙锅散丹","r":"鲁菜","o":"鲁菜","f":"鲜嫩清香，清淡爽口。","c":"热菜","m":["烧扒焖"],"g":["猪大肠","羊肉","虾"],"s":["盐","味精","料酒","葱","姜","花椒","高汤"],"t":["砂锅"],"v":0,"a":"主料： 羊散丹(即瓣胃)2.5公斤。｜调料： 鸡油10克，盐、味精各5克，卤虾油、料酒各10克，葱段、姜块各15克，葱丝10克，姜丝5克，花椒10粒，鸡汤2.5公斤。","p":["先用80℃热水把羊散丹烫一下捞出，用手将散丹的黑膜搓去，洗净后放入开水锅中，加入葱段、姜块、花椒、用微火煮约3小时左右，煮烂捞出，将散丹上的油脂、杂物择去，再用温水洗干净，然后切成三角块，放入开水中煮1分钟，捞出控水。","把散丹块放入沙锅里，加入鸡汤，用旺火烧开，把浮沫撇去。再加入葱丝、味精、料酒、盐。汤滚开后，再用微火5分钟，随后淋入鸡油，撒上葱丝、香菜段即成。卤虾油盛在碗中，随沙锅散丹一起上桌。"]},{"i":18,"n":"烩乌鱼蛋","r":"鲁菜","o":"鲁菜","f":"乌鱼钱乳白色，质地柔软鲜嫩，汤色浅黄清淡，略带酸辣美味。","c":"汤羹","m":["烩汆"],"g":["墨鱼"],"s":["香菜","高汤","胡椒","淀粉","盐","味精","姜","醋","酱油"],"t":["炒锅"],"v":0,"a":"主料： 乌鱼蛋(墨斗鱼缠卵)120克。｜调料： 鸡油10克，鸡汤260克，香菜末(洗净消毒)2克，胡椒粉少许，湿淀粉8克，盐1克，味精3克，姜汁8克，酱油2克，醋2克。","p":["用温水洗乌鱼蛋，然后把脂皮剥去，放入有凉水的炒勺内，在旺火上烧开后，离火浸泡5～6小时。此后，把乌鱼钱一片一片地揭开放入有凉水的炒勺中，在旺火上烧到7～8成开，换成凉水再烧。这样反复5～6次，除掉咸腥味。","在炒勺内倒入鸡汤、乌鱼钱、料酒、姜汁、盐、酱油、味等，在旺火上烧开。然后撇出浮沫，加入调稀的湿淀粉，搅拌均匀，再加入胡椒粉、醋，翻搅几下，滴入鸡油，盛入碗里，在上面撒上香菜末即成"]},{"i":19,"n":"咕噜牛排","r":"粤菜","o":"鲁菜","f":"（粤菜）","c":"热菜","m":["炸"],"g":["牛肉","冬笋","猪肉","鸡蛋","辣椒"],"s":["葱","蒜","香油","盐","料酒","淀粉"],"t":["炒锅"],"v":0,"a":"牛肉300克，熟鲜笋肉150克，鸡蛋液30克，辣椒25克，葱段5克，蒜泥、芝麻油各00.5克，精盐1.5克，汾酒7.5克，湿淀粉40克，干淀粉75克，花生油750克。","p":["将牛肉切成块，在上面斜刀轻剞横竖花纹。鲜笋和辣椒切成菱形块；肉块用精盐、汾酒拌匀，腌约15分钟，加入鸡蛋液和湿淀粉搅匀，再粘上干淀粉","炒锅上中火，下油烧至五成熟，把肉炸成牛排，约炸3分钟端离火口，炸浸约2分钟捞起。把锅放回炉子上，烧至五成热，将已炸过的牛排和笋块一起下锅，再炸约2分钟，待肉呈金黄色至熟，倒入漏勺沥油","炒锅留油少许，放回炉子上，投入蒜、辣椒，爆出香味，加葱烧至微沸，用湿淀粉调稀勾芡，随即倒入肉块和葱块拌炒，淋入麻油和花生油，炒匀即可"]},{"i":20,"n":"珊瑚金钩","r":"鲁菜","o":"鲁菜","f":"味道鲜美,营养丰富","c":"凉菜","m":["炸"],"g":["海米","豆芽","辣椒","木耳"],"s":["葱","姜"],"t":["炒锅"],"v":0,"a":"嫩黄豆芽350克,红辣椒丝5克,葱姜丝各1克,木耳丝11克","p":["豆芽洗净去根，放入开水中煮熟，捞出控水，装盘。","香油烧至5成熟，放入花椒粒炸成金黄色捞出，将辣椒丝，葱姜丝放入，再依次放入木耳丝，酱油，料酒，醋，白糖，精盐浇开后，浇在豆芽上即成。"]},{"i":21,"n":"九转大肠","r":"鲁菜·济南","o":"鲁菜","f":"色泽红亮，五味俱全，是山东名菜。","c":"热菜","m":["爆炒"],"g":["猪大肠"],"s":["香糟","盐","高汤","味精","料酒","葱","姜","蒜","香菜","醋","胡椒","桂皮"],"t":["炒锅"],"v":0,"a":"熟大肠750克，熟猪油、花椒油、清汤、白糟、盐、味精、料酒、葱、姜、蒜、香菜、醋、胡椒面、砂仁、肉桂、豆寇各适量。","p":["将大肠切成2厘米的段，香菜切1厘米的小段。","勺内加入清水，开后放入大肠余透，捞出沥净水份。","炒勺上火加熟猪油。","白糖，将糖炒至发红时，放大肠们上色，下人惹姜蒜未，烹上醋、料酒，加入清汤，开后下盐、白糖、昧糟、三种药材的一半。","然后移至小火，烧至汤汁发浓时，加入。"]},{"i":22,"n":"糖醋鲤鱼","r":"鲁菜·济南","o":"鲁菜","f":"传统山东名菜。此菜源于山东济南黄河码头洛口镇，用黄河鲤鱼，经炸、熘而成。特点是鱼肉外焦里嫩，味酸甜而","c":"热菜","m":["炸"],"g":["鲤鱼"],"s":["白糖","醋","料酒","酱油","葱","姜","蒜","盐","淀粉","高汤"],"t":["炒锅"],"v":0,"a":"鲤鱼750克 白糖200克，酱油、料酒各10克，葱、姜各2克，醋120克，蒜茸、精盐各3克，试淀粉100克 清汤300克 花生油1500克","p":["鲤鱼去麟、内脏、两腮，于身两侧每2.5厘米直剞后斜剞成翻刀，提起鱼尾使刀口张开，料酒、精盐撒入刀口稍腌；清汤、酱油、料酒、醋、白糖、精盐、湿淀粉兑成芡汁；在刀口处撒上湿淀粉后放在七成热的油中炸至外皮变硬，以微火浸炸3分钟，再上旺火炸至金黄色，捞出摆盘，用。"]},{"i":23,"n":"鱼腹藏羊肉","r":"鲁菜","o":"鲁菜","f":"山东名菜，相传有春秋时代齐国人易牙所创。在北方水产以鲤鱼为最鲜，肉以羊肉为最鲜，此菜两鲜并用，互相搭","c":"热菜","m":["烤"],"g":["鱼肉","羊肉","猪肉","鲤鱼","香菇","冬笋","黄瓜","辣椒"],"s":["盐","料酒","酱油","醋","白糖"],"t":["炒锅","烤箱"],"v":0,"a":"鲜鲤鱼７００克，净羊肉２００克 香菇５０克，冬笋３０克，黄瓜２０克 红辣椒１５克，精盐、酱油各１０克，料酒２５克，醋、糖各２０克","p":["将洗净鲤鱼整鱼剔骨后加调料稍微腌制；将羊肉、冬笋、香菇等切成米粒状，加调料放入锅中煸炒后填入鱼腹中；将鱼用猪网油裹好后放置于烤炉内烤熟；将红辣椒、黄瓜切成细丝，摆放在烤好的鱼腹上即可。"]},{"i":24,"n":"炸芝麻里脊","r":"鲁菜","o":"鲁菜","f":"色泽金黄，外焦里嫩，香鲜可口，猪里脊肉鲜嫩。","c":"热菜","m":["炸"],"g":["芝麻","猪肉","鸡蛋"],"s":["盐","味精","料酒","酱油","淀粉"],"t":["炒锅"],"v":0,"a":"猪里脊肉400克。 鸡蛋一个（重约50克）、芝麻25克。精盐15克、味精10克、绍酒15克、酱油10克、花生油500克（实耗油100克）、淀粉10克。","p":["将里脊肉批成1厘米厚的片，两面均匀的剖上十字花刀，再改成长3.5厘米、宽讫1.5厘米的条放入盛器中，加精盐、味精、绍酒、酱油腌渍入味。","另一只碗内放入蛋清，湿淀粉搅匀成糊备用。","炒锅内放入花生油，用中火烧至六成热（约150℃）时，将肉逐条粘上蛋糊、再蘸满一层芝麻仁，放入油内炸透捞出，待油温升至八成热时，再将肉投入油内一炸，炸至呈金黄色时捞出沥油，装盘即成。"]},{"i":25,"n":"四喜丸子","r":"鲁菜","o":"鲁菜","f":"色泽红润，鲜香糯嫩，入口即散，老幼皆宜。","c":"热菜","m":["烧扒焖"],"g":["猪肉","香菇","冬笋","鸡蛋"],"s":["葱","姜","酱油","料酒","盐","花椒","八角","味精","淀粉"],"t":["炒锅","蒸锅"],"v":0,"a":"猪肥、瘦肉（1：4）500克。 冬菇10克、冬笋10克、鸡蛋100克。葱10克、姜10克、酱油15克、绍酒20克、精盐15克、花椒5克、八角5克、味精15克、湿淀粉25克、花生油25克。","p":["将猪肥肉切0.3厘米的丁，瘦肉剁成细茸，放入碗内，加入鸡蛋、葱姜末、湿淀粉、酱油、绍酒拌匀，做成四个大小一致的丸子备用。","冬菇、冬笋洗净均匀切成片，炒锅放入花生油，上中火烧六成热（约150℃）时放入肉丸，炸至金黄色捞出。","放入碗内加入酱油、绍酒、花椒、八角、清汤入笼用旺火蒸30分钟取出，摆入大盘内。","原汤滗入锅内，加冬笋片、冬菇片，用旺火烧开，放入味精、葱油拌匀，用湿淀粉勾芡，浇在九子上即可。"]},{"i":26,"n":"麻粉肘子","r":"鲁菜","o":"鲁菜","f":"麻粉软滑，卤汁晶莹，时肉透烂，肥而不腻，荤素搭配，清爽适口入最宜夏令食用。","c":"凉菜","m":["烧扒焖"],"g":["猪肉","核桃仁","黄瓜"],"s":["葱","花椒","料酒","盐","姜","芝麻酱","醋","蒜"],"t":["炒锅"],"v":0,"a":"猪肘子500克。 核桃仁50克、白豆20克、黄瓜15克。葱10克、花椒5克、绍酒10克、精盐4克、姜2克、麻酱2克、醋3克、蒜5克。","p":["将肘子肉刮洗干净，放入锅内煮至九成熟时，捞出切成长4.5厘米、宽2厘米、厚1厘米的块再放入锅内，加上葱椒、绍酒、精盐用旺火烧沸，用湿绿豆淀粉、芝麻酱慢慢倒入锅内，随倒随搅，煮沸后倒入碗内，晾凉后放入冰箱内冷却后即成麻粉，切成象眼块。","再用炒锅，放入清汤、精盐烧沸勾芡，再放入葱椒、绍酒、姜汁、葱油调匀后即成“白玉卤”，晾凉待用，再用芝麻酱、清汤、精盐、醋蒜末搅匀成糊，均匀地抹在肘子上，再将肘子与制好的麻粉拌匀盛入盘内，核桃仁、毛豆、黄瓜丝摆在上面，鲜花椒用沸水烫一下，拍扁放在中间，浇上“白玉卤”即成。"]},{"i":27,"n":"酥炸春花肉","r":"鲁菜","o":"鲁菜","f":"外酥香，里鲜嫩，口感清爽带微辣，营养价值较高，常用于宴席菜肴。","c":"热菜","m":["炸"],"g":["猪肉","荠菜","冬笋","香菇","木耳","鸡蛋"],"s":["葱","姜","酱油","盐","椒盐","味精"],"t":["炒锅"],"v":0,"a":"猪里脊肉500克。 荠菜50克、冬笋15克、冬菇10克、木耳10克、鸡蛋5个。葱10克。姜10克、酱油15克、猪油50克、椒盐5克、精盐5克、味精3克。","p":["将里脊丝切成长5厘米，厚0.3厘米待用，鸡蛋磕入碗内、加精盐湿淀粉，清汤搅匀，用锅制成3张蛋皮，每张蛋皮切成相等的七块，再用面粉、老酵面加水搅匀，然后加入熟猪油食用碱调成发酵糊。","炒锅内加熟猪油，上中火烧至五成热（110℃）时，放入葱、姜丝、肉丝、冬笋丝、荠菜、冬菇丝、木耳丝、酱油略炒，随后加入清汤、精盐、味精烧开，用湿淀粉勾芡，加芝麻油盛出为馅。","将炒好的熟馅分放在21张蛋皮上，逐个卷成食指粗的卷，用面糊粘住口。","炒锅内加入熟猪油，烧至八成热（约176℃）时，将蛋卷逐个粘上发酵糊，下锅炸至金黄捞出装盘，上桌时带花椒盐佐食。"]},{"i":28,"n":"坛子肉","r":"鲁菜","o":"鲁菜","f":"猪肉酥烂而不失其形，口感肥而不腻，色泽红润而亮，其味有独特香味。","c":"热菜","m":["烧扒焖"],"g":["猪肉"],"s":["酱油","白糖","桂皮","葱","姜"],"t":["砂锅"],"v":0,"a":"猪硬肋肉500克。 酱油15克，冰糖10克、肉桂10克、葱段5克、姜片5克。","p":["将猪硬肋切成2厘米见方的块，放入沸水锅中汆水，用清水洗净。","将肉块放入坛子内加入酱油，冰糖、肉桂、葱段、姜片、清水（以浸没肉块为宜），用盘子将坛子口盖好，先用旺火烧沸，再移到微火上焖至汤浓肉酥烂即可。"]},{"i":29,"n":"锅烧肘子","r":"鲁菜","o":"鲁菜","f":"色泽金黄，外焦里嫩，干香无汁，肥而不腻","c":"热菜","m":["烧扒焖"],"g":["猪肉","鸡蛋"],"s":["酱油","料酒","姜","淀粉"],"t":["炒锅","蒸锅"],"v":0,"a":"猪前肘（带皮去骨）500克。 酱油10克、绍酒15克、姜片15克、鸡蛋2个（重约100克）、湿淀粉50克、花生油2500克。","p":["将肘子放入水锅内，用旺火焯水洗净，切成1.5厘米厚的大片，皮朝下摆入盛器内，加酱油、绍酒、葱段、姜片入笼蒸熟取出，沥净汤汁。","加湿淀粉、鸡蛋、绍酒、酱油调成糊。","将一半糊平摊在平盘内，肘子皮朝下摆在糊的上面，再将剩汆的糊均匀地倒在肘子上面。","炒锅置火上，下油烧至七成热（175℃）时，用小火将挂糊的肘子，推入油内炸至起壳时，捞出，再将油锅用旺火加热，待油温升至八成热（约200℃）时，再移至小火炸至肘子表面呈金黄色，内熟外脆时，立即捞出沥净油，用刀切块装盘，上面撒上花椒面，另带3厘米长的葱段一碟，甜面酱，花椒盐各了碟，佐食。"]},{"i":30,"n":"山东菜丸","r":"鲁菜","o":"鲁菜","f":"用料多样，质地疏松软烂，肥而不腻，汤浓味鲜，酸辣咸香俱全。","c":"热菜","m":["蒸"],"g":["猪肉","鹿角菜","白菜","鸡蛋"],"s":["香菜","盐","葱","姜","味精","醋","香油"],"t":["炒锅","蒸锅"],"v":0,"a":"猪肥瘦肉各半250克。 香菜100克、淳米50克、鹿角菜50克、白菜。鸡蛋2个（重约100克）。精盐4克、葱姜末10克、味精0.5克、食醋、芝麻油适量。","p":["将猪瘦肉洗净，剁成茸状，放入碗内，加鸡蛋搅匀，猪肥肉批成厚0.6厘米的片，肉片两面交叉打直刀，再改切成0.6厘米的见方丁，淳米洗尽泥沙，鹿角菜择洗干净，取30克，切成细末。","20克切成3厘米长的段。","取盛器一个，放入瘦肉茸，葱、姜末、海米末、鹿角菜米、大白菜末、香菜末，加入胡椒粉、味精、精盐，搅拌均匀，制成直径3.3厘米的丸子，平摆在盘内，入笼用旺火蒸约8分钟，至熟取出，放在大碗内，汤锅内放入清汤、精盐，蒸沸，放香菜段旺火烧开后加入味精，倒入大汤碗中，淋上芝麻油，食醋，撒上胡椒面即成。"]},{"i":31,"n":"炸大扁","r":"鲁菜","o":"鲁菜","f":"外酥脆，里软嫩，疏松香醇，色泽杏黄，配以葱段，甜面酱佐食更佳。","c":"小吃","m":["炸"],"g":["猪肉","海参","荸荠","冬笋","毛芋头","鸡蛋"],"s":["盐","料酒","味精","酱油","葱","姜"],"t":["炒锅"],"v":0,"a":"猪肥瘦肉200克。 水发海参75克、熟荸荠50克、净冬笋50克、熟蒲芋头、蛋糊适量，精盐4克、绍酒10克、酱油10克、味精1克、葱姜末15克、花生油1500克（实耗油75克）。","p":["猪肉洗净切成5x3x3厘米的丁，放在碗内加绍酒、味精、酱油、精盐、姜末、葱末调拌浸泡，海参、熟肉膘、熟荸荠、冬笋、薄菜头切成5x3xl厘米的扁丁，放在猪肉丁碗内，调成馅分成15份。","炒锅放火上，加少量花生油，小火烧至三成热（约75℃），用少量蛋糊放入锅内：取一份馅放在蛋糊上，用手压成扁形，再将蛋糊倒在馅上面，略凝固，推入油锅中，炸至成熟捞出沥油，即成大扁。","依次做成15个“大扁”。","炒锅移至中火上，油烧至七成热（约175℃）时，将制好的大扁放入油锅，炸成杏黄色捞出，倒入盘内，撒上花椒盐；将葱段、甜面酱分别装入小碟一同上桌。"]},{"i":32,"n":"炸灌汤丸子","r":"鲁菜","o":"鲁菜","f":"肉丸外皮酥脆，内包汤汁。色泽棕黄，香鲜可口，食时蘸五香粉味更佳。","c":"小吃","m":["炸","烩汆"],"g":["猪肉","面粉","鸡蛋"],"s":["高汤","淀粉","盐"],"t":["炒锅"],"v":0,"a":"猪瘦肉250克。 高汤冻100克、面包末50克、花生油500克、淀粉50克、鸡蛋1个（重约50克）。）精盐10克，五香粉5克。","p":["【制法】猪瘦肉洗净剁成肉泥，放入碗内，加入精盐、鸡蛋清、湿淀粉拌匀，高汤冻切1厘米见方的块，共12块待用。","用肉泥做成直径约2.5厘米的丸子，肉丸中间包一块高汤冻，表面均匀地沾上一层面包末，彼此共做12个。","炒锅上中火，倒入花生油，烧至五六成热（约125～1500℃）时逐个放入肉丸，炸至棕黄色捞出装盘即可，以五香粉蘸食。"]},{"i":33,"n":"双味蹄筋","r":"鲁菜","o":"鲁菜","f":"红烧蹄筋色泽红亮，汤汁浓郁，软韧咸香，酿蹄筋红、绿、黄、白相间，色彩悦目，鲜嫩适口。","c":"热菜","m":["烧扒焖"],"g":["蹄筋","偏口鱼","猪肉","火腿","白菜","辣椒","鸡蛋"],"s":["香菜","葱","盐","味精","料酒","姜","淀粉","酱油"],"t":["炒锅","蒸锅"],"v":0,"a":"发好的蹄筋500克，偏口鱼肉100克、猪肥肉50克、火腿20克、小油菜心20克、红柿椒丝10克、香菜10克、青菜心10克、玉兰花5克、鸡蛋）个。 大葱10克、精盐5克、味精5克、绍酒10克、姜末5克、酱油6克、淀粉少许。","p":["将发好的蹄筋取一半，顺长从中间切开，再切成2.5厘米长的段，大葱批成两半，切成2.5厘米长的段，玉兰片、火腿切成厚0.3厘米、长宽各2厘米的片，青菜心切成2.5厘米长的段，将鱼肉、肥肉膘一起剁成细泥，葱姜切成细末放入碗内，加入精盐、味精、绍酒、鸡蛋清和少量清水，搅匀成馅，将多汆的玉兰片，火腿均切成细末。","将粗细均匀的发好蹄筋切成4厘米长的段，从中间割上道口（不要割断），将鱼肉馅抹在蹄筋刀口里，馅要高出一点，上面以玉兰片末、火腿末、香菜末、红柿椒丝等配料点缀成不同颜色的花卉图案，做酿蹄的原料放在盘内。","炒锅加入花生油，以中火烧至七成热（约175℃）放入葱段（姜末炒几下，加精盐、酱油、绍酒、玉兰片、火腿片、青菜心、蹄筋、清汤烧开后用湿淀粉勾浓芡，淋鸡油盛在盘子中间。","油菜心用力修整好从根部打十字花刀，放热清汤内汆过入味，围在烧蹄筋周围。","将酿蹄筋坯料放入笼内。","以旺火蒸约8分钟至熟时取出，摆在红烧蹄筋周围。","原汤倒入炒锅内，放入精盐、绍酒、清汤烧开，撇去浮沫，加入味精，用湿淀粉勾薄芡，搅匀浇在酿蹄筋上面即成。"]},{"i":34,"n":"酥烂蹄筋","r":"鲁菜","o":"鲁菜","f":"色泽金黄，外酥里香，下酒佳肴。","c":"热菜","m":["炸"],"g":["蹄筋","猪肉","鸡蛋"],"s":["盐","味精","料酒"],"t":["炒锅"],"v":0,"a":"油发猪蹄筋200克。 精盐3克、味精1克、绍酒10克、鸡蛋黄若干、碱少许。","p":["将发好的猪蹄筋挤去水分，切成3.3厘米段，放入碗内加盐、味精、绍酒腋渍；另取一碗，放上面粉发酵，用少许清水调匀，加少量碱、鸡蛋黄调成糊，再加上花生油拌匀。","取炒锅，倒入花生油，置中火烧至六成热（约150℃），将蹄筋拖上糊，逐条炸至起壳捞出，待油加热九成热（约225℃）时，重炸一次，炸至酥，呈金黄色时取出装盘即成。"]},{"i":35,"n":"爆炒腰花","r":"鲁菜","o":"鲁菜","f":"腰花鲜嫩，造形美观，味道醇厚，滑润不腻。","c":"热菜","m":["爆炒"],"g":["猪腰","冬笋","木耳"],"s":["酱油","盐","味精","料酒","淀粉"],"t":["炒锅"],"v":0,"a":"猪腰子200克。 冬笋片、水发木耳各50克。酱油10克、精盐3克、味精1克、绍酒20克、湿粉15克。","p":["将腰子洗净，一剖两片，批去腰臊，剖成麦穗花刀，切成宽2厘米、长5厘米的条，加酱油入味，用湿淀粉拌匀待用。","笋片、木耳用沸水锅淖一下，酱油、精盐、味精、绍酒、清汤、湿淀粉调成芡汁。","炒锅内加入花生油，置旺火上烧至九成热（约225℃）时，将腰花入油滑至卷缩成麦穗状迅速捞出，炒锅内留少量油，烧至六成热（约150℃）时，将蒜片、葱末放入煸炒，烹入醋、绍酒，加入冬笋片、木耳略炒，倒入芡汁，然后将腰花投入，迅速颠翻，淋上鸡油出锅即成。"]},{"i":36,"n":"汤爆双脆","r":"鲁菜","o":"鲁菜","f":"质地脆嫩，汤清质淡，味道香醇。","c":"汤羹","m":["爆炒","烩汆"],"g":["猪肚","鸡肉"],"s":["高汤","葱","花椒","料酒","香菜","酱油","盐","味精"],"t":["炒锅"],"v":0,"a":"猪肚头150克、鸡肮100克。 葱椒15克、绍酒15克、香菜末适量、酱油10克、精盐3克、味精1克。","p":["肚头、鸡肮头用刀切开，剥去外皮，在清水中洗净，去掉里面的筋杂、外面刻十字花刀（深为肚厚的2／3），清水洗净放入另一碗内备用。","汤锅内放入清水，置旺火上烧至八成热时，先放鸡肫后放肚头末，立即捞出放入汤碗内，加葱椒、绍酒拌匀，撒入香菜末、胡椒粉。","炒锅内放入清汤、酱油、精盐、葱椒、绍酒置火上加热烧沸；打去浮沫，加味精浇入汤碗内，迅速上桌，落桌后将主料推入汤内即成。"]},{"i":37,"n":"冰糟肘子","r":"鲁菜","o":"鲁菜","f":"色泽红亮，肉香味浓，质地酥烂。","c":"热菜","m":["炸"],"g":["猪肉"],"s":["香糟","酱油","白糖","料酒","葱","姜","高汤"],"t":["炒锅","蒸锅"],"v":0,"a":"猪肘（带皮骨）750克。 酱油16克、冰糖50克、绍酒20克、葱段、姜片20克、花椒油15克、清汤适量、花生油2500克。","p":["将肘子用手叉架在火上烤至皮面发焦时，放入温水中泡透）用刀刮净焦皮，用刀顺骨劈开至露骨，放入汤锅中，煮至六成熟时捞出，趁热用净布擦干肘子皮面的浮油，抹上糖色，晾干，放入八成热（约200℃）的油锅中炸至微红，肉皮起皱纹成小泡时捞出，用刀剔去骨头，从肉的内侧切成核桃形的块（深度为肉的2／3）取大碗一个，将肘皮朝下放入碗内，然后加入冰糖、酱油、绍酒、清汤、葱段、姜片上笼蒸至酥烂取出，扣入盘内，将汁入锅内，加入清汤，用湿粉勾芡，加入花椒油，淋在肘子上面即成。"]},{"i":38,"n":"烤网油签","r":"鲁菜","o":"鲁菜","f":"外皮酥脆，肉嫩味香，造型整齐。","c":"热菜","m":["烤"],"g":["猪肉","鸡蛋"],"s":["酱油","味精","葱","姜","料酒","淀粉"],"t":["烤箱"],"v":0,"a":"猪瘦肉200克，猪网油100克。 酱油6克，味精0.5克、葱姜丝12克、鸡蛋清若干，绍酒10克、湿淀粉30克","p":["将猪瘦肉切成长4.5厘米、宽0.2厘米、厚0.2厘米的丝，加葱、姜丝、酱油、鸡蛋清、清汤、绍酒、味精拌匀。","猪网油切成长30厘米、宽15厘米，共切3块，把拌好的肉丝均匀地分成3份，分别放在网油上包成长20厘米、宽4厘米的“网油签”。","用湿淀粉和蛋清调成糊，沾住“油签”封口处，放入烤箱内用旺火烤20分钟，烤至两面金黄色时取出。","再改切成小长方块，整齐地摆在盘内即成。"]},{"i":39,"n":"豆鼓肉","r":"鲁菜","o":"鲁菜","f":"色泽光亮，味道鲜醇，具有豆鼓所特有芳香甘美，食后回味无穷。","c":"凉菜","m":["蒸"],"g":["猪肉"],"s":["葱","姜","酱油","盐","料酒","味精","白糖","高汤"],"t":["炒锅","蒸锅"],"v":0,"a":"猪五花肉（带皮）250克。 豆鼓75克、葱段、姜丝15克、酱油10克、精盐3克。绍酒15克、味精1克、白糖30克、清汤适量。","p":["将带皮五花肉洗净放入锅内，用中火煮至六成熟时捞出，切成宽1厘米、长4厘米的片，放入盆内，加入豆鼓、葱段、姜丝、酱油、精盐、绍酒、味精、白糖、清汤、入笼蒸约30分钟取出。","凉透成冻状，食物改刀切成片或块装盘即成。"]},{"i":40,"n":"煎雏肉","r":"鲁菜","o":"鲁菜","f":"肉质鲜嫩，芡汁红亮，口感香醇而略带麻辣。","c":"热菜","m":["煎塌"],"g":["猪肉","冬笋","豌豆"],"s":["葱","姜","盐","味精","酱油","料酒","白糖","淀粉"],"t":["炒锅"],"v":0,"a":"猪里脊肉（当地俗称“雏肉”）200克。 玉兰片50克、豌豆30克。葱姜丝15克、精盐4克、酱油2克、味精0.5克、绍酒15克、白糖20克、花椒油、湿淀粉各适量。","p":["将猪里脊肉片切成0.3厘米厚的大片，剖上深度为肉片厚度1／2的十字花刀，再改切成象眼块，用鸡蛋清、精盐、湿淀粉腌渍之味待用，取炒锅，加入花生油，上中火烧至六成热（约150℃）时，将肉片下锅滑熟倒入漏勺沥油原锅留有少量油，用中火烧热，加葱、姜丝、玉兰片丝煸炒几下，再加入清汤，白糖、酱油、精盐、味精、绍酒、豌豆烧开，用湿淀粉勾成芡，倒入肉片，加入花椒油翻锅盛出装盘即成。"]},{"i":41,"n":"奶汤棱桃仁","r":"鲁菜","o":"鲁菜","f":"肉质鲜美，汤浓味醇。","c":"甜品","m":["烩汆"],"g":["核桃仁","猪肉","白菜","香菇","冬笋","火腿","鸡蛋"],"s":["高汤","葱","盐","姜","料酒","淀粉"],"t":["炒锅","蒸锅"],"v":0,"a":"猪臀尖肉200克。 菜心50克、水发冬菇50克、冬笋30克、火腿25克、葱段适量。精盐4克、姜汁7克、绍酒15克、鸡蛋清3个、湿淀粉50克。","p":["将猪臀尖肉片成2.5厘米的大片，在两面每隔0.5厘米剂上交叉直刀纹，切成2.5厘米见方块，用鸡蛋清，湿淀粉、精盐上浆入味。","火腿、菜心、冬菇、冬笋批成长3.5厘米、宽1.5厘米、厚0.3厘米的片。","均放入沸水中焯一下备用。","汤锅内放清水，烧沸后放入肉块，一沸即捞出，放入碗中加进葱段、姜汁、精盐、奶汤入笼蒸熟（这时肉呈核桃形）取出滗去汤汁，去掉葱段，扣入汤盘内。","炒锅内放葱油，中火烧至七成热（约175℃）时入奶白汤炒沸，放入菜心、香菇、冬笋、精盐、姜汁、葱椒、绍酒，用湿淀粉勾芡，浇在核桃肉上，将火腿片摆在上面即成。"]},{"i":42,"n":"炒肉丝拉皮","r":"鲁菜","o":"鲁菜","f":"肉丝滑软脆嫩，香美醇厚，拉皮色白透明，凉爽柔软，调和酸香等口味，食之令入爽快，是盛夏之佳肴。","c":"凉菜","m":["爆炒"],"g":["猪肉","粉丝粉皮","鸡蛋","木耳","洋葱","黄瓜"],"s":["香菜","盐","香油","醋","芝麻酱","蒜","酱油"],"t":["炒锅"],"v":0,"a":"猪瘦肉500克。 香菜10克、鸡蛋1个、木耳10克、葱头15克、黄瓜20克。精盐10克、芝麻油20克、芝麻酱25克、醋15克、蒜15克、花生油25克、酱油10克。","p":["将猪瘦肉洗净切成细丝，葱头洗净切成丝，香菜梗拆洗干净切成3.5厘米长的段，黄瓜、鸡蛋皮、木耳均切成丝。","炒锅内放入花生油，中火烧至五成热（约125℃），放入肉丝炒至半熟，加酱油、葱头翻炒，加精盐、香菜段炒熟，淋上芝麻油翻匀，分盛两小盘内，湿淀粉调成稀糊，加精盐溶化，入沸水锅拉成2张粉皮，用清水浸泡、捞出后切成1厘米宽、5厘米长的条，放入盘中摆正，将黄瓜丝、木耳丝、蛋皮丝顺序放在粉皮上摆成为花色图案。","芝麻酱加入精盐，凉开水调成糊状，用酱油、醋、蒜泥、芝麻油对成汁，浇在粉皮上。","同炒肉丝一井上桌即可。"]},{"i":43,"n":"扒牛肉条","r":"鲁菜","o":"鲁菜","f":"色泽红润，牛肉酥烂，味鲜适口。","c":"热菜","m":["烧扒焖"],"g":["牛肉"],"s":["葱","姜","酱油","盐","料酒","八角","香油","淀粉"],"t":["炒锅","蒸锅"],"v":0,"a":"牛肉500克。 葱10克、姜10克、酱油15克、精盐20克、绍酒15克、八角5克、芝麻油6克、淀粉少许。","p":["将牛肉整块放入冷水内泡透，洗净血水放入沸水锅中焯水，捞出洗净血污，刷净锅，另加清水放入洗净的牛肉、葱段、姜片，置旺火烧沸后撇去浮沫，盖严锅盖，用小火焖煮2一3小时，熟透捞出晾凉。","切去熟牛肉上的脂皮及不整齐的边，顶丝切成长8厘米、宽3厘米、厚0.4厘米的条，净面朝下整齐地码入碗内，加入酱油、精盐、绍酒、葱段、姜片、八角及煮牛肉的原汤，上笼用旺火蒸20分钟取出，去掉八角、葱姜，滗出汤汁，将牛肉扣入平盘内。","将蒸牛肉汤倒入炒锅内，加入酱油烧沸，用湿淀粉勾芡，淋芝麻油，浇在牛肉上即成。"]},{"i":44,"n":"葱爆羊肉丁","r":"鲁菜","o":"鲁菜","f":"羊肉滑嫩，鲜香不膻，汪油包汁，食后回味无穷。","c":"热菜","m":["爆炒"],"g":["羊肉","猪肉","鸡蛋"],"s":["葱","盐","酱油","料酒","味精","淀粉","香油"],"t":["炒锅"],"v":0,"a":"羊肉500克。 鸡蛋1个（重约50克）、大葱：100克。精盐20克、酱油10克、绍酒15克，味精15克、湿淀粉10克、花生油25克、芝麻油15克。","p":["将羊肉批成1.2厘米厚的片，两面交叉打花刀（深度各为肉厚的1／3），切成1工厘米的长条，再切成方丁，放入碗内加精盐、鸡蛋清、湿淀粉搅匀。","将大葱一剖为二，改刀成1.2厘米的段备用，取一空碗放入精盐、酱油、绍酒、味精、湿淀粉搅匀成汁。","炒锅内放入花生油，在旺火上烧至六成热（约150℃）时，放入羊肉丁，用手勺拨散，乙再放入葱段搅散迅速捞出。","锅内留少量油，用旺火烧热后放入羊肉丁、葱段爆炒，接着倒入碗内芡汁翻炒，淋上芝麻油，颠翻几下，速退出锅即成。"]},{"i":45,"n":"炸脂盖","r":"鲁菜","o":"鲁菜","f":"色泽金黄，外酥里嫩。","c":"小吃","m":["炸"],"g":["羊肉","猪肉","鸡蛋"],"s":["酱油","葱","姜","蒜","淀粉","甜面酱","香油"],"t":["炒锅","蒸锅"],"v":0,"a":"羊五花肉500克，鸡蛋一个（重约50克）。 酱油10克、大葱15克、生姜15克、大蒜10克、湿淀粉10克、甜面酱15克、芝麻油15克。","p":["将羊肉洗净放入冷水锅内，煮约5分钟使血水浸出，再捞出晾凉，切成长8厘米、宽2.5厘米、厚0.8厘米的片平放在盘内，加入酱油、葱段、姜片、蒜片入笼蒸熟（约蒸90分钟）取出，滗净汤汁，去掉葱、姜、蒜片。","鸡蛋打入碗内，加入湿淀粉搅匀成糊状待用。","炒锅放入花生油，置中火上烧至八成热（约200℃）时，将肉片逐一滚匀鸡蛋糊放入油内，炸至九成熟时捞出，待油温升至九成热（约225℃）时，再投入肉片炸成金黄色捞出，将炸好的肉片切成斜块，装入盘内即成。","将甜面酱与芝麻油一起拌匀装于味碟内，再将葱段、蒜瓣另盛一小碟，随菜上桌佐食即成。"]},{"i":46,"n":"奶油桂鱼","r":"鲁菜","o":"鲁菜","f":"汤如奶汁，鱼肉似玉，鲜香细嫩，增味提神。","c":"热菜","m":["炸"],"g":["桂鱼","冬笋","香菇","火腿","面粉"],"s":["盐","葱","姜","花椒","高汤","料酒","八角"],"t":["炒锅"],"v":0,"a":"桂鱼l000克。 盐笋尖50克、冬菇65克、火腿100克。干面粉30克、熟猪油250克、葱10克、姜15克、奶汤250克、花椒5克、绍酒20克、八角20克、精盐3克、鸡油10克。","p":["桂鱼刮鳞去鳃，挖去内脏，冲洗干净，鳍尖用刀切掉。","将鱼放入八成开的水锅中稍烫，两面烫匀后，放入凉水中刮净黑皮，冲洗干净，沥于水分。","剁开鱼的下唇骨，把鱼头向左，肚朝外平放在案板上。","在鱼身上划成2厘米宽的坡刀口，翻过来划成象眼块，两面沾上干面粉，炒锅置中火上，加入熟猪油。","烧至六成热（约132℃）时，将鱼下锅炸至六成熟后，放入葱、姜炸至黄色时，加入奶汤、花椒、绍酒、八角、精盐，随后放入炸好的桂鱼，用旺火煮10分钟，至熟时捞出葱姜、花椒、八角不要。","把鱼盛在大盘内，再倒入奶汤，鸡油，搭入冬菇、火腿、笋尖即成。"]},{"i":47,"n":"清炸黄河刀鱼","r":"鲁菜","o":"鲁菜","f":"色泽金黄，外香脆，里鲜嫩，用花椒盐蘸食滋味更好。","c":"热菜","m":["炸"],"g":["刀鱼","面粉"],"s":["料酒","盐","椒盐"],"t":["炒锅"],"v":0,"a":"黄河刀鱼1000克。 精白面粉25克。绍酒20克、精盐5克、花生油200克、花椒盐10克。","p":["将刀鱼从口中取出内脏，去净鳃冲洗干净，加绍酒、精盐腋渍入味，炒锅内放入花生油，用中火烧至六成热（约150℃）时，将刀鱼均匀地沾上一层精白面粉，放入油锅中炸至微黄色捞出，待油温升高至九成热（约220℃）时，投入已炸过的刀鱼炸呈金黄色时捞出装盘，外带花椒盐上桌即成。"]},{"i":48,"n":"雾熘桂鱼","r":"鲁菜","o":"鲁菜","f":"鱼肉鲜嫩，味入其里，咸甜适口，略有辛辣。","c":"热菜","m":["烧扒焖"],"g":["桂鱼","火腿","冬笋","香菇"],"s":["料酒","盐","胡椒","淀粉","酱油","高汤","葱","姜","白糖"],"t":["炒锅","蒸锅"],"v":0,"a":"新鲜桂鱼1000克。 火腿50克、水发玉兰片25克、水发香菇50克。绍酒20克、精盐4克、胡椒粉5克、湿淀粉65克、酱油10克、清汤150克、花生油100克、葱10克、姜10克、白糖20克。","p":["桂鱼刮鳞去内脏洗净，用开水烫后刮净黑皮清洗，一面间隔2厘米打坡刀（不要划断脊骨）成瓦垄块，另一面剖成边长2.5厘米的菱形块。","火腿，玉兰片、香菇切成细丝。","绍酒、精盐、胡椒粉、湿淀粉、酱油、清汤放入汤碗，搅成芡汁。","将桂鱼放入开水中再汆一下，使花块卷起，放入大盘里，用精盐撒在身上腌渍片刻，放笼内以沸水旺火蒸10分钟取出，将鱼放入另一盘中。","炒锅内加入花生油，用中火烧至六成热（约150℃）时，加入葱姜丝，炸出香味后加入白糖、火腿丝、玉兰丝、香菇丝，把碗内芡汁倒入锅烧开后浇在鱼身上即成。"]},{"i":49,"n":"醋椒桂鱼","r":"鲁菜","o":"鲁菜","f":"汤鲜肉嫩，咸香酸辣，清淡开胃。","c":"热菜","m":["炸"],"g":["桂鱼"],"s":["醋","香菜","葱","花椒","胡椒","高汤","料酒","盐","姜"],"t":["炒锅"],"v":0,"a":"桂鱼1000克。 香菜段25克、葱段25克。葱丝10克、花椒5克、白胡椒5克、清汤100克、绍酒20克、精盐4克、醋40克、姜10克、熟猪油100克。","p":["桂鱼刮洗净鳞，挖去鳃，从鳃部取出内脏，冲洗干净，用开水略烫一下，再放入凉水中，刮净黑皮，用刀在鱼的两面每隔2厘米剖斜十字花刀，放入沸水中一末。","炒锅内放入熟猪油、中火烧至五成热（约110℃）时，放入葱段、姜片、花椒、白胡椒，炸出香味后，放入清汤、绍酒、精盐，沸后放入桂鱼，旺火煮15分钟，力口入醋，捞出葱、姜、花椒、胡椒不要。","盛入大汤碗内，撒上香菜段、葱丝、胡椒粉即成。"]},{"i":50,"n":"煎蒸黄鱼","r":"鲁菜","o":"鲁菜","f":"色泽金黄，鲜香味浓，质嫩清爽。","c":"热菜","m":["蒸","煎塌"],"g":["黄鱼","面粉","鸡蛋"],"s":["葱","姜","酱油","醋","高汤","香菜","香油"],"t":["炒锅","蒸锅"],"v":0,"a":"新鲜黄鱼750克。 干面粉25克、鸡蛋液25克。花生油150克、葱丝10克、姜丝15克、酱油10克、清汤200克、醋20克、芝麻油10克、香菜段10克。","p":["将黄鱼刮去鳞，掏去内脏，挖去鳃，两侧间隔剖上宽0.5厘米的斜直刀，然后撒上精盐，绍酒腌渍入味。","鸡蛋磕入碗内，搅匀。","炒锅内加花生油置旺火上，烧热后改小火，将鱼周身沾匀干面粉后再沾匀鸡蛋液，放在热油内煎至两面金黄色，盛入鱼盘，撒上葱丝、姜丝、酱油、清汤，上笼蒸熟取出。","把蒸鱼的原汤倒入锅内，加葱丝、香菜段、酱油、醋烧沸，撇去浮沫，淋上芝麻油，浇在鱼身上即成。"]},{"i":51,"n":"糖醋鱼条","r":"鲁菜","o":"鲁菜","f":"色泽金黄，香味四溢，外酥内嫩，甜醇适口。","c":"热菜","m":["爆炒"],"g":["鱼肉","猪肉","鸡蛋"],"s":["白糖","醋","淀粉","葱","姜","酱油","高汤"],"t":["炒锅"],"v":0,"a":"净鱼肉450克。 鸡蛋黄25克。淀粉30克、花生油200克、葱10克、姜10克、酱油10克、清汤100克、白糖65克、醋40克。","p":["将鱼肉洗净，切成长4厘米、宽厚均匀1厘米的长条。","用鸡蛋黄加淀粉调成蛋黄糊，待用，炒锅内放入花生油，中火烧至八成热（约200℃）时，将鱼条沾匀蛋黄糊入油中炸熟，至呈金黄色捞出，沥油。","炒锅内留少量油，烧热后用葱、姜末煸炒几下，加入酱油、清汤、白糖烧沸，用湿淀粉勾成浓芡，烹入醋，将炸好的鱼条倒入锅内翻匀盛入盘内即成。"]},{"i":52,"n":"馏鱼片","r":"鲁菜","o":"鲁菜","f":"片薄形美，色泽洁白，软鲜爽滑。","c":"热菜","m":["爆炒"],"g":["鱼肉","偏口鱼","冬笋","木耳","鸡蛋"],"s":["料酒","盐","淀粉","葱","蒜","香油"],"t":["炒锅"],"v":0,"a":"偏口鱼450克。 冬笋25克、木耳25克、鸡蛋清25克。绍酒20克、精盐4克、湿淀粉50克。花生油100克、葱10克、蒜5克、芝麻油10克。","p":["将偏口鱼肉洗净，劈成长5厘米、宽3厘米、厚0.2厘米的片放入碗内，加入绍酒、精盐、调匀入味。","再放入鸡蛋清，湿淀粉拌匀。","冬笋切成片，待用。","炒锅内加入花生油，置中火上烧至四成热（约100℃）时，将鱼片逐步下锅滑熟呈白色，捞出沥油。","炒锅内留油，中火烧至六成热（约150℃）加葱、蒜偏炒，放进绍酒一烹，加入清汤、精盐、冬笋片、木耳烧开，撇去浮沫，放入鱼片用小火煨透，用湿淀粉勾成薄芡，淋上芝麻油，装盘即可。"]},{"i":53,"n":"糟炒厚鱼片","r":"鲁菜","o":"鲁菜","f":"鱼片厚匀，肉质鲜嫩，糟香扑鼻。","c":"热菜","m":["爆炒"],"g":["鱼肉","桂鱼","猪肉","豌豆","木耳","冬笋","鸡蛋"],"s":["香糟","淀粉","盐","料酒"],"t":["炒锅"],"v":0,"a":"桂鱼肉750克。 青豆瓣20克、水发木耳20克、净冬笋20克。淀粉30克、鸡蛋清20克、精盐5克、香糟汁250克、绍酒15克、熟猪油50克。","p":["将桂鱼肉洗净，截成4厘米长的段，顺丝用斜刀法劈成2厘米宽、0.4厘米厚的厚鱼片，放在盘中，加湿淀粉、鸡蛋清调匀，再加精盐搅匀。","木耳、冬笋切成片。","青豆瓣放汤中煮熟入味待用。","香糟汁、绍酒、精盐、湿淀粉同放碗内搅匀成汁。","炒锅内放入熟猪油，中火烧至四成热（约88℃）时，用筷子将鱼片逐片下入，漂起后用勺推搅，熟时倒出沥油。","炒锅内留少量油，用中火烧至六成热（约132℃）将兑好的汁倒入锅中，待稠后，把鱼片下入锅内，颠翻几次，出锅装盘，撒上青豆瓣即成。"]},{"i":54,"n":"抓炒鱼仁","r":"鲁菜","o":"鲁菜","f":"鱼仁金黄。入口香脆，具有醇、麻、甜、咸等多种味道。","c":"热菜","m":["爆炒"],"g":["鱼肉","偏口鱼","猪肉","豌豆","鸡蛋"],"s":["盐","料酒","淀粉","醋","酱油","白糖","高汤","葱","姜","花椒","香油"],"t":["炒锅"],"v":0,"a":"偏口鱼肉750克。 熟青豆100克。精盐5克、绍酒15克、鸡蛋黄20克、淀粉30克、酱油10克、醋10克：清汤150克、白糖20克、葱、姜各15克、花椒10吭、芝麻油5克。","p":["将偏口鱼肉洗净，劈成0.8厘米厚的大片，剖上十字花刀，切成长、宽各1.5厘米的鱼仁，用精盐、绍酒腌渍入味。","鸡蛋黄放入碗内，加湿淀粉调成蛋黄糊，放入鱼仁抓匀，备用。","另取一碗，放入酱油、醋、清汤、精盐、白糖、湿淀粉配成芡汁待用。","炒锅内加花生油；用中火烧至六成热（150℃）时，将鱼仁下入油内炸熟，呈金黄色时捞出沥油。","炒锅内留少量油，用旺火烧至七成热（约175℃）时，用葱、姜、蒜片、花椒面爆炒几下，加入绍酒、放入鱼块、青豆及配好的芡汁，迅速翻炒，淋上芝麻油装盘即成。"]},{"i":55,"n":"鱼包三经","r":"鲁菜","o":"鲁菜","f":"色泽金黄，外酥脆，内软嫩，味鲜香适口。","c":"热菜","m":["炸"],"g":["鱼肉","偏口鱼","火腿","香菇","冬笋","鸡肉","猪肉","面粉","鸡蛋"],"s":["盐","料酒","香油"],"t":["炒锅"],"v":0,"a":"偏口鱼750克。 火腿10克、水发冬菇20克、净冬笋20克、熟鸡肉25克。精盐5克、绍酒15克、芝麻油10克、面粉10克、发酵粉5克、花生油250克、鸡蛋黄25克。","p":["将偏口鱼肉洗净，劈成长5厘米、宽3厘米、厚0.3厘米的片，共12片。","每片平铺案板上撒上精盐、绍酒腌渍。","冬菇、冬笋、火腿、熟鸡肉切成长3.5厘米的细丝放入碗内，加精盐、绍酒、芝麻油拌匀成馅料，待用。","鸡蛋打入碗内加面粉、发酵粉、清水，调成鸡蛋糊。","把馅料分别均匀地包在鱼片肉内，卷成12个长3厘米、直径1厘米的鱼卷。","炒锅内加花生油，中火烧至六成热（约150℃）时，将鱼卷沾匀鸡蛋糊，入油炸至熟透成金黄色时捞出，摆在盘中即成。","外带花椒盐碟一并上席。"]},{"i":56,"n":"爆鱼丁","r":"鲁菜","o":"鲁菜","f":"色白滑嫩，柔软鲜爽，汪油包汁。","c":"热菜","m":["爆炒"],"g":["鱼肉","偏口鱼","青蒜","冬笋","鸡蛋"],"s":["葱","料酒","盐","淀粉","香油","高汤"],"t":["炒锅"],"v":0,"a":"偏口鱼750克。 青蒜50克、葱片100克、冬笋50克。绍酒15克、精盐5克、鸡蛋清15克、淀粉50克、花生油150克、芝麻油10克、清汤100克。","p":["偏口鱼肉洗净，切成1厘米见方的丁放入碗内，加进绍酒、精盐、鸡蛋清、湿淀粉抓匀入味。","清汤、精盐、湿淀粉对成芡汁待用。","炒锅内放入花生油，旺火烧至六成热（约150℃），将鱼丁放入油内，迅速用筷子划开，至八成熟时，捞出沥油。","炒锅内留少量油，用中火烧至六成热（约150℃）时，加入葱片、蒜片、冬笋、青蒜略炒，加入鱼丁、绍酒、倒入对好的芡汁。","迅速颠翻，淋上芝麻油，盛入盘内即成。"]},{"i":57,"n":"油爆鱼芹","r":"鲁菜","o":"鲁菜","f":"色泽明亮，鱼鲜味美，汪油包汁","c":"热菜","m":["爆炒"],"g":["鱼肉","猪肉","鸡肉","火腿","香菇","芹菜","鸡蛋"],"s":["盐","料酒","淀粉","高汤","葱","姜","蒜"],"t":["炒锅"],"v":0,"a":"整片鱼肉500克。 肥猪肉膘50克、鸡茸25克、熟火腿末25克、冬菇末25克、芹菜末100克。鸡蛋清25克）精盐5克、绍酒15克、淀粉50克、清汤100克、熟猪油150克、葱15克、姜15克、蒜10克、绍酒20克。","p":["将鱼肉洗净，皮面朝下，在鱼肉上用直刀每隔0.5厘米横竖剖上花纹，切成宽1.5厘米，长3.5厘米的斜刀块待用。","将猪肥肉膘剁成细泥与鸡茸泥同放一碗内，加入鸡蛋清、精盐、绍酒、湿淀粉、火腿末、冬菇末、芹菜末一起搅匀，然后放入鱼块拌匀，成为“鱼芹”。","用清汤、湿淀粉、绍酒、精盐、同放一碗内配成芡汁，待用。","炒锅内加入熟猪油，置中火烧至六成热（约132℃）时，将“鱼芹”逐块下入锅内，炸至淡黄色熟透时捞出，沥干油。","炒锅内留少量油，放进葱、姜、蒜末、待炸出香味时，倒入兑好的汁，将鱼芹推入汁中，颠翻装盘即成。"]},{"i":58,"n":"口蘑扒鱼脯","r":"鲁菜","o":"鲁菜","f":"色泽鲜艳，鲜香滑嫩，汤汁醇厚。","c":"热菜","m":["烧扒焖"],"g":["口蘑","鱼肉","偏口鱼","猪肉","豌豆","火腿","鸡蛋"],"s":["盐","料酒","淀粉","葱","香油","姜","高汤"],"t":["炒锅"],"v":0,"a":"偏口鱼肉750克。 鲜口蘑25克、青豆25克、火腿30克。精盐5克、绍酒15克、鸡蛋清15克、淀粉30克、熟猪油150克、芝麻油5克、清汤250克、葱10克、姜10克。","p":["口鱼肉洗净，剁成细泥，加清汤、精盐、绍酒、鸡蛋清、湿淀粉、熟猪油、芝麻油、搅成鱼料子。","火腿切成薄片，备用。","炒锅内加入熟猪油，小火烧至五成热（约110℃）时，用手勺分数次将鱼料子下油中，制成0.6厘米厚的鱼脯，呈白色至熟时捞出，沥净油。","汤锅内加清汤，旺火烧开，将鱼脯下锅汆透，捞出控净水分。","炒锅内放少量油。","用中火烧至六成热（约132℃）时，用葱姜末煸炒，加绍酒、清汤、精盐、口蘑、青豆、火腿、鱼片，改用小火煨透，去净浮油，用湿淀粉勾芡，淋上芝麻油盛入盘内即成。"]},{"i":59,"n":"番茄松鼠鱼","r":"鲁菜","o":"鲁菜","f":"形象逼真，色泽鲜艳，鲜嫩酥香，酸甜适口。","c":"热菜","m":["爆炒"],"g":["西红柿","鱼肉","黄鱼","洋葱","香菇","冬笋","萝卜","豌豆","面粉","鸡蛋"],"s":["料酒","盐","高汤","白糖","醋","淀粉","香油"],"t":["炒锅"],"v":0,"a":"黄鱼750克。 葱头20克、水发冬菇20克、水发玉兰片20克、胡萝卜15克、熟青豆15克。番茄酱100克、绍酒15克、精汤150克、清盐5克、白糖20克、醋20克、芝麻油2克、淀粉50克、鸡蛋黄15克、精面粉15克。","p":["将黄鱼去鳞、鳃、内脏，用清水洗净。","以胸腹鳍处下刀，将鱼头切下，然后再从下颌处下刀，将鱼头劈半刀，用刀略拍，剔下两面鱼肉，除净胸部细刺，鱼尾相连，在鱼肉面剂上宽麦穗花刀，连同鱼头用绍酒。","精盐腌渍入味。","葱头、冬菇、玉兰片、胡萝卜均切成丁，放入沸水中汆过。","炒锅内放入花生油，用中火烧至七八成热（约175～200℃℃）时，分别将鱼头、鱼肉沾匀精面粉，在鸡蛋黄液中拖过。","做成松鼠形炸至金黄色；捞出装入鱼盘中。","炒锅内留少量油，番茄酱下锅略炒，加葱头丁、冬菇丁、玉兰片丁、胡萝卜丁、青豆略炒，加绍酒、清汤、精盐、白糖、醋烧开，用湿淀粉勾成流芡，加入芝麻油，浇在鱼上即成。"]},{"i":60,"n":"脯酥金鱼","r":"鲁菜","o":"鲁菜","f":"色泽洁白，形状美观，鲜嫩滑口","c":"热菜","m":["炸"],"g":["鱼肉","黄鱼","冬笋","香菇","火腿","豌豆","鸡蛋"],"s":["料酒","盐","高汤"],"t":["炒锅"],"v":0,"a":"黄鱼750克。 冬笋20克、冬菇20克、火腿15克。青豆15克。绍酒15克、精盐5克、鸡蛋清15克、旋粉30克、熟猪油50克、清汤100克、鸡油3克。","p":["将黄鱼去掉鳞、鳃、内脏，冲洗干净，以鳃盖下沿砍下鱼头，将鱼头从下巴劈开，背面相连，从鱼尾脐处将尾剁下，鱼头鱼尾沾匀干淀粉备用。","片下鱼肉，去掉鱼刺骨，将鱼肉劈成长4厘米、宽2厘米、厚0.4厘米的片放入碗内，加绍酒、精盐腌渍入味。","冬笋、冬菇。","火腿均切成小象眼片。","鸡蛋清放汤碗内，用筷子打成蛋泡，加上干淀粉搅匀待用。","炒锅内加熟猪油，用中火烧至四成热（约88℃）时，将鱼片沾匀蛋泡糊，逐片入油内炸熟取出。","鱼头，鱼尾也放油内炸熟取出，分别摆入鱼盘的两端，鱼片放中间呈鱼形。","汤锅内加清汤，放冬笋、冬菇、火腿、青豆绍酒、精盐烧开后用湿淀粉勾芡，淋鸡油浇在鱼身上即成。"]},{"i":61,"n":"绣球全鱼","r":"鲁菜","o":"鲁菜","f":"造型美观，无筋无刺，五彩缤纷，口味鲜美。","c":"热菜","m":["烧扒焖"],"g":["鱼肉","黄鱼","猪肉","香菇","冬笋","火腿","豌豆","鸡蛋"],"s":["盐","白糖","料酒","葱","姜","淀粉","高汤"],"t":["炒锅","蒸锅"],"v":0,"a":"黄鱼750克。 猪肥肉膘100克、水发冬菇20。克、净冬笋20克、火腿15克、青豆15克。精盐5克、白糖20克、绍酒15克、葱末15克、姜末10克、鸡蛋清15克、淀粉50克、清汤150克、鸡油3克。","p":["黄鱼刮去鱼鳞，。","去鳃和内脏冲洗干净，从鱼下嘴巴剁开，用刀背一砸，让鱼头扒下，劈下鱼肉剥去鱼皮待用，将鱼脊骨及鱼头保持原形，放入鱼盘中。","再将鱼肉、冬菇、冬笋、火腿、猪肥肉膘均切成长3.5厘米、宽厚各0.2厘米的丝，放入盛器中，加入精盐、白糖、绍酒、葱末、姜末、鸡蛋清、湿淀粉搅匀成馅，挤成直径2厘米的九子12个放入盘中骨架的两侧，呈整鱼状，上笼旺火蒸熟取出。","将原汤淫入炒锅内，加清汤、绍酒、精盐、青豆烧开，用湿淀粉勾芡，淋上鸡油浇在鱼身上即成。"]},{"i":62,"n":"清蒸加吉鱼","r":"鲁菜","o":"鲁菜","f":"原汁原叶，鲜嫩爽口，久食不腻，吃时外带姜末、醋碟用以蘸食，口味尤佳。","c":"热菜","m":["蒸"],"g":["加吉鱼","猪肉","香菇","火腿","冬笋","白菜"],"s":["料酒","花椒","葱","高汤","姜"],"t":["炒锅","蒸锅"],"v":0,"a":"加吉鱼750克。 猪肥肉膘20克、冬菇20克、火腿15克、冬笋20克、油菜心25克。绍酒15克、花椒10克、清汤150克、葱段25克、姜片10克、鸡油3克。","p":["将加吉鱼刮去鳞，掏净鱼鳃、内脏，洗净。","在鱼身打1.7厘米见方的柳叶花刀，放入开水中一烫即捞出，撒匀精盐，整齐地摆入盘中。","猪肥肉膘打上花刀，切成33厘米长、1厘米宽的条，葱切小段，姜切片。","冬菇、冬笋、火腿、油菜心都切成宽1厘米、长3.3厘米的片。","将鱼放入鱼盘内，加入绍酒，花椒、清汤、再把猪肥肉膘、葱段、姜片、冬菇、火腿均匀地摆在鱼身上，入笼蒸20分钟熟后取出，将汤滗入炒锅内，去掉葱、姜、花椒，将油菜心入锅一烫，整齐地摆在鱼身上。","将炒锅内放汤旺火烧开，打去浮沫，浇在鱼身上，淋上鸡油即可。"]},{"i":63,"n":"糖醋黄河鲤鱼","r":"鲁菜","o":"鲁菜","f":"鱼尾翅起，色如琥珀，外焦里嫩，具有香酥，酸、甜、咸的独特风味。","c":"热菜","m":["炸"],"g":["鲤鱼"],"s":["白糖","醋","姜","葱","蒜","盐","酱油","高汤","淀粉"],"t":["炒锅"],"v":0,"a":"黄河鲤鱼1000克。 姜10克、葱15克、蒜末10克、精盐5克、酱油10克、白糖40克、醋40克、清汤150克、湿淀粉60克、花生油100克。","p":["鳍鱼去鳞，开膛取出内脏，挖去两鳃洗净，每隔25厘米，先直剖（1.5厘米深）再斜剖（2.5厘米深）成刀花。","然后提起鱼尾使刀口张开，将精盐撒入刀口稍腌，再在鱼的周身及刀口处均匀地抹上湿淀粉。","炒锅放花生油。","中火烧至七成热（约175℃）时，手提鱼尾放入锅内，使刀口张开。","用锅铲将鱼托住以免粘锅底，入油炸2分钟，将鱼推锅边，鱼身即成方形，再将鱼背朝下炸2分钟，然后把鱼身放平，用铲将头按入油炸2分钟，待鱼全部炸至呈金黄色时，捞出摆在盘内。","炒锅内留少量油，中火烧至六成热（约150℃）时，放入葱、姜、蒜末、精盐、酱油、加清汤、白糖、旺火烧沸后，放湿淀粉搅匀，烹入醋即成糖醋汁，迅速浇到鱼身上即可。"]},{"i":64,"n":"鸳鸳珍珠汤","r":"鲁菜","o":"鲁菜","f":"汤清色艳，鱼丸白晶，形象生动。","c":"汤羹","m":["烩汆"],"g":["偏口鱼","猪肉","鸡蛋"],"s":["高汤","香菜","盐","料酒","酱油"],"t":["炒锅","蒸锅"],"v":0,"a":"偏口鱼肉500克。 鸡蛋清20克、香菜梗20克。精盐5克、绍酒15克、熟猪油20克、清汤150克。酱油10克。","p":["将偏口鱼肉去皮洗净，在冷水中浸泡10分钟，捞出用刀背砸成细泥放入碗内，加精盐、绍酒、鸡蛋清、熟猪油和水搅匀成鱼料子（以能在水中漂起为宜）。","炒锅内放水烧至五成热时，将鱼料捏成直径1厘米的九子下锅汆熟）捞出放汤碗内。","将蛋清打成蛋泡糊，取羹匙2个，匙底抹少许熟猪油，将蛋泡做成两个鸳鸯形上笼旺火蒸熟取出。","汤锅内加清汤旺火烧沸，加精盐、酱油、撇去浮沫，加香菜梗，淋上芝麻油浇在汤碗内，把“鸳鸯”轻轻推入汤碗内即成。"]},{"i":65,"n":"赛螃蟹","r":"鲁菜","o":"鲁菜","f":"不是螃蟹，性似蟹味，口感软嫩滑爽。","c":"热菜","m":["爆炒"],"g":["螃蟹","黄鱼","猪肉"],"s":["葱","姜","花椒","盐","料酒","高汤","淀粉"],"t":["炒锅","蒸锅"],"v":0,"a":"黄鱼肉450克。 鸭蛋黄100克、葱段15克、姜块15克、花椒15克、精盐5克，绍酒15克、清汤150克、湿淀粉60克、花生油100克。","p":["将黄鱼肉洗净，放入盘内。","葱段、姜块洗净拍松，放鱼盘内，放花椒、绍酒、精盐、上笼用旺火蒸熟，取出晾凉，去掉鱼皮。","取下鱼肉，易.5净骨刺。","将鸭蛋黄磕入碗内调匀，加精盐、绍酒、清汤、湿淀粉、鱼肉搅匀、炒锅内加花生油，中火烧至五成热（约125℃）时，放入葱、姜末、炸出香味时，倒入碗内的鸭蛋黄和鱼肉，改用小火推炒熟，淋上芝麻油，盛入盘内、撒上姜末即成。"]},{"i":66,"n":"熬黄花鱼","r":"鲁菜","o":"鲁菜","f":"鱼肉软绵，烂而不糜，汤汁醇厚。","c":"热菜","m":["炖煨"],"g":["黄鱼","猪肉","青蒜","白菜"],"s":["姜","葱","料酒","醋","酱油","香油","盐"],"t":["炒锅"],"v":0,"a":"黄花鱼1000克。 猪肥瘦肉、青蒜、青菜各100克。鲜姜10克、大葱15克、绍酒20克、醋15克、酱油10克、芝麻油10克、花生油250克、精盐7.5克。","p":["将活黄花鱼刮去鳞，掏净内脏及鳃，洗净。","在鱼身两面剖上斜直刀，用精盐腌渍。","猪肥瘦肉切丝、青菜切段。","炒锅内加花生油、中火烧至六成热（约150℃）、用葱段。","姜片偏炒几下，倒入肉丝偏至断血，放入绍酒、醋，加入酱油、清汤、精盐烧至沸，将鱼入锅内小火熬炖20分钟，撒上青菜、青蒜，淋上芝麻油盛汤盘内即成。"]},{"i":67,"n":"凤尾金鱼","r":"鲁菜","o":"鲁菜","f":"造型新颖，制作精细，口味鲜咸，质地软嫩。","c":"热菜","m":["蒸"],"g":["鱼肉","黄鱼","香菇","冬笋","火腿"],"s":["盐","味精","料酒","葱","花椒","淀粉"],"t":["炒锅","蒸锅"],"v":0,"a":"黄鱼750克、冬菇20克、冬笋20克、火腿15克。 精盐5克、味精4克、绍酒15克、葱15克、花椒10克、湿淀粉50克。","p":["将黄鱼刮去鱼鳞，除去鱼鳃、内脏洗净剁下头尾，批下鱼身的两片片，剥去鱼皮，再劈成24片长5厘米，宽33厘米、厚0.33厘米的鱼片。","平铺在盘内，鱼头剁断下已，从里面砍一刀（不要砍断）用刀拍扁，使之呈跃状，将鱼头、尾分别摆在鱼盘前后两端。","用精盐、味精、绍酒、葱椒水撒在鱼片，鱼头、鱼尾上稍腌。","冬菇丝、冬笋丝、火腿丝掺在一起，加精盐、味精、绍酒拌匀入味，分别卷入鱼片内，三丝要露出1／3作成“凤尾”。","然后把“凤尾”向着鱼尾部整齐地摆在鱼首、尾间，上笼旺火蒸30分钟至熟取出。","炒锅内加清汤，放入精盐、味精、绍酒烧开撇去浮沫，放入湿淀粉勾稀芡浇在盘内的“凤尾金鱼”上，淋上鸡油即成。"]},{"i":68,"n":"白汁酿鱼","r":"鲁菜","o":"鲁菜","f":"造型新颖，鱼肉鲜嫩，馅香味美。","c":"热菜","m":["烧扒焖"],"g":["鱼肉","黄鱼","猪肉","冬笋","火腿","豌豆","鸡蛋"],"s":["姜","盐","香油","料酒","高汤","淀粉"],"t":["炒锅","蒸锅"],"v":0,"a":"黄鱼750克。 猪肥瘦肉30克、净冬笋20克、火腿15克、青豆15克。姜末10克、鸡蛋清25克、精盐5克、芝麻油5克、清汤150克。绍酒15克、湿淀粉60克。","p":["将黄鱼去鳃、内脏，刮去鱼鳞冲洗干净。","在鱼的两面用拔刀法贴着脊骨劈成斜刀片（肉不离骨），每面约劈7片。","将鱼头下颌，胸鳍中间割开（鱼腹不割开），两鳃壳往两边一掰，用刀在鱼头顶上拍一下，使鱼头扒下。","猪肉剁成茸泥放入碗内，加葱末、姜末、鸡蛋清、精盐、芝麻油搅拌成馅）火腿、冬笋均切成长3厘米、厚0.1厘米的象眼片。","将肉馅抹在鱼片上，逐片向劈进方向卷成卷，鱼腹朝下摆入大鱼盘内（两面的鱼卷紧贴在鱼脊骨两旁竖着），每个鱼卷的顶端按一粒青豆，入笼内用旺火约蒸15分钟即熟取出。","将鱼的原汤滗入炒锅内。","加清汤、绍酒、精盐、冬笋、火腿片烧沸，撇去浮沫，用湿淀粉勾芡，淋鸡油浇在鱼上即成。"]},{"i":69,"n":"烤花揽桂鱼","r":"鲁菜","o":"鲁菜","f":"营养丰富，外香里嫩，自中泛红，味道特鲜，佐以姜末、香醋，味道更佳。","c":"热菜","m":["烤"],"g":["桂鱼","鸡肉","猪肉","干贝","海参","冬笋","香菇","火腿"],"s":["料酒","盐","葱","姜","花椒","醋"],"t":["烤箱"],"v":0,"a":"鲜桂鱼750克。 鸡里脊肉25克、猪肥膘肉50克、水发干贝20克、水发海参15克、冬笋15克、冬菇20克、火腿15克、猪五花肉20克、猪网花油20克。绍酒20克、精盐5克、葱段15克，姜片10克、花椒10克、香醋20克。","p":["将桂鱼刮去鳞，剁去脊鳞，划水，从口中取脏，冲洗干净，再用开水中一烫，速放进凉水里，刮去黑皮。","用刀把鱼嘴、下巴划开，两面打坡刀，置于盘中，加绍酒，精盐、葱段、姜片、花椒腋渍约15分钟，入味备用。","将鸡里脊肉剔去筋，然后和猪肥肉膘一起剁成细泥，加鸡蛋清、绍酒、精盐搅成鸡料子备用。","猪五花肉切成0.7厘米见方的丁，放入开水锅中汆熟捞出备用，海参、冬笋、冬菇均切成0.7厘米见方的丁，和干贝一起用毛汤汆过捞出，与肉丁混合加绍酒、精盐、腌渍三分钟，火腿切成6厘米长。","2厘米宽、0.3厘米厚的片。","猪花网油洗净劈去厚筋，面粉和清水调成糊备用。","将腌渍好的桂鱼，去掉葱段、姜片、花椒、将搅拌好的各种丁装入鱼腹，在鱼背的每个坡刀口里嵌上一片火腿，抹上鸡料子，将鱼放在猪花网油上包好）外沾匀面糊，放在铁箅子上。","将铁箅子置于木炭火池慢烤，烤约1小时左右取出揭开皮和猪花肉油，装入鱼盘内即成。"]},{"i":70,"n":"芝麻鱼球","r":"鲁菜","o":"鲁菜","f":"造型美观，鲜香四溢，色泽金","c":"热菜","m":["爆炒"],"g":["芝麻","鱼肉","偏口鱼","猪肉","鸡蛋"],"s":["盐","料酒","香油","淀粉","葱","姜"],"t":["炒锅"],"v":0,"a":"偏口鱼肉450克。 猪肥肉膘50克。精盐3克、绍酒15克、芝麻油10克。湿淀粉50克、葱10克、姜末15克、鸡蛋清15克、芝麻20克、花生油100克，","p":["将偏口鱼肉洗净，与肥肉膘一起剁成细泥，放碗中加精盐、绍酒、芝麻油、湿淀粉、鸡蛋清、葱、姜末、清水搅匀成鱼泥。","芝麻放在锅中偏炒至熟，把鱼泥料挤成直径1.2厘米的丸子，周身上沾芝麻：炒锅内加花生油，中火烧至六成热（约150℃）时，将鱼丸逐个放入油内炸熟，呈金黄色时捞出，摆入盘中即成。"]},{"i":71,"n":"萝卜鱼","r":"鲁菜","o":"鲁菜","f":"色泽金黄，造型逼真，外焦脆里鲜嫩。","c":"热菜","m":["炸"],"g":["萝卜","鱼肉","偏口鱼","猪肉","面粉","鸡蛋"],"s":["盐","胡椒","料酒","葱","姜","香菜"],"t":["炒锅"],"v":0,"a":"比目鱼450克。 猪肥肉膘25克、面包渣30克。精盐3克、胡椒面5克、绍酒15克、葱6克、姜末10克、花生油200克、香菜叶10克、鸡蛋清15克。","p":["将比目鱼肉洗净，劈成长5厘米、厚0.3厘米，一端宽3厘米）一端宽1.5厘米的片，共12片。","平摆在盘内，撒上精盐、胡椒面、绍酒腌渍入味。","再将剩下的鱼肉同猪肥肉膘一起剁成细泥放入碗内，加鸡蛋清、绍酒、葱末、姜末、胡椒面、清水、精盐搅匀成馅，均匀地卷入鱼片内，制成一头粗，一头细如萝卜状的鱼卷，鸡蛋打入碗内搅匀，将鱼卷周身沾匀干面粉，挂匀鸡蛋液，沾匀细包渣，每只鱼卷的粗端插入一根竹签。","炒锅内放花生油用中火烧至七成热（约175℃）时，将鱼卷投入炸至金黄色取出。","抽出竹签，在竹签的小孔内放入一叶消毒过的香菜叶，整齐摆入盘内即成。"]},{"i":72,"n":"锅塌黄鱼","r":"鲁菜","o":"鲁菜","f":"色泽金黄，鲜香味浓，柔和绵软。","c":"热菜","m":["煎塌"],"g":["黄鱼","木耳","火腿","冬笋","白菜"],"s":["盐","料酒","淀粉","葱","姜","蒜","白糖","醋","高汤"],"t":["炒锅"],"v":0,"a":"黄鱼750克。 水发木耳20克、火腿15克、水发玉兰片20克、有菜20克。精盐5克、绍酒15克、花生油200克、淀粉30克、葱10克、姜15克、蒜5克、白糖20克、醋20克、清汤100克。","p":["将黄鱼去净鳞、鳃、内脏用清水洗净，从鱼的下嘴已处将鱼头切下，劈为两块，鱼身从脊背处剔掉大梁骨刺，劈到鱼肚处，尾部相连呈合页形，然后皮面朝下在鱼肉上刻上花刀，连同鱼头撒上精盐。","绍酒、腌渍入味。","鸡蛋打入碗内，搅匀。","木耳、火腿、玉兰片、青菜均切成25厘米长的细丝，炒锅内放花生油，用中火烧至四成热（约100℃）时。","将鱼头、鱼肉沾匀干面粉，在鸡蛋液中拖过，下锅煎至金黄色时。","倒漏勺内控净油。","炒锅内放花生油，用中火烧至六成热（约150℃）时，用葱姜丝、蒜片爆炒一下，放入入木耳丝、火腿丝、玉兰片丝、青菜丝略炒，加入清汤、黄鱼、绍酒、精盐、白糖、醋以旺火烧沸，小火煨透至汤即将干时，将鱼盛于碗内摆成整鱼形，将多汆的汤汁浇在鱼上即可。"]},{"i":73,"n":"荠菜鱼卷","r":"鲁菜","o":"鲁菜","f":"外焦里嫩，鱼肉鲜美，荸荠清香。","c":"热菜","m":["炸"],"g":["荠菜","鱼肉","黄鱼","猪肉","鸡蛋"],"s":["葱","姜","料酒","淀粉","香油","花椒","盐"],"t":["炒锅"],"v":0,"a":"黄鱼750克。 养菜20克、革养25克、猪肥肉丝30克。葱10克、姜15克、鸡蛋清15克、绍酒15克、芝麻油10克、淀粉50克、花生油200克、花椒10克、精盐5克。","p":["黄花鱼肉、猪肥肉膘切成长3.5厘米、宽厚均0.3厘米的丝。","荸荠去皮后切细丝：荠菜洗净，放入开水中一汆，再放入冷水中晾凉后，取出挤干水分切开末。","将以上原料放入盛器中，加入葱末、姜末、鸡蛋清、绍酒、芝麻油、湿淀粉、精盐、用筷子搅成馅。","鸡蛋清加湿淀粉调成蛋清糊待用。","油皮去硬皮成两块，平铺在案板上，放入馅卷成直径1.6厘米的卷，用蛋清粘住油皮卷的边，然后将鱼切成3.3厘米的段。","用面粉、发酵粉和清水调成糊。","炒锅内放入花生油，中火烧至七成热（约175℃），时，将鱼卷蘸匀面糊，逐而投入油内炸至金黄色即成。","外带花椒盐碟上桌。"]},{"i":74,"n":"糖熘鲤鱼","r":"鲁菜·济宁","o":"鲁菜","f":"色泽红亮，外焦酥，里软嫩，咸甜适中，若以著一名的济宁玉堂米醋烹调，则更为鲜香别致。","c":"热菜","m":["烧扒焖"],"g":["鲤鱼"],"s":["白糖","葱","姜","蒜","酱油","淀粉","醋","高汤"],"t":["炒锅"],"v":0,"a":"四鼻孔鲤鱼1000克。 葱15克、姜15克、蒜5克、酱油10克、淀粉50克、醋20克、花生油200克、白糖30克、清汤100克。","p":["将鲤鱼刮净鱼鳞，掏净鱼鳃，内脏冲洗干净，沥净水分，在鱼的两面从鱼头至尾，每隔3厘米用坡刀贴背骨打成花刀，最后在头顶竖砍一刀，放在大盘内，加上酱油、。","湿淀粉沾抹浸养，另用一只空碗放入酱油、醋、湿淀粉、清汤对成汤汁。","炒锅放旺火上，加入花生油。","烧至七成热（约175℃）时，将鱼炸至金黄色时沥油，将鱼推在锅的一边。","炒锅留少量油，先放葱丝、姜丝、蒜片，再放白糖，将碗内汤汁倒入锅、旺火烧开后，将鱼拨入汤汁，两面翻转爆汁后，将锅端离火眼，盛入鱼盘内。","炒锅内汤汁再上火，淋上鸡油，待汁爆出油花，浇遍鱼身即成。"]},{"i":75,"n":"四喜鱼卷","r":"鲁菜","o":"鲁菜","f":"色泽艳丽，肉质细嫩，口味鲜香，造型美观。","c":"热菜","m":["蒸"],"g":["鱼肉","偏口鱼","猪肉","香菇","火腿","白菜"],"s":["盐","料酒","葱","胡椒","淀粉","香油","高汤"],"t":["炒锅","蒸锅"],"v":0,"a":"比目鱼750克。 猪肥瘦肉30克、黄蛋糕末20克、水发冬菇末20克、火腿末15克、青菜末15克。精盐5克、绍酒15克、葱末15克、胡椒面3克、淀粉50克、芝麻油10克、清汤100克、熟鸡油5克。","p":["将比目鱼肉洗净少劈成八条长10厘米、宽2.6厘米、厚0.5厘米的条。","再由两端向里劈至中间（中间连接），撤上精盐、绍酒、肮渍入味。","猪肉剁成细泥，加葱末、胡椒面、精盐、绍酒、鸡蛋、湿淀粉、芝麻油搅匀。","搅好的馅分别卷在鱼肉片内（每条鱼片卷四个卷）。","在四个小鱼卷内分别按上蛋糕末、冬菇末、火腿末、青菜末、然后放蒸笼内蒸熟取出，整齐地摆在盘内。","锅内加清汤、精盐、绍酒、烧沸后撇去浮沫，勾流漓芡浇在鱼卷上，淋上熟鸡油即成。"]},{"i":76,"n":"油焖凤尾鱼","r":"鲁菜","o":"鲁菜","f":"咸甜适口，甘香味醇，鱼骨适酥。","c":"热菜","m":["烧扒焖"],"g":["鱼肉","黄鱼","白菜"],"s":["葱","姜","花椒","八角","桂皮","料酒","酱油","白糖"],"t":["炒锅"],"v":0,"a":"活黄荡苗鱼（又名噘嘴鲢子）1000克。 嫩白菜心100克、大葱50克。鲜姜20克、花椒10克、八角10克、肉桂10克、花生油250克、酱油10克、绍酒15克、白糖20克。","p":["将黄荡苗鱼刮鳞去鳃去内脏，清洗干净。","白菜心切四瓣，葱切成12厘米长的段，姜切片，花椒、八角、肉桂用纱布包好为香料袋备用。","炒锅内加入花生油，中火烧至六成热（约150℃），分别把鱼炸成金黄色，捞出控油。","取炒锅一只刷洗干净，在锅底部放上锅算，上放香料袋，将炸好的鱼头向外。","尾朝里整齐地摆在锅内，将葱放在鱼面上，白菜心放在葱上，摆匀盖严。","清汤、酱油、绍酒、白糖兑成汁，倒入锅内，盖严锅盖，中火烧开后移至小火焖煮，待汤汁耗至约剩2／5时加入芝麻油，改为微火焖煮使汤汁稠浓，耗至1／5时，将锅离火，晾凉后将白菜、葱捡放在一个盘里，将鱼装在大盘中即成。"]},{"i":77,"n":"酱渍鳎目鱼","r":"鲁菜","o":"鲁菜","f":"色泽光亮，酱香浓郁，巴嫩不腻，清鲜味美。","c":"热菜","m":["烧扒焖"],"g":["偏口鱼","猪肉","香菇"],"s":["甜面酱","葱","姜","蒜","醋","高汤","料酒","淀粉","酱油"],"t":["炒锅"],"v":0,"a":"鳎目鱼750克。 肥瘦猪肉各50克、水发冬菇25克。甜面酱150克、葱15克、鲜姜15克、蒜15克、花生油300克、清汤250克、醋20克、绍酒10克、酱油10克、淀粉10克。","p":["将鳎目鱼刮去鳞，洗净背上黑皮，在脊背部位打上斜刀，抹上甜面酱肮渍入味。","冬菇切丝，葱、姜、蒜切成末，待用。","炒锅内加花生油，中火烧至六成热（约150℃），将鱼段放入锅里煎，待两面呈金黄色时取出。","锅内留少量油烧至六成热（约150℃），用葱、姜、蒜一烹，加入肥瘦肉丝偏炒，随即加入清汤、醋、绍酒、酱油、冬菇，再放入鱼段一起烧，待汤汁约剩1／3时，将鱼捞出摆在盘内，随后将锅内原汤用湿淀粉勾芡，加上葱油搅匀，浇在鱼身上即成。"]},{"i":78,"n":"豆豉烧鲫鱼","r":"鲁菜","o":"鲁菜","f":"色泽红润光亮，质地细嫩，酱香浓郁，回香悠长。","c":"热菜","m":["烧扒焖"],"g":["鲫鱼","猪肉"],"s":["葱","姜","蒜","甜面酱","花椒","酱油","八角","白糖","料酒","高汤","淀粉"],"t":["炒锅"],"v":0,"a":"鲫鱼750克。 生猪板油100克、豆鼓150克。葱15克、姜15克、蒜5克、花生油100克、甜面酱100克、酱油10克、花椒10克、八角10克、白糖15克、绍酒20克、清汤250克、淀粉50克、花椒油100克。","p":["鲫鱼去鳞宰杀，掏净鱼鳃、内脏、洗净。","葱切成3厘米长的段，姜、蒜切成片。","炒锅内加花生油，中火烧至六成热（约150℃）时，将鱼下锅，烧至黄色，捞出沥油。","炒锅内留油置旺火上，加甜面酱、豆鼓炸透，再加入酱油、葱、姜、蒜、花椒、八角、白糖、绍酒、清汤、煮沸放入炸好的鱼。","生猪板油划成麦穗花形放锅内，开后移小火上烧之，汤耗一半时，将鱼翻个身，待汤稠浓，将鱼盛出装盘。","炒锅内原汤上火，用淀粉勾芡，见沸后加入绍酒、花椒油，浇在鱼身上即成。"]},{"i":79,"n":"炖加吉鱼","r":"鲁菜","o":"鲁菜","f":"鱼块香嫩，汤汁醇鲜，营养丰富。","c":"热菜","m":["炖煨"],"g":["加吉鱼","猪肉","鹿角菜","冬笋","鸡蛋","面粉"],"s":["香菜","葱","姜","料酒","酱油","醋","盐","高汤","味精","香油"],"t":["炒锅"],"v":0,"a":"鲜加吉鱼800克。 猪肉100克、鹿角菜50克、冬笋75克、鸡蛋100克、香菜段50克、面粉50克。花生油150克、葱15克、姜15克、绍酒25克、酱油10克、清汤250克、食醋20克、精盐5克、味精1克、芝麻油10克。","p":["将加吉鱼去头，取出内脏，刮净鳞，去净鳍、尾，洗净，剁成大骰牌块。","猪肉冬笋切成片。","鹿角菜泡开择净。","鸡蛋打碗内搅匀。","炒锅内加花生油烧至七成热（约175℃）时，将鱼块沾上面粉，裹上鸡蛋液，入油中炸至八成熟捞出。","另起油锅放入猪油烧热，用葱段、姜片煸炒几下，加入肉片、冬笋、鹿角菜煸炒，用绍酒一烹，加入酱油、清汤、食醋、精盐、味精烧开撇去浮沫，将鱼块投入锅内用小火炖约10分钟，淋上芝麻油盛入汤盘中，撒上葱丝香菜段即成。"]},{"i":80,"n":"炆大虾","r":"鲁菜","o":"鲁菜","f":"大虾形体完整，色泽红润光亮，肉质细嫩鲜美。","c":"热菜","m":["炖煨"],"g":["虾"],"s":["葱","姜","高汤","料酒","盐","白糖","香油"],"t":["炒锅"],"v":0,"a":"整尾对虾250克。 葱段25克。花生油100克、姜片10克、清汤100克、绍酒15克、精盐5克、白糖20克、芝麻油10克。","p":["将对虾剪除虾尖、腿，去净沙袋，挑去泥肠，用水洗净。","炒锅加花生油，中火烧至六成热（约150℃），将葱段、姜片下锅炒至焦黄出味，捞出不用，把白糖、清汤、绍酒、精盐下锅烧开，放入对虾并用手勺轻轻将虾脑压挤汤内，用旺火烧开，小火煨炆至熟，待汤汁收浓，淋上芝麻油，装入盘内即成。"]},{"i":81,"n":"百花大虾","r":"鲁菜","o":"鲁菜","f":"造型优雅，味道鲜美，营养丰富。","c":"热菜","m":["蒸"],"g":["虾","鸡肉","猪肉","鸡蛋","火腿","发菜","辣椒"],"s":["香菜","盐","料酒","葱","姜","高汤","淀粉","香油"],"t":["炒锅","蒸锅"],"v":0,"a":"新鲜对虾250克。 鸡脯肉25克、鸡蛋清20克、火腿15克、黄蛋糕15克、发菜15克、红辣椒皮15克、香菜叶15克，精盐5克、绍酒15克、葱15克、姜末10克、清汤100克、芝麻油5克、淀粉50克。","p":["将大虾挑去脊筋泥沙，去掉虾米，剥成虾皮，去腿留尾，用清水洗净，从腹剖，用刀劈成2／3深、使脊背相连。","在肉面剖上十字花刀，用精盐、绍酒腌渍入味。","火腿、黄蛋糕，红辣椒皮均切成小象眼皮。","鸡脯肉去净筋膜，剁成细泥，加入葱、姜末、精盐、绍酒、清汤、芝麻油搅匀成馅，均匀地分抹在虾肉上。","鸡蛋清放入碗内搅打成蛋泡，加入干淀粉调和成蛋泡糊，将蛋泡糊分别抹在大虾肉馅的表面，再用火腿、红辣椒、蛋糕、香菜叶、发菜等点缀成花色图案，装盘内上笼，用火蒸熟取出，滗净水分，摆在盘内。","炒锅内加清汤、精盐、旺火烧沸，撇去浮沫，用湿淀粉勾成流芡，淋芝麻油，浇在虾身上即成。"]},{"i":82,"n":"全虾三做","r":"鲁菜","o":"鲁菜","f":"造型优美，一虾三吃，风味迥异。","c":"热菜","m":["烧扒焖"],"g":["虾","辣椒","香菇","发菜"],"s":["香菜","料酒","盐","味精","葱","香油","姜"],"t":["炒锅","蒸锅"],"v":0,"a":"鲜对虾250克。 红辣椒皮15克、水发冬菇25克、水发发菜50克、香菜叶15克、黄蛋糕50克。绍酒20克、精盐4克、味精0.5克、芝麻油200克、葱15克、姜汁15克。","p":["将对虾去虾尖、腿、泥肠、沙袋、用清水洗净。","从头部第二斑节处斜刀切下，再从尾部第三斑节处切为两段。","将虾腰去皮，用刀从脊背处劈1／3深，放碗内加绍酒、精盐、味精、芝麻油、葱、姜汁略腌。","虾尾去壳留尾，从脊背处劈为合页形，用刀轻拍打上十字花刀。","用绍酒、精盐、味精、葱、姜汁、芝麻油腌渍，炒锅内放花生油，中火烧至四成热（约100℃）时，将虾尾皮面先沾上干淀粉、鸡蛋黄、下锅煎至九成熟，捞出沥油，皮面朝下放入盘内，鸡蛋清打成蛋泡加干面粉搅匀，分别抹在虾内面上，用红辣椒皮，发菜、冬菇、嫩香菜叶，黄蛋糕摆成各色图案，做成芙蓉虾扇。","炒锅放花生油，中火烧至六成热（约150℃）时，加葱段、姜片、花椒爆炒出香味后捞出，将白糖、清汤、绍酒、精盐、味精烧开，放入对虾头部，用小火炆熟，待汤汁收浓后取出。","头向上竖直摆在盘中央。","炒锅内放油。","中火烧至八成热（约200℃）对将虾腰部沾匀金蛋糊，炸熟呈金黄色时捞出，围摆在虾头周围：将芙蓉虾扇上笼旺火蒸熟取出，摆在盘中最外层，锅内加清汤，精盐、味精烧沸，用湿淀粉勾成薄芡，加入熟鸡油浇在虾扇上即成。"]},{"i":83,"n":"落叶琵琶虾","r":"鲁菜","o":"鲁菜","f":"外型美观，鲜香味美。","c":"热菜","m":["烧扒焖"],"g":["虾"],"s":["盐","料酒","葱","姜"],"t":["炒锅"],"v":0,"a":"鲜大河虾250克。 碗豆苗50克、熟猪油100克。精盐3克、绍酒20克、葱姜末15克。","p":["将河虾去壳留尾洗净。","沥干水分，放入碗内，加精盐、。","绍酒腌渍入味：将腌渍好的虾放在于淀粉上，用擀面杖把虾逐个压成形似的琵琶的薄片，放入沸水中汆过，豌豆苗叶洗净用沸水焯过，炒锅内加入熟猪油，中火烧至六成热（约132℃）时，放葱姜末炸出香味，加清汤绍酒、精盐、烧沸，放入虾片。","烧1分钟后将虾片捞出盘内，锅内汤汁用湿淀粉勾芡烧沸放入姜汁、葱油搅匀，迅速倒在放虾片的盘中，再撒上豌豆苗叶即成。"]},{"i":84,"n":"炒凤尾虾排","r":"鲁菜","o":"鲁菜","f":"色彩鲜艳，身黄尾红，外脆内嫩，醇香盈口。","c":"热菜","m":["爆炒"],"g":["虾","面粉"],"s":["香菜","葱","甜面酱","料酒","盐","花椒"],"t":["炒锅"],"v":0,"a":"大青虾250克。 馒头一个、香菜50克、葱白25克、甜酱15克。绍酒20克、精盐3克、葱椒10克。","p":["将大青虾洗净去头壳留尾壳，剔去脊背黑筋，放入盘内，加绍酒。","精盐、葱椒等调拌入味，馒头去皮，切成2毫米见方的小丁，放入盘内，将入味的虾仁用牙签每五只串成一串，共串12串待用，鸡蛋清放入碗内，加湿淀粉搅成糊，提着虾尾将虾串沾匀糊，然后再沾上馒头丁，放入盘内。","将香菜去根择净搌净水分，菜头朝外摆入盘内，炒锅置中火上，加入花生油。","烧至六成热（150℃），将虾排放入锅内炸至杏黄色，捞出沥油，抽掉牙签，将虾排摆在香菜盘内，外带葱酱碟一起上桌。"]},{"i":85,"n":"三彩大虾","r":"鲁菜","o":"鲁菜","f":"色汉鲜艳，外皮酥脆，虾肉鲜嫩。","c":"热菜","m":["炸"],"g":["虾","偏口鱼","猪肉","面粉","火腿","香菇"],"s":["香菜","盐","味精","料酒","葱","姜","淀粉","花椒","辣椒油"],"t":["炒锅"],"v":0,"a":"鲜对虾250克。 比目鱼肉25克、猪肥肉膘20克、咸面包20克、火腿15克、香菜15克、水发冬菇20克。精盐5克、味精1克、绍酒15克、葱10克、姜15克。淀粉50克、花生油100克、花椒3克、辣椒油20克。","p":["将大虾去掉外壳留虾尾，由脊背抽去泥肠，用刀从背部批开，腹部相连，剖上十字花刀，加盐、味精、绍酒腌渍入味。","面包切成上宽5厘米、下宽3.5厘米、长10厘米、厚0.6厘米的片共10片。","比目鱼肉和猪肥肉膘分别剁成细泥、同放碗内加葱、姜末、鸡蛋清、绍酒、精盐、湿淀粉调匀成馅。","冬菇、火腿、香菜梗分别切成末。","在面包片上抹一层蛋黄，虾肉片沾一层薄面粉，再挂上蛋清（虾尾不挂糊）。","虾肉皮朝下贴在面包托上，再将鱼肉馅在虾片上抹平，随后在鱼馅上放一行香菜末，中间放火腿末，第三行放冬菇末，略按一下，即制成“三彩大虾”，炒锅内加花生油，中火烧至六成热（约150℃）。","将制成的“三彩大虾”放入炸至两面呈金黄色时捞出，沥尽油，改切成条状。","原样摆入盘内，食用时外带花椒盐、辣酱油佐食。"]},{"i":86,"n":"荷花金鱼虾","r":"鲁菜","o":"鲁菜","f":"造型生动，色盛形美，口味鲜嫩。","c":"热菜","m":["蒸"],"g":["鱼肉","虾","猪肉","火腿","白菜","豌豆","辣椒","西红柿"],"s":["盐","料酒","葱","姜"],"t":["炒锅","蒸锅"],"v":0,"a":"鲜对虾250克、净鱼肉200克。 猪肥肉100克、火腿50克、黄蛋糕15克、青菜25克、豌豆15克、紫菜25克、红辣椒皮15克、西红柿25克。精盐3克、绍酒30克、葱姜汁15克。","p":["将虾尾剥净壳留尾，去尽泥肠洗净，从脊背处劈成合页形，在肉上剖十字花刀，用绍酒、精盐、腌渍入味，把鱼肉、猪肥肉一起剁成细泥，加精盐、绍酒、葱姜汁、清汤及鸡蛋清搅匀成馅，分别抹在虾肉面上。","火腿、黄蛋糕、青菜、紫菜均切成鱼鳞状，“连同豌豆在虾肉上点缀成金鱼形，西红柿割成荷花瓣形去掉瓤。","将汆下的鱼肉馅堆放在盘中呈小扁圆形，顶部点缀上豌豆。","成为荷花心，将西红柿瓣插在鱼泥上呈荷花状，连同金鱼虾上笼旺火蒸熟，取出滗净汁，金鱼虾整齐地围摆在荷花四周，锅内放入清汤、精盐绍酒、烧沸，撇净浮沫，用湿淀粉勾成溜芡，淋上芝麻油，浇在荷花及金鱼上即成。"]},{"i":87,"n":"整鱼两吃","r":"鲁菜","o":"鲁菜","f":"一菜两色，上鱼两味，咸鲜、酸甜适口，造型美观。","c":"热菜","m":["爆炒"],"g":["鱼肉","虾","萝卜","猪肉","豌豆","面粉","鸡蛋","西红柿"],"s":["香菜","葱","姜","盐","淀粉","香油","白糖","醋","料酒"],"t":["炒锅","蒸锅"],"v":0,"a":"鲜妒子鱼750克。 虾仁25克，胡萝卜15克、香菜15克、猪肥肉50克、青豆10克、精面粉15克。葱10克、姜10克、精盐2克；鸡蛋清25克、芝麻油10克、淀粉30克、花生油250克。红樱桃2个、番茄酱10克、白糖20克、醋20克、绍酒15克。","p":["将妒子鱼去内脏、鳃及鳍，切下鱼头，劈两片。","再剔下两面鱼肉，去净鱼腹部细刺。","取一片鱼肉，皮朝下放案板上，从鱼身前部起，用劈刀法和直刀法将鱼改成松鼠花刀，连同鱼头用葱姜汁精盐腌渍。","另一片鱼肉用斜刀法，以鱼尾劈起至前身部（鱼片厚0.2厘米，依肉皮相联）待用。","虾仁、猪肥肉剁成泥，加清汤、精盐、鸡蛋清、葱姜汁、芝麻油，搅成虾馅，分别抹在批好的鱼片上，卷成直径约1厘米的鱼卷至尾部，即成合页鱼。","然后用鸡蛋清、湿淀粉，调成稀汁，均匀抹在鱼卷和半个鱼头上，加葱段、姜片，上笼蒸7一8分钟，至熟取出，去掉葱姜，放鱼盘一边。","炒锅内放花生油，中火烧至八成热（约200℃）时，将松鼠鱼连同另一半鱼头，先拍上精面粉，挂匀鸡蛋黄，下锅炸成金黄色时捞出沥油，放鱼盘另一边。","两粒红樱桃安放在两个鱼眼上。","炒锅内留少量花生油，置中火上，烧至六成热（约150℃），放入番茄酱、白糖、葱头丁、胡萝卜煸炒，然后加清汤、醋、精盐烧开，用湿淀粉勾成琉璃芡，加入青豆、加进少量热油调匀，浇入松鼠鱼上。","另用炒锅一只加入清汤、精盐、绍酒用旺火烧沸，用湿淀粉勾成芡，加芝麻油、香菜梗浇合页鱼上即成。"]},{"i":88,"n":"清蒸八宝甲鱼","r":"鲁菜","o":"鲁菜","f":"形状完整，八宝配料，色调悦目，汤鲜醇正，味道多变，","c":"热菜","m":["蒸"],"g":["甲鱼","海参","干贝","莲子","糯米","猪肉","冬笋","香菇","鸡肉"],"s":["盐","料酒","姜","高汤","花椒","葱","淀粉"],"t":["炒锅","蒸锅"],"v":0,"a":"甲鱼450克。 水发海参20克、干贝20克、莲子20克。水浸糯米15克、猪肥瘦肉30克、黄蛋糕20克，净冬笋15克、冬菇20克、净鸡肉30克、猪肘肉40克。精盐5克、绍酒15克、清汤150克、姜丝15克、花椒15克、葱段10克、湿淀粉60克。","p":["活甲鱼背部朝下，腹部朝上，待其伸出头，迅速用刀将其头砍下，提起控净血，放入开水锅内稍烫后，捞入冷水中，刮净黑皮，揭盖掏去内脏，剁去尖爪，用清水冲洗干净，放在大锅内。","把海参、猪肉、蛋糕、冬笋、冬菇均切成0.6厘米见方的丁，连同干贝、莲子、糯米分别摆放在甲鱼胸腔内，再浇入用精盐、绍酒。","清汤，甲鱼胆兑好的汁，把姜丝分上、中、下三层摆在八宝馅上，盖上甲鱼盖，对和猪肘肉放在甲鱼上面，姜片和花椒放在一起，连同葱段摆在甲鱼盖上。","再将甲鱼碗入笼以沸水旺火蒸3～4小时取出，拿掉鸡、肘肉、拣去葱段和姜片。","甲鱼的汤汁滗入锅里，旺火烧开，用湿淀粉勾芡浇在甲鱼上即成。"]},{"i":89,"n":"红烧甲鱼","r":"鲁菜","o":"鲁菜","f":"汤鲜味醇，肉细质嫩，营养丰富。","c":"热菜","m":["烧扒焖"],"g":["甲鱼","鸡肉","猪肉"],"s":["黄酱","葱","姜","花椒","八角","酱油","料酒","高汤"],"t":["炒锅","砂锅"],"v":0,"a":"甲鱼750克。 肥嫩鸡腿肉50克、猪腱子肉25克、黄面酱25克。葱15克，姜片10克、花椒5克、八角5克、熟猪油100克、酱油10克。绍酒15克、清汤100克。","p":["活甲鱼宰杀洗净，放在沸水中烫过，刮去黑皮，斩去爪尖，洗净，再放入开水锅内稍煮、能揭开盖时捞出、放在凉水盆中，将盖和裙边一起撕下，去肠留肝和胆，然后将头、脖、四肢拆开、鸡腿肉，猪腥小肉切成2.5厘米见方块，一同放在盆内，葱白切段，姜切片、待用。","炒锅内加入熟猪油，中火烧至五成热（约110℃），下入葱、姜炸至黄色时加入黄面酱炸透，下入花椒、八角、鸡肉和猪肉略炒，放入酱油。","绍酒、清汤，沸后服中火烧10分钟撇去浮沫，倒入砂锅内，然后放入甲鱼及头、脖、四肢摆成整形。","再放上甲鱼肝、胆、盖上砂锅盖，放入小火上烧至酥烂时，剔去葱、姜、花椒、八角即可。"]},{"i":90,"n":"清炖甲鱼","r":"鲁菜","o":"鲁菜","f":"肉滑嫩不腻，汤汁新鲜，香醇，为上乘滋补佳肴。","c":"热菜","m":["炖煨"],"g":["甲鱼","鸡肉","猪肉"],"s":["葱","姜","蒜","高汤","酱油","盐","花椒","料酒"],"t":["炒锅"],"v":0,"a":"活甲鱼750克。 鸡肉50克。葱15克、姜10克、蒜末5克、清汤100克、酱油10克、精盐5克、葱椒10克、绍酒15克。","p":["将活甲鱼去头，宰杀放净血后，放入锅内，加清水烧沸捞出，刮去黑皮，撕下硬盖。","取出内脏（留苦胆），去爪，改剁成之厘米见方的块。","鸡肉也切成2厘米见方的块，放入沸水中一汆。","炒锅内放熟猪油，中火烧至七成热（约154℃），加葱、姜、蒜末，炸出香味，放入甲鱼、鸡肉、酱油，煸炒2分钟，随即加入清汤，用小火炖至酥烂，然后用小火烧沸打去浮沫，放上精盐、葱椒、绍酒即成。"]},{"i":91,"n":"德州扒鸡","r":"鲁菜·德州","o":"鲁菜","f":"鸡身颜色金黄透红、光亮，肉质淡白肥嫩，香味入骨，五味俱全，鸡肉柔而不韧，食之肉骨分离。","c":"热菜","m":["烧扒焖"],"g":["鸡肉"],"s":["姜","盐","酱油"],"t":["炒锅"],"v":0,"a":"当年雏鸡100克。 五香药料20克、姜10克、精盐5克、酱油10克。","p":["将宰杀洗净的鸡两腿向后交叉盘入肛门刀口处，双翅由颈部刀口处伸进，在嘴内交叉盘出，口衔双翅，体呈卧姿，晾干。","饴糖加清水解匀，均匀地抹在鸡身上。","炒锅烧热加油至八成热（约200℃），将鸡入油炸至金黄色捞出沥油。","将炸好的鸡放入锅中，放入老汤、清水（以淹没鸡为度），加五香药料、姜、精盐、酱油、旺火烧沸后撇去浮沫，移微火上焖煮至鸡酥烂时即可。","捞鸡时注意保持鸡皮不破，整鸡不碎。"]},{"i":92,"n":"炸蚕蛹鸡","r":"鲁菜","o":"鲁菜","f":"鲜嫩香郁，松软可口。","c":"热菜","m":["炸"],"g":["鸡肉","鸡蛋","菠菜"],"s":["料酒","盐","葱","花椒","淀粉"],"t":["炒锅"],"v":0,"a":"鸡1000克。 鸡蛋清25克、菠菜25克。绍酒30克、精盐3克、葱椒10克、淀粉25克、花生油1500克。","p":["鸡里脊肉去筋膜，砸碎后剁成细茸，加绍酒、精盐、葱椒泥，淀粉调匀，再磕入鸡蛋清，搅匀为鸡料子。","菠菜洗后洗净，顺丝切5厘米长的细丝。","猪网油截成6厘米长、2厘米宽的片，放上鸡料子卷成直径0.5厘米的卷，用竹签从一头插进3厘米左右，外留1.5厘米的把，放入蛋泡糊内粘满，再投入三成热（约75℃）的油锅中，用筷拨动，挺身后捞起，抽出竹签成“蚕蛹鸡”，菠菜稍炸，捞起铺在平盘里。","再将蚕蛹鸡投入七成热（约175℃）油锅中炸至杏黄色捞出，放在菠菜丝上即成。"]},{"i":93,"n":"纸包鸡","r":"鲁菜","o":"鲁菜","f":"鸡肉脆嫩爽口，鲜香味浓。","c":"热菜","m":["炸"],"g":["鸡肉"],"s":["葱","姜","味精","盐","料酒","香油"],"t":["炒锅"],"v":0,"a":"鸡1000克。 玻璃纸。葱10克、姜10克、味精1克、精盐4克、绍酒20克、芝麻油100克、花生油1000","p":["将鸡脯肉去筋膜洗净，片成长4厘米、宽0.5厘米、厚0.1厘米的片。","加入葱末、姜末、味精、精盐、绍酒、芝麻油腌渍入味，分别用玻璃纸包成长5厘米、宽3厘米的长方形，每一块露一点纸角。","用香菜梗把口扎紧。","炒锅放花生油烧至四成热（约100℃）时，将纸包鸡逐个放入炸至杏黄色熟透时。","捞出沥油，整齐地摆入盘中，食时提纸包的露角，将玻璃纸去掉即可食用。"]},{"i":94,"n":"龙凤双腿","r":"鲁菜","o":"鲁菜","f":"色泽金黄，外焦里嫩，口味鲜美，状如鸡腿，系高档宴会中的一款名菜。","c":"热菜","m":["炸"],"g":["鸡肉","猪肉","虾","鸡蛋"],"s":["淀粉","辣椒油"],"t":["炒锅","蒸锅"],"v":0,"a":"鸡脯肉300克、净大虾肉300克。 鸡蛋一个（约50克）。湿淀粉15克、猪网油25克、辣椒油100克，花生油1500克（实耗油100克）。","p":["鸡脯肉去筋膜，洗净，片成薄片成长2厘米、宽1厘米、厚0.1厘米，净大虾肉顶刀片成厚0.3厘米的片，放碗内磕入鸡蛋、湿淀粉搅匀成馅。","再取一空碗，磕入鸡蛋，加剩汆湿淀粉调成蛋糊。","猪网油洗净，切成长14厘米、宽10厘米的长方形片10张。","取一张铺平，取1／10馅放在油片角上，将网油片四周抹上蛋糊，取熟鸡腿骨一根，放在网油片的一边，使馅包住鸡腿骨，然后用网油把馅和鸡腿骨包好（鸡腿骨露出1／2），像鸡腿形状，摆在盘子里，入笼旺火蒸透取出，稍晾，沾匀鸡蛋糊，逐个放入六成热（约150℃）油锅内（手提鸡腿骨），炸至金黄色捞出沥油，整齐地摆入盘内，带辣酱油佐食。"]},{"i":95,"n":"炒鸡丝蜇头","r":"鲁菜","o":"鲁菜","f":"色白如雪。蜇头清脆，鸡丝滑嫩，酸、辣、咸鲜俱备，佐酒、下饭皆宜。","c":"热菜","m":["爆炒"],"g":["鸡肉","海蜇","猪肉","鸡蛋"],"s":["盐","味精","料酒","醋","胡椒","淀粉","葱","姜","香菜"],"t":["炒锅"],"v":0,"a":"净鸡脯肉350克、海蜇头150克。 鸡蛋一个（重约50克），精盐4克、味精1克，绍酒25克）醋3克、胡椒粉3克、湿淀粉15克、花生油100克、葱10克、姜丝10克、香菜5克、鸡油100克。","p":["净鸡脯肉去净筋膜，片成0.2厘米厚的片，再切成0.15厘米宽的丝放碗中）加鸡蛋清、精盐、湿淀粉拌匀上浆，海蜇头片成厚0.3厘米的片，再切成丝，用清水反复调洗后，入80℃的热水中一汆捞出。","碗内放鸡汤、精盐、味精、绍酒、醋。","胡椒面、湿淀粉对成汁。","炒锅放花生油，烧至四成分（约100℃），放鸡油划油，捞出。","锅内留少许油烧至五成热（约125℃）。","放葱丝、姜丝炸出香味，立即放入鸡丝、蜇头丝、香菜段及碗内芡汁。","急速颠翻，淋鸡油即成。"]},{"i":96,"n":"炸鸡椒","r":"鲁菜","o":"鲁菜","f":"色泽金黄，外酥脆，里鲜嫩。","c":"热菜","m":["炸"],"g":["鸡肉","猪肉","鸡蛋","面粉"],"s":["葱","姜","盐","香油","料酒"],"t":["炒锅"],"v":0,"a":"鸡脯肉750克。 鸡蛋清25克、面粉50克、猪肉50克。葱10克、姜10克、精盐4克、芝麻油100克。绍酒30克、花生油1500克、实耗100克）。","p":["取带翅骨雏鸡脯肉8片。","剔去鸡翅骨节上的肉，从鸡翅大转弯处剁去骨节，切去根骨环（但鸡脯肉与翅骨仍连接），鸡脯肉剔净脂皮和白筋，用刀尖戳些小眼，再用刀背砸松成薄片状，放绍酒、精盐略腌。","猪肥瘦肉剁成泥放碗内，加鸡蛋清、清水搅匀，加入葱、姜末、精盐、剁碎海米、芝麻油搅匀成馅，将砸松的鸡脯肉平铺石砧板上，顺长切两半（骨与肉相连），抹上肉馅于鸡肉上，卷成辣椒形的卷，先沾一层面粉，后拖一层鸡蛋液，四周沾匀面包屑，做成鸡椒坯，放入三成热（约75℃）的油锅，炸成翅骨与鸡肉卷成直角形，并角形呈金黄色熟透时捞出。","每一翅骨连一对“鸡椒”。","改刀后按原形摆入盘中即成。"]},{"i":97,"n":"烧鸡酥","r":"鲁菜","o":"鲁菜","f":"色呈酱红，鲜咸香醇，疏松软嫩。","c":"热菜","m":["烧扒焖"],"g":["鸡肉","猪肉","海参","冬笋","白菜","蒲菜","鸡蛋"],"s":["葱","姜","盐","酱油","甜面酱","料酒","味精"],"t":["蒸锅"],"v":0,"a":"脯肉750克。 海参25克、冬笋15克、熟黄秧菜心10克、蒲菜头10克、鸡蛋一个（重约50克）。花生油100克、葱10克、姜10克、酱油10克，精盐4克、甜面酱15克、绍酒10克、味精1克、花椒油25克，熟鸡油100克、花生油1000克。","p":["将雏鸡脯肉切成2毫米见方的丁放入碗内。","加葱末、姜末、酱油、甜面酱、绍酒、味精、精盐，调拌浸养。","海参、冬笋切成2毫米见方的丁。","熟黄秧菜心。","蒲菜头挤去水分切成丁，一起放入鸡肉碗内，加红色硬蛋糊，搅匀做成纺锤形丸子，放入盘内，逐个沾匀蛋黄糊下三成热（约75℃）油锅，用小铲操动，呈枣瓤色时捞出沥油，即成鸡酥。","锅上中火，放花生油、葱末、姜末爆锅，放酱油、鸡汤、精盐。","开后下入鸡酥，再开时，移微火加盖煨烧，至汤剩1／2时离火，捞出鸡酥放在碗内，入笼蒸15分钟取出，扣在大汤盘内，滗出汤用湿淀粉勾薄芡，加入绍酒、味精、酱油、花椒油，淋上熟鸡油，浇在鸡酥上即成。"]},{"i":98,"n":"锅塌鸡签","r":"鲁菜","o":"鲁菜","f":"黄绿相映，色泽鲜艳，造型雅洁，酥嫩咸香，四季皆宜。","c":"热菜","m":["煎塌"],"g":["鸡肉","猪肉","鸡蛋","菠菜","面粉"],"s":["盐","葱","姜","淀粉"],"t":["炒锅"],"v":0,"a":"鸡脯肉750克。 鸡蛋一个、肥猪肉膘50克、菠菜叶25克。精盐5克、葱10克、姜10克、小茴香5克、湿淀粉15克、面粉10克、猪油100克。","p":["鸡脯肉去脂皮、白筋洗净，片出3.5厘米见方、0.2厘米厚的片12片，汆下鸡肉剁成茸泥，放碗内，加鸡蛋清、湿淀粉、精盐、葱丝、姜丝、小茴香粉面拌匀。","肥猪肉膘片与鸡肉同样大的12片，用刀尖戳上小孔，以防卷炸时翻卷。","菠菜叶也切成与鸡肉同样大的12片。","将肥肉膘片平铺案板上，抹上0.4厘米厚的鸡肉泥，盖上1片鸡肉片，再抹一层鸡肉泥，最后盖上1片菠菜叶，制成“鸡签”，依次做成12块，在肥肉膘面蘸上一层薄面粉，再在四周蘸一层鸡蛋黄、湿淀粉、面粉、清水搅匀在浓蛋黄糊，放入五成热（约110℃）的猪油锅中塌煎，待油温升至七成热（约154℃）底煎至发硬时，再逐块翻过蹋至呈淡黄色，滗出锅内汆油，随即放入清汤、精盐、葱椒泥移至微火上煸煎至汤汁将尽，翻锅扣在盘内（有菠菜叶的面朝上）即成。"]},{"i":99,"n":"鸡里爆","r":"鲁菜","o":"鲁菜","f":"色泽洁白，肚头脆嫩，鸡肉鲜香；风味另帜。","c":"热菜","m":["爆炒"],"g":["鸡肉","猪肉","猪肚","鸡蛋"],"s":["盐","料酒","味精","淀粉","蒜"],"t":["炒锅"],"v":0,"a":"鸡脯肉750克。 猪肚30克、鸡蛋一个（重约50克）。精盐4克、碱粉3克、绍酒20克、味精1克、湿淀粉25克、熟猪油100克、蒜3克。","p":["鸡脯肉剔去筋膜，片成长3.3厘米的片，加蛋清、精盐、湿淀粉上浆拌匀，猪肚头去脂皮，片成0.7厘米厚的片，在片开上面剖0.3厘米宽的斜十字花纹，然后在后面每隔0.3厘米打上直刀约1／2厚，再切成1.3厘米见方的块，用碱粉、温水泡5分钟，洗净碱味。","碗内加入清汤、绍酒、味精、湿淀粉、精盐对汁待用。","炒锅上火，放入熟猪油烧至五成热（约110℃），将鸡肉片放入拨散。","划透捞出。","将肚头放入沸水中一汆捞出，随即将肚头放入九成热（约198℃）的油内一触（约3秒钟），倒入漏勺内；炒锅内留油，烹入蒜末；将鸡肉片、肚头放入锅内，迅速倒入芡汁，颠翻沾匀使之包住主料，盛入盘内即可。"]},{"i":100,"n":"炒鸡丝","r":"鲁菜","o":"鲁菜","f":"颜色洁白，质地细软滑爽，口味清淡鲜嫩。","c":"热菜","m":["爆炒"],"g":["鸡肉","鸡蛋","冬笋","青蒜"],"s":["盐","料酒","味精","淀粉"],"t":["炒锅"],"v":0,"a":"鸡750克。 鸡蛋一个、水发玉兰片25克。精盐3克、绍酒20克、味精1克；青蒜5克、湿淀粉25克、猪油100克。","p":["鸡脯肉剔去筋膜，片成厚0.2厘米的片，再切成长5厘米的丝。","加蛋清、。","精盐、湿淀粉拌匀入味，水发玉兰片切成3.5厘米长的丝，甩开水焯过。","青蒜切成3.5厘米长的段。","炒锅放猪油，烧至五成热（约110℃），下入鸡丝划开，至八成熟、（约176℃）对捞出，锅内留油，放玉兰片丝、青蒜段稍微一煸，倒进鸡丝，再放清汤、精盐、绍酒。","味精，颠翻出锅即成。"]},{"i":101,"n":"浮油鸡片","r":"鲁菜","o":"鲁菜","f":"色泽洁白如雪，质地级软鲜嫩，汤汁透明，清香利口，鲜咸味美，老幼咸宜。","c":"热菜","m":["爆炒"],"g":["鸡肉","猪肉","鸡蛋","冬笋","豌豆"],"s":["盐","料酒","淀粉"],"t":["炒锅"],"v":0,"a":"鸡里脊肉750克。 鸡蛋一个、冬笋25克、青豆15克。精盐3克、绍酒25克、湿淀粉25克、猪油500克（实耗油75克）。","p":["鸡里脊肉剔净脂皮、白筋，用刀背砸成细泥，加鸡蛋清、湿淀粉、精盐、清汤拌匀。","冬笋切成小象眼片。","炒锅放入熟猪油微火烧至四成热（约88℃），用羹匙将鸡糊逐勺妥入油内（不要沾在一起），待鸡茸浮油面成薄片状捞出，锅内留油，烧至六成热约（13℃），放葱末、姜末爆锅，再放精盐、绍酒、笋片、青豆、清汤、鸡片颠炒，加进味精装盘即成。"]},{"i":102,"n":"荷叶米粉鸡","r":"鲁菜","o":"鲁菜","f":"色泽红润，酥烂不腻，有新鲜荷叶之清香，惹入醒胃，增入食欲。","c":"热菜","m":["蒸"],"g":["米粉","鸡肉"],"s":["葱","姜","酱油","甜面酱","料酒","盐","香油"],"t":["蒸锅"],"v":0,"a":"鲜嫩雏鸡1000克。 荷叶50克、米粉100克。葱10克、姜10克、酱油10克、甜面酱20克、绍酒30克、精盐5克、芝麻油100克。","p":["将荷叶洗净泡透，每张剪成3片20厘米见方的叶片备用。","将雏鸡剔骨后洗净，切成大小均匀的12块，加入葱丝、姜丝、酱油、甜面酱、绍酒、白糖、精盐拌匀腌渍10分钟，然后放入米粉、清汤、芝麻油搅匀。","将荷叶铺在案板上，每张放一块鸡肉和米粉（约8.5克）包好。","包制时先放一个角叠进去，再连荷叶带肉一起卷，卷到最后，将两边的角叠进去，再把留下的一角叠起来夹在中间，头露在外面。","将逐个包好的米粉鸡块，入笼置旺火上蒸1.5小时至熟烂，取出装盘即成。"]},{"i":103,"n":"捶烩鸡片","r":"鲁菜","o":"鲁菜","f":"菜肴洁白光亮，软嫩滑爽、色泽如谐。鸡片捶之入味，鲜香可口。","c":"汤羹","m":["烩汆"],"g":["鸡肉","猪肉","冬笋","香菇","火腿"],"s":["盐","料酒","味精","淀粉","香油"],"t":["炒锅"],"v":0,"a":"鸡脯肉750克。 玉兰片20克、冬菇20克、火腿20克。花生油200克、葱油100克、精盐4克、绍酒20克、味精1克，湿淀粉15鬼、芝麻油100克。","p":["鸡脯肉剔去脂皮。","白筋，片成0.4厘米厚的大片，然后改成2厘米见方的方片，将绿豆干淀粉撒在鸡片上，用木褪将鸡片逐片捶至0.15厘米的薄片。","玉兰片、冬菇、火腿均切成薄片。","锅内放花生油烧至五成热（约125℃），放入捶过的鸡片滑透，捞出沥油。","锅内加花生油，烧至七成热（约175℃），将玉兰片、冬菇煸炒，加清汤、精盐、绍酒、味精、火腿片烧开、去浮沫，放入鸡片，见开后用湿淀粉勾成流汁芡，淋上芝麻油，盛汤盘中即成。"]},{"i":104,"n":"锅塌鸡片","r":"鲁菜","o":"鲁菜","f":"成菜色泽金黄光亮，味道鲜美，肉质嫩滑，味浓多汁。","c":"热菜","m":["煎塌"],"g":["鸡肉","猪肉","鸡蛋"],"s":["葱","姜","盐","味精","酱油","料酒"],"t":["炒锅"],"v":0,"a":"鸡脯肉750克。 鸡蛋一个（鸡蛋清）。葱10克、姜10克、精盐5克、花生油100克、酱油10克、味精1克、绍酒20克。","p":["生鸡脯肉剔去筋膜，洗净，片0.2厘米厚的大片，用刀将一面划过。","将鸡脯肉片划面朝上摆在大盘内，均匀地撒上葱、姜末和酱油、精盐腌渍入味，然后逐片两面沾匀面粉。","鸡蛋与湿淀粉调匀成鸡蛋糊放碗内。","将绍酒，味精、酱油、精盐、清汤放入另一碗内，调成汤汁。","锅内放花生油，烧至八成热，将鸡片粘匀鸡蛋糊，放入油内煎至两面呈金黄色时，滗出锅内汤汁，用微火蹋煎至汤汁将尽时，即可出锅，翻扣在盘内即成。"]},{"i":105,"n":"炒鸡米","r":"鲁菜","o":"鲁菜","f":"此菜白、黄、绿各色相间，谐调悦目,鲜咸滑嫩，软烂适口，最宜于老入儿童食用。","c":"热菜","m":["爆炒"],"g":["鸡肉","猪肉","鸡蛋","冬笋","荸荠","菠菜"],"s":["料酒","盐","味精","淀粉","葱","姜"],"t":["炒锅"],"v":0,"a":"鸡脯肉750克、蛋清25克、冬笋20克、荸荠20克、菠菜梗20克。 绍酒20克、精盐4克、味精1克、湿淀粉15克、葱10克、姜10克、猪油150克。","p":["鸡脯肉剔去筋膜，切成0.4厘米见方的肉米，加蛋清、绍酒、精盐、味精、湿淀粉拌匀入味。","冬笋、荸荠、菠菜梗切成0.4厘米见方的丁，放开水焯过，捞出。","将绍酒、精盐、味精、湿淀粉放入碗内，勾成芡汁。","炒锅内放入油中滑出备用。","锅内留少许油，烧热后放入葱、姜末、烹出香味，迅速放入鸡肉末及配料，倒入芡汁颠翻，淋鸡油出锅即成。"]},{"i":106,"n":"清汤鸡蒙冬菇","r":"鲁菜","o":"鲁菜","f":"成菜鲜嫩滑润，汤味醇正，红、绿、黑、黄众色相映。","c":"汤羹","m":["烩汆"],"g":["鸡肉","香菇","猪肉","鸡蛋","冬笋","火腿"],"s":["高汤","淀粉","姜","味精","盐","料酒"],"t":["炒锅"],"v":0,"a":"鸡脯肉300克。 鸡蛋清、冬笋30克、火腿20克、冬菇30克。湿淀粉15克、姜10克、味精1克、精盐4克、绍酒20克。","p":["将鸡脯肉剔净筋膜，剁成细茸，放在碗内，加湿淀粉、姜汁、味精、鸡蛋清、精盐、清汤、搅匀成鸡料。","冬笋、火腿、蛋糕切成细末，混放在一起，做成色料备用。","水发冬菇去蒂，开水冲洗，搌净水分，与鸡料一起放碗内，搅匀后拨入色料盘内，沾满色料，汤锅放清水，烧至八成热，将冬菇逐个下入锅内，料熟捞出沥水，放入大汤碗内。","炒锅放火上。","加清汤，煮后离火，去浮沫，加入口蘑汤、绍酒、精盐，烧开后倒在冬菇碗内即成。"]},{"i":107,"n":"福山烧小鸡","r":"鲁菜·胶东","o":"鲁菜","f":"红润光亮，形态美观，小鸡肉嫩味香，浓郁醇厚，软绵适口。","c":"热菜","m":["烧扒焖"],"g":["鸡肉"],"s":["姜","葱","八角","盐","白糖"],"t":["炒锅","蒸锅"],"v":0,"a":"鸡750克。 花生油300克、姜10克、葱10克、八角5克、精盐4克、糖30克、五香粉5克。","p":["将鸡洗净，剁去小腿，把姜片、葱段、八角、精盐均匀在撒在鸡身上腌3小时，再把鸡的大腿骨砸断，在鸡肚下割5厘米长的小口，把鸡的两条大腿叉起来插入腹内，然后在鸡身上均匀地抹上一层薄薄的饴糖，炒锅内倒入花生油，旺火烧至八成热（约200℃）时，将鸡放入，炸至呈紫红色捞出。","另取葱，姜切成细末，与五香粉拌匀填入鸡腹，放入盘里，浇上酱油、撒上精盐，上笼旺火蒸15分钟取出即成。"]},{"i":108,"n":"奶汤八宝布袋鸡","r":"鲁菜","o":"鲁菜","f":"鸡形完整，鸡肉软嫩，汤鲜味美","c":"汤羹","m":["烩汆"],"g":["鸡肉","海参","干贝","猪肉","火腿","鱼肚","莲子","口蘑","冬笋","香菇","白菜"],"s":["高汤","料酒","盐","葱","姜"],"t":["炒锅","蒸锅"],"v":0,"a":"鸡1000克。 海参10克、干贝10克、猪瘦肉10克、火腿10克、鱼肚10克、莲子5克、口蘑5克、玉兰片10克。绍酒20克、精盐5克、葱10克、姜10克、香菇5克、菜心5克、奶汤100克。","p":["将整鸡冲洗净，从鸡嗉处入口，将鸡骨完整地剔出。","将海参、干贝、猪瘦肉、火腿、鱼肚，莲子、口蘑、玉兰片、均切成1厘米见方的丁，用开水焯一下，放入葱姜、酒等调料调拌成“八宝馅”，装入鸡腹内，将鸡头从脖子处剔过，把刀口别住，放入沸水内稍烫，放进汤盛内，加入清汤、葱段、姜片、绍酒、精盐，入笼蒸熟取出，滗出汤汁，去葱姜，再将火腿、香菇、菜心、玉兰片切成片，烫后整齐摆在鸡身上。","锅内放猪油，烧至六成热，放葱段、姜片稍炸后，加入奶汤、绍酒、姜汁、精盐，烧沸后捞出葱、姜，将汤倒入汤盛内，麻鸡油即成。"]},{"i":109,"n":"烤小鸡","r":"鲁菜","o":"鲁菜","f":"颜色金黄，肉嫩淡香，用生菜佐食风味更佳。","c":"热菜","m":["烤"],"g":["鸡肉","生菜"],"s":["盐","酱油","姜"],"t":["烤箱"],"v":0,"a":"鸡1000克。 生菜30克。精盐5克、酱油10克、葱油10克、姜10克、菜子油1500克（实耗油100克）。","p":["将雏鸡从脊背中间劈开（腹部相连），再将鸡的大腿处割开一刀，翅膀用刀背拍断，去掉爪尖洗净。","然后将鸡身沾匀酱油。","入九成热（225℃）的油锅中一触即出，放入烤盘内，加葱段、姜片，再倒入清汤、酱油、葱油等，入烤炉内烤10分钟左右至熟，呈金黄色时取出，剁成条状，按原鸡形状摆入盘内，浇入原汤。","生菜洗净切段，放在鸡的两边佐食即成。"]},{"i":110,"n":"锅烧鸡","r":"鲁菜","o":"鲁菜","f":"软香鲜嫩，色味俱佳，如以葱丝、萝卜条、甜面，酱佐食，风味尤佳。","c":"热菜","m":["烧扒焖"],"g":["鸡肉","面粉","鸡蛋"],"s":["淀粉","料酒","盐","葱","酱油","姜","八角","桂皮","花椒"],"t":["炒锅","蒸锅"],"v":0,"a":"鸡1000克。 淀粉25克、面粉25克、鸡蛋25克、绍酒20克、精盐4克、酱油10克、葱10克、姜片10克、桂皮5克、八角5克，花椒5克、花生油1000克（实耗油100克）。","p":["将净雏鸡放入汤锅内，煮至九成熟，剔净鸡骨，装入大汤盘内，保持鸡身原形。","加绍酒、精盐、酱油，葱段、姜片、桂皮、八角、花椒、清汤，上笼旺火蒸20分钟取出，去葱姜和香料，滗去汤汁。","鸡蛋加入淀粉、面粉和水搅拌成鸡蛋糊。","取盘一只，将1／3的鸡蛋糊倒在盘内抹平，把鸡身放上，倒上其汆蛋糊挂满鸡身。","锅上火放花生油，烧至六成热（终150℃）时，将鸡原样推入锅内，炸至金黄色时捞出沥油，改切成长条，装入盘内呈马鞍形，是撒上花椒面即成。"]},{"i":111,"n":"黄焖全鸡","r":"鲁菜","o":"鲁菜","f":"色呈枣红，味浓醇香，鸡肉软烂，原汁原味，鲜咸适口。","c":"热菜","m":["烧扒焖"],"g":["鸡肉"],"s":["葱","姜","八角","黄酱","酱油","盐","淀粉","料酒"],"t":["炒锅","蒸锅"],"v":0,"a":"鸡1000克。 葱10克、姜10克。八角5克、黄酱10克、酱油10克、精盐10克、湿淀粉25克。绍酒20克、花椒油200克、花生油1500克（实耗油150克）。","p":["鸡宰杀好后，剁掉嘴尖、爪尖，再整鸡脱骨、洗净，酱油、黄酱调匀抹在鸡身上，放入七成热（约175℃）的油锅中，皮朝下炸至金黄色捞出沥油。","炒锅上火放少许油，加葱段、姜片、八角，加入黄酱、酱油、清汤、精盐，放入鸡浇开，移至小火煨炖10分钟将鸡翻身，至炖熟时出锅沥去汤。","将鸡皮朝下放入大碗内，倒入炖鸡的原汤，入笼旺火蒸20分钟，熟透出笼滗出原汤。","再把鸡扣入大碗内，将原汤上火用湿淀粉勾薄芡，加绍酒、花椒油、浇在鸡上即成。"]},{"i":112,"n":"油泼鸡","r":"鲁菜","o":"鲁菜","f":"色泽金黄，皮酥肉嫩，鲜香适口。","c":"热菜","m":["炸"],"g":["鸡肉"],"s":["香菜","酱油","料酒","姜","味精","香油"],"t":["炒锅"],"v":0,"a":"鸡1000克。 香菜5克。酱油10克、绍酒20克、姜10克、味精1克、芝麻油100克、花生油1000克（实耗油100克）。","p":["雏鸡宰杀好去嘴尖、爪尖洗净，用刀从背脊自脖颈至后尾劈为两半，剔去筋骨，剁断鸡颈，但颈皮不要割断。","用刀背砸断鸡翅，抽出大、小腿骨，脊骨剁成两段，将鸡放入碗内。","加绍酒、酱油、姜汁、均匀沾在鸡肉上，腌渍20分钟，取出搌开水分，放入八成热（约200℃）的油锅中炸至八成熟，呈淡红色时捞出。","待油温升至九成热（约225℃）时，再将鸡放入炸至呈枣红色取出，剁成条状，按原鸡形摆入盘内。","炒锅内放清汤和腌鸡的汆汁，烧开后放入香菜、味精、淋上芝麻油泼在鸡身上即成。","食用时用辣酱油和花椒面小碟上桌蘸食，其味更美。"]},{"i":113,"n":"香酥鸡","r":"鲁菜","o":"鲁菜","f":"色泽金黄，鸡肉香酥，肉烂味美，鲜香扑鼻。","c":"热菜","m":["炸"],"g":["鸡肉"],"s":["盐","葱","姜","八角","酱油","白糖","料酒","花椒","椒盐"],"t":["蒸锅"],"v":0,"a":"鸡1000克。 精盐7.5克、葱10克、丁香5克、姜10克、八角5克、酱油10克、糖30克、绍酒20克、花椒3克、花椒盐5克、花生油1500克（实耗油100克）。","p":["鸡洗净，从脊背劈开剔去筋骨，用刀背砸断鸡翅大转弯处，剁去鸡爪、嘴、眼，抽去大、小腿骨，然后用花椒、精盐腌拌鸡身，葱姜拍松与丁香、八角一起放鸡肚内，腌渍2小时后，放入盘内，加酱油、糖，绍酒、清汤上笼蒸烂取出，去葱姜、花椒、丁香、八角，鸡身抹上酱油，放入九成热（约225℃）的油锅中炸至金黄色时，捞起沥油，剁成长条，照鸡原样摆入盘内，外带花椒盐上桌即可。"]},{"i":114,"n":"锅烧鸭","r":"鲁菜","o":"鲁菜","f":"外香脆，肉鲜嫩，造型美观，色味俱佳。","c":"热菜","m":["烧扒焖"],"g":["鸭肉","猪肉","面粉"],"s":["酱油","葱","姜","盐","料酒","八角","桂皮","花椒","淀粉"],"t":["炒锅"],"v":0,"a":"净雏鸭750克。 肥肉丝30克、鸭蛋一个。酱油10克、葱段10克、姜10克、精盐4克、绍酒20克、八角5克、桂皮3克、花椒3克、面粉25克、淀粉25克、花生油1000克。","p":["将净雏鸭洗净，从脊背处割开，去鸭嘴，放锅内加水烧开，煮至八成熟捞出。","剔去鸭骨（保留鸭掌），放大碗内，加酱油、清汤、葱段、姜片、精盐、绍酒，八角、桂皮、花椒，切下鸭头、鸭掌备用。","将鸭蛋打入碗内，加面粉、淀、粉和适量清水调成浓糊，将一半倒在平盘上抹平，把鸭子皮面朝上放在盘内的糊上，再把碗内的蛋糊均匀地抹在鸭面上。","炒锅加花生油烧至八成热（约200℃）时，把鸭子从盘中慢慢拖进油内，炸两面均为金黄色时捞出沥油，然后改切长4厘米、宽25厘米的长条，再将鸭头剁两半，连同鸭掌一并摆成原形，装盘即成。"]},{"i":115,"n":"四喜鸭子","r":"鲁菜","o":"鲁菜","f":"鸭肉酥烂，口味醇厚浓郁，入口软烂不腻，富含营养，尤宜老年人食用 。","c":"热菜","m":["炸"],"g":["鸭肉","猪肉"],"s":["葱","姜","花椒","八角","桂皮","白糖","盐","味精","料酒","淀粉","香油"],"t":["炒锅","砂锅"],"v":0,"a":"净雏鸭750克。 猪肉30克。葱10克、姜10克、花椒5克、八角5克、桂皮5克、白糖20克、精盐5克、味精1克、绍酒21克、湿淀粉15克、芝麻油100克、花生油1500克。","p":["净雏鸭由脊背处劈开，鸭脯相连，用刀根把大骨斩断，去掉鸭嘴内鸭舌，猪肉切成1.5厘米见方的丁，连同鸭子用酱油腌渍10分钟，捞出沥干，放入九成热（约225℃）油锅中，将鸭、猪肉块炸成棕红色捞出沥油，放砂锅内，把猪肉、葱段、姜块、花椒。","八角、桂皮放在正面，清汤内加白糖、精盐、味精，绍酒搅匀倒入砂锅内，用慢火炖2小时至烂熟取出，皮卤朝上摆在大腰盘内，猪肉放在鸭子的四周。","汆汤倒入锅内烧开，调好口味用湿淀粉勾成浓溜芡，加芝麻油浇在鸭子上即成。"]},{"i":116,"n":"酱汁鸭方","r":"鲁菜","o":"鲁菜","f":"颜色油红光亮，酱香四溢，鲜嫩适口，咸中略甜。","c":"热菜","m":["爆炒"],"g":["鸭肉","毛芋头"],"s":["料酒","酱油","白糖","葱","姜","花椒","甜面酱"],"t":["炒锅"],"v":0,"a":"净雏鸭750克。 毛芋30克。绍酒20克、酱油10克、白糖20克、花生油60克、葱10克、姜10克、花椒5克、甜面酱20克。","p":["净雏鸭冲洗净，剁嘴留舌，去脚爪。","砸断大骨，放开水锅内加葱段、姜片、花椒，煮至六、七成熟取出，放在菜墩上，脯朝底剁去头、脖、腿、拆去鸭骨，四周修整，顺鸭脯中间剁为两半，再横刀剁成约2.6厘米的长方块，摆成原样。","毛芋头煮熟，剥去皮，削净黑点，切滚刀块。","将鸭原样铲入锅垫上，再放入毛芋头、鸭脖、腿，骨，放入锅内置火上，加煮鸭汤（以没过鸭子为宜）、绍酒、酱油、白糖。","另取炒锅加入花生油、白糖，炒至嫩色放甜面酱炒熟，加煮鸭原汤，溶化后倒入鸭锅内。","净炒锅加花生油少许，放中火上烧六成热（约150℃），加葱段、姜片、花椒炸至呈金黄色时捞出，倒入鸭锅内。","鸭上面扣上盘子，用小火煨炆1小时左右，揭去盘子，提出锅垫，用平盘托着扣入大盘内，揭去锅垫。","锅内汁用淀粉勾流水芡，浇在鸭方上即成。"]},{"i":117,"n":"黄焖鸭肝","r":"鲁菜","o":"鲁菜","f":"色泽红润光亮，鸭肝软嫩，味道鲜美，营养丰富。","c":"热菜","m":["烧扒焖"],"g":["鸭肉","冬笋","香菇"],"s":["白糖","酱油","葱","花椒","姜","甜面酱","料酒"],"t":["炒锅"],"v":0,"a":"鸭肝100克。 水发玉兰片15克、冬菇15克。白糖30克、酱油10克、葱椒泥10克。葱10克、姜10克、甜面酱15克、绍酒20克、猪油150克。","p":["鸭肝洗净，放沸水中氽过，切成1.5厘米宽的条，用竹签在条上划一个小口（易进汤汁）。","将水发玉兰片切成3.3厘米长的片，冬菇切成两半，均用沸水焯过。","炒锅放猪油少许，烧至六成热（约132℃），放白糖炒至红色时加清汤、酱油、葱椒泥、葱段、姜片、玉兰片、冬菇煸炒，制成料汁倒入碗内。","炒锅再放猪油烧至七成热（约154℃），加甜面酱炒出香味后，放鸭肝、清汤、绍酒以及制好的料汁，用小火炆5分钟，剩1／3汤汁时去掉葱姜，盛入盘内即成。"]},{"i":118,"n":"清汤全家福","r":"鲁菜","o":"鲁菜","f":"选料精细，品种多样，集于一馔，色彩缤纷，软烂清香，汤鲜味美，营养丰富。","c":"汤羹","m":["烩汆"],"g":["鸡肉","猪肉","鸡蛋","海参","蹄筋","鱼肚","鸭肉","猪腰","火腿","鱼翅","冬笋","香菇"],"s":["高汤","盐","味精","淀粉","料酒"],"t":["炒锅"],"v":0,"a":"鸡脯肉250克。 鸡蛋清20克、水发海参20克、蹄筋25克、鱼肚25克。鸭肝20克、鸡腰20克、鸭腰25克、猪黄管20克、水发鱼翅20克、火腿20克、水发玉兰片20克、冬菇25克。精盐5克、味精3克、淀粉50克、清汤150克、绍酒15克。","p":["将生鸡脯肉片切成薄片，用鸡蛋清、精盐、味精、湿淀粉拌匀，入沸水内氽过。","水发海参片为长片。","发好蹄筋一片两半，发好鱼肚、鸭肝均切成片。","鸡、鸭腰煮熟撕去外薄膜，用刀片为两瓣。","鸡肫切十字花刀。","猪黄管划成蜈蚣状。","水发鱼翅顺理整齐。","均放入清汤内氽过。","取一只大碗，把上面各种原料的剩汆碎料放入碗底，然后将猪黄管和鱼翅以外的各种原料均匀相间地摆入碗内，最后将火腿、水发玉兰片、冬菇、菜心相间地摆在上面封面，汤锅内放入清汤、精盐、绍酒烧开，将碗内摆好的形状原样推入漏勺内，将漏勺放入清汤内烫透。","取出后，用手勺轻轻挤干水分，保持原样，再推入瓷盘内。","另再将鱼翅、猪黄管放入汤锅烫透捞出，鱼翅顺丝放在瓷盘中央，上面再放置黄管，汤锅内的原汤加入味精后浇在上面即成。"]},{"i":119,"n":"什锦一品锅","r":"鲁菜·孔府","o":"鲁菜","f":"作功精细原料多样，风味清鲜，品味浓郁，营养丰富。按照孔府传统惯例上“什锦一品锅”时，要外带四 。","c":"热菜","m":["蒸"],"g":["鸡肉","海参","鱼肚","冬笋","豌豆","猪肉","鱿鱼","粉丝粉皮","白菜","山药","鸭肉","鸡蛋"],"s":["料酒","盐","高汤"],"t":["炒锅","蒸锅","砂锅"],"v":0,"a":"鸡200克。 海参20克、鱼肚15克、玉兰片15克、豌豆苗20克、猪黄管20克、鱿鱼卷20克、龙须粉25克、白菜墩20克、山药20克、白煮肘子25克、白煮鸭25克，荷包鸡蛋20克。三套汤20克、绍酒6克、精盐5克。","p":["海参片成刀片形状，鱼肚、玉兰片均片成长条块。","豌豆苗略烫冷水过凉，猪黄管、就鱼卷用毛汤氽过。","取“一品锅”一只，龙须粉、白菜墩、自煮山药放入锅内垫底，将白煮肘子、白煮鸡、白煮鸭分摆在上面，再将海参、鱼肚、鱿鱼卷、玉兰片、荷包鸡蛋在间隔处摆成一定的图案，再把猪黄管放在顶端，加入三套汤、绍酒、精盐，用旺火入笼蒸2小时左右取出，放上豌豆苗上席即成。"]},{"i":120,"n":"寿字鸭羹","r":"鲁菜","o":"鲁菜","f":"色彩多样谐调，红字白底鲜艳夺目，味香醇，羹鲜嫩。","c":"汤羹","m":["蒸"],"g":["鸭肉","冬笋","火腿","口蘑","鸡蛋"],"s":["高汤","料酒","盐"],"t":["炒锅","蒸锅"],"v":0,"a":"白煮鸭脯750克。 冬笋20克、火腿20克、口蘑10克、鸡蛋清25克、“三套汤”1500克。料酒20克、精盐5克。","p":["白煮鸭脯、冬笋切成1厘米见方的丁，口蘑一片为二，火腿切成长5厘米、宽0.5厘米。","厚0.1厘米的条。","水发口蘑、冬笋用毛汤氽过。","取一平盘，正面抹上油。","将鸡蛋清打成雪丽糊，放入盘中用刮子修成直径15厘米、厚1厘米的圆形，上面用火腿摆成“寿”字，放入笼内，小火蒸2分钟取出。","锅内加入三套汤（以鸡、鸭、猪肘三等分调制而成的汤）、鸭丁、笋丁、口蘑、料酒、精盐、见开撇去浮沫，倒入汤盘内，将蒸好的“寿”字推入盘内即成。"]},{"i":121,"n":"清汤柳叶燕菜","r":"鲁菜","o":"鲁菜","f":"燕窝色白如雪，鸽蛋形似柳叶，汤清澈晶莹，口味鲜醇。","c":"汤羹","m":["烩汆"],"g":["燕窝","火腿"],"s":["高汤","香菜","盐","料酒","味精"],"t":["炒锅","蒸锅"],"v":0,"a":"白燕窝100克。 火腿50克、鸽蛋100克、香菜25克。精盐5克、绍酒10克、味精1克。","p":["将燕窝用温水洗净，放入九成热的水中扣焖3小时取出，用摄子摘去燕窝内的绒毛杂质，用清水洗净，再放入碱水中泡发1小时，待涨后，用温水漂洗碱液，撕成丝状，放入清水浸泡。","火腿切成小象眼块，其汆的切成细丝待用。","取羹匙12个，里面抹上一层薄油，把鸽蛋分别打入羹匙内，两个分别摆入火腿片和香菜叶，上笼蒸熟取出，即成“柳叶鸽蛋”。","捞出燕窝控净水分，炒锅内加入清汤。","烧沸后，放入燕窝一焯即可，捞出放在汤碗内，上面摆上细火腿丝和香菜叶，再放上蒸好的柳叶鸽蛋，摆在燕窝的四周。","另用净锅倒入清汤，加入精盐、绍酒，烧开后撇净浮沫，加入味精。","从燕窝的周围轻轻浇入碗内即成。"]},{"i":122,"n":"蟹黄海参","r":"鲁菜","o":"鲁菜","f":"色泽红润，软烂醇郁，滋味鲜美。","c":"热菜","m":["烧扒焖"],"g":["螃蟹","海参"],"s":["料酒","酱油","味精","白糖","淀粉","葱","姜"],"t":["炒锅"],"v":0,"a":"蟹黄200克、水发刺参200克。 绍酒10克。酱油10克、味精1克、白糖20克、湿淀粉15克、葱姜各10克。","p":["把海参顺长劈成片，放在沸水中一氽捞出。","炒锅内放入花生油，旺火烧至七成热（约175℃），投入海参，烹入绍酒，加酱油、清汤、味精、白糖烧透，用湿淀粉勾芡，浇上葱椒油拌匀，盛入盘内。","炒锅内加少量油，中火烧至七成热（约175℃）时放葱、姜末，炸出香味，加入蟹黄，烹入绍酒，颠翻调匀，加酱油、清汤、味精沸后用湿淀粉勾芡，淋上葱椒油，浇在海参上即成。"]},{"i":123,"n":"珍珠海参","r":"鲁菜","o":"鲁菜","f":"色泽黑白相间，清雅悦目，海参滑绵柔软，鸡茸丸香嫩清鲜。","c":"热菜","m":["烧扒焖"],"g":["海参","鸡肉","猪肉","鸡蛋","火腿"],"s":["香菜","高汤","盐","胡椒","葱","姜","料酒","白糖","酱油","味精"],"t":["炒锅"],"v":0,"a":"水发海参400克。 鸡脯肉50克、肥膘肉50克、香菜末15克、鸡蛋一个、火腿末25克。花生袖200克、清汤300克、精盐10克、胡椒面7.5克、葱段姜片各15克、绍酒35克、酱油20克、白糖20克、味精10克。","p":["将海参洗净，顺长劈成片。","炒锅中舀入花生油，旺火烧至九成热（约225℃）时，放入海参片，稍作停顿立刻捞出备用。","鸡脯肉，肥膘肉剁成泥，放入碗中，加清汤、精盐、蛋清、胡椒面、香菜末、火腿末，然后朝一个方向搅打上劲，再挤成直径约为1.5厘米的丸子，放入沸水中氽熟捞出备用。","炒锅中倒入花生油，用中火烧至六成热（约150℃），放葱、姜炸出香味后捞出。","加入清汤、海参片、鸡肉丸、绍酒、酱油、启糖、精盐烧沸，除去浮沫，改用小火烧透，至汤剩1／3时，勾入粉芡，放入味精，淋入明油搅匀即可出锅装盘。"]},{"i":124,"n":"海参肘子","r":"鲁菜","o":"鲁菜","f":"红润光亮，时肉酥烂，汁浓味厚，肥而不腻，海参软濡滑润，葱味浓郁。","c":"热菜","m":["烧扒焖"],"g":["海参","猪肉"],"s":["盐","姜","葱","花椒","八角","桂皮","酱油","料酒","高汤","白糖","淀粉"],"t":["炒锅","蒸锅"],"v":0,"a":"海参（水发）500克。 带皮肘子800克。花生油400克、精盐15克、姜12克。葱6克、花椒5克、八角5克、桂皮3克、酱油25克、清汤250克、绍酒35克、白糖65克、干淀粉25克。","p":["将海参顺长劈成片，放入开水中氽一下，捞出沥净水分。","大葱切成3厘米长的段，姜切成薄片。","猪肘子洗净，用火把外皮烤焦后，再放入温水中泡一下，用刀刮去外面焦皮，再放入锅中，加水没过肘子，用旺火烧开，撇去浮沫后，改用小火煮熟，捞出去骨。","炒锅中加入花生油，用旺火烧至八成热（约200℃）时放入肘子炸成金黄色捞出，油至七成热（约175℃）时，放入海参，滑油后捞出。","把肘肉皮朝下放入大碗内（肉上要用刀剖2厘米见方的刀纹，但不破皮）。","加入葱段、花椒、姜片、八角，桂皮、清汤、酱油、精盐、绍酒，上笼蒸至酥烂。","先将汤汁滗入碗中，再拣出调料渣，将肘肉扣在汤盆（碗）上。","炒锅中留少量油，旺火烧至七成热（约175℃），放入葱段炸至金黄，放入酱油、碗内原汁汤、精盐、白糖、海参、绍酒、清汤，烧沸后芡，淋上花椒油，而后浇在肘子上即可。"]},{"i":125,"n":"氽虾蘑海","r":"鲁菜","o":"鲁菜","f":"汤清澈见底，味鲜香微辣。","c":"热菜","m":["爆炒"],"g":["虾","海参","口蘑"],"s":["味精","料酒","酱油","盐","葱","胡椒","香菜","高汤"],"t":["炒锅"],"v":0,"a":"水发海参250克。 大虾50克、水发口蘑120克，味精12克、绍酒30克、酱油20克、精盐15京、葱丝10克、胡椒面5克、鸡油25克、清汤500克、香菜15克。","p":["将虾去肠洗净、劈成片，口蘑海参均劈成小片，香菜切成长0.7厘米的段，炒锅内加水置旺火烧开会投入虾片，氽熟捞出，海参亦氽透放在汤盆内，撒上香菜、葱丝。","炒锅内加上清汤、味精、绍酒、酱油、精盐、虾片、口蘑，旺火烧沸，撇去浮沫，浇在汤盘内入淋上鸡油、撒上胡椒面即成。"]},{"i":126,"n":"原壳鲍鱼","r":"鲁菜","o":"鲁菜","f":"肉质细嫩，味道鲜美，保持原形别具一格。","c":"热菜","m":["蒸"],"g":["鲍鱼","偏口鱼","猪肉","火腿","冬笋","豌豆","鸡蛋"],"s":["料酒","盐","淀粉","葱","蒜","姜","味精","高汤"],"t":["炒锅","蒸锅"],"v":0,"a":"带壳鲜鲍鱼200克。 偏口鱼肉50克、火腿肉30克、净冬笋35克、熟青豆20克。绍酒25克、精盐10克、鸡蛋清20克、湿淀粉20克、鸡油5克、葱、蒜、姜各10克、清汤250克、味精15克、5％的碱液500克。","p":["将带壳鲍鱼洗净，入沸水稍煮。","挖出肉，劈成0.16厘米的片。","火腿、冬菇切成长3.3厘米、宽1.3厘米、厚0.16厘米的片。","鱼肉制成泥，加入碗内，加湿淀粉、绍酒、精盐、鸡蛋清、葱姜末搅匀，倒入大盘摊平（留出盘边）。","鲍鱼壳用5％的碱液刷洗干净，再放入沸水煮一下，捞出控水，鲍鱼壳朝上，整齐地按在鱼泥上入笼蒸5分钟取出。","炒锅内放清汤、精盐、绍酒，鲍鱼片、冬笋、火腿、青豆，烧沸撇去浮沫，甩漏勺捞出平均放在鲍鱼壳内，锅内的汤用湿淀粉勾芡，放入味精，淋上鸡油，浇在鲍鱼上即成。"]},{"i":127,"n":"扒鲍鱼芦笋","r":"鲁菜","o":"鲁菜","f":"荤素兼备，鲍鱼质地鲜嫩，色红油亮，芦笋色白，汁香，造型别致。","c":"热菜","m":["烧扒焖"],"g":["鲍鱼","冬笋","猪肉","香菇","火腿"],"s":["淀粉","料酒","盐","味精","白糖","高汤"],"t":["炒锅","蒸锅"],"v":0,"a":"水发鲍肉400克。 芦笋30克、水发冬菇100克。火腿20克。湿淀粉15克。绍酒刀克、精盐2克、味精10克、清汤适量、糖色、花椒油10克。","p":["将鲍鱼去掉边缘，劈成薄片，摆在盘子的一边成长方形，芦笋的中间截开，整齐地摆在盘子的另一边，火腿切成像眼片，摆在芦笋上面。","冬菇切成细丝，剩汆火腿也切成细丝，均摆在鲍鱼和芦笋中间，在装摆鲍鱼芦笋的盘内滗入绍酒、精盐、清汤，入笼蒸3分钟左右取出，将汤放入锅内。","加绍酒、味精用湿淀粉勾芡，烧沸后将一半浇在芦笋上，汆下的一半加入糖色，淋花椒油，浇在鲍鱼上即成。"]},{"i":128,"n":"扒鲍鱼冬瓜球","r":"鲁菜","o":"鲁菜","f":"质地柔软润滑，口味鲜嫩香醇。","c":"热菜","m":["烧扒焖"],"g":["鲍鱼","冬瓜","猪肉","火腿","香菇","冬笋","豌豆"],"s":["葱","姜","蒜","淀粉","高汤","味精"],"t":["炒锅"],"v":0,"a":"水发鲍鱼肉300克。 冬瓜50克、火腿20克、水发冬菇30克、冬笋20克、青豆10克。花生油50克、葱姜、蒜各15克、清汤20克、湿淀粉30克、味精5克、鸡油25克。","p":["将鲍鱼先用直刀法每0.2厘米宽剞一刀（深度为2／3）然后转换一个角度劈成大片。","冬瓜去皮切成1.5厘米见方的块，修成圆球形。","冬菇、冬笋、火腿均切象眼片。","炒锅加水，旺火烧沸放入冬肠煮熟，捞出控净水分。","炒锅内花生油、用中火烧至六成热（约1s0℃〕时，放入葱姜蒜出香味后、加入清汤（捞出葱、姜、蒜不用）、鲍鱼、冬菇、火腿、青豆、冬瓜球，烧沸后用湿淀粉勾芡，用微火扒透，放味精、淋上鸡油出锅即成。"]},{"i":129,"n":"麻酱紫鲍","r":"鲁菜","o":"鲁菜","f":"味鲜质嫩，具有浓郁的芝麻酱清香。","c":"热菜","m":["烧扒焖"],"g":["鲍鱼","猪肉"],"s":["芝麻酱","料酒","酱油","白糖","盐","葱","姜"],"t":["炒锅"],"v":0,"a":"水发鲍鱼肉200克。 芝麻酱75克。酱油5克、绍酒20克、白糖、精盐、葱姜末各10克。","p":["将鲍鱼两面交叉剞直刀法，再切成宽1厘米的条，投入开水中一分捞出备用。","炒锅内加花生油少许，用中火烧至七成热（约175℃），放入葱姜末，炸出香味，随入鲍鱼、酱油、绍酒、白糖、精盐、清汤烧开，打去浮沫，加入芝麻酱、味精，用手勺搅匀，淋上鸡油即成。"]},{"i":130,"n":"八宝原壳鲜贝","r":"鲁菜","o":"鲁菜","f":"造型美观，色泽艳丽，口味清鲜。","c":"热菜","m":["爆炒"],"g":["鲜贝","冬笋","香菇","虾","猪肉","鸡肉","海参","火腿"],"s":["盐","味精","酱油","料酒","葱","姜","高汤"],"t":["炒锅","蒸锅"],"v":0,"a":"鲜贝150克。 净冬笋，水发冬菇各30克、大虾肉、熟鸡肉、水发海参各50克、火腿15克。精盐15克、酱油25克、味精7.5克、绍酒30克、葱姜末各15克、清汤300克。","p":["将鲜贝肉洗净，用沸水氽后备用。","冬笋、冬菇、火腿、大虾肉、熟鸡肉、水发海参、海米、鲜鲍鱼肉，均切成小丁，即八宝丁。","剩汆的冬笋，冬菇切片。","鸡蛋清打成雪丽糊，加上淀粉和适量水搅匀。","取12只鲜贝壳放入5％阶液中刷洗净，放入沸水煮过，捞出沥水，均匀地围大盘摆一周，上笼蒸10分钟取出。","净炒锅内加上少量花生油，旺火烧至六成热（约150℃）时加葱、姜末略煸，随即加上八宝丁煸炒，再放入精盐、酱油、味精、绍酒、清汤稍煮一下，用湿淀粉勾芡，淋上芝麻油即成八宝馅料。","盛入碗内，将八宝馅均匀地盛在贝壳内。","抹上一层雪丽糊，撤上香菜。","蛋糕末，入笼蒸2分钟取出。","炒锅内加花生油烧热后加葱、姜片炸出香味，加上清汤，捞出葱姜，放入鲜贝、冬菇笋片，加上精盐、绍酒稍煨，然后勾芡，淋上鸡油，盛在大圆盘中央即成。"]},{"i":131,"n":"绣球干贝","r":"鲁菜","o":"鲁菜","f":"形似绣球，鲜而不腻，嫩爽多汁，甘美清润。","c":"热菜","m":["爆炒"],"g":["干贝","虾","猪肉","冬笋","白菜","鸡蛋"],"s":["盐","味精","料酒","葱","姜","淀粉","香油"],"t":["炒锅","蒸锅"],"v":0,"a":"水发干贝200克。 大虾肉100克、肥猪肉50克、净冬笋25克、菠菜心35克。精盐12克、味精7.5克、绍酒30克。葱姜汁20克、鸡蛋清25克、芝麻油15克、湿淀粉25克。","p":["干贝挤干水分，搓成细丝，火腿、冬笋、冬菇均切成2厘米长的细丝，用沸水焯一下，捞出控净水分与干贝丝拌和一起待用。","将大虾肉、肥猪肉剁成细泥，加鸡蛋情、清汤、精盐、味精、绍酒。","葱姜汁、芝麻油拌匀成馅，然后用手挤成直径为25厘米的丸子，放在拌和好的干贝丝上滚沾均匀，成绣球状，摆于盘内上笼用旺火蒸至嫩熟取出，滗净汤汁。","炒锅加入清汤、精盐、绍酒。","味精烧开后，撇净浮沫，用湿淀粉勾成溜芡，加芝麻油浇在干贝球上。","菠菜心洗净，炒锅内放上花生油烧热后加入菠菜心煸炒，加精盐、味精炒熟，淋上芝麻油盛出摆在绣球干贝四周即可。"]},{"i":132,"n":"白扒鱼翅","r":"鲁菜","o":"鲁菜","f":"汤汁浓郁，鱼翅软烂光亮，鲜香味醇。","c":"热菜","m":["烧扒焖"],"g":["鱼翅","鸡肉","猪肉","鸭肉","白菜"],"s":["盐","料酒","葱","姜","味精","淀粉"],"t":["炒锅","蒸锅"],"v":0,"a":"水发鱼翅200克。 母鸡肉、肥鸭肉、猪肘肉各25克、菜心50克、熟猪油50克、鸡油25克、精盐5克、绍酒10克。葱10克、鲜姜10克、味精0.5克、淀粉30克。","p":["将母鸡肉、肥鸭肉、猪肘肉洗净剁成小块，放入开水锅内焯过捞出，洗净血沫待用。","炒锅内加入清汤、精盐、绍酒、鱼翅，烧开后捞出沥净水分。","再把菜心放入锅内氽过捞出。","将鱼翅用清水洗净，排列整齐，码在大碗的底层，上面放上鸡块、鸭块、猪肘肉块和葱、姜片、精盐，绍酒、倒入清汤上笼蒸烂，取出捡去鸡块、鸭块。","猪肘肉块、葱、姜它用。","炒锅内放熟猪油，用中火烧至六成热（约132℃）时，放入葱、姜片烧出香味，再加精盐、奶汤、绍酒捞出葱姜不要，放入鱼翅、菜心，烧开后撇去浮沫，改用微火煨扒，待汤汁剩下1／3时，放湿淀粉勾芡，至汤成浓汁时，放味精、淋鸡油，大翻勺装盘即成。"]},{"i":133,"n":"蒸扒三丝干贝","r":"鲁菜","o":"鲁菜","f":"造型美观，色泽悦目，味清鲜软嫩，原汁原味。","c":"热菜","m":["蒸","烧扒焖"],"g":["干贝","冬笋","香菇","火腿"],"s":["盐","料酒","味精","酱油","葱","姜","高汤","香油","淀粉"],"t":["炒锅","蒸锅"],"v":0,"a":"水发干贝200克。 冬笋、水发冬菇、火腿各100克。精盐12克、绍酒30克、酱油10克、味精7.5克、葱姜各10克、清汤300克、麻油15克、湿淀粉25克、鸡油10克、猪油100克。","p":["将干贝放入沸水中氽一下，捞出沥干水分，再整齐均匀地沿碗底直到碗边排列一层，冬笋、冬菇、火腿均切丝。","炒锅内加入少量猪油，用旺火烧七成热（约154℃〕，放入葱姜略煸，加入笋丝、冬菇丝、火腿丝，煸炒，再加精盐、绍酒、酱油、味精、清汤，待沸后勾芡，淋上芝麻油，盛入干贝碗内压紧、压平，放笼中蒸10分钟，取出扣入大圆盘内。","炒锅内加入清汤、精盐、味精、绍酒，待沸后，用湿淀粉勾芡，淋上鸡油浇于干贝上即成。"]},{"i":134,"n":"鲜贝冬瓜球","r":"鲁菜","o":"鲁菜","f":"造型别致，质地软嫩，口味鲜美。","c":"热菜","m":["爆炒"],"g":["鲜贝","冬瓜"],"s":["盐","味精","淀粉","料酒","葱","姜","高汤"],"t":["炒锅"],"v":0,"a":"鲜贝150克。 冬瓜350克。精盐13克、味精7.5克、湿淀粉50克、绍酒35克、葱姜各15克、花生油500克，清汤500克。","p":["将鲜贝洗净放入碗内，加入鸡蛋清、湿淀粉和适量水抓匀上浆。","冬瓜用修成直径1厘米的圆球，放入沸高汤内煨熟入味待用。","炒锅内放入花生油，“中火烧至五成热（约125℃）时，放入鲜贝滑熟捞出。","碗内加清汤、精盐、味精、湿淀粉调匀成汁。","炒锅内留少量油，旺火烧至七成热（约175℃）时，放入葱、姜末略煸，烹入绍酒，随即加入冬瓜球，鲜贝以及调好的芡汁，迅速颠炒均匀，淋上芝麻脑装盘即成。"]},{"i":135,"n":"油爆鲜贝（做法二）","r":"鲁菜","o":"鲁菜","f":"色调和谐。软嫩鲜香，清淡爽口。","c":"热菜","m":["爆炒"],"g":["鲜贝","冬笋","口蘑","豌豆","鸡蛋"],"s":["盐","味精","淀粉","料酒","葱"],"t":["炒锅"],"v":0,"a":"鲜贝200克。 冬笋100克、鲜口蘑50克，青豆15克。精盐10克、味精7.5克、湿淀粉30克、绍酒25克、鸡蛋清25克、大葱丁10克、花生油150克、鸡油15克。","p":["将鲜贝劈成0.3厘米厚的圆片。","冬笋、鲜口蘑切成0.4厘米见方丁。","葱白剖开切丁。","青豆放入水中煮熟，碗内加清汤、精盐、味精、湿淀粉调匀成汁。","将鲜贝放沸水中氽过捞出，放入碗内，加鸡蛋清、湿淀粉、精盐搅拌上劲。","炒锅内加花生油，在旺火上烧至七成热（约175℃）时，将鲜贝下入锅中过油捞出。","锅内留油少量，旺火烧热后放入葱丁、笋丁、鲜口蘑丁和青豆稍炒，烹入绍酒，加入鲜贝，迅速倒入调好的汁，淋上鸡油。","急速颠翻，装盘即成。"]},{"i":136,"n":"软炸鲜贝","r":"鲁菜","o":"鲁菜","f":"色泽金黄，质地软嫩清爽，鲜香味美。","c":"热菜","m":["炸"],"g":["鲜贝","鸡蛋","面粉"],"s":["盐","味精","料酒","椒盐"],"t":["炒锅"],"v":0,"a":"鲜贝150克。 鸡蛋1个（约重50克）。精盐12克、味精7.5克、绍酒25克、花椒盐20克、面粉50克、花生油750克（耗油75克）。","p":["将鲜贝放入碗内，加入精盐、味精、绍酒腌渍入味。","取二碗磕入鸡蛋，加面粉、清汤搅匀成糊，再放入鲜贝抓匀待用，炒锅内加入花生油，用中火烧至六成热（约150℃）时，将鲜贝分散下入锅，用小铲拨动，炸至外层糊凝固，色泽一致时捞出拨散。","待油温升到九成热（约225℃）时，再将鲜贝放入炸熟，外层呈金黄时捞出，控净油，装盘即成，上席时外带花椒盐佐食。"]},{"i":137,"n":"芙蓉干贝","r":"鲁菜","o":"鲁菜","f":"色泽洁白，状似“芙蓉花”，清淡嫩爽，口味鲜美。","c":"热菜","m":["爆炒"],"g":["干贝","鸡蛋","豌豆"],"s":["盐","味精","料酒","淀粉","葱","姜","香油"],"t":["炒锅"],"v":0,"a":"水发干贝150克。 鸡蛋清50克、青豆50克。精盐13克、味精7.5克、绍酒30克、湿淀粉51克，葱姜末各15克、麻油10克。花生油。","p":["将水发干贝、青豆分别入清汤内烧沸煮透，捞出沥净水分。","将鸡蛋清加入清汤，与精盐、味精、绍酒、湿淀粉搅匀。","炒锅内加入花生油用中火烧至六成热（约150℃），放入葱姜末略煸，倒入搅好的鸡蛋清液推炒至成熟时）加入干贝、青豆炒至嫩熟呈芙蓉状时，淋上芝麻油盛入盘里即成。"]},{"i":138,"n":"红烧鱼唇","r":"鲁菜","o":"鲁菜","f":"质地糯软味美，滑润鲜香。","c":"热菜","m":["烧扒焖"],"g":["鱼唇"],"s":["盐","酱油","葱","姜","白糖","味精","料酒","高汤","香油","淀粉"],"t":["炒锅"],"v":0,"a":"水发鱼唇150克。 精盐7.5克、酱油10克、葱段、姜片各15克、白糖12克、糖色5克、味精5克、绍酒25克、清汤250克、花生油50克、芝麻油10克、湿淀粉25克。","p":["将鱼唇改刀成2.5厘米长、宽1厘米的片，下入锅内用开水氽透，捞出用清水漂净。","如此反复两遍。","炒锅内加清汤、葱段、姜片、绍酒，加入鱼唇用微火烧开，撇尽浮沫，再用微火煨10分钟左右，捞出控净汤汁。","炒锅内加入花生油。","中火烧至六成热（约150℃），放入葱段、姜片煸至金黄捞出不用，再放入绍酒烹后，加酱油、清汤，白糖、糖色、味精、精盐、鱼唇烧开，撇去浮沫，用慢火煨5分钟，再用淀粉勾成熘芡，淋上鸡汤、芝麻油，炒匀盛出装盘即成。"]},{"i":139,"n":"荷花鱼翅","r":"鲁菜","o":"鲁菜","f":"造型美观，鱼翅软烂，“荷花”细嫩，汤鲜味美。","c":"热菜","m":["蒸"],"g":["鱼翅","鸡肉","海米","火腿","鸡蛋","猪肉","菠菜"],"s":["淀粉","盐","葱","姜"],"t":["炒锅","蒸锅"],"v":0,"a":"水发鱼翅200克。 鸡茸30克，水发海米30克、火腿末20克、黄蛋糕50克、软鸡蛋50克、熟鸡、猪肉各20克。鸡蛋清20克、淀粉30克、精盐2.5克、熟猪油5克，菠菜汁10克、葱、姜各10克。","p":["将鸡茸放入碗内，加上鸡蛋清、湿淀粉、精盐，拌匀成鸡料子。","选汤匙12把（大号6把，中号6把）调匙内抹上熟猪油，再抹上鸡料子，至平为止，汤匙顶端撒上火腿末，成莲花瓣形。","将剩汆鸡料子加入菠菜汁，呈绿色，取酒盅一个，内抹油，再抹上绿色鸡料子，用海米均匀地插入，做成莲蓬，将莲蓬、莲花瓣入笼用微火蒸8一12分钟。","熟后取出。","锅内加入清水烧沸，将软鸡蛋用细针扎一小眼。","将鸡蛋液轻轻挤入沸水内，成鸡蛋黄丝，待漂起后捞出，鸡蛋糕修成圆形，成一个蛋糕托，放入鱼盘的一端，把蒸熟的莲花瓣、莲蓬分别取出，放在蛋糕托上拼成荷花状，把鸡蛋黄丝围在莲蓬周围成莲须。","将鱼盘放入笼内蒸2分钟取出，将鱼翅放于碗内，加熟鸡肉、熟猪油、葱段、姜片、清汤，入笼蒸烂取出，去了鸡肉、猪肉、葱、姜待用。","炒锅内放入葱油烧至七成熟（约175℃）时，放葱段、姜片稍炸捞出，再放酱油、绍酒、清汤，精盐、鱼翅，用微火煨炆至汤汁将小时，放湿淀粉勾芡，淋葱油，推入鱼盘一端。","汤锅内放清汤、绍酒、精盐，烧沸后放湿淀粉勾芡，淋鸡油浇在荷花上即成。"]},{"i":140,"n":"凤凰鱼翅","r":"鲁菜","o":"鲁菜","f":"选料讲究。制作精细，注重火候，成菜造型美观，酥烂鲜香，色泽红润，芡汁醇厚。","c":"热菜","m":["蒸"],"g":["鱼翅","鸡肉","冬笋"],"s":["葱","姜","盐","酱油","料酒","味精","高汤","白糖","八角","花椒"],"t":["炒锅","蒸锅"],"v":0,"a":"冰发鱼翅200克、净雏鸡200克。 净冬笋30克。葱段、姜片各10克、精盐7.5克、酱油15克、绍酒25克、湿淀25克、味精5克、清汤250克、葱椒油50克、白糖15克、八角1克、花椒1克、花生油1000克（实耗油75克）。","p":["将雏鸡冲洗干净，从脊背劈开，胸部相连，拍断骨骼，鸡的表面抹上酱油，放入旺火热油中炸至皮金黄色时捞出，皮朝下，放入大碗内，加入葱段、姜片、八角、花椒、绍酒、清汤、白糖、酱油，放入笼内蒸烂，滗出原汤，去掉葱姜、八角，将鸡扣入鱼盘内，把鸡翅，腿伸开，把鸡头竖起，鸡嘴上嵌一朵香菜叶。","冬笋切成标枪头型。","再将鱼翅放入开水中氽一下，捞出沥净水，摆成蓑衣状放入平盘内。","汤锅内加入蒸鸡原汤、清汤、酱油、精盐、绍酒。","将码好的鱼翅原样推入锅内，加入冬笋，微火扒透，用湿淀粉勾流芡，淋葱椒油，起锅顺披在鸡身上。","汤锅内放入清汤，精盐烧开，用湿淀粉勾芡，放入味精，淋葱椒油，浇入鱼翅和鸡身上即成。"]},{"i":141,"n":"红扒鱼翅","r":"鲁菜","o":"鲁菜","f":"汤汁浅红发亮，鱼翅软烂糯滑。味道鲜美。","c":"热菜","m":["烧扒焖"],"g":["鱼翅","鸡肉","猪肉","火腿"],"s":["姜","葱","盐","料酒","味精","高汤","淀粉"],"t":["炒锅"],"v":0,"a":"水发鱼翅250克。 净母鸡肉200克、猪肘肉、火腿各50克。姜片15克、葱段20克、精盐10克、绍酒35克、味精12克、清汤250克、湿淀粉25克、花椒油15克、花生油100克。","p":["将鱼翅用开水氽一遍，捞出用清水洗净；整齐地码在竹箅上呈扇面状，再盖上一个箅子，放入炒锅内，将母鸡，猪肘肉剁成大块，下锅用开水氽过，捞出洗净，火腿洗净与母鸡肉，猪肘肉同放锅内，加入清水，以浸过原料为宜，加姜片、葱段，用中火烧热，撇去浮沫，移至微火上焖2一3小时，将鱼翅取出。","炒锅内放上花生油。","用中火烧至七成热（约175℃），加姜片、葱段炸至金黄色捞出不用。","烹入绍酒、酱、清汤、精盐。","鱼翅烧沸，撇净浮沫，用小火煨10分钟，用湿淀粉勾成溜芡。","加花椒油、味精、鸡油翻锅，盛入盘中即可。"]},{"i":142,"n":"葱段海参","r":"鲁菜","o":"鲁菜","f":"色泽红褐光亮，海参质地柔软滑润，葱香四溢，芡汁浓郁醇厚。","c":"热菜","m":["烧扒焖"],"g":["海参"],"s":["葱","盐","酱油","白糖","料酒","淀粉"],"t":["炒锅"],"v":0,"a":"水发海参250克，章丘大葱白50克。 精盐3克、酱油6克、白糖20克、绍酒6克、湿淀粉适量、猪油150克。","p":["将海参劈成1.7厘米厚、3厘米长、2.5厘米宽的片形。","用开水一焯捞出，控净水分。","葱白劈成两片，切成4厘米长的段，姜块拍松。","炒锅内加入高汤、葱段、姜、盐、绍酒、花椒水、海参，旺火烧沸后，用微火烧2分钟，然后倒入漏勺沥干水分，捡去葱姜、炒锅内放熟猪油，中火烧至6成热（约132℃）时，加入葱段，炸至金黄色捞出，再将葱油倒入碗内待用，锅内放入少量油，加入炸好的葱段、精盐、海参、清汤、酱袖、白糖、绍酒，沸后用湿淀粉勾芡，再以中火烧透收汁，淋上葱油，放入味精，盛入盘内即成。"]},{"i":143,"n":"扒酿海参","r":"鲁菜","o":"鲁菜","f":"造型美观，鲜嫩滑爽、糯软清新，质地柔软滑润，鲜咸适口。","c":"热菜","m":["烧扒焖"],"g":["海参","虾","猪肉"],"s":["料酒","盐","味精","葱","姜","淀粉"],"t":["炒锅","蒸锅"],"v":0,"a":"整条水发海参12个，鲜虾泥30克、虾脑50克、肥猪肉泥100克。 绍酒10克、精盐5克、味精1克、葱姜汁、湿淀粉各适量。","p":["将虾泥、肥猪肉泥加精盐、绍酒、味精、清汤、芝麻油及虾脑搅匀为馅，再将海参用开水氽香捞出，炒锅内加入清汤、葱姜、精盐、绍酒、海参用中火烧沸后，再用小火烧透，捞出晾干。","将虾馅分抹在海参内，摆入盘内入笼蒸熟取出，虾馅面朝下平放在案板上，逐个在海参上用刀斜切4／5深，刀距1厘米，然后馅面朝上排入盘内。","炒锅内加入清汤、绍酒、葱姜水、精盐、味精烧开，去净浮沫，用湿淀粉勾溜芡，加鸡油淋在海参上即成。"]},{"i":144,"n":"蝴蝶海参","r":"鲁菜","o":"鲁菜","f":"形状美观，清澈见底，味道鲜醇，食之清新爽。","c":"热菜","m":["蒸"],"g":["海参","鱼肉","猪肉","鱼翅","香菇","火腿","芝麻"],"s":["盐","味精","酱油","料酒"],"t":["炒锅","蒸锅"],"v":0,"a":"水发海参250克。 鱼肉30克、水发鱼翅20克、水发冬菇25克、熟火腿、黑芝麻各适量，精盐5克、酱油10克，味精0.5克、绍酒10克。","p":["将每个海参顺长劈成3片（共12片），在沸水中烫过，捞出用洁布搌干水分，修成蝴蝶形状，鱼肉在凉水中浸泡10分钟，捞出斩成细泥，放入碗内，加精盐、味精、清汤、鸡蛋清搅匀成鱼料。","将海参皮面朝上放入盘内，海参中间撒上千淀粉，然后用鱼料做成蝴蝶身躯横放在海参中间，用黑芝麻在头端作蝴蝶“眼”，按上火腿丝作蝴蝶嘴，鱼翅作须。","冬菇、鸡蛋皮、黄瓜皮均切成长2厘米、宽0.2厘米的丝，分色摆在蝴蝶身上，制成12只“蝴蝶”，上笼蒸熟取出。","炒锅内放入清汤，置旺火烧沸，撇净浮沫，加绍酒、精盐、味精、酱油，调好口味，倒入汤碗中，将蒸熟的“蝴蝶海参”轻轻推入汤碗内即成。"]},{"i":145,"n":"一品寿桃","r":"鲁菜","o":"鲁菜","f":"寿桃形象逼真，食之沙甜爽口，沁入心脾。","c":"甜品","m":["蒸"],"g":["红枣","山药","山楂"],"s":["白糖","淀粉"],"t":["炒锅","蒸锅"],"v":1,"a":"长红枣150克。 山药50克、山楂糕30克、红丝20克、青梅20克。熟猪油20克、白糖20克。淀粉50克。","p":["长红枣洗净，煮烂，剥皮去核，制成枣泥，放入炒锅内加熟猪油、白糖，熬成枣泥馅。","山药洗净，蒸烂，去皮、斑点，用刀抹成细泥。","山楂糕切成长条。","红丝、青梅均匀成细末。","取大盘1只，中间放上枣泥，将山药泥覆盖其上制成桃形及两片叶子，抹尖滑，用青丝做叶子筋高轮廓，桃身上用山植糕条摆上“寿”字，分别在桃尖和下半部用红丝末点缀好，青梅入桃蒂上，入笼蒸5分钟取出，汤锅内加清水、白糖，中火化开，用湿淀粉勾芡制成薄芡，轻轻浇在寿桃上即成。"]},{"i":146,"n":"空心琉璃丸子","r":"鲁菜","o":"鲁菜","f":"此菜宛如一颗颗镶金裹玉的珍珠，玲珑剔透，形圆如珠，颜色金黄，酥脆香甜，百食不厌。","c":"甜品","m":["炸"],"g":["面粉","鸡蛋"],"s":["白糖"],"t":["炒锅"],"v":1,"a":"精面粉150克。 鸡蛋黄50克、花生油150克白糖20克、香精4克。","p":["精面粉加开水搅拌成厚糊状，凉至50℃时掺入。","鸡蛋黄搅匀，做成量径6厘米的丸子，放入六成热（约150℃）油温中炸至挺身浮起时，捞出。","将油烧至八成热（约200℃），投入丸子复炸，待形成空丸呈金黄色时捞出派油。","炒锅放入芝麻油烧至四成热（约100℃），放入白糖，小火炒熬至起泡时，倒入丸子，端离火口颠翻，滴入香精，倒入凉盘，用筷子拨开晾凉，随后按圆锥形摆在盘内即成。"]},{"i":147,"n":"杏仁豆腐","r":"鲁菜","o":"鲁菜","f":"造型典雅，甜酸适口，冷热食用皆宜。","c":"甜品","m":["爆炒"],"g":["杏仁","豆腐","山楂","黄瓜","西红柿"],"s":["淀粉","白糖"],"t":["炒锅"],"v":1,"a":"杏仁150克、冻粉100克。 山植糕20克、黄瓜皮25克、西红柿25克。淀粉50克、白糖20克。","p":["杏仁放入水中浸泡片刻，剥去皮，砸成细泥，然后用细炒布拧出汁，放入碗内。","汤锅洗净放火上，加清水，浸泡的冻粉，用小火熬煮化后，加入淀粉、杏仁汁、白糖、煮沸后倒入盘内，冷却后原样切成象眼块（周边不要切断），将山楂糕、黄瓜皮、西红柿均匀成细丝，在杏仁豆腐上摆成图案。","汤锅内加清水、白糖，烧沸后倒入汤盘内，待晾凉后，将制成的“杏仁豆腐”原样推入糖水盘内即成。"]},{"i":148,"n":"炸鸳鸯嘎渣","r":"鲁菜","o":"鲁菜","f":"颜色鲜艳，黄红互映，质地软嫩，甘酸甜美，雅致可口。","c":"甜品","m":["炸"],"g":["鸡蛋","山楂","面粉"],"s":["桂花酱","淀粉","白糖"],"t":["炒锅"],"v":1,"a":"鸡蛋－枚（重约50克）。 桂花酱10克、山
