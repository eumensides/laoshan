白糖","高汤","料酒","甜面酱","葱","姜"],"t":["炒锅"],"v":0,"a":"一条(约重二斤) 黄河鲤鱼 酱油 六钱 白糖 清汤④ 斤 绍酒 三钱 甜面酱 钱 钱 葱末 姜末 五分 花生油 二斤（约耗三两）","p":["将鱼去腮、鳞，挖去内脏，洗净。用刀在鱼的两面每隔七分宽斜刹一刀，深度约为四分左右。","炒勺内加花生油，在旺火上烧至七成热时，把鱼放入，炸呈金黄色时捞出。炒勺内剩油一两，放入葱姜末、白糖，炒至糖沫浮起并发黄时；随即加入甜面酱，炸出酱香味(水汽已尽)，再加入绍酒、酱油、清汤，把鱼平放勺内，用微火煨，至汤汁去一半时，用手铲将鱼翻过来，继续煨至汤汁全部浸入鱼肉即成。"]},{"i":636,"n":"生熏大黄鱼","r":"鲁菜","o":"中国菜谱·山东","f":"特点此菜黄鱼熏烤后呈金黄色，鱼肉鲜嫩，并有熏香味。","c":"热菜","m":["蒸"],"g":["黄鱼"],"s":["白糖","葱","姜","盐","料酒","味精","花椒","香油"],"t":["炒锅","蒸锅"],"v":0,"a":"一条(约重一斤半) 黄鱼 熟米饭 二两 白糖 一两 葱 二段 姜 二片 精盐 二钱 五钱 绍酒 味精 二分 花椒 十五粒 芝麻油 一两","p":["将鱼刮去鳞，挖去腮与内脏。洗净后，用洁布干水分，放入大盘内。将花椒、精盐、绍酒、葱、姜（用刀拍碎)、味精放入碗内拌匀成汁，浇在鱼上面，腌渍约一小时。","炒勺内先放白糖和熟米饭，再放上铁算子，将鱼从盘内取出(葱、姜、花椒挑出不要)，放在铁算子上，盖上笼盖，用旺火熏。当糖和米饭烧湖冒出大烟时，将锅移至微火上稍停二、三分钟后，再端到旺火上继续熏烤，直到又冒大烟时，再将锅端离火口（鱼已熏到六成熟、呈金黄色），稍停片刻，揭开锅盖，将鱼取出盛入盘内，用小毛刷蘸芝麻油擦遍鱼身，再上笼用旺火蒸十分钟取出即可。67。"]},{"i":637,"n":"油焖鱼","r":"鲁菜·济宁","o":"中国菜谱·山东","f":"特点此菜鱼刺酥，肉烂油润，又甜又咸，味香醇厚。为济宁传统风味。","c":"热菜","m":["烧扒焖"],"g":["鱼肉","鲫鱼","白菜"],"s":["葱","姜","花椒","八角","料酒","桂皮","白糖","高汤","酱油","盐","香油"],"t":["炒锅"],"v":0,"a":"鲜小鲫鱼（或鲢鱼） 五斤 大白菜心 斤 大葱 半斤 姜 二两 花椒 二钱 八角（大茴香） 三钱 肉桂 绍酒 *五两 白糖 六两 清汤④ 二斤 酱油 五两 精盐 三钱 芝麻油 六两 熟猪油 八两 花生油 三斤（约耗六两）","p":["将鱼去鳞、腮、内脏，洗净，干水分；大白菜心用沸水焯过，沥净水；大葱切四寸长的片；姜切成大片；花椒、八角、肉桂用洁白布包扎牢(料包)。","炒勺内放入花生油，烧至六成热时，将鱼下人油内炸四至五分钟(五斤鱼可分三次下锅)，呈金黄色时（皮稍焦时）捞出沥净油。大葱片亦放入油内炸至微黄时捞出。","取大罐一口，刷洗干净，在罐底先平摆上碎瓷盘片一层（防止糊底)，再放上竹算子一个，“料包”放在算子中间，再将鱼逐条整齐地摆入罐内(鱼头朝罐璧，尾朝中心)，逐层摆齐。炸过的葱摆在鱼上，再盖上一层大白菜心（摆匀盖严)。将清汤（汤要浸过鱼）、酱油、精盐、绍酒、白糖、熟猪油放入，盖严罐口，先放在中火上烧沸，后移至微火上煨焖（共需约五小时)。三小时后见汤已至与鱼面相平时，加入芝麻油(火力应越来越小)。待汤剩百分之七十时，鱼肉、骨、刺已酥软，将罐端离火眼，晾凉后取出即成。"]},{"i":638,"n":"清余赤鳞鱼*","r":"鲁菜·泰安","o":"中国菜谱·山东","f":"特点此菜鱼无腥味，鱼肉嫩，汤鲜美清口，系泰安传统风味。★赤鳞鱼原名端霖鱼，又名石鳞鱼。鱼的翅上有红边、鳞闪闪发金光的为金","c":"热菜","m":["爆炒"],"g":["赤鳞鱼"],"s":["花椒","料酒","高汤","胡椒","盐","味精","酱油","姜"],"t":["炒锅"],"v":0,"a":"活赤鳞鱼 十六条(约重一斤半) 花椒绍酒 二钱 清汤④ 一斤半 胡椒面 一分 精盐 二钱 酱油 二钱 味精 二分 二两 姜末 二钱","p":["先把活赤鳞鱼剖腹取出内脏，洗净后用沸水焯熟，捞出放在大汤碗内，随即放入胡椒面。","炒勺内放入清汤，再加入酱油、花椒绍酒、精盐、味精烧沸，撤净浮沫，倒在赤鳞鱼碗内即成。把醋拌上姜末，放入小碟佐食。"]},{"i":639,"n":"糖醋棒子鱼","r":"鲁菜","o":"中国菜谱·山东","f":"特点此菜色泽金黄，鱼肉外焦里嫩，酸甜味美。因形似玉米，故名。","c":"热菜","m":["炸"],"g":["鱼肉","黄鱼","香菇","火腿","豌豆","面粉","鸡蛋"],"s":["白糖","醋","盐","酱油","葱","姜","蒜","淀粉"],"t":["炒锅"],"v":0,"a":"黄花鱼 \"一条（约重一斤半） 水发冬菇 三分 火腿丁 一钱 十二粒 青豆 白糖 四两 面包末 四两（约耗二两） 醋 两 酱油 二钱 精盐 二分 鸡蛋 葱末 三分 姜末 蒜末 湿淀粉 一钱 花生油 一斤半（约耗二两）","p":["将鱼刮去鳞，剖腹挖出内脏，洗净。再将鱼身两面的肉完整地片下，在鱼肉的里面刹上斜十字花刀（深度为鱼肉的三分之二)。用精盐稍腌(三一一五分钟)。鸡蛋入碗内搅均匀后，抹遍鱼肉，在有刀纹一面沾上面包末。冬菇用开水焯过，切成青豆大小的丁。","炒勺内放入花生油，在中火上烧至七成热，将两片鱼肉放入炸至漂起（似两个玉蜀黍形)、呈金黄色时捞出，每个切成五块，原样放入盘内。","勺内留油六钱，放入葱、姜、蒜末，炸至发出香味时，烹上醋、酱油，加入白糖、水（一两）、冬菇、火腿、青豆烧沸，用湿淀粉（一钱）勾芡，浇到鱼肉上即成。"]},{"i":640,"n":"荷包鲫鱼","r":"鲁菜","o":"中国菜谱·山东","f":"特点此菜颜色红润，鱼肉鲜嫩味美，别有风味。","c":"热菜","m":["烧扒焖"],"g":["鲫鱼","猪肉","冬笋"],"s":["高汤","酱油","白糖","料酒","味精","葱","姜","花椒"],"t":["炒锅"],"v":0,"a":"鲫鱼 二条（约重一斤半） 猪肉 (肥瘦) 四两 水发玉兰片 半两 清汤④ 八两 酱油 *一两 白糖 二钱 绍酒 八钱 味精 四分 葱末 四分 姜末 二分 葱椒泥 一钱 花生油 一斤半（约耗二两） 熟猪油 半斤 葱油 三钱","p":["1。将鲫鱼去鳞（鱼唇下部的硬鳞也要刮掉），挖去两腮，从鱼脊背上开膛，取出内脏，用水洗净；将猪肉、玉兰片均切成二分见方的丁，盛人碗内，加酱油（五钱)、绍酒（一钱）、味精（三分）、葱椒泥、葱末（二分）、姜末（一分）拌匀，入鱼腹内，用竹扦将脊背刀口处别住。","炒勺内下入花生油，在旺火上烧至五成热，下鱼炸约三分钟捞出；在另一炒勺内下人猪油，在中火上烧至八成热，放入白糖、葱末（二分）、姜末（一分)、酱油（半两）、清汤、绍酒（七钱），随即放入炸好的鲫鱼，烧沸后，用微火煨，至汤去一半时，将鱼捞出盛人盘内，然后在汤内放入味精（一分），淋上葱油，浇在鱼上即成。"]},{"i":641,"n":"白汁瓣鱼","r":"鲁菜","o":"中国菜谱·山东","f":"特点此菜整条鱼趴在鱼池内，鱼身两侧竖立对称的鱼卷，浇上洁白的芡汁，形象新颖，鱼肉鲜嫩，肉馅味美，为创新菜之一。","c":"热菜","m":["蒸"],"g":["鱼肉","黄鱼","猪肉","冬笋","火腿","豌豆","鸡蛋"],"s":["葱","姜","盐","料酒","高汤","味精","淀粉","香油"],"t":["炒锅","蒸锅"],"v":0,"a":"鲜黄花鱼 一条（约重二斤） 猪肥瘦肉 三两 冬笋 三钱 火腿 三钱 青豆 十四粒 葱末 三钱 姜末 二钱 精盐 八分 清汤④ 三两 绍酒 二钱 味精 二分 湿淀粉 五钱 鸡蛋清 个 芝麻油 鸡油 一钱","p":["1。将鱼去鳞洗净，在肛门前横拉一刀口，用一双竹筷子，从鱼嘴紧贴腮壳两边插入腹内，将内脏绞出，再用水冲洗于净。在鱼的两面用斜坡刀片进至脊骨（肉不要片下来，厚薄要均匀），每面约七片。再将鱼头下额、胸鳍中间割开（鱼腹不割开），将两腮壳往两边一，用刀在鱼头顶上拍一下，使鱼头趴下。","猪肉剁成肉泥，放入碗内，加葱姜末、鸡蛋清、精盐（四分）、芝麻油搅拌均匀成馅。火腿、冬笋，均切成八分长、一分厚的菱形片。","将肉馅抹在鱼肉片上，逐片向片进方向卷成卷，鱼肚朝下摆入大鱼池（碗）内（每面的鱼卷紧贴在鱼脊骨两旁竖着)，每个鱼卷的顶端按一粒青豆，上笼用旺火蒸十五分钟取出。","把蒸鱼的原汤入炒勺内，加上清汤、绍酒、精盐（四分）、火腿、冬笋烧沸，撇去浮沫，放入味精、湿淀粉勾芡，淋人鸡油，浇在鱼上即成。"]},{"i":642,"n":"糟牡丹鱼","r":"鲁菜","o":"中国菜谱·山东","f":"特点此菜鱼、肉鲜嫩，有浓厚的香糟味。因形似牡丹花，故名。","c":"热菜","m":["炸"],"g":["鱼肉","猪肉","鸡肉","火腿","香菇","豌豆","鸡蛋"],"s":["香糟","花椒","料酒","味精","盐","淀粉","高汤"],"t":["炒锅"],"v":0,"a":"猴子鱼肉（带皮） 六两 鸡脯肉 肥猪肉 一两 熟火腿末 五分 水发冬菇末 五分 鲜青豆末 五分 鸡蛋清 二个 香糟 二钱 花椒绍酒 五钱 味精 二分 精盐 八分 湿淀粉 三钱 清汤 二两 熟猪油 一斤（约耗半两）","p":["将鱼肉切成二寸宽的大长块，从鱼肉的一头坡刀片半分厚的片（划至鱼皮，皮不可断），接着第二坡刀仍按第一刀的片法，将鱼皮割断（如图1），把两片展开形如“蝴蝶翅”。如此办法，共片十二个。","鸡脯肉在清水中浸泡二十分钟取出，拍松，用刀背砸一遍，剔去白筋砸成细泥，放入碗内，加鸡蛋清（一个)、精盐（四分）、湿淀粉（一钱）搅匀。肥猪肉剁成细泥与冬菇末、火腿末、青豆末均放入鸡肉泥碗内，搅匀成馅。","将片好的鱼肉片平铺在板上（有皮的面朝上），馅分十二份，分别抹在鱼肉片上（如图2），将馅包住成荷包状（如图3），从荷包中间用牙签别起，成“牡丹花”状（如图4）。在另一个碗内，放入鸡蛋清（一个）、湿鱼皮淀粉（一钱）、精盐（二分）调匀，均匀地抹在“牡丹鱼”上面开口处。","香糟用清水二两调匀，出汁（渣不用），加味精、精盐（二分）、湿淀粉（一钱）调匀成香糟汁。","炒勺内放入猪油，在旺火上烧至三成热时，移至微火上，将“牡丹鱼”逐个放入油内炸。用手铲不停地徐徐翻动，约炸三分钟，捞出。轻轻地抽去牙签，重投入油内炸半分钟捞出，整齐地摆在盘内。炒勺内放入油二两烧热，加入葱、姜、蒜末炸出香味，随即烹人香糟汁、花椒绍酒、清汤，浇到“牡丹鱼”上即成。"]},{"i":643,"n":"炸椿鱼","r":"鲁菜","o":"中国菜谱·山东","f":"特点此菜鱼肉鲜嫩而有香椿味，外皮酥脆，为春季时令菜肴。","c":"热菜","m":["炸"],"g":["鱼肉","黄鱼","猪肉","鸡蛋","面粉"],"s":["淀粉","料酒","盐"],"t":["炒锅"],"v":0,"a":"黄鱼肉 四两 香椿芽 一两 鸡蛋清 二个 面粉 五钱 湿淀粉 二两 绍酒 一钱 精盐 三分 花生油 一斤半（约耗二两）","p":["将黄鱼肉片成二寸长、一寸二宽、一分厚的片，放在碗内加入绍酒、精盐，用手抓匀。将香椿芽摘洗干净。每片鱼肉中放入香椿芽两枝，卷成卷。蛋清与湿淀粉、面粉搅拌成稀糊。","炒勺内放入熟花生油，在中火上烧至六成热时，将鱼卷逐个蘸匀蛋糊，放入油内，在中火上炸成浅黄色捞出，摆入盘内即成。"]},{"i":644,"n":"干烂鱼片","r":"鲁菜","o":"中国菜谱·山东","f":"特点此菜颜色金黄，鱼肉鲜美，味香。","c":"热菜","m":["爆炒"],"g":["鱼肉","猪肉"],"s":["葱","花椒","料酒","味精","淀粉","酱油","盐"],"t":["炒锅"],"v":0,"a":"猴子鱼肉 半斤 葱椒绍酒③ 一两 味精 二分 湿淀粉 四钱 酱油 五钱 精盐 五分 熟猪油 一斤半（约耗一两半）","p":["将鱼肉切成三寸长的块，再横片成八分宽、一分厚的片，放入碗内，加酱油(三钱)、葱椒绍酒（二钱)、精盐、湿淀粉拌匀。在另一个碗内加酱油（二钱)、葱椒绍酒（八钱）、味精调成汁。","炒勺内下入猪油，在旺火上烧至六成热，将拌好的鱼片，用手铲逐片地拨入勺内，不断翻动（以免沾在一起），炸至鱼片浮起，呈金黄色时，去油，将炒勺移至微火上，烹人对好的汁，颠翻两次，盛入盘内即成。"]},{"i":645,"n":"抓炒鱼条（做法二）","r":"鲁菜","o":"中国菜谱·山东","f":"特点此菜鱼条呈金黄色，外面挂有粘汁，人口香脆，具有酸、甜、咸味。","c":"热菜","m":["爆炒"],"g":["鱼肉","猪肉","鸡蛋"],"s":["淀粉","白糖","高汤","酱油","葱","姜"],"t":["炒锅"],"v":0,"a":"盤鱼肉 六两 鸡蛋清 个 湿淀粉 一两二钱 白糖 六钱 鸡汤 酱油 四钱 六钱 葱末 四分 姜末 二分 熟猪油 一斤（约耗二两）","p":["将鱼肉去皮洗净，切成宽三分、长一寸三分的条，放入碗内，加湿淀粉(八钱)、酱油(一钱五)、鸡蛋清抓匀。将白糖、醋、鸡汤、酱油（二钱五）、湿淀粉调匀成汁。","炒勺内下人猪油，在旺火上烧至七成热，把鱼肉条放入勺内，炸至深黄色时捞出，沥去油。","炒勺内留油少许，放入葱、姜末稍妙，随即将已调匀的汁倒人勺内，烧至汤汁发稠后，将炸好的鱼条放入，颠勺使鱼条沾匀稠汁，出勺即成。"]},{"i":646,"n":"煎白条鱼饼*","r":"鲁菜·胶东","o":"中国菜谱·山东","f":"特点此菜表皮酥黄，鱼肉特别鲜嫩。为胶东地区风味菜。","c":"热菜","m":["煎塌"],"g":["鱼肉","鸡蛋","面粉","猪肉"],"s":["盐","葱","姜"],"t":["炒锅"],"v":0,"a":"鲜白条鱼 半斤 鸡蛋 二个 面粉 五钱 精盐 葱末 三分 姜末 ★白条鱼俗称面条鱼，产于胶东半岛近海一带，石岛附近所产尤好。春 分后上市。此鱼肉透明，有浅红、白色两种。大者长三寸，白色腹大有籽。 熟猪油 一两半","p":["将鲜白条鱼用清水洗净，加盐（五分）渍好；鸡蛋人碗内打散，加入面粉、精盐（五分）、葱末、姜末搅匀成糊。把鱼再倒人蛋糊内搅拌均匀。","炒勺内放入猪油，在中火上烧至五成热时，将搅好的白条鱼放入，用手勺摊平成三分厚的圆饼。此时不断转动炒勺，使其受热均匀，微火煎至底面金黄色时，颠勺使饼翻过来再煎，约煎三分钟（仍不断转动炒勺）即熟，取出放在砧板上，切成一寸大的棱形块，原样摆入盘内即成。"]},{"i":647,"n":"木白条鱼汤","r":"鲁菜","o":"中国菜谱·山东","f":"特点此菜鱼呈银白色，味清香，鱼肉极为鲜嫩，为石岛传统风味菜肴。","c":"汤羹","m":["烩汆"],"g":["鱼肉","鸡蛋","木耳"],"s":["高汤","味精","料酒","酱油","盐"],"t":["炒锅"],"v":0,"a":"鲜白条鱼 三两 鸡蛋 水发木耳 二钱 清汤④ 一斤 味精 二分 绍酒 酱油 五分 精盐 五分","p":["将白条鱼用清水洗净，放入沸水烫过捞出。鸡蛋人碗内，用筷子搅匀。","汤勺内放入清汤，在旺火上烧至八成热，加入白条鱼、木耳、绍酒、精盐、酱油烧沸，撒去浮沫，把鸡蛋浇人勺内，使其飘浮，再放入味精，盛入汤碗内即成。"]},{"i":648,"n":"炒八带鱼*","r":"鲁菜","o":"中国菜谱·山东","f":"特点此菜红绿相间，色泽美观，配以韭青，味道鲜美，为春季适令传统菜。","c":"热菜","m":["爆炒"],"g":["鱼肉","猪肚","猪肉"],"s":["高汤","盐","料酒","葱","姜","味精","香油"],"t":["炒锅"],"v":0,"a":"鲜八带鱼 半斤 韭青 二两 清汤④ 五钱 精盐 五分 绍酒 五分 三分 葱丝 姜丝 三分 味精 二分 熟猪油 一两 八带鱼属于软体动物，有八根长爪，肚白色，椭圈形。嘴和眼里均是 沙子，吃时须挤出。肉嫩无骨刺，凉性大，所以吃时要加姜。 芝麻油 钱","p":["将鱼肚上的小口翻开，掏出黑色；把嘴和眼里的沙子挤去。放在清水中搓洗干净后，先劈成四半，再切成一寸长的块，用沸水焯过.（时间不要太长），捞出沥干水。把韭青洗净，切成一寸长的段。","炒勺放在旺火上，下猪油烧到七成热，放入葱、姜丝和鱼块煸炒；再加入清汤、精盐、绍酒、味精和韭青，快炒一下，淋上芝麻油，颠翻炒勺即成。"]},{"i":649,"n":"醋大虾","r":"鲁菜","o":"中国菜谱·山东","f":"特点此菜色泽桔红，虾肉鲜嫩，有甜、酸、咸三味。八O、红烧大虾原料大对虾..四对白糖…….一两半鸡汤….三两醋…..一钱酱","c":"热菜","m":["炸"],"g":["虾","鸡蛋","面粉"],"s":["醋","白糖","淀粉","料酒","盐","葱","高汤","姜","蒜"],"t":["炒锅"],"v":0,"a":"鲜大对虾 鸡蛋清 白糖 两 面粉 钱 湿淀粉 两五钱 绍酒 三钱 醋 精盐 三分 鸡汤 二两 葱末 三分 姜末 二分 蒜末 三分 花生油 斤（约耗二两）","p":["将虾去皮、腿、头，从脊背上划开，去掉虾肠，用刀片成片，加精盐、蛋清、湿淀粉（一两）、面粉拌匀。","炒勺内倒入花生油，在中火上烧至六成热时，把虾逐片放入油内，炸成金黄色捞出。将鸡汤、白糖、醋、绍酒、湿淀粉（五钱）放入碗内对成汁，待用。","炒勺内留油一两，放入葱、姜、蒜末炸出香味，倒人对好的汁烧沸。将炸好的虾放入勺内，颠翻几下，倒入盘内即成。"]},{"i":650,"n":"盐水虾","r":"鲁菜","o":"中国菜谱·山东","f":"特点此菜虾色红中透白，肉鲜嫩可口。","c":"凉菜","m":["烧扒焖"],"g":["虾"],"s":["盐","葱","姜","料酒","花椒"],"t":["炒锅"],"v":0,"a":"小黄虾 斤 一两 大葱 姜 五钱 精盐 二两 绍酒 五钱 花椒","p":["将虾洗净，葱切大段，姜拍松。","勺内加入清水一斤五两，加上葱、姜、花椒、精盐在中火上烧沸，再加上虾约煮五分钟（已熟），将虾、原汤和绍酒都倒人盆内浸泡十分钟，把虾取出，摆入盘内即成。"]},{"i":651,"n":"虾段","r":"鲁菜","o":"中国菜谱·山东","f":"特点此菜色泽红亮，虾肉鲜嫩，甜咸口味，作冷拼盘最佳。","c":"热菜","m":["爆炒"],"g":["虾","生菜"],"s":["葱","姜","白糖","盐","味精","高汤","料酒","香油"],"t":["炒锅"],"v":0,"a":"大对虾 (带皮) 葱片 二钱 钱 姜片 白糖 二两 精盐 二分 生菜@ 一两 熟猪油 一两 鸡汤 半斤 味精 二分 绍酒 一钱 芝麻油 二钱","p":["把带皮的对虾洗净，去掉须、眼、腿、额剑，用竹扦把虾头内的“沙包”挑出，再去掉脊部的虾肠，然后切成一寸二分长的段。","把猪油放入炒勺内，烧至六成热时，放入葱、姜稍炸，即把虾段投入炒勺内，连炸带妙，煸至虾变红色，加入鸡汤、白糖、绍酒、精盐、味精拌匀，盖上锅盖用小火至汤汁将干时，取出葱、姜片，把虾段倒入盘的一边，再把芝麻油淋在虾上。","生菜消毒后，洗净，切成五分宽、一寸长的段，放在盘内虾段的一边即成。"]},{"i":652,"n":"芝麻虾排","r":"鲁菜","o":"中国菜谱·山东","f":"特点此菜色泽金黄，虾肉鲜嫩，吃时有芝麻香味。","c":"热菜","m":["炸"],"g":["芝麻","虾","面粉","鸡蛋"],"s":["淀粉","料酒","味精","盐","葱","姜"],"t":["炒锅"],"v":0,"a":"大虾 芝麻仁 两 面粉 五钱 鸡蛋 湿淀粉 一两半 绍酒 一钱 味精 分 精盐 二分 葱末 五分 姜末 三分 花生油 二斤（约耗一两）","p":["将大虾剥去皮（留尾皮)，洗净。用刀从脊部一片两开（胸部不能断），抽去虾肠子；再用刀尖在虾肉上略戳几个小口，轻轻地将虾肉拍两下（以免炸时卷起），放在盘内加味精、绍酒、精盐、葱姜末腌渍。","把鸡蛋入碗内，用筷子搅打均匀，加湿淀粉调成糊，然后将大虾逐片蘸上一层薄干面粉，挂上鸡蛋糊后再均匀地蘸上一层芝麻仁。","炒勺内放入花生油，在中火上烧至五成热时，将蘸满芝麻仁的虾排下入油内炸，至两面金黄色捞出，沥净油。用刀把每片虾排切成三段，原样摆在盘内即成。"]},{"i":653,"n":"干烂虾仁","r":"鲁菜","o":"中国菜谱·山东","f":"特点此菜虾肉鲜嫩，滋味醇香，外焦里嫩，别具风味。","c":"热菜","m":["炸"],"g":["虾","鸡蛋"],"s":["淀粉","酱油","料酒","葱","姜","盐"],"t":["炒锅"],"v":0,"a":"活虾 二斤 鸡蛋清 湿淀粉 四钱 酱油 四钱 绍酒 三钱 葱末 三分 姜末 二分 精盐 熟猪油 一斤五两（约耗二两）","p":["把活虾去皮洗净，加蛋清、湿淀粉、精盐拌匀，稍腌。","炒勺内放入猪油，在中火上烧至八成热，将虾仁倒入勺内，用铁筷子迅速拨开，炸至皮面呈淡红色，熟后捞出。","炒勺内留油一两，烧至六成热，放入葱、姜末炸出香味。将炸好的虾仁倒入，再烹人酱油、绍酒，将勺颠翻一下即成。"]},{"i":654,"n":"炒虾片","r":"鲁菜","o":"中国菜谱·山东","f":"特点此菜色泽绚丽，鲜嫩适口。","c":"热菜","m":["爆炒"],"g":["虾","鸡蛋","香菇","冬笋","豌豆"],"s":["淀粉","葱","姜","味精","盐","高汤","香油"],"t":["炒锅"],"v":0,"a":"大虾 四个（约重八两） 鸡蛋清 半个 湿淀粉 三钱 水发冬菇 三钱 笋片 三钱 青豆 十粒 葱 二钱 姜 二钱 味精 分 高汤 两 精盐 三分 芝麻油 花生油 二斤（约耗一两五钱）","p":["将虾去头、皮，洗净。从虾脊部片开，去掉虾肠子，片成二分厚的片，放入碗内加上蛋清抓匀，再加上湿淀粉一钱抓匀。将冬菇洗净泥沙，去掉根，切成片。葱切段，姜切小片。碗内加高汤、味精、精盐、湿淀粉对成汁。","勺内加花生油，在中火上烧至五成热时，加入虾片，划开倒出。勺内留油一两，放入葱、姜炸出香味，加上冬菇、笋片、青豆煸炒一下，再加上虾片在旺火上颠翻勺，随即倒人碗内对好的汁，快速搅炒颠翻勺，淋上芝麻油，盛入盘内即成。"]},{"i":655,"n":"蕃茄虾片","r":"鲁菜","o":"中国菜谱·山东","f":"特点此菜色泽红润，虾肉软嫩，甜酸适口，带有浓厚的蕃茄味。","c":"热菜","m":["爆炒"],"g":["虾","香菇","豌豆"],"s":["白糖","高汤","葱","盐","醋","味精","淀粉"],"t":["炒锅"],"v":0,"a":"鲜大虾 半斤 蕃茄酱 一两 冬菇 一钱 青豆 十粒 白糖 一两 鸡汤 三两 圆葱 半两 精盐 四分 醋 二钱 味精 二分 湿淀粉 七钱 花生油 一斤（约耗二两）","p":["将大虾剥去头、皮，剔去虾背中的虾肠子，洗净；斜刀片成二分厚的片。再将圆葱、冬菇切成二分见方的丁，待用。","碗内放入大虾片，加湿淀粉（二钱)、精盐(二分)，用手抓匀。炒勺内倒入花生油，在中火上烧至七成热，将虾片放入油内，划开捞出，放在盘内。","将白糖、鸡汤、醋、味精、盐（二分）、湿淀粉（五钱）放在碗内对成芡汁。炒勺内放花生油（六钱），在微火上烧至六成热，放入圆葱、冬菇、青豆稍妙，加入蕃茄酱煮熟，随即倒入调好的芡汁，用手勺搅动炒浓，迅速浇在盘内虾片上面即成。"]},{"i":656,"n":"炸虾串","r":"鲁菜","o":"中国菜谱·山东","f":"特点此菜红、白、绿相间，色泽美观，虾串酥脆鲜嫩，吃时蘸以辣酱油或花椒盐均可。","c":"热菜","m":["炸"],"g":["虾","火腿","菠菜","猪肉","面粉"],"s":["料酒","味精","淀粉","盐"],"t":["炒锅"],"v":0,"a":"鲜大河虾 四十个(约重一斤） 火腿 六钱 四十个（约重二两） 菠菜嫩叶 熟肥肉 一两 小竹扦 二十根 绍酒 二钱 味精 二分 面粉 两半 湿淀粉 二钱 精盐 二分 二斤（耗一两半） 熟猪油","p":["将虾剥去皮洗净，用绍酒、精盐、味精腌渍十分钟。火腿、肥肉均切成一分厚、三分见方的片。","用竹扦先穿-个虾仁，接着穿一个菠菜叶，再穿一片火腿、一片肥肉。如此次序，共穿二十串，每串均沾上一层薄面粉。另将蛋清放入碗内打成泡沫状，再放湿淀粉、面粉调匀成蛋泡糊。","炒勺内放入熟猪油二斤，在中火上烧至五成热时，将虾串沾上糊下勺，炸至七成熟捞出。抽去竹扦，此时把油移在旺火上烧至八成热，将虾串放入油内炸至呈淡黄色捞出，摆入盘内即成。"]},{"i":657,"n":"蟹黄","r":"鲁菜","o":"中国菜谱·山东","f":"特点此菜蟹黄色红，蟹肉皎白，色彩艳丽，滋味鲜美，清淡香醇，营养丰富。","c":"热菜","m":["烧扒焖"],"g":["螃蟹"],"s":["淀粉","葱","姜","酱油","料酒","高汤","盐","味精"],"t":["炒锅","蒸锅"],"v":0,"a":"螃蟹 斤 114° 湿淀粉 五钱 葱末 五分 姜末 五分 二钱 酱油 绍酒 二钱 清汤① 四两 精盐 三分 味精 二分 花生油 二两","p":["将螃蟹洗净，上笼蒸熟（约十分钟），揭开蟹盖，用竹扦剔出蟹黄、蟹肉（注意不要剔得太碎）。碗内加清汤、绍酒、精盐、酱油、味精搅匀对成汁。","炒勺内倒入花生油，用旺火烧至八成热，放入葱姜炸出香味，把蟹黄肉倒人，随手将勺颠翻一下，立即倒人对好的汁，烧沸约二分钟后，用漏勺把漂浮在汤面上的蟹黄肉捞出，汤用湿淀粉勾芡，先倒人盘内，再把蟹黄蟹肉倒人汤盘中即成。"]},{"i":658,"n":"清腌醉蟹","r":"鲁菜","o":"中国菜谱·山东","f":"特点此菜宜于下酒，味极鲜美。可在中秋后大量制作，存放坛内，来年春天食用，滋味更美。","c":"热菜","m":[],"g":["螃蟹"],"s":["花椒","料酒","酱油","葱","姜","白糖"],"t":["炒锅"],"v":0,"a":"活河蟹 一斤二两（约六个） 花椒 六粒 绍酒 两 白酒 二钱 酱油 两 葱丝 五分 姜丝 五分 白糖 二钱","p":["将蟹用水洗净，揭起腹脐，用小刀将蟹扎死，在刀口处放入一粒花椒，放入盆内。","碗内放入绍酒、白酒、酱油、葱、姜丝、白糖对成汁，倒人盛蟹的盆内，腌四至五小时。","揭去蟹盖，撕去蟹寒、须边，从每个蟹的中间切成四块，原样放入盘内，把蟹盖扣在上面即成。"]},{"i":659,"n":"扒原壳鲍鱼（做法三）","r":"鲁菜","o":"中国菜谱·山东","f":"特点此菜鲍鱼质地鲜嫩，汤汁白亮，味道鲜美。","c":"热菜","m":["烧扒焖"],"g":["鲍鱼","猪肉","偏口鱼","火腿","冬笋","豌豆","鸡蛋"],"s":["盐","料酒","高汤","味精","淀粉","葱","姜"],"t":["炒锅","蒸锅"],"v":0,"a":"带壳鲜鲍鱼 十二个（约出肉六两） 偏口鱼肉 四两 火腿 五钱 冬笋 五钱 熟青豆 二十四粒 精盐 五分 清汤④ 斤 绍酒 *三钱 三分 味精 鸡蛋清 二个 湿淀粉 二两 鸡油 半两 葱姜末 各三分","p":["将带壳鲍鱼洗净，放入沸水内稍煮，把肉挖出，洗净杂质，片成半分厚的片；火腿、冬笋切成一寸长、四分宽、半分厚的片；偏口鱼肉剞成细泥，放入碗内，加入湿淀粉（五钱）、绍酒（一钱）、精盐（二分）、蛋清、葱姜末搅匀，倒在大盘内摊平（不要摊得太靠盘边）。","鲍鱼壳放在含碱量百分之五的水中，用毛刷刷洗干净，再经开水煮过，捞出净水。鲍鱼壳口朝上，整齐地摆在鱼泥上（要按牢），上笼约蒸五分钟取出。","炒勺内放入清汤、精盐（三分）、绍酒（二钱）、鲍鱼、冬笋、火腿，烧沸撇去浮沫，即用漏勺捞出，平均分放在鲍鱼壳内；勺内的汤，用湿淀粉勾芡，撒上青豆，放入味精，淋上鸡油，浇在鲍鱼上面即成。"]},{"i":660,"n":"蚝油鲍鱼","r":"鲁菜","o":"中国菜谱·山东","f":"特点此菜呈淡红色，鲍鱼肉鲜嫩，蚝油香味美，系海产名菜。一OO、炸蛎黄原料海蛎黄精盐五分118*面粉..三两（耗一两半）花","c":"热菜","m":["爆炒"],"g":["鲍鱼","猪肉"],"s":["蚝油","高汤","料酒","酱油","淀粉"],"t":["炒锅"],"v":0,"a":"鲜鲍鱼肉 五两 蚝油 二钱 鸡汤 五两 绍酒 一钱 酱油 五钱 湿淀粉 五钱","p":["将鲍鱼肉洗净，切成约一寸二长、七分宽、半分厚的片，用沸水烫一下（不宜烫老），马上捞出，沥干水分。","炒勺内放入鸡汤、酱油，在中火上烧沸，撇去浮沫，加入绍酒，用湿淀粉勾芡，随即放入鲍鱼、蚝油搅匀，出勺即成。"]},{"i":661,"n":"盐水鸡","r":"鲁菜","o":"中国菜谱·山东","f":"特点此菜鸡肉清香，烂而不腻，汤冻透明味鲜，常用于冷拼盘。","c":"凉菜","m":["蒸"],"g":["鸡肉","猪肉"],"s":["盐","葱","姜","高汤","花椒"],"t":["炒锅","蒸锅"],"v":0,"a":"宰好的鸡 一只（约二斤） 精盐 三钱 葱段 一两 姜片 五钱 清汤 二斤 花椒 五分 猪肉皮 五两","p":["宰好的鸡洗净，放入锅内，加水（水须漫过鸡）用旺火烧沸，撇去浮沫，再移到中火上煮，至五成熟时捞出，将鸡劈为两片。将生猪肉皮刮洗净，放入沸水锅内煮五分钟，捞出切成一分宽的细长条。","将鸡、肉皮、清汤、精盐、葱姜、花椒均放入小瓷盆内，再上笼蒸两小时后取出，捞出葱姜、花椒、肉皮不用，撇去汤面上的浮油、浮沫，晾凉（夏季须在冰箱内冰透）。将鸡切成三分宽的长条块与汤冻一一起装入盘内即成。"]},{"i":662,"n":"扒雏鸡","r":"鲁菜","o":"中国菜谱·山东","f":"特点此菜鸡肉嫩烂，味道香郁，肉与汤汁红润，缀以白色桃仁、绿色青豆，形色美观。","c":"热菜","m":["烧扒焖"],"g":["鸡肉","核桃仁","豌豆"],"s":["酱油","高汤","白糖","花椒","葱","姜","盐","淀粉"],"t":["炒锅","蒸锅"],"v":0,"a":"宰好的雏鸡 三只（约重二斤） 鲜核桃仁 二钱 熟青豆 三钱 酱油 一两半 清汤④ 一斤 白糖 三钱 鲜花椒 一枝 葱 姜 一钱 精盐 三钱 湿淀粉 三钱 花生油 三斤（约耗二两） 熟猪油 一两 葱油 二钱","p":["将鸡由尾部至脖子从脊背中间劈开，用手往两边开，剔去大骨，剁去嘴、爪、翅尖，把酱油（一两）抹在鸡肉上。","锅内放入花生油，旺火烧至八成热，将鸡人油炸至六成熟（呈淡红色）时捞出。","炒勺内放入熟猪油，在中火上烧至六成热时，放入白糖炒至呈红色，加清汤、葱（切段）、姜（切片）、酱油、精盐烧沸，撇去浮沫。将鸡（皮面朝下）放入汤勺内，盖上盘子，移至微火上至汤剩三分之二（鸡已九成熟）捞出，放在砧板上，把其余骨剔净（注意鸡皮保持完整），大块肉用手撕开，放在大汤碗内（鸡皮朝下），将鸡脖、骨头剁成寸段放在鸡肉上，倒人煮鸡的原汤，上笼蒸二十分钟取出，扣在盘内。把汤在炒勺内，湿淀粉勾芡烧沸，淋上葱油，·浇在鸡上，鲜花椒（用沸水烫过）摆在鸡的中间，撒上鲜核桃仁、青豆即成。"]},{"i":663,"n":"烤小雏鸡","r":"鲁菜·胶东","o":"中国菜谱·山东","f":"特点此菜色泽金黄，肉嫩鲜香。以生菜佐食，别有风味。为青岛“三烤”菜肴之一。","c":"热菜","m":["烤"],"g":["鸡肉","生菜"],"s":["葱","姜","料酒","酱油","花椒","高汤"],"t":["烤箱"],"v":0,"a":"只(约重一斤) 宰好的雏鸡 葱 五钱 姜 五钱 绍酒 五钱 酱油 \"两半 花椒 二十粒 生菜 一两 清汤④ 六两 葱油","p":["将鸡从脊部入刀一劈两片；把生菜消毒洗净，切成宽五分、长二寸的条，放入小盘内；葱切大段、姜拍扁。","将鸡装入烤盘内，加上葱、姜、绍酒、花椒、清汤；把酱油浇在鸡身上，再加上大葱油。","将装鸡的烤盘，装入烤炉内，旺火烤十分钟左右，至鸡呈金黄色取出。把鸡剁成宽四分、长一寸的条块，摆入盘内成整鸡形，浇上烤鸡的原汤即成。食时外带生菜。"]},{"i":664,"n":"油烹雏鸡","r":"鲁菜","o":"中国菜谱·山东","f":"特点此菜皮酥肉烂，味鲜香。","c":"热菜","m":["炸"],"g":["鸡肉"],"s":["葱","花椒","料酒","酱油","姜"],"t":["炒锅"],"v":0,"a":"宰好的雏鸡 一只(约重一斤) 小茴香粒 五个 葱椒绍酒 一两 酱油 一两二钱 姜汁 一钱 辣酱油 二钱 花椒面 一分 花生油 二斤（约耗一两半）","p":["将宰好的鸡洗净，摘去毛根，用刀从脊背自脖颈至后尾劈为两片，用手开，剔去筋骨，靠近鸡头处剁断鸡颈，但颈外皮不要割断。用刀背砸断鸡翅大转弯处，剁去鸡爪、嘴、眼。在鸡大腿内侧和小腿外皮开一刀口，把小腿骨砸断抽出（大腿骨与小腿骨之间的关节保留），再将大腿骨下关节处砸断，在刀口处抽出大腿骨。把脊骨剞成两段。","将鸡放入碗内，加酱油、葱椒绍酒、姜汁、小茴香（用刀拍碎）均匀撒在鸡肉上，腌二十分钟，取出干水分。","炒勺内放入花生油，在旺火上烧至八成热，把雏鸡放入油内（油温须保持八成热），炸至八成熟（呈淡红色）时捞出。待油温至九成热时，再将雏鸡放入油内炸至呈枣红色（鸡在油内已炸不出响声）取出，剞成一寸二长、七分宽的块，原样摆入盘内。","把腌鸡的余汁倒人勺内，在旺火上一烹，随即倒在鸡上即成。辣酱油和花椒面分别放入小碟上桌，供蘸食。"]},{"i":665,"n":"黄焖鸡","r":"鲁菜","o":"中国菜谱·山东","f":"特点此菜汁红润发亮，鸡肉酥烂香浓。一二O、柴把鸡原料一只（约重一斤半）宰好的肥母鸡·水发玉兰片….三两水发冬菇三两熟火腿","c":"热菜","m":["烧扒焖"],"g":["鸡肉"],"s":["甜面酱","葱","姜","酱油","高汤","花椒","八角","料酒","盐","淀粉"],"t":["炒锅","蒸锅"],"v":0,"a":"宰好的雏鸡 一只（约重一斤） 甜面酱 \"六钱 葱片 五钱 姜片 酱油 五钱 清汤④ 八两 花椒 八角 三分 绍酒 *五钱 精盐 四分 湿淀粉 六钱 花生油 斤半（约耗一两） 花椒油 一钱","p":["将宰好的鸡洗净，从脊骨中间劈为两片，刹去嘴尖与爪，用甜面酱（三钱）浸渍，再用湿淀粉（三钱）沾匀。","炒勺内放入花生油，在中火上烧至六成热时，将鸡人油炸一分钟，至鸡皮呈黄色捞出。炒勺放入油（三钱），加进葱、姜、花椒、八角，炸出香味后，加入甜面酱略炒，再放酱油（二钱）、清汤、精盐，然后将鸡块放入锅内，烧开后撇去浮沫，移至微火上，加盖煨炖十分钟，至汤去一半时捞出。抽去脊椎、大腿骨，肉皮面朝下，放在砧板上，剁为三分宽的长方块，原样摆入盘内，再将炖鸡的余汤倒上，放入笼内用旺火蒸二十分钟取出。原汤出，鸡肉扣人盘内。","将蒸鸡的原汤倒人炒勺，加入酱油（三钱)、绍酒烧沸，撇去浮沫，用湿淀粉勾芡，淋上花椒油，浇在鸡上即成。"]},{"i":666,"n":"苹果鸡","r":"鲁菜","o":"中国菜谱·山东","f":"特点此菜表面色白光亮，鸡肉鲜嫩，并有浓郁的苹果香味。","c":"热菜","m":["蒸"],"g":["鸡肉","猪肉","火腿","口蘑"],"s":["葱","姜","高汤","白糖","酱油","盐","花椒","料酒","味精","淀粉"],"t":["炒锅","蒸锅"],"v":0,"a":"苹果* 五个（约重二斤半） 雏鸡肉（去皮去骨） 一斤 熟瘦火腿 五钱 水发口蘑 五钱 二钱 葱 山东苹果的品种很多，制莱宜选用大国光、青香蕉等。其果肉脆嫩，吃 后嘴内无渣，作菜遇热时，又能保持柔韧性。 姜 三分 清汤④ 半斤 白糖 一钱 酱油 二钱 精盐 三分 葱椒绍酒 五钱 味精 三分 湿淀粉 三钱 葱油③ 一两","p":["将鸡肉洗净，在鸡肉上面每隔一分宽剞成斜十字交叉状的刀纹，深为鸡肉的二分之一，然后再切成三分见方的小块；口蘑片成薄片；火腿切成二分见方的丁；葱姜切丝。把鸡肉、口蘑、火腿、葱、姜、葱椒绍酒（三钱)、葱油（五钱）、酱油、白糖放入碗内拌匀成馅。","将苹果洗净削去皮，用小刀在苹果梗处拉一个八分见方的口，并取下作盖。再从方口处挖出苹果核，成一空罐形（苹果壁厚为四分），放入沸水稍烫捞出。把拌好的鸡肉馅填人苹果内，盖上苹果盖，逐个放入粗瓷碗内，上笼用旺火蒸熟（约半小时），取出净原汤，把苹果放入汤碗内。","炒勺内放入清汤、精盐、葱椒绍酒（二钱）烧沸，用湿淀粉勾芡，加上味精，淋人葱油，浇在苹果上即成。"]},{"i":667,"n":"鸡丝蓝","r":"鲁菜","o":"中国菜谱·山东","f":"特点此菜鸡肉鲜嫩，味清淡，最宜冷吃。","c":"热菜","m":["爆炒"],"g":["鸡肉","猪肉","鸡蛋"],"s":["姜","淀粉","高汤","料酒","盐","香油"],"t":["炒锅"],"v":0,"a":"鸡脯肉 一两半 酱苯蓝 二两 韭黄 二两 姜 二分 鸡蛋清 半个 湿淀粉 二钱 奶汤 一两 绍酒 三钱 精盐 五分 芝麻油 半斤（约耗八钱）","p":["将鸡脯肉片成半分厚的片，再切成二寸长、半分粗的细丝，放在碗内，与蛋清、湿淀粉、精盐（三分）拌匀渍好。姜切成细丝。韭黄择洗干净，切成一寸半长的段，沸水焯过。酱蓝切成-寸半长、半分粗的细丝，用凉水浸泡十·147。分钟，另换清水洗净咸味捞出，攘干水分。","炒勺内放入芝麻油，在中火上烧至五成热时，将鸡丝入油划熟。取出待用。","炒勺内留油（七钱），在旺火上烧至六成热时，放入姜丝、苯蓝丝、绍酒、精盐、奶汤煸炒约二分钟，盛入盘内，加韭黄、鸡丝拌匀即成。"]},{"i":668,"n":"鸡丝拉皮","r":"鲁菜","o":"中国菜谱·山东","f":"特点此菜鸡肉嫩，粉皮透明发亮，清爽可口，为夏季凉菜。","c":"凉菜","m":[],"g":["鸡肉","粉丝粉皮","猪肉","鸡蛋","木耳","芹菜"],"s":["淀粉","盐","酱油","香油"],"t":["炒锅"],"v":0,"a":"鸡脯肉 二两 绿豆干淀粉 三两 鸡蛋清 个 水发木耳 三钱 芹菜 酱油 两 精盐 一分 八钱 芝麻油 三钱","p":["将鸡脯肉切成一寸半长、半分粗的丝，放入碗内，加入精盐、蛋清、干淀粉（二钱）拌匀，再放入沸水锅内焯五至六秒钟，捞至冷开水内凉透，用漏勺捞出，沥干水分；·148*芹菜洗净，切成一寸长的段，沸水焯过；木耳也用沸水焯过。","于淀粉放入碗内，加清水五两搅成稀糊，倒入“旋子”★内。将旋子放入大锅沸水面上，即用手扭转，使旋子在水平面上旋转。由于离心力的作用，淀粉糊均匀地摊开。将旋子连续扭转三次，淀粉糊渐热，形成厚薄均匀的“粉皮”，再将旋子一歪，让热水流进，稍烫，然后把旋子放入冷水中冷透，揭下粉皮，沥干水分，切成长一寸半、宽三分的长条，与芹菜同时装入盘内。","将鸡肉丝装入盘内的粉皮上，木耳撒到鸡丝上，再将酱油、芝麻油、醋倒人即成。"]},{"i":669,"n":"什锦鸡托","r":"鲁菜","o":"中国菜谱·山东","f":"特点此菜鸡托色金黄，皮香脆，肉嫩，配以海参、冬笋、青豆、冬菇，色泽鲜艳，汁浓，味醇。","c":"热菜","m":["炸"],"g":["鸡肉","猪肉","猪腰","面粉","海参","香菇","冬笋","豌豆","鸡蛋"],"s":["葱","姜","盐","料酒","淀粉","味精","高汤"],"t":["炒锅"],"v":0,"a":"鸡脯肉 三两 猪肥肉腰 两 面包 三两 水发海参 五钱 水发冬菇 五钱 冬笋 五钱 青豆 十粒 尊荠 五钱 鸡蛋清 一个 葱末 四分 姜末 二分 精盐 三分 绍酒 三钱 湿淀粉 三钱 味精 鸡汤 三两 花生油 一斤(约耗二两）","p":["将鸡肉剔净脂皮、白筋，与肥肉膘剁成泥；荸荠洗净去皮，切成细末；海参、冬笋、冬菇均切成三分见方的丁；面包剥去皮，切成长三寸、宽二寸、厚二分的大片（共三片）。碗内放入鸡肉泥、荸荠末、葱末（二分）、姜末（一分）、精盐（二分）和鸡蛋清搅匀成馅，摊在面包片上（馅厚二分）即为“鸡托”。","炒勺内放入花生油，在中火上烧至七成热时，将“鸡托”人油炸熟（两面呈金黄色）捞出，放在案板上，切成二寸长、三分宽的条，摆入盘内呈马鞍形。","炒勺内放入花生油，用中火烧至六成热时，放入葱末（二分）、姜末（一分），炸出香味，放入海参．冬菇、冬笋、青豆、精盐、绍酒、鸡汤，待沸起后，用湿淀粉勾芡，加入味精，浇在鸡托上即成。"]},{"i":670,"n":"炸面包鸡块","r":"鲁菜","o":"中国菜谱·山东","f":"特点此菜色泽金黄，外焦里嫩，蘸以花椒面佐食，味更香。一三O、锅贴鸡签原料鸡脯肉….五两猪肥肉腰..二两菠菜叶·…··十二","c":"热菜","m":["炸"],"g":["面粉","鸡肉","猪肉","鸡蛋"],"s":["花椒","盐","料酒","酱油"],"t":["炒锅"],"v":0,"a":"雏鸡肉 面包 三两 面粉 五钱 鸡蛋 二个 花椒面 半分 精盐 一钱 绍酒 一钱 五钱 酱油 花生油 一斤（约耗二两）","p":["将鸡肉用刀拍一拍，在肉的两面每隔二分刹上直刀纹，深度均为肉的二分之一，然后切成八分见方的块，用精盐、酱油、绍酒、花椒面拌匀腌五分钟；鸡蛋人碗内用筷子搅打均匀，面包去皮搓成细末放入盘内。","将腌好的鸡肉滚上一层面粉后，放入鸡蛋中拖过，再沾上一层面包末。","炒勺内倒人花生油，在中火上烧至五成热，把鸡肉放入油内，用手铲不断拨动，约炸四分钟，见冒细泡时捞出；炒勺用旺火烧，油温至九成热时，再将鸡肉放入油内一炸，捞出，装入盘内即成。"]},{"i":671,"n":"爆鸡胗","r":"鲁菜","o":"中国菜谱·山东","f":"特点此菜呈紫红色，形似花朵，质地脆嫩，清香不腻。","c":"热菜","m":["爆炒"],"g":["鸡肉","猪肉","鸡蛋"],"s":["葱","蒜","淀粉","高汤","料酒","酱油","盐","味精"],"t":["炒锅"],"v":0,"a":"鸡胗 五两 鸡脯肉 两 葱末 二分 蒜黄段 二分 湿淀粉 二钱 半个 鸡蛋清 清汤④ 一两半 绍酒 -钱 酱油 二钱 精盐 二分 味精 一分 一斤(约耗一两) 花生油","p":["将鸡胗洗净，片去内外筋皮。在鸡胗的一面每隔半分宽用刀刹上十字花刀，每块切成两半。鸡肉切成五分见方的丁，放入碗内，加湿淀粉（一钱半）、精盐、鸡蛋清抓好渍匀。另一碗内放入清汤、酱油、绍酒、味精、湿淀粉对成汁。","炒勺内倒入花生油，用中火烧至五成热，将鸡丁下入油内，用筷子拨开，炸三分钟捞出。再把油用旺火烧至八成热时，倒人鸡胗焯一下（约三秒钟），捞出。","炒勺内留油（五钱），放入葱蒜，再倒入碗内对好的汁烧沸，放入鸡丁、鸡胗，在旺火上颠翻两下，盛入盘内即成。"]},{"i":672,"n":"红烧鸡尾尖","r":"鲁菜","o":"中国菜谱·山东","f":"特点此菜色泽桔红，鲜香脆嫩，脂多不腻，别有风味。","c":"热菜","m":["烧扒焖"],"g":["鸡肉","白菜"],"s":["葱","淀粉","高汤","料酒","酱油","白糖"],"t":["炒锅"],"v":0,"a":"母鸡尾尖 十六个(约重七两) 油菜心 一两 大葱 两段 湿淀粉 *一两半 清汤 半斤 绍酒 三钱 酱油 -两半 白糖 一钱 熟猪油 一斤(约耗二两)","p":["将鸡尾尖用刀一拍，剔去骨，个大的切为两半，放入碗内，加湿淀粉（七钱）抓匀；油菜心切寸段，在沸水中烫过。","炒勺内放入花生油，中火烧至六成热时，放入鸡尾尖炸至呈浅红色时捞出。","勺内留油（一两)，烧至六成热，放入葱段炸出香味时，加入鸡尾尖、酱油、清汤、白糖、绍酒，在中火上约十分钟，挑去葱段，放入油菜心，用湿淀粉勾芡，搅匀即成。"]},{"i":673,"n":"笼蒸全鸭","r":"鲁菜","o":"中国菜谱·山东","f":"特点此菜清香、味鲜，肉烂不腻，别有风味。","c":"热菜","m":["蒸"],"g":["鸭肉","火腿","口蘑","香菇","冬笋"],"s":["高汤","盐","酱油","料酒","葱","姜"],"t":["炒锅","蒸锅","砂锅"],"v":0,"a":"宰好的填鸭 一只(约重五斤) 火腿 二两 水发口蘑 一两 水发冬菇 一两 水发玉兰片 二两 清汤④ 二斤 酱油 一两 精盐 “二钱 绍酒 一两 葱片 五钱 姜片 二钱 透明纸 半张","p":["将鸭子洗净，砸断小腿骨环，剔去鸭掌大骨，抽去鸭舌及食管，剁去鸭嘴，在袋附近刹断脖颈，皮不可剁断。放入沸水锅内煮半小时（三成熟），捞至凉水内洗净，摘净毛根，抽去脊骨，割掉肛门、鸭。把鸭头、脖塞入胸脯内，葱、姜片塞入腹内。","将火腿切成一寸半长、七分宽、一分厚的片。玉兰片用刀稍拍，撕成一寸半长、三分粗的段。口蘑、冬菇均去根洗净，每个切为两半。","取沙锅-一口（或鸭池），把抽出的鸭脊骨剁为两段，放在锅底，鸭腹面朝上放在鸭骨上，口蘑摆在鸭腹中间成一行，玉兰片、冬菇、火腿分别横摆在口蘑的两边，倒人清汤、酱油、精盐、绍酒，用透明纸将沙锅口盖严、捆紧（防止笼屉内汽水滴进锅内，保持鸭子鲜味），放入笼屉内用旺火蒸约三小时即熟，取出揭去透明纸，撇去浮油即成。"]},{"i":674,"n":"冬菜鸭","r":"鲁菜","o":"中国菜谱·山东","f":"特点此菜鸭肉香烂，味道清鲜，肥而不腻。","c":"热菜","m":["蒸"],"g":["鸭肉"],"s":["葱","姜","酱油","淀粉","高汤","料酒","白糖","味精"],"t":["炒锅","蒸锅"],"v":0,"a":"宰好的填鸭 一只(约重五斤) 冬菜 一两 葱末 一钱 姜末 五分 嫩汁 六钱 酱油 一两半 湿淀粉 三钱 清汤① 六两 葱油图 \"一两 绍酒 一两 白糖 三钱 味精 三分","p":["将宰好的鸭子洗净，放入沸水内，用微火煮至五成熟时，放入凉水内洗净，摘去毛根，剔出鸭脊背内大骨和大腿骨（但注意不可把鸭皮弄破），剁为寸块。抽去鸭舌、脖筋，割去肛门和鸭臊，剁去小腿骨环。用刀从鸭背部劈为两片，在鸭腹内每隔五分宽斜划一刀（深度至肥肉为止），大腿根部两侧瘦肉剞成十字刀纹（深度至肥肉为止），将鸭肉放入沸水中烫一下捞出，用净布干水分，趁热均匀地抹上嫩汁（三钱），腹皮朝下放入鸭池（或汤碗内）。","将冬菜用温水洗净，攘干水分和葱姜末、绍酒（五钱）、酱油（一两）、嫩汁、葱油（五钱）拌匀，撒在鸭肉上，鸭骨同摆在鸭肉上。放入笼内约蒸三小时，熟时取出，挑去骨头，翻扣在盘内(鸭腹朝上)。炒勺内加清汤、酱油烧沸，撒去浮沫，湿淀粉勾芡，放入绍酒、白糖、味精、葱油调匀，浇在鸭肉上即成。"]},{"i":675,"n":"布袋鸭","r":"鲁菜","o":"中国菜谱·山东","f":"特点此菜鸭肉肥嫩，味香醇厚，烂而鲜美。","c":"热菜","m":["烧扒焖"],"g":["鸭肉","猪肉","鸡肉","冬笋","口蘑","海米","莲子"],"s":["酱油","葱","花椒","料酒","姜","盐","味精","高汤"],"t":["炒锅"],"v":0,"a":"宰好的肥雏鸭 只(约重四斤) 猪肋骨 五两 母鸡腿 五两 鸡骨架 个 猪肉 二两 水发玉兰片 两 水发口蘑 两 水发海米 两 水发莲子 两 咸雪里梗 两 酱油 两 葱油 两 葱椒绍酒③ 一两 葱段 一两 姜片 二钱 精盐 一钱 味精 五分 清汤 四斤","p":["将鸭抽去鸭舌，摘净毛根，洗净。在鸭脖上颈割二寸长刀口（左右侧均可），切断颈骨（皮不要切断），用麻绳捆住脖骨挂起（便于剔骨），顺着鸭颈两边用小刀把皮剥至尾部，此时鸭的脊、胸、腹骨已全部剔出，鸭肉已翻转向外，皮在里面（鸭头、腿、翅留骨不剔）。然后把鸭肉皮面翻过来成原形，并将小腿骨和翅骨敲断。","将猪肉、口蘑、玉兰片切成五分见方的丁。雪里梗劈为两半，切六分长的段。莲子、海米用沸水焯过捞出，均放入碗内，加酱油（三钱）、葱椒绍酒（五钱）、葱油拌匀后，从鸭脖刀口处填入鸭腹内，然后用细麻绳捆住刀口，随即放入沸水内烫二分钟捞出。将鸭翅膀别在背上，用针在鸭肉上刺儿个眼（使肉内汽泄出，以防煮时皮面破裂），用洁白布把鸭包起。","把猪肋骨剁成二寸长的块，鸡腿剁成一寸长的块，鸡骨架剁为四半，均放入沸水煮三分钟捞出，洗净。","锅内放入猪肋骨、鸡骨架，把“鸭包”放在骨架上，再放入鸡腿、清汤、酱油、精盐、葱、姜，在旺火上烧沸，撇去浮沫，盖上锅盖，移至微火上炖约三小时即熟。取出解去布包，鸭腹朝上放入大汤碗内（猪骨、鸡骨均不用），原汤加入味精、葱椒绍酒，浇在鸭子上即成。"]},{"i":676,"n":"什锦鸭","r":"鲁菜","o":"中国菜谱·山东","f":"特点此菜绚丽多彩，鲜香多味。","c":"热菜","m":["烧扒焖"],"g":["鸭肉","猪肉","冬笋","鱼肉","海参","香菇","口蘑","蹄筋","火腿","豌豆"],"s":["葱","姜","料酒","盐","花椒","味精","淀粉","高汤"],"t":["炒锅"],"v":0,"a":"熟鸭肉 四两 菜花 一两 冬笋 水发鱼骨 三钱 水发海参 五钱 水发冬菇 三钱 水发口蘑 三钱 水发蹄筋 三钱 熟瘦火腿 三钱 青豆 十粒 葱末 五分 姜末 二分 绍酒 四钱 精盐 一钱 葱椒泥 二分 味精 二分 湿淀粉 五钱 清汤④ 斤半 熟猪油 两","p":["将鸭肉、菜花、冬笋、口蘑、鱼骨、海参、蹄筋，均切成二分见方的丁，与青豆一起用沸水焯过。火腿也切成二分见方的丁。","炒勺内放入猪油（八钱），在中火上烧至八成热时，放入葱姜末炸出香味，加清汤、精盐、葱椒泥和菜花、冬笋、口蘑、鱼骨、海参、蹄筋、青豆烧沸后，撇去浮沫，湿淀粉勾芡，再把鸭肉、火腿、熟猪油、味精搅匀，盛人汤碗内即成。"]},{"i":677,"n":"烩鸭胰","r":"鲁菜","o":"中国菜谱·山东","f":"特点此菜鸭胰质地软嫩，汤鲜味浓。配以火腿、冬菇、玉兰片，色调美观。喜食酸辣的可加入适量的胡椒面、醋，别有风味。","c":"汤羹","m":["烩汆"],"g":["鸭肉","冬笋","香菇","火腿"],"s":["淀粉","盐","酱油","味精","料酒","高汤"],"t":["炒锅"],"v":0,"a":"鸭胰 二两 水发玉兰片 两 水发冬菇 两 火腿 两 湿淀粉 三钱 酱油 五钱 精盐 三分 味精 二分 绍酒 花椒油 三钱 清汤④ \"一斤","p":["把鸭胰洗净后，放入温水锅内煮至水沸捞出，放在汤碗内。火腿、玉兰片均切一寸长、二分宽、半分厚的条片。冬菇切成一寸长、二分宽的扁条。","炒勺内放入清汤、冬菇、玉兰片、火腿、酱油、精盐、绍酒烧沸后，用湿淀粉勾芡，加上味精，淋入花椒油，倒人鸭胰碗内即成。"]},{"i":678,"n":"余芙蓉蛋","r":"鲁菜","o":"中国菜谱·山东","f":"特点此菜“芙蓉”洁白，菠菜碧绿，色采悦目，软嫩清口。","c":"热菜","m":["蒸"],"g":["鸡蛋","白菜"],"s":["高汤","盐","酱油"],"t":["炒锅","蒸锅"],"v":1,"a":"鸡蛋清 四个 清汤④ 八两 精盐 三分 酱油 菠菜心 五钱","p":["将菠菜心洗净，切八分长的段。鸡蛋清放入碗内与清荡(一两半)、精盐搅匀，上笼用中火蒸约四分钟取出（不宜蒸老）即成“芙蓉”。","炒勺内放入清汤，在中火上烧沸后加入酱油、菠菜，撇去浮沫，盛在汤碗内，把蒸制的“芙蓉”用手勺百人汤碗即成。"]},{"i":679,"n":"馅蛋","r":"鲁菜","o":"中国菜谱·山东","f":"特点此菜蛋黄换肉馅，蛋中有肉味，肉中有蛋味，为鲁西南地区传统风味。","c":"热菜","m":["爆炒"],"g":["鸡蛋","猪肉","海米","冬笋","荸荠"],"s":["甜面酱","料酒","酱油","味精","盐","葱","姜","高汤"],"t":["炒锅","蒸锅"],"v":0,"a":"十五个 鲜鸡蛋 瘦猪肉 二两半 水发海米 二钱 水发玉兰片 二钱 熟荸荠肉 四钱 甜面酱 三钱 酱油 绍酒 二分 味精 分 精盐 钱 葱末 二分 姜末 二分 清汤④ *五两 四钱 花椒油 熟猪油 四钱","p":["将瘦猪肉、海米、玉兰片、熟荸荠均切为末。","炒勺内放花生油，在中火上烧至五成热时，加入葱姜末（各--分）、酱油（二钱）、肉末、精盐炒熟成馅待用。","鲜鸡蛋洗净，放冷水锅中（水没过鸡蛋），在中火上煮至六成熟时(约煮二至三分钟)捞出，放在冷水盆内，将每个鸡蛋的尖头轻轻破，剥一小口，用小刀将蛋清挖一小洞，倒出不熟的蛋黄。再将拌好的馅轻轻地灌在鸡蛋内。将鸡蛋口朝上，用蛋清封住小口，然后上笼蒸熟，取出，剥去蛋壳即成“馅蛋”。","炒勺内放入熟猪油，在中火上烧至五成热，加入葱姜末（各一分），炸至出香味时，再放入甜面酱、酱油（一钱）、清汤烧沸，撇去浮沫，放入“馅蛋”。将炒勺移到微火上煨三分钟，放入绍酒、味精、花椒油，盛盘内即成。"]},{"i":680,"n":"拔丝蛋块","r":"鲁菜","o":"中国菜谱·山东","f":"特点此菜蛋块外酥里软，味甜香。用筷子蘸以凉水，夹起蛋块，即能拔丝。","c":"甜品","m":["爆炒"],"g":["鸡蛋","面粉"],"s":["白糖"],"t":["炒锅","蒸锅"],"v":1,"a":"鸡蛋黄 四个 面粉 香蕉精 二滴 青红丝 五分 白糖 三两 猪油 一两 花生油 斤（约耗二两）","p":["将鸡蛋黄放入碗内，加面粉、香蒸精和清水(五钱)搅匀成糊。","炒勺内放入猪油（-一两），在中火上烧至六成热时，倒人鸡蛋糊，移至微火上，摊成二分厚的薄饼，随即翻过，用手勺轻拍几下，待蛋黄饼全部煎至皮硬取出，切成寸宽的斜方块。炒勺内放入花生油，在中火上烧至七成热时，将蛋块入油炸三分钟呈金黄色时捞出。","炒勺内留油（五钱），放入白糖炒至呈微红色，放入蛋块，颠翻几下，撒上青红丝，盛人盘内（盘底抹上少许油，以免粘盘）即成。"]},{"i":681,"n":"象眼鸽蛋（做法二）","r":"鲁菜","o":"中国菜谱·山东","f":"特点此菜面包酥脆，鸽蛋、鸡肉软嫩，味道鲜美。甜菜类","c":"热菜","m":["炸"],"g":["鸡肉","猪肉","荸荠","面粉","火腿","香菇","白菜","鸡蛋"],"s":["淀粉","味精","料酒","盐","椒盐","酱油"],"t":["炒锅"],"v":0,"a":"鸽蛋 六个 鸡脯肉 二两 肥猪肉 一两 荸荠末 五钱 咸面包 四两 火腿末 二分 冬菇未 二分 嫩青菜叶末 二分 湿淀粉 四钱 鸡蛋清 味精 二分 绍酒 二钱 三分 精盐 -花椒盐、辣酱油 各一小碟 熟猪油 一斤半(约耗一两半）","p":["将鸽蛋放在温水中，用中火煮熟捞至凉水内，剥去外皮，切为两升。面包去皮切成长、宽各一寸半、厚二分的片(共十二片)。鸡脯肉在凉水内泡十分钟捞出，去掉脂皮、白筋，用刀背砸成细泥，放入碗内，加蛋清、肥肉末、荸荠末、湿淀粉、绍酒、精盐、味精、猪油（二钱），用竹筷子顺一方向搅至色洁白时，即成为鸡肉馅。","将鸡肉馅均匀地抹在面包片上，再把鸽蛋(黄朝下)安在馅上。火腿、冬菇、菜叶末撒在鸽蛋周围，成为“鸽蛋托”。","炒勺内放入猪油，在中火上烧至五成热时，把“鸽蛋托”人油炸至漂起，见油冒细泡（约三分钟）捞出，摆在盘内即成。可蘸花椒盐、辣酱油食之。"]},{"i":682,"n":"琉璃苹果","r":"鲁菜","o":"中国菜谱·山东","f":"特点此菜色泽金黄透亮，外酥脆香甜，内软嫩略酸。","c":"甜品","m":["爆炒"],"g":["鸡蛋","面粉","芝麻"],"s":["白糖","淀粉"],"t":["炒锅"],"v":1,"a":"苹果 斤 白糖 三两 鸡蛋黄 个 湿淀粉 二两 面粉 五钱 青红丝 二分 芝麻仁 二分 花生油 一-斤半(约耗一两半)","p":["将苹果削去皮，挖去核，切成桔子瓣形的块。蛋黄与湿淀粉混合搅匀成糊。将苹果块滚上一层薄薄的面粉，再放入糊内抓匀。","炒勺内加入花生油，用旺火烧至七成热时，将苹果块一一放入油内炸，至金黄色时取出。","炒勺内留油五钱，在微火上烧热，放入白糖，用手勺搅炒，见露红色起细泡时，迅速将炸好的苹果块放入，随即把炒勺端离火眼，颠翻均匀，撒上青红丝、芝麻仁，倒在抹过油的案板上，用铁筷子逐块拨开，晾凉即成。"]},{"i":683,"n":"琉璃桃仁","r":"鲁菜","o":"中国菜谱·山东","f":"特点此菜淡黄晶亮，桃仁酥脆、香甜。·187。","c":"甜品","m":["爆炒"],"g":["核桃仁"],"s":["白糖"],"t":["炒锅"],"v":1,"a":"核桃仁 * 半斤 白糖 三两 花生油 一斤(约耗一两半)","p":["将核桃仁放入开水中泡至薄皮发软时，剥去皮后洗净，再放在开水内焯一下捞出，晾干水。","炒勺内放入花生油，在中火上烧至四成热时，将核桃仁人油炸至漂起（稍变色）时捞出。","炒勺内留油（五钱)，在微火上烧至五成热，放入白糖搅炒，待糖熔化冒细沫时，将核桃仁倒人，颠翻勺，使糖均匀地滚在核桃仁上，随即倒在案板上，用筷子逐块拨开，晾凉即成。"]},{"i":684,"n":"蜜腊银杏","r":"鲁菜","o":"中国菜谱·山东","f":"特点此菜色泽浅黄发亮，软烂香甜。因色、形似杏，故名。一六O、炸藿香原料藿香叶（去叶茎，选用中部）···二十片豆沙泥（炒好","c":"甜品","m":["烧扒焖"],"g":["白果"],"s":["白糖","桂花酱","蜂蜜"],"t":["炒锅"],"v":1,"a":"白果 斤 白糖 四两 熟猪油 五钱 桂花酱 二分 蜂蜜 一两","p":["将白果去皮，放入碱水中(每十斤水中，加碱五两)，刷去表皮的薄膜，捅去果心，洗净，用沸水焯过。","汤勺内放入清水（八两）、白糖、蜂蜜、白果在旺火上烧沸，撇去浮沫；再移至微火上，加入桂花酱、猪油，至汤浓时，颠翻均匀，盛人盘内即成。"]},{"i":685,"n":"晶糕拌梨丝（做法二）","r":"鲁菜","o":"中国菜谱·山东","f":"特点此菜红白相间，形色美观，口味甜酸，凉爽清口。","c":"甜品","m":[],"g":["梨"],"s":["白糖","桂花酱"],"t":["炒锅"],"v":1,"a":"莱阳梨*： 二个（约重六两） 晶糕 四两 糖卤 五分 桂花酱 三分","p":["将梨去皮、去核，切成半分厚的薄片；晶糕切同样厚的片。","在每两片梨中夹一片晶糕，切成半分粗的丝，整齐地摆在盘内成马鞍形状。","碗内加糖卤、桂花酱调匀，浇在晶糕、梨丝上面即成。"]},{"i":686,"n":"糖拌藕","r":"鲁菜·济南","o":"中国菜谱·山东","f":"特点此菜制作简便，食之脆嫩，凉爽，为夏令时菜。济南称此菜为水晶藕。","c":"凉菜","m":[],"g":["梨","猪肉"],"s":["白糖"],"t":["炒锅"],"v":0,"a":"鲜嫩藕 八两 白糖 二两 青红丝 二分 莱阳梨：此梨产于山东莱阳县，以皮薄、肉细、汁多、香甜著名。","p":["将藕洗净、去皮、去节，用刀切成木梳形片，放入开水内烫一下，用冷开水洗过，捞出，装入盘内，撒上白糖、青红丝即成。"]},{"i":687,"n":"玫瑰锅炸（做法二）","r":"鲁菜","o":"中国菜谱·山东","f":"特点此菜色泽金黄，质地软嫩，香甜，有浓郁的玫瑰味道。","c":"热菜","m":["炸"],"g":["鸡蛋","面粉"],"s":["白糖","淀粉"],"t":["炒锅"],"v":1,"a":"四个 鸡蛋黄 面粉 一两半 白糖 三两 玫瑰酱 湿淀粉 *三两 花生油 一斤(约耗一两)","p":["将鸡蛋黄放入碗内，加湿淀粉（二两）、清水（七两)、面粉(半两)一起搅匀成糊。汤勺内放入清水(二两)，在微火上烧沸，倒人蛋黄糊，用手铲不断搅动，成糊状（已熟），盛在平盘内，晾凉后即成软糕。然后把软糕切成一寸长、三分宽的长方条，滚上一层干面粉（约用干面粉一两）。","炒勺内放入清水（二两）、白糖、玫瑰酱，用旺火烧沸，放入湿淀粉勾芡，成玫瑰酱汁。","另一炒勺内放入花生油，用中火烧至七成热，将软糕条逐条放入油内炸至呈金黄色捞出，盛入盘内，浇上熬好的玫瑰酱汁即成。"]},{"i":688,"n":"奶汤白菜","r":"鲁菜","o":"中国菜谱·山东","f":"特点此菜汤汁色白香醇，白菜鲜嫩，清口不腻。","c":"汤羹","m":["烩汆"],"g":["白菜","火腿","冬笋","香菇"],"s":["高汤","葱","花椒","料酒","味精","盐","姜"],"t":["炒锅"],"v":0,"a":"八两 白菜心 奶汤① 肥瘦火腿 五钱 鲜冬笋 五钱 水发冬菇 五钱 葱椒绍酒② 一钱 味精 二分 精盐 一钱 鸡油 五分 葱末 三分 姜末 二分 熟猪油 一两","p":["白菜心切成一寸半长的段，嫩菜帮一拍，撕成三分宽的劈柴块。","炒勺内放入猪油，在中火上烧至五成热，放入葱、姜末，炸出香味时，即倒人白菜煸炒约一分钟，再加入精盐、葱椒绍酒搅匀，然后加入奶汤煮三分钟，撒上味精，盛人汤碗内。","把冬笋、火腿均切成四片（每片均切为二寸长、五分宽、一分厚)。每个冬菇斜刀片成三片，与冬笋一起在沸水中烫过。将火腿、冬菇、冬笋逐片相间地摆在碗内的白菜上面，淋上鸡油即成。"]},{"i":689,"n":"炝桃仁","r":"鲁菜","o":"中国菜谱·山东","f":"特点此菜质地脆嫩，味道清淡，为夏季时令菜。","c":"甜品","m":[],"g":["核桃仁","黄瓜","萝卜"],"s":["花椒","高汤","酱油","盐","料酒"],"t":["炒锅"],"v":1,"a":"鲜核桃仁 八两 黄瓜 二钱 红萝卜 鲜花椒 一枝 鸡汤 五钱 酱油 二钱 精盐 二分 绍酒 五分 花椒油 一钱","p":["将桃仁去皮洗净，沥干水，放在盘内。黄瓜、红萝卜切成一分粗的丝。鲜花椒用刀一拍，放在桃仁上面。","碗内加鸡汤、花椒油、酱油、精盐、绍酒对成汁，浇在盘内即成。"]},{"i":690,"n":"口蘑炒蒲菜","r":"鲁菜","o":"中国菜谱·山东","f":"特点此菜呈白色，质地鲜嫩，清淡爽口。","c":"热菜","m":["爆炒"],"g":["口蘑","蒲菜","火腿"],"s":["姜","淀粉","盐","高汤","料酒","味精"],"t":["炒锅"],"v":0,"a":"蒲菜 十棵(约重半斤) 鲜口蘑 半斤 熟火腿 三钱 姜末 二分 湿淀粉 一钱 清汤④ 三两 精盐 一钱 绍酒 二钱 味精 二分 熟猪油 一两","p":["将蒲菜嫩心切成寸段。鲜口蘑洗净，切成两半，在沸水中焯过。火腿切半分厚的片。","炒勺内放猪油，用中火烧至六成热，加入姜末一炸，随即倒入蒲菜、口蘑、火腿煸炒约一分钟，再放入清汤、精盐、绍酒、湿淀粉、味精搅匀，颠翻两下，盛入盘内即成。"]},{"i":691,"n":"“三美”豆腐*","r":"鲁菜","o":"中国菜谱·山东","f":"特点此莱汤汁乳白，豆腐软滑，白菜鲜嫩，味清淡爽口。","c":"热菜","m":["烧扒焖"],"g":["豆腐","白菜"],"s":["高汤","盐","味精","葱","姜"],"t":["炒锅","蒸锅"],"v":1,"a":"泰安豆腐 三两 白菜心 二两 奶汤① 一斤 精盐 八分 味精 二分 葱末 三分 姜末 二分 鸡油 一钱 熟猪油 四钱","p":["将豆腐上笼蒸约十分钟取出，沥干水，切成一寸长、八分宽、四分厚的片，白菜心用手撕成一寸半长的劈柴块，分别放入沸水中烫过。","炒勺内放入猪油，在中火上烧至五成热时，加入葱、姜末炸出香味，放入奶汤、精盐、豆腐、白菜，烧沸后，撇去浮沫，加入味精，淋上鸡油即成。·泰安“三美”：山东泰安的白菜水分大，质地鲜嫩，味甜；豆腐浆细，含水量大，极嫩；水分有甘甜味道。素有“泰安有三美，白菜、豆腐、水”之称。"]},{"i":692,"n":"锅爆豆腐","r":"鲁菜","o":"中国菜谱·山东","f":"特点此菜呈深蛋黄色，经塌制后，卤汁浸人豆腐，味浓鲜嫩。","c":"热菜","m":["爆炒"],"g":["豆腐","虾","鸡蛋","面粉"],"s":["盐","淀粉","葱","姜","料酒","味精","酱油","高汤"],"t":["炒锅","蒸锅"],"v":0,"a":"豆腐 一斤半 鲜虾仁 鸡蛋 二个 精盐 一钱 干面粉 一钱 湿淀粉 一钱 葱末 五分 姜末 三分 绍酒 二钱 味精 三分 酱油 二钱 清汤 一两 熟猪油","p":["将豆腐切成一寸半长、七分宽、三分厚的长方片。把虾仁剁成泥。鸡蛋清入碗内，搅至起泡，加入精盐（三分）、湿淀粉、绍酒（一钱）、味精（一分)与虾仁泥搅匀成馅。","先在盘内摆一层豆腐，均匀地抹上虾馅。将剩余的豆腐盖在虾馅上。然后上笼蒸十五分钟取出，沥干水。将鸡蛋黄、绍酒（五分）、味精（一分）、精盐（三分）和面粉放入碗内搅成蛋黄糊。将蛋黄糊均匀地抹在豆腐上。","炒勺内放入猪油，在微火上转动一下，待油烧至六成热时，将豆腐完整地推入勺内，两面煎至呈淡黄色时，随即加入葱姜末、清汤、酱油、绍酒、味精，用大盘盖住，焖至汁尽，扣在盘内即成。"]},{"i":693,"n":"海米白菜汤","r":"鲁菜","o":"中国菜谱·山东","f":"特点此菜汤清味鲜，爽口。","c":"汤羹","m":["烩汆"],"g":["海米","白菜","火腿","香菇"],"s":["高汤"],"t":["炒锅"],"v":0,"a":"白菜心 六两 海米 一两 高汤 一斤 樂 三分 火腿 二钱 水发冬菇 二个 鸡油 五分","p":["将白菜心切成三分宽、一寸长的条，用沸水稍烫，取出沥干水。海米用温水洗净。火腿切成六分长条片。冬菇每个切两。","汤勺内加入高汤、火腿、冬菇、海米、白菜条、精盐烧开，撇去浮沫，待白菜烂时盛入汤碗内，淋上鸡油即成。"]},{"i":694,"n":"奶汤鹿角菜","r":"鲁菜","o":"中国菜谱·山东","f":"特点此菜色泽光亮，白里透黄，汤鲜菜香，清咸爽口。","c":"汤羹","m":["烩汆"],"g":["鹿角菜","粉丝粉皮"],"s":["高汤","葱","姜","盐","味精","料酒"],"t":["炒锅"],"v":1,"a":"鹿角菜 五两 奶汤① 斤 葱末 三分 姜末 二分 精盐 五分 味精 二分 鸡油 五分 绿豆 五钱 绍酒 二钱 熟猪油 一两","p":["炒勺内放清水（一斤）、绿豆，用旺火烧沸后，捞出绿豆，留汤待用。鹿角菜削去根，洗净，撕成碎片，放入绿豆汤中煮沸后捞出备用。","炒勺内放入猪油，急火烧至四成热，放入葱末、姜末炸出香味时，立即放入鹿角菜煸炒约二分钟，加入奶汤、精盐、绍酒，烧沸后撇去浮沫，放入味精，盛人汤碗内，淋上鸡油即可。"]},{"i":695,"n":"炸山豆苗","r":"鲁菜","o":"中国菜谱·山东","f":"特点此菜制作简便，质地脆嫩，清香适口，为应时菜品。","c":"热菜","m":["炸"],"g":["面粉","鸡蛋"],"s":["料酒","盐"],"t":["炒锅"],"v":1,"a":"山豆苗 二两 干面粉 一两 鸡蛋 个 白酒 分 精盐 三钱 熟猪油 一斤（耗约一两半）","p":["将山豆苗掐成寸段。鸡蛋入碗内,加面粉、白酒、精盐调匀成糊。","炒勺内放入猪油，在中火上烧至七成热，把山豆苗沾上鸡蛋糊，下油炸至呈深黄色时捞出即成。"]},{"i":696,"n":"烧素烩（做法二）","r":"鲁菜","o":"中国菜谱·山东","f":"特点此菜面筋泡柔韧，能吸进汤汁的鲜味，味香不腻。一九O、烧煨面筋条原料熟面筋块.水发冬菇..五钱水发玉兰片++五钱酱油.","c":"汤羹","m":["烧扒焖","烩汆"],"g":["面筋","豆腐","木耳","粉丝粉皮","白菜"],"s":["高汤","盐","酱油","淀粉","葱","姜"],"t":["炒锅"],"v":1,"a":"炸面筋泡 两 豆腐 三两 五香豆腐干 两块（约重二两） 水发木耳 五钱 水发粉丝 一两 青菜心 二两 清汤④ 三钱 酱油 五钱 精盐 一钱 湿淀粉 五钱 葱末 五分 姜末 三分 花椒油 五钱 花生油 两","p":["将面筋泡一切两半；豆腐片成三分厚的片；五香豆腐干先片成一分厚的片，再切成三角形的小片；粉丝切一寸半长；青菜心切成寸段，用沸水焯过，沥干水。","炒勺内放入花生油，在中火上烧至八成热时，放入葱、姜末、五香豆腐干煸炒一下，加入酱油、面筋泡、豆腐、木耳、粉丝、青菜心、清汤、精盐烧沸，用湿淀粉勾芡，淋上花椒油即成。"]},{"i":697,"n":"爆素排骨","r":"鲁菜","o":"中国菜谱·山东","f":"特点此菜色泽红润，形似排骨，味道甜香。其他菜类","c":"热菜","m":["爆炒"],"g":["面筋","山药"],"s":["高汤","姜","白糖","盐","香油"],"t":["炒锅"],"v":1,"a":"水面筋 三两 山药 二两 鸡汤 二两 酱茎蓝丝 姜丝 三分 白糖 一两半 精盐 三分 二钱 芝麻油 二钱 花生油 一斤半（约耗一两半）","p":["把山药去皮洗净，切成寸段。用面筋分别缠在每块山药的中间，呈“排骨”形待用。","炒勺内放入花生油，在中火上烧至七成热，将“排骨”人油炸成金黄色时捞出。","炒勺内留油五钱，在中火上烧至五、六成热，放入白糖（三钱）炒至红色时，放入姜丝、酱蓝丝一炒，加入醋，再放入鸡汤、精盐、白糖，把勺移至微火上，至汁浓时加入“排骨”，在勺内颠翻，使汁均匀地挂在“排骨”上，淋上芝麻油即成。"]},{"i":698,"n":"炸鸡虾卷","r":"鲁菜","o":"中国菜谱·山东","f":"特点此菜颜色金黄，外焦里嫩，鲜香不腻。","c":"热菜","m":["炸"],"g":["鸡肉","虾","猪肉","鸡蛋"],"s":["葱","料酒","味精","淀粉","盐","胡椒","香油"],"t":["炒锅","蒸锅"],"v":0,"a":"六两 猪网油 大虾肉 四两 猪瘦肉 三两 净鸡肉 三两 鸡蛋 二个 圆葱 二两 绍酒 一两 五分 味精 湿淀粉 二两 精盐 二钱 芝麻油 胡椒面 少许 鸡腿骨 十根(每根一寸长) 花生油 二斤（约耗半两）","p":["猪瘦肉、鸡肉切成一寸长、八分宽、一分厚的长方形片。虾肉洗净，切成二分厚的片。圆葱剥去一层外皮，削去干头及根，切成末。将猪肉、虾、鸡肉、圆葱、胡椒面、绍酒、芝麻油、精盐、味精放入碗内拌匀成馅。鸡蛋楂入另一碗内，加湿淀粉搅成糊。","猪网油（要用薄的）洗净，放在菜板上切成十张四网油寸长、三寸宽的长方形片。取网油一鸡蛋糊片铺在砧板上，取十分之一的馅，搁馅在网油片的一角，在网油片四边抹上鸡腿骨一层鸡蛋糊。另取鸡骨一根，放在网油片的一边，鸡骨有一半露在网油外，然后包起来象鸡腿一样（如图）。如上法包成十条，放在盘内，上笼蒸十分钟左右取出，放在另一盘内（因原盘内有汤，且热，不适于沾淀粉糊)。","把炒勺放在旺火上，倒人花生油，烧热后，将蒸好的卷沾上淀粉糊，一个个地放入油内炸，至呈金黄色时捞出即成。吃时可蘸辣酱油。"]},{"i":699,"n":"炒三丁（做法二）","r":"鲁菜","o":"中国菜谱·山东","f":"特点此菜用旺火爆炒，虾仁、鸡肝、蒲菜脆嫩鲜香，汁浓可口。","c":"热菜","m":["爆炒"],"g":["蹄筋","虾","鸡肉","冬笋","蒲菜","豌豆","鸡蛋"],"s":["葱","姜","盐","淀粉","酱油","料酒","味精","高汤"],"t":["炒锅"],"v":0,"a":"二两 水发蹄筋 鲜虾仁 两半 鸡肝 二两 水发玉兰片 五钱 蒲菜 青豆 十五粒 鸡蛋清 半个 葱末 二分 姜末 二分 精盐 五分 酱油 一钱 湿淀粉 六钱 绍酒 二钱 味精 一分 清汤 三两 一斤(约耗一两) 熟猪油","p":["将蹄筋、蒲菜切成四分长的段，玉兰片切成四分见方、一分厚的小片，以上三种原料均用沸水焯过。虾仁放入碗内，加进蛋清、精盐（一分）、湿淀粉（二钱）拌匀浆好。鸡肝切四分见方的丁，放入碗内用精盐（一分）、湿淀粉（二钱）拌匀浆好。","炒勺内放入熟猪油，在中火上烧至五成热时，将浆好的虾仁、鸡肝分别下人油内（约用十五秒钟）滑过捞出，净油。","炒勺内留油五钱，旺火烧至六成热时，放入葱姜末，炸出香味时，将蹄筋、蒲菜、玉兰片、青豆、虾仁、鸡肝、酱油、精盐（三分）、清汤放入，炒十秒钟，再放入绍酒、味精，用湿淀粉（二钱）勾芡，颠翻盛人盘内即成。"]},{"i":700,"n":"扒三白","r":"鲁菜","o":"中国菜谱·山东","f":"特点此菜颜色洁白，鲍鱼、鸡肉、芦笋滑嫩，味鲜香清口。","c":"热菜","m":["烧扒焖"],"g":["鲍鱼","鸡肉","猪肉","冬笋","鸡蛋"],"s":["淀粉","料酒","盐","高汤"],"t":["炒锅"],"v":0,"a":"水发鲍鱼 三两 鸡脯肉 三两 罐头芦笋 三根（约重三两） 鸡蛋清 湿淀粉 *五钱 鸡油 三钱 绍酒 一钱 鸡汤 六两 精盐 五分 葱油③ 五钱 一斤（耗一两半） 猪油","p":["将鲍鱼片成二分厚斜片，按原来的形状摆好，放在菜盘的一边(光面朝下)；芦笋削去外皮放在盘的中间；鸡脯肉片成长一寸二、宽八分的薄片，放入碗内加鸡蛋清、湿淀粉（二钱）渍匀，用五成热的猪油划开捞出，整齐地摆在放鲍鱼盘的另一边，成“三白”。","炒勺内放入鸡汤、绍酒、精盐用旺火烧沸；将“三白”原样推入锅内，用微火煨三分钟左右，即加入葱油，湿淀粉勾芡，将炒勺端起转动，接着颠勺把整个菜翻过来，再转动两下，淋上鸡油，按原样装入盘中即成。"]},{"i":701,"n":"炸茄盒","r":"鲁菜","o":"中国菜谱·山东","f":"特点此菜茄焦馅嫩，吃时撒上花椒面，别有风味。","c":"热菜","m":["炸"],"g":["茄子","猪肉","面粉"],"s":["甜面酱","酱油","盐","味精","葱","姜","花椒","香油"],"t":["炒锅"],"v":0,"a":"茄子 五两 猪肉 二两 面粉 两 甜面酱 二分 酱油 钱 精盐 钱 味精 分 葱末 二分 姜末 分 花椒面 五分 花生油 一斤半（约耗一两半） 芝麻油 一钱","p":["把肉洗净剁成末，放在碗内，加入酱油、甜面酱、精盐、芝麻油、味精、葱姜末拌匀成馅；面粉放在小盆内加水（三两)搅匀成糊。","茄子去蒂削皮，切成夹刀片，将馅均匀酿入成茄盒。炒勺内放花生油，在中火上烧至七成热时，将茄盒沾面糊下油，炸至呈黄色时(约四分钟)捞出，待油温升至八成热时，将茄盒再投人油中，炸成深黄色时捞出即成。"]},{"i":702,"n":"酥菜（做法二）","r":"鲁菜","o":"中国菜谱·山东","f":"特点此菜一锅能出多样品种，菜香烂味美。","c":"热菜","m":["炖煨"],"g":["白菜","鸡蛋","鱼肉","鲫鱼","鸡肉","猪肉"],"s":["白糖","盐","葱","姜","花椒","酱油","醋","香油"],"t":["砂锅"],"v":0,"a":"白菜 水发海带 五斤 鸡蛋 二十个 鱼（鲜鲫鱼最好） 二斤 鸡 一只（约重二斤半） 鲜藕 二斤 猪肉（带骨） 三斤 白糖 精盐 二两 葱丝 三两 姜丝 二两 花椒 一两 酱油 三斤 醋 二斤 芝麻油 半斤","p":["将白菜剥去老皮，并一叶一叶撕开洗净，用开水稍烫；藕去节刮皮，用水煮透；海带洗净，卷成粗约二寸的卷；鸡蛋煮熟去皮；鱼去鳞和内脏，洗净；猪肉去骨，切成长四寸、宽二寸的大块；鸡剁成大块；花椒用净布包好捆紧。","把剔出的骨头平摆在沙锅底，花椒包放在骨上，接着摆上一层藕；第二层摆鸡、鱼、肉；第三层摆鸡蛋和海带；最上面摆白菜。每摆一层时撒一层葱姜丝。最后放入酱油、醋、精盐，并酌加清水（约四斤），然后用大盘扣菜上，将菜压住。","将沙锅放在中火上炖至五成熟时（约二小时），放入白糖（放早易从汤内涌出)，炖至八成熟时，倒人芝麻油（放早味不香）；然后将锅移至微火上煨（约二至三小时），至汤剩一半时，将沙锅端下，晾凉后即成。"]},{"i":703,"n":"凉拌什锦粉丝","r":"鲁菜","o":"中国菜谱·山东","f":"特点此菜是以龙口粉丝为主料的冷拌菜，形色美观，爽凉可口。","c":"凉菜","m":["爆炒"],"g":["粉丝粉皮","火腿","鸡肉","猪肉","鸡蛋","海米","香菇","白菜"],"s":["淀粉","酱油","味精","香油"],"t":["炒锅"],"v":0,"a":"龙口粉丝*： 三两 熟火腿 一两 熟鸡肉 一两 熟猪肉 一两 鸡蛋 二个 水发海米 五钱 水发冬菇 *五钱 龙口粉丝是山东黄县龙口镇所产， 用绿豆淀粉制成，质地柔而韧， 条细洁白。 菠菜心 *三棵 酱油（或辣酱油） 八钱 五钱 芥末糊 五分 味精 二分 芝麻油 三分","p":["将粉丝切成五寸长，放入沸水内约煮五分钟（以无硬心为度），捞出用冷水稍浸，沥干水分，放在菜盘中间。菠菜切成一寸长的段，冬菇片开，用沸水焯过。","将鸡蛋入碗内搅匀。炒勺放在中火上烧至四成热时，将搅匀的蛋汁倒入勺内摊成一分厚的蛋饼。将蛋饼切成一分宽、二寸长的条；火腿、鸡肉、猪肉均切成一分粗、一寸二长的丝。把以上四种条、丝和冬菇分别整齐地相间摆在盘内粉丝的周围；水发海米、菠菜心撒在粉丝上面。","碗内放入酱油、醋、芥末糊、芝麻油、味精调匀成汁，与菜一同上桌，食时，将汁倒入菜中即成。"]},{"i":704,"n":"拌什锦合菜","r":"鲁菜","o":"中国菜谱·山东","f":"特点此菜是凉菜，清爽可口。","c":"凉菜","m":[],"g":["海参","蹄筋","海米","猪肉","火腿","鸡肉","黄瓜"],"s":["酱油","香油"],"t":["炒锅"],"v":0,"a":"水发海参 四钱 水发蹄筋 三钱 水发海米 三钱 水发海 一两 水发冻粉 五钱 熟里脊肉 五钱 熟瘦火腿 三钱 熟鸡肉 五钱 鸡蛋糕 四钱 黄瓜 一两 酱油 八钱 六钱 芥末糊 五钱 芝麻油 一钱","p":["1，将海参、蹄筋用沸水焯过，晾凉，切成一寸半长、半分粗的丝；火腿、蛋糕、海、黄瓜、熟鸡肉、熟里脊肉均切一寸半长、半分粗的丝；冻粉切一寸半长的段。","先将蹄筋丝、鸡丝、里脊丝、黄瓜丝、冻粉、海合在一起调拌均匀，盛在盘内。再将海参丝、火腿丝、蛋糕丝、海米放在上面，把酱油、芝麻油、醋放在一个碗内调匀，浇在盘内菜上即成。如欲吃芥末可将芥末糊拌入。"]},{"i":705,"n":"巍芸豆","r":"鲁菜","o":"中国菜谱·山东","f":"特点此菜做法别致，味清香，鲜嫩适口。","c":"热菜","m":["炸"],"g":["豌豆","猪肉","鸡蛋","面粉"],"s":["盐","葱","姜","酱油","淀粉","料酒","味精","高汤"],"t":["炒锅","蒸锅"],"v":0,"a":"芸豆 三两 猪肉 二两 鸡蛋清 三个 精盐 三分 酱油 葱姜末 六分 面粉 二钱 湿淀粉 三钱 绍酒 一钱 味精 清汤 三两 花椒油 二分 花生油 --斤半(约耗一两)","p":["先将芸豆择去筋，洗净，逐个从中片开成夹刀片；猪肉剁成细泥，放入碗内，加入精盐(二分)、酱油(五分)、鸡蛋清（-个）、湿淀粉（一钱）、葱姜末搅匀成馅。将馅抹在每个芸豆夹里。","鸡蛋清（二个）人碗内，加湿淀粉（一钱）搅打成糊。","炒勺内放入花生油，在中火上烧至五成热时，将芸豆夹逐个滚上一层面粉，再蘸上蛋清糊下人油内，炸至呈淡黄色捞出，沥净油。4。炸好的芸豆夹摆入碗内，加上清汤、精盐（一分)、酱油（五分）、绍酒上笼蒸八分钟，取出，扣人盘中。把原汤入炒勺内，湿淀粉勾芡烧沸，加入味精，淋上花椒油，浇在芸豆夹上即成。"]}];const META={"reg":{"鲁菜":701,"粤菜":3,"湘菜":1,"京菜":1},"groups":{"调料":["高汤","酱油","香油","蚝油","辣椒油","芝麻酱","椒盐","桂皮","淀粉","盐","味精","料酒","白糖","蜂蜜","桂花酱","醋","胡椒","甜面酱","黄酱","腐乳","香糟","花椒","八角","葱","姜","蒜","香菜"],"干货果品":["鱼翅","鱼唇","鱼肚","海参","干贝","海米","燕窝","火腿","栗子","白果","莲子","红枣","核桃仁","杏仁","山楂","梨","桃","芝麻"],"水产":["鲍鱼","鲜贝","虾","螃蟹","海蜇","墨鱼","鱿鱼","甲鱼","鲤鱼","桂鱼","黄鱼","偏口鱼","加吉鱼","鲫鱼","草鱼","青鱼","刀鱼","银鱼","赤鳞鱼","鱼肉"],"肉禽":["蹄筋","牛肉","羊肉","鸡肉","鸭肉","猪肚","猪腰","猪大肠","猪肺","猪肉"],"蛋奶豆制品":["鸡蛋"],"蔬菜":["青蒜","洋葱","冬笋","芦笋","白菜","菠菜","豌豆","黄瓜","西红柿","茄子","冬瓜","萝卜","山药","荸荠","芹菜","荠菜","蒲菜","发菜","鹿角菜","豆芽","毛芋头","辣椒","雪里蕻","藿香","生菜"],"菌豆蛋奶":["香菇","口蘑","木耳","豆腐","面筋","牛奶"],"主食":["粉丝粉皮","糯米","米粉","面粉"]},"cnt":{"牛肉":6,"鸡肉":172,"火腿":124,"干贝":15,"鲍鱼":15,"冬笋":179,"白菜":77,"香菇":117,"面粉":79,"猪肉":362,"鹿角菜":8,"鲜贝":11,"青蒜":17,"发菜":4,"萝卜":18,"荸荠":32,"口蘑":40,"牛奶":1,"鸡蛋":302,"螃蟹":14,"鱼翅":12,"芦笋":1,"鱼唇":3,"青鱼":3,"豌豆":59,"海参":55,"虾":81,"羊肉":9,"猪腰":26,"猪大肠":14,"墨鱼":6,"辣椒":19,"海米":30,"豆芽":5,"木耳":30,"鲤鱼":15,"鱼肉":86,"黄瓜":30,"芝麻":13,"核桃仁":14,"荠菜":2,"毛芋头":2,"蹄筋":16,"偏口鱼":15,"猪肚":14,"粉丝粉皮":13,"洋葱":2,"桂鱼":6,"刀鱼":1,"黄鱼":19,"芹菜":3,"西红柿":15,"加吉鱼":5,"鲫鱼":6,"甲鱼":6,"莲子":10,"糯米":5,"菠菜":17,"海蜇":1,"蒲菜":14,"米粉":4,"鱼肚":7,"生菜":7,"鸭肉":40,"鱿鱼":7,"山药":13,"燕窝":1,"冬瓜":5,"红枣":6,"山楂":13,"杏仁":1,"豆腐":29,"梨":9,"白果":5,"桃":2,"栗子":10,"面筋":13,"藿香":1,"茄子":5,"赤鳞鱼":5,"草鱼":5,"雪里蕻":1,"猪肺":2,"银鱼":1,"料酒":530,"味精":394,"盐":577,"葱":477,"姜":475,"花椒":121,"高汤":403,"香菜":63,"香油":172,"黄酱":8,"蒜":86,"淀粉":383,"香糟":12,"白糖":226,"酱油":316,"胡椒":56,"醋":106,"桂皮":25,"八角":42,"芝麻酱":8,"椒盐":16,"甜面酱":35,"辣椒油":8,"桂花酱":23,"蜂蜜":9,"腐乳":1,"蚝油":2},"tools":["炒锅","平底锅","蒸锅","砂锅","烤箱","火锅","铁板"]};

function evalAll(){const q=$('#q').value.trim(),reg=$('#reg').value,cat=$('#cat').value,lack=+$('#lack').value,veg=$('#veg').checked;let out=[];
 for(const r of DATA){if(cat&&r.c!=cat)continue;if(reg&&!r.r.startsWith(reg))continue;if(veg&&!r.v)continue;
  if(q){if(!(r.n+r.a+r.g.join('')).includes(q))continue;const x=score(r);out.push(x);continue}
  if(!S.ing.size)continue;if(!toolOK(r))continue;const x=score(r);
  if(!x.hit.length||!x.core&&x.hit.length<2)continue;
  const need=r.g.length>4?r.g.slice(0,4):r.g;if(need.filter(i=>!S.ing.has(i)).length>lack)continue;out.push(x)}
 const sc=x=>x.hit.length*3-x.missI.length*2-x.missS.length*.5+(x.core?2:0);
 out.sort((a,b)=>sc(b)-sc(a)||a.r.n.length-b.r.n.length);return out}
function card(x,open){const r=x.r;const d=document.createElement('details');d.className='card';if(open)d.open=true;
 const mi=x.missI.slice(0,6),ms=x.missS;
 d.innerHTML=`<summary><span><span class="t">${r.n}</span><span class="tag">${r.c}</span>${r.r!="鲁菜"?`<span class="tag">${r.r}</span>`:""}${r.m.map(m=>`<span class="tag">${m}</span>`).join('')}${r.v?'<span class="tag v">素</span>':''}</span>
 <span class="have">${S.ing.size?`有 ${x.hit.length} 种${mi.length?` · <span class="miss">缺 ${mi.join('、')}</span>`:' · 食材齐全'}`:''}</span><span class="f">${r.f}</span></summary>
 <div class="body"><h4>用料（原书份量）</h4><div>${r.a}</div>${ms.length&&S.ing.size?`<h4>还缺的调料</h4><div class="miss">${ms.join('、')}</div>`:''}
 <h4>来源：${r.o}</h4><h4>做法 · 需要：${r.t.join('、')}</h4><ol>${r.p.map(s=>`<li>${s}</li>`).join('')}</ol></div>`;return d}
let cur=[];
function run(){cur=evalAll();const L=$('#list');L.innerHTML='';$('#menu').innerHTML='';
 const q=$('#q').value.trim(),msg=q?`搜到 ${cur.length} 道`:S.ing.size?`可做 ${cur.length} 道`:'';$('#count').textContent=msg;$('#count2').textContent=msg||'选择食材开始';
 if(!cur.length){L.innerHTML=`<div class="empty">${q||S.ing.size?'没有符合条件的菜。试试放宽“允许缺少的食材”，或去掉厨具限制。':'从左侧勾选食材，或在上面直接搜菜名。比如先选 海参、鸡肉、豆腐，再看看能做什么。'}</div>`;return}
 cur.slice(0,60).forEach((x,i)=>L.appendChild(card(x,false)));if(cur.length>60){const p=document.createElement('p');p.className='note';p.textContent=`另有 ${cur.length-60} 道，请缩小条件查看。`;L.appendChild(p)}}
const pick=a=>a[Math.floor(Math.random()*Math.min(a.length,4))];
function gen(){if(!S.ing.size){S.ing.add('鸡肉');S.ing.add('豆腐');document.querySelectorAll('#ingr .chip').forEach(b=>{if(/^(鸡肉|豆腐)/.test(b.textContent))b.setAttribute('aria-pressed',true)});run()}
 const by=c=>cur.filter(x=>x.r.c==c);const want=[['热菜','主菜'],['汤羹','汤'],['凉菜','凉菜'],['小吃','小吃'],['甜品','甜品']];const M=$('#menu');
 const items=want.map(([c,l])=>[l,pick(by(c))]).filter(a=>a[1]);if(!items.length){M.innerHTML='';return}
 M.innerHTML='<div class="menu"><h2>今日菜单</h2><ul>'+items.map(([l,x])=>`<li><b>${l}</b><a href="#" data-i="${x.r.i}">${x.r.n}</a><span>${x.r.f.slice(0,22)}</span></li>`).join('')+'</ul></div>';
 M.querySelectorAll('a').forEach(a=>a.onclick=e=>{e.preventDefault();const x=cur.find(y=>y.r.i==a.dataset.i);const L=$('#list');L.prepend(card(x,true));L.firstChild.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth'})});M.scrollIntoView({block:'nearest'})}
$('#gen').onclick=$('#gen2').onclick=gen;
$('#rnd').onclick=()=>{const r=DATA[Math.floor(Math.random()*DATA.length)];const x=score(r);$('#menu').innerHTML='';const L=$('#list');L.prepend(card(x,true));L.firstChild.scrollIntoView({block:'nearest'})};
$('#clear').onclick=()=>{Object.values(S).forEach(s=>s.clear());document.querySelectorAll('.chip').forEach(b=>b.setAttribute('aria-pressed','false'));run()};
['#q','#cat','#reg','#lack','#veg'].forEach(s=>$(s).addEventListener('input',run));
run();
</script></body></html>
