，用芥菜梗结成小把共24把，摆入粗磁碗内成马鞍形状。鸡骨架剁成小块，盖在柴把鸡上，加入清汤、精盐、酱油、葱姜、葱椒料酒，然后上笼用旺火蒸1小时取出，剔去葱姜片，翻扣在汤碗内。4。炒勺内倒入清汤300克，同时也把蒸鸡的原汁倒入烧沸，撇去浮沫，加入葱椒料酒、味精随即浇入柴把鸡的汤碗内。"]},{"i":329,"n":"烩两鸡丝","r":"鲁菜·济南","o":"鲁菜300种","f":"·鸡肉丝滑润爽口，略有熏香味，是济南传统菜。","c":"汤羹","m":["烩汆"],"g":["鸡肉","猪肉","豌豆","鸡蛋"],"s":["盐","高汤","料酒","味精","淀粉"],"t":["炒锅"],"v":0,"a":"主料：生鸡脯肉和熏鸡脯肉各100克半｜配料：豌豆15克｜调料：精盐3克·清汤150克料酒10克味精1克·鸡蛋清1个湿淀粉40克猪油500克（约耗40克）","p":["1.先将生鸡脯肉切成细丝，加入鸡蛋清、精盐（1克）、湿淀粉渍匀养好。","熏鸡脯肉切2毫米粗的丝和豌豆用热水焯过。","2。","炒勺内倒入猪油，在中火上烧至四成热时，把养好的生鸡肉丝倒入勺内，用铁筷子拨动打开，滑透将油控出，67加入清汤、料酒、精盐、熏鸡肉丝、豌豆烧沸，撇去浮沫，再用湿淀粉勾芡，加味精即成。"]},{"i":330,"n":"蟹黄鸡托","r":"鲁菜","o":"鲁菜300种","f":"面包托酥脆，鸡肉鲜嫩，配有蟹黄的汤汁色白明亮，香美可口。68","c":"热菜","m":["烧扒焖"],"g":["螃蟹","鸡肉","猪肉","面粉","海参","香菇","冬笋","鸡蛋"],"s":["盐","葱","姜","高汤","淀粉","香油"],"t":["炒锅"],"v":0,"a":"主料：净鸡肉150克肥肉50克咸面包150克｜配料：蟹黄15克海参冬菇冬笋尊荠各2.5克｜调料：精盐2.5克鸡蛋清1个鸡汤200克葱姜末1.5克湿淀粉5克芝麻油2.5克花生油500克（约耗100克）","p":["1。将鸡肉、肥肉剁成泥。荸荠剁成细末。海参、冬笋、冬菇均切小方丁。面包去皮切成3片，每片长10厘米、宽6厘米、厚5毫米。","鸡肉、肥肉泥、荸荠末、葱姜末、精盐1.5克、鸡蛋清搅拌均匀，抹在每片面包上。3。炒勺内倒入花生油500克，中火烧至六成热时，将抹上鸡肉泥的面包托，放入油内炸透，见炸至金黄色时捞出，放在菜墩上，切成长条，整齐地摆在盘内。4。炒勺内放入花生油50克烧热，烹上料酒、鸡汤、精盐、蟹黄、海参、冬笋、冬菇烧沸撤沫，·再用湿淀粉勾芡，淋入芝麻油浇在面包鸡托上即成。"]},{"i":331,"n":"湖菜鸡块","r":"鲁菜·济南","o":"鲁菜300种","f":"清爽鲜嫩，做法新颖，湖菜集锦，是济南历下风味特色菜。69","c":"热菜","m":["爆炒"],"g":["鸡肉","莲子","蒲菜","鸡蛋"],"s":["盐","酱油","葱","高汤","花椒","料酒","味精","姜","蒜","淀粉"],"t":["炒锅"],"v":0,"a":"主料：开膛雏鸡250克｜配料：芡白鲜菱角嫩藕鲜莲子蒲菜荷花瓣共150克｜调料：精盐1.5克酱油10克蛋清1个清汤100克葱椒料酒10克味精1克葱姜蒜末5克湿淀粉10克猪油500克（耗75克）","p":["1。先将鸡肉两面交叉划上刀纹，深度3毫米，再切成长3厘米、宽1.5厘米的长方块，放入碗内加鸡蛋清、精盐、湿淀粉养好渍匀。莲子去皮投去心，蒲菜、藕、菱角、白削去皮，均切成2厘米的片，用沸水烨过。荷花瓣去掉根头。","另用清汤75克，湿淀粉、酱油、味精、葱椒料酒倒在一起对成汁。","炒勺内倒入白油，旺火烧至四成热时，放入鸡块，炸至八成熟时，随即将油倒出，烹上葱姜蒜末炸至放香，将所有配料放入炒勺内煸炒，并与鸡肉混合，倒入对好的汁搅炒翻匀，装入盘内，撒上荷花瓣即成。"]},{"i":332,"n":"神仙鸭子","r":"鲁菜·济南","o":"鲁菜300种","f":"鸭肉香烂清鲜，肥而不腻。注；此菜系山东名菜，历史悠久，相传四五百年了，作该案烹饪技术工艺严，在清代孔府及山东济南、济宁等","c":"热菜","m":["蒸"],"g":["鸭肉","火腿","香菇","冬笋","口蘑"],"s":["盐","酱油","料酒","高汤","葱","姜"],"t":["炒锅","蒸锅","砂锅"],"v":0,"a":"主料：宰好的填鸭1只（约2500克）｜配料：火腿冬菇玉兰片口蘑各50克｜调料：精盐15克酱油50克清汤1000克料酒50克葱：片50克姜片15克玻璃纸半张","p":["1。将鸭洗净，砸断小腿骨环，剔去鸭掌大骨，抽去舌及食管，剁去嘴，在咳袋处剁断脖颈（皮不可剁断）。放入水锅内小火烧沸煮半小时左右（约四成熟）捞出在冷水内洗净油污，择净皮上的毛根，抽去脊骨，割去肛门、鸭躁。头塞入胸脯内，葱姜片塞入腹内。2，火腿切长5厘米、宽2厘米、厚3毫米的片；玉兰片用刀拍一下撕成长5厘米的段；口蘑、冬菇去根洗净切成两半。","取大砂锅1个（或鸭池），将鸭脊骨剁断，放在砂锅底，鸭放在骨上（腹面朝上），口蘑放在鸭腹中间成一行，玉兰片、火腿、冬菇分别横摆在口蘑的两边。再将清汤、精盐、酱油、料酒对成汁倒入砂锅内，用玻璃纸将砂锅口盖严捆紧（防止笼内的汽水滴进锅内，以保持鸭鲜味），放入蒸笼内用大火蒸3小时左右熟烂后，取出砂锅揭去纸，撇去浮油即成。70"]},{"i":333,"n":"绣球鸡胗","r":"鲁菜","o":"鲁菜300种","f":"鸡胗形似绣球，味香美，软而有劲。","c":"热菜","m":["烧扒焖"],"g":["鸡肉","猪肉"],"s":["葱","姜","桂皮","八角","花椒","酱油","料酒","高汤"],"t":["炒锅"],"v":0,"a":"主料：鸡胗500克．｜配料：肥瘦猪肉100克｜调料：葱20克姜5克药料（桂皮八角白芷丁香苹果砂仁花椒各少许)酱油100克料酒15克清汤500克","p":["1。把鸡胗切成两半，撕去内里黄皮洗净，每隔2毫米上刀纹，在沸内焯过，猪肉切成4片。","将药料用纱布包好，和以上所有的主料、配料、调料均放入一个锅内，用旺火烧沸撇去浮沫，小火煮熟，捞出鸡胗即成。"]},{"i":334,"n":"雪花鸭肝","r":"鲁菜·济南","o":"鲁菜300种","f":"此菜上面色白如雪花，底面包末焦脆色金黄，鸭肝软嫩鲜香味美，是济南名菜。","c":"热菜","m":["炸"],"g":["鸭肉","面粉","鸡蛋"],"s":["盐","料酒","味精","淀粉"],"t":["炒锅"],"v":0,"a":"主料：鸭肝200克｜配料：细面包末100克｜调料：精盐2.5克料酒30克味精1克鸡蛋清3个精粉10克湿淀粉30克猪油500克（约耗100克）","p":["将鸭肝洗净，按鸭肝的长度片成厚3毫米的片共16片，撒上精盐稍腌。722．将鸡蛋清、湿淀粉、精粉、料酒、味精放一个碗内调匀成糊。","每片鸭肝片先沾上一层薄薄的精粉，再沾一层糊，每片的底面再沾上一层细面包末。4，炒勺内倒入猪油，烧至六成热时，将沾上面包末的鸭肝片放入油内炸透取出，有面包末的面朝下整齐地摆入盘内即成。"]},{"i":335,"n":"吐丝鸽蛋","r":"鲁菜","o":"鲁菜300种","f":"面包托酥脆，鸽蛋、鸡料鲜嫩，形美味香。","c":"热菜","m":["炸"],"g":["面粉","鸡肉","火腿","香菇","菠菜","白菜","猪肉","荸荠","鸡蛋"],"s":["淀粉","料酒","味精","盐"],"t":["炒锅"],"v":0,"a":"主料：鸽蛋6个｜配料：面包200克鸡料子50克30克火腿末5克冬菇末5克菠菜叶末(或嫩青菜心末)5克肥肉末50克荸荠末30克｜调料：鸡蛋清3个湿淀粉20克料酒10克味精1克精盐3克白油1000克（约耗50克30克）","p":["面包切长六厘米、宽4厘米、厚4毫米的片，共12片。鸽蛋在冷水内下锅，慢火煮熟，·放入凉水内泡后剥皮，每个鸽蛋切成两半。","鸡料子内加入鸡蛋清、肥肉末、荸荠末、料酒、味精、精盐、白油少许后顺搅上劲，色白如雪时成为“鸡料糊”。733。将鸡料糊薄薄一层涂到每片面包上，再把鸡料耦捏成约3厘米大小的块，放于面包片的中心，一边拓上鸽蛋、另一边涂上火腿、冬菇、菜心末成为“鸽蛋托”。","炒勺内放入油烧至五成热时，将鸽蛋托下入油中，小火炸至漂起，见油冒细泡时，捞出平摆在盘内即成。吃时也可蘸花椒盐面、辣酱油。"]},{"i":336,"n":"鸳鸯蛋","r":"鲁菜","o":"鲁菜300种","f":"鲜嫩味香，用鸡肉与鸡蛋制成红白两半的整个鸡蛋而得名。","c":"热菜","m":["蒸"],"g":["鸡蛋","鸡肉","猪肉","荸荠","鸭肉"],"s":["盐","葱","花椒","料酒","高汤","味精","淀粉"],"t":["炒锅","蒸锅"],"v":0,"a":"主料：鸡蛋6个·鸡脯肉泥150克｜配料：猪肥膘肉泥50克荸荠泥50克｜调料：精盐3克鸡蛋清3个清汤200克葱椒料酒10克料酒10克味精1克湿淀粉30克鸡（鸭）油10克红食色微量","p":["鸡蛋下入凉水锅内，慢火烧沸煮6分钟左右熟透捞出，在凉水中剥去外壳，每个蛋竖切为两半，用精盐、葱椒料酒腌渍约10分钟。","鸡脯肉泥放入碗内加消汤、肥肉泥、荠泥向一个方向顺搅上劲。","鸡蛋溃磕入碗内，用竹筷子搅打直至起细泡沫时，倒入鸡肉泥碗内，加精盐、味精、料酒、红食色、湿淀粉再顺一个方向搅至发稠成为料子，抹在鸡蛋在切过的面上，成原鸡蛋形状，放入盘内（鸡泥面朝上），上笼用旺火蒸5克74钟取出，控去水分，整齐地摆在盘内。4，炒勺内倒入清汤、精盐、葱椒料酒，湿淀粉勾芡，沸后淋上鸡（鸭）油，浇在“鸳鸯蛋”上。"]},{"i":337,"n":"荷包鸡蛋","r":"鲁菜·孔府","o":"鲁菜300种","f":"：软嫩鲜香，汤清味美，是曲阜地方风味菜肴。75","c":"热菜","m":["蒸"],"g":["鸡蛋","猪肉"],"s":["盐","酱油","葱","姜","料酒","味精","高汤","淀粉","香油"],"t":["炒锅","蒸锅"],"v":0,"a":"主料：鸡蛋4个瘦猪肉100克｜调料：精盐2克酱油10克葱末5克·姜末1.5克料酒15克味精1克清汤200克湿淀粉50克香油5克花生油10克","p":["1。","将猪肉剁成泥，放入碗内，加葱姜末、精盐、酱油、香油、料酒顺搅匀成馅；鸡蛋磕入碗内加湿淀粉搅匀。","2。","炒勺底擦上一层油，放在中火上，将蛋汁倒入勺底（分八次）晃匀，摊成直径7厘米的饼（不能烙糊，保持软嫩）。","再把馅投入蛋皮中心，四边折起，用筷子夹一下，封住口（形如荷包），取出。","有口的一面朝下，排在磅内，加上清汤150克，·上笼用旺火蒸10分钟左右取出扣入盘内。","3。","将蒸荷包蛋的汤倒入炒勺内，加精盐、料酒、味精、酱油、清汤烧沸，撇去浮沫浇在鸡蛋荷包上即成。"]},{"i":338,"n":"筒子鸡","r":"鲁菜","o":"鲁菜300种","f":"鸡肉肥美不腻，香气扑鼻，佐酒佳肴。","c":"热菜","m":["蒸"],"g":["鸡肉"],"s":["花椒","葱","姜","盐","料酒"],"t":["蒸锅"],"v":0,"a":"主料：宰好的肥母鸡1只（约1250克）｜调料：小茴香1.5克丁香半分花椒1克白芷0.5克葱段100克姜丝25克精盐20克料酒50克","p":["将母鸡择洗干净，用精盐、葱姜丝在鸡的全身揉搓一遍，再把葱姜、料酒、小茴香等药料都装入鸡腹腔内，鸡放入大磁碗内，上笼用旺火蒸2小时左右，取出晾凉。","去掉腹内药料，把鸡剁成长5厘米、宽3厘米的长方块，原样整齐地摆入盘内即成。"]},{"i":339,"n":"芝麻鸭","r":"鲁菜","o":"鲁菜300种","f":"色泽金黄，内里肉烂，外皮酥脆，芝麻浓香。","c":"热菜","m":["炸"],"g":["芝麻","鸭肉","面粉","鸡蛋"],"s":["盐","葱","姜","桂皮"],"t":["炒锅","蒸锅"],"v":0,"a":"主料：宰好的鸭子1只（约重2000克）｜配料：芝麻仁50克：面包末150克鸡蛋2个·面粉50克｜调料：精盐50克葱丝50克姜丝15克砂仁豆蔻丁香桂皮白芷各1克花生油1500克（约耗150克）","p":["1，将鸭子择洗干净，剁去头脖、翅尖、小腿。用精盐把鸭身内外搓匀（不要把皮搓破），装入大盘内；将葱丝、姜丝、砂仁、豆蔻、丁香、桂皮、白芷放在鸭上，上笼蒸76烂，取出去掉药料。2，把鸭剔去骨头，放在盘内，皮面朝下，肉面朝上，撒上薄薄一层面粉。","鸡蛋磕入碗内，加面粉搅匀成糊，均匀地抹在鸭肉上，在带皮的一面沾上芝麻仁，肉面沾上面包末。4。炒勺内倒入花生油，在旺火上烧至七成热时，把鸭肉慢慢推入油内，先炸皮面，后炸肉面，炸成金黄色（约5分钟左右）捞出，切成长条块或菱形块均可，将有芝麻的一面朝上整齐地码在盘内。"]},{"i":340,"n":"香鸭冻","r":"鲁菜","o":"鲁菜300种","f":"鸭肉熟烂，凝冻浓香，清凉爽口，是很好的冷盘碟料。","c":"凉菜","m":["蒸"],"g":["鸭肉","猪肉"],"s":["盐","酱油","高汤","葱","姜"],"t":["炒锅","蒸锅"],"v":0,"a":"主料：鸭肉500克猪肉皮150克｜调料：精盐5克·酱油50克清汤500克葱段10克姜片5克药料2.5克","p":["将鸭肉洗净，放入锅内煮透捞出；猪肉皮刮洗干净，放水锅内煮5分钟，捞出切成细丝；药料用洁白布包扎好。","将鸭肉、猪肉皮丝、清汤、酱油、精盐、葱段、姜片、药料均放入小盆内，上笼蒸至鸭肉熟烂取出，捞出葱姜、药料、猪肉皮丝，撇去汤面上的浮油浮沫，把鸭肉平摆在长方形的搪瓷盘内，蒸鸭的汤用纱布过滤后倒鸭肉盘内，晾后放入冰柜内冻凝取出，切成长5厘米、宽3厘米、厚5毫米的片，摆入盘内即成。"]},{"i":341,"n":"奶汤百子蒸鸭","r":"鲁菜","o":"鲁菜300种","f":"鸭肉香烂，丸子软嫩，奶汤洁白香醇味美，点缀各种配料美观，是宴席上的大件莱。","c":"汤羹","m":["蒸","烩汆"],"g":["鸭肉","鸡肉","香菇","猪肉","猪腰","火腿","冬笋","白菜"],"s":["高汤","盐","料酒","味精","淀粉","葱","姜"],"t":["炒锅","蒸锅"],"v":0,"a":"主料：开膛肥鸭1只鸡料子150克｜配料：香菇20克冬菇1个肥肉腰50克火腿1片玉兰片2片嫩苔菜梗20克菜心两支，｜调料：精盐20克料酒50克味精2.5克湿淀粉25克葱姜各1块姜汁15克清汤500克250克奶汤1000克·葱油50克","p":["1。将鸭子择洗干净，放入水锅内煮一个滚捞出，上笼蒸五成熟，将骨全部剔出，撕去脖筋，割去鸭、肛门，皮朝下放在板上在里面每隔2厘米划至半深的刀纹，皮朝下定在盆内，放上鸭骨、香菇、葱1段、姜1块、精盐、料酒上笼蒸烂。","冬菇、香菇、玉兰片、苔菜梗，莱心均用：沸水焯过；肥肉切2毫米见方的粒状与鸡料子混合搅匀成料。","勺内倒入清汤500克，烧二成热时，将鸡料子挤成直径1厘米大的丸子下入汤内，烧沸撤沫捞在鸭池内。","将蒸烂的鸭肉从笼内取出，去掉葱姜和鸭骨，鸭肉扣在鸭池内的丸子上。5。净炒勺内倒入葱油烧热，再倒进全部清汤、奶汤和78蒸鸭的汤，在中火上稍，加精盐、料酒、姜汁、湿淀粉、味精烧沸浇在鸭池内。火腿片摆在鸭的头部，冬菇盖在鸭尾部，菜心玉兰片掉角摆在翅上、苔菜梗在中间即成。"]},{"i":342,"n":"香酥鸭","r":"鲁菜","o":"鲁菜300种","f":"鸭皮香酥，肉烂味香，整鸭上桌，用筷子一拨，肉骨即脱离，是席中大件。注：“香酥鹤蒋”的制法与香酥鸭制法相同，但因鸦体形小，","c":"热菜","m":["炸"],"g":["鸭肉"],"s":["盐","酱油","葱","姜","料酒","八角","花椒"],"t":["炒锅","蒸锅"],"v":0,"a":"主料：宰好的肥鸭1只（约重1500克）·｜调料：精盐20克酱油100克葱50克姜半两、料酒20克八角花椒各5克花生油1500克（约耗100克）","p":["1。将鸭洗净，刹去小腿骨。用花椒、精盐在鸭身内外搓匀，再放上葱姜丝、八角、酱油、料酒腌约3小时，装在盘内，上笼用旺蒸烂（约3一4小时）取出，控去原汤。","锅内倒入油在旺火上烧至八成热时，把蒸熟的鸭子.放入油内炸，至四周均呈紫红色取出，摆入盘内。（炸鸭子时，必须勤翻动，使四面色泽均匀）。上桌时，辣酱油、花椒盐面分别装入小碟内，佐食。，"]},{"i":343,"n":"蕃茄鸡球","r":"鲁菜","o":"鲁菜300种","f":"色泽鲜红光亮，软嫩香美，有酸、甜、咸、香味道。注：按以上烹调法，用虾肉制做即称“虾球”。用鱼肉谢做郎称“鱼球”。","c":"热菜","m":["爆炒"],"g":["鸡肉","猪肉","火腿","黄瓜","香菇","豌豆","西红柿","鸡蛋"],"s":["葱","姜","白糖","盐","淀粉"],"t":["炒锅"],"v":0,"a":"主料：鸡肉150克｜配料：火腿10克黄瓜皮25克水发冬菇5克青豆15粒｜调料：番茄酱100克葱末5克姜末1.5克鸡蛋清5个白糖25克精盐2.5克湿淀粉25克猪油15克，花生油2片（约耗100克）","p":["1，将鸡脯肉上的脂皮，白筋剔净，放在板上，用刀背硬成细泥，放入碗内，加鸡蛋清、精盐1.5克，湿淀粉、猪油、葱姜末搅匀成馅；火腿、冬菇、黄瓜皮均切1厘米的方·丁片，与青豆同放入沸水内焯过。.2。炒勺内放入花生油，在中火上烧至五成热时，把勺移在小火上，将鸡肉泥馅挤成直径1.5厘米大的丸子，逐个下入油内，再移至中火上，·用手铲不断拨动，约炸5分钟成鸡球。","另用炒勺放入花生油50克，在旺火上烧至八成热时，放入蕃茄酱，用手勺搅动沸熟，再放入精盐、白糖、火腿、冬菇、黄瓜皮翻炒几下，此时将油内炸的鸡球捞在有蕃茄汁的炒勺内（鸡球已膨胀成直径3一4厘米大的球），迅速颠翻，使蕃茄酱汁均匀地沾在鸡球上，盛入盘内即成。"]},{"i":344,"n":"余捶鸡片","r":"鲁菜","o":"鲁菜300种","f":"鸡肉片特别软嫩，汤清鲜味美。1OO","c":"热菜","m":["烧扒焖"],"g":["鸡肉","猪肉"],"s":["高汤","盐","料酒","味精","酱油","淀粉"],"t":["炒锅"],"v":0,"a":"主料：鸡脯肉100克｜配料：豆苗25克｜调料：清汤400克精盐1.5克料酒10克味精1克酱油5克干淀粉150克","p":["将鸡脯肉上的脂皮白筋剔净，片成3厘米长的片，撒上料酒和盐水稍腌，在干淀粉中蘸过后，放在板上，用木挂的平面捶打鸡肉片，边捶打边蘸干淀粉，使鸡脯肉延展成直径6厘米大的薄片。豆苗择洗干净，用沸水焯过。","将捶好的鸡片放入沸水锅内迅速烧沸焯透捞在冷水盆内，倒净水，再用开水冲一下，放在汤盘中。","清汤倒入炒勺内，加料酒、精盐、酱油烧沸撒沫，放入豆苗、味精将汤浇在鸡片的汤盘中即成。·"]},{"i":345,"n":"德州扒鸡（做法二）","r":"鲁菜·德州","o":"鲁菜300种","f":"扒鸡外皮红润光亮，肉质肥嫩，味道鲜美。：注1、德州扒鸡又名五香脱骨扒鸡，是山东著名食品，相传有一百余年历史；其声誉较高，","c":"热菜","m":["烧扒焖"],"g":["鸡肉","口蘑"],"s":["姜","酱油","盐","白糖"],"t":["炒锅"],"v":0,"a":"主料：活鸡5只（约5000克）83｜调料：口蘑10克姜50克酱油750克药料10克精盐200克怡糖100克花生油5000克（约耗300克）","p":["1：将活鸡宰杀择洗干净，剥去爪上老皮，在鸡腹下近肛门处横开一寸长的刀口，取出内脏、食管、割去肛门洗净。将鸡的左翅自脖下刀口插入，使翅尖由嘴内侧伸出，别在背上；右翅也别在背上，两大腿骨用刀背轻轻砸断并起交叉，将两爪塞入鸡腹内，凉干水分。","始糖加清水250克调匀，均匀地涂在鸡身上；锅内倒入花生油，烧至八成热，将鸡入油炸成金黄色捞出，沥净油","锅内放入炸好的鸡，加水（以漫过鸡为度）、药料（洁白布包扎）、生姜（用刀拍扁）、精盐、口蘑、酱油，用铁筆子压住鸡，在旺火上烧沸，撇去浮沫，移至微火上焖煮（保持似开非开，不能滚沸），至鸡酥烂时即可。煮鸡的时间要根据不同季节和鸡的老嫩而定。捞鸡时切勿损坏鸡皮，保持鸡外形美观。煮鸡的原汤可留作下次煮鸡继续使用，使鸡肉香味更加醇厚。"]},{"i":346,"n":"炒鸡汁豆泥","r":"鲁菜","o":"鲁菜300种","f":"软嫩香美，制法精细，宜老年人食用。","c":"热菜","m":["爆炒"],"g":["鸡肉","猪肉","猪腰","火腿","鸡蛋"],"s":["盐","料酒","味精","高汤","淀粉","葱","姜"],"t":["炒锅"],"v":0,"a":"主料：鸡芽子肉100克｜配料：毛豆子150克肥猪肉腰50克火腿末少许｜调料：精盐1.5克料酒10克味精1克清汤150克鸡蛋清4个湿淀粉25克葱姜末3克香莱末5克猪油50克25克","p":["鸡芽子肉先用清水稍泡后剔净白筋，与猪肥肉放板上，用刀背砸成细泥，放碗内加鸡蛋清用筷子顺一个方向搅匀。","毛豆子沸水焯过去薄膜皮，剁成细泥。","鸡肉泥加精盐、料酒、味精、清汤、湿淀粉、毛豆泥揽匀。4。炒勺内倒入猪油，烧六成热时，放入葱姜末炸出香味，将搅好的鸡肉豆泥边往勺内倒边搅炒，熟后盛盘内撒上香菜末、火腿末即成。、"]},{"i":347,"n":"碧桃鸡","r":"鲁菜","o":"鲁菜300种","f":"此菜“芙蓉”洁白，菠菜碧绿，软嫩清口。","c":"热菜","m":["蒸"],"g":["鸡肉","猪肉","核桃仁","鸡蛋"],"s":["盐","酱油","淀粉","葱","花椒","料酒","味精","姜","高汤"],"t":["炒锅","蒸锅"],"v":0,"a":"主料：嫩鸡脯肉150克鲜核桃仁100克｜调料：精盐1.5克酱油5克鸡蛋清1个湿淀粉2420克葱椒料酒10克味精1克清汤100克葱姜末2.5克猪油500克（约耗50克）","p":["先将鸡脯上的脂皮剔净，片成薄片；将鸡蛋清、精盐、湿淀粉都放入一个碗内搅匀成糊，将糊抹在每片鸡肉片的周围，中心放1角鲜桃仁进行包卷，共12个，包完处沾一层糊称“碧桃鸡”。","将清汤、精盐、酱油、湿淀粉、葱椒料酒、味精同放在一个碗内对成汁。","炒勺内放猪油烧至六成热时，碧桃鸡入油内炸透，勺内留底油，烹入葱姜末，再倒入碗内对好的汁，颠匀翻过即成。点鸡肉桃仁鲜嫩味美，夏令时菜。一〇三余芙蓉蛋颗料主料：鸡蛋清4个配料：菠菜心25克網料：清汤400克精盐1.5克酱油1鲲做法","将莱心洗净切成4厘米长的最。鸡蛋清磷入碗内与清汤75克、精盐搅匀，上笼用中火蒸约4分钟取出（不宜蒸老）即成“芙蓉”。.2.炒勺内放入清汤，烧沸后加酱油、菠菜撇去浮沫，盛在汤碗内，把蒸制的“芙蓉”用手勺留入汤碗。"]},{"i":348,"n":"宫保鸡丁","r":"鲁菜","o":"鲁菜300种","f":"．鸡脯肉嫩，花生米脆香，有辣甜咸味道，色泽彤红油亮。注：此菜为清末山东巡抚丁宝祯的公馆厨师所创；驰名中外。86","c":"热菜","m":["爆炒"],"g":["鸡肉","猪肉","辣椒","鸡蛋"],"s":["盐","酱油","白糖","葱","姜","蒜","高汤","料酒","淀粉"],"t":["炒锅"],"v":0,"a":"主料：嫩鸡脯肉200克｜配料：炒熟花生米50克｜调料：干红辣椒10克精盐1.5克酱油15克鸡蛋清1个白糖25克清汤50克葱姜蒜末10克料酒5克湿淀粉40克花生油500克（约耗40克）","p":["将鸡脯肉两面均用刀“打”过，再切成2厘米见方的丁，放入碗内加精盐、鸡蛋清、湿淀粉20克渍匀。干红辣椒去籽切丁。酱油、精盐、湿淀粉、料酒、清汤、同放一个腕内对成汁。花生米去皮捏成两半。","炒勺内倒入花生油，烧至五成热时，将鸡丁下入油内，用铁筷子搅动拨散滑至八成熟时捞出；炒勺内留油20克，放入白糖炒成红色时，加入干红辣椒、葱姜蒜末，烹入料酒，下入滑好的鸡肉丁颠翻，随即倒入对好的芡汁，再加入花生米颠炒均匀，盛入盘内即成。"]},{"i":349,"n":"水晶鸡","r":"鲁菜","o":"鲁菜300种","f":"鸡肉清香，嫩烂不腻，汤冻味鲜，凉爽可口，常用于冷盘碟料。因汤冻透明似水晶，而故名，又称盐水鸡。","c":"热菜","m":["蒸"],"g":["鸡肉","猪肉"],"s":["盐","高汤","葱","姜","花椒"],"t":["炒锅","蒸锅"],"v":0,"a":"主料：光鸡1只（约重750克）·猪肉皮250克｜调料：精盐10克清汤500克葱段50克姜1块（25克）花椒3克","p":["1，将鸡洗净，用刀刹去嘴、爪、翅尖，放入水锅内旺火烧沸，撇去浮沫，移至中火上煮五成熟时，捞出从脊背部劈为两片；猪肉皮刮洗干净，放入沸水锅内煮5分钟，捞出切成细丝。","将鸡、猪肉皮丝、清汤、葱段、姜（拍碎）、花椒（用纱布包好）均放入一个小瓷盆内，上笼用旺火蒸约两小时取出，捞出葱姜、花椒和猪肉皮丝不用，撇去汤面上的浮油浮沫，冷凉后，放入冰柜冰透，取出将鸡剁成4厘米长的、段，与冻一起装盘即成。"]},{"i":350,"n":"烹鸡绒饼","r":"鲁菜","o":"鲁菜300种","f":"，鸡绒饼软嫩鲜香，色金黄，可做宴席冷菜。","c":"热菜","m":["爆炒"],"g":["鸡肉","猪肉","香菇","火腿","白菜","鸡蛋"],"s":["盐","料酒","酱油","味精","淀粉","葱","姜","高汤"],"t":["炒锅"],"v":0,"a":"主料：鸡脯肉100克猪肥膘肉25克｜配料：香菇火腿各15克油菜心4个｜调料：精盐2.5克酱油5克料酒10克味精1克鸡87蛋清1个半湿淀粉15克葱姜3克清汤半两猪油250克","p":["1，鸡脯肉切成细丝。","油菜叶用沸水焯过与火腿、香菇均切细丝。","鸡脯肉放入碗内加精盐、鸡蛋清、湿淀粉抓匀养好。","配料加精盐、味精、料酒渍匀再与鸡肉丝合：在一起调匀。","2。","炒勺内先倒入猪油50克，烧至三成热时，移在小火上，将鸡肉丝挤成12个丸子下入油内煎，不住晃动炒勺防止沾底，煎至挺身时，用手勺底逐个压成小饼形，再翻过来煎（此时勺内再加油），煎透煎匀，将油凈出，移在中火上，将清汤、酱油、料酒、味精、湿淀粉对成汁烹入勺内，使饼翻个，出勺即成。"]},{"i":351,"n":"溜黄菜","r":"鲁菜","o":"鲁菜300种","f":"此莱鲜香味美，软嫩如豆腐脑，因有各色配料色浅黄美观，成熟后自然颤动。","c":"热菜","m":["烧扒焖"],"g":["鸡蛋","鸡肉","猪肉","海米","荸荠","火腿","海参"],"s":["香菜","盐","料酒","淀粉","高汤"],"t":["炒锅"],"v":0,"a":"主料：鸡蛋黄3个鸡蛋1个｜配料：熟鸡肉25克海米15克南荠2个火腿末5克海参15克香菜末少许｜调料：精盐2.5克料酒15克：清汤200克湿淀粉10克花生油50克半","p":["1。","将鸡蛋黄与鸡蛋磕入一个碗内打匀。","将海米、海参、南荠、鸡肉切成3毫米的方丁与精盐、料酒、清汤、湿淀粉一起放入鸡蛋黄碗内搅匀。","882.炒勺涮洗干净，倒入花生油烧至八成热时，倒入鸡蛋用手勺推炒，越快越好以免糊底，熟时（不要炒老）盛入汤盘内，撒上香菜末与火腿末即成。"]},{"i":352,"n":"炒烤鸭丝","r":"鲁菜","o":"鲁菜300种","f":"鸭脯肉与绿豆芽色白明亮，脆嫩鲜香，清口。","c":"热菜","m":["爆炒","烤"],"g":["鸭肉","猪肉","豆芽"],"s":["香菜","盐","高汤","葱","花椒","料酒","味精","姜","酱油","香油"],"t":["炒锅"],"v":0,"a":"主料：熟鸭脯肉200克｜配料：绿豆芽300克香菜梗50克｜调料：精盐4克清汤100克葱椒料酒10克味精1克慈姜丝5克酱油10克香油10克：猪油50克：","p":["1。","将绿豆芽的头、根掐去，用清水洗净控去水分。","香菜梗切成长3厘米的段，鸭脯切成丝。","清汤、酱油、精盐、料酒、味精放--个碗内对成汁。","2。","炒勺内放入猪油，旺火烧六成热时放入葱姜丝炸至放香，随即将鸭肉丝、绿豆芽进行翻炒，倒入对好的汁，和香菜梗颠翻均匀，淋上香油出勺即成。"]},{"i":353,"n":"炸鸽蛋托","r":"鲁菜","o":"鲁菜300种","f":"面包香脆，鸡料嫩美，上面衬以蛋和菜心，色调和谐美观。吃时也可蘸花椒盐和辣酱油。","c":"热菜","m":["炸"],"g":["鸡蛋","鸡肉","面粉","火腿","香菇","荸荠","猪肉"],"s":["盐","料酒","味精","淀粉"],"t":["炒锅"],"v":0,"a":"主料：鹑蛋6个鸡料子100克面包200克8.｜配料：火腿末冬菇末青莱心末马蹄末各10克肥肉末50克｜调料：精盐5克鸡蛋清2个料酒15克味精1克湿淀粉20克花生油500克（耗75克）","p":["1，将面包切成长5厘米、宽4厘米、厚3毫米的片共12片。鹤鹑蛋温水慢火煮熟，剥去外皮，每个蛋切成两瓣。","鸡料子用少许清汤邂开，加入鸡蛋清、肥肉末、马蹄末、料酒、味精、精盐、猪油5克搅匀，搅时顺一个方向搅至上劲，色白如雪时即成为鸡料糊。，3。将少量鸡料潮先涂在每块面包片上薄薄一层，再另把鸡料糊捏成2厘米大的圆块，放在每片面包的中间，一边扣上鹤鹑蛋，另一边涂上火腿、冬菇。菜心三种末，成为鸽蛋托。4，炒勺内倒入花生油，烧至五成热时，将鸽蛋托下入油内炸，至漂起油冒细泡时，捞出摆在平盘内。"]},{"i":354,"n":"芙蓉鸡鸭腰","r":"鲁菜","o":"鲁菜300种","f":"鸡鸭腰与芙蓉色白软嫩，汤味鲜美。","c":"热菜","m":["蒸"],"g":["鸡肉","鸭肉","猪腰","鸡蛋","火腿","口蘑"],"s":["盐","料酒","味精","高汤","淀粉","葱","姜"],"t":["炒锅","蒸锅"],"v":0,"a":"主料：鸡鸭腰200克鸡蛋清4个｜配料：火腿口蘑各15克苔花4朵｜调料：精盐3克料酒15克味精1克清汤300克湿淀粉5克葱姜末2.5克葱油10克猪油15克06","p":["1.鸡蛋清磕入盘内搅打，加入清汤200克，料酒5克，啸精0.5克，精盐继续搅打均匀，放入笼内蒸4分钟即熟（不要蒸老）即为芙蓉。","2。","炒勺内倒入温水，放入鸡鸭腰稍煮，捞至冷水内，用小刀划破外表薄膜皮随即剥去，与配料火腿片、·口蘑片一并在沸水内焯过。","3。","炒勺内放入猪油烧热，投入葱姜束炸出香味，加入清汤捞出葱姜末不用，将主料、配料、调料一齐下入勺内开起撤沫，加味精，淋上葱油浇在英蓉盘内即成。","·。"]},{"i":355,"n":"榻鸡千","r":"鲁菜","o":"鲁菜300种","f":"此菜底面黄色，上面绿色，层次分明，鸡肉软嫩味鲜美。92","c":"热菜","m":["煎塌"],"g":["鸡肉","猪肉","菠菜","鸡蛋"],"s":["盐","高汤","料酒","味精","淀粉","葱","姜","花椒"],"t":["炒锅"],"v":0,"a":"主料：嫩鸡脯250克肥膘猪肉100克｜配料：菠菜叶12个｜调料：精盐4克鸡蛋2个.清汤100克料酒15克味精2克湿淀粉15克精粉30克葱姜丝5克葱椒泥5克小茴香面半分花生油500克（耗50克）。","p":["将鸡脯肉片成长、宽各4厘米、厚2毫米的片共12片。剩余的鸡脯肉剁成泥，加入鸡蛋清和料酒、味精、精盐、葱姜末、小茴香面顾一个方向搅匀成鸡肉泥糊。","菠菜叶和肥腮肉均切与鸡脯肉同样大小的片各12片，但肥肉片上必须用刀尖截上儿个跟（否则遇热会打卷）。913.先将肥肉片铺平在案上，敷上一层2毫米厚的鸡肉泥，盖上一片鸡脯肉片，鸡肉片上抹一层鸡肉泥，盖上一片菠菜叶，做12块成为“鸡扦”。鸡蛋黄和湿淀粉、精粉放一个碗内搅匀成蛋黄糊。4。炒勺内倒猪油烧至五成热时，将鸡扦底面沾上薄薄一层精粉，再沾上一层蛋黄糊，下入油内煎，至底面稍发硬时，翻过来再煎上面至淡黄色时，将勺内油倒出，加入清汤、精盐、葱椒泥移至微火上收，至汤汁将尽时淋上味精水，出勺翻扣在盘内即成。"]},{"i":356,"n":"糖醋鲤鱼（做法二）","r":"鲁菜·济南","o":"鲁菜300种","f":"颜色金黄，鱼尾高跷形似跳龙门，外皮酥脆，鱼肉嫩美，其汁甜、酸、微咸，是济南名菜。注：吃完鱼肉，将鱼头、尾放入锅中(鱼头砸","c":"热菜","m":["炸"],"g":["鲤鱼","鸡蛋"],"s":["白糖","醋","酱油","盐","淀粉","葱","姜","蒜","高汤"],"t":["炒锅"],"v":0,"a":"主料：黄河鲤鱼1条（约重750克左右）。｜调料：白糖250克醋100克酱油15克精盐5克湿淀粉300克鸡蛋黄2个葱姜蒜末共15克清汤250克花生油2500克（约耗200克）","p":["1，把鱼挖腮、刮鳞、去五脏洗净。在鱼身两面每隔2.5厘米宽划一刀（大翻刀），提起鱼尾使刀口张开。撒上少量精盐稍腌，均匀地涂上一层鸡蛋黄和湿淀粉合成的。2。锅内倒入花生油，烧至七成热时，手提鱼尾（使刀口张开）放入油内，此时用锅铲托住，以免粘锅底，后用铲把鱼推向锅边，鱼身即成弓形。鱼脊朝下炸3分钟，待呈金黄色见已炸透，捞出摆入盘内。","锅内留余油100克，烧热烹入葱姜蒜末，炸至放香，烹上醋，随即加入清汤，酱油、白糖烧沸，用湿淀粉勾芡成浓汁，迅速浇到已炸好的鱼上，其汁冒泡有哎哎啦啦声即成。"]},{"i":357,"n":"干烧鱼","r":"鲁菜","o":"鲁菜300种","f":"：色红亮油润；鱼肉鲜嫩，味辣、甜、咸香。94","c":"热菜","m":["烧扒焖"],"g":["鱼肉","猪肉","冬笋","辣椒","香菇"],"s":["白糖","葱","姜","酱油","蒜","料酒","辣椒油","盐","高汤"],"t":["炒锅"],"v":0,"a":"主料：鲜鱼2条（约重750克）｜配料：猪肉50克冬笋25克榨菜25克干红辣椒3个冬菇25克｜调料：白糖75克酱油40克葱姜蒜末各3克料酒50克猪油25克辣椒油15克清汤500克精盐2.5克花生油1000克（约耗50克）","p":["1，将鱼挖腮、去五脏洗净，用洁布振干水分，在鱼的两面每隔2厘米划上刀纹（深度至鱼大脊骨)，抹上酱油；将以上配料均切1厘米见方的丁。．","炒勺内倒入花生油，烧至七成热时，将鱼下入油内，.炸至呈红色时放入葱姜蒜、红辣椒丁稍煸，再放入猪肉丁，榨菜丁、冬笋、冬菇煸炒一下，随即烹入酱油，加清汤（汤要漫过鱼），料酒、白糖（50克），精盐烧沸后撇沫，再将炸过的鱼放入汤内，移至小火上20分钟左右（中间鱼要翻过），汤汁绝大部分燥尽时，汁味已收进鱼肉内，淋上辣椒油出勺即成。"]},{"i":358,"n":"家常熬黄花鱼","r":"鲁菜","o":"鲁菜300种","f":"：鱼肉鲜嫩，汤香味美。","c":"热菜","m":["炖煨"],"g":["黄鱼","猪肉"],"s":["盐","料酒","酱油","味精","葱","姜","蒜","香菜","香油"],"t":["炒锅"],"v":0,"a":"主料：黄花鱼1条（约重500克）｜配料：肥瘦肉丝50克｜调料：精盐2.5克酱油10克料酒15克味精1克·葱姜蒜片各5克香菜20克香油10克猪油100克","p":["1。将黄花鱼刮鳞、挖腮、去五脏（可用筷子从嘴内坤进将腮拧出）洗净，在两面每隔2厘米划上刀纹；猪肉切成丝；香莱洗净切段。","炒勺内放入猪油烧热，将鱼放入油内煎至两微呈黄色，·即放入葱姜蒜片，肉丝稍煸随即倒入清汤、酱油、料酒、精盐、烧沸撤沫，移至小火上熬8分钟左右，将鱼捞出盛入汤盘内，勺内的汤加上味精、香菜、香油浇在色上期成。"]},{"i":359,"n":"醋椒活鱼","r":"鲁菜","o":"鲁菜300种","f":"：鱼肉鲜嫩，汤味酸、辣、咸香。","c":"热菜","m":["爆炒"],"g":["鱼肉"],"s":["醋","盐","高汤","葱","姜","料酒","味精","酱油","胡椒","香菜","香油"],"t":["炒锅"],"v":0,"a":"主料：活鱼1条（约重750克）｜调料：精盐5克清汤1000克葱姜丝各15克.料酒.50克味精1.5克酱油5克醋75克胡椒粉3克香菜段5·钱香油10克95","p":["1，将洗净的活鱼刮去鳞、挖腮、开膛除五脏，冲洗干净，把鱼的一-面划上大翻刀，一面划斜刀，放入沸水锅内稍烫","炒勺内放入清汤、料酒、精盐、酱油、葱姜丝及烫过的鱼，在旺火上烧沸，移小火煮透，捞在大鱼盘内，炒勺的汤烧沸后加入胡椒粉、醋、味精、香油、香菜段浇在鱼上。"]},{"i":360,"n":"醋烹黄花鱼","r":"鲁菜","o":"鲁菜300种","f":"：鱼皮表面焦脆，内里肉缴，经热油所烹之汁雾化后发出诱人的醋香味，为佐酒佳品。","c":"热菜","m":["炸"],"g":["黄鱼"],"s":["醋","盐","酱油","葱","姜","蒜","料酒","淀粉"],"t":["炒锅"],"v":0,"a":"主料：黄花鱼1条（重400克左右）｜调料：精盐2克酱油25克醋40克葱姜蒜末共10克料酒50克湿淀粉25克花生油1000克（约耗50克15克）","p":["1，将鱼鳞刮净，在鱼肛门前方横拉一小口，用竹筷子从口中两腮插入腹部拧出五脏，冲洗干净。","将鱼身的两面每隔2厘米大翻刀（注意不要割断）。","用少许料酒、精盐、酱油洒在鱼上，再涂上一层薄薄的淀粉糊。","2。","炒勺内放入花生油，烧至七成热时放入鱼，，炸至金黄色（炸透）外焦时，即将勺内油倒出，留底油旺火烧热，放入葱姜蒜末稍炸，随即将汁（酱油、醋、湿淀粉、清汤、料酒放在一个碗内对好）烹入颠翻即成。","96。"]},{"i":361,"n":"亡干蒸加吉鱼","r":"鲁菜","o":"鲁菜300种","f":"：鱼肉鲜嫩，味美清口，饰以配料色彩美观。","c":"热菜","m":["蒸"],"g":["加吉鱼","猪肉","香菇","火腿","冬笋"],"s":["葱","姜","盐","料酒","味精"],"t":["蒸锅"],"v":0,"a":"主料：鲜加吉鱼1条（约500克重）。｜配料：肥猪肉25克水发冬菇25克火腿10克冬笋25克｜调料：葱丝5克姜丝2.5克精盐2.5克料酒10克味精1.5克猪油50克：","p":["1.鲜加吉鱼用刀把鳞刮净，，在脏门处前方拉一小口（约1厘米深），将腮盖揭开取出腮和内脏（不要将.鱼腹破开，以保持鱼身完整，没有去净的内脏可以从肛门开口处挤出）。","洗净后，在鱼身两面每隔2厘米制上斜十字花刀。","然后，手提鱼尾在沸水中烫过，立即取出，用洁布据于水分，撒上精盐、料酒、味精、放在盘中。","、2。","将肥肉、冬菇、冬笋、火腿均匀切成丝，与葱姜丝均撒在鱼上，：再淋上猪油，上笼蒸15分钟左右取出即成。"]},{"i":362,"n":"煎转鱼","r":"鲁菜","o":"鲁菜300种","f":"：鱼肉鲜嫩味美，汤色洁白醇厚。","c":"热菜","m":["煎塌"],"g":["鱼肉","火腿","冬笋"],"s":["盐","葱","姜","蒜","料酒","味精","八角","高汤"],"t":["炒锅"],"v":0,"a":"主料：鲜鱼1条（约重600克）97｜配料：火腿15克冬笋25克嫩青莱心2个｜调料：精盐5克葱姜蒜丝10克料酒30克味精1.5克八角0.5克清汤500克猪油100克","p":["1。鲜鱼鳞刮净，挖腮、开膛去五脏，洗净。在鱼的两面每隔2厘米大翻刀纹。火腿、冬笋切成薄片，莱心劈两半。","炒勺内放入猪肉，烧至七成熟，将鱼放入勺内稍煎，再放入八角、葱姜蒜稍炸，随即倒入清汤，旺火烧开，转用小火烧约15分钟，待汤呈白色约剩三分之二时，放入冬笋、火腿、菜心、精盐、料酒、味精烧沸后、盛入大汤碗内即成。"]},{"i":363,"n":"奶汤鲫鱼","r":"鲁菜","o":"鲁菜300种","f":"：奶汤色乳白香醇，鱼肉鲜嫩可口。","c":"汤羹","m":["烩汆"],"g":["鲫鱼","香菇","海米"],"s":["高汤","盐","料酒","味精","姜","葱"],"t":["炒锅"],"v":0,"a":"主料：活鲫鱼2条（约重500克）｜配料：冬菇10克水发海米10克莱心2个｜调料：精盐6克奶汤500克料酒25克味精1.5克姜汁10克葱姜各2片猪油50克","p":["把鱼的鳞刮净，挖腮，开膛去五脏，清水洗净，鱼身两面每隔2厘米-字刀纹，放入沸水锅内稍烫，捞出。","冬菇每个切成两半，莱心劈成两半。","炒勺内放入猪油，中火烧至六成热时加葱姜炸出香98味，倒入奶汤、鲫鱼、料酒烧沸后，移至小火上约10分钟左右，将鱼捞至汤碗内，炒勺内的原汤加入海米、冬菇、菜心、姜汁烧沸撇去浮沫，加味精浇在鱼上。"]},{"i":364,"n":"红烧鲤鱼","r":"鲁菜·济南","o":"鲁菜300种","f":"：鱼肉鲜嫩味咸香。用白糖炒汁是济南“红烧”莱的传统方法，所以色泽红润，注浓发亮。99","c":"热菜","m":["烧扒焖"],"g":["鲤鱼","猪肉","冬笋"],"s":["酱油","白糖","料酒","味精","葱","姜","蒜","高汤","盐","八角","淀粉"],"t":["炒锅"],"v":0,"a":"主料：黄河鲤鱼1条（约重750克）｜配料：肥瘦猪肉50克．鲜笋25克｜调料：酱油50克白糖40克料酒25克味精1.5克葱姜蒜片共10克清汤500克250克精盐4克，八角2克·猪油25克花椒油15克湿淀粉25克花生油1500克（约耗75克）","p":["1。","将黄河鲤鱼鳞刮去，挖腮，开膛去五脏，洗净，沥干水分。","在鱼身两面每隔2厘米划一刀（深至鱼骨）。","猪肉切成长6厘米的条，笋切长条片。","2。","炒勺内倒入花生油，烧至八成热时，·将鱼放入炸至金黄色捞出。","：·3。","炒勺内放入猪油、白糖炒至鸡血红色时，放入肉片葱姜蒜、笋片、酱油煸炒一下，再加清汤、料酒15克，烧沸后撇去浮沫，放入炸好的鲤鱼，在小火上煨，约15分钟，待汤汁剩三分之一时，将鱼取出装入盘内，汤汁内再加料酒、味精，湿淀粉勾芡，淋上花椒油，浇在鱼上即成。"]},{"i":365,"n":"清蒸鳜鱼","r":"鲁菜","o":"鲁菜300种","f":"：鱼肉鲜嫩味美，是宴席中的大件菜。","c":"热菜","m":["蒸"],"g":["鱼肉","猪肉","火腿","香菇","冬笋"],"s":["葱","姜","盐","料酒","高汤"],"t":["炒锅","蒸锅"],"v":0,"a":"主料：鱼1条（750克）｜配料：猪肥膘肉25克火腿15克冬菇15克冬笋25克，碗豆茵少许｜调料：大葱片25克、姜片15克精盐5克料酒25克清汤150克花穗水10克","p":["猪肥腮肉切长4厘米薄片；把鱼鳞刮去，挖腮，开膛去内脏洗净，放入沸水锅内稍烫一下，捞出振干水分，在鱼身两面每隔2.5厘米斜刀剂上刀纹，深至鱼脊骨，正面朝上摆入鱼船内，酒上盐水，料酒，葱姜片均插在刀口内，淋上花椒水，·再搭上肥岗片。上笼蒸20分钟（蒸熟即可，防止蒸老）左右取出，去控葱姜、肉片，汤控去不用。","火腿、冬菇、冬笋切片与碗豆苗均用沸水焯过。","炒勺内放入清汤、精盐、料酒、冬菇、冬笋、火腿烧沸撒去浮沫，浇在鱼上即成。上桌时外带毛姜醋碟。"]},{"i":366,"n":"烤花鳞鱼","r":"鲁菜·济宁","o":"鲁菜300种","f":"：色泽黄亮，外皮焦脆，肉鲜嫩，馅香美，是济宁地方传统制法。101","c":"热菜","m":["烤"],"g":["鱼肉","猪肉","香菇","冬笋","白菜","鸡蛋","糯米"],"s":["盐","甜面酱","淀粉","葱","姜","料酒","花椒","酱油"],"t":["炒锅"],"v":0,"a":"主料：鱼1条（约重750克）｜配料：猪网油1张（约300克）猪瘦肉100克冬菇冬100笋蒲菜心各25克｜调料：精盐4克甜面酱5克鸡蛋清5个湿淀粉25克糯米面25克葱姜末5克·料酒25克酱油10克花椒面1克花生油25克","p":["：1，将鱼鳞刮去，腮挖出，在肛门前横割1厘米深的刀口，用两支竹筷子从鱼嘴中贴鱼腮壳插入腹部；转圈搅拧，带出内脏后洗净，用洁布掘干水分，在鱼身两面坡刀每隔2.5厘米拉一刀，制完刀口内撒上精盐","猪肉、蒲菜心、冬笋、冬菇均切3毫米见方的小丁片；鸡旦清入碗内加湿淀粉、糯米粉、精盐（1克），料酒搅匀成糊。·3。炒勺内放入花生油，烧至六成热时，烹入葱姜末炸至放香，放入肉丁煸炒，加甜面酱沸熟，再放入笋片，）冬菇、蒲莱、酱油、料酒炒熟后成为馅料，从鱼腮腔装入腹内。4。将猪网油上的杂质择去，洗净、挤去水分，铺在板上，切去四边上的厚油，、将蛋清糊均匀地摊在网油上一层，再将鱼放上，用网油包裹起来。","将包好的鱼放在铁草子上面，在木炭炉火上慢烤，随烤随往鱼上刷剩余的蛋清糊，两面均烤至呈黄色时（约40分钟即成）。吃时也可撒上花椒面。"]},{"i":367,"n":"松鼠鱼","r":"鲁菜","o":"鲁菜300种","f":"：形似松鼠，鱼肉鲜嫩，甜酸咸香，形色悦目。","c":"热菜","m":["炸"],"g":["鱼肉","黄鱼","香菇","冬笋","火腿","豌豆"],"s":["白糖","醋","盐","酱油","淀粉","料酒","葱","姜","蒜"],"t":["炒锅"],"v":0,"a":"主料：黄花鱼1条（重400克）｜配料：冬菇、冬笋、火腿、青豆各20克｜调料：白糖150克醋40克酱油5克精盐4克湿淀粉15克精粉100克料酒20克葱姜蒜末共10克花生油1500克（耗100克）","p":["·","将黄花鱼的鳞刮净、挖腮、剖腹去肠脏，洗净。振干水分，鱼放板上，将鱼头割下。用刀紧贴脊骨将鱼肉从脖根片至鱼尾根，呈两扇鱼肉，均与尾连接，片去鱼肋刺及鱼腹（.脊骨去掉不用），在鱼肉里面每隔1厘米直刀上斜十字花纹，深至鱼皮。但不能切断皮。撒上精盐、料酒略。鱼头的咀下颌割断，用刀拍一下鱼头顶，使鱼头趴下。","冬菇、冬笋、火腿均切成5毫米见方的丁与背豆在沸水内嬉过","炒勺内倒入花生油在中火上烧至七成热时，将鱼肉有刀纹的一面沾匀一层精粉，鱼头同样沾上一层精粉，下油内炸（鱼肉下油炸时手提鱼尾，并使鱼尾上晓定形，两扇鱼肉受热成卷形），炸至呈金黄色，捞出装鱼盘内，鱼头捞出摆在前头。4，炒勺内留底油，烹入葱姜蒜末，炸出香味，快速烹，入醋，加清汤250克，酱油、白糖、冬菇、冬笋、火腿、青豆烧沸撤沫，月湿淀粉勾成浓芡，浇在鱼上即成。102"]},{"i":368,"n":"清炖元鱼","r":"鲁菜","o":"鲁菜300种","f":"汤清味鲜，元鱼肉嫩绵软不腻．且具有营养价值高和补养之功能。","c":"热菜","m":["炖煨"],"g":["鱼肉","甲鱼","鸡肉","猪肉"],"s":["高汤","盐","酱油","料酒","姜"],"t":["炒锅"],"v":0,"a":"主料：元鱼（甲鱼）1只（1000克）｜配料：鸡肉500克｜调料：清汤500克精盐10克酱油5克料酒50克大慈50克姜15克猪油100克","p":["1，将元鱼的头刹去放血，放入水锅内煮沸捞出，刮去.外表黑皮，揭盖挖出内脏，剁去瓜尖和尾巴，洗净、剁戚2厘米的方块。鸡择洗干净也剞成2厘米的方块。","炒勺内放入猪油烧热，放入元鱼块和鸡肉块编炒5分钟，加入清汤（和适量的水）、酱油、葱、姜、精盐、料酒，烧沸撤沫，移至小火上煨炖4一50分钟待肉烂时，棚入少量料酒即成。："]},{"i":369,"n":"脯酥全鱼","r":"鲁菜","o":"鲁菜300种","f":"：鱼肉软嫩无刺，咪美适口，色白明亮，最适老年人食用。一二六油爆鱼芹·原料主料：净鱼肉250克配料：鸡茸50克猪肥膘肉10克火腿1","c":"热菜","m":["炸"],"g":["鱼肉","黄鱼","冬笋","火腿","香菇","豌豆","鸡蛋"],"s":["盐","料酒","味精","白糖","淀粉","高汤"],"t":["炒锅"],"v":0,"a":"主料：火黄花鱼1条（重600克）：｜配料：冬笋、火腿、冬菇、青豆各10克｜调料：精盐5克料酒20克鸡蛋清4个味精1.5克103白糖5克·精粉100克湿淀粉15克清汤200克花生油1000克（耗50克半）","p":["1，将黄花鱼的鳞刮去、挖腮，剖腹去五脏，洗净，用洁布掘于水分；刹下鱼头、鱼尾；再片下两扇鱼肉，片成长4厘米，宽2.5厘米、厚3毫米的片，用精盐、料酒、味精渍匀；鱼头咀下颌割断，用刀从鱼头顶向下拍扁。冬笋、冬菇、火腿均切小象眼片与青豆均在沸水内焯过。2。鸡蛋清打入碗内，用竹筷子打起泡沫，加入精粉50克搅匀成雪丽糊。3，·炒匀内倒入花生油，烧至三成热时，将黄花鱼肉逐片上雪丽糊下入油内炸熟捞出，摆放在盘中间；鱼头、鱼尾沾上一层精粉后下入油内炸熟捞出，摆在盘内鱼片的两头象一条整鱼形。：·","炒勺内倒入清汤和配料、料酒、味精、精盐、白糖烧沸撇去浮沫，用湿淀粉勾芡，淋上鸡油将汁浇在鱼上即成。"]},{"i":370,"n":"虎头鱼","r":"鲁菜","o":"鲁菜300种","f":"鱼肉鲜嫩，外层糊软滑，常作酒席饭菜。106","c":"热菜","m":["爆炒"],"g":["鱼肉","猪肉","草鱼","鸡蛋"],"s":["盐","酱油","甜面酱","料酒","高汤","白糖","淀粉","葱","姜"],"t":["炒锅","蒸锅"],"v":0,"a":"主料：猴子鱼肉（又称草鱼）250克。｜调料：精盐4克酱油10克甜面酱5克料酒10克清汤100克白糖10克鸡蛋1个·湿淀粉100克精粉10克葱丝2.5克姜丝1.5克花椒油10克花生油1000克（耗50克半）","p":["将鱼肉切长4厘米、宽2厘米的段。酒上精盐略腌。把精盐、酱油（2.5克）、湿淀粉（50克）、鸡蛋、精粉、料酒（5克）搅匀成糊。","炒勺内倒入花生油，旺火烧至八成热，将鱼逐块沾匀糊下入油内，炸至呈深黄色捞出，放入碗内摆好。2。炒勺内留底油15克，放入白糖炒至冒细泡发黄色放入甜面酱快速搅炒沸熟放香，随即放入酱油、料酒、清汤、葱、姜丝，烧沸倒入鱼碗内，入笼用旺火蒸透取出扣入汤盘内，汤汁倒入勺内，.再酌加清汤烧沸，湿淀粉勾芡，淋上花椒油，浇在鱼上即成。"]},{"i":371,"n":"菊花鱼","r":"鲁菜","o":"鲁菜300种","f":"其形如盛开的菊花，鱼肉酥嫩，汁味甜酸可口。一三○，葱油活鱼腻料主料：活鲤鱼1条（约重750克）配料：章邱大葱白100克107","c":"热菜","m":["炸"],"g":["鱼肉","猪肉"],"s":["盐","酱油","醋","白糖","高汤","淀粉","料酒","葱","姜","蒜"],"t":["炒锅"],"v":0,"a":"主料：带皮净鱼肉1扇（400克）｜调料：精盐2.5克酱油10克醋50克白糖150克清汤250克湿淀粉25克干淀粉100克料酒15克葱姜蒜末10克花生油1000克（耗100克）","p":["1，将鱼肉内的肋刺片去，切去不整齐地边，坡刀每隔3毫米切至鱼皮（皮不要断），切4刀断为一块，再顺鱼肉片切条（深至皮，皮不要断），鱼肉条长5厘米，共切12块。洒上料酒和少许精盐略腌，沾上一层均匀干淀粉。2。炒勺内倒入花生油，烧至七成热时，将鱼逐块下入油内，炸至金黄色时捞出，每块形似一朵菊花，摆入盘内。","炒勺内留底油，烹入葱姜蒜末，炸至放香，烹入醋，再放清汤、白糖、酱油，烧沸后用湿淀粉勾茨，浇在“菊花鱼”上即成。."]},{"i":372,"n":"干炸鱼条","r":"鲁菜","o":"鲁菜300种","f":"色泽金黄，鱼肉嫩，鲜美味香。","c":"热菜","m":["炸"],"g":["鱼肉","鲤鱼","猪肉"],"s":["盐","酱油","淀粉","葱","花椒","料酒","味精"],"t":["炒锅"],"v":0,"a":"主料：.鲤鱼肉250克｜调料：精盐2克酱油25克湿淀粉50克葱椒料酒50克味精1克花生油500克（耗50克）","p":["1，将鱼肉扇横断成5厘米长的段，再切成1厘米见方的条，放入碗内，加酱油15克、葱椒料酒10克、精盐、湿淀粉拌匀。","在另一个碗内放入酱油10克、葱椒料酒40克及味精调成汁。","2。","炒勺内倒入花生油，在旺火上烧至六成至时，将腌108溃好的鱼条逐段拨入油内炸，并用小铲不住地翻动，以免沾在一起，炸至漂起在油面上，呈金黄色时，将勺内油凈出，移在小火上，将碗内的汁烹入颠翻均匀，盛入盘内即成。"]},{"i":373,"n":"炸烹鱼片","r":"鲁菜","o":"鲁菜300种","f":"外焦里嫩，鱼肉鲜香美口，也可蘸花椒面食之，佐酒佳肴。109","c":"热菜","m":["炸"],"g":["鱼肉","猪肉"],"s":["盐","酱油","葱","姜","料酒","味精","高汤","淀粉","花椒"],"t":["炒锅"],"v":0,"a":"主料：猴子鱼肉250克｜调料：精盐2.5克酱油25克葱姜料酒25克：味精1克清汤50克湿淀粉50克花椒面1克猪油500克（耗50克25克）","p":["1。将鱼肉切成长5厘米的块，再横片成长5厘米、宽3厘米、厚3毫米的片放入碗内，加入葱椒料酒、精盐渍","酱油、清汤、味精、葱椒料酒、湿淀粉均放入一个碗内调匀成汁。3，炒勺内倒入猪油，烧至五成热时，将鱼肉逐片沾上淀粉糊下入油内炸，不住地翻动鱼片，炸至飘浮在油面上量金黄色时，将勺内的浊凈出，随即烹入调好的汁，迅速颠翻，使鱼片均匀地沾上雾化的汁即成。"]},{"i":374,"n":"象眼鱼卷","r":"鲁菜","o":"鲁菜300种","f":"色泽淡黄，鱼肉嫩鲜香。110","c":"热菜","m":["炸"],"g":["鱼肉","猪肉","火腿","黄瓜","冬笋","鸡蛋"],"s":["盐","料酒","味精","淀粉","花椒"],"t":["炒锅"],"v":0,"a":"主料：猴子鱼肉300克｜配料：瘦火腿、黄瓜、冬笋各50克｜调料：精盐5克料酒50克味精1.5克鸡蛋清3个精粉50克湿淀粉25克花椒面2.5克花生油1000克","p":["1，将鱼肉片切成厚2毫米的片，共4大片，用少许精盐、料酒、味精洒在鱼片上稍腌。","2。","黄瓜、火腿、冬笋均切长5厘米、粗2毫米的丝；鸡蛋清磕入碗内，用竹筷子搅打起沫后，加上精盐（2.5克）、味精（0.5克）、精粉（10克）合匀成暄糊。","3，将4大片鱼肉平铺在板上，每片上均匀地摆上冬笋、火腿、黄瓜丝，逐片各卷成细卷，再滚上一层精粉。","4，炒勺内倒入花生油，中火烧至四成热时，将鱼卷逐个匀暄糊，下入油内炸，油温上升到六成热时，移至小火上用小铲拨动鱼卷，使受热均匀，炸至稍见黄色时捞出，放在板上，斜刀切成大象眼块，码在盘内即成。","吃时也可花椒面。"]},{"i":375,"n":"葱椒鱼","r":"鲁菜","o":"鲁菜300种","f":"葱椒味醇，汤汁冷后成冻红亮，是冷菜碟料。","c":"热菜","m":["爆炒"],"g":["鱼肉","猪肉"],"s":["葱","花椒","盐","酱油","料酒","白糖","高汤","香油"],"t":["炒锅"],"v":0,"a":"主料：鲜鱼肉2扇（500克）.｜配料：猪肉皮150克｜调料：精盐10克酱油50克.料酒25克葱椒泥30克白糖25克清汤500克香油50克花生油1000克（耗50克半）","p":["1。","将鱼肉切成长4厘米、宽2厘米的长条，装入盆内，撒上少许精盐、料酒、酱油稍腌；猪肉皮刮洗干净，放入沸水内煮5分钟捞出，切成长细丝。","2。","炒勺内倒入花生油，旺火烧至八成热，将鱼肉条放油内炸，至呈浅红色捞出；另用炒勺放入香油、白糖炒至红色时放进清汤、料酒、葱椒泥、酱油、鱼条和猪肉皮烧沸撒去浮沫，移至小火上煨，至汤剩一半时再把余下的葱椒泥3线放入颠匀稍即成。"]},{"i":376,"n":"-三五五香鱼","r":"鲁菜","o":"鲁菜300种","f":"此莱颜色红亮，鲜香味美，是上等冷莱碟料。","c":"热菜","m":["爆炒"],"g":["鱼肉","猪肉"],"s":["盐","酱油","料酒","白糖","高汤","葱","姜"],"t":["炒锅"],"v":0,"a":"主料：鱼肉500克｜调料：精盐5克酱油50克料酒15克白糖25克、清汤250克葱姜末5克五香面2.5克花椒油10克花生油1000克（耗50克半）111:","p":["1。","将鱼肉切长5厘米、宽3厘米的条，放入碗内加少许酱油，料酒略腌。","2。","炒勺内倒入花生油，烧至八成热，将鱼条下入油内炸至呈金黄色时捞出；炒勺内留底油，放进白糖炒至呈鸡血红色时，随即烹入葱姜末、清汤、精盐、酱油、料酒、和鱼块，烧沸后，撇去浮沫，移至小火上，至汤汁将尽时，撒上五香面，淋上花椒油颠翻均匀出勺即成。","，。"]},{"i":377,"n":"五香熏鱼","r":"鲁菜","o":"鲁菜300种","f":"色泽深红油亮，细腻嫩美，有烟熏的香气，佐酒美肴。注：燕制时，只取烟，面不要火苗，有火苗时即撒上锯末稍蓝。原料在制中可翻动","c":"热菜","m":["爆炒"],"g":["鱼肉"],"s":["酱油","盐","料酒","白糖","葱","姜","花椒","高汤","香油"],"t":["炒锅"],"v":0,"a":"主料：猴子鱼1500克。｜调料：酱油100克精盐30克料酒100克白糖50克葱段100克姜片50克花椒1克清汤1000克五香面5克香油50克花生油1500克（耗150克）","p":["1，将鱼刮鳞、挖腮、剖腹去五脏，洗净，片成两扇，切长8厘米的段，加精盐（5克）、酱油（50克)、料酒（25克）、花椒、葱段、姜片腌约半小时，用清水洗净，洁布沾干水分。","、2。","炒勺内倒入花生油，用大火烧至八成热时，将鱼段放入炸是金黄色时捞出；另用炒勺放入香油（25克）、白糖炒至呈鸡血红色时，随即加入清汤、酱油、料酒、精盐、鱼段烧沸，撇去浮沫，移至小火上煨，待汤汁烨尽时把鱼盛112入盘内晾凉。","3：制：将鱼段摆在铁革子上，熏锅内放入柏木锯末和糖，在中火上烧至起烟时，把铁子放在锅上，盖上盖，移至微火上，鱼段熏至发红时取出，刷上香油，撒上五香面即成。"]},{"i":378,"n":"酱汁鱼条","r":"鲁菜","o":"鲁菜300种","f":"鱼肉嫩，酱香味醇，因用甜面酱调味为主而故名。113","c":"热菜","m":["烧扒焖"],"g":["鱼肉"],"s":["甜面酱","酱油","白糖","料酒","葱","姜","香油","高汤"],"t":["炒锅"],"v":0,"a":"主料：鲜鱼1条（750克）。｜调料：甜面酱50克酱油50克白糖50克料酒25克葱姜丝10克香油20克清汤500克花生油1000克（耗100克）","p":["将鱼刮鳞、挖腮，剖腹去五脏，洗净，片成两扇，切长5厘米、宽2厘米的条块，用少许酱油、料酒腌渍。","炒勺内倒入花生油，烧至八成热时，放入鱼条，炸至金黄色时，将油凈出，烹入葱姜丝炝锅，放入甜面酱沸熟，随即加清汤、酱油、白糖、料酒、烧沸移到水火上烟，见汤汁剩兰分之一时，淋上香油即成。"]},{"i":379,"n":"糟炒鱼片","r":"鲁菜","o":"鲁菜300种","f":"鱼肉的夹刀片经受热后张开象翻翻起舞的蝴蝶，质地鲜嫩，芡汁白亮，糟香味浓。-115","c":"热菜","m":["爆炒"],"g":["鱼肉","猪肉","蒲菜","木耳","冬笋","荸荠","鸡蛋"],"s":["香糟","盐","料酒","味精","淀粉","葱","姜","蒜","高汤"],"t":["炒锅"],"v":0,"a":"主料：猴子鱼肉150克25克｜配料：蒲菜25克水发木耳15克冬笋15克南荠25克｜调料：精盐3克料酒10克味精1克：香糟5克鸡蛋清1个·湿淀粉25克清汤100克葱姜蒜末共5克猪油1000克（约耗50克）。","p":["1。","将鱼肉片成厚2毫米的夹刀片，用精盐（1.5克）、鸡蛋清、湿淀粉15克抓匀；蒲菜切成长4厘米的象眼块；南荠切成片，冬笋切象眼片，与木耳均用沸水焊过；香糟用清汤泡开，用纱布过滤出汁，加上精盐、料酒、味精、湿淀粉对戒为“糟汁”。","2。","炒勺内倒入猪油，中火烧至五成热时，将鱼逐片下入油内，用手勺轻轻拨动，至油温升至8一9成热时将油津出；炒勺内留底油，放入葱姜蒜末炸至放香，再放入冬笋、菜、木耳、南荠煸炒一下，倒入对好的糟汁，与鱼片混合颠翻均匀出勺即成。"]},{"i":380,"n":"煎烹虾段","r":"鲁菜","o":"鲁菜300种","f":"虾肉鲜嫩味香醇，色泽红润明亮，为山东名菜。","c":"热菜","m":["煎塌"],"g":["虾"],"s":["盐","白糖","醋","料酒","味精","葱","姜","高汤"],"t":["炒锅"],"v":0,"a":"主料：鲜大虾6个（500克）｜调料：精盐4克白糖50克醋15克料酒15克..味精1克葱姜丝各3克清汤200克花椒油15克猪油50克25克","p":["把虾的须、枪、腿、尾剪去，抽去脊部沙线，择去头部沙包，洗净，剁成4段。","炒勺内放入猪油，烧至七成热时，先将虾头放入，用手勺按头部挤出虾脑，煎至发红时，再放虾段煎，煎透后，将虾段拨至一边。放进葱姜丝、烹醋放香后，加清汤、料酒、精盐、白糖，将炒勺移到小火上煨，待虾段全部透，汤汁剩三分之--时，加味精、淋上花椒油颠翻均匀盛入盘中。"]},{"i":381,"n":"松子对虾","r":"鲁菜","o":"鲁菜300种","f":"虾肉鲜嫩，有浓郁的松子香味。","c":"热菜","m":["炸"],"g":["虾","火腿","香菇","黄瓜","鸡蛋"],"s":["盐","白糖","酱油","淀粉","料酒","高汤","味精","葱","姜"],"t":["炒锅"],"v":0,"a":"主料：大对虾4个｜配料：松子束4克火腿末冬菇末黄瓜丁末各10克｜调料：精盐2.5克无色酱油10克白糖15克湿淀粉40克清汤100克料酒15克味精0.5克葱姜末3克鸡蛋清1161个花生油500克250克","p":["1，把对虾洗净，剥去皮，留尾，.择去脊部沙线用刀从脊部片开虾肉，但腹部连接不断，划上十字刀纹，.用料酒、精盐、姜末腌渍片刻。","2。","用蛋清1个、盐少许、料酒、湿淀粉合成为糊。","3。","炒勺内倒入花生油、烧至五成热时，将虾肉沾匀糊（尾不沾糊）下入油内炸，见油冒细泡炸透时捞出，放在板上，剁成3段，原样整齐地摆入盘内。","4。","炒勺内留底油烧至六成热时，放葱姜末、松子末稍·炸放香，再放火腿、冬菇、黄瓜丁末、酱油、清汤、白糖、料酒、味精烧沸、用湿淀粉勾芡，浇在虾上即成。"]},{"i":382,"n":"余鱼脯丸子","r":"鲁菜","o":"鲁菜300种","f":"鱼丸色白、软嫩，汤清味鲜。","c":"小吃","m":["爆炒"],"g":["鱼肉","猪肉","鸡蛋"],"s":["盐","姜","料酒","味精","高汤","香油"],"t":["炒锅"],"v":0,"a":"主料：净鱼肉250克｜配料：猪肥膘肉50克豆苗50克｜调料：精盐4克：鸡蛋清1个姜汁5克料酒20克味精1克清汤200克香油10克猪油25克","p":["1。将鱼肉、肥腰肉一起用刀背砸成茸泥，放入碗内；加清汤（50克）、味精（0.5克）、料酒.10克解开（搅时朝一个方向顺搅）搅匀之后，加鸡蛋清、精盐、猪油，、继续用力顺一个方向搅匀上劲，见鱼肉泥发亮有弹性时为止；豆苗用117沸水焯过。","炒勺内例入冷水坐在小火上，将鱼肉泥用手挤成直径2厘米大的丸子，放入冷水的炒勺内，移至中火上，水温逐渐升高，将要开时，端离火口，撇去浮沫后烧拂，将鱼脯丸子捞在大汤碗内。3。炒勺内倒入清汤。料酒、精盐，烧沸加味精、豆苗、淋上香油，将汤浇在鱼丸子的大汤碗内。"]},{"i":383,"n":"加沙鱼球","r":"鲁菜","o":"鲁菜300种","f":"色金黄，外焦里嫩。118","c":"热菜","m":["炸"],"g":["鱼肉","猪肉","面粉","鸡蛋"],"s":["盐","料酒","味精","葱","姜","淀粉","胡椒"],"t":["炒锅"],"v":0,"a":"主料：净鱼肉150克｜配料：咸面包150克肥猪肉膘50克｜调料：精盐2克料酒5克味精0.5克鸡蛋1个葱姜末2.5克湿淀粉25克胡椒面0.5克花生油1000克（耗100克）。","p":["1。","面包切2毫米见方的末；将鱼肉和肥猪肉剞成细泥，放一个碗内，加精盐、料酒、味精、葱姜末、鸡蛋、湿淀粉、胡椒面搅匀成馅。","2。","锅内倒入花生油，烧至四成热时，将鱼肉泥陷挤成直径2厘米大的丸子，滚上一层面包末，下入油内炸熟，呈金黄色捞出，装入盘内。"]},{"i":384,"n":"炸兰花鱼串","r":"鲁菜","o":"鲁菜300种","f":"鱼肉串鲜香味美，作法新颖，造形美观大方。冷吃热吃皆宜。119","c":"热菜","m":["炸"],"g":["鱼肉","猪肉","火腿","芹菜","香菇","冬笋","鸡蛋"],"s":["盐","淀粉","料酒","味精"],"t":["炒锅"],"v":0,"a":"主料：猴子鱼肉100克｜配料：火腿15克芹菜芽13个香菇玉兰片25克｜调料：精盐2克鸡蛋清2个精粉10克湿淀粉.5克料酒10克味精0.5克火柴梗13根花生油1斥（耗1.两）","p":["1。鱼肉切长2厘米，厚3毫米的象眼片，用精盐、料酒、味精溃匀。火柴梗头部削上尖。芹菜、香菇、玉兰片均切成与鱼肉片相同大的片。","每隔一片鱼肉各穿上香菇、玉兰片、芹菜芽、用火柴梗穿成串共13串。3，鸡蛋清打成暄糊加精粉、盐、湿淀粉成为糊。.：","炒勺内倒入花生油烧至四成热时，将鱼串沾上糊一一下入油内炸，见鱼串挺身漂起因，捞出将火柴梗，抽去不用，再放入油内炸，见外表起焦成淡黄色时捞出即成。：："]},{"i":385,"n":"三彩大虾（做法二）","r":"鲁菜","o":"鲁菜300种","f":"外皮酥脆，虾肉鲜嫩味美，因分别衬以3种颜色的配料，式样美观，而故名。120","c":"热菜","m":["炸"],"g":["虾","香菇","火腿","菠菜","面粉","鸡蛋"],"s":["盐","料酒","味精","淀粉"],"t":["炒锅"],"v":0,"a":"主料：鲜大对虾8个｜配料：冬菇10克火腿10克菠菜叶2枝咸面包200克鸡蛋2个｜调料：精盐5克料酒15克味精1克湿淀粉50克精粉25克花生油1000克（耗100克）","p":["1，面包切成长8厘米、前头宽5厘米、后头宽3.5厘米，厚3毫米的片，共8片；冬菇、火腿、菠菜叶分别剞成细末；大虾洗净，剥去皮，去头留尾，脊背上的沙线抽去，从脊背中间片开至腹部（腹部不能断），上十字刀纹，撤上精盐、料酒、味精渍匀；鸡蛋清、鸡蛋黄分别磕入两个碗内，均加湿淀粉搅匀成糊。","2。","在面包片上抹一层蛋黄糊。","虾肉片沾上薄薄一层精粉，再沾上一层蛋清糊（尾不沾糊）。","虾肉的外皮面朝下，沾在面包片的蛋黄糊上，在其中3个虾片上顺中间撒上火腿末（约3毫米宽），3个撒上冬菇末，2个撒上菠菜末，成为虾托。","·3，炒勺内倒入花生油，中火烧至五成热时，将虾托轻轻放入油内炸，见两面呈金黄色捞出，放在板上，每个切成4段，原料摆在盘内。"]},{"i":386,"n":"大虾","r":"鲁菜","o":"鲁菜300种","f":"·色红油亮，肉质鲜嫩，味甜中带咸，有浓厚的虾鲜昧。","c":"热菜","m":["爆炒"],"g":["虾","生菜"],"s":["盐","白糖","料酒","味精","葱","姜","高汤"],"t":["炒锅"],"v":0,"a":"主料：大对虾6只｜配料：生菜50克1｜调料：精盐5克白糖100克料酒25克味精1克葱姜丝各5克花椒油10克清汤500克猪油100克","p":["F1。将虾洗净，剪去须、枪、腿，择去头内沙包、和脊部沙线。每个虾切成4段。","炒勺内放入猪油，烧至六成热，烹入葱姜丝，倒入虾段，进行煸炒虾变成红色时，加清汤、白糖、料酒、精盐在小火上煨，待汤汁将尽时加入味精，淋上花椒油，盛入盘的一侧。","生菜洗净消毒切段，摆在盘的另一侧。"]},{"i":387,"n":"红烧大虾","r":"鲁菜","o":"鲁菜300种","f":"色红油亮，虾肉嫩香，味咸中有甜。","c":"热菜","m":["烧扒焖"],"g":["虾"],"s":["盐","白糖","酱油","料酒","味精","葱","姜","高汤"],"t":["炒锅"],"v":0,"a":"主精：鲜大虾8个｜调料：精盐5克白糖50克25克酱油2.5克料酒40克味精1克葱姜丝5克清汤250克花生油1000克（耗50克25克）K221","p":["1.先将虾洗净，择去头部沙包，拍出脊背部沙线，（不剥皮）。","剪去须、炝、腿。","2。","炒勺内倒入花生油，烧至八成热时，大虾（整只）入油内炸至五成熟，捞出，匀内留底油，放入葱姜丝稍炸，再放入清汤、白糖、酱油、精盐、料酒、大虾，移在小火上煨，待汤汁剩三分之一时，加咔精，整齐摆入盘内，！将原汁浇在大虾上。"]},{"i":388,"n":"，金银大虾","r":"鲁菜","o":"鲁菜300种","f":"白色虾外软里嫩，黄色外焦，黄为金色，白为银色而故名。","c":"热菜","m":["炸"],"g":["虾","鸡蛋"],"s":["盐","料酒","味精","淀粉"],"t":["炒锅"],"v":0,"a":"主料：大虾16个｜配料：鸡蛋3个｜调料：精盐5克料酒10克味精1克精粉50克干淀粉25克炒好的蕃茄酱一小碟：花生油1000克（耗100克）。","p":["1，将大虾去头、皮、腿、沙肠留尾，用精盐、料酒、味精稍腌；鸡蛋清磕入碗内，搅打起成泡沫，加上干淀粉搅匀成雪丽糊；鸡蛋黄放另一碗内，加上精粉和适量的水调匀成蛋黄糊。","锅内倒入花生油，烧至四成热时，将8个虾蘸上雪丽糊入油内炸熟，保持白色，装入盘内；另8个虾上蛋黄糊入油炸熟成黄色，取出摆入同一个盘内。蕃茄酱一小碟随上餐桌。122"]},{"i":389,"n":"煎虾饼","r":"鲁菜","o":"鲁菜300种","f":"色泽金黄，软嫩鲜香，味美可口。","c":"热菜","m":["煎塌"],"g":["虾","猪肉","荸荠","白菜","鸡蛋"],"s":["盐","料酒","味精","葱","姜","淀粉","高汤"],"t":["炒锅"],"v":0,"a":"主料：虾肉200克猪肥膘肉50克｜配料：南荠25克油菜心50克｜调料：精盐八分：料酒20克味精1克葱姜末各3克鸡蛋清1个湿淀粉100克清汤150克葱油10克：猪油50克","p":["1。虾肉、肥腰肉剞成细，加入精盐、味精、料酒、南荠末、湿淀粉一起搅匀成茸泥。","炒勺内放入猪油烧热离开火眼，将虾肉混挤成直径1.5厘米大的丸子排放在勺内，4个一行共摆4行。用小火煎至上色，逐个翻过来，用手勺将丸子压扁成饼形，：待煎至颜色均匀时倒在漏勺里控净油。3。炒勺内留底油，放入葱姜末稍炸，倒入清汤、料酒和虾饼，用小火透，见汁将尽时加味精，淋上葱油，大翻勺装盘。油菜心用油、盐煸炒一下，围在虾饼周边。"]},{"i":390,"n":"桂花虾饼","r":"鲁菜","o":"鲁菜300种","f":"：虾饼暄软鲜嫩，炒好的鸡蛋黄色如“桂花”，蒙在虾饼上美观。","c":"热菜","m":["爆炒"],"g":["虾","猪肉","鸡蛋"],"s":["盐","料酒","味精","葱","姜","淀粉","高汤"],"t":["炒锅"],"v":0,"a":"主料：虾仁100克猪肥肉膘100克1e3｜配料：荠（去皮）50克鸡蛋黄1个鸡蛋清3个｜调料：精盐3克料酒10克味精0.5克葱姜末2.5克清汤50克湿淀粉40克猪油100克","p":["将虾仁、猪肥肉膘、荸荠均剁成细泥，放在一个碗内，加入鸡蛋清，顺一个方向搅匀上劲，再陆续加入料酒5克，清汤25克，猪油25克，精盐2克，湿淀粉、葱姜末，继续搅匀上劲；剩余的清汤、料酒、精盐对成汁备用。2。炒勺内放入猪油，中火烧至四成热，放入鸡蛋黄炒成颗粒状盛出。","炒勺内另加猪油烧四成热，把搅好的虾肉泥用手挤成直径2厘米大的丸子，逐个放入油内煎，随煎随用手勺将丸子压成扁圆形小饼，翻过来继续煎，约有九成熟时，将对好的汁倒在勺内，移至小火上，见汁烨至将尽时，盛入盘内摆整齐，撤上炒好的鸡蛋黄即成。、"]},{"i":391,"n":"炸虾托","r":"鲁菜","o":"鲁菜300种","f":"色泽金黄，形美、面包酥脆，虾肉嫩鲜。","c":"热菜","m":["炸"],"g":["虾","猪肉","火腿","面粉","鸡蛋"],"s":["香菜","盐","料酒","味精","淀粉"],"t":["炒锅"],"v":0,"a":"主料：大虾肉200克猪肥膘肉50克｜配料：火腿末、香菜叶各30克咸面包100克｜调料：精盐4克料酒15克味精1克鸡蛋清1个湿淀粉30克花生油1000克（耗50克25克）12.4","p":["1。","将虾肉和肥肉用刀背砸成细泥放一个碗内，加蛋清、精盐、料酒、湿淀粉顺一个方向搅匀；面包去皮切厚3毫米的象眼片；把虾肉泥抹在面包片上，中间撒一趟火腿末，两边撒香菜叶成为虾托。","2。","炒勺内放入花生油，烧至五成热时，将虾托肉泥面朝下逐块放入油内炸至油冒细泡，呈金黄色捞出，摆在盘内即成。"]},{"i":392,"n":"炸板虾","r":"鲁菜","o":"鲁菜300种","f":"外皮酥脆色金黄，虾肉鲜嫩味美。","c":"热菜","m":["炸"],"g":["虾","面粉","鸡蛋"],"s":["盐","料酒","味精","胡椒","葱","姜"],"t":["炒锅"],"v":0,"a":"主料：大对虾6个（1后）｜配料：面包末100克｜调料：精盐4克料酒20克味精0.5克胡椒粉0.5克鸡蛋2个葱姜末5克精粉50克花生油1000克（75克）","p":["1。","大对虾去皮留尾，抽去沙线，从脊背片开（腹部不断），外皮面朝下铺在板子上，轻轻制上刀纹，淋上料酒、撤上葱姜末、精盐、胡椒粉、味粉腌渍；鸡蛋磕入碗内搅打成汁；2。","大虾肉两面都沾上薄薄一层精粉，在蛋汁内拖过，再沾上一层面包末并轻轻压实成“板”形。","3。","炒勺内倒入花生油，烧至六成热时把板虾肉逐个下入油内炸，.呈金黄色时捞出，每块切成4段原样摆入盘内。","126。"]},{"i":393,"n":"炒虾仁","r":"鲁菜","o":"鲁菜300种","f":"虾仁鲜嫩香美，色白明亮。","c":"热菜","m":["爆炒"],"g":["虾","黄瓜","鸡蛋"],"s":["盐","料酒","味精","葱","姜","淀粉","高汤"],"t":["炒锅"],"v":0,"a":"主料：虾仁300克｜配料：黄瓜100克｜调料：精盐4克料酒10克味精0.5克葱姜末5克湿淀粉50克鸡蛋清1个清汤50克猪油1000克（耗50克25克）","p":["将虾仁洗净控干水分．放入碗内加精盐、味精、料酒、湿淀粉渍匀。黄瓜洗净切长2厘米的小段，沸水焯过。2。将清汤、精盐、料酒、味精、湿淀粉均放入一个碗内对成汁。","炒勺内倒入猪油，烧至七成热时，将虾仁倒入油内划透去油。4。炒勺内留底油烧热放入葱姜末，炸至放香，倒入黄瓜、虾仁颠炒两下，再将对好的汁倒入颠炒翻匀即成。"]},{"i":394,"n":"炒虾腰","r":"鲁菜","o":"鲁菜300种","f":"虾仁与腰丁脆嫩鲜香，色褐白相间美观。.","c":"热菜","m":["爆炒"],"g":["虾","猪腰","鸡蛋"],"s":["盐","料酒","味精","淀粉","葱","姜","蒜","酱油","高汤"],"t":["炒锅"],"v":0,"a":"主料：鲜淡水虾仁200克猪腰150克.｜调料：精盐4克料酒15克味精1克鸡蛋清1个126湿淀粉50克葱姜蒜末10克酱油10克清汤50克花生油1000克（耗油50克25克）","p":["1，将猪腰洗净，撕去软膜从中片开，片去腰，在里面每隔2毫米制上十字刀纹，切成1厘米见方的丁；沸水烫过捞出。","碗内放入虾仁、鸡蛋清、精盐、料酒、湿淀粉溃匀。另一个碗内放入清汤、精盐、味精、酱油、料酒、：湿淀粉对成汁。","炒勺内倒入花生油烧至六成热时，放入虾仁划透凈去油。炒勺内留底油烹入葱姜蒜末稍炸，倒入腰丁及对好的芡汁与虾仁颠翻快炒即成。"]},{"i":395,"n":"菊花虾仁","r":"鲁菜","o":"鲁菜300种","f":"虾仁鲜嫩，并伴有菊花香味，食之别有风味。","c":"热菜","m":["炸"],"g":["虾","鸡蛋"],"s":["盐","淀粉","料酒","酱油","味精","高汤"],"t":["炒锅"],"v":0,"a":"主料：虾仁200克｜配料：银座菊花两朵｜调料：精盐2克鸡蛋清1个·湿淀粉20克酱油5克料酒10克味精0.5克：清汤半两花生油500克（约耗50克）","p":["：","虾仁洗净加盐、蛋清、湿淀粉溃匀养好。花洗净去根用花瓣。酱油、料酒、味精、清汤对成汁。，","炒勺内倒入花生油，烧至六成热时，放入虾仁炸成淡黄色，·油凈出，加入一半菊花，·随即烹入对好的汁，进行127颠翻再撒上另一半菊花出勺盛在盘内。"]},{"i":396,"n":"炸虾铃","r":"鲁菜","o":"鲁菜300种","f":"形似小铃状，尾红色，虾肉鲜嫩，佐以花椒面和辣酱油食之麻、辣、咸、香。","c":"热菜","m":["炸"],"g":["虾","鸡蛋"],"s":["盐","料酒","花椒","酱油"],"t":["炒锅"],"v":0,"a":"主料：鲜河虾40个（500克）｜调料：精盐5克料酒15克鸡蛋清2个精粉50克辣酱油50克花椒面2.5克花生油1000克（约耗100克）。","p":["1。","将鲜虾洗净握去皮，留虾尾，放入碗内加精盐、料酒稍腌；鸡蛋消磕入碗内用竹筷子搅打成泡沫，加入精粉搅匀成糊。","2。","炒勺内倒入花生油，烧至五成热，将虾用手捏住虾尾沾上一层薄薄精粉，再沾上一层糊（尾不沾糊），下入油内炸至淡黄色捞出，盛入盘内。","辣酱油、花椒面分别盛入小碟内，同上餐桌。"]},{"i":397,"n":"双色鱿鱼卷","r":"鲁菜","o":"鲁菜300种","f":"鱼卷红白两色分明，花纹美观，脆嫩清淡爽口。","c":"热菜","m":["爆炒"],"g":["鱿鱼","火腿"],"s":["香菜","高汤","盐","料酒","味精","葱","姜"],"t":["炒锅"],"v":0,"a":"主料：水发鱿鱼200克鲜鱿鱼300克｜配料：火腿丝5克香菜段10克｜调料：清汤100克精盐5克料酒10克味精1克葱128姜丝5克猪油50克25克","p":["1，把发好的鱿鱼和鲜鱿鱼洗净，撕去外皮薄膜，皮面朝下平铺在板上，切去周围不整齐的边，每隔2毫米制上十字刀纹，深度为肉厚的四分之三，再切成长4厘米、宽2.5厘米的块，用沸水婷过，已成卷状，捞至冷水内洗一下，沥干水分。","炒勺内放入猪泊，大火烧至七成热时，放入葱姜丝，炸至放香，加入清汤、精盐、火腿、料酒烧沸，将两种颜色的鱿鱼卷倒入勺内颠炒后加味精、香菜段颠翻即成。"]},{"i":398,"n":"炒鱿鱼丝","r":"鲁菜","o":"鲁菜300种","f":"鱿鱼丝滑嫩，鲜香味美。","c":"热菜","m":["爆炒"],"g":["鱿鱼","猪肉","青蒜","冬笋"],"s":["盐","料酒","酱油","味精","葱","姜","高汤"],"t":["炒锅"],"v":0,"a":"：主料：水发鱿鱼300克：肥瘦肉丝50克5.钱｜配料：蒜苗50克·玉兰片20克｜调料：精盐4克：酱油5克料酒10克味精0.5克葱姜丝4克清汤100克：猪油50克。","p":["、1。","将发好的鱿鱼切成长6厘米的丝，在沸水内嬉过；蒜苗择洗干净，切长4厘米的段；玉兰片切成丝，沸水焯过。","-2，炒勺内放入猪油，烧至七成热，放入葱姜丝，稍炸放香，再放肥瘦肉丝，煸炒呈白色，然后放鱿鱼丝、玉兰片丝及清汤、酱油、精盐、味精、料酒、蒜苗，迅速颠翻搅炒129即成。"]},{"i":399,"n":"油爆乌鱼花","r":"鲁菜","o":"鲁菜300种","f":"乌鱼花美观洁白，脆嫩鲜香。","c":"热菜","m":["爆炒"],"g":["墨鱼","冬笋","豌豆"],"s":["盐","料酒","味精","葱","姜","蒜","淀粉","高汤"],"t":["炒锅"],"v":0,"a":"主料：净鲜乌鱼400克｜配料：冬笋青豆各25克｜调料：精盐4克料酒15克味精1克葱姜蒜末5克湿淀粉15克清汤50克猪油1000克（耗50克）","p":["1，将鲜乌鱼洗净，在里面每隔3厘米坡刀划上刀纹，，再直刀刹上刀纹，成十字花纹，再切成长5厘米、宽2.5厘米的块，在沸水内烫过捞出，沥干水分成麦穗状。冬笋切片和青豆一起放入沸水内稍烫。","碗内放清汤、精盐、料酒、味精、湿淀粉对成“爆汁”。3。炒勺内放入猪油，烧至八成热放入乌鱼块，快速拨动--下，将油泽出。勺内留底油，放葱姜蒜末稍炸放香，倒入笋片、背豆及爆汁，颠潮即成。·"]},{"i":400,"n":"油爆海螺","r":"鲁菜","o":"鲁菜300种","f":"脆嫩鲜美，旺油爆汁明亮","c":"热菜","m":["爆炒"],"g":["木耳"],"s":["葱","蒜","盐","味精","料酒","淀粉","醋","高汤"],"t":["炒锅"],"v":1,"a":"主壮：带壳鲜海螺1000克130｜配料：木耳15克｜调料：大葱50克蒜3克精盐3克粗盐50克味精1克料酒15克湿淀粉15克醋25克清汤50克花生油500克","p":["1.将海螺外壳砸破，取出肉，择去尾肠、及头部黑膜，用醋和粗盐揉搓，再用清水冲洗净，片成薄片；大葱切1厘米长的段，蒜切片；清汤、料酒、味精、精盐、湿淀粉均放入一个碗内对成“爆汁”；木耳用沸水焯过。","2，炒勺内倒入花生油，用大火烧至八成热时，将海螺肉片倒入油内-下捞出。","·3。","炒勺内留余油用大火烧至九成热时，放入葱蒜稍炸，再放海螺肉、木耳及对好的“爆汁”，快速颠翻即成。"]},{"i":401,"n":"余蛤肉","r":"鲁菜","o":"鲁菜300种","f":"蛤蜊肉鲜嫩味美，汤清淡可口。","c":"热菜","m":["爆炒"],"g":["猪肉","冬笋","白菜"],"s":["盐","料酒","味精","高汤","胡椒","香菜"],"t":["炒锅"],"v":0,"a":"主料：蛤肉250克｜配料：冬笋片15克青菜心100克｜调料：精盐3克科酒10克味精0.5克清汤500克胡椒粉半分香菜末10克","p":["将蛤肉用水洗净。","炒勺内放入清汤、料酒、精盐、味精、笋片、菜心，烧沸后撇去浮沫，盛入碗内。","将蛤蚓肉放在漏勺内用沸水烫一下，倒入盘内，与以上碗内的汤同时上桌，食时再将蛤肉倒汤碗内，撒上胡椒粉及香菜末。"]},{"i":402,"n":"芙蓉蛤仁","r":"鲁菜","o":"鲁菜300种","f":"芙蓉洁白美观，味道鲜美。133","c":"热菜","m":["蒸"],"g":["猪肉","鸡蛋","豌豆","火腿"],"s":["盐","高汤","味精","淀粉"],"t":["炒锅","蒸锅"],"v":0,"a":"主料：净蛤肉200克鸡蛋消4个｜配料：青豆、火腿片各25克｜调料：精盐4克清汤200克味精1克湿淀粉25克鸡油15克","p":["将蛤肉洗净；鸡蛋清磕入碗内打散，加清汤（100克），精盐（2克），味精搅打均匀，放入笼内用大火蒸5分钟即透取出为芙蓉。","炒勺内倒入清汤（100克），再放上蛤蚓肉、青豆、火腿、精盐、料酒、味精，在中火上烧沸徽沫，用湿淀粉勾芡，淋上鸡油，倒在蒸熟的芙蓉上即成。"]},{"i":403,"n":"炝活虾","r":"鲁菜","o":"鲁菜300种","f":"清淡鲜美，佐酒佳肴。","c":"凉菜","m":[],"g":["虾"],"s":["料酒","酱油","葱","姜","花椒"],"t":["炒锅"],"v":0,"a":"主料：活虾250克｜调料：料酒150克酱油100克葱15克姜5克葱椒泥5克鲜花椒1枝","p":["1．将活虾的须、爪、枪剪去，清水洗净控干，放在盘内。","2。","葱姜切细丝，鲜花椒用刀拍扁与葱椒泥、酱油、料酒合在一起，倒在虾上，用碗扣住稍炝片刻即成。"]},{"i":404,"n":"翡翠虾仁","r":"鲁菜","o":"鲁菜300种","f":"鸡料翠绿，虾仁白亮，色泽美观，鲜嫩可口。","c":"热菜","m":["爆炒"],"g":["虾","鸡肉","鱼肉","火腿","豌豆","菠菜","鸡蛋"],"s":["盐","料酒","味精","淀粉","高汤"],"t":["炒锅"],"v":0,"a":"主料：虾仁200克鸡料子75克｜配料：水发鱼骨50克火腿10克.豌豆10粒菠菜绿汁少许｜调料：精盐4克料酒15克味精1克鸡蛋清3个湿淀粉30克清汤100克猪油1000克（耗100克）","p":["1，将虾仁放入碗内用精盐、鸡旦清、湿淀粉抓匀养好，豌豆剁成细末，火腿切为细末，鱼骨切成小方块用沸水焯过；另用碗将鸡料子放入，加清汤、料酒、味精、精盐、菠134菜绿汁、湿淀粉，用筷子搅匀开后，再加入鱼骨和豌豆末。2。炒勺内倒入猪油，大火烧至七成热时，将虾仁下入油内滑透捞出，控净油。","炒勺内留底油50克，大火烧至六成热时，倒入搅好的鸡料子，进行搅炒，约至六成熟时，将划好虾仁倒入，迅速颠翻大勺，再淋上料酒10克出勺，盛入盘内，撒上火腿末即成。"]},{"i":405,"n":"落叶琵琶虾（做法二）","r":"鲁菜","o":"鲁菜300种","f":"虾片色白，形如琵琶，软嫩鲜香。一六八翡翠虾环原料：主料：大青虾500克嫩黄瓜（直径2厘米）100克调料：精盐2.5克料酒25克味精1克","c":"热菜","m":["爆炒"],"g":["虾","豌豆"],"s":["盐","料酒","味精","姜","高汤","葱","淀粉"],"t":["炒锅"],"v":0,"a":"主料：大青虾20个｜配料：豌豆苗叶12个｜调料：精盐3克料酒10克味精1克清汤50克姜汁2.5克葱姜末3克干淀粉150克（耗25克），湿淀粉10克葱油5克猪油25克","p":["虾洗净控干，剥去皮，留尾，放入碗内加精盐、料酒溃匀。2。干淀粉用细箩筛过，把每个虾放在干淀粉上慢慢捶成鸭蛋形薄片（仿象琵琶），在沸水内烫过，剥去尾，仅留尾尖。豌豆苗叶沸水烫过。","炒勺内放入猪油烧至六成热时，烹入葱姜末炸至放105香，加滑汤、料酒、精盐、味精和虾片在小火上略爆一下捞在盘内。4。炒勺内的汁用湿淀粉勾茨沸起加姜汁、淋上葱油，将此汁倒在盘内虾片上，撤上豌豆苗即成。"]},{"i":406,"n":"炒鸡茸全蟹","r":"鲁菜","o":"鲁菜300种","f":"色白中有黄，软嫩鲜美，老人食用尤佳。","c":"热菜","m":["爆炒"],"g":["鸡肉","螃蟹","猪肉","鸡蛋"],"s":["盐","料酒","味精","淀粉","葱","姜","高汤"],"t":["炒锅","蒸锅"],"v":0,"a":"主料：活毛蟹300克鸡芽子肉50克｜调料：精盐4克料酒15克味精1克鸡蛋清3个湿淀粉25克、葱姜末各2.5克清汤50克猪油100克","p":["1，将蟹洗净放盆内加网盖，置笼内用大火蒸熟取出，下腿，用面轴滚压蟹腿使肉全部挤出。用小刀将蟹壳内的黄和肉也剔出来。2。鸡芽子肉用刀背砸成细泥放入碗内，加鸡蛋清、清汤、精盐、料酒、味精用竹筷子朝一个方向顺搅成糊为鸡茸。，","炒勺内放入猪油烧热烹入葱姜末炸至放香，倒入鸡茸泥糊进行搅炒至五成熟时，再放入蟹黄肉继续搅妙，熟后盛盘中。"]},{"i":407,"n":"油占沙蟹","r":"鲁菜","o":"鲁菜300种","f":"此菜外皮焦脆色金黄，内里鲜嫩味香美。","c":"热菜","m":["炸"],"g":["螃蟹","猪肉","面粉","鸡肉","鸡蛋"],"s":["盐","料酒","味精","淀粉","酱油","椒盐"],"t":["炒锅","蒸锅"],"v":0,"a":"主料：蟹黄、蟹肉共200克｜配料：面包200克鸡料子50克肥肉末75克面包末68750克（耗100克）｜调料：精盐5克料酒5克味精1克鸡蛋清2个湿淀粉15克辣酱油25克花椒盐面2.5克猪油10克花生油1000克","p":["活蟹洗净，入笼蒸熟，将蟹黄、肉全部剔出；面包切长15厘米、宽5厘米、厚4毫米的片，共3片。","鸡料子放入碗内，加入精盐、鸡蛋清、料酒、味精、湿淀粉用竹筷子顺一个方向搅匀后，再放入蟹黄肉、肥肉末、猪油继续搅匀，成为蟹黄糊。","将面包上先稍涂上薄薄一层糊再接着将蟹黄糊分别·涂在3块面包片上，再在湖的表面沾上一层面包末。4。炒勺内倒入花生油，中火烧至五成热时，将面包沙蟹下入油内，在小火上慢慢地炸，至漂在油面上冒细泡色金黄时捞出放在板上，每块切成5段，整齐地码在盘内上桌。食时随意蘸辣椒油或花椒盐面。"]},{"i":408,"n":"雪丽大蟹","r":"鲁菜","o":"鲁菜300种","f":"此莱制法独特，形如大蟹，蟹盖色彤红美观，其肉质鲜美异常，是山东沿海名菜。","c":"热菜","m":["炸"],"g":["螃蟹","鸡蛋"],"s":["淀粉","盐","料酒","味精","姜","醋","胡椒","椒盐"],"t":["炒锅","蒸锅"],"v":0,"a":"主料：鲜海蟹4个（重1000克）｜调料：鸡蛋清4个干淀粉15克精粉15克精盐4克料酒10克味精1克姜末20克醋50克胡椒粉0.5克花138椒盐粉5克猪油1000克（耗100克）","p":["1，海蟹洗净，入笼用大火蒸熟（约蒸15分钟）取出。把蟹盖揭下，分别将每个的两只后大腿与连接身部的肉一同取下（形如小锤），共8只，用精盐、料酒、味精、姜末、胡椒粉调合成汁，均匀撒在蟹腿的肉上稍腌。","鸡蛋清磕入碗内，用筷子搅打成泡沫；加上干淀粉、精粉、适量水调成为雪丽糊。","炒勺内倒入猪油烧至五成热时，将蟹腿逐根沾上一层雪丽糊，下入油内炸，待糊经受热膨胀鼓起炸透，取出摆在盘内，再将一个带有蟹整完整的蟹盖，扣在炸熟地蟹腿上，形似-个完美的大海蟹。上桌时随带“毛姜醋”（即姜末和醋同放一小碗内）和花椒盐粉供食者选蘸。"]},{"i":409,"n":"清蒸蟹盒","r":"鲁菜","o":"鲁菜300种","f":"此莱由蟹壳做容器，制法新颖，形色美观，味香质嫩，别有风味。","c":"热菜","m":["蒸"],"g":["螃蟹","鱼肉","猪肉","香菇","火腿","豌豆","鸡蛋"],"s":["盐","料酒","味精","葱","姜","高汤","香油"],"t":["炒锅","蒸锅"],"v":0,"a":"·主料：活毛蟹12个（约1000克）｜配料：鱼肉150克猪肥肉膘50克冬菇、火腿各25克青豆20粒’｜调料：精盐5克料酒15克味精1克鸡蛋清2个清汤200克葱姜末15克鸡油25克香油15克","p":["先将活蟹洗净，上笼蒸熟取出，·把蟹盖揭下来洗净，沥干水；蚤肉蟹黄取出切碎；肥腰肉、鱼肉切2毫米的小丁；冬菇、火腿切成末。","将鸡蛋清、鱼肉丁、肥肉丁、料酒、精盐、葱姜末、蟹肉、蟹黄、香油、清汤（50克）均放入一个碗内，搅匀成140馅，均匀地抹在12个蟹盖壳内，再撒上火腿、冬菇末，即为“蟹盒”，装入大盘内，上笼蒸熟取出。","炒勺内倒入消汤、精盐、料酒、味精、青豆烧沸撇沫，淋上鸡油，将汁浇在蟹盒上。"]},{"i":410,"n":"煎烹鱼盒","r":"鲁菜","o":"鲁菜300种","f":"鱼盒外表色金黄美观，内里鲜嫩味美。142","c":"热菜","m":["煎塌"],"g":["鱼肉","猪肉","荸荠","鸡蛋"],"s":["盐","料酒","味精","高汤","淀粉","葱","姜"],"t":["炒锅"],"v":0,"a":"主料：牙片鱼肉200克猪肉泥100克｜配料：马蹄25克｜调料：精盐3克料酒20克味精1.5克清汤150克湿淀粉50克鸡蛋3个葱姜丝3克花生油100克","p":["1。","将鱼肉片成长.4厘米、宽3厘米的夹刀片共12片。","猪肉泥放入碗内加鸡蛋清、料酒、味精、精盐朝一个方向搅匀成馅。","2。","将馅抹入加刀鱼肉片内，成盒形，两面沾上薄薄一层精粉。",".鸡蛋黄与湿淀粉放一个碗内合匀成糊。","3。","炒勺内放入猪油50克，烧至五成热时，将鱼盒匀糊下入勺内煎至底面金色翻过再煎上面，再加入下余的猪油煎至金黄色捞出。","4。","炒勺内的余油烧热烹入葱姜丝炸至放香，随即倒入JNLL清汤料酒、精盐、味精、和煎好的鱼盒稍煨出勺即成。"]},{"i":411,"n":"燕菜捶鸡丝","r":"鲁菜","o":"鲁菜300种","f":"燕菜与鸡脯肉色白滑嫩，制作技术精醇，为高档筵席珍品。","c":"热菜","m":["蒸"],"g":["鸡肉","猪肉","鸡蛋","粉丝粉皮"],"s":["盐","料酒","高汤","淀粉","葱","姜","花椒"],"t":["炒锅","蒸锅"],"v":0,"a":"主料：干燕菜25克｜配料：鸡脯肉300克｜调料：精盐2.5克料酒15克清汤400克鸡蛋清2个绿豆淀粉250克葱姜各两大片花椒水少许143","p":["燕菜的发制方法与“清汤燕菜”的发制过程相同。","把鸡脯肉上的脂皮白筋剔净，用刀背砸成细泥，放．入碗中加鸡蛋清邂匀；干淀粉压碎用箩筛过，装进白纱布袋内，铺在案板上一层干淀粉，鸡脯肉泥均摊在干淀粉上，用干淀粉纱布袋扑在鸡泥上一层，用平面木捶轻轻慢捶，边捶边扑淀粉，拯薄捶匀，拯完放在大平盘内，上笼用大火约蒸7--8分钟左右取出晾凉，切成长4厘米的长条。",".将蒸好的鸡脯肉条放入大碗内，加清汤、料酒、精盐、葱姜片、花椒水上笼蒸6分钟取出凈去汤，剔去葱姜不用，.推入大汤碗中。4。炒勺内倒入清汤和蒸鸡肉条的原汤烧沸，先留一勺汤冲入处理好的燕菜中，凈去此汤不用，燕菜推入大汤碗内捶鸡脯肉条上，将勺内的汤浇上即成。"]},{"i":412,"n":"踏雪寻梅","r":"鲁菜","o":"鲁菜300种","f":"燕丝色白如雪，梅花形鲜艳逼真，汤清味美，为高档筵席珍品。","c":"热菜","m":["蒸"],"g":["鸡肉","火腿","冬笋","白菜"],"s":["盐","酱油","料酒","高汤","味精"],"t":["炒锅","蒸锅"],"v":0,"a":"主料：燕丝15克鸡料子50克｜配料：火腿·冬笋各25克香菜心1枝｜调料：，精盐1.5克酱油5克消汤300克料酒15克味精1.5克","p":["燕菜的发制方法与“清汤燕莱”相同。冬笋切直径4144厘米、厚2毫米的片，每片沾上一层精粉糊，鸡料子摊在笋片上作成梅花形，火腿末、香莱末撒在“梅花”中心，摆入盘中，入笼蒸熟取出。2，把发好的燕丝放入碗中先留--勺清汤将燕丝浸渡，凈去汤，燕丝撒盖在蒸好的“梅花”上。","炒勺内倒入清汤、酱油（2.5克）、料酒、味精、精盐烧沸撒沫，浇在燕丝中即成。"]},{"i":413,"n":"红扒鱼翅（做法二）","r":"鲁菜","o":"鲁菜300种","f":"色泽红润光亮，鱼翅香烂味美，是高级宴席上的大件菜。","c":"热菜","m":["烧扒焖"],"g":["鱼翅","冬笋","香菇","猪肉","火腿","鸡肉","口蘑"],"s":["盐","料酒","白糖","酱油","葱","姜","淀粉","高汤"],"t":["炒锅","砂锅"],"v":0,"a":"主料：发好的白玉脊翅1000克｜配料：冬笋50克冬菇25克猪肉片150克火腿片100克猪肋骨4根鸡骨架1个鸡翅2个｜调料：精盐5克料酒50克酱油25克白糖25克葱2段姜2片湿淀粉25克，清汤1000克，口蘑汤100克，鸡油10克，猪油75克。","p":["先将鱼翅放入沸水锅内焊过，另用清汤（100克），料酒（10克），酱油（10克）、加水（500克）烧沸放进鱼翅“渡”过。冬笋切成长条片，冬菇切大片。2。炒勺内放入猪油、白糖炒至呈鸡血红色时，烹入油（20克），加清汤（100克）、料酒（10克）、葱姜，烧沸后撇去浮沫，倒入洗净的砂锅内。1483.将猪肋骨、鸡骨架排在砂锅底，鱼翅用白纱布包起来，放在鸡骨架上，上面放猪肉片、火腿、鸡翅，加清汤（750克），酱油料酒、精盐，用大火烧开，移到小火上慢炖1小时（约八成烂时），加入口蘑汤继续炖30分钟，熟烂为止。4，取出鱼翅包，放在大海碗中，解开纱布包把鱼翅排整齐、扣到12寸大平盘中（炖鱼翅的原料另做它用）。","炒勺内倒入部分炖鱼翅的原汤，再酌加清汤、精盐、料酒，烧开撇去浮沫，用湿淀粉勾芡，淋上鸡油浇在鱼翅上即成。"]},{"i":414,"n":"三丝鱼翅","r":"鲁菜","o":"鲁菜300种","f":"色泽淡红油光发亮，鱼翅软烂香醇。","c":"热菜","m":["烧扒焖"],"g":["鱼翅","海参","鸡肉","猪肉","冬笋","鸡蛋"],"s":["盐","料酒","酱油","味精","葱","姜","淀粉","高汤"],"t":["炒锅","蒸锅"],"v":0,"a":"主料：发好的鱼翅200克｜配料：水发海参100克生鸡脯肉100克冬笋75克｜调料：精盐5克酱油2.5克料酒15克.味精1.5克，葱姜丝5克鸡蛋清1个湿淀粉40克清汤250克葱油10克猪油75克·","p":["1。将发好的鱼翅用沸水焯过，捞在大碗内加清汤、料酒、葱姜，上笼蒸烂取出，整齐地摆入平盘内；将海参、冬笋均切5厘米长的丝，用沸水焯过。2。鸡脯肉切成长6厘米的细丝，放入碗内加鸡蛋清、146.精盐、湿淀粉上浆渍好，在五成热的油内滑熟捞出。","炒勺内放入猪油35克，烧热，葱姜丝炝锅，再放入酱油、清汤、精盐、料酒、海参丝、冬笋丝、鸡丝烧沸加味精，用湿淀粉勾芡颠翻，盛入大平盘内。4。净炒勺内放入猪油40克，烧至七成热时，放入葱姜丝，炸至放香，捞出不用，随即加入清汤、料酒、酱油，再把鱼翅推入汤内（形状保持整齐），烧至入味时，湿淀粉勾芡，加味精，淋入葱油，大翻勺将鱼翅盖在盘内之丝上即成。"]},{"i":415,"n":"红扒熊掌","r":"鲁菜","o":"鲁菜300种","f":"色泽红亮，软烂不腻，味香醇厚，为宴席大件莱。","c":"热菜","m":["烧扒焖"],"g":["鸡肉","猪肉"],"s":["盐","酱油","料酒","味精","葱","姜","八角","高汤","白糖","淀粉"],"t":["炒锅","蒸锅"],"v":0,"a":"主料：熊掌1只｜配料：开膛母鸡1只（750克）、带皮猪五花肉250克｜调料：精盐5克酱油25克料酒50克味精2克“葱50克姜25克：八角0.5克清汤1000克糖色10克湿淀粉25克葱油75克148.","p":["1。将熊掌放在80℃的热水中浸泡12小时，再用土泥把熊掌包严（泥厚6毫米），放在中火上慢慢烤2小时左右取出，将泥去，放入热水中反复冲洗3一4遍，再放入水锅内用小火煮1小时左右取出，择净毛根；剥去趾甲和脚底老皮，从掌背开刀剔出大骨，保留指头骨环，趁热抹少许糖色，放入八成热油中炸成红色，捞出放入大碗内，掌面朝下。2，鸡剁成3厘米大的块，肉切成大片，均用沸水煮两个滚捞出装入熊掌碗内。3。炒勺内放入葱油50克烧热烹入凿油、料酒、八角、清汤、精盐、葱姜烧沸撇沫倒入熊掌碗内，上笼用大火蒸至熊掌熟烂时取出，挑去葱姜、鸡、肉不用。","蒸熊掌的原汤凈入炒勺内，熊掌扣入大平盘内，掌心朝上，炒勺内的汤用湿淀粉勾芡，加味精烧沸，淋上葱油，浇在熊掌上。"]},{"i":416,"n":"大葱烧海参","r":"鲁菜","o":"鲁菜300种","f":"色泽红亮，海参滑润，葱香味浓，常用于宴席上的大件菜。","c":"热菜","m":["烧扒焖"],"g":["海参"],"s":["葱","盐","酱油","料酒","味精","高汤","淀粉","八角","白糖"],"t":["炒锅"],"v":0,"a":"主料：水发刺参500克100克：｜配料：大葱150克｜调料：精盐4克酱油20克料酒25克味精1.5克清汤500克湿淀粉25克八角1大粒白糖25克花椒油15克猪油50克半","p":["1。将海参用坡刀片成两片，在开水内焯过，另用清汤渡过；大葱切成长5厘米的段，两头各打上花刀。","炒勺内放入猪油、白糖炒成红色时，放入八角、大葱稍炸，随即放入海参、酱油、清汤、料酒、精盐在中火上烧至入味时用湿淀粉勾芡，加味精，淋上花椒油即成。"]},{"i":417,"n":"蝴蝶海参（做法二）","r":"鲁菜","o":"鲁菜300种","f":"此莱形如翩翩蝴蝶，漂浮在汤面上，美观大方，汤清味美。","c":"热菜","m":["蒸"],"g":["海参","鸡肉","鱼翅","芝麻","香菇","黄瓜"],"s":["盐","料酒","味精","高汤"],"t":["炒锅","蒸锅"],"v":0,"a":"主料：水发海参4个（约重200克）｜配料：鸡料子100克鱼翅针24根黑芝麻24粒人腿丝冬菇丝黄瓜皮丝各10克｜调料：精盐2.5克料酒5克味精1克清汤500克","p":["1：将海参顺长片成大片共12片，在沸水中焯过，用洁布振干水分，用小刀刻成蝴蝶形状。","鸡料子加鸡蛋清、料酒、精盐搅匀作成12个蝴蝶身子，横放在海参片中间。黑芝麻安在头顶两端当“眼”。火腿、冬菇、黄瓜皮丝切成1厘米长，3种丝交叉横摆在蝴蝶的身子上。鱼翅针作*须\"共12只蝴蝶，摆在擦过油的盘中，上笼蒸3分钟取出。","炒勺内倒入清汤、加精盐、料酒烧沸撤沫加味精，将此汤盛入大汤盘中，将蒸好的“蝴蝶”轻轻推入盘内150汤中。"]},{"i":418,"n":"扒玉珠海参","r":"鲁菜","o":"鲁菜300种","f":"海参内入鸡肉泥软嫩鲜香，白色鹤鹑蛋装饰在周围美观大方，是宴席上常用的大件莱。·","c":"热菜","m":["烧扒焖"],"g":["海参","鸡蛋","鸡肉","荸荠"],"s":["盐","料酒","味精","高汤","淀粉","葱","姜","香油"],"t":["炒锅","蒸锅"],"v":0,"a":"主料：水发海参12个．鹤鹑蛋24个｜配料：鸡料子200克清水马蹄25克.｜调料：精盐5克料酒10克味精1克清汤200克湿淀粉25克·鸡蛋清1个葱姜末3克香油10克","p":["1。整个海参用沸水焯过；鸡料子加鸡蛋清、葱姜末、马蹄末、精盐、香油、味精、料酒搅匀成馅，抹入每个海参的腹内，摆在大盘内上笼蒸熟取出。鹤鹑蛋煮熟去皮摆在蒸熟的海参周围称“玉珠”。","炒勺内放入清汤、料酒、精盐烧沸，湿淀粉勾芡加味精成白玉卤，浇在盘内海参上即成。"]},{"i":419,"n":"玛瑙海参","r":"鲁菜","o":"鲁菜300种","f":"鸡肉片色白似玛瑙，配以各色圆球装饰，汁油明亮，美观状丽，软嫩清淡，烹调过程精湛。","c":"热菜","m":["蒸"],"g":["海参","鸡肉","猪肉","萝卜","冬笋"],"s":["盐","料酒","味精","淀粉","葱","姜","高汤"],"t":["炒锅","蒸锅"],"v":0,"a":"主料：水发海参200克鸡脯肉150克｜配料：大红萝卜青萝卜·窝笋谷500克151'｜调料：精盐5克料酒10克味精1克干淀粉150克湿淀粉25克，清汤500克葱姜各2片葱油50克","p":["海参片成长抹刀片，沸水焯过；鸡脯肉片成片用料酒、精盐稍腌，着干淀粉，用平面木锤轻轻捶成薄片，裁成与海参同样大的片，在沸水内婷过捞出；一片海参、一片鸡肉片，叠压式的摆在碗内，放上葱姜片，上笼蒸5分钟取出，去掉葱姜片，扣入盘内。","红萝卜、青萝卜、窝筹均削成直径1厘米的圆球共30个，用清水煮透，再换用清汤、精盐、料酒收透捞出，摆在蒸熟的玛瑙海参的周围。","炒勺内倒入清汤，加精盐、料酒、湿淀粉烧沸撇去浮沫，加味精，淋上葱油浇在玛瑙海参与红绿白色的球上即成。"]},{"i":420,"n":"千贝四丝","r":"鲁菜","o":"鲁菜300种","f":"四丝鲜香味醇，汁浓明亮，为筵席中的大件名菜。","c":"热菜","m":["爆炒"],"g":["干贝","海参","鸡肉","猪肉","冬笋","鸡蛋"],"s":["盐","白糖","酱油","料酒","味精","葱","姜","高汤","淀粉"],"t":["炒锅"],"v":0,"a":"主料：水发干贝200克｜配料：水发海参100克生鸡肉丝50克冬笋丝100克｜调料：精盐2.5克酱油15克白糖15克鸡蛋清1个料酒15克味精1克清汤150克葱姜米2.5克湿淀粉40克葱油15克白油500克（耗75克）152","p":["1.将干贝均搓成细丝。","海参、冬笋切2毫米粗的细丝，均用沸水过。","2。","鸡肉丝用蛋清、精盐、湿淀粉抓匀养好，炒勺内放进白油烧至四成热时，养好的鸡丝滑透捞出。","，3。","炒勺内放进猪油50克、白糖炒至呈鸡血红色时放进葱姜末、酱油、清汤150克、料酒10克烧沸捞出葱姜末（将此汁的一半留出放入碗内），将鸡丝、海参、冬笋丝放入勺内稍烨，湿淀粉勾芡加味精盛在盘内。","4。","将腕内的汁与干贝丝倒入炒勺内加热稍，用湿淀粉勾芡，淋上葱油，将干贝丝蒙在盘内之丝上即成。","‘。"]},{"i":421,"n":"红烧干贝","r":"鲁菜","o":"鲁菜300种","f":"干贝是海产佳品，鲜香味美，营养丰富。！","c":"热菜","m":["烧扒焖"],"g":["干贝","火腿","香菇","冬笋"],"s":["盐","料酒","味精","白糖","葱","姜","酱油","高汤","淀粉"],"t":["炒锅"],"v":0,"a":"（·主料：发好干贝200克｜配料：火腿冬菇玉兰片各20克｜调料：精盐1.5克料酒10克味精1克白糖15克酱油5克清汤250克葱姜15克湿淀粉25克花椒油10克猪油50克","p":["1，火腿、玉兰片、冬菇均切成2厘米的方丁。","2，炒勺内放入猪油、白糖炒成红色时放入葱姜块、清汤、酱油、料酒、干贝、玉兰片、冬菇、火腿、精盐烧沸，153在小火上烧至入味时，捞出葱姜不用，用湿淀粉勾芡，加味精，淋上花椒油即成。"]},{"i":422,"n":"鸡汁干贝","r":"鲁菜","o":"鲁菜300种","f":"色泽洁白松软鲜嫩。","c":"热菜","m":["爆炒"],"g":["鸡肉","干贝","火腿","黄瓜","鸡蛋"],"s":["盐","料酒","味精","淀粉"],"t":["炒锅"],"v":0,"a":"主料：发好的干贝100克鸡料子50克｜配料：火腿末黄瓜皮末各5克｜调料：精盐2.5克料酒10克味精1克清荡100克鸡蛋清5个湿淀粉10克猪油50克半","p":["鸡蛋清磕入碗内用竹筷子抽打成泡沫糊；鸡料子先用少量清汤开；干贝用手成丝。","将鸡料子和干贝丝、精盐、料酒、味精、清汤、湿淀粉均放入蛋泡糊内搅匀。","炒勺内倒入猪油烧至四成热时，倒入搅好的干贝、鸡料子，用手勺不断地推动搅炒（用中火）熟后盛入盘中，撒上火腿、黄瓜皮末即成。"]},{"i":423,"n":"扒四宝于贝","r":"鲁菜","o":"鲁菜300种","f":"汁色白亮，整齐美观，味醇鲜。","c":"热菜","m":["烧扒焖"],"g":["干贝","火腿","冬笋","香菇"],"s":["盐","料酒","味精","葱","姜","高汤","淀粉"],"t":["炒锅","蒸锅"],"v":0,"a":"主料：发好干贝100克火腿50克半冬笋100克冬菇6个154｜调料：精盐4克料酒5克味精1克葱姜片10克清汤250克湿淀粉15克葱油15克：","p":["1。火腿、冬菇、冬笋均切成长5厘米、宽2厘米的长方片。","取中碗1个，将干贝整齐地摆在碗底成圆形，直径约5厘米，再将火腿、冬笋、冬菇片差色整齐地摆在干贝的周围，余下的原料均装入碗内中间，放上葱姜片、清汤、精盐、料酒上笼蒸透取出，汤汁凈在炒勺内，去掉葱姜不用，碗内的四宝干贝反扣在大平盘内。","炒锅内加清汤、精盐、料酒、味精、湿淀粉烧沸撒沫，淋上葱油浇在盘内四宝干贝上即成。"]},{"i":424,"n":"绣球干贝（做法二）","r":"鲁菜","o":"鲁菜300种","f":"阅形色淡黄美观似绣球，软嫩鲜香味美。","c":"热菜","m":["蒸"],"g":["干贝","鱼肉","猪肉","香菇","白菜","火腿","鸡蛋"],"s":["盐","料酒","味精","淀粉","葱","姜","高汤"],"t":["炒锅","蒸锅"],"v":0,"a":"主料：·发好的干贝150克鱼肉泥150克｜配料：香菇15克油菜心12棵火腿末油菜叶末各少许｜调料：精盐4克料酒15克味精1克鸡蛋清2个清汤200克湿淀粉25克葱姜末2.5克鸡油15克猪油25克","p":[".将干贝上笼蒸好，取出搓成丝放在盘内。2。鸡蛋清磕入碗内，用竹筷子抽打起沫，加入鱼肉泥、精盐、料酒、味精、葱姜末、猪油向一个方向顺搅成料。用155手挤成直径1.5厘米的圆球，放在干贝丝上，使圆球皮面粘满一层干贝丝。3，香菇切成细丝，搭在干贝球上成十字花形，并在十字中心点上一点糊，再撒在糊上一点火腿末和油菜叶末，上笼蒸熟。4。油心洗净，在沸水锅内焯过，根朝里摆在盘的周围，蒸好的绣球干贝摆在盘中心。","炒勺内倒入清汤，加入精盐、料酒、味精、烧沸撇沫，用湿淀粉勾芡，淋上鸡油浇在绣球干贝和油菜心上。"]},{"i":425,"n":"扒原壳鲍鱼（做法二）","r":"鲁菜·胶东","o":"鲁菜300种","f":"鲍鱼肉鲜嫩味美，制熟后又分别盛在各个原来的壳内，它的造型美观且又名贵，是一种造型和盛器双重配合的杰作。在我省青岛沿海等地","c":"热菜","m":["烧扒焖"],"g":["鲍鱼","鱼肉","火腿","冬笋"],"s":["盐","料酒","味精","高汤","淀粉"],"t":["炒锅","蒸锅"],"v":0,"a":"主料：带壳鲜鲍鱼12个｜配料：鱼料子200克火腿25克冬笋25克｜调料：精盐4克料酒10克味精.1克清汤500克湿淀粉15克鸡油10克","p":["、1，带壳鲍鱼洗净，放入沸水内稍烫，把肉挖出；洗去杂质，片成薄片：火腿、冬笋切长3厘米的片。2。沸水内加少量碱粉，将鲍鱼壳放入，用草根刷子刷洗干净，再用沸水煮过捞出。","鱼料子加蛋清、精盐、料酒、清汤搅匀湃好后，倒在大平盘内摊平，将鲍鱼壳口朝上，整齐地摆在鱼料子上，156让其沾住坐稳，上笼蒸约5分钟取出。4。炒勺内倒入清汤，加精盐、料酒、火腿、冬笋、鲍鱼片烧沸，撇去沸沫，用漏勺捞出，分放在每个鲍鱼壳内，：炒勺内的汤用湿淀粉勾芡，加入味精，淋上鸡油，浇在各鲍鱼壳内·"]},{"i":426,"n":"麻酱鲍鱼","r":"鲁菜","o":"鲁菜300种","f":"，鲍鱼肉鲜嫩，有浓厚的芝麻香味，爽口不腻，此为高档菜肴。","c":"热菜","m":["烧扒焖"],"g":["鲍鱼","猪肉"],"s":["芝麻酱","盐","葱","姜","酱油","白糖","高汤"],"t":["炒锅"],"v":0,"a":"主料：鲜鲍鱼肉300克｜调料：芝麻酱50克10克精盐1.5克酱油50克葱姜末15克清汤150克白糖10克鸡油10克花生油25克","p":["将鲜鲍肉洗净，在鲍鱼肉的两面上交叉刀纹，再切成1厘米宽的条，用沸水烫过捞出控净水。","炒勺内放入花生油，烧至七成热时烹入葱姜末炸至放香，随即加入清汤、酱油、精盐、白糖、鲍鱼肉条烧沸，倒入芝麻酱用手勺搅匀，淋上鸡油即成。"]},{"i":427,"n":"锅贴鲍鱼盒","r":"鲁菜","o":"鲁菜300种","f":"两面色金黄美观，鲍鱼鲜嫩味美。","c":"热菜","m":["爆炒"],"g":["鲍鱼","猪肉","鱼肉","鸡肉","鸡蛋"],"s":["盐","味精","高汤","淀粉","香油"],"t":["炒锅"],"v":0,"a":"主料：鲜鲍鱼肉150克猪肥膘肉150克鱼肉100克鸡芽子肉50克｜配料：油菜叶100克鸡蛋100克｜调料：精盐3克.料洒10克味精1克鸡蛋清1个清汤100克精粉25克湿淀粉10克香油10克花生油150克","p":["1。将鱼肉、鸡芽子肉，剔去白筋脂皮，用刀背砸成细泥，加精盐、鸡蛋清、料酒、味精、香油照搅成馅。","鲜鲍鱼肉、肥腮肉均切成长4厘米、宽2厘米、厚3毫米的片各12片，并在片中间用刀尖截上几个眼（以免卷缩）。油莱叶也切与以上同样大的片。3，肥肉片铺平，每片抹上一层馅，贴上一片鲍鱼片，鲍鱼片上抹点精粉糊，再贴上一片油菜叶共12个，谓之“鲍鱼盒”。4。鸡蛋磕入碗内，加上湿淀粉搅打均匀成蛋液，一半倒在平盘内摊平，鲍鱼盒的底面与上面均沾上一层薄薄精粉，放在平盘的蛋液上，再将另一半蛋液倒在鲍鱼盒的顶面。、5：炒勺内倒入花生油，烧至六成热时，将沾满蛋液的鲍鱼盒轻轻推入勺内，移至小火上煎，煎至底面金黄色时，翻过来顶面朝下再煎黄后，加上清汤、精盐、料酒煨至熟透158汁尽时，淋上香油，翻扣在盘内即成。"]},{"i":428,"n":"蟹黄鱼肚","r":"鲁菜","o":"鲁菜300种","f":"，鱼肚色白绵软，味浓醇厚。","c":"热菜","m":["爆炒"],"g":["螃蟹","鱼肚","冬笋","香菇"],"s":["盐","料酒","味精","姜","高汤","淀粉"],"t":["炒锅"],"v":0,"a":"主料：水发鱼肚300克蟹黄100克｜配料：冬笋冬菇各25克｜调料：精盐3克料酒10克味精1克.清汤250克姜末2.5克湿淀粉15克.葱油50克25克鸡油5克","p":["1．将鱼肚、冬笋、冬菇均片成长条片，在沸水内焯过。","2。","炒勺内倒入葱油烧热，放入蟹黄、姜末煸熟，加入清汤、鱼肚、冬笋、冬菇、精盐、料酒稍爆，用湿淀粉勾芡加味精，淋上鸡油即成。","，。"]},{"i":429,"n":"奶汤鱼肚","r":"鲁菜","o":"鲁菜300种","f":"汤色乳白，鱼肚绵软，味鲜醇厚。","c":"汤羹","m":["烩汆"],"g":["鱼肚","口蘑","火腿","白菜"],"s":["高汤","盐","料酒","味精","姜"],"t":["炒锅"],"v":0,"a":"主料：水发鱼肚100克｜配料：鲜口蘑12个火腿15克油菜心2个｜调料：精盐3克料酒15克味精2.分奶汤500克姜￥59汁10克葱油50克","p":["1。","将鱼肚切成长5厘米、宽3厘米的块，用沸水过；火腿切成象眼薄片；口藤每个切两半，和菜心同用沸水焯过。","2。","炒勺内放入葱油，烧到六成热时，倒入奶汤、放进鱼肚块、口蘑、菜心、精盐、料酒烧沸撤沫，加味精、姜汁，盛入汤碗内撒上火腿片即成。"]},{"i":430,"n":"葱扒鱼唇","r":"鲁菜","o":"鲁菜300种","f":"鱼唇红润油亮，绵软滑润，其味香醇。","c":"热菜","m":["烧扒焖"],"g":["鱼唇","猪肉","鸡肉"],"s":["葱","盐","酱油","白糖","高汤","姜","蒜","花椒","料酒","淀粉"],"t":["炒锅","砂锅"],"v":0,"a":"主料：水发鱼唇750克｜配料：大葱白250克｜调料：带皮猪肉250克母鸡大腿两根生鸡骨架1个猪肋条8根精盐10克酱油50克白糖25克清汤1250克葱50克姜蒜片各25克葱椒料酒100克湿淀粉50克猪油250克（耗100克）","p":["将鱼唇切成长5厘米，宽2厘米、厚3毫米的片，大葱白切6厘米长的段。","猪肉切厚4毫米的片；鸡腿剞成3段，鸡骨架劈开；猪肋条每根剁两段，均用沸水焯过。1603。将鱼唇块放入锅内加清水煮，反复换水3遍，用洁白纱布包起来。4，取大砂锅一个，猪肋骨与鸡骨架摆在砂锅底，再放入鱼屑包、鸡腿、猪肉、葱、姜、蒜。","炒勺内倒入猪油50克、白糖加热炒成鸡血红色时，加进酱油、葱椒料酒、烧沸撤沫，倒在大砂锅内，用大火烧沸，随即移到小火上煨炖1小时左右，至九成烂时，鱼唇包取出，解去纱布，放在盘内。6。炒勺内倒入猪油烧热，放入大葱白炸出香味，津去油，烹入酱油及葱椒料酒，稍煤，将大葱盛在鱼唇盘的一边。7。炒勺内倒入清汤250克、酱油、葱椒料酒烧沸撇沫，湿淀粉勾芡，淋上明油，浇在鱼唇和大葱上即成。"]},{"i":431,"n":"云片猴头","r":"鲁菜","o":"鲁菜300种","f":"各种配料色泽相间似彩云，鲜嫩清香可口。","c":"热菜","m":["蒸"],"g":["火腿","香菇","冬笋","黄瓜"],"s":["盐","料酒","淀粉","酱油","味精","高汤"],"t":["炒锅","蒸锅"],"v":0,"a":"主料：干猴头蘑150克｜配料：火腿冬菇冬笋各100克黄瓜皮50克｜调料：精盐2克酱油料酒湿淀粉各15克味精1克清汤150克","p":["1。猴头蘑放在沸水内焖软，取出择去刺针和老根，挤161净水，切厚2毫米的片；火腿等配料均切与猴头蘑同样大的片。","将猴头蘑片与配料各片相间地分层次摆成3排，正、面朝下放入碗内，清汤、酱油、料酒对成汁浇入猴蘑的碗内，上笼用旺火蒸1小时取出翻扣在盘内。","将蒸猴头蘑的原汁凈入炒勺内加精盐、湿淀粉、味精烧沸浇在盘内猴头上即成。"]},{"i":432,"n":"酿猴头蘑","r":"鲁菜","o":"鲁菜300种","f":"汁卤色白明亮，菜形美，味鲜香。","c":"热菜","m":["蒸"],"g":["鸡肉","火腿"],"s":["香菜","盐","高汤","料酒","味精","淀粉"],"t":["炒锅","蒸锅"],"v":0,"a":"主料：发好的猴头蘑1对鸡料子150克｜配料：火腿50克香菜叶50克｜调料：精盐4克清汤400克料酒25克味精1.5克精粉100克湿淀粉40克·鸡油15克","p":["1．猴头蘑用洁布振干水分，切厚2毫米的大片12片；火腿用小万刻成各种小花瓣状；香菜叶洗净。","2。","鸡料子加鸡蛋清、精盐、清汤邂开成糊。","3。","猴头蘑平铺在板上，拍上薄薄一层精粉，抹上一层鸡料糊，（要光滑平整）。","上摆火腿花和香菜叶（均呈花形），摆在盘内上笼蒸熟取出，再摆在另-·盘中。",".4，炒勺内倒入清汤、加精盐、料酒、味精、湿淀粉烧162沸撒沫淋入鸡油成“白玉卤”浇在蒸好的猴头蘑上。"]},{"i":433,"n":"蕃茄乌鱼蛋","r":"鲁菜","o":"鲁菜300种","f":"色彤红油亮，甜酸嫩咸鲜香。163","c":"热菜","m":["烧扒焖"],"g":["墨鱼","口蘑","豌豆","荸荠","西红柿"],"s":["白糖","醋","盐","料酒","高汤","味精","淀粉"],"t":["炒锅"],"v":0,"a":"主料：乌鱼蛋100克｜配料：口蘑豌豆：马蹄各50克｜调料：番茄酱75克白糖75克醋10克精盐1.5克清汤100克料酒10克味精1克湿淀粉15克葱油50克","p":["1。","干乌鱼蛋的发制处理方法参看“烩乌鱼蛋”的说明；口蘑、马蹄切片与碗豆均用沸水焊过。","2。","炒勺内倒入葱油烧热，加入番茄酱沸熟，加入白糖·醋、清汤、精盐、料酒、口蘑、马蹄、豌豆、乌鱼蛋、湿淀粉、味精烧沸即成。"]},{"i":434,"n":"烩乌鱼蛋：","r":"鲁菜","o":"鲁菜300种","f":"酸、辣、咸香，食之不腻。164","c":"汤羹","m":["烩汆"],"g":["墨鱼","香菇","冬笋"],"s":["香菜","盐","醋","酱油","料酒","胡椒","高汤","淀粉","葱","姜","香油"],"t":["炒锅"],"v":0,"a":"主料：乌鱼蛋100克｜配料：冬菇冬笋香菜各50克｜调料：精盐3克酱油10克醋40克料酒15克清汤400克胡椒粉1克湿淀粉25克葱姜丝5克猪油25克香油15克","p":["先将乌鱼蛋洗净，放入冷水锅内慢慢加热煮沸倒入盆内，浸泡6小时左右，撕去外表薄膜脂皮，将乌鱼蛋撕成一片片的圆形小片（似榆树钱状）。放入冷水锅内加热至水温到90℃（如此反复5一6次）以达去净其咸腥味。","冬菇、冬笋切片沸水焯过；香菜洗净去老叶切成长2厘米的段与胡椒粉放入大汤碗内。3。炒勺内放入猪油烧热，投入葱姜丝炸出香味、随即烹入醋、加入酱油、清汤、精盐、料酒、乌鱼蛋、冬菇、冬笋烧沸撤沫，用湿淀粉勾芡，淋入香油，盛入有香菜的大汤碗内即成。"]},{"i":435,"n":"炸鲜贝串","r":"鲁菜","o":"鲁菜300种","f":"、鲜香软嫩，·味美适口，色彩艳丽，造型别具一格。165","c":"热菜","m":["炸"],"g":["鲜贝","猪肉","火腿","白菜","鸡蛋"],"s":["盐","料酒","味精","淀粉"],"t":["炒锅"],"v":0,"a":"主料：鲜贝24个（200克）｜配料：猪肥膘肉熟火腿青菜心叶各50克｜调料：精盐2.5克鸡蛋清3个料酒10克味精1克精粉50克湿淀粉10克小竹扦12根花生油500克（约耗40克）","p":["1。将鲜贝放入碗内，加料酒、味精、精盐腌溃约10分钟。猪肥肉、火腿均切2厘米见方、厚3毫米的片。青菜心叶洗净。","竹扦洗净消毒光滑洁净，每根竹扦先穿1个鲜贝，接穿1个青菜心叶，再穿1片肥肉，1片火腿，如此次序再穿一遍为1串，共12串。鸡蛋清磕入汤盘内，用竹筷子打成泡沫状，加入湿淀粉、精粉调匀成蛋泡糊。3，炒勺内倒入花生油，在中火上烧至五成热时，将鲜贝串先沾上一层薄薄地精粉，再沾上蛋泡糊，下入油内炸，至有七成熟时捞出，抽去竹托。待油温升至八成热时，将抽去竹扦的鲜贝串重投入油内再炸，至呈淡黄色捞出，摆入盘内。上桌时，外带花椒盐面1小碟。"]},{"i":436,"n":"凉拌鲍鱼","r":"鲁菜","o":"鲁菜300种","f":"清淡味鲜，佐酒佳肴，是海产鲜品名菜。二〇四蚝油鲍鱼主料：鲜鲍鱼肉250克调料：蚝油10克精盐1克酱油10克清汤250克料酒5克湿淀粉","c":"凉菜","m":[],"g":["鲍鱼","黄瓜","青蒜"],"s":["酱油","芝麻酱","胡椒","香油"],"t":["炒锅"],"v":0,"a":"主料：鲜鲍鱼250克｜配料：‘黄瓜100克｜调料：辣酱油15克芝麻酱50克芥茉汁20克胡椒面.1克芝麻油10克蒜苗2.5克","p":["将鲍鱼的边撕去，洗净片成薄片；黄瓜切成香蕉形薄片，摆放在盘底，把鲍鱼片摆在黄瓜片上，然后把鲍鱼原汁倒上50克即成。","把以上6种调料，分别放在6个小碟中，摆在餐桌上，任意选蘸食之。"]},{"i":437,"n":"什锦西瓜蛊","r":"鲁菜","o":"鲁菜300种","f":"此菜系清凉爽口的甜菜，为夏令季节佳品，其外形表面具有艺术性的花纹图案，在酒席宴上供观赏和趣味性快乐。160","c":"甜品","m":["烧扒焖"],"g":["山楂","荸荠","梨","鸭肉","莲子"],"s":["白糖"],"t":["炒锅"],"v":0,"a":"主料：长形西瓜1个（重4--2500克）桔子菠萝红果南荠鸭梨水发莲子水发银耳肥城桃红樱桃果脯等各100克｜调料：白糖250克","p":["先将西瓜洗净，从瓜把起量高20厘米处，绕瓜皮外圆一周，先划上一条虚线，沿此虚线将西瓜切开成为两半，瓜把部分做“盅”用，而且也是主体部分，另一半瓜头部可当“垫”用，西瓜头部削平。并挖出西瓜瓣去籽备用。2。西瓜盅的主体和垫的表皮面，可以用小刀刻出各种花样的装饰图案（如金鱼荷花，鸳鸯戏水）等等。刻完洗净，再用沸水烫过晾凉。","将菠萝、鸭梨、桃、果脯、南荠、红果均切1.5厘米见方的丁，连同桔子、莲子、银耳均用沸水焊过，均放入同一个锅内加白糖，和水烧沸，撇去浮沫，倒入盆中晾凉，存入冰柜中。4。取大平盘1个，瓜蒂头部削平处朝下放平盘中为垫，西瓜盅的主体放在垫上，先将西瓜留入盅内，再从冰柜中取出菠萝等料，也放在盅内，并摆上红楼桃即成。"]},{"i":438,"n":"红果","r":"鲁菜","o":"鲁菜300种","f":"色彤红发亮，甜酸适宜，开胃助消化。","c":"甜品","m":["烧扒焖"],"g":["山楂"],"s":["白糖","桂花酱"],"t":["炒锅"],"v":1,"a":"主料：红果（又名山楂）1000克｜调料：白糖500克桂花酱5克","p":["1，山楂洗净，用直径5毫米的铁管桶去核，成算盘珠形状。放入清水锅内小火煮至五成熟时捞出，剥去外皮。","锅内放清水200克，加入白糖烧沸使糖熔化，撇沫，倒入红果在小火上，至汁浓时加入桂花酱，轻轻搅匀，倒入盘内晾凉即成。，"]},{"i":439,"n":"蜜腊莲子","r":"鲁菜","o":"鲁菜300种","f":"软糯香甜，入口即化，其色微黄象似挂一层蜂腊，而故名。172=IO","c":"甜品","m":["烧扒焖"],"g":["莲子"],"s":["白糖","蜂蜜","桂花酱"],"t":["炒锅"],"v":1,"a":"主料：水发莲子500克｜调料：冰糖150克蜂蜜50克桂花酱2.5克猪油5克","p":["汤勺内倒入清水250克，加入冰糖，烧沸至糖熔化后，撇去浮沫，将莲子放入，移至小火上至水分将尽时，再加入桂花酱、猪油、蜂蜜调匀即成。","（关键制作时，糖的数量要恰当，多则莲子不烂发硬，少则莲子容易开花）。"]},{"i":440,"n":"蜜汁山药饼","r":"鲁菜","o":"鲁菜300种","f":"．外表色泽红亮，皮酥脆，馅绵软，香甜味美。173","c":"甜品","m":["爆炒"],"g":["山药","糯米"],"s":["白糖","桂花酱","香油"],"t":["炒锅","蒸锅"],"v":1,"a":"主料：山药500克｜配料：炒好的豆沙泥100克糯米面500克（耗100克）｜调料：白糖200克桂花酱5克香油50克花生油1000克（耗1一100克）","p":["生山药洗净，放入笼屉内蒸熟，取出晾凉，剥去外皮，放在板上用刀面抿压成细泥，加入糯米面50克搅匀。、再将糯米面撒在板上一层，把山药泥放在糯米面上面，摊开压成厚1.5厘米；再将糯米面撒在山药饼上一层，（目的防止粘手）。用刀切成2.5厘米见方的块。","豆沙泥用手搓成直径粗1厘米的长条，再切成长1厘米的块（与山药泥切等量块数）。3，将山药泥逐块压扁，蘸着米面把豆沙泥块包起，轻轻压成扁圆形的饼。4：炒勺内倒入花生油，烧至六成热时，山药饼下入油内炸5分钟左右，见星金黄色捞出。","炒勺内放入香油、白糖50克炒至呈鸡血红色时，加入开水200克及余下的白糖、桂花酱烧沸，用漏句捞出桂花楂，再移至小火上，将注燎浓，山药饼倒入糖汁内，都挂上一层糖汁即成。"]},{"i":441,"n":"-二","r":"鲁菜","o":"鲁菜300种","f":"：色泽金黄明亮，脆嫩甜香美口。一","c":"热菜","m":["爆炒"],"g":["鸭肉","梨","鸡蛋"],"s":["白糖","蜂蜜","淀粉"],"t":["炒锅"],"v":0,"a":"主料：大鸭梨500克｜调料：白糖150克蜂蜜50克精粉25克湿淀粉25克174鸡蛋清1个花生油1000克（耗50克）","p":["1。","鸭梨削皮，去核，切长4厘米，粗2毫米的细丝，放入盆内，加鸡蛋清、湿淀粉，精粉调匀，团成直径3厘米大的圆球形。","2。","炒勺内倒入花生油，烧至六成热时，将梨球逐个下入油内，炸至呈金黄色，捞出沥净油。","3。","炒勺内留底油，先加入白糖50克，炒至金黄色时，倒入清水100克和剩余的白糖，烧沸撤沫，再将梨球投入后颠翻稍，至汁浓时，出勺加入蜂蜜，淋上明油即成。","：。"]},{"i":442,"n":"晶糕拌梨丝","r":"鲁菜","o":"鲁菜300种","f":"色红白相间，甜酸凉爽清口。175","c":"甜品","m":["爆炒"],"g":["梨","山楂"],"s":["白糖","淀粉","桂花酱"],"t":["炒锅"],"v":1,"a":"主料：莱阳梨2个（重300克）山楂糕200克｜调料：白糖100克湿淀粉10克桂花酱1.5克","p":["1.将梨削去皮，挖去核，切2毫米厚的片，晶糕也切同样厚的片。","在两片梨中夹1片晶糕，再切成2毫米粗的丝，整齐的码在盘内。","2，炒勺内加少量水，白糖、桂花酱烧沸用湿淀粉勾稀芡撒沫，倒出晾凉成糖卤，浇在晶糕梨丝上即成。"]},{"i":443,"n":"水晶桃","r":"鲁菜","o":"鲁菜300种","f":"桃子软嫩香甜，消凉爽口，外裹糖汁冷凝后透明发亮似水晶。二一六杏仁豆腐料·主料：杏仁15克冻粉2.5克配料：晶糕25克调料：白150克","c":"甜品","m":["蒸"],"g":["桃"],"s":["白糖"],"t":["炒锅","蒸锅"],"v":1,"a":"主料：大肥桃750克晶糕15克｜调料：白糖200克香燕精1滴猪油30克","p":["1，将大肥桃去皮、核，切成桔瓣形状的块、洗净，放入碗内加白糖2丙，上笼用旺火蒸20分钟左右取出；晶糕切梅花形小片。","1762。","炒勺内放入清水、白糖，烧沸撇沫，加入猪油成浓汁，加香蕉精搅匀，·倒在盛桃的碗内，晾凉，再放入水柜内冰凉后取出，扣在盘内，再撒上晶糕梅花小片即成。"]},{"i":444,"n":"栗子糕","r":"鲁菜","o":"鲁菜300种","f":"香甜软糯，味美爽口。","c":"甜品","m":["蒸"],"g":["栗子"],"s":["白糖","桂花酱"],"t":["炒锅","蒸锅"],"v":1,"a":"主料：栗子500克｜调料：白糖150克青红丝5克桂花酱5克","p":["在栗子的顶端上十宇刀纹，放入清水锅内煮5分钟左右，捞出，剥去外皮，切成薄片，放入碗内，加清水100克上笼用大火蒸熟取出。","将蒸熟的栗子放在板上，用刀面压成细泥。","白糖、桂花酱放入炒勺内加热熔化，熬成糖卤，与栗子细泥合匀，摊在板上，用刀面压平约5毫米厚，上撒青红丝和白糖粉，撒完再用刀面压实，切成象眼块码在盘内即成。"]},{"i":445,"n":"拔丝金枣","r":"鲁菜","o":"鲁菜300种","f":"金黄油亮，外皮酥脆，制法独特，别具风采。","c":"甜品","m":["爆炒"],"g":["红枣"],"s":["白糖"],"t":["炒锅"],"v":1,"a":"主料：红枣400克｜配料：晶糕100克｜调料：白糖150克精粉50克花生油500克","p":["1。","红枣用清水洗净，放入锅内加水用小火烧沸煮透，约六成熟左右捞出，剥去外皮，将核捅去；晶糕切短条，进去核的每个枣内，仍保持原来的枣形，然后滚沾上薄薄的一层精粉。","2。","炒勺内倒入花生油，烧至六成热时，将蘸过精粉的红枣，下入油内炸至金黄色捞出（在炸时应不断地使红枣在油内滚动，使外表色泽均匀）。","即为金枣。","3。","炒勺内留底油，放入白糖溶化，炒至金黄色将要拔丝时，将炸好的金枣，倒入糖汁内，炒勺离开火口，不断的颠翻挂匀，盛入抹过油的盘内即成。"]},{"i":446,"n":"拔丝苹果","r":"鲁菜","o":"鲁菜300种","f":"色泽金黄，拔丝细长，外酥脆香甜，内里软嫩微酸。琉璃桃仁斗·原料洋主社：核桃仁300克W挑料：白糖150克花生油500克（约耗50克）做","c":"甜品","m":["爆炒"],"g":["鸡蛋"],"s":["白糖","淀粉","桂花酱"],"t":["炒锅"],"v":1,"a":"主料：苹果500克｜调料：白糖150克鸡蛋清1个湿淀粉50克精粉25克桂花酱1.5克花生油1000克（耗50克）180.","p":["1。","将苹果削去皮、核，切成桔瓣形块；鸡蛋清与湿淀粉混合搅匀成糊；苹果块滚上一层薄薄的精粉。","2。","炒勺放在大火上，倒入花生油，烧至七成热时，把苹果块沾上糊，下入油内炸，勺移在中火上，炸至呈金黄色时捞出。","3。","炒勺内留底油，放入白糖，炒至起泡将要拔丝时，倒入苹果随即将炒勺离开火眼，并不断的颠翻，使糖汁均匀地挂在苹果上即成。"]},{"i":447,"n":"炸西瓜","r":"鲁菜","o":"鲁菜300种","f":"色泽艳丽，甜嫩味美，风味独特。","c":"甜品","m":["炸"],"g":["鸡蛋"],"s":["白糖","淀粉"],"t":["炒锅"],"v":1,"a":"主料：净西瓜500克｜调料：白糖100克鸡蛋清3个湿淀粉150克精粉100克桃红食色微量花生油1500克","p":["先将桃红食色与白糖混合搓匀，使白糖成为淡红色；西瓜瓣切成菱角形块，并上一层精粉。","鸡蛋清和湿淀粉放入一个碗内搅匀成。：：3。炒勺内倒入花生油，烧至四成热时，将西瓜块蘸上一层糊，放入油内炸，炸至外皮稍硬时，即用小铲翻动，使受热均匀，待稍变色时，捞出控净水分，装入盘内，将粉红色的白糖撒在炸好的西瓜块上即成。"]},{"i":448,"n":"炸荷花","r":"鲁菜","o":"鲁菜300种","f":"色泽鲜艳，花香芬芳，是夏令花卉甜菜。184","c":"热菜","m":["炸"],"g":["鸡蛋"],"s":["白糖"],"t":["炒锅"],"v":1,"a":"主料：白色荷花瓣12片｜配料：豆沙馅100克｜调料：白糖100克鸡蛋清4个精粉50克花生油1000克（耗50克25克）","p":["1。将荷花瓣用清水洗净，用洁白纱布掘干水分，平铺在墩上，抹上一层豆沙馅，顺长对折将豆沙馅包在里面；鸡蛋清磕入碗内，搅打成泡沫状，加入精粉搅匀成蛋泡糊。","炒勺内倒入花生油，中火烧至三成热时移到小火上，将折好的荷花沾匀白蛋泡糊，逐个下入油内炸，用手铲拨动，炸至呈浅黄色捞出，放入盘内，均匀地撒上白糖即成。"]},{"i":449,"n":"玫瑰锅炸","r":"鲁菜","o":"鲁菜300种","f":"：外焦里嫩，有浓郁的玫现香味。注：按以上制法也可不浇卤，可改用撒上芝麻面和白糖，又称“芝麻锅炸”。185","c":"热菜","m":["炸"],"g":["鸡蛋"],"s":["淀粉","白糖","酱油"],"t":["炒锅"],"v":1,"a":"主料：鸡蛋黄4个干淀粉150克｜调料：白糖250克、精粉25克玫瑰酱15克花生抽1000克（耗50克）","p":["1。鸡蛋黄磕入碗内打散，加入干淀粉二两，精粉和清水300克混合搅匀成糊。．2。炒勺刷洗干净，放在小火上加入清水（100克）烧沸，：倒入搅好的蛋黄糊，移至中火，用手勺不断的搅妙，至熟成稠糊，倒入盘内（盘底先洒一层水，防止沾盘），待晾凉成软糕，放在板上切成长5厘米，：宽2厘米，，厚1厘米的长方条块，再沾上一层干淀粉。","炒勺内倒入花生油，烧至六成热时，将蛋黄糕条下入油内炸，呈金黄色时捞出，码在盘内。4。用一洁净炒勺，放入清水（150克）、白糖、玫瑰酱烧沸撤沫，勾入湿淀粉薄芡成卤，浇在炸好的锅炸上。"]},{"i":450,"n":"琉璃肉","r":"鲁菜","o":"鲁菜300种","f":"金黄光亮，皮酥脆香甜，肥而不腻，是冷拼盘碟料。","c":"热菜","m":["爆炒"],"g":["猪肉","猪腰","鸡蛋"],"s":["白糖","淀粉","香油"],"t":["炒锅"],"v":0,"a":"主料：猪肥腰肉250克｜调料：白糖200克鸡蛋一个干淀粉50克精粉25克香油50克花生油500克","p":["将肉切长3厘米，5毫米见方的条；用水煮透捞出，控净水，将鸡蛋、干淀粉、精粉搅匀成糊。2。炒勺内倒入花生油，烧至七成热时，把肉条先蘸上一层精粉，再沾上一层糊，逐条下入油内炸，是金黄色外皮酥时捞出。","炒勺内放入香油、白糖，小火加热，将糖熬至快起泡时，迅速放入炸好的肉条，炒勺脱离火口颠阙，肉条挂匀一层糖汁，倒在抹过油的板上，散开晾凉即成。·"]},{"i":451,"n":"冰糖肘子","r":"鲁菜","o":"鲁菜300种","f":"：色泽红润而明亮，肘肉软烂，香甜不腻。","c":"热菜","m":["烧扒焖"],"g":["猪肉"],"s":["白糖","盐","料酒"],"t":["炒锅"],"v":0,"a":"主料：代骨代皮猪肘子1只（1500克左右）｜调料：白糖250克精盐2.5克料酒50克花生油50克","p":["1，将猪肘子在炉口明火上把皮面烤焦放在温水内浸泡186片刻，，用刀刮去皮面上的糊焦，使皮是白色，洗净投入汤锅中煮六成熟左右捞出，从时子的里面拉开，剔去骨头，在肉里面打上象眼块的花刀，深至皮（皮不割断）。","取锅1口，锅底放小子当垫，将煮至半熟的肘肉皮面朝下，放在锅内笔子上；加入浸过肉的热水、白糖、料酒、精盐、糖色后，上面用大盘子将肘肉盖住，用中火烧沸，锅移到小火上，慢火煨爆2小时左右，肘子肉烂时，将第子提出，肘肉扣入大汤盘内（皮朝上），将锅内的原汁浇在肉上即成。"]},{"i":452,"n":"烧面筋","r":"鲁菜","o":"鲁菜300种","f":"红润油亮，面筋柔韧滑润，香甜味美。‘","c":"热菜","m":["烧扒焖"],"g":["面筋","荸荠","白果","莲子","冬笋"],"s":["白糖","甜面酱","淀粉","桂花酱"],"t":["炒锅"],"v":1,"a":"主料：麻花式水面筋250克｜配料：清水马蹄水发白果冬笋水发莲子各25克｜调料：白糖3面甜面酱10克湿淀粉75克桂花酱2.5克糖色少许花椒油5克花生油1000克（耗75克）","p":["：1，将水面筋撕成长5厘米的条，放入碗内加甜面酱、湿淀粉拌匀，以上四样配料均用沸水焊过。2。炒勺内倒入花生油，在大火上烧至八成热时，将面筋下入油内炸至红色捞出沥净油。","炒勺内倒入清水（约250克）、色、桂花酱（用水邂开纱布过滤，用汁）、白糖烧沸，移至小火上，再将面187筋、莲子、白果、马蹄一起倒入勺内，颠翻几下，煨到汤浓时，淋上花椒油出勺即成。"]},{"i":453,"n":"梅雪争春","r":"鲁菜","o":"鲁菜300种","f":"香甜味美、色彩清新，象一盘白雪，雪上有干支梅数朵，非常美观，制法独特，为山东名菜。i88","c":"热菜","m":["蒸"],"g":["鸡蛋","黄瓜"],"s":["桂花酱","白糖"],"t":["蒸锅"],"v":1,"a":"主料：苹果香蕉各300克鸡蛋清100克｜配料：黄瓜皮50克冻粉5克｜调料：桂花酱2.5克糖卤200克红食色少许猪油5克","p":["1，先将冻粉用清水洗净，放入碗内沸水25克，上笼蒸至熔化时取出，加入微量红食色，糖卤50克，桂花酱汁搅匀成粉红色，放入冰柜内冷凝称“酪冻”；黄瓜皮切成3毫米宽的长细扁条。","2。","鸡蛋清磕入碗内加清水100克打匀，用猪油抹在平盘上，鸡蛋清倒入盘内上笼蒸至呈现有硬皮半熟时取出，将黄瓜皮条象花枝样的摆在蛋清的硬皮上，再上笼蒸至蛋清全部挺身时，把酪冻刻成朵朵梅花形摆上。","3，苹果削去皮、核，切成梳背块，用沸水迅速烫一下捞出摆在盘内一边，香蕉切转刀块，放入沸水内稍微煮一下捞出，摆在苹果盘的另一边，全部衬平。","将蒸好的蛋清（用手铲在盘的周围稍微一铲）整齐地盖在香蕉、苹果上面，再将桂花酱卤浇在表面即成。"]},{"i":454,"n":"，八宝梨罐","r":"鲁菜","o":"鲁菜300种","f":"此菜梨的外表色白发亮，梨、馅软嫩香甜，冷。热吃皆宜，为筵席上的精细甜菜之一。189","c":"甜品","m":["蒸"],"g":["梨","糯米","冬瓜","红枣","核桃仁"],"s":["白糖","桂花酱"],"t":["炒锅","蒸锅"],"v":1,"a":"主料：梨5个（约重1000克）｜配料：糯米100克瓜子仁15克桔饼桂元肉‘青梅各50克冬瓜条大红枣核桃仁各25克｜调料：白糖250克青红丝5克熟猪油25克桂花酱2.5克","p":["将梨削去外皮及把，在梨头部切下四分之一（按梨的高度）作盖，用小刀将梨核挖出，梨肉壁摩保持1厘米成罐形，用沸水稍烫一下，洗净振干水分。2。糯米淘洗干净，放入碗内加清水150克，放入笼内约蒸30分钟取出。","桔饼、桂元肉、冬瓜条、青梅、红枣（去核）、桃仁（去皮）均切3毫米小方丁，用沸水焯过捞出沥干水分，装入碗内，加入蒸过的糯米，白糖150克，桂花酱2克，熟猪油、瓜子仁搅拌均匀成馅。4：将馅装入每个梨罐内，盖上盖，装上把（用青梅切成条当梨把），盛入大盘内，放入笼屉用旺火蒸15分钟左右取出，撒上青红丝。","炒勺内放入清水100克、白糖100克、桂花酱0.5克烧沸，浇在梨上即成。"]},{"i":455,"n":"炒三泥","r":"鲁菜","o":"鲁菜300种","f":"此菜味酸甜，软精可口，红、黄、白三色鲜明，夏天冷吃尤佳。190","c":"热菜","m":["爆炒"],"g":["莲子","栗子","山楂"],"s":["白糖","桂花酱"],"t":["炒锅","蒸锅"],"v":1,"a":"主料：水发莲子100克栗子150克山楂糕100克｜配料：瓜子仁2.5克青红丝1克｜调料：白糖250克桂花酱1.5克熟猪油100克","p":["1，将栗子洗净，在栗子顶端上十字花纹，在沸水锅内煮10分钟取出，剥去硬壳及内里软皮。","水发莲子和栗子分别装入碗中，放在笼内旺火蒸30分钟（蒸烂）取出，在砧板上用刀面抿压成细泥。3。炒勺内放入熟猪油45克、白糖50克半在中火上熔化后，加入莲子泥，移至小火上炒至起沙时，即盛在盘内一边；炒勺内再放入猪油45克、白糖50克半、栗子泥炒至起沙时，盛在盘内另一边；炒勺内放猪油10克五成热时，加入白糖50克与山楂糕，在小火上（用手勺将山楂糕压碎）炒成稠泥时放在盘子中间。4。炒勺内倒入消水50克、白糖50克、桂花酱，烧至糖熔化后浇在盘中三泥上，再撒上瓜子仁、青红丝即成。"]},{"i":456,"n":"炒桂花山药泥","r":"鲁菜","o":"鲁菜300种","f":"山药泥沙甜香软，桂花味芬芳，老年人与幼儿食用最佳。","c":"甜品","m":["爆炒"],"g":["山药"],"s":["白糖","桂花酱"],"t":["蒸锅"],"v":1,"a":"，主料：山药400克｜配料：青红丝5克｜调料：白糖200克桂花酱2.5克猪油100克","p":["1，将山药洗净，放在笼内蒸15分钟左右，取出剥去皮，切去两头不洁之处，顶刀切成薄片，放在砧板上用刀面抿压成细泥。","2。","将猪油80克入勺，在中火上，将白糖与山药泥一起放入炒至发软时移到小火上，随用小铲翻动，妙至起沙不再粘黏时，加入桂花酱及猪油20克，搅拌均匀出勺盛入盘内，撒上青红丝即成。","191。"]},{"i":457,"n":"冰糖牡丹银耳","r":"鲁菜","o":"鲁菜300种","f":"此菜色白形状如牡丹花，甜、鲜、脆嫩，有桂花香味。","c":"甜品","m":["爆炒"],"g":["鸡肉"],"s":["白糖","桂花酱"],"t":["炒锅"],"v":0,"a":"主料：好银耳10克｜调料：冰糖100克白糖100克鸡脯水50克桂花酱1.5克","p":["1．将银耳放入盆内，加温水浸泡15分钟后用清水洗一遍，片去根，再用沸水泡3至5分钟，使银耳充分涨发恢复原来的鲜嫩状态后沸水婷过，放入汤碗内。","2，炒勺内放入清水300克加冰糖、白糖、鸡脯水，在中火上烧沸撇去浮沫，加入桂花酱水5克，将此糖水浇入银耳碗中即成。"]},{"i":458,"n":"百粒面包","r":"鲁菜","o":"鲁菜300种","f":"香甜酥脆，色泽金黄，是良好的冷拼盘碟料。","c":"热菜","m":["爆炒"],"g":["面粉","芝麻"],"s":["白糖","桂花酱","香油"],"t":["炒锅"],"v":1,"a":"主料：面包150克｜配料：芝麻仁15克青红丝10克｜调料：白糖100克桂花酱10克芝麻油10克花生油500克（耗50克）192","p":["将面包切长4厘米，粗12毫米的条。","炒勺内倒入花生油，中火烧至五成热，将面包条放入炸透呈淡黄色时，捞出控制油，","炒勺内倒入芝麻油10克和白糖，炒至呈琥珀色时，将勺离火，倒进炸好的面包条、芝麻仁、青红丝、桂花酱，紧接进行颠翻几次，使糖粘在面包上，倒在案板上晾凉即成。"]},{"i":459,"n":"糖酥丸子","r":"鲁菜","o":"鲁菜300种","f":"色洁白，酥脆香甜。注：此案又叫“挂霜丸子”。做时要学程头个关键，一是炸丸子，火不宜大，慢火使肥题内中的治全部没出，达到酥","c":"小吃","m":["爆炒"],"g":["猪肉","面粉","鸡蛋"],"s":["白糖"],"t":["炒锅"],"v":0,"a":"主料：猪熟肥膘肉200克｜调料：白糖200克面粉50克鸡蛋黄2个香蕉精1滴花生油500克（约耗30克）","p":["1，将熟猪肥膘肉切成3毫米见方的丁，放入碗内加鸡蛋黄、面粉调拌均匀。","2。","炒勺内放入花生油，在小火上烧至3成热时，将调拌好的肉丁用手挤成直径2厘米大的丸子，逐个下入油内炸，待丸子呈浅黄色时捞出。","3。","将炒勺刷洗干净，加入清水100克，放入白糖，旺火烧沸，撤净浮沫，移至微火上熬，熬至糖即变色而未-变色时，迅速把丸子倒入，端起勺离开火眼不断翻动，随即加上193香蕉精，使每个丸子都沾满糖汁，稍晾后，摆入盘内。"]},{"i":460,"n":"拔丝蛋泊肉","r":"鲁菜·胶东","o":"鲁菜300种","f":"圆球形，内里空心，外皮酥脆香甜。为胶东名菜。194","c":"热菜","m":["爆炒"],"g":["鸡蛋","猪肉"],"s":["白糖","淀粉"],"t":["炒锅"],"v":0,"a":"主料：肥肉100克鸡蛋消2个｜调料：白糖150克干淀粉100克青红丝少许.香精微量花生油1000克（耗50克）","p":["1、肥肉剁成细泥，放入碗内加肯红丝、香精搅匀，做成直径1厘米大的丸子；鸡蛋消用竹筷子搅打成雪丽糊加干淀粉搅匀。","2，炒勺内倒入花生油烧至五成热时，将肥肉丸子外包一层雪丽浓糊；逐个下入油内慢火炸，至呈淡黄色丸子已涨大成鸡蛋形状，油勺离开火。","3，炒勺内加少量水和白糖，见糖炒到将要起泡时，把炸好的蛋泊肉捞至糖汁内，加香清、青红丝颠匀盛入盘中，趁热上桌。"]},{"i":461,"n":"如意冬笋","r":"鲁菜","o":"鲁菜300种","f":"软嫩鲜香滑润，其片状如蝴蝶的翅膀，美观大方。","c":"热菜","m":["蒸"],"g":["冬笋","鸡肉","火腿","猪肉","菠菜","鸡蛋"],"s":["盐","料酒","味精","葱","姜","淀粉","高汤"],"t":["炒锅","蒸锅"],"v":0,"a":"主料：冬笋400克鸡料子100克｜配料：火腿末30克肥肉膘末50克菠菜叶末40克｜调料：精盐3克料酒10克味精1克精粉10克葱姜末2.5克鸡蛋清2个消汤150克湿淀粉15克猪油15克","p":["先将冬笋转着旋切成20厘米的长条片；鸡料子用鸡蛋清邂开，顺搅上劲后，加入肥肉骠末、葱姜末、料酒、味精、湿淀粉、精盐、猪油搅匀。","冬笋片用沸水焯过，洁布振干水分铺平，撒上精粉，将鸡料糊抹在冬笋片上约3毫米厚，两头撒上火腿末、！菠菜叶末，拾起两头同时向里卷至对合，翻过来放在盘内入笼蒸熟。取出切厚4毫米的片，整齐顺序地排在碗内，成鱼196'鳞形，撒上料酒、精盐、清汤再上笼蒸透取出，翻扣在盘内。","炒勺内放入清汤100克、料酒、味精烧沸，湿淀粉勾芡浇在如意冬笋上。"]},{"i":462,"n":"锅蒲菜","r":"鲁菜·济南","o":"鲁菜300种","f":"软嫩清香，适口不腻，是济南历下风味菜点。197","c":"热菜","m":["爆炒"],"g":["蒲菜","白菜","火腿","菠菜","香菇","鸡蛋"],"s":["盐","料酒","味精","高汤","淀粉"],"t":["炒锅"],"v":0,"a":"主料：蒲菜心200克配抖：火腿丝菠菜叶丝冬菇丝共10克鸡蛋黄3个｜调料：精盐2.5克料酒10克味精1克清汤100克精粉5克湿淀粉5克花生油75克。","p":["蒲菜切成长5厘米的段，沸水焯过，滚上一层薄薄精粉；鸡蛋黄磕入碗内、加料酒，精盐，味精、湿淀粉，精粉合成为蛋黄糊，先倒入盘内一半，把蒲菜段整齐地摆在盘.内糊上，将所余之糊倒在蒲莱上。","炒勺内倒入花生油，中火烧至五成热时，把蒲菜推入勺内，煎至底面挺身时，翻过来再煎透，将余油津出，加入清汤、料酒、火腿丝、菠莱丝、冬菇丝，移至微火业至汤汁将尽时即成。"]},{"i":463,"n":"栗子烧白菜","r":"鲁菜","o":"鲁菜300种","f":"白菜软嫩，汁红油亮，栗子香甜。","c":"热菜","m":["烧扒焖"],"g":["栗子","白菜"],"s":["白糖","酱油","料酒","味精","葱","姜","高汤","盐"],"t":["炒锅"],"v":1,"a":"主料：白菜750克栗子150克｜调料：酱油25克白糖15克料酒10克味精1克清汤150克葱姜末5克花椒油5克精盐1.5克花生油500克（耗50克）","p":["将白菜撕成6厘米长的条。栗子外皮刹上十字花纹，放入沸水锅内煮至七成熟，剥去皮，将栗仁切成厚2毫米的片。","炒勺内放入花生油，在大火上烧至八成热时，白菜条下入油内炸4分钟左右捞出，再将栗子片下入油内炸至漂起时捞出。","炒勺内留底油，放入白糖炒至呈鸡血红色时，烹入葱姜末炸出香味，把炸过的白菜、栗子倒入炒勺煸妙，再放入清汤、酱油、精盐、料酒烧沸，撤沫，移至小火上，煨约5分钟左右，加味精，淋上花椒油，盛入汤盘内即成。"]},{"i":464,"n":"椒油小白菜","r":"鲁菜","o":"鲁菜300种","f":"菜心鲜嫩，汤汁味美不腻。","c":"热菜","m":["爆炒"],"g":["白菜","口蘑"],"s":["盐","酱油","味精","高汤","淀粉"],"t":["炒锅"],"v":1,"a":"主料：小白菜心250克｜配料：水发口蘑50克198.｜调料：精盐1.5克酱油5克清汤250克味精1克湿淀粉15克花椒油50克","p":["1。","小白菜心切长4厘米的段，用沸水焯过，净水分；口蘑切成薄片，用沸水焯过。","2。","炒勺内倒入清汤，加酱油、精盐、莱心、口蘑烧沸，放入味精，用湿淀粉勾芡，淋上花椒油即成。"]},{"i":465,"n":"奶汤鲜桃仁","r":"鲁菜","o":"鲁菜300种","f":"汤色乳白，桃仁脆嫩，加各色配料色泽美观，滋味鲜香醇厚。189","c":"甜品","m":["烩汆"],"g":["核桃仁","火腿","口蘑","冬笋"],"s":["高汤","盐","葱","花椒","料酒","味精","姜"],"t":["炒锅"],"v":0,"a":"主料：鲜核桃仁250克｜配料：火腿10克水发口蘑5克苔菜花5朵：冬笋25克｜调料：精盐2.5克奶汤500克葱椒料酒15克味精：1克姜汁5克鸡油5克葱油50克","p":["1.将鲜桃仁的薄膜皮剥去，洗净，用沸水焯过；火腿切象眼薄片；口蘑一切两半，冬笋切片与苔菜花用沸水焯过。","2。","炒勺内放入葱油烧热，加奶汤烧沸，用小火稍，再放入桃仁、口蘑、苔莱花、冬笋用大火烧沸，撇去浮沫，加精盐，葱椒料酒、姜汁、味精，淋上鸡油，盛入汤盘内，、撒上火腿片即成。"]},{"i":466,"n":"炝鲜核桃仁","r":"鲁菜","o":"鲁菜300种","f":"质地脆嫩，清淡爽口，为夏令时菜。","c":"甜品","m":[],"g":["核桃仁","黄瓜","萝卜"],"s":["花椒","高汤","盐","酱油","料酒","味精","姜"],"t":["炒锅"],"v":1,"a":"主料：鲜核桃仁300克｜配料：黄瓜10克·红萝卜5克鲜花椒1枝｜调料：鸡汤50克酱油5克精盐1克料酒5克味精1克姜丝2.5克花椒油5克","p":["1。将鲜核桃仁的薄膜皮剥去，洗净沸水焯过；黄瓜、红萝卜切长3厘米、粗2毫米的细丝；红萝卜用沸水焯过和黄瓜装入盘内，再放上核桃仁，鲜花椒用刀拍扁，放在核桃仁上。","碗内放入鸡汤、料酒、味精、精盐、姜丝、花椒油对成炝汁，浇在盘内莱上即成。"]},{"i":467,"n":"锅豆腐","r":"鲁菜","o":"鲁菜300种","f":"经榻制后色深黄，卤汁浸入豆腐内味浓鲜嫩。201","c":"热菜","m":["蒸"],"g":["豆腐","虾","鸡蛋"],"s":["盐","料酒","味精","淀粉","葱","姜","高汤"],"t":["炒锅","蒸锅"],"v":0,"a":"主料：豆腐400克鲜虾仁50克鸡蛋两个·｜调料：精盐4克料酒10克味精1克精粉5克湿淀粉5克葱姜末5克清汤50克花生油50克","p":["1，将豆腐切长5厘米，宽2厘米、厚4毫米的片；共16片。","虾仁剁成泥；鸡蛋清磕入碗内，搅打至起泡，加入精盐1.5克、料酒5克味精1与虾仁泥搅匀成馅。","2，先在盘内摆上18片豆腐，每片均匀地抹上一层虾陷，另8片豆腐盖在虾馅上，，上笼蒸6分钟左右，联出沥净水。","将鸡蛋黄和料酒、味精、精盐、精粉放入一个碗内搅匀成蛋黄糊，将糊均匀的抹在蒸过的豆腐上。","3炒勺内放入花生油，烧至六成热时，将盘内沾满糊的豆腐完整地推入炒勺内，煎至两面都呈淡黄色时，随即加入葱姜末，清汤用大盘盖住，焖塌至汁尽，翻勺扣在盘内即成。"]},{"i":468,"n":"烫豆腐","r":"鲁菜·泰安","o":"鲁菜300种","f":"简单易做豆腐白嫩，各种佐料任意选用，别具风味，泰安俗称“水晶豆腐”。","c":"热菜","m":[],"g":["豆腐","虾"],"s":["酱油","蒜","姜","辣椒油"],"t":["炒锅"],"v":0,"a":"主料：豆腐1000克｜调料：酱油虾油蒜泥姜汁韭菜花酱辣椒油各1小碟","p":["将豆腐切2厘米见方的块，放入开水锅内，用中火煮10分钟，盛入大汤碗内，与各种调料碟同上餐桌选用佐食。"]},{"i":469,"n":"干炸豆腐丸子","r":"鲁菜·泰安","o":"鲁菜300种","f":"豆腐丸子外形如“毛栗”，外皮脆，内里嫩，味道香美，蘸以花椒盐则有麻辣味；以糖醋汁，则有甜酸味。是山东泰安地方名菜。","c":"小吃","m":["炸"],"g":["豆腐","海米","鸡蛋"],"s":["姜","盐","葱","香菜","甜面酱","淀粉","白糖","椒盐","醋"],"t":["炒锅","蒸锅"],"v":0,"a":"主料：豆腐500克250克｜配料：水发海米50克酱姜芽末2.5克酱蓝末2.5克鸡蛋1个｜调料：精盐5克葱末5克.香菜末5克甜面酱5克干淀粉1000克（耗100克）、花椒盐面10克糖醋汁1盘、花生油1000克（耗100克）","p":["1.将互腐上笼蒸15分钟取出，沥净水，晾凉，放在板上用刀面抿压成泥，盛入大碗内加鸡蛋，海米末、甜面酱、酱姜芽末、酱蓝末、花椒面、香菜末，拌匀成馅，挤成直202径2厘米大的丸子，放在干淀粉中滚动，使其沾满一层淀粉。","2，炒勺内倒入花生油，烧至八成热时，将丸子逐个下入油炸3分钟左右捞出，待油温升至九成热时，再将豆腐丸子重投入油内，炸至表面呈金黄色时捞出，装入盘内，与花、椒面、糖醋汁同上餐桌。"]},{"i":470,"n":"烧素烩","r":"鲁菜","o":"鲁菜300种","f":"面筋泡柔韧，能吸进汤汁的鲜味，香而不腻。","c":"汤羹","m":["烧扒焖","烩汆"],"g":["粉丝粉皮","木耳"],"s":["盐","酱油","高汤","葱","姜","淀粉"],"t":["炒锅"],"v":1,"a":"主料：炸再筋泡50克夏腐150克五乘显腐干50克水发细粉丝50克水发木耳25克青莱心.100克｜调料：精盐3克酱油15克清汤250克葱姜末5克湿淀粉25克花椒油15克花生油50克","p":["1。","面筋泡每个切成两半；豆腐切厚4囊米的片五香豆腐干片成厚2毫米的片，再改切成三角形的小片，粉丝切2045厘米长；青菜心切段，用沸水焯过。","2，炒勺内放入花生油，在中火上烧至七成热时，放入葱姜、豆腐干煸炒一下，加入酱油、精盐、豆腐、木耳、粉丝、清汤、菜心烧沸，撇去浮沫，再放上面筋泡，调好口味，用湿淀粉勾芡，淋上花椒油即成。"]},{"i":471,"n":"烧煨面筋条","r":"鲁菜·济宁","o":"鲁菜300种","f":"汤汁浸入面筋中，珠浓香醇，为山东济宁地方风味菜制法。","c":"热菜","m":["烧扒焖","炖煨"],"g":["面筋","香菇","冬笋","口蘑"],"s":["盐","料酒","酱油","葱","姜","高汤","淀粉"],"t":["炒锅","蒸锅"],"v":1,"a":"主料：熟面筋块500克｜配料：冬菇玉兰片各25克鲜口蘑50克｜调料：精盐1.5克酱油40克料酒10克清汤500克葱段姜片共5克湿淀粉25克猪油25克花椒油15克”花生油1000克（耗100克）","p":["1，将大块的熟面筋切长10厘米，宽3厘米，厚5毫米的长方片（共12片），冬菇、玉兰片切成条；口蘑每个片成两半。","2。","炒勺内倒入花生油，烧至七成热时，将面筋条效入油中稍炸，捞出凈净油。","再放入沸水锅内煮至面筋发软时，捞至温水盆内，洗去油质，捞出挤净水分。","3。","炒勺放入猪油，烧至七成热时放葱姜炸至放，捞出不用，随即放入酱油、清汤、面筋、料酒、精盐烧沸撒沫，在小火上加盖煨燃约10分钟，待汤汁剩一半时，将面筋翻过来，盖好盖再5分钟左右，将勺端离火口。","20%4，将冬菇、玉兰片至碗底，面筋逐片摆在碗中呈梯形，上笼蒸10分钟左右，取出扣在盘中。","·将汤汁凈在勺内，加湿淀粉烧沸后淋上花根油，浇在盘内面筋上即成。"]},{"i":472,"n":"黄蘑素鸡","r":"鲁菜","o":"鲁菜300种","f":"色泽微黄，味道香郁，因有鸡肉香味，故名。！","c":"热菜","m":["炸"],"g":["鸡肉"],"s":["酱油","盐"],"t":["炒锅"],"v":0,"a":"主料：干黄蘑500克｜调料：酱油250克精盐3克五香面5克淡盐水1000克花生油1000克（耗150克）","p":["1，将黄蘑用沸水泡透，再放入淡盐水中浸泡（10分钟左右），取出去柄洗净，撕成2毫米的片，放入碗内，加酱油，精盐、五香面拌匀。","炒勺内倒入花生油，用大火烧至七成热时，将黄蘑片分4一5次下入油内炸，至微黄色即成。"]},{"i":473,"n":"素卷肘","r":"鲁菜","o":"鲁菜300种","f":"其味形似卷肘，香味浓郁，佐酒佳肴。207","c":"热菜","m":["蒸"],"g":["猪肉","山药"],"s":["盐","酱油","料酒","白糖","高汤","香油"],"t":["蒸锅"],"v":0,"a":"主料：油皮500克山药400克｜调料：精盐5克酱油100克料酒25克白糖50克鸡汤150克药料5克香油100克","p":["1，先将山药洗净，上笼蒸熟，剥去皮，放在案板上，用刀面压成细泥，放在碗内，加香油，酱油、精盐、料酒、白糖、鸡汤、药料搅匀。","把油皮平铺在案板上，逐张用搅好地山药泥均匀地抹在上面，然后卷起，外面再卷上一层纱布，用细绳缠紧，上笼蒸熟，取出晾凉，去掉纱布，刷上香油，吃时切片。"]},{"i":474,"n":"烤素鸭条","r":"鲁菜","o":"鲁菜300种","f":"外酥里嫩，有浓郁的松柏香味，细嚼时好似鸭肉味道。二六○素排骨，原料主料：水面筋150克山药100克配料：酱苯蓝丝5克调料：精盐3","c":"热菜","m":["烤"],"g":["鸭肉"],"s":["酱油","香油"],"t":["烤箱"],"v":0,"a":"主料：鲜油皮45张（约重300克）｜调料：酱油100克香油150克","p":["1：将鲜油皮（42张）切成长5厘米、粗1毫米的丝，放在盆内，加香油125克，酱油75克拌匀腌渍。","把剩余的3张油皮平铺在案板上，刷上一层油，香油、把腌渍好的油皮丝均匀地摊在3张油皮上，逐张卷好，即成“鸭条”。·","把鸭条放在铁笔子上，放入烤炉内，用柏木锯末熏烤至紫黄色即成。"]},{"i":475,"n":"烩素鸡丝","r":"鲁菜","o":"鲁菜300种","f":"“鸡”丝清香，食而不腻。二六三虾子烧茨白原料·主料：荧白350克虾子5克配料：水发冬菇25克调料：精盐2.5克酱油10克料酒10克味精","c":"汤羹","m":["烩汆"],"g":["鸡肉","面筋","豌豆"],"s":["盐","料酒","味精","高汤","淀粉"],"t":["炒锅"],"v":0,"a":"主料：水发腐竹100克面筋150克青豆50克｜调料：精盐2.5克料酒5克味精1.5克素清汤300克湿淀粉15克葱油25克","p":["1，把腐竹切成细丝，放在铁笔子上，锅内放入锯末，座在炉火上，使锯末燃烧，将筆子座在锅内，盖上锅盖，熏5分钟，见冒大烟时，将锅离火。","面筋切成细丝，加精盐、鸡蛋清、湿淀粉浆好，再用热油滑熟。3，炒勺内倒入素清汤，加入精盐、味精、料酒和熏过的腐竹丝，烧沸，用湿淀粉勾炎，盛入汤碗内。炒勺内留三分之一的汁，再将面筋丝和青豆倒入烧沸，淋上葱油，倒在腐竹丝上即成。"]},{"i":476,"n":"奶汤珍珠笋","r":"鲁菜","o":"鲁菜300种","f":"质地脆嫩，汤汁乳白，味醇。未成熟的玉米，称“笋”，其玉米粒形色如“珍珠”而故名“珍珠笋”。211","c":"汤羹","m":["烩汆"],"g":["冬笋","火腿","口蘑","白菜"],"s":["高汤","盐","料酒","味精","姜"],"t":["炒锅"],"v":0,"a":"主料：小嫩玉米（俗称棒子）300克｜配料：熟火腿片3片水发口蘑5克青菜心一颗心｜调料：奶汤500克精盐5克料酒10克味精1克姜汁5克葱油50克","p":["1，将小嫩玉米剥去皮，切去后梢，洗净，切滚刀块称“珍珠笋”，口蘑每个切3片；青菜心洗净，劈成四半，均用沸水焯过。","炒勺内倒入葱油，旺火烧至五成热时，倒入奶汤、糍酒、加精盐、珍珠笋、口蘑、青菜心烧沸，撇去浮沫，加姜汁、味精，盛入汤盘内，撒上火腿片即成。"]},{"i":477,"n":"金银豆腐","r":"鲁菜","o":"鲁菜300种","f":"鸡蛋色黄为金色，豆腐白色为银色，豆腐由黄色的鸡蛋包位，软嫩可口。","c":"热菜","m":["爆炒"],"g":["豆腐","鸡蛋"],"s":["盐","葱"],"t":["炒锅","蒸锅"],"v":1,"a":"主料：豆腐250克鸡蛋4个｜调料：精盐5克葱末3克猪油50克25克","p":["1。","豆腐上笼蒸透，切成2厘米见方的了；将鸡蟹入碗内搅打均匀，加精盘，豆腐丁，和葱末调匀。","2。","炒勺内放入猪油烧至八成热时，碗内的豆腐鸡蛋倒入煸炒，颠翻至熟盛入盘內即属。"]},{"i":478,"n":"金丝白菜","r":"鲁菜","o":"鲁菜300种","f":"味甜酸脆嫩，是一个清口开胃的凉拌莱，常作宴席的小菜。","c":"热菜","m":["蒸"],"g":["白菜","山楂"],"s":["醋","白糖","芝麻酱"],"t":["蒸锅"],"v":1,"a":"主料：黄白菜心250克山楂糕50克｜调料：醋20克白糖50克芝麻酱25克香40克","p":["黄白蒸心切细瓦蕃丝；山楂糕切2米粗的丝。2。白糖、醋、麻汁、香油放入同一个碗内搅匀成汁。","白菜丝装入盘内，浇上调好的汁，上面撒上山楂糕丝，吃时拌匀即可。"]},{"i":479,"n":"软烧虎皮豆腐","r":"鲁菜·孔府","o":"鲁菜300种","f":"豆腐嫩美，形色似虎皮，制法独特，为孔府的家常菜。","c":"热菜","m":["烧扒焖"],"g":["豆腐","鸡蛋","青蒜"],"s":["盐","料酒","酱油","高汤","淀粉","葱","姜","蒜"],"t":["炒锅"],"v":1,"a":"主料：豆腐300克鸡蛋1个鸡蛋黄2个｜调料：精盐2.5克酱油15克料酒10克清汤250克蒜苗50克湿淀粉15克葱姜蒜片5克鸡油10克：猪油50克","p":["把豆腐放置板上，用刀面抿压成泥；鸡蛋与鸡蛋黄磕入一个碗内，打散搅匀成蛋液，蒜苗洗净切段。2，锅内倒入开水1500克，倒入豆腐泥后烧沸，撇去浮沫，再将蛋汁均匀地撒在锅内，烧沸后，倒在事先铺有洁白纱布的平底盆内，将纱布包起，控净水，放在上呈四方形，压上1块木板，约30分钟，解开布包即成货色的“虎皮豆腐”。","把虎皮豆腐切成5毫米厚的三角块。4，炒勺内倒入猪油，烧至六成热时，放入葱姜蒜炸至放香，烹上酱油、料酒、再放入精盐、清汤、虎皮豆腐，在大火上烧沸，移至中火上爆3分钟，月湿淀粉勾芡，撒上蒜苗，淋上鸡油即成。"]},{"i":480,"n":"珊瑚白菜","r":"鲁菜","o":"鲁菜300种","f":"白菜脆嫩，衬有红、黄、褐三色，并有甜、香、辣、咸多种滋味，又是冷菜碟料。","c":"热菜","m":["爆炒"],"g":["白菜","辣椒","香菇","冬笋"],"s":["盐","白糖","酱油","醋","葱","姜","香油"],"t":["炒锅"],"v":1,"a":"主料：白莱心500克｜配料：干红辣椒3个水发冬菇25克冬笋100克｜调料：精盐4克酱油15克白糖100克醋50克葱丝10克姜汁5克芝麻油100克","p":["1。将白菜心在沸水中烫至八成熟时捞出放入盆内，加精盐3克拌腌5分钟，挤去水，再切长5厘米的段，摆在盘内。2，冬笋、冬菇，干红辣椒均切长5厘米的丝。","芝麻油晋入炒勺内，在中火上烧至3成热时先放入干红辣椒丝、葱姜丝炸出香味烹入醋，再放入冬笋，冬菇丝煸炒几下，再加入清水50克半，白糖，酱油精盐稍端，将汁浇到白菜上即成。"]},{"i":481,"n":"炸碗豆苗","r":"鲁菜","o":"鲁菜300种","f":"豌豆苗非常嫩，酥脆清香，制做简单，深受食者欢迎。","c":"热菜","m":["炸"],"g":["豌豆","鸡蛋"],"s":["盐"],"t":["炒锅"],"v":1,"a":"主料：豌豆苗100克鸡蛋1个精粉50克｜调料：精盐1.5克花生油500克（耗50克）216","p":["1。把鲜豌豆苗洗净，掐成5厘米长的段。","鸡蛋、精粉、精盐均放入一个碗内搅匀成糊。3。花生油倒入炒勺内，在中火上烧至六成热时，将豌豆苗沾上鸡蛋糊下入油内炸至呈淡黄色，形如小树枝捞出“"]},{"i":482,"n":"五香面筋","r":"鲁菜·济南","o":"鲁菜300种","f":"味道咸香，佐酒佳肴，原系济南素莱之名吃，深受广大食者欢迎。217.","c":"热菜","m":["蒸"],"g":["面筋"],"s":["盐","酱油","香油"],"t":["蒸锅"],"v":1,"a":"主料：炸好的面筋100块｜调料：精盐5克酱油500克五香面50克芝麻油200克","p":["1。","先将水锅放在旺火上，水开时即将面筋放入，用手勺轻翻数下即捞出放入蒸盘内，再用笼蒸20余分钟。","2。","酱油、精盐、芝麻油，五香面混合调匀后，倒入面筋内，使调料滋味侵入即成。"]},{"i":483,"n":"炒掐菜","r":"鲁菜","o":"鲁菜300种","f":"绿豆芽色白而嫩，清口不腻，如略加海米同炒，即称为“金钩挂银丝”，又称炒豆挺。注：绿豆芽是物美面价廉的一种普通茉菜但经过加","c":"热菜","m":["爆炒"],"g":["豆芽"],"s":["盐","高汤","味精","葱"],"t":["炒锅"],"v":1,"a":"主料：绿豆芽1000克韭莱苔100克｜调料：精盐3克清汤50克味精1克葱丝1.5克花生油50克","p":["先将绿豆芽两头掐去洗净用沸水烫过。韭菜苔洗净，切成长3厘米的段。","炒勺内倒入花生油烧至六成热时烹入葱丝炸出香味，倒入掐莱、韭菜苔颠炒两下，加精盐、清汤、味精继续颠炒两下即成。"]},{"i":484,"n":"红烧茄子","r":"鲁菜","o":"鲁菜300种","f":"色泽红润油亮，茄子软嫩味甜咸香。","c":"热菜","m":["烧扒焖"],"g":["茄子"],"s":["盐","酱油","白糖","葱","高汤","姜","花椒"],"t":["炒锅"],"v":1,"a":"主料：茄子500克｜调料：精盐4克营酱油10克白糖50克25克清汤150克葱丝5克姜丝2克花椒10克花生油500克（约耗50克半）","p":["1。将茄子去柄，，削皮，切厚2厘兴的大片，片的两面交叉每隔4毫米载直刀（深为茄片厚度的·半)，再改切成长4厘米、宽2厘半的块。2。炒勺内倒入花生油，烧至七成热山，放入茄块炸成淡黄色捞出控净油。","炒勺内放油25克；放入白糖5炒至红色，加入219葱姜丝炸至放出香味，再放入清汤、酱油、白糖及炸好的茄块，烧沸，移在中火烧至茄烂汁浓，淋上花椒油，盛入盘内即成。"]},{"i":485,"n":"五香栗子","r":"鲁菜","o":"鲁菜300种","f":"咸香软面，可作冷拼盘碟料。二七八，辣油瓜皮，原料主料：黄瓜皮500克调料：精盐1克酱油15克醋15克白糖50克25克干红辣椒2.5克清汤","c":"热菜","m":["蒸"],"g":["栗子"],"s":["酱油","盐","白糖","八角","桂皮"],"t":["炒锅","蒸锅"],"v":1,"a":"主料：栗子400克｜调料：酱油50克精盐2.5克白糖50克八角桂皮各2.5克","p":["将栗子顶面刹上十字形刀口，放入沸水锅内煮透，捞出剥去外皮装碗，加上调料上笼蒸烂即成。"]},{"i":486,"n":"炒三冬","r":"鲁菜","o":"鲁菜300种","f":"质地脆嫩鲜香，清淡适口，色泽素雅，因三种原料头一个字都是“冬”字，故名三冬。222","c":"热菜","m":["爆炒"],"g":["冬笋","香菇"],"s":["盐","高汤","料酒","味精","淀粉"],"t":["炒锅"],"v":1,"a":"主料：冬笋冬菇京冬菜各100克｜调料：精盐2.5克清汤100克.料酒10克味精1克湿淀粉5克葱油50克花椒油5克","p":["1，将冬笋切长4厘米、宽2厘米、厚3毫米的片；冬菇片同样大的片；京冬莱切段挑去花椒，均用沸水焯过，.沥净水分。","炒勺内放入葱油，在中火上烧至八成热时，将冬笋、冬菇，冬菜倒入勺内煸炒，再加精盐、清汤、料酒颠翻煸炒1一2分钟，用湿淀粉勾芡，加味精，淋花椒油颠匀即成。221"]},{"i":487,"n":"酥菜","r":"鲁菜","o":"鲁菜300种","f":"","c":"热菜","m":["炖煨"],"g":["鸡肉","鸡蛋","鲫鱼","猪肉","豆腐"],"s":["盐","酱油","醋","白糖","姜","葱","花椒","香油"],"t":["炒锅","砂锅"],"v":0,"a":"主料：白莱5000克水发海带2500克鸡1000克鸡蛋20个鲜鲫鱼1000克猪肉1000克鲜藕1000克炸豆腐500克｜调料：精盐150克酱油1000克醋1000克白糖750克姜丝100克葱丝200克花椒50克芝麻油150克","p":["1。将白菜外部老帮叶剥去，内里帮叶逐叶撕开，用开水烫过。藕节切去刮皮，用开水煮透（不煮发黑）。海带洗净，卷成圆卷。鸡蛋煮熟去皮。鱼去鳞洗净。猪肉切大块，鸡从脊骨部劈开、花椒用纱布包好。","将锅洗净（最好用大砂锅），将猪骨平铺在锅底，防止糊，花椒包放在骨上，摆上藕，鸡鱼肉一层，鸡蛋海带一层，白菜叶在最上面，每摆一层撒上一层葱姜丝，再放上酱油、醋、精盐，并酌加清水（要根据情况加水多少），然后用盆扣上将莱压住。","用大火烧开，中火上炖至五成熟时（约2小时)，放入白糖继续炖至九成熟时倒入芝麻油，用小火稍，见汤还223有一半时将锅端下，晾凉后，将锅内熟料分别取出，吃时随便取用，"]},{"i":488,"n":"-豆腐箱","r":"鲁菜·博山","o":"鲁菜300种","f":"此菜块形整齐，颜色金黄美观大方，内里馅香嫩美。注：互离箱是山东淄博名菜，清朝初期就已非常盛行。相传乾隆皇帝去博山时曾经尝","c":"热菜","m":["爆炒"],"g":["豆腐","猪肉","海米","木耳"],"s":["盐","料酒","酱油","味精","葱","姜","高汤","淀粉"],"t":["炒锅","蒸锅"],"v":0,"a":"主料：豆腐1000克瘦猪肉300克｜配料：海米木耳各50克冬第100克｜调料：精盐5克酱油50克料酒15克味精1克.葱末5克姜末2.5克清汤200克湿淀粉50克葱油50克花生油1000克（耗100克）","p":["1：将豆腐切成长4厘米、高3厘米、宽2.5厘米的块；猪肉、海米、冬笋、木耳均切成细末。","2，炒勺内倒入花生油，烧至七成热时，将豆腐块下入油内炸成金黄色捞出；炒勺内留油50克，烹入葱姜末、肉末煸炒一下，再加入酱油、精盐、冬笋、木耳、海米、料酒炒熟成馅。","3，炸好的豆腐块将上面切下3毫米厚1片当盖，再将豆腐块中心挖空成箱子形，炒好馅料填满豆腐箱，盖上切下的那片豆腐，整齐地摆入大盘内；上笼用旺火约蒸15分钟左右取出。","4，炒勺内倒入葱油烧热，烹入酱油、料酒、清汤烧，沸，用湿淀粉勾芡，撤沫加味精，将汁浇在豆腐箱上即成。","224。"]},{"i":489,"n":"烩什锦丁","r":"鲁菜","o":"鲁菜300种","f":"此菜鲜香味美，什锦料色彩艳丽，汤汁色白明亮，清口不腻。","c":"汤羹","m":["烩汆"],"g":["海参","鸡肉","猪肉","猪腰","冬笋","蹄筋","虾","火腿","鱼肉","豌豆","鸡蛋"],"s":["盐","高汤","淀粉","料酒","味精","姜"],"t":["炒锅"],"v":0,"a":"主料：水发海参熟鸡肉猪腰子玉兰片各50克水发蹄筋虾仁蛋糕各25克鱼骨火腿青豆各15克｜调料：精盐2.5克清汤150克鸡蛋清半个湿淀粉4饯料酒15克味精1克姜汁2.5克葱油10克花生油250克（耗25克）","p":["1。将海参、蹄筋、鸡肉、鱼骨、火腿、玉兰片、蛋糕、猪腰子均用刀切成2厘米见方的丁块，和青豆全部用开水焯过。","虾仁用精盐0.5克、鸡蛋清、湿淀粉5克养妤。3。炒勺内倒入花生油、中火烧至六成热时，将养好的虾仁倒入油内，用铁筷子拨动滑好，将勺内油凈出，炒勺移至旺火上，放进葱油，把所有主料一并倒入勺内与虾仁混合，颠翻两下，加入清汤、精盐、料酒开起撇去浮沫，用湿225淀粉勾芡，再放入味精，姜汁烧沸盛入汤盘内即成。"]},{"i":490,"n":"凉拌什锦合菜","r":"鲁菜","o":"鲁菜300种","f":"此菜精选什锦料和各种颜色的配合，浇以拌汁，清爽可口，佐酒佳肴。226","c":"凉菜","m":[],"g":["海参","蹄筋","海米","黄瓜","鸡肉","猪肉","火腿"],"s":["醋","酱油","香油"],"t":["炒锅"],"v":0,"a":"主料：水发海参水发蹄筋水发海米水冻粉各15克海蛮黄瓜各50克熟鸡肉丝熟里脊丝熟瘦火腿蛋糕各25克｜调料：酱油50克醋35克芝麻油10克芥末面10克","p":["1。将海参、蹄筋用沸水焯过，晾凉切成丝，火腿、蛋糕、海截、黄瓜切成丝，冻粉切寸段。芥末面用热水搅匀阙好待用。","先将蹄筋丝、鸡肉丝、里脊肉丝、黄瓜丝、蛋糕丝、冻粉、海调拌均匀，盛盘后再将海参丝、火腿丝、海米放于其上。酱油、芝麻油、醋放一个碗内对成汁浇于菜上即成。食辣味者可加芥茉糊。"]},{"i":491,"n":"、炝八宝季菜","r":"鲁菜","o":"鲁菜300种","f":"该莱为春季佳品，清爽不腻，","c":"凉菜","m":[],"g":["海参","香菇","冬笋","火腿","荸荠"],"s":["盐","酱油","料酒","高汤","味精","姜"],"t":["炒锅"],"v":0,"a":"主料：净季菜100克水发海参水发冬菇水发玉兰片水发口藤熟火腿蒲莱心各15克去皮南荠一两｜调料：精盐2.5克酱油25克清汤25克料酒15克味精1克姜末1.5克花椒油10克","p":["1．将择净的季菜用沸水焯过洗净，截成段；火腿、南荠、口菇、冬蘑、玉兰片均切成1厘米见方的丁，除火腿外均用沸水焯过；以上各料均放于一个盘内，火腿、口蘑、海米放在上面。","2，将料酒、花椒油、酱油、味精、姜末、清汤、、精盐对成炝汁，浇于盘内莱上即成。"]},{"i":492,"n":"什锦鸭羹","r":"鲁菜","o":"鲁菜300种","f":"什锦料绚丽多彩，鲜香味美。","c":"汤羹","m":["烧扒焖"],"g":["鸭肉","猪肉","海参","鱼肉","香菇","口蘑","火腿","蹄筋","冬笋","豌豆"],"s":["盐","葱","姜","料酒","味精","淀粉","花椒","高汤"],"t":["炒锅"],"v":0,"a":"主料：熟鸭肉200克水发海参水发鱼骨冬菇口蘑蹄筋火腿各15克｜配料：菜花冬笋各50克青豆10粒｜调料：精盐5克葱姜末3克料酒10克味精1克227湿淀粉25克清汤500克葱油50克葱椒泥2.5克","p":["1．将鸭肉、菜花、冬笋、口蘑、鱼骨、海参、蹄筋均切1厘米见方的丁，与青豆一起用沸水焯过。","火腿也切1厘米见方的丁。","2，炒勺内放入葱油40克，中火上烧至八成热时，烹入葱姜末炸出香味，加清汤、精盐、葱椒泥和全部料烧沸撇去浮沫，湿淀粉勾芡，淋入葱油、味精，盛入汤碗即成。"]},{"i":493,"n":"三鲜汤","r":"鲁菜","o":"鲁菜300种","f":"汤清淡味美，嫩滑清口，筵席上常用此菜，深受食者欢迎。","c":"汤羹","m":["烩汆"],"g":["海参","虾","鸡肉","猪肉","白菜","鸡蛋"],"s":["高汤","盐","酱油","淀粉","料酒","味精"],"t":["炒锅"],"v":0,"a":"主料：水发海参50克鲜虾仁30克鸡脯肉50克｜配料：青菜心半两｜调料：精盐2克酱油2.5克清汤1厅鸡蛋清1个湿淀粉20克料酒10克味精1克","p":["将每个海参（顺长度）坡刀切成4大片；鸡脯肉切长4厘米的薄片，-和鲜虾仁同放一个碗内，加入精盐、鸡蛋清、湿淀粉拌匀浆好。2。锅内倒入沸水1000克，烧沸，将鸡肉片、虾仁、海参、背菜心分别在沸水内焯过，均捞至一个汤碗内。","炒勺内放入清汤、酱油、精盐、料酒、味精烧沸撇228去浮沫，浇入汤碗内即成。"]},{"i":494,"n":"炒三丁","r":"鲁菜·济南","o":"鲁菜300种","f":"，此莱鲜香脆嫩，配料精美别致，是济南地方正宗菜品。229","c":"热菜","m":["爆炒"],"g":["海参","虾","猪腰","核桃仁","蒲菜","豌豆","鸡蛋"],"s":["盐","酱油","淀粉","葱","花椒","料酒","高汤","味精","姜"],"t":["炒锅"],"v":0,"a":"主料：水发海参虾仁猪腰子各100克｜配料：核桃仁蒲菜青豆共50克半｜调料：精盐2克酱油3克鸡蛋清半个湿淀粉15克清汤100克葱椒料酒10克味精1克姜汁-2.5克葱油25克猪油250克（耗50克）","p":["1。将虾仁用鸡蛋清、精盐0.5克、湿淀粉5克调匀养好；海参切成1厘米5见方的丁，猪腰子洗净片开，片去腰，用直刀剁上十字花纹，蒲菜也切成1.5厘米的方丁。","将切好的海参、蒲菜与核桃仁、青豆用沸水焯过。但腰丁须另用沸水焯过再洗一下去净腥味。","清汤100克、酱油、精盐、葱椒料酒、味精、姜汁、湿淀粉均放入一个碗内调匀成汁，4。炒勺内倒入猪油，在旺火上烧至五成热时，将虾仁倒入滑透，勺内的油凈出，虾仁拨至勺把根，放进葱浊，再放进海参、腰丁、桃仁、青豆、蒲菜与虾仁混合翻，并将已对好的汁倒入开起颠翻儿下即成。"]},{"i":495,"n":"网油风丝卷","r":"鲁菜","o":"鲁菜300种","f":"此菜外表色金黄酥脆，内里软嫩鲜美，制做精细，食之别有风味，是锭席上的佳肴。230","c":"热菜","m":["炸"],"g":["猪肉","鸡肉","干贝","香菇","海参","冬笋","鸡蛋"],"s":["盐","白糖","料酒","味精","葱","姜","香油"],"t":["炒锅","蒸锅"],"v":0,"a":"主料：猪网油3张猪里脊肉生鸡脯肉各100克｜配料：干贝15克水发海参冬菇冬笋各50克｜调料：精盐5克白糖15克料酒15克味精1.5克鸡蛋清3个精粉100克葱姜丝5克香油25克花生油1000克（耗50克）","p":["1。先将猪肉、鸡肉、海参、冬菇、冬笋均切成细丝。蒸好的干贝搓碎，以上各料都放在-一个盆内，加入鸡蛋清1个、味精、料酒、葱姜丝、精盐、白糖、香油搅匀溃好。","猪网油择洗干净，用洁布振干水分，切成10厘米见方的片共6张，平铺在板上，将以上渍好的丝料均匀地放在每块网油片上，将网油卷起成长形的圆卷。精粉和鸡蛋清搅成稀糊。","锅内倒入花生油烧至七成热时，将网油卷逐个沾匀糊下入油内炸，至呈淡红色内里熟透，捞出控净油放板上，每个切成4段，整齐地摆在盘内即成。"]},{"i":496,"n":"芸豆","r":"鲁菜","o":"鲁菜300种","f":"此菜作法精细别致，味清香、鲜嫩，美口不腻。","c":"热菜","m":["炸"],"g":["豌豆","猪肉","鸡蛋"],"s":["盐","酱油","葱","姜","料酒","味精","高汤","淀粉"],"t":["炒锅","蒸锅"],"v":0,"a":"主料：芸豆150克猪肉100克｜调料：精盐1.5克酱油5克鸡蛋清3个葱姜末1.5克料酒5克味精0.5克清汤100克精粉10克湿淀粉15克花椒油5克花生油500克（约耗50克）","p":["1。将芸豆的两头和筋择去洗净，逐个从中片开成夹刀片；猪肉剁成细泥，放入碗内加精盐1克、少量酱油、鸡蛋清、湿淀粉、葱姜末搅匀成馅。将馅抹在每个芸豆夹里。","鸡蛋清2个入碗内，加湿淀粉5克搅打成糊。3，炒勺内放入花生油在中火上烧至五成热时，将芸豆夹逐个滚上一层精粉，再蘸上蛋清糊下入锅内炸，至呈淡黄色捞出，沥净油。4，炸好的芸豆夹摆入碗内，加上清汤、精盐、酱油、料酒上笼蒸6分钟取出，扣入盘中，把原汤凈入勺内，湿淀粉勾芡烧沸，加味精，淋上花椒油浇在芸豆夹上即成。"]},{"i":497,"n":"奶汤素烩","r":"鲁菜","o":"鲁菜300种","f":"汁浓色白味鲜，清口不腻。","c":"汤羹","m":["烩汆"],"g":["粉丝粉皮","蒲菜","冬笋","香菇","面筋"],"s":["高汤","盐","料酒","味精","姜","淀粉"],"t":["炒锅"],"v":1,"a":"主料：茶干1块细粉丝50克蒲菜青莱心各3棵玉兰片50克香菇面筋泡各25克231｜调料：精盐2.5克料酒10克味精1克姜汁5克清汤150克奶汤350克湿淀粉15克葱油1.两","p":["1.茶干切片改切成锯齿条。","蒲菜切象眼块，玉兰片、冬菇切片，面筋泡切两半。","茶干条用油炸成金黄色捞出。","其他配料均用沸水焯过。","2。","炒勺内倒葱油、清汤、奶汤稍煤，将以上各料倒入，加入精盐、姜汁、料酒、湿淀粉勾芡，烧沸加味精即成。"]},{"i":498,"n":"芙蓉桔柿","r":"鲁菜","o":"鲁菜300种","f":"西红柿彤红，上顶雪白，汁明亮，内里馅香嫩，：色彩艳丽大方。","c":"热菜","m":["爆炒"],"g":["西红柿","猪肉","冬笋","口蘑","荸荠","鸡蛋"],"s":["盐","酱油","葱","姜","高汤","料酒","淀粉"],"t":["炒锅","蒸锅"],"v":0,"a":"主料：西红柿10个猪肉150克｜配料：冬笋50克口蘑25克马蹄25克｜调料：精盐5克酱油10克清汤200克葱姜末2.5克料酒10克香莱叶10朵鸡蛋清4个花生油50克湿淀粉15克","p":["1，将西红柿洗净，在顶部削去一层，用小刀从中挖空，成罐形。","2。","猪肉剁碎，冬笋、马蹄、口蘑均切碎丁。","3。","炒勺内放入油，加热至六成热时，放入葱姜末炸至232放香，再放入肉馅炒至发白色，加酱油、精盐、料酒、口蘑、冬笋、马蹄炒熟，倒在碗内。","4，将炒熟的馅全部装入西红柿空罐内。","5。","将鸡蛋清磕入大碗内，用竹筷子快速插打成白细沫，摊在每个西红柿的顶部，再将香菜叶朵撒在蛋清沫上，装入大盘内，上笼用旺火蒸1一2分钟（不要将鸡蛋清沫蒸老）快速取出。","6，炒勺内倒入清汤、精盐、料酒，用湿淀粉勾芡烧沸成白玉卤浇在芙蓉桔柿上即成。","·。"]},{"i":499,"n":"荒爆皮鸡丝","r":"鲁菜","o":"鲁菜300种","f":"咸酸辣香、鸡肉嫩，海皮脆韧清口不腻，饮酒佳肴。","c":"热菜","m":["爆炒"],"g":["鸡肉","猪肉","螃蟹"],"s":["盐","酱油","葱","姜","蒜","香菜","料酒","醋","胡椒","高汤","淀粉","香油"],"t":["炒锅"],"v":0,"a":"主料：鸡脯肉150克水发海蟹皮250克｜调料：精盐1.5克酱油5克葱丝1.5克姜丝0.5克蒜泥少许香菜梗25克料酒10克味猜1克.醋15克胡椒面2.5克清汤100克湿淀粉10克花生油500克（耗50克）芝麻油5克","p":["1.海截皮洗净沙质切成长5厘米的粗丝，用开水快速烫一下，捞出控干。","香菜梗切成长3厘米的段，鸡脯肉切成.长4厘米的丝，放入碗内加精盐、鸡蛋清、湿淀粉调匀。","2。","花生油倒入炒勺内，用中火烧至五成热时，鸡丝放油内用筷子打开滑透，捞出。","2333.炒勺内留油25克，烹入葱姜蒜丝，炸至放香，烹入醋再加清汤、料酒、味精、精盐、酱油、胡椒粉烧沸，倒入鸡肉丝和海截皮丝，颠翻淋上芝麻油，撒上香菜即成。"]},{"i":500,"n":"冻粉拌鸡丝","r":"鲁菜","o":"鲁菜300种","f":"鸡肉丝嫩滑，冻粉白而透明，经拌制后味道鲜美，清凉爽口。234","c":"凉菜","m":["爆炒"],"g":["鸡肉","猪肉","黄瓜","鸡蛋"],"s":["酱油","醋","盐","淀粉","香油"],"t":["炒锅"],"v":0,"a":"主料：生鸡脯肉100克冻粉5克｜配料：黄瓜一两｜调料：酱油15克醋15克精盐1克鸡蛋清1个湿淀粉10克芝麻油5克花生油250克（耗25克）","p":["1。将鸡脯洗净片去筋膜，片成薄片，切成长5厘米的细丝，放入碗内加精盐、鸡蛋清、湿淀粉抓匀；黄瓜洗净切长4厘米的丝条；冻粉切长4厘米的段，用冷水洗净再泡软。2。炒勺内倒入花生油在中火上烧至四成热时，渍过的鸡肉丝放入，用铁筷子拨散，鸡丝滑透捞出，倒凉开水内淘净浮油。","将切好的黄瓜丝用凉开水洗一遍控净水装入盘内，再将冻粉放在黄瓜丝上，撒上滑好的鸡丝。酱油、芝麻油和醋放一个碗内调匀成汁，倒在盘内菜上即成。"]},{"i":501,"n":"酿青铃","r":"鲁菜","o":"鲁菜300种","f":"柿椒色翠绿，形似铃脆嫩，憩入的馅心鲜香，其珠咸微辣。","c":"热菜","m":["爆炒"],"g":["辣椒","猪肉","香菇"],"s":["盐","料酒","酱油","味精","高汤","淀粉","葱","姜"],"t":["炒锅","蒸锅"],"v":0,"a":"主料：柿椒8个（约200克）猪肥瘦肉200克｜配料：冬筹冬菇各一两｜调料：精盐3克酱油10克料酒10克味精0.5克清汤100克湿淀粉10克葱姜末2克葱油10克花生油50克","p":["将柿椒先洗净，在柄部周围直径约2厘米用小刀尖刻上刀纹，沿刀纹处取下柄当盖用。然后将内里的籽出，再用沸水焯过；猪肉、冬笋、冬菇均切2毫米的方丁。2。炒勺内倒入花生油，中火烧至五成热时，投入葱姜末炸出香味，加猪肉、冬笋、冬菇煸炒，再放入酱油、精盐（三分）搅炒均匀，用湿淀粉勾芡盛出，分别装入柿椒内，把柄原样盖好，放入盘内，入笼蒸透取出。
