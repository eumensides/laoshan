楂糕15克、鸡蛋黄20克。湿淀粉10克、面粉10克、白糖20克、花生油500克。","p":["鸡蛋加入碗内，另加蛋黄、清水、湿淀粉。","桂花酱、面粉，搅匀成汁，分盛两碗。","将山楂糕研碎放入其中一碗，搅匀，炒锅滑油置小火上，分别先将其中一碗蛋液倒入锅内，用小铲不停地搅动，熟时出锅倒入摊平成嘎渣。","另一碗亦用其法覆入其上摊平。","即成鸳鸯嘎渣。","两片厚度约1.5厘米。","面粉铺在案上，晾凉的嘎渣放在上面，切成0.5厘米宽的长条，再切成象眼块，沾匀面粉，下入六成热（约150℃）油锅中，端在小火上，翻动，炸成杏黄色时，捞出沥油，装盘撒上白糖即成。"]},{"i":149,"n":"挂霜丸子","r":"鲁菜","o":"鲁菜","f":"色白如霜，外皮焦酥香甜，内软嫩鲜美。","c":"甜品","m":["炸"],"g":["猪肉","鸡蛋","面粉"],"s":["白糖"],"t":["炒锅"],"v":0,"a":"猪肥膘肉200克。 鸡蛋黄20克。白糖75克、面粉50克、香精适量、花生油500克。","p":["将猪肉洗净，切成绿豆大的粒，拌上鸡蛋黄，制成直径2.5厘米的丸子，炒锅内放入花生油，用中火烧至七成热（约175℃）时，将九子下锅改用小火炸熟炸酥捞出沥油即成。","炒锅内加入清水、白糖，用微火炒至出霜时，倒入炸好的丸子。","香精、青红丝不断颠翻，挂满糖霜时盛出即可。"]},{"i":150,"n":"八宝梨罐","r":"鲁菜","o":"鲁菜","f":"多果融合，清脆爽口，香甘味美，甜中略酸，适宜夏季宴席。","c":"甜品","m":["蒸"],"g":["梨","冬瓜","红枣","山楂","糯米"],"s":["白糖","桂花酱"],"t":["炒锅","蒸锅"],"v":1,"a":"茌梨150克。 桔饼20克、桂元肉15克、冬瓜条20克、红枣15克、山植糕15克、青梅15克，糯米饭15克、瓜子仁15克、青红丝15克、白糖20克、桂花酱20克、熟猪油20克。","p":["在梨削去外皮；在梨头切下1／4（按梨的高度）作盖，去梨把，用小刀挖去梨核，梨肉壁厚1厘米成为罐形，用开水稍烫。","桔饼、桂元肉、冬瓜条、红枣去核、山楂糕、青梅均匀切成小方丁，用沸水焯过，与蒸过的糯米饭、白糖、桂花酱、瓜子仁、熟猪油搅拌成馅。","将馅装入罐内，盖上盖，青梅切条作梨把，装入盘内，上笼旺火蒸20分钟取出，撒上青红丝，炒锅放入清水、白糖、桂花酱，旺火烧沸成汁，浇在梨上即成。"]},{"i":151,"n":"酿银瓜","r":"鲁菜","o":"鲁菜","f":"味道清新，绵较，甜香，凉爽，是夏令甜菜佳品。","c":"甜品","m":["蒸"],"g":["莲子"],"s":["白糖"],"t":["炒锅","蒸锅"],"v":1,"a":"银瓜20克。 莲子20克、红小豆20克、熟猪油15克、青红丝15克。白糖50克。","p":["莲子上笼蒸透、红小豆洗净加水蒸烂，去外皮，绞成豆沙。","银瓜去皮，切去瓜尾、从中间开4厘米的方口、挖去瓜瓤、用水洗净。","将豆沙、莲子、熟猪油放入碗内，加白糖拌匀，填入瓜内盖好盖，上笼蒸烂，取出晾凉，再入冰箱凉透（不要结冰）。","炒锅加入白糖，清水，熬成糖汁后晾凉，放入冰箱凉透，上桌时，瓜上面撤青红丝，浇入糖汁即成，。"]},{"i":152,"n":"玛瑙银杏","r":"鲁菜","o":"鲁菜","f":"造型美观，外脆香甜，内韧软嫩，颜色晶莹剔透，别具一格。","c":"甜品","m":["炸"],"g":["白果","芝麻"],"s":["白糖","淀粉"],"t":["炒锅","蒸锅"],"v":1,"a":"银杏250克。 青红丝20克、芝麻仁15克。白糖20克、花生油250克、淀粉50克。","p":["白果砸碎，去外壳，煮约10分钟，搓去皮膜，上笼蒸制回软，放入千淀粉内，使其沾匀，放入七成热（约175℃）油锅内，略炸捞出。","待油温升高至八成热（约200℃）时，再炸至微黄色时，捞出沥油，锅内放少许油，放入白糖炒至金黄色起泡时，迅速放入白果，颠翻匀后，撒上青红丝、芝麻仁、倒入抹好麻油的搪瓷盘内，用刀将糖液拉成片状，稍凉装盘即成。"]},{"i":153,"n":"蜜汁肥桃","r":"鲁菜","o":"鲁菜","f":"色泽金黄油亮，甜香爽口。盛夏之季冰镇后食用，沁入心脾。","c":"甜品","m":["爆炒"],"g":["桃"],"s":["蜂蜜","白糖","桂花酱"],"t":["炒锅"],"v":1,"a":"肥桃200克。 蜂蜜20克。白糖20克、桂花酱20克、花生油50克。","p":["肥桃去皮切成滚刀块，沾匀干面粉，放入六成热（约150℃）油锅中炸透，呈金黄色捞出。","炒锅加油、白糖，中火炒至呈红色时，加清水、白糖、蜂蜜炆2分钟，然后将桃倒入再放入桂花酱炆至汁浓时、盛入盘内即成。"]},{"i":154,"n":"蜜汁金枣","r":"鲁菜","o":"鲁菜","f":"形似金枣，色泽金黄，甘香浓郁。","c":"甜品","m":["炸"],"g":["红枣","山药"],"s":["白糖","蜂蜜","桂花酱"],"t":["炒锅","蒸锅"],"v":1,"a":"枣泥150克。 山药100克、青梅条20克，花生油50克、白糖20克、蜂蜜20克、桂花酱15克。","p":["山药洗净，上笼蒸熟去皮，用力压成细泥，加面粉拌匀，做成直径3厘米的圆饼，包入枣泥馅，做成枣状的丸子，在一端插上一根青梅条为枣蒂，外面滚上干面粉，放入六成热（约150℃）油锅中炸成金黄色捞出沥油。","炒锅加油，白糖，中火炒至呈红色，加水、白糖、蜂蜜、桂花酱炆成浓汁，倒入炸好的“金枣”，再炆半分钟，装盘即成。"]},{"i":155,"n":"炆红果","r":"鲁菜","o":"鲁菜","f":"色泽红润，甜酸适中，味美可口。","c":"甜品","m":["炖煨"],"g":["山楂"],"s":["白糖","桂花酱"],"t":["炒锅"],"v":1,"a":"红果400克。 白糖20克、桂花酱15克。","p":["红果洗净，用直径0.5厘米的铁管捅去核，然后放入锅内加清水，用微火煮至五成熟捞出，剥去皮。","汤锅内放清水，加入白糖，用中火烧沸，待糖溶化后撇去浮沫，倒入山楂，移至小火上炆至汁浓时，放入桂花酱轻轻搅匀，盛入盘内即成。"]},{"i":156,"n":"蜜三果","r":"鲁菜","o":"鲁菜","f":"色泽红、白，黄三色相间，鲜美雅洁。山楂软烂浓酸，栗子松散甘香，白果柔韧适口，果味浓郁，营养丰富","c":"甜品","m":["蒸"],"g":["山楂","栗子","白果"],"s":["蜂蜜","白糖","香油","桂花酱"],"t":["炒锅","蒸锅"],"v":1,"a":"山楂100克、栗子100克、白果00克。 蜂蜜50克。白糖20克、芝麻油100克、桂花酱刀克。","p":["山楂洗净，用水蒸至五成热时取出，用铁扦捅去核，去皮，洗净。","栗子用刀划断外壳，略煮，剥去外壳、内皮，洗净。","白果剥去外壳，刷去软皮，剔除果芯，淘洗干净，粟子、白果加清水上笼蒸20分钟，熟透取出，滗净水分。","炒锅内放入芝麻油，中火烧至浅红色，加水、白糖、蜂蜜、山楂、栗子、白果，煮沸后改用小火炆至糖汁浓稠时放入桂花酱，淋上芝麻油拌匀装盘即成。"]},{"i":157,"n":"拔丝空心小枣","r":"鲁菜","o":"鲁菜","f":"果肉软密，枣甜内软而香，内外拉丝，绵延不断，别有雅趣。","c":"甜品","m":["爆炒"],"g":["红枣"],"s":["白糖","淀粉"],"t":["炒锅"],"v":1,"a":"金丝小枣200克。 脂油50克、白糖25克、淀粉50克、花生油100克。","p":["将脂油剁成细泥，加白糖拌成水晶馅。","小枣放入沸水中浸泡，去掉枣核，将水晶馅抹入空心处，放在干淀粉中滚动，使枣均匀沾上一层淀粉。","炒锅放花生油。","中火烧至五成热热（约125℃），放入小枣，以小火炸至金黄色时捞出。","锅内留油，加入白糖炒至深黄色能拔出丝时，倒入炸好的小枣，颠翻炒锅，沾匀出锅即成。"]},{"i":158,"n":"炸素鸡排","r":"鲁菜","o":"鲁菜","f":"造型美观；色泽杏黄。外酥香，里软嫩，清爽味鲜，增进食欲，并有健脾除湿，益精补气之功效。","c":"热菜","m":["炸"],"g":["鸡肉","山药","香菇","冬笋","鸡蛋","豆腐","面粉"],"s":["葱","花椒","味精","盐","淀粉","香菜","甜面酱"],"t":["炒锅"],"v":0,"a":"熟山药400克，冬菇25克、冬笋25克。 鸡蛋清50克、豆腐皮50克、茄把25克。馒头25克。葱15克、花椒3克、味精1克、精盐5克、淀粉50克、花生油150克、香菜15克、葱白15克、甜面酱50克。","p":["熟山药去皮制成泥，冬菇、冬笋切成0.3厘米小方的丁，同放碗内加葱椒泥、味精、精盐、鸡蛋清调匀，取豆腐皮切成长7.5厘米、宽3厘米的椭圆形片，放入调好的山药泥摊平在豆腐片上，再分别覆盖一张豆腐片，然后插入前把，做成“鸡排”，馒头去皮切成0.2厘米见方的末。","将鸡蛋清与淀粉、精盐一起拌成蛋清糊，将鸡排沾匀蛋清糊。","再沾匀馒头末，放入四成热（约100℃）油锅中炸成金黄色出锅，沥油后摆在放有香菜的盘内，外带葱白、甜面酱碟即可。"]},{"i":159,"n":"炸豆腐丸子","r":"鲁菜","o":"鲁菜","f":"丸子外焦里嫩，味道鲜美，食之软脆适口，外配调料，汆味隽永。","c":"小吃","m":["炸"],"g":["豆腐","鸡蛋","海米"],"s":["甜面酱","姜","葱","香菜","盐","花椒","淀粉","白糖","椒盐","醋"],"t":["炒锅","蒸锅"],"v":0,"a":"泰安豆腐200克。 鸡蛋20克、海米末50克。甜面浆25克、酱姜末10克、葱末10克、酱苤蓝末10克、香菜末10克、精盐4克、花椒面5克、淀粉50克、花椒盐10克、糖醋汁20克、花生油750克（实耗油75克）。","p":["豆腐入笼蒸15分钟取出，沥干水分，用刀面压成泥，放入大碗内，加鸡蛋、海米末、甜面酱、酱姜芽末、葱末、酱苤蓝末、香菜末、精盐、花椒面拌匀成馅，挤成直径3.5厘米的九子，滚上干淀粉，放入八成热（约200℃）油锅内炸1一2分钟捞出。","待油温开至九成热（约225℃）时，再将丸子放入油内，炸至金黄色捞出装盘。","外带花椒盐或糖醋汁上席食用。"]},{"i":160,"n":"什锦蜂窝豆腐","r":"鲁菜","o":"鲁菜","f":"造型新颖，清香鲜嫩，味美适口，营养丰富。","c":"热菜","m":["蒸"],"g":["豆腐","鱼肉","猪肉","鸡蛋","鸡肉","海参","虾","火腿","香菇","海米","豌豆","蹄筋","冬笋"],"s":["盐","味精","料酒","酱油","高汤"],"t":["炒锅","蒸锅"],"v":0,"a":"豆腐200克。 鱼肉20克、鸡蛋清15克。鸡肉条50克、海参15克、虾仁20克、火腿15克、冬菇15克、海米20克、青豆15克、蹄筋15克、冬笋15克。精盐5克、味精1.5克、绍酒25克、酱油15克、清汤100克。","p":["净鱼肉去净筋膜，砸成细泥，放碗内与鸡蛋清、绍酒、精盐搅成鱼料。","再将豆腐搅成泥，同鱼料混合搅匀。","将白煮鸡肉切成条，放入大盘底，涂抹上豆腐鱼料，入笼蒸10分钟取出，即成豆腐状。","鸡蛋清放在碗内打成雪丽糊，均匀地抹在“豆腐”上，将海参、虾仁、火腿、冬菇、海米、青豆、佛筋、冬笋均切成1厘米见方的丁，各色相间的插在豆腐上面，入笼稍蒸片刻，改切成象眼块。","汤锅内加清汤、酱油、绍酒、味精、精盐、旺火烧沸后撇去浮沫，倒入瓷澥内。","将豆腐整齐地推入汤内即成。"]},{"i":161,"n":"软烧豆腐","r":"鲁菜","o":"鲁菜","f":"软滑香甜、鲜嫩爽口，色泽红亮。老幼皆宜。","c":"热菜","m":["烧扒焖"],"g":["豆腐"],"s":["香油","花椒","白糖","葱","姜","酱油","料酒","味精","高汤"],"t":["炒锅","蒸锅"],"v":1,"a":"豆腐250克。 芝麻油100克、花椒3克、白糖20克、葱丝15克、姜丝15克，酱油10克、绍酒15克、味精1克、清汤100克、花椒油10克。","p":["豆腐入屉蒸熟透，削去四边黄皮，切成2厘米见方的块，放入温水锅内用小火炖煮，至浮起时捞出沥净水。","炒锅放芝麻油中火烧六成热（约150℃），放入花椒略炸呈黄色时捞出不用、加入白糖，改用小火炒至红色时，放入豆腐炒匀，待其上色后，即将葱丝、姜丝、酱油、绍酒、味精、清汤、白糖放入，用慢火煨炆至豆腐呈枣红色，汤汁稠浓时，淋上花椒油即成。"]},{"i":162,"n":"珍珠豆腐羹","r":"鲁菜","o":"鲁菜","f":"色泽鲜艳夺目，黑白黄绿各色相间，配料为小丁，形如珍珠。汤鲜料美，风味清鲜，营养丰富。","c":"汤羹","m":["爆炒"],"g":["豆腐","鸡肉","猪肉","鸡蛋","海参","冬笋","菠菜"],"s":["盐","淀粉","味精","酱油","高汤"],"t":["炒锅"],"v":0,"a":"豆腐250克。 鸡脯肉20克、鸡蛋清15克、水发、海参25克、黄蛋糕20克、玉兰片20克、菠菜梗15克，精盐5克、淀粉50克、花生油100克、酱油10克、味精2克、鸡油5克、清汤100克。”","p":["鸡脯肉切成0.5厘米见方的丁，加入鸡蛋清、精盐、湿淀粉拌匀。","水发海参、黄蛋糕、玉兰片切成0.8厘米、见方的丁。","菠菜梗切成丁，入沸水中略焯，捞出沥水。","炒锅内放入花生油至五成热（约150℃），放入鸡脯丁划油捞出。","净锅内放入情汤，加入酱油、精盐、味精，倒入鸡脯肉、海参、豆腐、黄蛋糕、水发王兰片，沸后撇去浮沫，用湿淀粉勾芡，淋鸡油出锅即成。"]},{"i":163,"n":"龙潭钓玉牌","r":"鲁菜","o":"鲁菜","f":"软嫩滑润，咸香清爽，造型美观，老幼皆宜。","c":"热菜","m":["蒸"],"g":["豆腐","鸡蛋","鸡肉","猪肉","虾"],"s":["葱","姜","盐","淀粉","味精","高汤"],"t":["蒸锅"],"v":0,"a":"豆腐250克。 鸡蛋清50克、鸡脯肉150克、湖虾100克。葱末15克、姜末15克、精盐4克、淀粉50克、熟猪油20克、清汤100克、味精1克、葱椒油20克。","p":["豆腐入笼蒸过，去掉硬皮，用刀抹成细泥。","鸡脯肉剁成泥，与豆腐泥合在一起，加入鸡蛋清、葱末、姜末、精盐、湿淀粉搅匀成“豆腐料子”。","湖虾洗净，去头、壳，留虾尾。","用20把汤匙，底面抹上熟猪油，放入豆腐料子抹平。","在汤匙把的一端嵌入湖虾虾尾在外，形似“金钩”，入笼蒸10分钟。","熟后取出，整齐摆入盘内。","锅中放入清汤，精盐、味精烧成汤汁，淋上葱椒油浇入盘内即成。"]},{"i":164,"n":"炸菠菜脯","r":"鲁菜","o":"鲁菜","f":"荤素兼备，外酥脆内松嫩，口味鲜香。亦可用荠菜、芹菜等制作，风味均佳。","c":"热菜","m":["炸"],"g":["菠菜","白菜","海米","猪肉","冬笋","香菇","豆腐","鸡蛋"],"s":["盐","味精","料酒","葱","花椒","淀粉"],"t":["炒锅"],"v":0,"a":"菠菜心250克。 海米末20克、猪肥肉膘25克、冬笋20克、冬菇20克、豆腐皮15克、鸡蛋清20克。精盐7.5克、味精2克、绍酒25克、葱椒汁15克、淀粉50克、花生油500克（实耗油75克）。","p":["菠菜心洗净，用沸水烫过，切成末。","海米、肥肉膘、冬笋、冬菇均切成小方丁，与菠菜一起加精盐、味精、绍酒、葱椒汁调成菜馅，豆腐皮截成3.5厘米的圆片，包上菠菜馅。","鸡蛋清打成雪丽糊，加面粉、干淀粉，搅成暄糊。","将其馅子逐个挂匀糊，入四成热（约100℃）的油锅中炸至漂起后，翻个捞出，再入五成热（约125℃）油锅中炸成杏黄色，捞出沥油装盘。"]},{"i":165,"n":"三美豆腐","r":"鲁菜·泰安","o":"鲁菜","f":"汤汁乳白，豆腐软滑，白菜鲜嫩，味鲜美，清淡爽口。","c":"热菜","m":["烧扒焖"],"g":["豆腐","白菜"],"s":["葱","姜","盐","高汤","味精"],"t":["炒锅","蒸锅"],"v":1,"a":"泰安豆腐250克。 泰安白菜100克。熟猪油50克、葱15克、姜10克、奶汤50克、精盐4克、味精1克、鸡油5克。","p":["选用泰安白菜心，撕成30厘米长的劈柴块，洗净沥干水分，用开水略氽，放入盘内。","豆腐蒸熟用刀切成长3厘米，宽2厘米、厚0.5厘米的片，放在同一盘内。","炒锅内放入熟猪油，烧至五成热（约110℃），加入葱、姜末炸出香味，放入奶汤、精盐、良菜、豆腐、烧沸后撇去浮沫，加入味精，淋鸡油出锅即成。"]},{"i":166,"n":"云片鹿角菜","r":"鲁菜","o":"鲁菜","f":"香郁爽口，鲜艳美观。是一种风味独特的野菜佳肴。","c":"热菜","m":["蒸"],"g":["鹿角菜","火腿","冬笋","黄瓜","粉丝粉皮"],"s":["味精","高汤","料酒","淀粉","盐"],"t":["炒锅","蒸锅"],"v":0,"a":"鹿角菜150克。 火腿20克、玉兰片20克、黄瓜皮20克、绿豆15克。清汤100克、味精5克、绍酒15克、淀粉50克、鸡油5克、精盐10克。","p":["锅内放清水、绿豆，烧沸后捞出绿豆，将鹿角菜放绿豆汤中氽过，然后在清水中浸泡1小时，捞出沥干。","将鹿角菜、火腿、玉兰片、黄瓜皮均片成抹刀片，鱼鳞状正面朝下间隔整齐地摆在碗中。","清汤、味精、绍酒、食盐调匀浇入碗内，上笼用旺蒸半小时取出，滗出汤汁扣在盘内。","将滗出的原汤，勾上芡，淋入鸡油，浇在菜面上即成。"]},{"i":167,"n":"单县羊肉汤","r":"鲁菜·单县","o":"鲁菜","f":"投料考究，制作精细，调味丰富，汤汁乳白，不腥不膻，香醇不腻，味道鲜美，并有补虚壮阳，温中暖下","c":"汤羹","m":["烩汆"],"g":["羊肉","猪肉"],"s":["高汤","花椒","桂皮","香菜","姜","葱","盐","酱油","香油"],"t":["炒锅"],"v":0,"a":"羊肉500克。 花椒5克、桂皮5克、陈皮5克、香菜50克、草果5克、良姜10克、白芷5克、葱10克精盐15克、红油25克、花椒水15克、丁香面5克、桂子面5克、酱油5克、芝麻油25克。","p":["将羊肉洗净切成长10厘米、宽3.3厘米、厚3.3厘米的块，羊骨砸断铺在锅底，上面放上羊肉，加水至过肉，旺火烧沸，撇净血沫，将汤滗出不用。","另加清水，用旺火烧沸，撇去浮沫。","再加上适量清水，沸后再撇去浮沫，随后把羊油放入稍煮片刻，再撇去一次浮沫。","将花椒、桂皮、陈皮、草果、良姜、白芒等用纱布包起成香料包，一同与姜片、葱段、精盐放入锅内，继续用旺火煮至羊肉八成熟时，加入红油。","花椒水，煮约二小时左右即成。","此时汤锅要始终保持滚沸，捞出煮熟的羊肉，顶丝切成薄片，放入碗内，撒上香菜末即成肉汤。","可将辣椒油、大葱段装味碟，荷叶饼装大盘，一并随羊肉汤上桌。","食用时放少许辣椒油，荷叶饼夹大葱段，可与羊肉汤同食。"]},{"i":168,"n":"素锅烤鸭","r":"鲁菜","o":"鲁菜","f":"颜色鲜艳，酷似鸭肉，鲜香不腻。","c":"热菜","m":["烤"],"g":["鸭肉","面筋","蒲菜","冬笋","口蘑","鸡蛋"],"s":["葱","花椒","味精","料酒","酱油","淀粉"],"t":["炒锅"],"v":0,"a":"熟面筋150克。 蒲菜头25克、荠荸50克、玉兰片25克、蘑菇25克、蛋清50克。葱15克、花椒3克、味精1克、绍酒15克、酱油10克、花生油150克、淀粉50克。","p":["将面筋切成长条，加干淀粉，酱油浸养，荸荠肉切小片，蒲菜头用刀轻拍切成段，蘑菇片、水发玉兰片切两半。","四种原料一齐下入开水锅内，见开捞出沥干，挤净水分。","将面筋下五成热（约125℃）油锅煎炸，挺身后捞出沥油，与蒲菜、荸荠片、玉兰片、蘑菇片一起放盘内，加入葱椒汁、味精、绍酒、酱油调料浸养，再加入蛋清糊拌匀，做成“素鸭”，锅内加花生油烧至四成热（约100℃），将“素鸭’平摊在锅内，用小铲转动，挺身后折叠，用筷子在上面扎4-5个冒气孔，炸成枣瓤色捞出沥油，切成象眼块摆在盘中，外带葱白、甜面酱上席即成。"]},{"i":169,"n":"烧罗汉面筋","r":"鲁菜","o":"鲁菜","f":"造型优美，鲜香软嫩，制作精巧，营养丰富。","c":"热菜","m":["烧扒焖"],"g":["面筋","香菇","冬笋","口蘑"],"s":["盐","葱","姜","料酒","酱油"],"t":["炒锅","蒸锅"],"v":1,"a":"熟面筋200克。 水发冬菇片20克、水发玉兰片20克、口蘑50克，花生油150克、精盐5克、葱10克、姜15克、酱油10克、绍酒15克、猪油200克。","p":["熟面筋去边，划上平行花刀，再切成片，炒锅内加入花生油，烧至六成热（约150℃），将面筋炸成杏黄色，捞出沥油。","再将炸好的面筋放入开水锅内煮至发软，捞在温水盆内，洗去油渍，挤净水分。","炒锅再上火放猪油，烧至六成热（约150℃），加入拍扁的葱姜、炸成黄色、加酱油、绍酒烧开，去葱姜、下入面筋煨烧15分钟，下入水发冬菇片、水发玉兰片、口蘑、精盐。","锅开后端离火口，将玉兰片摆在碗底，面筋刀口朝下逐片摆在碗内，口蘑摆在四周，上笼用大火蒸10分钟，取出扣在大汤碗内，将汤滗在锅内，勾薄芡，淋上花椒油，浇在面筋上即成。"]},{"i":170,"n":"荷叶肉","r":"鲁菜","o":"鲁菜","f":"荷香袭入，猪肉软嫩酥烂，鲜香味美，营养丰富，并有清热解暑，散瘀止血之功效。","c":"热菜","m":["爆炒"],"g":["猪肉","米粉"],"s":["葱","姜","酱油","味精","料酒","八角","桂皮","花椒","甜面酱"],"t":["炒锅","蒸锅"],"v":0,"a":"硬肋肉（带皮）250克。 荷叶若干、炒香的大米100克。葱姜丝15克、酱油5克、味精0.5克、绍酒15克、桂皮1克、八角1.5克、花椒1克、甜面酱75克。","p":["将猪肉皮面用火烤焦，放入热水内浸泡，刮去焦皮洗净，切成长5.5厘米、宽3厘米、厚0.6厘米的片，放入盛器内，加甜面酱、酱油、绍酒。","葱、姜丝调匀备用。","将大米、桂皮、八角、花椒放入炒锅内，用微火炒黄，晾凉后再压成碎粒，放入碗内冲入少量沸水待用，荷叶截去茎杆，裁为8.5厘米的圆片，放入沸水内氽过，取出晾凉。","再将肉片同碎米粒拌匀，每块肉均用一片荷叶包好，排列在碗内入笼蒸熟，取出摆入盘内即成。"]},{"i":171,"n":"炸藿香","r":"鲁菜","o":"鲁菜","f":"色泽金黄，酥脆鲜香，气味芳香，回味悠长，并有化湿和中，祛暑解表之功效。","c":"小吃","m":["炸"],"g":["藿香","面粉"],"s":["盐"],"t":["炒锅"],"v":1,"a":"藿香250克。 面粉20克、酵面5克。精盐5克、素油10克、花生油100克。","p":["取鲜藿香尖，将其用60℃的热水洗净，放入精盐略腌。","面粉放入碗内，加酵面用温水搅拌均匀，放入素油，待5分钟后成稀糊状，即为酥糊。","炒锅放入油，中火烧至七成热（约175℃）时，将藿香沾匀酥糊，下入油中，炸至金黄色捞出即成。"]},{"i":172,"n":"拔丝山药","r":"鲁菜","o":"鲁菜","f":"糖丝甜脆香酥，山药软嫩香甜，并有健脾、除湿，益肺固肾，益精补气之功效。","c":"甜品","m":["爆炒"],"g":["山药"],"s":["白糖"],"t":["炒锅"],"v":1,"a":"山药200克。 青红丝刀克。白糖40克、花生油500克（实耗油75克）。","p":["山药洗净去皮，切滚刀块，用沸水烫后捞出汤水，放入五成热的油锅中，炸熟至金黄色捞出。","炒锅内放油烧至四成热（约100℃），用小火放入白糖溶化，炒至金黄色起泡时，迅速倒入山药，翻匀糖液，端离火眼顶翻，撒上青红丝盛入抹芝麻油的盘中即成。","上菜时外带一碗凉开水用筷子蘸水食用。"]},{"i":173,"n":"酿茄斗","r":"鲁菜","o":"鲁菜","f":"清淡爽滑，鲜糯隽美，造型优美，别具风味，色味俱佳，雅俗共赏。","c":"热菜","m":["爆炒"],"g":["茄子","猪肉","海米","鸡肉","鸡蛋","木耳","冬笋"],"s":["葱","姜","味精","香油","料酒","高汤","盐","淀粉"],"t":["炒锅","蒸锅"],"v":0,"a":"茄子250克。 猪肉20克、水发海米20克、鸡里脊肉15克、鸡蛋清15克、樱桃15克、水发木耳15克、玉兰片15克。花生油50克、葱15克、姜10克、味精1克、芝麻油10克、清汤100克、绍酒15克、精盐5克、淀粉50克。","p":["茄子去皮、蒂，切成3厘米见方、2厘米厚的块，中间挖去2厘米见方，成“斗”形，洗净。","猪肉切成绿豆大小的丁，水发海米切碎。","鸡里脊肉剁成泥状，加鸡蛋清。","湿淀粉、精盐搅匀成鸡料子，樱桃每个切两半，水发木耳、玉兰片均切成末。","炒锅放油烧至七成热（约175℃），加入葱、姜末爆炒。","加肉丁、木耳、海米，玉兰片炒熟，加芝麻油、味精拌匀成馅料，盛入碗内。","装上前斗，上面抹上鸡料，再沾上一片樱桃，入笼蒸透装入盘内。","炒锅内加清汤、味精、绍酒、精盐，中火烧沸，用湿淀粉勾稀芡，淋在茄汁上即成。"]},{"i":174,"n":"锅塌蒲菜","r":"鲁菜","o":"鲁菜","f":"色泽金黄，香鲜脆嫩，引入食欲。","c":"热菜","m":["煎塌"],"g":["蒲菜","鸡蛋","香菇","火腿"],"s":["淀粉","盐","葱","姜","高汤"],"t":["炒锅"],"v":0,"a":"蒲菜200克。 鸡蛋黄25克、香菇25克、火腿25克。淀粉50克、精盐5克、葱15克、姜10克、清汤、150克、花生油50克。","p":["将蒲菜削去根部，去掉老皮及前梢，齐刀切成长6厘米的段，入开水中略焯，迅速捞出。","将鸡蛋黄放入汤盘中打散，再放入湿淀粉、精盐搅匀成蛋黄糊。","将蒲菜整齐地放入盘内，使其沾满蛋黄糊，香菇与火腿均切成细丝。","炒锅放花生油烧至四成热（约100℃），放入葱姜丝稍炸，然后整齐地推入挂糊的蒲菜，用微火蹋煎，至金黄色时翻个个，蹋煎两面至金黄色。","再放入清汤、精盐、加盖蹋煎1分钟，待汤汁将尽时出锅。","撒上火腿，冬菇丝即成。"]},{"i":175,"n":"氽发菜三丝","r":"鲁菜","o":"鲁菜","f":"汤鲜味醇、色泽鲜艳，似琼浆玉液中漂浮的“灵芝”，令入赏心悦目。","c":"热菜","m":["爆炒"],"g":["发菜","鸡蛋","鸡肉","猪肉","口蘑"],"s":["酱油","料酒","高汤"],"t":["炒锅"],"v":0,"a":"发菜200克。 蛋黄丝50克，鸡脯肉丝100克。酱油10克、绍酒10克、清汤100克、口蘑汤100克。","p":["发菜洗净，用温开水泡2分钟，搌净水分。","鸡脯肉切成细丝。","炒锅放火上，加入开水，将蛋黄用针扎一小孔，用手轻轻捏入锅内，成为细丝时捞出搌净水分，鸡丝下锅，用竹筷划开即捞出。","发菜、蛋黄丝、鸡脯肉丝分三堆放在大汤碗内，锅加入清汤烧开，撇去浮沫，加入口蘑汤、酱油、绍酒，调好口味，倒入三丝碗内即成。"]},{"i":176,"n":"奶汤鲜核桃仁","r":"鲁菜","o":"鲁菜","f":"核桃仁洁白脆嫩，奶汤醇厚味美。","c":"甜品","m":["烩汆"],"g":["核桃仁","火腿","冬笋","口蘑"],"s":["高汤","姜","盐","料酒","味精"],"t":["炒锅"],"v":0,"a":"鲜核桃仁150克。 火腿15克、冬笋15克、口蘑15克、苔菜花6克。熟猪油20克、奶汤100克、姜汁10克、精盐5克、绍酒15克、味精0.6克、鸡油5克。","p":["鲜核桃仁去膜皮，洗净。","放入沸水中一焯，沥净水分。","火腿、冬笋均切成片，口蘑从中间片开，将口蘑、冬笋、苔菜花放入沸水中焯过，炒锅内放熟猪油，烧至六成热（约132℃）时，加奶汤烧沸，然后用小火炆至浓稠程度，放入核桃仁、苔菜花、冬笋。","旺火烧沸，撇去浮沫，加入姜汁、精盐、绍酒、味精、淋鸡油，盛入汤盘内，撒上火腿片即成。"]},{"i":177,"n":"白汁裙边","r":"鲁菜","o":"鲁菜","f":"裙边透明糯烂，汁浓洁白似胶，香气四溢,并有滋阴凉血之功效。","c":"热菜","m":["爆炒"],"g":["甲鱼","鸡肉","猪肉"],"s":["盐","味精","葱","姜","料酒","淀粉"],"t":["炒锅","砂锅"],"v":0,"a":"水发裙边150克。 鸡翅膀100克、猪肋骨50克、猪肥瘦肉片50克。精盐3克，味精2克、葱姜12克、奶油25克。绍酒20克、姜汁15克、猪油35克、湿淀粉15克。","p":["将水发裙边投入开水锅内，除去异味，用清水洗净，再用清水氽过，凉后切成长6厘米、宽2厘米的长方块备用。","炒锅内放入熟猪油用中火烧热，放葱姜丝，煸出香味后，将鸡翅、猪肉片、猪肋骨放入锅内中略煸炒一下，随即加入奶汤、绍酒、精盐，捞出葱姜，开沸后，打去浮沫，将肋骨捞出排在砂锅底，上面放裙边，再将砂锅内的鸡翅随汤一并倒入砂锅内，用微火扒至裙边糯烂时，捞出裙边码入碗中，扣入汤盆内。","锅内放入奶油、绍酒、精盐、姜汁及原汤，待沸后撇去浮沫，用湿淀粉勾芡。","加入味精、淋葱油，浇在裙边上即成。"]},{"i":178,"n":"素火腿","r":"鲁菜","o":"鲁菜","f":"红白相间，香甜细嫩，色形逼真，并有益肺固肾，行气和胃之功效。","c":"热菜","m":["蒸"],"g":["火腿","山药","鸡蛋"],"s":["白糖","盐","味精","香油"],"t":["蒸锅"],"v":0,"a":"山药400克。 鸡蛋清50克、砂仁面25克、建曲汁20克、嫩糖色15克。精盐4克、芝麻油4克、味精1克、白糖20克。","p":["将山药去皮入笼蒸熟，制成泥与湿淀粉一起放在盘内，加入鸡蛋清、精盐、芝麻油：味精、白糖搅匀，成为山药料。","取1／10的山药料，加入嫩糖色，掺匀放入抹油的铁盒，摊平入笼蒸硬后取出，为“肉皮”。","将3／10的山药料放在肉皮上，摊平蒸10分钟，出笼为“肉膘”。","再将剩汆山药料加入砂仁面、建曲汁，用麻油搅匀、摊在“肥膘”上，再入笼蒸35分钟，晾凉，刷上芝麻油，切片上席即成。"]},{"i":179,"n":"奶汤蒲菜","r":"鲁菜","o":"鲁菜","f":"色泽乳白清雅，菜质脆嫩，汤鲜味酿","c":"汤羹","m":["烩汆"],"g":["蒲菜","香菇","火腿"],"s":["高汤","葱","盐","姜","料酒"],"t":["炒锅"],"v":0,"a":"蒲菜200克。 苔菜花50克、冬菇25克、火腿25克。葱15克、精盐5克、姜汁10克、绍酒15克、克、奶汤500克、葱油25克。","p":["蒲菜去皮，削去后梢，苔菜花去皮，均切成3厘米长、1厘米宽、0.2厘米厚的片，冬菇、火腿均切成片。","将蒲菜、苔菜花、冬菇入开水锅中焯过捞起沥干）炒锅内放入葱油，烧至四成热（约100℃），加入奶汤烧开，放入蒲菜、苔菜花、冬菇及精盐、姜汁、葱椒、绍酒、沸后盛在瓷盛内，撒上熟火腿片即成。"]},{"i":180,"n":"三鲜酿面筋","r":"鲁菜","o":"鲁菜","f":"面筋软嫩而有韧性，酿馅清爽鲜美，食后齿颊留香。","c":"热菜","m":["烧扒焖"],"g":["面筋","猪肉","海参","冬笋"],"s":["葱","姜","料酒","酱油","盐","味精","高汤"],"t":["炒锅"],"v":0,"a":"面筋150克。 猪肉、100克、海参25克、玉兰片25克。葱15克、姜10克、酱油10克、绍酒15克、精盐5克、味精1克、熟猪油100克、清汤100克、葱椒油5克。","p":["猪肉，海参洗净，均切成小丁，玉兰片切末，与葱姜末、酱油、绍酒、精盐、味精一起搅匀成三鲜馅。","生面筋洗净，每条将片成长薄片，在每片面筋的一面，抹上馅，卷成直径3厘米的圆柱形，放入九成开的清汤锅内，小火煮熟捞出。","炒锅内加入熟猪油烧至六成热（约132℃）入放入葱段、姜片，炸出香味，加入酱油、清汤烧开，捞出葱姜、倒入面筋，用慢火煨透，待汤汁剩下1／3时，将面筋捞在盘内。","锅内原汤烧开，撇去浮沫，加入味精、绍酒，淋上花椒油，浇在面筋上即成。"]},{"i":181,"n":"八仙瑶池聚会","r":"鲁菜","o":"鲁菜","f":"造型典雅，汤浮鸡茸宛如朵朵白云，轻飘其上，“云”下八珍，郁香四溢，鲜嫩柔脆，质感各异。","c":"热菜","m":["烧扒焖"],"g":["鸡肉","猪肉","赤鳞鱼","鹿角菜","白菜","豆腐","鸡蛋"],"s":["味精","盐","葱","高汤","料酒","淀粉"],"t":["炒锅"],"v":0,"a":"山鸡肉100克、赤鳞鱼65克、鹿角菜50克、松蛾50克、松香蛾50克、雷搌蛾50克、白菜心50克、豆腐50克。 鸡蛋清50克。味精1克、精盐5克、清汤100克、葱椒油10克、绍酒15克、菜油250克（实耗油50克）、淀粉50克。","p":["山鸡肉洗净切成片，放入鸡蛋清、味精、精盐、湿淀粉上浆拌匀，倒入六成热（约150℃）油锅中划油后捞出。","将赤鳞鱼洗净。","鹿角菜、松蛾、松香蛾、雷搌蛾、白菜心洗净切段，豆腐切片，与赤鳞鱼均放入沸水中一焯，捞入与山鸡片一起放入瓷盘中合为珍。","鸡里脊肉去筋膜剁成泥，加入鸡蛋清、精盐、清汤、味精、葱椒油搅成鸡料子，与汆下的豆腐制成泥拌匀成稀糊状，倒入90℃的水中，漂起成片，形似白云，捞出倒在“八珍”上，汤锅内放入清汤、绍酒、精盐、味精，旺火烧沸后打去浮沫，淋鸡油倒入瓷盘内即成。"]},{"i":182,"n":"纸包三鲜","r":"鲁菜","o":"鲁菜","f":"造型美观，鲜嫩爽口，原汁原味。","c":"热菜","m":["炸"],"g":["虾","猪肉","海参","鸡肉","香菇","冬笋","鸡蛋"],"s":["葱","姜","盐","味精","料酒","香油"],"t":["炒锅"],"v":0,"a":"鲜虾肉100克、海参50克、鸡脯肉100克。 冬菇25克、冬笋20克、鸡蛋清20克。玻璃25克。葱15克、姜10克、精盐5克、味精1克、绍酒15克、芝麻油10克、菜油500克（实耗油50克）。","p":["将鲜虾肉从脊背片开，去虾肠，片成小坡刀片。","海参、鸡脯肉均片成小坡刀片。","冬菇、冬笋片薄，切成小象眼片。","将上述原料放入碗内。","加蛋清、葱姜末。","精盐、味精、绍酒、芝麻油搅拌均匀腋渍入味。","把玻璃纸平铺在菜墩上，均匀地放进调好的鲜料，包成长6厘米、宽3厘米的纸包，放入五成热（约125℃）的油锅内，炸成金黄色熟后捞出沥油，整齐地摆入盘内。","稍装饰美化即成。"]},{"i":183,"n":"砂锅三味","r":"鲁菜","o":"鲁菜","f":"肉酥烂酥香，肥而不腻。鸡肉滑嫩味美，鸡蛋呈玻珀色，别具一格。","c":"热菜","m":["炖煨"],"g":["猪肉","鸡肉","鸡蛋","火腿","白菜"],"s":["酱油","高汤","葱","姜","盐","味精"],"t":["炒锅","砂锅"],"v":0,"a":"猪肘肉100克、带骨雏鸡肉100克。 鸡蛋60克，火腿25克、青菜心25克。酱油20克、清汤100克、葱段15克、姜片10克、精盐5克、味精1克、菜油100克。","p":["猪肘肉、带骨雏鸡肉均剁成。","3.3厘米见方的块，放入开水锅中氽过，取出放入砂锅内。","鸡蛋煮熟剥去壳，沾匀酱油。","放入油锅中炸成金黄色捞出，摆入砂锅的四周，火腿、青菜心均切成小象眼片。","砂锅内放入清汤、绍酒、葱段、姜片、精盐，旺火烧开后，移至小火炖至酥烂，取出葱段、姜片、放入火腿片、青菜心略炖。","撇去浮油，放入味精，淋上鸡油即成。"]},{"i":184,"n":"烧五丝","r":"鲁菜","o":"鲁菜","f":"此菜芡浓多汁，色泽和谐，营养丰富，尤适宜于老年人享用。","c":"热菜","m":["烧扒焖"],"g":["鸡肉","猪肉","海参","猪肚","鸡蛋","冬笋","火腿","猪腰"],"s":["淀粉","盐","葱","姜","料酒","酱油","高汤","香油"],"t":["炒锅"],"v":0,"a":"鸡丝50克、猪肉丝50克、海参丝50克、蛋糕丝50克、血肚丝45克。 鸡蛋清30克，玉兰片丝25克、火腿丝25克、猪腰丝35克。淀粉50克、精盐5克、花生油50克、葱丝15克、姜丝10克、绍酒15克、酱油10克、清汤100克、芝麻油10克。","p":["鸡丝、猪肉丝用鸡蛋清、湿淀粉、精盐抓拌上浆。","海参丝、蛋糕丝、鱼肚丝用开水一氽，捞出沥于水分。","将猪腰丝放漏勺内用开水一氽，捞出沥干，放入八成热（约200℃）油锅里一冲沥净油。","炒锅内放入花生油，烧至五成热（约125℃），将鸡丝、猪肉丝下锅滑炒捞出。","炒锅底留汆油，用葱姜丝爆炒，烹绍酒，加海参丝、鱼肚丝、玉兰片丝、鸡丝、腰丝。","蛋糕丝、酱油、精盐、清汤，烧开后撇净浮沫，用湿淀粉勾芡，淋芝麻油，盛入汤碗内，撤上火腿丝，装汤碗内即成。"]},{"i":185,"n":"菊花锅","r":"鲁菜","o":"鲁菜","f":"边涮边食，风味别具，食之肉嫩汤鲜，味道极美，营养丰富，配以菊花，别有雅趣。","c":"火锅","m":["烧扒焖"],"g":["鱼肉","猪肉","鸡肉","猪腰","菠菜","鸡蛋","豆腐"],"s":["白糖","蒜","香菜","芝麻酱","香油","腐乳","辣椒油","盐","味精","酱油","料酒"],"t":["炒锅","火锅"],"v":0,"a":"净鱼肉50克、鸡脯肉50克、里脊肉50克、猪腰片50克。 菠菜75克、精丝40克、油馓40克、白菊花40克、鸡蛋50克、糖蒜20克、香菜15克、芝麻酱20克、芝麻油20克、豆腐乳20克、腐乳汁20克。腌韭菜花10克、辣椒油20克、酱油20克、精盐10克、味精10克、绍酒25克。","p":["净鱼肉、鸡脯肉、里脊肉均片成长5厘米、宽2厘米、厚0.2厘米的片。","猪腰片剔去净腰臊，也片成同样大的片，菠菜洗净，切成3.5厘米长的段。","炒锅置中火上，放花生油烧至五成热（约125℃），放粉丝一触捞出。","油撒从中间拆断。","白菊花洗净，摘去蕊，将以上原料连同鸡蛋、水饺、糖蒜、香菜末分别放入2个盘内，芝麻酱用芝麻油解成汁，豆腐乳用乳汁澥开，用腌韭菜花、辣椒油、酱油、精盐等调料分别各盛入两个盘内。","汤锅内放清汤，味精、绍酒，旺火烧开后打去浮沫，倒入菊花火锅内，点燃火锅，待烧开将切配好的各种主料、配料、调料端上餐桌，摆在火锅周围。","由食者用筷子随意夹起主、配料放入火锅汤内涮熟，按其所好选取调料蘸食。"]},{"i":186,"n":"炸龙肠","r":"鲁菜","o":"鲁菜","f":"外焦酥，里鲜嫩，鲜咸适口，芝麻清香。","c":"热菜","m":["炸"],"g":["虾","鸡肉","猪肉","海参","火腿","荸荠","鸡蛋"],"s":["盐","味精","料酒","酱油","胡椒","淀粉","香油"],"t":["蒸锅"],"v":0,"a":"对虾250克。 鸡里脊肉50克、海参25克、火腿乃克、荸荠25克、鸡蛋清20克。精盐4克、味精1克、酱油10克、绍酒15克、胡椒面10克、芝麻油10克、淀粉50克、菜油150克。","p":["对虾去泥肠、筋洗净，由脊背片开成片。","鸡里脊肉、海参均片成0.2厘米厚的片，荸荠、火腿均切成片。","海参片入开水锅中略烫捞起、把切好后的各种原料放入盛器内，加精盐、味精、酱油、绍酒、胡椒面、芝麻油调和成馅。","鸡蛋清放入碗内，加湿淀粉调匀成蛋清糊备用。","猪网油切成边长12厘米的正方形片，铺平，每块抹上少许蛋清糊，放一份馅，卷成直径l.5厘米、长3.5厘米的卷，上笼旺火蒸熟，取出滗去汤汁，周身蘸匀蛋清糊再粘上一层芝麻，放入五成热（约125℃）的油锅中，炸至芝麻泛黄时捞出，整齐摆入盘内即成。"]},{"i":187,"n":"三色鸡鱼丸","r":"鲁菜","o":"鲁菜","f":"九子红、白、黄相同，软嫩滑爽，味道鲜美，尤其适宜老年人和婴幼儿食用。","c":"热菜","m":["烧扒焖"],"g":["鸡肉","鱼肉","猪肉","西红柿","鸡蛋","冬笋","白菜"],"s":["盐","淀粉","姜","料酒","高汤"],"t":["炒锅"],"v":0,"a":"鸡阿150克、鱼肉150克。 番茄酱30克、鸡蛋清25克、鸡蛋黄25克、冬笋20克、菠菜心10克。精盐5克、湿淀粉50克、姜末10克、绍酒15克、清汤100克葱油25克。","p":["鸡脯肉、鱼肉洗净，剔去脂皮，用刀背砸成细泥，放入碗内。","加鸡蛋清、精盐、湿淀粉、姜末、绍酒，分三等分装入三个碗内，一碗加鸡蛋黄搅匀成黄色，一碗加番茄酱搅匀成红色，一碗呈白色。","冬笋切成片。","汤锅内放清水1000克，旺火烧至六成热（约60℃）时，将三种颜色的鸡、鱼肉泥挤成直径1.6厘米的丸子，下入锅内，烧沸撇去浮沫，熟透捞出。","摆入盘内。","炒锅加清汤、精盐、冬笋、菠菜心、绍酒、旺火烧沸撇去浮沫，用湿淀粉勾芡，葱油调匀，浇入鸡鱼丸上即成。"]},{"i":188,"n":"脆炸网油卷","r":"鲁菜","o":"鲁菜","f":"外皮金黄酥脆，里边肉嫩虾鲜。","c":"小吃","m":["炸"],"g":["虾","猪肉","鸡肉","冬笋","口蘑","鸡蛋","面粉"],"s":["葱","姜","酱油","味精","料酒","香油"],"t":["炒锅","蒸锅"],"v":0,"a":"对虾100克、猪里脊肉50克、鸡肉50克。 冬笋25克、口蘑10克、鸡蛋1个、面粉15克。酱油10克、葱姜末各10克、味精10克、芝麻油15克、绍酒10克。","p":["猪网油洗净，用洁净的纱布搌干水分，切成10厘米见方的块，共14块。","将猪里脊肉、冬笋、鸡肉洗净切成3厘米长、2.5厘米宽0.3厘米厚的薄虾，对虾、口蘑洗净切成0.6厘米厚的片，放入碗内，加上酱油、葱姜末、味精、芝麻油、绍酒拌匀成馅。","把鸡蛋磕入碗内调散，加上面粉，搅匀成鸡蛋糊，把油铺案板上，先抹上鸡蛋糊再放上馅，卷成直径2厘米、长10厘米的卷，摆入盘内。","上笼用旺火略蒸取出。","炒锅内放入花生油，用中火烧至五成热（约125℃）时，把网油卷沾满鸡蛋糊，再沾上芝麻，逐个放入油内炸至呈金黄色，捞出沥油，盛入盘内改刀即成。"]},{"i":189,"n":"龙眼凤肝","r":"鲁菜","o":"鲁菜","f":"造型美观，鸭肝鲜嫩，猪肠软酥，一肴多味，富有营养。","c":"热菜","m":["烧扒焖"],"g":["鸭肉","猪肉","猪大肠","鸡肉","香菇","冬笋","火腿","豌豆","鸡蛋"],"s":["盐","料酒","淀粉","葱","酱油"],"t":["炒锅","蒸锅"],"v":0,"a":"鸭肝150克、熟猪大肠75克。 鸡里脊肉茸73克、水发冬菇、水发玉兰片各50克、火腿15克、青豌豆10克。精盐4克、鸡蛋清若干、绍酒10克、湿淀粉30克、酱油10克、葱椒油10克。","p":["将肝洗净，在开水中氽过。","切成1.7厘米宽的长条，用竹签在每一条鸭肝上划一小口，玉兰片切成长5厘米、厚0.7厘米的片，冬菇每个劈两半，均在沸水焯过。","将大肠切成长2.5厘米的段，在沸水中汆过备用，将鸡茸入碗内加鸡蛋清。","精盐、绍酒、湿定粉、清汤、熟猪油，顶向搅成茸泥，火腿切成0.1厘米立方粒；豌豆去外皮，用开水烫过备用。","锅内放猪油少许，旺火烧至六成热（约132℃）时入葱姜炸出香味，加入鸡肝，冬菇、玉兰片翻炒，随即放入酱油、清汤、绍酒、白糖待沸时移至微火上焖至熟透时，除去葱姜用湿淀粉勾芡，再加入葱椒油调匀，盛入腰盘内一端成三角形。","取平盘一个抹上少量猪油，摆上大肥肠。","再用鸡蛋清、精面粉搅成糊状抹在大肠内圈，将拌和的鸡茸挤成丸子，放在大肠上口，将一粒豌豆按在丸子的顶端似眼状，周到撒上火腿末，即成“龙眼”，共做15个，上笼用旺火蒸透取出，摆在盛器鸭肝盘的另一端。","锅内放入清汤、精盐、绍酒，以旺火烧沸勾湿淀粉芡，淋葱椒油浇在龙眼上即成。"]},{"i":190,"n":"冬菇烧蹄筋","r":"鲁菜","o":"鲁菜","f":"冬菇清素淡雅，蹄筋软醇鲜糯荤素兼备，各扬其长。","c":"热菜","m":["烧扒焖"],"g":["香菇","蹄筋","豌豆","蒲菜"],"s":["葱","盐","酱油","料酒","味精"],"t":["炒锅"],"v":0,"a":"油发蹄筋250克、冬菇100克。 芸豆50克、蒲菜50克、蛋糕25克。葱末10克、酱油5克、精盐5克、绍酒10克、味精3克，花椒油5克。","p":["将蹄筋洗净，用刀切成3.3厘米的段，粗的切成两片，两头划刀口，芸豆、薄菜切成3厘米的段。","炒锅内加入清水，置中火烧开后下入蹄筋、加酱油少量推搅。","煮开时捞出，挤净水分放入盘内，炒锅再放中火上，加入熟猪油，烧至六成热（约132℃）时，放入葱末爆炒几下，再倒入清汤、少量酱油、蹄筋、苔豆、蒲菜、水发冬菇、精盐。","煨5分钟后撇去浮沫。","用漏勺将原料捞在盘内，装盘时，将蹄筋放在盘的中间，冬菇在四周，炒锅内末汤重新烧开，加入湿淀粉，勾薄芡，加上绍酒、味精、花椒油，然后浇在冬菇蹄筋上面，再放上蛋糕片即成。"]},{"i":191,"n":"蟹黄蹄筋","r":"鲁菜","o":"鲁菜","f":"色泽光润，口味软嫩，鲜咸适口，老少皆宜。","c":"热菜","m":["爆炒"],"g":["螃蟹","蹄筋"],"s":["酱油","料酒","淀粉","葱","姜","蒜","白糖"],"t":["炒锅"],"v":0,"a":"油发蹄筋200克。 蟹黄75克。酱油5克、绍酒15克、湿淀粉30克、葱段姜蒜25克、糖色适量。","p":["将洗净的油发猪蹄筋切成长条，放入沸水锅中汆透捞出，沥去水分。","炒锅加花生油置中火烧六成热（约150℃）时，放入少量白糖炒至黄色，倒入猪蹄筋、葱段、姜炒至上色后，加入酱油、清汤、绍酒烧沸移至微火上烧制，待汤汁紧稠浓时，取出葱姜不要，用湿粉勾芡，加味精、葱油搅匀盛入盘中间。","炒锅内放花生油，置中火烧至六成热（约150℃），加葱姜蒜末炸出香味，随即倒入蟹黄搅拌炒几下，然后烹入酱油、绍酒、味精颠翻均匀，放在盘内蹄筋四围即成。"]},{"i":192,"n":"锅烧肘子（做法二）","r":"鲁菜","o":"鲁菜","f":"色泽红亮，鲜香味醇。","c":"热菜","m":["烧扒焖"],"g":["猪肉"],"s":["盐","酱油","白糖","八角","桂皮","淀粉","高汤"],"t":["炒锅","蒸锅"],"v":0,"a":"锗肘子1 个（重约1000克），盐，酱油，糖，大料，桂皮，淀粉，汤，油各适量","p":["将猪肘子刮洗干净，剔去骨头，入锅煮至六成熟捞出，控干水分，用干净布将水分搌净。","在肘子皮上抹一层酱油，起锅上火放油烧热，把肘子皮向下炸至皮起泡后，捞出控油。","将炸好的肘子放在盆中，加盐，酱油，糖，大料，桂皮，适量的汤上锅蒸软烂取出，肉皮向上装盘。蒸肉原汤倒入炒锅中，烧开，水淀粉勾芡，将汁浇在肘子上即可。"]},{"i":193,"n":"糖醋里脊","r":"鲁菜","o":"鲁菜","f":"菜色金黄，甜酸可口，外焦脆，里嫩香。","c":"热菜","m":["炸"],"g":["猪肉","鸡蛋","面粉"],"s":["白糖","醋","料酒","盐","葱","姜","淀粉","香油","高汤"],"t":["炒锅"],"v":0,"a":"猪里脊肉250克，清油750克（实耗100克），料酒20克，醋 50克，白糖 60克，盐 2克，葱末，姜末各2克，鸡蛋液35克，水淀粉 70克，面粉适量，香油10克，高汤适量","p":["肉洗净切片，加入鸡蛋液，水淀粉，面粉抓匀。","碗中放料酒，糖，醋，盐，葱，姜，水淀粉，少许汤对成汁。","锅放油烧至五成热，下入肉片，炸至焦脆，捞出控油。","锅留底油，烹入糖醋汁，倒入肉片，翻勺，淋香油出勺即可。"]},{"i":194,"n":"芫爆肚丝","r":"鲁菜","o":"鲁菜","f":"菜色白绿相间，口味鲜咸微辣。","c":"热菜","m":["爆炒"],"g":["猪肚"],"s":["香菜","盐","姜","葱","蒜","香油","味精","醋","胡椒"],"t":["炒锅"],"v":0,"a":"猪肚 500克，香菜50克，料洒15克，盐3克，姜汁5克，葱，姜，蒜各10克,香油 5克，味精，醋，胡椒粉，碱，清油各适量。","p":["将猪肚用碱，醋搓洗，去净白油，及杂质，再用清水洗净，用开水氽后另换水，加入葱段，料酒，姜片，用微火煮熟，捞出晾凉后切成细丝，香菜切段。蒜切片。","锅入油烧热，放葱姜丝，蒜片爆香，加入肚丝翻炒，烹入料酒，加盐，姜汗味精，醋，胡椒粉，香菜翻炒，淋香油即可。"]},{"i":195,"n":"油焖虾","r":"鲁菜","o":"鲁菜","f":"色泽油亮，鲜嫩适口。","c":"热菜","m":["烧扒焖"],"g":["虾"],"s":["味精","盐","白糖","醋","料酒","葱","姜","高汤"],"t":["炒锅","火锅"],"v":0,"a":"原料：大吓 750克，味精 2克，盐 5克，白糖 50克，醋 10克，料酒 20克，葱丝,姜丝各 5克，高汤 150克，花生油 50克","p":["将大虾剪去须，爪，除去头部沙包和脊背沙线，洗净。","锅上火加油烧至五成热，下入虾，煎至两面呈金红色，盛出。","锅留底油，放葱姜丝，料酒，盐，白糖，醋，高汤，下入煎好的虾煮开后用小火锅约5分钟，加味精炒匀，先将虾出锅码盘，余汁收浓后淋在大虾上即成。"]},{"i":196,"n":"栗子白菜","r":"鲁菜","o":"鲁菜","f":"味咸香，菜软烂，色金黄。","c":"热菜","m":["烧扒焖"],"g":["栗子","白菜"],"s":["盐","酱油","料酒","味精","白糖","淀粉","葱","姜"],"t":["炒锅"],"v":1,"a":"栗子100克，白菜300克。猪油25克，酱油10克，精盐2克，料酒5克，味精2克，白糖5克，水淀粉10克，葱花2克，姜水少许，植物油500克(实耗50克)。","p":["将大白菜去根去帮，一破两半，切成7厘米长、1厘米宽的白菜条(菜根处要竖着切几刀使整个菜心相连)，每个栗子上用剪刀剪一个十字小口，放入锅内煮熟。捞出剥皮，栗仁一切两半。","将植物油放入锅内，烧热，投入白菜稍炸一下捞出，控净油。","猪油下锅，烧热，用葱花炝锅，下入高汤、酱油、料酒、味精、白糖、精华盐、白菜、栗子，烧开，移微火上烧2～3分钟，使汤汁去掉一部分，栗子已焖烂，用水淀粉勾芡，淋上明油即成。"]},{"i":197,"n":"冬笋里脊丝","r":"鲁菜","o":"鲁菜","f":"菜色洁白，软嫩鲜脆。","c":"热菜","m":["爆炒"],"g":["冬笋","猪肉","鸡蛋"],"s":["味精","料酒","淀粉","盐","葱","姜","香油"],"t":["炒锅"],"v":0,"a":"猪里脊肉 200克，冬笋 100克，清油 75克，味精 3克，料酒 25克，鸡蛋液 40克，水淀粉 40克，盐 3克，葱末，姜末各少许，香油适量。","p":["里脊肉洗净切细丝，冬笋切细丝。肉丝加淀粉，蛋液抓匀。","锅放油烧五成热，将肉丝滑散，控油。冬笋丝焯水，捞出控净。","锅留底油，放葱姜末爆香，倒入肉丝，冬後丝翻炒，加料酒，盐，味精炒匀勾少许水淀粉，淋香油出勺."]},{"i":198,"n":"南煎丸子","r":"鲁菜","o":"鲁菜","f":"色泽金红，鲜嫩香醇。","c":"小吃","m":["煎塌"],"g":["猪肉","鸡蛋"],"s":["料酒","黄酱","盐","味精","白糖","葱","姜","香油","淀粉","高汤"],"t":["炒锅"],"v":0,"a":"猪肉200克，清油250克（实耗约100克），料酒15克，黄酱15克，盐2克，味精5克，白糖5克，葱姜末各2克，香油10克，鸡蛋液35克，水淀粉100克，高汤适量","p":["南煎，也叫煎烧，是南方多彩的方法之一。","肉切细末，加鸡蛋液，盐，料酒，味精，酱油，黄酱，香油，水淀粉搅拌，挤成个头均匀的丸子。","锅放油烧热，将丸子推入锅里煎，之后用手勺将丸子按扁，一面煎熟，翻个，继续煎，两面都煎好取好。","锅留底油，放葱、姜爆香，烹料酒，加汤、酱油、盐、糖、味精，下入丸子，锅开后转微火靠入味，再转大火勾芡，翻个，淋香油即可。"]},{"i":199,"n":"爆腰花","r":"鲁菜","o":"鲁菜","f":"色泽美观，鲜香脆爽。","c":"热菜","m":["爆炒"],"g":["猪腰","木耳","青蒜"],"s":["酱油","料酒","葱","姜","高汤","淀粉","香油","盐","味精","醋"],"t":["炒锅"],"v":0,"a":"鲜猪腰250克，水发木耳30克，青蒜10克，酱油15克，料酒15克，葱、姜各5克，高汤50克，水淀粉25克，香油2克，清油500（实耗约75克），盐、味精、醋各适量。","p":["将腰子一破两半，片去腰臊，剞麦穗花刀，改为三角刀块，葱，姜切丝，青蒜洗净切段。","碗中放葱姜丝、酱油、料酒、盐、味精、醋、水淀粉、香油及高汤对成芡汁。","将腰花用开水焯去血水，捞出控净水。锅放油烧至八成热，将腰花爆炸，捞出控油。","锅留底油，倒入腰花，下入木耳、青蒜段翻炒，烹入汁芡速炒，待汁裹住腰花上时淋香油即可。"]},{"i":200,"n":"葱油鱼","r":"鲁菜","o":"鲁菜","f":"形美味鲜，清淡素雅，咸香微辣。","c":"热菜","m":["烧扒焖"],"g":["鱼肉","草鱼"],"s":["盐","酱油","料酒","味精","胡椒","姜","葱","香油"],"t":["炒锅"],"v":0,"a":"活草鱼1尾（重约750克），盐6克，酱油25克，料酒15克，味精3克，胡椒粉2克，姜丝15克，葱丝15克，葱丝15克，葱段、姜块各适量，香油50克","p":["草鱼宰杀后净膛，去磷，去鳃，洗净，两面剞一字刀，将鱼入锅加葱段，姜块及水煮约15分钟，至熟捞出，装鱼盘。","鱼身上撒盐、味精、胡椒粉，加料酒，码葱丝、姜丝，倒酱油稍腌。","锅放香油烧热，浇在鱼身上即可。"]},{"i":201,"n":"油爆鲜贝（做法三）","r":"鲁菜","o":"鲁菜","f":"鲜贝滑嫩，配料鲜脆，汁芡浓紧，味美适口。","c":"热菜","m":["爆炒"],"g":["鲜贝","香菇","萝卜","鸡蛋"],"s":["盐","料酒","味精","葱","高汤","姜","淀粉"],"t":["炒锅"],"v":0,"a":"鲜贝250克，香菇20克，胡萝卜20克，青柿子椒20克，盐3克，蛋清1个，料酒10克，味精2克，清汤50克，葱末4克，姜末3克，清油500克（实耗约60克），水淀粉适量。","p":["将鲜贝加入盐，鸡蛋清，水淀粉，上浆，抓匀，配料洗净均匀切小丁。","碗中放入清汤、料酒、味精、水淀粉对成芡汁。","锅放油烧五成热，下入浆好的鲜贝，滑透捞出控油。锅留底油，投入葱、姜爆香，倒入配料、鲜贝翻炒，倒入芡汁，翻炒均匀即可。"]},{"i":202,"n":"麻花腰子","r":"鲁菜","o":"鲁菜","f":"菜品色泽鲜艳，形似麻花，软嫩鲜美，味香爽口。","c":"热菜","m":["爆炒"],"g":["猪腰","猪肉","鸡蛋"],"s":["淀粉","味精","盐","料酒"],"t":["炒锅"],"v":0,"a":"猪腰 250克，熟猪肥膘 175克，鸡蛋 1个，干淀粉 25克，味精 1克，精盐1克，绍酒 25克，熟猪油 500克（约耗75克）","p":["将腰子撕去皮，用刀剖成两片，批去腰臊，片成6厘米长，3厘米宽的薄片16片，将肥膘也片成同样的薄片，将两种片料浸鸡蛋清后，两面蘸上干淀粉，放在盘内待用。","将虾仁斩茸放入碗内，加入味精0.5克，绍酒5克和盐搅拌均匀，涂在肥膘上，将腰片盖上，用刀在腰片中部顺划三条4厘米长的口子（连肥膘划通），用手捏住一头，从中间长口内反穿过来成麻花形。","炒锅上火，放熟猪油，烧至五成热离火，将麻花腰逐个放入过油两分钟，炒锅去油再上火，倒入麻花腰，晃动炒锅，干煎1分钟，将绍酒20克，味精1/2克喷洒在麻花腰上，起锅装盘即可。"]},{"i":203,"n":"双烤肉","r":"鲁菜","o":"鲁菜","f":"皮色焦黄，味香不腻。","c":"热菜","m":["烤"],"g":["猪肉","鸡蛋","萝卜"],"s":["葱","淀粉","椒盐","甜面酱"],"t":["烤箱"],"v":0,"a":"带骨硬肋猪肉2.5公斤，鸡蛋清50克，葱白50克，萝卜条50克,湿淀粉200克，花椒盐10克，甜面酱25克。","p":["把肉用铁制的杵子叉起来，将肉皮在旺火上燎煳后，放进80℃热水中浸烫刮去煳皮。之后用开水煮至8成熟捞出，在肉上抹以蛋清糊(用蛋清和适量淀粉搅拌而成)，放入200℃烤箱内烤至红色，再翻烤30分钟取出，将煳皮刮去。","将烤好的瘦肉、肥肉、肉皮分别切成长6厘米宽12厘米的块，排骨剁成6厘米的段，分别摆在盘中。","葱白、花椒盐、萝卜条、甜面酱分装在小碟内，与烤肉一起上桌即成。用春饼、荷叶饼卷食。"]},{"i":204,"n":"大蹄扒海参","r":"鲁菜","o":"鲁菜","f":"色泽红亮，蹄质香烂，海参绵软可口。","c":"热菜","m":["烧扒焖"],"g":["海参","猪肉"],"s":["姜","料酒","酱油","盐","白糖","味精","葱","淀粉","高汤"],"t":["炒锅"],"v":0,"a":"水发海参750克，猪蹄2个,植物油800克(实耗约50克，熟大油100克，姜块、酱油各15克，料酒25，葱姜油、盐各20克，白糖50克，味精5克，葱段25克，糖色少许，湿淀粉适量，鸡汤1.5公斤。","p":["将猪蹄刮洗干净，在外侧划上一刀，用开水煮透，捞出控去水分后放入烧有7成热的植物油炒勺中，炸至金黄色，捞出沥油。海参洗净后用直刀一世两半待用。","炒勺将大油烧热煸炒葱、姜(拍松)，并烹入料酒和酱油加入味精、鸡汤和盐、糖色。把势放入炒勺内，再放上猪蹄，烧开1小时将猪蹄翻转过来，再用小火将猪蹄煨烂，放入盘中。将葱、姜拣出，取出垫，将海参放入勺中3分钟，用湿淀粉勾芡，淋入葱姜油即成。"]},{"i":205,"n":"椒盐肘子","r":"鲁菜","o":"鲁菜","f":"外酥里嫩，味香咸鲜。","c":"热菜","m":["蒸"],"g":["猪肉"],"s":["椒盐","料酒","酱油","花椒","八角","盐","白糖","高汤"],"t":["炒锅","蒸锅"],"v":0,"a":"猪肘子1个(约1.5公斤左右),植物油2公斤(实耗约50克)，料酒、酱油各15克，花椒、大料各5克，盐7克，花椒盐10克，糖少许，鸡汤2.5公斤。","p":["在开水锅中将猪肘子煮烫紧透后，捞出，用凉水泡上，把污毛刮洗干净。把糖色在皮上涂抹一层放在盆内。加进料酒、酱油、花椒、大料、盐，再上屉蒸约2小时，把肘子蒸烂取出，控去水分。","炒勺将植物油烧至8成热而后下入肘子，炸至皮酥脆时捞出沥油，切成一字条摆放在盘中。花椒盐装碟随肘子上桌。"]},{"i":206,"n":"雪梨肘棒","r":"鲁菜","o":"鲁菜","f":"味鲜香甜咸，肘棒不腻","c":"甜品","m":["烧扒焖"],"g":["梨","猪肉","鸭肉"],"s":["味精","白糖","盐","姜","料酒","葱"],"t":["炒锅"],"v":0,"a":"肘棒2个(1.5公斤左右)，雪鸭梨(梨也可)500克，植物油100克，味精5克，白糖50克，盐7克，姜片10克，料酒15克，葱段３根。","p":["将肘棒表皮的毛污刮净，露在肉外面的骨头砸断，然后用开水紧透，捞出洗净。把雪梨剥皮、挖核，切成瓣块后泡入凉水中。","用炒勺把植物油烧热，放入白糖(25克)、味精、盐、料酒，同时把肘棒也放入，汤烧开后把浮沫撇去，用小火炖2小时，肘棒烂时放入梨块再炖3分钟，然后将肘棒和梨一起盛于盘中。","用旺火将原勺中汤汁收浓，浇入肘棒梨块上即可。"]},{"i":207,"n":"烩银丝","r":"鲁菜","o":"鲁菜","f":"色白味鲜，肚丝软烂。","c":"汤羹","m":["烩汆"],"g":["猪大肠"],"s":["香油","姜","香菜","蒜","葱","淀粉","盐","高汤"],"t":["炒锅"],"v":0,"a":"料 散丹1公斤，大油50克，香油、毛姜水各10克，香菜末50克，蒜末25克，葱段50克，湿淀粉10克，盐6克，鸡汤750克","p":["用热淼针散丹烫一下捞出，把黑膜搓去后洗干净，放入开水锅中，加入葱、姜(拍松)、花椒煮至能用手掐断时捞出，切成丝。","炒勺上旺火，熟大油烧热，放入姜末、蒜末煸出香味，烹入料酒，加入毛姜水、盐、味精、鸡汤，同时把散丹丝也放入汤内，汤开后将浮沫撇去，用稀淀粉勾芡，淋入香油，撒上香菜末即可。"]},{"i":208,"n":"炒碧桃里脊","r":"鲁菜","o":"鲁菜","f":"里脊肉质松软，桃仁香脆可口。","c":"热菜","m":["爆炒"],"g":["猪肉","核桃仁","鸡蛋","青蒜"],"s":["味精","香油","姜","料酒","盐","淀粉","葱","高汤"],"t":["炒锅"],"v":0,"a":"里脊肉400克，桃仁200克，鸡蛋清50克，青蒜25克，植物油900克(实耗约80克)，香油10克，味精5克，姜末、料酒各15克，盐6克，湿淀粉60克，味精5克，姜末、料油各15克，葱花25克，盐6克，湿淀粉60克，鸡汤60克。","p":["将里脊肉切成长5厘米、宽2.5厘米的长片，用2克盐、适量淀粉和30克鸡汤搅匀而制成的蛋糊浆好。整个桃仁去皮切成4瓣，用浆好的每一肉片卷上加一瓣桃仁，卷成卷备用。另用25克湿淀粉、3克盐、葱花、味精、料酒和鸡汤对成汁。","炒勺内注入植物油，烧至6成熟，将肉卷逐个放入油中滑透，然后捞出沥油。","再将原勺留底油烧热后，放姜末稍炒一下，倒入滑好的肉，再将对好的汁烹入，翻炒几下撒入青蒜段，再淋入鸡油即成。"]},{"i":209,"n":"山东丸子","r":"鲁菜","o":"鲁菜","f":"汤清淡鲜香，丸子味美可口","c":"小吃","m":["蒸"],"g":["猪肉","鹿角菜","海米","鸡蛋"],"s":["葱","香油","姜","料酒","醋","盐","味精","香菜","酱油","高汤"],"t":["炒锅","蒸锅"],"v":0,"a":"猪肥瘦肉350克，鹿角菜350克，海米25克，鸡蛋50克，香油50克，葱、姜末各10克，料酒15克，米醋15克，盐7克，味精5克，酱油15克，香菜段、末各10克，鸡汤500克。","p":["用温水将鹿角菜泡开去根洗净。海米泡软剁成末","猪肉剁成放入盆内，加进盐、味精、酱油各3克，再加入鹿角菜末、香菜末、海米末和适量水。并将鸡蛋打入盆内，搅拌成馅，将馅挤成直径3厘米的丸子，放入盆中上屉蒸15分钟左右取出放入碗内。","炒勺放入鸡汤，加入盐、味精、酱油、米醋、料酒等，汤开后将浮沫撇去，淋入香油，将汤浇在丸子上，把香菜段撇上即可。"]},{"i":210,"n":"网油棒榻","r":"鲁菜","o":"鲁菜","f":"味鲜香可口，适于春季食用","c":"热菜","m":["煎塌"],"g":["猪肉","鸡蛋"],"s":["料酒","香油","味精","淀粉"],"t":["炒锅"],"v":0,"a":"猪肉末400克，鲜香棒100克，网油200克，鸡蛋清125克，植物油900克(实耗约80克)，香油15克，料酒15克，味精4克，湿淀粉100克，干淀粉25克。","p":["把香棒老梗择掉，洗净，切成末放入盆中，加25克鸡蛋清、2克盐、料酒、味精、20克淀淀粉、猪肉末、香油，充分搅拌成肉馅。用100克鸡蛋清、2克盐、100克湿淀粉一起放于碗内调成糊。","将网油辅平撒上干淀粉，放上肉馅，折成长15厘米、宽5厘米、厚1厘米的网油板。","炒勺将植物油烧至6成热，将网油板蘸上干淀粉，裹匀鸡蛋糊。放入油勺中炸至浮起，将勺离火浸一浸，然后继续炸至呈金黄色时捞出，沥油，剁成段即成。"]},{"i":211,"n":"锅榻腰盒","r":"鲁菜","o":"鲁菜","f":"色泽金黄，腰盒软嫩。","c":"热菜","m":["煎塌"],"g":["猪腰","猪肉","桂鱼","鸡蛋","面粉"],"s":["香菜","味精","盐","姜","料酒","葱","香油","高汤"],"t":["炒锅"],"v":0,"a":"猪肾200克，肥膘肉，桂鱼肉各150克，鸡蛋100克，香菜段15克。葱姜油80克，味精5克，盐6克，姜末5克，料酒、香油、葱末各10克，面粉少许，鸡汤60克。","p":["先把桂鱼肉剁成茸，加入5克料酒、1克盐、鸡蛋清和适量淀粉搅拌成鱼肉泥。肥肉切成薄圆片。把猪肾的肾臊先去掉，再切成圆薄片，撒上面粉抹上一层鱼肉泥，再贴上一片肥肉片制成“腰盒”。鸡蛋打入碗内拨散。","炒勺上旺火，把葱姜油烧至5成熟，将腰盒先蘸上面粉，再裹上鸡蛋液，下油勺把两面煎黄。然后加入葱、姜末，烹入料酒5克，再加入2克盐、味精和鸡汤，用小火把汤汁炖浓，淋入香油，撒上香菜段即成。"]},{"i":212,"n":"紫桂焖大排","r":"鲁菜","o":"鲁菜","f":"肉料味浓，食而不腻。","c":"热菜","m":["烧扒焖"],"g":["猪肉"],"s":["桂皮","盐","白糖","料酒","姜","葱","高汤"],"t":["炒锅"],"v":0,"a":"猪带骨外脊肉1.5公斤，紫肉桂5克，植物油900克(实耗约70克)，熟大油50克，盐8克，白糖5克，料酒15克，糖色烽冼，姜25克，葱50克，鸡汤1.2公斤。","p":["将外脊肉除去皮和肥膘，顶刀把肉切成130克的大片，筋用刀扦三刀并将肉拍松，随即肉片放入烧至成熟的植物油炒勺中，炸至金黄色时捞出，沥油。葱切段。姜切片。紫肉桂砸成碎快。","炒勺上旺火，将熟大油烧热后，把葱、姜煸出香味，放入紫肉桂稍加煸炒，烹入料酒，加入鸡汤、白糖、盐，再用糖色把汤调成浅红色，烧开后，将浮沫撇去，再放入炸好的外脊肉片，再烧开后改用微火40分钟，将肉再翻过来直至烂，拣去紫肉桂和葱姜，将肉夹入盘中。用旺火将勺内汤汁收浓，分别淋入湿淀粉和52克熟大油便成。"]},{"i":213,"n":"烩肥肠","r":"鲁菜","o":"鲁菜","f":"蒜香味浓，肥肠松软","c":"汤羹","m":["烩汆"],"g":["猪大肠","猪肉"],"s":["酱油","盐","味精","料酒","淀粉","香菜","高汤","蒜"],"t":["炒锅"],"v":0,"a":"猪熟肥肠500克，酱油6克，盐5克，葱姜油76克，味精5克，料酒15克。干淀粉75克，鸡汤1.5公斤，香菜末50克，蒜末20克。","p":["将肥肠斜刀切成片，用开水氽透后控去水分。","将葱姜油烧热把蒜末炸出味时，烹入料酒和酱油加入鸡汤、味精、盐，并将肥肠放入汤内用旺火把汤烧开，撇去浮沫，用调稀的湿淀粉勾成流芡，撒上香菜末即成。"]},{"i":214,"n":"炸肉骨碌烹","r":"鲁菜","o":"鲁菜","f":"外焦里嫩，肉味醇香","c":"热菜","m":["炸"],"g":["猪肉","青蒜"],"s":["葱","姜","蒜","醋","酱油","料酒","香油","盐","淀粉"],"t":["炒锅"],"v":0,"a":"五花肉750克，葱丝25克，姜丝20克，蒜片15克，青蒜段25克，植物油900克(实耗约100克)，酱油、醋各15克，料酒、香油各10克，盐6克，湿淀粉50克，干淀粉25克。","p":["先把五花肉刮洗净煮7成熟，捞出，皮朝上放在墩上，每隔0.6厘米深切一刀(深度为肉的一半)，再隔0.6厘米切下一大片，把世下的肉片平放在墩上，再从肉皮面隔0.6厘米深切一刀(深度同上)，隔0.6厘米再切下成为十字花刀的“肉骨棣(肉条)，用湿淀粉把肉骨棣资助好。","炒勺上旺火将植物油烧至7成熟时，把浆好的“肉骨碌”沾上干淀粉，散开十字花刀炸至金黄色时倒入漏勺沥油。原勺留底油倒入肉骨碌，烹入用葱丝、姜丝、姜片和青蒜段加鸡汤、盐、料酒、米醋和香油对好的汁，颠翻几下即成。"]},{"i":215,"n":"肝糕汤","r":"鲁菜","o":"鲁菜","f":"糕软嫩适口，营养丰富。","c":"甜品","m":["烩汆"],"g":["猪肉","鸡蛋"],"s":["高汤","姜","盐","料酒","葱","味精","香菜","胡椒"],"t":["炒锅","蒸锅"],"v":0,"a":"猪肝200克，鸡蛋清120克，熟大油25克，毛姜水10克，盐3克，料酒、葱丝、味精各5克，香菜弄清25克，胡椒粉1克，鸡汤500克。","p":["将猪肝剁成泥后，用250克鸡汤开过箩，加入鸡汤和鸡蛋清搅拌均匀，再加上1克盐、2克味精、料酒、毛姜水和胡椒粉搅拌后，盛入汤盘(盘底抹一层油)，上笼屉用小火蒸成肝糕，用小刀在盘中将糕划成1.5厘米长斜象眼块。","炒勺放入鸡汤250克、盐2克、味精3克、胡椒粉和葱丝，烧开后浇在肝糕上，撒上香菜末即可。"]},{"i":216,"n":"炒木樨肉","r":"鲁菜","o":"鲁菜","f":"色泽艳丽，味道鲜美，质在脆嫩，四时咸宜。","c":"热菜","m":["爆炒"],"g":["猪肉","鸡蛋","木耳","菠菜"],"s":["甜面酱","酱油","盐"],"t":["炒锅"],"v":0,"a":"猪肥瘦肉150克，鸡蛋150克，水发木耳50克，水发黄花50克，菠菜100克，熟大油50克，葱姜油50克，酱油30克，甜面酱15克，盐3克。","p":["将猪肉切成丝，木耳、黄花洗净泥沙、择净去根在开水中烫一下捞出。鸡蛋打入碗中搅散。","沙勺放入葱姜油烧至6成热。把鸡蛋倒入勺内炒熟取出。用原勺放入熟大油，烧至6成热倒入肉丝炒至6成熟时拨至勺边，放入甜面酱，炒熟后与肉丝再一起煸炒，然后加酱油炒匀，并加入炒好的鸡蛋再放入黄花、菠菜、木耳，颠翻几下即成。"]},{"i":217,"n":"栗子焖鸡","r":"鲁菜","o":"鲁菜","f":"","c":"热菜","m":["烧扒焖"],"g":["栗子","鸡肉"],"s":["姜","葱","蒜","白糖","料酒","胡椒"],"t":["炒锅"],"v":0,"a":"鸡一只 栗子３００克 姜、葱、蒜茸、糖、绍酒、胡椒粉各适量","p":["鸡洗净斩件，加生抽、胡椒粉、绍酒拌匀烧热油，爆香姜、葱、蒜，放鸡块炒至金黄，加栗子，溅少许绍酒、糖、加水焖至熟透。"]},{"i":218,"n":"东安鸡","r":"湘菜","o":"鲁菜","f":"","c":"热菜","m":["爆炒"],"g":["鸡肉"],"s":[],"t":["炒锅"],"v":0,"a":"净膛嫩母鸡1只（约750克）","p":["将鸡洗净，入开水锅中煮至断生捞出，晾凉后剔去鸡骨，切成4厘米长、1厘米宽的块。","葱、姜切丝。青柿椒切丝。干辣椒、蒜切末。","锅上火，放花生油，烧至五六成热，放入干辣椒末炸香，随即放入葱、姜、青椒丝、蒜末、花椒粉煸炒，再下鸡块一起翻炒，加料酒、味精、盐、米醋和鸡汤少许，盖上锅盖焖10分钟，收汁勾芡，淋上香油，出锅装盘即成。"]},{"i":219,"n":"炒豆腐脑","r":"鲁菜","o":"鲁菜","f":"","c":"热菜","m":["爆炒"],"g":["豆腐","海米","雪里蕻"],"s":[],"t":["炒锅"],"v":0,"a":"嫩豆腐500克，水发海米50克，咸雪里蕻25克","p":["雪里蕻洗净，挤干切末，海米切末，青蒜苗切段，嫩豆腐片去皮制成泥，油烧至6成热放葱姜末呛锅，再放入豆腐泥，海米，雪里蕻，精盐，料酒，炒3分钟装盘，撒上葱段即成。"]},{"i":220,"n":"焖大虾","r":"鲁菜","o":"鲁菜","f":"","c":"热菜","m":["烧扒焖"],"g":["虾"],"s":["葱","姜","白糖","高汤","料酒","香油"],"t":["炒锅"],"v":0,"a":"大对虾12只约750克，葱段10克，姜片10克，白糖50克，汤约100克，料酒、香油、花生油适量","p":["对虾洗净，去沙线、腿、须，葱段、姜片放入六成热油锅中炸，直至香味溢出，捞出葱和姜，下白糖、清汤、料酒和盐入锅，再放虾，大火烧开，小火煨至汤浓，淋香油上桌即成。"]},{"i":221,"n":"山东烧鸡","r":"鲁菜","o":"鲁菜","f":"","c":"热菜","m":["烧扒焖"],"g":["鸡肉","冬笋","海米"],"s":[],"t":["炒锅"],"v":0,"a":"珍珠笋350克，水发海米50克。","p":["珍珠笋顺身切成两半，焯水，用冷水控干，香油烧5成热时，炸姜末，烹料酒，放入海米、珍珠笋、高汤、精盐，颠炒装盘即成。"]},{"i":222,"n":"蜜汁梨球","r":"鲁菜","o":"鲁菜","f":"","c":"甜品","m":["炸"],"g":["梨"],"s":["蜂蜜","白糖"],"t":["炒锅"],"v":1,"a":"黄梨500克，蜂蜜100克，白糖200克。","p":["梨去皮去核，切成丝，加鸡蛋清、淀粉、面粉调匀，制成丸子，将梨丸放入5成热油锅中炸至金黄色捞出，沥油，炒糖色，加清水、白糖、梨球慢火收汁，浓稠时放入蜂蜜，浇明油装盘即成。"]},{"i":223,"n":"山东烧鸡（做法二）","r":"鲁菜","o":"鲁菜","f":"","c":"热菜","m":["烧扒焖"],"g":["鸡肉"],"s":["酱油","高汤","花椒","葱","姜","醋","香油","蒜"],"t":["蒸锅"],"v":0,"a":"小鸡一只，酱油1汤匙，油250克，花椒二汤，匙葱75克，姜3片，另备调味汁料：酱油2汤匙，醋1汤匙，麻油1汤匙，大蒜泥2汤匙","p":["(l)将鸡擦干水分后，用酱油腿泡半小时，时常翻动，以使酱油着色均匀。","用热油大火将鸡炸至咖啡色，放在碟上，撒上拍碎的葱、姜及花椒，上笼大火蒸40分钟左右，取出放冷(约l小时以上)。","剔除鸡骨，连皮切成长方块，排放在碟中。","将蒸鸡原汁2汤匙过滤后，加入所有调味汁料搅匀，淋在鸡上即可。"]},{"i":224,"n":"换心乌贼","r":"鲁菜","o":"鲁菜","f":"外形美观洁白，鲜香无比","c":"热菜","m":["蒸"],"g":["墨鱼","猪肉","虾","鱼肉"],"s":["葱","姜","酱油","盐","味精","料酒","淀粉"],"t":["蒸锅"],"v":0,"a":"乌贼，虾仁，里脊肉，肉皮冻，鱼肉，酱油，葱姜末，明油，盐，味精，料酒，湿淀粉","p":["乌贼去墨袋，软骨，入沸水中氽透，虾仁，里脊肉，肉皮冻切成0.3厘米的丁，加盐，酱油，味精，料酒，葱姜末调匀。","鱼肉制成茸加盐，料酒，味精调好味。","乌贼肚内放入调好的料，用鱼馅封口，上笼蒸熟后摆盘。","勺内加原汤勾芡淋明油浇在乌贼上。"]},{"i":225,"n":"油鹏自远方来","r":"鲁菜","o":"鲁菜","f":"肉肥味美，体色美观，脆香可口","c":"热菜","m":["炸"],"g":["菠菜"],"s":["盐","料酒","味精"],"t":["炒锅"],"v":1,"a":"油蚂蚱，菠菜叶，盐，料酒，味精","p":["将油蚂蚱从脑后取出草袋洗净，入开水锅内一焯捞出，加上盐，料酒，味精拌匀腌渍入味。","菠菜叶切成细丝。","入八成热油中炸酥捞出，摆在菠菜松上即成。"]},{"i":226,"n":"铁板蚝油栗子鸡","r":"鲁菜","o":"鲁菜","f":"色泽红润，微甜，蚝油味浓。","c":"热菜","m":["烧扒焖"],"g":["栗子","鸡肉"],"s":["蚝油","葱","姜","酱油","料酒","白糖","味精"],"t":["炒锅","铁板"],"v":0,"a":"净鸡，去壳栗子，蚝油，酱油，葱，姜，料酒，白糖，味精等。","p":["把鸡剁成4厘米见方的块，用酱油腌渍入味后过热油。","熟栗子炸成黄色捞出与鸡块一同放入锅内加糖，酱油，蚝油，料酒，用小扒至酥烂，汤剰1/4时用淀粉，勾芡，淋香油倒入烧热的铁板上即成。"]},{"i":227,"n":"牡丹蝎托","r":"鲁菜","o":"鲁菜","f":"造型美观，风味独特。","c":"热菜","m":["炸"],"g":["面粉","山楂","鸡蛋","萝卜"],"s":["盐","味精","淀粉","姜","葱"],"t":["炒锅"],"v":1,"a":"蝎子，面包，山楂糕，鸡蛋，心里，美萝卜，盐，味精，干淀粉，茶叶，姜，葱。","p":["茶叶用开水泡透，待凉后将蝎子放入泡30分钟，取出沥净水后再放入姜，葱，盐，味精入味，将山楂糕放在面包片上，抹上蛋泡糊，再放上入味的蝎子。","油五成熟时，放入蝎托炸至酥透，即可。"]},{"i":228,"n":"黄焖甲鱼","r":"鲁菜","o":"鲁菜","f":"清鲜香醇，营养丰富，即是美味菜肴，又是滋补上品","c":"热菜","m":["烧扒焖"],"g":["甲鱼","鸡肉"],"s":["料酒","葱","姜","味精","酱油","香油"],"t":["炒锅"],"v":0,"a":"甲鱼，肥母鸡，花椒油，绍酒，葱，姜，八用，酱油，味精，麻油。","p":["将甲鱼，鸡分别宰杀洗净，一起放入锅内，加水及葱，姜，八角，旺火烧沸后，改用小火煨熟捞出，拆肉剔骨，将肉切成条；炒锅烧热下花椒油，姜葱丝炒呈黄色，放入酱油，原汤，绍酒，味精，然后把甲鱼肉和鸡肉一起放入锅内，焖烧六七分钟，淋上麻油少许即成。"]},{"i":229,"n":"奶汤银肺","r":"鲁菜","o":"鲁菜","f":"色白肺嫩，鲜美异常","c":"汤羹","m":["烩汆"],"g":["猪肺","口蘑","冬笋","白菜"],"s":["高汤","盐","葱","花椒","料酒","姜","淀粉"],"t":["炒锅","蒸锅"],"v":0,"a":"猪肺，奶汤，清汤，精盐，葱椒料酒，葱段，姜片，口蘑片，冬笋片，白菜心，水淀粉","p":["将猪肺从肺管处灌入清水，待胀起后平放案上使血水自行流尽，如此几遍后用刀划破肺身，使水流尽呈白色，然后用清水煮七成熟，捞出择洗干净掰成枣大的块，放入沸水中煮五分钟，捞出滗净水放入大碗内，炒锅内放葱油烧热，加入奶汤，清汤，精盐，葱椒料酒，葱段，姜片烧沸，倒入银肺碗内，入笼蒸一小时待用，炒锅内放葱油烧热下入奶汤，清汤，精盐，姜汁，味精，口蘑片，冬笋片，白菜心浇沸，盛入汤碗；将银肺从笼内取出，去掉葱姜，滗去汤不用，倒入锅内，加入葱椒料酒，水淀粉勾芡，倒入汤碗内放上火腿片即成。"]},{"i":230,"n":"泰山赤嶙鱼","r":"鲁菜·泰安","o":"鲁菜","f":"鱼肉细嫩，汤汁鲜美清口，无鱼腥味。","c":"热菜","m":["爆炒"],"g":["赤鳞鱼"],"s":["盐","姜","花椒","料酒","醋","味精","酱油","胡椒","高汤"],"t":["炒锅"],"v":0,"a":"活赤鳞鱼，精盐，姜末，花椒，绍酒，酱油，醋，味精，清汤，胡椒粉","p":["将鱼剖腹去内脏洗净，放入开水锅中氽熟，捞出放在大汤碗内，撒上胡椒粉，炒锅上火，加清汤，盐，酱油，花椒，绍酒，味精烧开，撇净浮沫，倒入鱼碗内，醋加姜末拌和入碟上桌佐食。"]},{"i":231,"n":"清汤鲍鱼","r":"鲁菜","o":"鲁菜","f":"味鲜汤清，鲍鱼嫩软。","c":"汤羹","m":["烩汆"],"g":["鲍鱼","火腿","口蘑","豌豆","鸡肉"],"s":["高汤","盐","料酒","味精"],"t":["炒锅"],"v":0,"a":"罐头鲍鱼半桶，熟火腿15克，筒鲜蘑15克，豌豆苗15克。盐10克，料酒15克，味精3克，鸡清汤800克。","p":["将鲍鱼用刀切成斜片。鲜蘑切薄片。熟火腿切成小象眼片。豌豆苗留嫩叶、去根、洗净。","将鸡清汤300克倒入炒勺用旺火烧开，将熟火腿片、鲜蘑片、鲍鱼片和豌豆苗下勺煮透捞出，倒入10个汤碗中，勺中汤如不要可倒掉。","将余下的鸡清汤500克入勺上火，并加进盐、味精、料酒调好味，撇去浮沫，盛入10个小汤碗中即成。"]},{"i":232,"n":"胡芦桔翅","r":"鲁菜","o":"鲁菜","f":"","c":"热菜","m":["蒸"],"g":["鱼翅","鸡肉","猪肉","海米","鸡蛋"],"s":[],"t":["炒锅","蒸锅"],"v":0,"a":"水发鱼翅500克,母鸡脯肉250克,猪肥肉膘50克,水发大金钩海米40克,鸡蛋清3个","p":["鸡脯肉与肥肉膘制泥，加蛋清、高汤搅匀成鸡料子，水发鱼翅洗净，加高汤、葱段、姜片、花椒蒸2小时取出。","将大平盘上抹油，把鸡料子在盘内制成12个葫芦形状，海米安在葫芦顶端，蒸10分钟取出。","炒勺内放入花椒油，三套汤、调料及鸡料子制成的葫芦，慢火烧5分钟后捞出装碗，再将鱼翅放勺内烧开，勾芡，盛入盘中央，葫芦摆四周即成。"]},{"i":233,"n":"九转大肠（做法二）","r":"鲁菜·济南","o":"鲁菜","f":"色泽红润，质地软嫩，兼有酸、甜、香、辣、咸五味，鲜香味美，异常适口。","c":"热菜","m":["烧扒焖"],"g":["猪大肠","猪肉"],"s":["料酒","酱油","白糖","醋","香菜","胡椒","桂皮","葱","蒜","姜","盐","高汤"],"t":["炒锅"],"v":0,"a":"猪大肠3条（重约75O克），绍酒10克，酱油25克，白糖100克，醋54克，香菜未1．5克，胡椒面、肉桂面、砂仁面各少许，葱未、蒜未各5克，姜未2．5克，熟猪油500克（约耗75克），花椒油15克，清汤、精盐各适量。","p":["将猪大肠洗净，用50克醋和少许盐里外涂抹揉搓，除去粘液污物，漂洗后放入开水锅中，加葱、姜、酒焖烧熟，捞出切成3厘米长的段，再放入沸水锅中焯过，捞出沥水。","炒锅上中火，倒入猪油烧至七成热，下大肠炸至呈红色时捞出。锅内留油25克，放入葱、姜、蒜未炸出香味，烹醋，加酱油、白糖、清汤、精盐、绍酒，迅速放入肠段炒和，移至微火上，烧至汤汁收紧对，放胡椒面、肉桂面、砂仁面，淋上花椒油，颠翻均匀，盛入盘内，撒上香菜未即成。"]},{"i":234,"n":"油爆双脆","r":"鲁菜","o":"鲁菜","f":"脆嫩滑润，清鲜爽口。","c":"热菜","m":["爆炒"],"g":["猪肚","鸡肉"],"s":["料酒","盐","葱","姜","蒜","味精","淀粉","高汤"],"t":["炒锅"],"v":0,"a":"猪肚头20O克，鸡胗150克，绍酒5克，精盐1．4克、葱未2克，姜未1克，蒜未1．5克，味精1克，熟猪油500克（约耗50克），湿淀粉25克，清汤50克。","p":["将肚头剥去脂皮、硬筋，洗净，用刀划上网状花刀，放入碗内，加盐、湿淀粉拌和，鸡胗洗净，批去内外筋皮，用刀划上间隔2毫米的十字花刀，放入另一只碗内，加盐、湿淀粉拌和。","另取一只小碗，加清汤、绍酒、味精、精盐、湿淀粉，拌匀成芡汁待用。","炒锅上旺火，放入猪油，烧至八成热，放入肚头、鸡胗，用筷子迅速划散，倒入漏勺沥油。炒锅内留油少许，下葱、姜、蒜未煸出香味，随即倒入鸡胗和肚头，并下芡汁，颠翻两下，即可出锅装盘。"]},{"i":235,"n":"沙锅炖吊子","r":"鲁菜","o":"鲁菜","f":"汤鲜香，味醇厚。","c":"热菜","m":["炖煨"],"g":["猪肚","猪肺","猪大肠","豆腐","冬笋","口蘑","海米"],"s":["盐","味精","香油","料酒","葱","姜","香菜","蒜","醋","八角","酱油","胡椒","桂皮","高汤"],"t":["炒锅","砂锅"],"v":0,"a":"熟猪肚400克，熟猪肺、肝、心、肥肠各200克，油豆腐100克，水玉兰片、水口蘑、水海米各20克。熟大油50克，香油10克，盐、味精各5克，料酒、葱、姜丝各15克，香菜段15克，葱段、蒜瓣、姜块各15克，酱油25克，米醋50克，桂皮、大料、胡椒粉各少许，奶汤1.8公斤。","p":["熟猪心、肝、肺均切成大薄片，肥肠切成小段，玉兰片、口蘑均切成小片。","把熟大油放入炒勺内烧至5成热时，将葱段、蒜瓣、姜块(拍松)投入煸出香味，后放汤，再把油豆腐放入，随之再将盐、味精、奶汤、米醋、酱油和胡椒粉以及桂皮、大料等放入，调好味。汤开后倒入沙锅，用文火炖30分钟，然后将葱、姜拣出，撒上葱、姜丝、香菜段，淋入香油即成。"]},{"i":236,"n":"炸佛手通脊","r":"鲁菜","o":"鲁菜","f":"造型美观，鲜香酥脆，别具一格。","c":"热菜","m":["炸"],"g":["猪肉","鸡蛋","生菜","面粉"],"s":["味精","盐","料酒","酱油","淀粉"],"t":["炒锅"],"v":0,"a":"猪通脊肉750克，鸡蛋150克，生菜叶150克，细面包渣200克,植物油800克(实耗约100克)，味精、盐各5克，料酒、辣酱油各10 克，干淀粉50克。","p":["将通脊肉斜刀切成7厘米长的5个梯形段，再把每段一分为二切成10片(每片约重75克)。然后顺着肉片宽边切4刀(如手指缝)，窄边不切，用料酒、味精、盐、毛姜水稍腌。将肉片蘸上干淀粉，刷上用鸡蛋打散搅拌而成的鸡蛋液两面沾上面包渣拍牢，照此再反复一次，将中间3条肉向下变成“佛手伏”。","炒勺将植物油烧至7成热，把佛手肉卷置于漏勺内放入油中炸挺，这时将勺离火浸一浸，待肉卷在油内漂起，继续加热炸至金黄色，捞出沥油。将佛手肉卷顺切成两块，摆在盘中(码成原形)，浇上辣酱油，用洗净的生菜围边即成"]},{"i":237,"n":"炸金钩棒","r":"鲁菜","o":"鲁菜","f":"色金黄，外酥脆，形状美，味鲜美。","c":"热菜","m":["炸"],"g":["海米","猪肉","荸荠","火腿","面粉","鸡蛋","生菜"],"s":["料酒","盐","香油","味精","淀粉","葱","姜","高汤"],"t":["炒锅"],"v":0,"a":"猪通脊肉500克，水海米50克，罐头南荠25克，熟金华火腿25克，面包渣 150克，面粉50克，鸡蛋3个，生菜250克。植物油900克(实耗约75克)，香油、料酒各15克，盐7克，味精4克，湿淀粉10克，葱段、姜片各15克，鸡汤60克。","p":["把葱、姜、火腿肉、海米和南荠都切成末。鸡蛋打入碗中拨散。炒勺上旺火，放入植物油50克烧热，将葱、姜煸出香味后，再将海米、南荠、火腿末放入煸炒，烹入料酒和鸡汤，加入味精和盐。汤烧开后用湿淀粉勾芡。炒熟淋入香油，取出晾凉制成馅分成10分。","把通脊肉用刀切成连刀片每片50克，并将肉片拍松软，撇上少许盐腌一下，在每片肉上放1分馅，卷成长卷，滚上面粉，刷上蛋浆，沾牢面包渣制成“金钩棒”","将金钩棒放入烧至7成热的油中炸成金黄色，将勺离火稍浸一下后继续炸熟透，捞出沥油装盘。再把洗净的生菜围在盘边即成。"]},{"i":238,"n":"爆两样","r":"鲁菜","o":"鲁菜","f":"鲜咸微酸，软嫩适口。","c":"热菜","m":["爆炒"],"g":["猪大肠","猪肉","黄瓜","萝卜","木耳","鸡蛋"],"s":["酱油","醋","料酒","葱","姜","蒜","盐","味精","淀粉","香油"],"t":["炒锅"],"v":0,"a":"熟猪肠１００克，猪肝１００克，黄瓜片３０克，胡萝卜片３０克，水发木耳１０克，油１００克，酱油２５克，醋１５克，料酒２０克，葱、姜、蒜片各２克，盐２克，味精５克，鸡蛋液３５克，水淀粉５０克，香油５克。","p":["肠斜切段。猪肝切片，用水淀粉、鸡蛋液挂糊。","碗中放酱油、醋、料酒、盐、味精、葱、姜、蒜、水淀粉对成汁。","锅放油烧六成热，将猪肝滑散，盛出。锅留底油，倒入猪肝，熟肠、黄瓜片、胡萝卜片、木耳炒匀，烹入味汁，颠炒，淋香油即可。"]},{"i":239,"n":"京酱肉丝","r":"京菜","o":"鲁菜","f":"咸香略甜，菜色枣红。","c":"热菜","m":["爆炒"],"g":["猪肉","鸡蛋"],"s":["葱","甜面酱","料酒","味精","姜","盐","淀粉","白糖"],"t":["炒锅"],"v":0,"a":"猪瘦肉２５０克，葱白２５０克，甜面酱８０克，料酒、味精、盐、姜片、淀粉各适量，白糖２０克，鸡蛋１个，清油１５０克。","p":["肉洗净切细丝，加入料酒、盐、鸡蛋液、淀粉上浆。","葱少许切片，其余切细丝，码在盘中。姜片略拍松，连同２克葱偏放碗内，加少量清水制成葱姜水。","锅上火，放油烧热，倒入肉丝滑散至八成熟捞出控油。锅留底油，加入甜面酱略炒，加葱姜水、味精、白糖翻炒，待白糖炒化、酱汁变粘时放入肉丝，翻炒之酱均匀裹在肉丝上即可出勺。"]},{"i":240,"n":"古老肉","r":"粤菜","o":"鲁菜","f":"菜色粉红，酸甜咸香，焦脆适口。","c":"热菜","m":["炸"],"g":["猪肉","西红柿","面粉"],"s":["酱油","醋","盐","料酒","白糖","葱","姜","淀粉"],"t":["炒锅"],"v":0,"a":"肥瘦猪肉２００克，番茄酱３０克，清油７５０克（实耗约１００克），酱油５克，醋２５克，盐６克，料酒２５克，白糖５０克，葱米、姜米各２克，水淀粉７５克，面粉５０克，项油５克。","p":["肉洗净切条，加淀粉、面粉、香油上浆。","碗中放酱油、醋、盐、料酒、葱、姜、番茄酱、水淀粉对汁调匀。","锅放油烧成五成热，下入肉条，文火滑透，再改用大火炸至焦脆捞出。","锅留底油，倒入芡汁，炒熟，放入炸好的肉条，颠炒，淋香油，出烧即成。"]},{"i":241,"n":"四喜丸子（做法二）","r":"鲁菜","o":"鲁菜","f":"菜色金黄，鲜咸酥嫩，芡汁清亮，味道适口。","c":"热菜","m":["烧扒焖"],"g":["猪肉","冬笋","虾","海参","鸡蛋","面粉"],"s":["酱油","料酒","盐","味精","葱","姜","香油","八角","高汤"],"t":["炒锅","蒸锅"],"v":0,"a":"猪肉馅４００克，肉丁１００克，虾仁、笋丁、海参丁各３０克，清油７５０克（实耗约１００克），酱油２５克，面酱２０克，料酒１５克，盐３克，味精５克，葱米、姜米各２克，香油５克，鸡蛋液１５０克，面粉５０克，葱段、姜片、大料各３克，汤５００克。","p":["肉馅及肉丁、虾仁、笋丁、海参丁同放一起，加入酱油、面酱、料酒、盐、味精、葱米、香油拌匀，做成大丸子。鸡蛋液加面粉和成糊。","锅放油烧五成热，丸子挂蛋粉糊，入锅炸硬，捞出。","将丸子放容器中，加入酱油、汤、盐、葱段、姜片、大料上锅蒸约２０分钟，捡出葱段、姜片、大料，滗出原汤入锅烧开，加水淀粉勾芡，浇在丸子上即可。"]},{"i":242,"n":"干炸丸子","r":"鲁菜","o":"鲁菜","f":"外焦里嫩,干香适口.","c":"小吃","m":["炸"],"g":["猪肉","鸡蛋"],"s":["黄酱","酱油","葱","姜","淀粉","盐","料酒","花椒"],"t":["炒锅"],"v":0,"a":"肥瘦猪肉末250克,黄酱少许,酱油1克,葱末,姜末各2克,鸡蛋1个,水淀粉100克,盐2克,料酒10克,清油500克(实耗约50克),花椒适量.","p":["猪肉末加入葱姜末,料酒,鸡蛋液,盐,酱油,黄酱,水淀粉搅拌均匀.花椒稍炒擀末,制成椒盐.","锅放油烧六成热,将肉馅挤成个头均匀的小丸子,入锅炸至金黄色捞出.用勺将丸子拍松,再入锅炸,反复炸几次,至焦脆捞出装盘,上桌时,随带椒盐味碟供蘸食."]},{"i":243,"n":"菠萝古老肉","r":"粤菜","o":"鲁菜","f":"色泽美观,红绿相间,口味甜酸,肥而不腻.","c":"热菜","m":["炸"],"g":["猪肉","面粉","西红柿","鸡蛋"],"s":["淀粉","醋","白糖","盐","姜"],"t":["炒锅"],"v":0,"a":"肥猪肉300克,菠萝150克,面粉30克,淀粉50克,泡打粉4克,油菜叶150克,番茄酱25克,白醋40克,白糖50克,油50克,盐3克,姜汁少许,鸡蛋黄1个.","p":["将肥肉切成1.5厘米见方的丁.菠萝切滚刀块.将面粉,干淀粉,泡打粉掺在一起加入鸡蛋黄,少量水,放肉丁抓匀.","油菜叶切细丝,用热油炸干制成菜松.起锅放油,烧至五六成热时将挂糊肥肉丁炸焦捞出装盘.","锅留底油,加入番茄酱稍炒,在加入姜汁,白醋,白糖,盐,水调匀,用水淀粉勾芡,下入菠萝,淋明油出锅与古老肉同盘,菜松围边即可."]},{"i":244,"n":"锅塌菠菜","r":"鲁菜","o":"鲁菜","f":"色泽金黄，香鲜脆嫩，引入食欲。","c":"热菜","m":["煎塌"],"g":["菠菜","鸡蛋","香菇","火腿"],"s":["淀粉","盐","葱","姜","高汤"],"t":["炒锅"],"v":0,"a":"菠菜200克。 鸡蛋黄25克、香菇25克、火腿25克。淀粉50克、精盐5克、葱15克、姜10克、清汤、150克、花生油50克。","p":["菜削去根部，去掉老皮及前梢，齐刀切成长6厘米的段，入开水中略焯，迅速捞出。","蛋黄放入汤盘中打散，再放入湿淀粉、精盐搅匀成蛋黄糊。将菠菜整齐地放入盘内，使其沾满蛋黄糊，香菇与火腿均切成细丝。","放花生油烧至四成热（约100℃），放入葱姜丝稍炸，然后整齐地推入挂糊的菠菜，用微火蹋煎，至金黄色时翻个个，蹋煎两面至金黄色。再放入清汤、精盐、加盖蹋煎1分钟，待汤汁将尽时出锅。撒上火腿，冬菇丝即成。"]},{"i":245,"n":"全家福","r":"鲁菜","o":"鲁菜","f":"多料多味，是喜庆宴席的一道大菜。","c":"热菜","m":["爆炒"],"g":["海参","鱿鱼","虾","香菇","猪肉"],"s":["料酒","姜","白糖","味精","葱","盐","淀粉","高汤","香油"],"t":["炒锅"],"v":0,"a":"水法海参５０克，水发鱿鱼５０克，虾仁５０克，香菇５０克，猪肉馅５０克，将油１５克，料酒１０克，姜１０克，白糖４克，味精２克，盐、葱、水淀粉、高汤、油、香油各适量。","p":["海参净膛，切抹刀片。鱿鱼两面剞麦穗刀。虾仁上浆挂糊。猪肉馅加入淀粉、盐、味精搅拌均匀后，炸成小丸子。","海参、鱿鱼用开水焯透。虾仁用温油滑散捞出控油。","锅留底油放葱、姜煸炒出香味，放料酒、酱油、白糖、盐、味精、汤，下入海参、鱿鱼、丸子、虾仁翻炒，投入香菇颠炒，水淀粉勾芡，淋香油即可。装盘时亦可将各种原料分别码放。"]},{"i":246,"n":"芫爆墨鱼","r":"鲁菜","o":"鲁菜","f":"色泽脆黄，鲜咸香脆，清淡爽口。","c":"热菜","m":["爆炒"],"g":["墨鱼"],"s":["香菜","料酒","盐","味精","葱","姜","蒜","醋","香油"],"t":["炒锅"],"v":0,"a":"鲜墨鱼４００克，香菜１５０克，清油５０克，料酒３０克，盐２克，味精５克，葱丝、姜丝、蒜片各２克，香油１０克，醋适量。","p":["鲜墨鱼收拾干净两面剞麦穗刀。香菜切段。","墨鱼用开水焯起卷。碗中放料酒、醋、盐、味精、葱、姜、蒜对成汁。","锅放油烧至七成热，访墨鱼、香菜翻炒，烹入芡汁，颠炒，淋香油即可。"]},{"i":247,"n":"芫爆鱿鱼卷","r":"鲁菜","o":"鲁菜","f":"咸鲜微酸，脆嫩利口。","c":"热菜","m":["爆炒"],"g":["鱿鱼"],"s":["香菜","料酒","醋","盐","味精","葱","姜","蒜","香油"],"t":["炒锅"],"v":0,"a":"水法鱿鱼４００克，香菜梗１５０克，清油１０００克（实耗约１００克），料酒３０克，醋２０克，盐２克，味精５克，葱丝、姜丝、蒜片各２克，香油１０颗。","p":["鱿鱼去头、去内膜和明刺，剞麦穗花刀，切菱形片。香菜切断。","鱿鱼片用开水焯起卷。","锅上火放油，烧至六七成热，投入鱿鱼卷稍滑油后捞出，控油。锅留底油，放葱姜蒜爆香，放入鱿鱼卷、香菜，加料酒、醋、盐、味精点钞。出锅前淋香油即可。"]},{"i":248,"n":"金丝海蟹","r":"鲁菜","o":"鲁菜","f":"色泽美观，鲜香适口，风味独特。","c":"热菜","m":["烧扒焖"],"g":["螃蟹","鸡蛋"],"s":["葱","姜","料酒","淀粉","胡椒","醋","香油","味精","盐"],"t":["炒锅"],"v":0,"a":"海蟹１０００克，鸡蛋１００克，葱丝、姜丝各１０克，姜末５克，料酒１０克，干淀粉２５克，胡椒粉４克，醋５０克，香油４克，味精３克，清油１０００克（实耗约７５克），盐４颗。","p":["将海蟹去壳，清洗干净，用刀改成一只蟹爪带一块蟹肉的形状，加葱姜丝、料酒、味精、胡椒粉、盐拌匀稍腌，加入干淀粉抓匀。碗中放姜末、香油、醋对成姜醋汁。鸡蛋磕入碗内搅匀。","锅放油烧五成热，将蛋液呈细线状缓慢倒入油锅内，边倒边用筷子在锅内转动，待锅中蛋丝浮起变色时捞出控油。","锅上火放清油烧六成热，将拍上干粉的海蟹块投入锅炸至浅黄色捞出码盘，中间放蛋松，上桌时随带姜醋汁味碟即可。"]},{"i":249,"n":"炸烹虾段","r":"鲁菜","o":"鲁菜","f":"色泽金黄，鲜嫩味美。","c":"热菜","m":["炸"],"g":["虾","鸡蛋","面粉"],"s":["葱","姜","蒜","料酒","醋","味精","淀粉","香油","盐","高汤"],"t":["炒锅"],"v":0,"a":"净虾500克，葱丝、姜丝各2克，蒜片2克，油750克（实耗约100克），料酒25克，醋20克，味精2克，蛋清适量，水淀粉30克，面粉少许，香油10克，盐、高汤各适量。","p":["虾剪去须、爪，去净沙线后，改刀为虾段，加蛋清、水淀粉、面粉上浆挂糊。","碗中放料酒、醋、盐、味精、葱、姜、蒜、高汤兑成汁。","锅放油烧六成热，下入虾段，炸至金黄色捞出。","锅留底油，虾段入锅，烹入芡汁，颠炒，淋香油即可。"]},{"i":250,"n":"扒栗子白菜","r":"鲁菜","o":"鲁菜","f":"鲜咸软烂，有栗子的香甜味。","c":"热菜","m":["烧扒焖"],"g":["栗子","白菜"],"s":["葱","姜","料酒","白糖","酱油","盐","味精","淀粉","香油","高汤"],"t":["蒸锅"],"v":1,"a":"白菜心４００克，栗子罐头一听（或生栗子２５０克），清油４０克，葱末、姜末各２克，料酒２０克，酱油５克，白糖５克，盐２克，味精５克，水淀粉３５克，香油５克，高汤适量。","p":["白菜心顺刀切长条。罐头栗子用开水焯。如果用生栗子，切口煮熟，去皮，再切两半。","白菜用蒸锅蒸软，或用开水焯软后，理顺码放盘中。","锅放油烧温热，放葱姜末爆香，烹料酒，加酱油、盐、高汤、白糖、味精，放栗子、白糖，转微火稍煮，勾水淀粉，翻勺，淋香油既成。"]},{"i":251,"n":"泰山赤鳞鱼","r":"鲁菜·泰安","o":"鲁菜","f":"鱼肉细嫩，汤汁鲜美清口，无鱼腥味。","c":"热菜","m":["爆炒"],"g":["赤鳞鱼"],"s":["盐","姜","花椒","料酒","酱油","醋","味精","胡椒","高汤"],"t":["炒锅"],"v":0,"a":"活赤鳞鱼750克，精盐、姜未、花椒、绍酒、酱油各10克，醋100克，味精1克，清汤1000克，胡椒粉0．5克。","p":["将鱼剖腹去内脏，洗净，放入开水锅中汆熟，捞出放在大汤碗内，撒上胡椒粉。","炒锅上火，加清汤、盐、酱油、花椒、绍酒、味精，烧开，撇净浮沫，倒入鱼碗内。醋加姜未拌和入碟上桌佐食。"]},{"i":252,"n":"泰安三美豆腐","r":"鲁菜·泰安","o":"鲁菜","f":"汤汁乳白而鲜，豆腐软滑，白菜鲜嫩，清淡爽口。","c":"热菜","m":["烧扒焖"],"g":["豆腐","白菜"],"s":["高汤","盐","味精","葱","姜"],"t":["炒锅","蒸锅"],"v":1,"a":"泰安豆腐150克，白菜心100克，鲜汤500克，精盐4克，味精、葱未、姜未各：克，鸡油5克，熟猪油20克。","p":["将豆腐上笼或放入锅里隔水蒸约10分钟，取出沥水，切成3．5厘米长、2.5厘米宽、1．5厘米厚的片，白菜心用手撕成5厘米长的小条块，分别放入沸水锅中烫过。","炒锅放猪油，烧至五成热，下葱、姜未炸出香味，放入鲜汤、盐、豆腐、白菜烧滚，撇去浮沫，加味精、淋鸡油即成。"]},{"i":253,"n":"海米珍珠笋","r":"鲁菜","o":"鲁菜","f":"","c":"凉菜","m":["炸"],"g":["海米","冬笋"],"s":[],"t":["炒锅"],"v":0,"a":"珍珠笋350克；水发海米50克。","p":["珍珠笋顺身切成两半，焯水，用冷水控干","香油烧5成热时，炸姜末，烹料酒，放入海米、珍珠笋、高汤、精盐，颠炒装盘即成。"]},{"i":254,"n":"干炸赤鳞鱼","r":"鲁菜","o":"鲁菜","f":"鱼体呈弓形，颜色淡黄，外焦酥、里鲜嫩，蘸以花椒盐佐食，风味尤佳。","c":"热菜","m":["炸"],"g":["赤鳞鱼","面粉"],"s":["葱","花椒","料酒","盐","椒盐"],"t":["炒锅"],"v":0,"a":"主料：活赤鳞鱼16条（重约250克）。｜调料：葱椒绍酒20克，花椒16粒，精盐3克， 面粉750克。花椒盐5克，花生油750克（约耗75克）。","p":["用利刀将鱼腹剖开，取出内脏，冲洗干净，放入盛器内加花椒、精盐、葱椒绍酒拌匀，腌渍10分钟取出，沾匀一薄层干细面粉。","炒锅内放入花生油，中火烧至七成热时，将鱼投入改微火炸至淡黄色捞出。吃时蘸花椒盐。"]},{"i":255,"n":"锅鳎鱼盒","r":"鲁菜","o":"鲁菜","f":"成菜馥郁鲜嫩，软滑滋润，金黄多汁，食之回味无穷","c":"热菜","m":["烧扒焖"],"g":["鱼肉","偏口鱼","猪肉","鸡蛋"],"s":["葱","姜","淀粉","料酒","高汤","盐","香菜","香油"],"t":["炒锅"],"v":0,"a":"主料：偏口鱼肉200克。 ｜配料：猪肉泥100克。｜调料：葱姜末8克，干淀粉30克，鸡蛋黄3个，清汤75克，绍酒3克，精盐5克，香菜段5克，芝麻油2克，花生油75克。","p":["偏口鱼肉洗净，片成长2.5厘米、宽1.5厘米的片。猪肉泥加精盐（4克）、芝麻油（1克）搅成馅。在两片鱼肉片中间夹上肉馅，制成盒形。鸡蛋黄加干淀粉搅匀成蛋黄糊，备用。","炒锅内加入花生油（50克），在中火上烧至五成热时，将鱼盒沾匀蛋黄糊下锅，煎至两面呈金黄色时，倒出控净油。","炒锅加花生油25克，中火烧至五、六成热时，用葱、姜末爆锅，加入绍酒一烹，再加入清汤、精盐（1克），将鱼盒倒入锅内以旺火烧开，再用小火煨至嫩熟，汁稠浓将尽时，撒上香菜段，淋上芝麻油，推入盘内即成。"]},{"i":256,"n":"孔府一品锅","r":"鲁菜·孔府","o":"鲁菜","f":"食物多样，用料珍贵，汤汁鲜美，白菜清口。","c":"热菜","m":["蒸"],"g":["海参","鱼肚","鸡肉","鸭肉","鱿鱼","冬笋","鸡蛋","山药","粉丝粉皮","白菜","豌豆"],"s":["盐","料酒","高汤"],"t":["炒锅","蒸锅","砂锅"],"v":0,"a":"水发海参50克，水发鱼肚150克，白煮时子500克，白煮母鸡1 只（重约500克），白煮鸭二只（重约750克），水发鱿鱼卷10个（重约150克），水发玉兰片25 克，鸡蛋荷包10个，白煮山药段500克，水发龙须粉250克，蒸好的白菜墩150克，豌豆苗3根，精盐40克，绍酒150克，纯鸡汤1500克。","p":["海参片成抹刀片。鱼肚片成长5厘米、宽2厘米、厚0．3厘米的片。玉兰片片成长5厘米、宽2厘米、厚0.2厘米的片。豌豆苗放入开水中烫过捞出，用冷水过凉。鱿鱼卷用鸡汤汆过备用。","取“一品锅”一只，将龙须粉、白菜墩、白煮山药放入锅内垫底，将白煮时子、白煮鸡、白煮鸭分别摆在上面，再将海参、鱼肚、鱿鱼卷、玉兰片、鸡蛋荷包在各料间隔处摆成一定的图案，加入鸡汤、绍酒、精盐，用旺火蒸2小时左右取出，搭上豌豆苗上席即可。注意：鸡、鸭宰杀后清水洗净，要放入开水锅中略焯，去除血水。海参、鱼肚、鱿鱼均必须发透至软。要用鸡汤蒸制，以保持汤汁浓鲜。"]},{"i":257,"n":"八仙过海闹罗汉","r":"鲁菜","o":"鲁菜","f":"原料多样，汤汁浓鲜，色泽美观，形如八仙与罗汉。","c":"热菜","m":["蒸"],"g":["鸡肉","猪肉","鱼翅","海参","鲍鱼","鱼肉","鱼肚","虾","火腿","冬笋","白菜"],"s":["料酒","盐","姜","高汤","味精"],"t":["蒸锅"],"v":0,"a":"鸡脯肉300 克，水发鱼翅、海参、鲍鱼、鱼骨（明骨）、鱼肚、活青虾、火腿各100克，芦笋50克，白鱼肉250克，绍酒50克，鸡汤、精盐、姜片、味精各适量，青菜叶、熟猪油各少许。","p":["取鸡脯肉15Q克斩成鸡泥，用其中一部分镶在碗底上，做成罗汉钱状。白鱼肉切成条，用刀划开夹入鱼骨。其余鸡脯肉切成长条。活青虾做成虾环。将鱼翅与剩下的鸡泥做成菊花鱼翅形。海参做成蝴蝶形。鲍鱼切成片。鱼肚切成片。芦笋发好后选取八根。","将上述食物用精盐、味精、绍酒调好口味，上笼蒸熟取出，分别放入磁罐，摆成八方，中间放罗汉鸡，上面撒火腿片、姜片及余好的青菜叶，将烧开的鸡汤和少许熟猪油浇上即成。关键:海参、鱼翅、鲍鱼、鱼骨均必须浸透发软，洗净沙子。用鸡肉制成罗汉钱状的形象要均匀、完整。宜用鸡汤烹制。"]},{"i":258,"n":"一卵孵双凤（西瓜鸡）","r":"鲁菜","o":"鲁菜","f":"鸡肉酥烂，汤清味鲜，香味浓郁。","c":"热菜","m":["蒸"],"g":["鸡肉","香菇","冬笋","口蘑","干贝"],"s":["盐","料酒"],"t":["蒸锅"],"v":0,"a":"西瓜1个（重约3500克～4000克），雏鸡2只（共重1000克左右），冬菇、盐笋、口蘑各25克，干贝50克，精盐2．5克，绍酒3克。","p":["西瓜用清水洗净，洁布揩干，切去上盖（留用），将瓜体表面刮去1/4的瓜皮，挖出3/4的瓜瓤。","雏鸡宰杀治净，用刀背砸断剔除大骨和腿骨，剁去嘴、爪，盘好放入瓜壳内。将干贝加酒蒸酥，也放入瓜内。","将冬菇、盐笋、口蘑切成薄片，放入瓜内，加入调好的精盐和绍酒，盖上瓜盖，并用竹签别上，放在大瓷盆中，上笼蒸约50分钟，至瓜酥烂取出。把西瓜轻轻放在银汤盘中，再将蒸过的原汤倒在汤盘内即成关键:","雏鸡必须选用培育2个月左右的仔母鸡。将鸡宰杀后，先人开水锅中略焯，清水洗净，去除血水污物。","西瓜要圆而大，","掌握好火候，不要蒸得过烂。也可以先将其它配料煮熟，再倒入西瓜内，这样只需蒸30分钟即可。"]},{"i":259,"n":"诗礼银杏","r":"鲁菜","o":"鲁菜","f":"色泽洁白，白果肉酥，鲜甜入味。","c":"甜品","m":["爆炒"],"g":["白果"],"s":["白糖","蜂蜜","桂花酱"],"t":["炒锅"],"v":1,"a":"白果750克，白糖250克，蜂蜜、猪油各50克，桂花酱2．5克。","p":["将白果去壳，用碱水稍泡去皮，再放沸水锅中稍焯，以去苦味，再入锅煮酥取出。","炒锅烧热，下猪油35克，加白糖，炒至呈银红色时，放清水100克、白糖、蜂蜜、桂花酱，倒入白果，焯至汁浓，淋上白猪油15克，盛入浅汤盘中即成。关键:白果必须去除外衣、煮酥。烹制时，用火焯至卤汁稠浓，勿使粘锅、发焦。"]},{"i":260,"n":"带子上朝","r":"鲁菜","o":"鲁菜","f":"色泽深红，肉质鲜香，汁浓味厚，酥烂可口。","c":"热菜","m":["烧扒焖"],"g":["鸭肉"],"s":["葱","姜","盐","酱油","料酒","桂皮","花椒","淀粉","白糖","高汤"],"t":["炒锅","砂锅"],"v":0,"a":"鸭子1只（重1500克左右），野鸭（或鸽子）1只，葱、姜、鸡油各10克，精盐2克，酱油50克，绍酒75克，桂皮0.5克，花椒、淀粉各少许，白糖25克，清汤250克，花生油1500克（约耗100克）。","p":["将鸭子、野鸭（或鸽子）分别宰杀，煺毛洗净，从脊背切开，挖去五脏，洗净，鸭子去嘴留舌，野鸭（或鸽子）去嘴，用酱油、绍酒（两味共75克）腌渍3Q分钟。葱切成段。姜、花椒、桂皮包成香料包。","炒锅上火，加入花生油，烧至八成热，分别放入鸭子、野鸭（或鸽子），炸呈枣红色时捞出。","沙锅中放入锅垫，再放上鸭子、野鸭（或鸽子）、香料包、葱段、精盐、酱油、绍酒、清汤（150克），用旺火烧开5分钟，改用慢火偎炖至熟，取出放盘中，鸭子在前，野鸭（或鸽子）在鸭子怀里。","炒锅上火，加花生油（25克）烧热，放白糖炒汁，烹入清汤（50克），再加煮鸭原汤汁100克，烧开后用湿淀汤勾芡，淋上鸡油，浇在鸭鸽上即成。关键:鸭子要洗净，否则有异味，炸后用小火煨酥。卤汁要浓而宽。"]},{"i":261,"n":"雪里藏珠","r":"鲁菜","o":"鲁菜","f":"外包“雪衣”，内藏“珍珠”，味美甜酸，蛋质软嫩","c":"热菜","m":["爆炒"],"g":["鸡蛋","面粉"],"s":["盐","白糖","淀粉","葱","蒜","醋","味精","高汤"],"t":["炒锅"],"v":1,"a":"主料： 鲜鸡蛋10个，鸡蛋清150克。｜调料： 熟大油500克(实耗约50克)，盐3克，白糖100克，湿淀粉15克，面粉10克，葱、蒜各3克，米醋25克，味精5克，鸡汤100克。","p":["将鸽蛋放锅内加入凉水煮熟后，去壳。鸡蛋清打起泡沫，加入面粉搅匀，制成“雪衣糊”。鸡汤加入盐、味精、白糖和湿淀粉对成汁待用。","炒勺上火，把大油烧至4成热时，将裹上一层面粉并滚上雪衣糊的鸽蛋放入油中炸成浅黄色时捞出，沥油后装盘。","炒勺回到旺火上，放入熟大油50克，烧至6成热时投入葱、蒜末、煸炒出香味，随即烹入米醋，并将对好的汁倒入勺内，将汁收浓后，浇在炸好的鸽蛋上即可。"]},{"i":262,"n":"担担鸡","r":"鲁菜","o":"鲁菜","f":"摆形似鸡，美观别致，鸡片香嫩，丸子酥香。","c":"热菜","m":["炸"],"g":["鸡肉","猪肉","冬笋","辣椒","鸡蛋","面粉"],"s":["料酒","姜","葱","味精","盐","淀粉","高汤"],"t":["炒锅"],"v":0,"a":"主料： 鸡胸脯肉600克，鸡膀1对，鸡头1个，笋鸡腿2个，猪肉末200克，净冬笋青、红椒各25克，鸡蛋清50克，面包150克。｜调料： 植物油900克(实耗约100克)，料酒、姜末各15克，葱末25克，味精8克，盐7克，湿淀粉100克，鸡汤50克。","p":["用50克鸡汤、2克盐、3克味精、5克料酒和适量湿淀粉对成汁。冬笋青、红椒切成片。面包切成长1.2厘米，宽、厚各6厘米的长方形块。将鸡胸脯肉400克去皮筋后切成片，用鸡蛋清、盐2.5克、料酒5克加适量湿淀粉搅拌均匀并浆好备用。将余量鸡胸脯肉去皮筋后，剁成茸放盆内，加入葱、姜末、味精、盐各2.5克、料酒5克、猪催末和适量湿淀粉拌匀做成馅。","炒勺上旺火，把植物油烧至6成热，分别把浆好的肉片以及冬笋、青、红椒放入油内滑透，捞出沥油。待油烧至7成热，把用肉馅挤成的丸子放入，炸透后捞出沥油。再将面包炸成金黄色，捞出放在盘内，用15厘米长的竹扦两头各插上一个丸子，担放于面包托上。","炒勺留底油，烧热后将鸡片、青、红椒片、青笋征均投入勺中，把对好的汁也倒入勺内，颠翻几下，盛在面包托前。面包托两边摆上热油炸透的鸡头、笋鸡和鸡膀，码成鸡形即可。"]},{"i":263,"n":"锅鳎银鱼","r":"鲁菜","o":"鲁菜","f":"色金黄，味鲜美，鱼软嫩。","c":"热菜","m":["爆炒"],"g":["银鱼","鸡蛋"],"s":["葱","料酒","姜","香油","醋","味精","盐","高汤"],"t":["炒锅"],"v":0,"a":"主料： 银鱼250克，鸡蛋250克。｜调料： 植物油120克，葱末15克，香油。料酒、姜末各10克，米醋、味精各5克，盐3克，鸡汤50克。","p":["把鸡蛋打入碗内搅匀，加入葱、姜末、料酒、味精、盐和银鱼(洗净，晾干)，拌匀。","平锅上火，把裹上鸡蛋液的银鱼放入烧至8成熟的植物油中煎，使两面黄后，移入炒勺加热鸡汤，用微火煨到汤浓干时，淋入米醋，香油即可。"]},{"i":264,"n":"鸭泥腐片","r":"鲁菜","o":"鲁菜","f":"","c":"热菜","m":["爆炒"],"g":["鸭肉","猪肉"],"s":["盐","味精","料酒","高汤"],"t":["炒锅"],"v":0,"a":"主料： 熟鸭肉50克，油皮2张。｜调料： 精盐2.5克，味精2克，绍酒5克，鸡油10克，鸡鸭汤1000克，豆苗数棵。","p":["熟鸭肉切成细末，放在一个碗内备用。油皮用手撕碎，用清水泡上。姜去皮切成极细的细末，用水泡上，取用其汁。","把炒勺放旺火上，放入高汤，加精盐、味精、绍酒、姜汁、鸭末，把泡油皮的水滗出，也放入勺内，撇去浮沫，尝好味，放入鸡油，倒入汤碗内，放上豆苗即成。"]},{"i":265,"n":"炒里脊丝","r":"鲁菜","o":"鲁菜300种","f":"：色白滑嫩，略有汤汁，适口不腻。","c":"热菜","m":["爆炒"],"g":["猪肉","蒲菜","冬笋","青蒜","鸡蛋"],"s":["盐","料酒","淀粉","葱","姜","高汤"],"t":["炒锅"],"v":0,"a":"主料：猪里脊肉（或担丈肉）200克｜配料：蒲菜30克冬笋30克蒜苗50克｜调料：精盐3克料酒10克鸡蛋清1个湿淀粉30克清汤200克葱姜丝3克白油500克（约耗50克）","p":["将里脊肉片成薄片，切成长7厘米、粗2毫米的丝，放入碗内，加精盐、鸡蛋清、湿淀粉抓匀养好待用；蒲菜与冬笋均切长4厘米的细丝，用沸水焯过；蒜苗粗的一劈两半，切成长4厘米的段。","炒勺内放入白油，中火烧至五成热，将里脊丝下入油内，用铁筷子拨散，滑至发白时捞出。炒勺内留底油，放入葱姜丝，炸出香味，放入蒲菜、冬笋、里脊丝、清汤、料酒、精盐搅炒，然后放入蒜苗，味精颠翻搅匀，出锅盛入汤盘内。"]},{"i":266,"n":"芜爆里脊丝","r":"鲁菜","o":"鲁菜300种","f":"“莞爆”是以荒要作为配料而得名的一种传统烹调方法，里脊丝经芜爆后，肉嫩清爽不腻，具有荒要所特有的一种清香味。注：本菜所用","c":"热菜","m":["爆炒"],"g":["猪肉"],"s":["香菜","盐","料酒","味精","葱","姜","胡椒","高汤"],"t":["炒锅"],"v":0,"a":"主料：猪里脊肉200克｜配料：香菜50克｜调料：精盐2克料酒5克味精1克葱姜丝5克1清汤150克胡椒粉少许花生油15克","p":["1。将猪里脊肉先切成厚2毫米的片，再切成长6厘米、粗2毫米的丝。香菜择去老叶和根洗净，切成长3厘米的段。","炒勺内放入清水烧沸，肉丝放入沸水内稍烫捞出。3。炒勺内放入花生油，烧热，烹入葱姜丝炸出香味，倒入清汤、料酒、精盐，烧沸撤沫，再把烫过的里脊丝、香菜、胡椒粉、味精放入，颠翻均匀即可出锅。"]},{"i":267,"n":"滑里脊","r":"鲁菜","o":"鲁菜300种","f":"里脊肉软嫩滑润，汁浓味香。","c":"热菜","m":["爆炒"],"g":["猪肉","冬笋","香菇","鸡蛋"],"s":["盐","料酒","味精","淀粉","葱","高汤","姜"],"t":["炒锅"],"v":0,"a":"主料：猪里脊肉150克｜配料：水发玉兰片30克水发冬菇20克青莱心30克｜调料：精盐2克料酒10克味精1克鸡蛋清1个清汤200克湿淀粉30克葱末3克姜末2克白油500克（约耗40克）.","p":["1、将里脊肉切成长6厘米、宽2厘米、厚2毫米的2片，放入碗内加精盐、蛋清、湿淀粉抓匀；玉兰片切成与肉同样大小的片，冬菇片成薄片，青莱心洗净切成长4厘米的段，均用沸水焯过。","2：炒勺内放入白油，在旺火烧至五成热时，下入里脊片，用铁筷子拨散，至九成热时倒在漏勺里；炒勺内留底油20克，放入葱姜炸出香味后，倒入玉兰片、冬菇、青菜心、里脊片；加入清汤、精盐、料酒，烧沸后用湿淀粉勾芡，再加入味精，盛入汤盘内。"]},{"i":268,"n":"干炸里脊","r":"鲁菜","o":"鲁菜300种","f":"外酥里嫩，味道咸香。3","c":"热菜","m":["炸"],"g":["猪肉","鸡蛋"],"s":["淀粉","盐","料酒","酱油","花椒","葱","甜面酱"],"t":["炒锅"],"v":0,"a":"主料：猪里脊肉200克｜调料：鸡蛋清2个湿淀粉100克精盐2克酱油10克料酒10克花椒面3克大葱白100克甜面酱50克花生油1000克（约耗60克）","p":["1。将里脊肉两面均用刀交叉制过，再切成一厘米厚的片，用精盐、酱油、料酒腌溃好。鸡蛋清与湿淀粉揽：匀成糊。","炒勺内放入花生油，烧至五成热时，将肉逻片沾满蛋糊，下入油内炸透捞出。待油烧至九成热时，再将肉重入油内略炸，呈老黄色时捞出，装入盘内，撒上花椒面，上时外带大葱白，甜面酱一小碟佐食。"]},{"i":269,"n":"清炸里脊","r":"鲁菜","o":"鲁菜300种","f":"此菜经调味腌制后入油炸而成，外皮层略脆，内里鲜嫩，咸香可口，实为佐酒佳肴。","c":"热菜","m":["炸"],"g":["猪肉"],"s":["盐","酱油","料酒"],"t":["炒锅"],"v":0,"a":"主料：猪里脊肉250克｜调料：精盐4克酱油10克料酒5克花生油500克（约耗50克）","p":["1.将猪里脊肉奇上蓑衣花刀，再顺切成1厘米见方的尊条，放入碗内加酱油、料酒、精盐渍匀。","2。","炒勺坐在旺火上，倒入花生油，烧至七成热时，移至小火上，将里脊肉下入勺内，炸至八成熟时捞出。","待油温升至九成热时，再将里脊肉投入油内一“促”，呈深红色捞出，装入盘内即成。","上桌时外带花椒盐一小碟佐食。"]},{"i":270,"n":"五香肉干","r":"鲁菜","o":"鲁菜300种","f":"肉干色泽红润，食之韧而干香。","c":"热菜","m":["爆炒"],"g":["猪肉"],"s":["酱油","料酒","白糖","高汤","葱","姜","香油"],"t":["炒锅","蒸锅"],"v":0,"a":"主料：猪元宝心瘦肉500克｜调料：酱油40克料酒20克白糖50克清汤400克·五香粉2克葱片10克姜片5克香油50克：花生油1000克（约耗40克）","p":["1。将猪元宝心瘦肉洗净，横着（顶丝）肉纹切成长6厘米、宽3厘米、厚3毫米的片，加酱油溃匀。2。炒勺内放入花生油，在旺火上烧至八成热时，将溃的肉片下入油内炸，炸至发红时捞出，沥净油，放入碗内加入酱油、清汤、葱姜片入笼蒸八成熟时取出，去掉葱姜片。","炒勺内放入香油，白糖，在小火上加热，使白糖炒5至鸡血红色时，将蒸过的肉连汤倒入炒勺内，再加清汤，酱油，料酒煨煤，至汤汁去三分之二时，再淋上香油，料酒颠翻搅匀，待汤汁均匀地挂在肉片上时，撒上五香粉出锅。"]},{"i":271,"n":"晾干肉片","r":"鲁菜","o":"鲁菜300种","f":"色泽紫红油亮，软韧醇香，甜咸适中，其味浓厚，是冷菜中常用的碟料。","c":"热菜","m":["爆炒"],"g":["猪肉"],"s":["葱","姜","甜面酱","白糖","料酒","盐","高汤"],"t":["炒锅"],"v":0,"a":"主料：猪瘦肉500克｜调料：葱段10克姜片5克甜面酱50克白糖100克料酒25克精盐2.5克清汤100克花生油500克（约耗50克）","p":["1，将瘦肉片切成4厘米大的薄片，用温水洗净晾干。","（用时再洗净洁布振干）。","2。","炒勺内倒入花生油，烧至六成热时，肉片下入油内炸至八成熟时捞出。","3：炒勺内留少许油烧热，放入白糖炒成红色时，放入葱姜和甜面酱炒出香味，再加入清汤、料酒、肉片、精盐移至小火上爆改，待肉片呈紫红色，汁尽时出勺即成。"]},{"i":272,"n":"爆炒肉片","r":"鲁菜","o":"鲁菜300种","f":"肉片软嫩滑润，汁红亮，经热油烹醋，其香味四溢，诱人食欲。","c":"热菜","m":["爆炒"],"g":["猪肉","木耳","冬笋","白菜","鸡蛋"],"s":["盐","酱油","高汤","淀粉","醋","葱","姜","蒜"],"t":["炒锅"],"v":0,"a":"主料：猪嫩瘦肉200克6｜配料：木耳20克冬笋25克青菜心50克｜调料：精盐1.5克酱油10克清汤50克鸡蛋清1个湿淀粉30克醋15克葱姜蒜末，花生油750克（约耗50克）","p":["1.将瘦肉切成长4厘米，宽2厘米，厚2毫米的片，放入碗内，加精盐、鸡蛋清、湿淀粉抓匀。","清汤、酱油、湿淀粉放在一个碗内对成芡汁。","冬笋切成长3厘米，宽1.5厘米，厚2毫米的片，青菜心切成段与木耳用沸水焯过。","2。","炒勺内放入花生油，在中火烧至五成热时，放入肉片，用铁筷子拨散，滑至八成熟时捞出；炒勺内留底油，放入葱姜蒜末，炸出香味时，迅速烹入醋，随之放入菜心、冬笋、木耳、肉片颠炒一下，把对好的芡汁淋入，颠翻均匀，盛入盘内。"]},{"i":273,"n":"火爆燎肉","r":"鲁菜·济南","o":"鲁菜300种","f":"肉片香嫩味美，略带燎糊的味道，色泽紫红，是佐酒佳肴，为济南传统名菜。","c":"热菜","m":["爆炒"],"g":["猪肉"],"s":["酱油","甜面酱","料酒","葱","姜","蒜","香油"],"t":["炒锅"],"v":0,"a":"主料：猪臀尖肉400克｜调料：酱油50克甜面酱40克·料酒20克葱10克姜5克蒜5克香油50克花生油150克","p":["1。","将猪臀尖肉洗净，切长5厘米、宽3厘米、厚2毫米的片，放入碗内。","葱姜均切成丝，蒜切片，与酱油、料72。","炒勺内放入花生油，用旺火烧至十成热时，立即将溃好的肉片倾入（此时火苗沿勺边直上，引烧勺里的油，火苗高达2尺多)，用手勺急速拨动肉片，同时颠翻炒勺，使肉片在火势熊熊的沸油中半燎半炒，约1分钟左右，盛入盘内，上餐桌时外带大葱，甜面酱。"]},{"i":274,"n":"酱爆肉丁","r":"鲁菜","o":"鲁菜300种","f":"此菜肉丁柔软滑润，色泽红亮，有浓郁的酱香味。注：“飞”甜面酱时要掌握好火候，过老购色黑味苦，过嫩则有生酱味。一二","c":"热菜","m":["爆炒"],"g":["猪肉","冬笋","蒲菜","荸荠","白菜","鸡蛋"],"s":["盐","甜面酱","酱油","料酒","高汤","淀粉","葱","姜"],"t":["炒锅"],"v":0,"a":"主料：猪肥瘦肉200克｜配料：冬笋20克蒲菜（或马蹄）50克青菜心50克｜调料：精盐1克酱油15克甜面酱40克料酒10克清汤100克鸡蛋清2个湿淀粉40克葱姜片5克1克花椒油10克花生油1000克（耗50克）","p":["·1。","将肉切成长2厘米见方的丁，加入精盐、鸡蛋清，湿淀粉抓匀；冬笋、蒲菜、青菜心均切与肉丁同样大小的丁片，一起用沸水焯过。","2。","炒勺内放入花生油，烧五成热时，放入肉丁，用铁筷子拨散，滑至七成熟时，倒在漏勺内。","炒勺内留油30克，放入葱姜片，炸出香味，加甜面酱“飞”熟，再加酱油、肉丁、冬笋、蒲菜、青菜心、清汤、料酒，用手勺快速搅动颠妙，随即用湿淀粉勾芡，淋上花椒浊出锅。","8。"]},{"i":275,"n":"炝腰穗","r":"鲁菜","o":"鲁菜300种","f":"腰花脆嫩，清凉爽口，佐酒佳肴。","c":"凉菜","m":[],"g":["猪腰","荸荠","木耳","冬笋"],"s":["料酒","味精","盐","姜","高汤","酱油"],"t":["炒锅"],"v":0,"a":"主料：猪腰子250克｜配料：南荠20克木耳15克冬笋15克｜调料：料酒15克味精1克：精盐1克姜丝1克清汤100克酱油2.5克花椒油15克","p":["1。猪腰子洗净，撕去外表脂皮，从中片成两半，片去腰，在片开的一面韵麦穗花刀，切成4块（大腰子也可切6决），放入冷水内泡去血污，捞出控净水，再用沸水悼过。2，南荠削去皮切片，木耳洗净撕成片，冬笋切象眼片，均用沸水焯过。、：","将清汤、料酒、味精、精盐、姜丝、酱油、花椒油都放在一个碗内对成汁（行业内称炝汁），将以上焊过的配料先装入盘内，腰穗整齐地摆在配料上，把炝汁浇在盘内菜上。"]},{"i":276,"n":"软炸腰穗","r":"鲁菜","o":"鲁菜300种","f":"此菜色深红，形似麦穗，：经适量清汁烹后，腰穗外层微有回软，而腰里嫩，味鲜爽口。","c":"热菜","m":["炸"],"g":["猪腰"],"s":["盐","酱油","高汤","料酒","味精","淀粉"],"t":["炒锅"],"v":0,"a":"主料：猪腰子500克：｜调料：精盐2克酱油15克清汤50克料酒15克味精1克湿淀粉40克花生油1000克（约耗50克10克）.10","p":["1。将猪腰子撕去外层脂皮，用刀从中片成两半，片去腰臊，在片开的一面麦穗花刀，再切成长5厘米，宽3厘米的块，放入碗内；加精盐、料酒、酱油腌渍好，再加入湿淀粉拌匀。酱油、清汤、料酒、味精放一个碗内对成汁。，","炒勺内放入花生油，在旺火上烧至七成热时，将渍好的腰块下入油内，炸至八成熟时捞出。待油温继续升至九成热时，再将猪腰块重投入油内一“促”，随即潍净油，烹入对好的汁，迅速颠翻均匀，盛入盘内。"]},{"i":277,"n":"炸肝尖","r":"鲁菜","o":"鲁菜300种","f":"经制后的肝尖色泽枣红，鲜嫩滑润，口味酸中带咸。","c":"热菜","m":["炸"],"g":["猪肉","冬笋","木耳","荸荠","白菜"],"s":["盐","醋","料酒","淀粉","酱油","葱","姜","蒜"],"t":["炒锅"],"v":0,"a":"主料：鲜猪肝250克｜配料：玉兰片25克木耳15克南荠15克青菜心20克｜调料：精盐1克醋50克料酒100克酱油15克湿淀粉30克葱姜蒜末5克花生油1000克（约耗50克半），","p":["1，猪肝切成长4厘米，宽2厘米，.厚3毫米的片，胆湿淀粉，精盐抓匀；南荠切片，青菜心切成长3厘米的段，玉兰片切成长3厘米的象眼片，与木耳均用沸水炼过清汤，酱油，湿淀粉，料酒放入一个碗内对成汁待用“2。","炒勺内放入花生油，中火烧至七成热时，：将猪肝逐片下入油内炸，至呈红色漂起在油面上时捞出；原炒勺内留:11少鼠油，放入葱姜蒜末，炸出香味时，烹上醋，随即将配料和炸好的猪肝倒入颠炒，再倒入对好的汁颠翻，使其与汁混合均匀，盛入盘内。"]},{"i":278,"n":"糖醋排骨","r":"鲁菜","o":"鲁菜300种","f":"此菜经糖醋爆制后，色泽红亮，味道甜酸适中，略有酱瓜的香味，宜作拼制冷盘，是佐酒佳肴。12","c":"热菜","m":["爆炒"],"g":["猪肉"],"s":["白糖","醋","高汤","酱油","葱","姜","香油"],"t":["炒锅","蒸锅"],"v":0,"a":"主料：猪排骨肉400克｜配料：酱瓜10克｜调料：白糖100克醋50克清汤400克酱油30克葱丝10克姜丝5克香油40克花生油1000克（约耗50克）","p":["1．先将猪排骨逐根拉开用砍刀剁成长3厘米的段，放入锅内用沸水煮透捞出，用清水洗净，酱瓜切成长3厘米的薄条片。","2。","炒勺内放入花生油，旺火烧至八成热时，·放入排骨段，炸至呈红色时捞在大碗内，加清汤（漫过排骨），入笼蒸五成熟时取出。","3。","炒勺内放入香油25克和白糖半两，用小火炒至鸡血红色时，烹入葱姜丝，醋、酱油、白糖，将蒸过的排臀段连汤倒入，用小火煨至汤汁将尽时，放入酱瓜；香油，颠翻均匀即成。"]},{"i":279,"n":"靠排骨","r":"鲁菜","o":"鲁菜300种","f":"色泽深红光亮，口味甜、咸、香。","c":"热菜","m":["爆炒"],"g":["猪肉"],"s":["白糖","葱","花椒","高汤","酱油","醋","料酒","姜"],"t":["炒锅"],"v":0,"a":"主料：猪排骨500克｜调料：白糖100克半葱椒泥5克清汤250克酱油30克醋30克料酒25克葱姜丝各5克花生油1000克（约耗100克）","p":["：1。将猪排骨逐根拉开，剞成3厘米长的段，用酱油、料酒各15克拌匀腌溃匀。","炒勺内放入花生油，在旺火上烧至八成热时，放入排骨，炸至淡黄色捞出。","炒勺内留底油加白糖炒至红色时，放入葱姜丝稍煸，随即烹入醋和料酒，白糖、清汤、排骨拌炒，移在小火上，待汤汁将要快干时，加入葱椒泥拌匀即成。"]},{"i":280,"n":"奶汤核桃肉","r":"鲁菜","o":"鲁菜300种","f":"肉似核桃形，质地嫩滑，奶汤色白味鲜。，","c":"汤羹","m":["烩汆"],"g":["核桃仁","猪肉","香菇","冬笋","白菜","火腿","鸡蛋"],"s":["高汤","盐","葱","花椒","料酒","淀粉","姜"],"t":["炒锅","蒸锅"],"v":0,"a":"主料：猪臀尖肉200克｜配料：香菇10克玉兰片20克菜心30克火腿10克｜调料：精盐3克奶汤500克葱椒料酒10克鸡蛋清2个湿淀粉50克姜汁5克葱段30克葱油20克13","p":["将猪臀尖肉，片成厚2厘米的大片，在两面每隔5毫米交叉划上直刀纹（深度为厚度的一半），切成3厘米见方的块，放入碗内用鸡蛋清，湿淀粉抓匀。火腿、菜心、·玉兰片均切成长4厘米，宽2厘米，厚2毫米的片，香菇斜刀切成大片。除火腿外均用沸水分别焯过。","锅内放清水1000克，旺火烧沸，将肉块下入沸水内烧沸后，捞在大碗内，加入奶汤、精盐、葱片、姜汁上笼蒸熟，取出津去汤汁，去掉葱，扣入汤盘内。3，炒勺内放入葱油，烧至八成热，倒入奶汤、菜心，玉兰片、香菇，加入精盐、姜汁、葱椒料酒烧沸撇去浮沫，浇在肉上，再把火腿片摆在汤面上。"]},{"i":281,"n":"萝卜肉","r":"鲁菜","o":"鲁菜300种","f":"色泽金黄，外焦里嫩，形状好似小萝卜而故名。.","c":"热菜","m":["炸"],"g":["萝卜","猪肉","面粉","白菜","鸡蛋","火腿"],"s":["盐","料酒","味精","葱","姜","胡椒"],"t":["炒锅"],"v":0,"a":"主料：猪里脊肉200克猪肥瘦肉100克·｜配料：面包末200克香菜心12个｜调料：精盐3克，料酒10克味精1克鸡蛋2个葱姜末5克胡椒面少许火腿30克花生油500克（约耗50克）","p":["将里脊肉片成长6厘米、宽5屋米的薄片，共12片，肥瘦肉剁成细泥，加葱姜末、鸡蛋清、料酒、精盐、胡椒面、味精搅匀成馅；火腿切如火柴梗见方的细条12根；．2：将片好的里脊片按以上面积要求裁去不整齐的边后，铺平在板上，将肉馅均匀地抹在肉片上，，卷成一头粗，14另一头略细的象小红萝卜形的卷共12个，外皮沾上一层蛋黄液，再滚一层面包末，在粗头中间上插根火腿条。","炒勺内放入花生油，在中火烧至五成热时，肉卷下入油内炸；不断翻动，·炸至内里熟透，外皮将呈现金黄色时捞出，拔下粗头上的火腿条，换插上香菜心(表示萝卜缨)，摆在盘内即成。"]},{"i":282,"n":"扒肘子","r":"鲁菜","o":"鲁菜300种","f":"肘肉软烂味香，色泽红润，油光发亮。16二二","c":"热菜","m":["烧扒焖"],"g":["猪肉"],"s":["酱油","白糖","高汤","淀粉","葱","姜","八角","料酒"],"t":["炒锅","蒸锅"],"v":0,"a":"主料：猪前肘肉（带皮去骨）1000克｜调料：酱油100克白糖30克清汤300克湿淀粉30克葱20克姜10克八角一粒糖色5克料酒30克葱油20克花生油1000克（耗50克）","p":["用铁筷子将肘肉叉起架在火上，将带皮的一面烧糊一层后，放入70℃热的水内泡透，用小刀刮去糊皮，洗净，放水锅内煮至五成熟捞出，将不整齐地边裁去，在肉的里面每隔3厘米上“十”字花刀，深至肉皮（皮不要割断）为止。皮面涂上糖色。2。炒勺内放入花生油，烧七成热时，将肉皮面朝下入油内炸，至皮面呈红色起小泡时捞出，放入大碗内，加上葱姜、八角。","炒勺内放入少量油，白糖炒成红色后加清汤、酱油、料酒烧沸撒沫，将汤浇在肘肉碗内，上笼蒸烂取出，剔去葱姜八角，汁津在炒勺内，肘肉扣在汤盘中。．、","炒勺内另加清汤，酱油料酒，烧沸撇沫，用湿淀粉勾芡，.淋上葱油浇在肉上。"]},{"i":283,"n":"盐水肘子","r":"鲁菜","o":"鲁菜300种","f":"肘肉熟烂不腻，汤汁冷凝后晶盈透明，清凉爽口。","c":"凉菜","m":["蒸"],"g":["猪肉"],"s":["盐","料酒","葱","姜","花椒","高汤"],"t":["炒锅","蒸锅"],"v":0,"a":"主料：猪肘肉1个：生肉皮250克｜调料：精盐5克料酒10克葱段25克姜片5克花椒1.5克清汤400克","p":["1。","先将猪肘肉皮面刮洗干净，放入冷水锅内，用中火烧沸，改用小火煮至五成熟时捞出，切厚1厘米的片，猪肉皮也刮洗干净，在沸水内煮两个滚捞出，切成长5厘米的细丝。","2。","猪肘肉整齐地摆放在盆内，加入清汤、精盐、料酒，葱姜、花椒（用布包好）肉皮丝，放入笼内蒸至熟烂取出，拣去葱姜、花椒，将盆内的汤用纱布过滤，撇去浮油，再将汤倒在肘肉盆内，晾凉冷凝后，改刀装盘即成。"]},{"i":284,"n":"烧占肉","r":"鲁菜","o":"鲁菜300种","f":"丸子酥烂嫩香，入口即散，酒饭皆宜，老年人食用最佳。","c":"热菜","m":["烧扒焖"],"g":["猪肉","海米","海参","口蘑","冬笋","火腿","鸡蛋"],"s":["盐","酱油","淀粉","料酒","葱","姜","高汤"],"t":["炒锅","砂锅"],"v":0,"a":"主料：猪肉300克（肥3瘦7）配籽：海米海参·口蘑玉兰片．火腿共100克｜调料：精盐5克酱油50克蛋清2个湿淀粉50克19料酒25克大葱3棵姜2片葱姜末10克清汤500克花椒油10克猪油250克（约耗50克）","p":["、1，将肉切成6毫米见方的丁，放入碗内，加入葱姜末、酱油15克、料酒15克腌渍。将海参、海米、口蘑、火腿切成与肉同样大小的丁。玉兰片切3毫米的丁。海参、玉兰片、口蘑用沸水焯过。2，将配料各丁与肉掺合后，团成4个大丸子，放在盘内。将鸡蛋清、湿淀粉、精盐1.5克放一个碗内搅匀成糊。","勺内倒入猪油，烧至五成热时，移至小火上，将丸子逐个沾匀糊下入油内煎，至挺身时，用小铲按动一遍，四成熟时翻过再煎，至八成熟时丸子起出。4。3棵大葱劈成长段铺在砂锅底上，再把丸子放入砂锅内，加清汤、酱油、精盐、姜片，在中火上烧沸，撇去浮沫，移至小火上慢炖至熟烂，汤剩一半时，将丸子捞出装入汤盘内，原汤内勾入湿淀粉，加料酒、花椒油沸起浇在丸子上即成。."]},{"i":285,"n":"米粉肉","r":"鲁菜","o":"鲁菜300种","f":"肉烂咸香，肥而不腻，冬季常作酒席上的饭菜。","c":"热菜","m":["爆炒"],"g":["米粉","猪肉"],"s":["盐","花椒","酱油","八角","桂皮","葱","姜","甜面酱","料酒"],"t":["炒锅","蒸锅"],"v":0,"a":"主料：猪五花肉500克｜配料：大米100克｜调料：精盐3克酱油50克花椒桂皮八角各0.5克葱姜丝5克甜面酱15克料酒5克：","p":["1，先将猪肉用铁筷子叉着在炉火上烧带皮的面，放温水内稍泡，刮净蝴面，洗净切成长条块，共十块。","用葱姜丝、甜面酱、酱油、精盐、料酒进行腌溃。","2。","将大米、桂皮、花椒、八角一并放入炒勺内用小火炒，待大米炒成黄色时（注意不要炒糊），倒在案板上轧碎，放入碗内加水拌匀，再与肉共同拌匀腌渍10分钟后，先21将八块肉皮朝下摆在碗内中间，呈鱼鳞式，其余两块肉堵在两边，上笼蒸熟后，取出反扣在盘内即成。"]},{"i":286,"n":"抓炒肉","r":"鲁菜","o":"鲁菜300种","f":"此莱外焦里嫩，甜、酸、咸、香系山东名菜。22","c":"热菜","m":["爆炒"],"g":["猪肉"],"s":["酱油","醋","白糖","盐","料酒","葱","姜","蒜","淀粉"],"t":["炒锅"],"v":0,"a":"主料：肥瘦猪肉250克｜调料：酱油10克食醋15克白糖50克精盐0.5克料酒5克葱姜蒜末5克湿淀粉40克花生油1000克（约耗50克5）","p":["1。将肉切成1.2厘米的厚片，两面交叉制上刀纹，再将肉切成长5厘米、厚2毫米的片，用料酒、精盐、酱油、湿淀粉调匀腌渍。","炒勺内倒入花生油，烧至六成热时，将肉片一一下入油内炸至漂起，呈金黄色时，将油倒出，肉片倒入策篱内，勺内留底油30克。","白糖、料酒、清汤半两、湿淀粉、酱油放一个碗内对成为汁。4。将炒勺内底油烧至八成热时依次烹入葱姜末，炸至放香时烹上醋，倒上对好的汁和炸好的肉片，颠翻使汁挂匀在肉片上，随即将盘子上面抹上一层食油（以防肉沾在盘子上），再将肉片倒入盘内即成。"]},{"i":287,"n":"把子肉","r":"鲁菜·济南","o":"鲁菜300种","f":"此菜肉肥汤好，色泽红润、气味清香，宜于热吃，与大米干饭同吃最佳。注：济南市“把子肉”闻名，香烂味美，风行历下。","c":"热菜","m":["烧扒焖"],"g":["猪肉"],"s":["酱油","葱","姜","白糖"],"t":["炒锅"],"v":0,"a":"主料：猪硬肋肉5000克｜调料：酱油1000克250克丙葱姜块150克冰糖200克五香面半两（用布包好）.","p":["1．将肉皮面刮洗干净，切成长5厘米、宽4厘米、厚2厘米长条块，每斤肉约切8块，每块肉中间，用干蒲菜外皮（用温水浸软）捆好。","2，将捆好的肉块放入锅内，加水在旺火上烧沸，把肉块捞出，将锅里的汤烧沸，撤净沫，加酱油、五香面、葱姜块、冰糖，再把肉放入锅内，用旺火煮沸后，再移至小火上炖约2小时，其肉即烂。","将肉捞在盆里，然后将锅内汤面上的浮油浮沫撤净，汤倒入肉盆内，吃时加热。"]},{"i":288,"n":"元宝肉","r":"鲁菜","o":"鲁菜300种","f":"、此菜系干蒸而熟，肉质软烂，味香不腻，因肉片上扣有鸡蛋，形似“元宝”而故名。","c":"热菜","m":["炸"],"g":["猪肉","鸡蛋"],"s":["酱油","盐","八角","料酒","葱","姜"],"t":["炒锅","蒸锅"],"v":0,"a":"主料：猪代皮硬肋肉500克｜配料：鸡蛋3个｜调料：酱油30克精盐3克：八角面1克料酒10克23葱段30克姜片10克花生油500克250克（约耗40克）","p":["将猪硬肋肉刮洗干净，下入清水锅内煮至五成熟时捞出，用洁布掘干水分，趁热在皮面上涂一层糖色；鸡蛋放入冷水锅内，用中火烧开煮6一7分钟即熟，捞至冷水内，剥去外壳，放在酱油碗内浸泡片刻。．2，炒锅内放入花生油，在旺火上烧至八成热时，将肉皮面朝下入油锅中炸，至皮面起小泡时捞出，放在板上切成长10厘米、宽4厘米、厚5毫米的片；用酱油浸泡过的熟鸡蛋，也放入油勺内炸至外皮起小泡时捞出，放板上将每个鸡蛋顺长切成两半。","将切开的鸡蛋黄面（即刀切开面）朝上摆入碗内成两行：肉片皮朝下一个方向摆在鸡蛋上，再撒上酱油、料酒、精盐、葱姜片、八角面，上笼蒸烂取出，反扣在盘内即成。"]},{"i":289,"n":"金针肉","r":"鲁菜","o":"鲁菜300种","f":"此菜肉质软烂，香气扑鼻，肥而不腻，佐酒下饺皆宜。三二","c":"热菜","m":["爆炒"],"g":["猪肉"],"s":["酱油","甜面酱","白糖","盐","葱","姜","料酒","高汤","淀粉"],"t":["炒锅","蒸锅"],"v":0,"a":"主料：猪肉350克干金针50克｜调料：酱油40克·甜面酱15克白糖10克精盐1.5克葱姜丝10克料酒15克清汤150克丙湿淀粉10克葱油50克","p":["猪肉用火烧外皮，呈淡黄色时，泡入6一7成热的24水中，5分钟后，用小刀刮净湖皮，放板上切成长10厘米，厚8毫米的片，撒上酱油15克，料酒10克腌溃；金针放入温水内泡发，择去根、洗净用沸水泡过，顺成把，用刀断为二段，放入碗内，加甜面酱、酱油、料酒、葱姜丝调匀。","炒锅内放入猪油15克，白糖10克放在小火上炒成红色，烹上料酒、酱油各10克及精盐倒入碗内备用。","将肉片皮面朝下顺序摆在碗内，成书本斜叠样式；把调好金针放在肉上，再倒入炒好的汁，上笼蒸烂取出扣在盘内，将清汤及蒸肉的原汁加酱油、料酒倒入炒锅内烧沸撤沫，用湿淀粉勾芡，再淋上葱油，浇入盘内肉上即成。"]},{"i":290,"n":"清余丸子","r":"鲁菜","o":"鲁菜300种","f":"汤清味美，丸子富有弹力，嫩香爽口。26","c":"小吃","m":["烧扒焖"],"g":["猪肉","白菜","鸡蛋"],"s":["高汤","盐","淀粉","料酒","味精","葱","姜"],"t":["炒锅"],"v":0,"a":"主料：猪瘦肉200克配新：青菜心50克｜调料：消汤500克鸡蛋清1个精盐2克湿淀粉1.5克料酒2饯味精1克葱姜未5克","p":["1，将指肉用刀剁成泥，放入碗内，加清汤25克与鸡蛋清一个方向搅匀上劲，再加入湿淀粉、葱姜末、精盐，继续向同一个方向搅匀成肉馅。清菜心切成段，用沸水焯过，放在汤盘内。","炒勺内放入清汤，旺火烧沸，把勺移到微火上，将搅好的肉馅，挤成直径2厘米大的丸子，逐个下入汤内，下完后，用中火烧沸，撇去浮沫，再放入青菜心和两滴酱油，继续撤净浮沫，加入料酒，味精盛入汤盘内。"]},{"i":291,"n":"炸大扁丸子","r":"鲁菜·济宁","o":"鲁菜300种","f":"此莱外焦里嫩，松软咸香，适于热吃，为济宁地区传统风味菜。","c":"小吃","m":["炸"],"g":["猪肉","香菇","冬笋","荸荠","鸡蛋"],"s":["盐","酱油","葱","姜","淀粉","料酒","味精","椒盐"],"t":["炒锅"],"v":0,"a":"主料：肥瘦猪肉150克熟肥肉膘100克｜配料：冬菇玉兰片荸荠各25克｜调料：精盐2克酱油15克鸡蛋清3个葱姜5克干淀粉25克料酒10克味精1克花椒盐5克花生油750克（约耗75克）","p":["将肥瘦肉、熟肥腰肉均切5毫米见方的丁；冬菇、玉兰片、荸荠（去皮）均切6毫米见方的丁；以上各种都放在一个碗内，加入精盐、酱油、料酒、味精、葱姜末拌匀，团成直径2厘米大的丸子共12个，放在大盘内。鸡蛋清、干淀粉放一个碗内调成糊备用。2。炒勺内倒入花生油，用中火烧至三成热时，移至小火上，将丸子用手拍扁，逐个沾满糊下入油内炸成淡黄色捞出（每个约炸1分钟，边炸边捞）。","将油勺移至中火上，烧至七成热时，将全部扁丸子再投入油中炸三四分钟熟透成金黄色时捞出，装入盘中，撒上花椒盐面即成。"]},{"i":292,"n":"炸丸子","r":"鲁菜","o":"鲁菜300种","f":"此菜外表脆，内里肉嫩，美味可口，佐酒佳肴。","c":"小吃","m":["炸"],"g":["猪肉"],"s":["盐","酱油","淀粉","花椒"],"t":["炒锅"],"v":0,"a":"主料：肥瘦猪肉150克28｜调料：精盐1.5克酱油5克湿淀粉50克半花椒面1.5克花生油500克（约耗50克）","p":["将猪肉切成3毫米见方的丁，加入精盐、酱油、湿淀粉调匀。","炒勺内放入花生油，中火烧至五成热时，移至小火上，将肉用手挤成直径约2厘米的丸子一一下入油内炸，将勺移至中火上，用小铲将丸子拨动，待全部丸子漂起在油面上冒细泡达七成熟时，将丸子捞出稍晾，油温升至八成热时，再将丸子投入油内，待丸子呈金黄色时捞出，撒上花椒面即成。"]},{"i":293,"n":"荷包丸子","r":"鲁菜","o":"鲁菜300种","f":"外形美观象荷包状，馅嫩清香。","c":"小吃","m":["爆炒"],"g":["猪肉","鸡蛋","海参","香菇","冬笋"],"s":["盐","酱油","葱","姜","料酒","淀粉","味精","香油"],"t":["炒锅","蒸锅"],"v":0,"a":"主料：猪肉100克鸡蛋3个｜配料：海参冬菇冬笋共50克｜调料：酱油10克精盐1克葱姜末5克料酒10克湿淀粉5克味精1克芝麻油15克","p":["1。将猪肉剁成茸泥；海参、冬菇、冬笋切2毫米碎丁与肉茸混合，加入料酒、精盐、酱油、芝麻油、葱姜末调匀成馅，并分成12份待用。","鸡蛋磕入碗内，加少量精盐及湿淀粉5克打匀。3。炒勺放在小火上，用油擦勺，至六成热时，用龚匙将鸡蛋液留入勺内，使蛋液在勺内底部成直径9厘米的薄皮蛋饼，共做12张。4。将馅放入每张蛋皮中心，将皮子折成半圆形，再用筷子一双由两边靠里夹成为荷包形。","将夹好的荷包丸子定在碗内上笼蒸透取出，扣在汤盘内，炒勺内放清汤、料酒、精盐、味精开起打沫后浇在30丸子上。"]},{"i":294,"n":"招远蒸丸","r":"鲁菜","o":"鲁菜300种","f":"此菜是招远地方名菜(亦称山东丸子)，丸子暄软鲜嫩，别有风味。31","c":"热菜","m":["蒸"],"g":["猪肉","海米","香菇","白菜","鸡蛋"],"s":["香菜","盐","味精","葱","姜","醋","胡椒","高汤","香油"],"t":["蒸锅"],"v":0,"a":"主料：猪瘦肉200克肥膘肉200克｜配料：海米5克水发冬菇5克白菜心100克香菜50克｜调料：精盐5克鸡蛋2个味精1克.葱40克姜3·钱食醋15克．鸡汤300克胡椒面0.5克芝麻油5克","p":["将瘦精肉剁碎成泥，放入碗内，加入鸡蛋搅匀。","肥膘肉切成厚2毫米的片，两面交叉打上刀纹，再切成3毫米见方的丁。","海米、白莱心、冬菇、姜均切成碎末。葱20克切末，20克切细丝，香菜半两切段，半两切末。，4。将肥肉丁与配料末、葱姜末、味精、精盐、胡淑面放入瘦肉泥碗内搅匀，做成直径约3厘米大的丸子，装入汤盘内上笼蒸熟（不要蒸老）取出。5。鸡汤倒入勺内加精盐、食醋烧沸撇去浮沫，淋上芝麻油，撒上葱丝、香菜段倒入盛丸子的盘内即成。"]},{"i":295,"n":"黄葱烧蹄筋","r":"鲁菜","o":"鲁菜300种","f":"色泽红润，葱香筋烂，滋味浓厚，是宴席上的传统名菜。","c":"热菜","m":["烧扒焖"],"g":["蹄筋"],"s":["葱","高汤","酱油","白糖","料酒","淀粉"],"t":["炒锅","蒸锅"],"v":0,"a":"主料：水发蹄筋500克｜配料：黄葱150克｜调料：清汤300克酱油10克白糖15克料酒15克湿淀粉30克白油40克花生油200克（约耗10克）","p":["1，将猪蹄筋洗净，切长5厘米的条，放入沸水内余透捞出，沥干水分；黄葱洗净，切长6厘米的段。2，炒勺内放入花生油、烧至八成热时，放入黄葱段炸、至断生捞在碗内，加酱油5克，上笼约蒸15分钟后取出、盛入盘的一边。","炒勺内放入白油和白糖炒至呈红色时，随即放入蹄筋，煸至上色后，加入清汤，酱油料酒，在小火上煨，待·汤汁将尽时，盛入盘的另一边。另用炒勺放入清汤，酱油烧沸撤沫，用湿淀粉勾芡，浇在盘内黄葱与蹄筋上。"]},{"i":296,"n":"梅花大肠","r":"鲁菜","o":"鲁菜300种","f":"此菜形如盛开的朵朵梅花，肠软润，内里鸡泥馅嫩鲜，汁微红明亮，肥而不腻。·","c":"热菜","m":["蒸"],"g":["猪大肠","鸡肉","火腿","荸荠","鸡蛋"],"s":["盐","酱油","葱","花椒","料酒","味精","淀粉","高汤"],"t":["炒锅","蒸锅"],"v":0,"a":"主料：白煮熟肥肠300克，鸡料子150克｜配料：火腿25克马蹄25克32｜调料：精盐5克酱油5克鸡蛋2个葱椒料酒10克味精1.5克清汤150克湿淀粉15克鸡油10克","p":["将熟肥肠的头和细尾切去，顶刀切2厘米宽的段（成圆圈形），共12段，用热水冲一遍捞出控干。火腿切小碎花瓣形片。马蹄切碎末。","鸡料子放碗内用少许清汤解开。鸡蛋清磕入碗内，用竹筷子搅打起沫，将鸡料子倒入，加精盐、湿淀粉、马蹄末向一个方向顺搅起劲成浓糊。","将鸡料糊酿入肥肠段的圆圈内，两面和肠相平，摆入平盘内，用火腿小片在每个大肠墩上摆成一朵小梅花形，上笼蒸10分钟左右取出。","炒勺内倒清汤、加精盐、酱油、葱椒料酒烧沸撇去浮沫，湿淀粉勾芡，点上味精，淋上鸡油浇在盘内梅花大肠上即成。·"]},{"i":297,"n":"清炸大肠","r":"鲁菜","o":"鲁菜300种","f":"，色呈枣红，外焦里嫩，味香不腻。","c":"热菜","m":["炸"],"g":["猪大肠","猪肉","萝卜"],"s":["葱","酱油","盐","椒盐","甜面酱","蒜"],"t":["炒锅"],"v":0,"a":"主料：熟猪大肠2条（约300克）｜配料：大葱2棵（约200克）｜调料：酱油10克精盐5克花椒盐面5克甜面酱50克青萝卜条100克大蒜泥15克花生油500克（约耗20克）","p":["锅内放入熟猪大肠和沸水2厅，精盐5克，旺火烧35沸，捞出大肠，每条大肠内塞入大葱一棵，大肠外皮用酱油抹过。","炒勺内放入花生油，旺火烧至八成热时，放入大肠炸成火红色捞出，抽出大葱，放在板上，斜刀切1厘米宽的块，整齐地摆在盘内。3。花椒盐、大蒜泥、甜面酱、青萝卜条分别装入4个小碟内同上餐桌。"]},{"i":298,"n":"奶汤大肠","r":"鲁菜","o":"鲁菜300种","f":"，汤色乳白香浓，肠绵软，肥而不腻。36","c":"汤羹","m":["烩汆"],"g":["猪大肠","猪肉","白菜","火腿","冬笋"],"s":["高汤","盐","味精","姜","葱"],"t":["炒锅"],"v":0,"a":"主料：熟猪大肠150克｜配料：菜心50克熟火腿25克冬笋25克｜调料：精盐3克奶汤500克味精1克姜汁5克·葱段50克白油50克‘","p":["1，将熟猪大肠剖开，切成长4厘米，宽2厘米的块；菜心洗净，切段，冬笋切与大肠同样大的片，用沸水焯过；火腿切成小象眼片。","炒勺内放入白油，在中火上烧至六成热时，放入葱段，炸出香味，捞出大葱不用。随即倒入奶汤、大肠、冬笋、菜心、精盐，烧沸后撇去浮沫，再加味精、姜汁、盛入大汤碗内，撒上火腿片。"]},{"i":299,"n":"葱烧大肠","r":"鲁菜","o":"鲁菜300种","f":"色泽红润，大肠软嫩，味咸葱香，肥而不腻。","c":"热菜","m":["烧扒焖"],"g":["猪大肠","猪肉"],"s":["葱","盐","味精","料酒","酱油","淀粉","高汤"],"t":["炒锅"],"v":0,"a":"主料：熟猪大肠2根（约250克）｜配料：大葱白2根（100克）｜调料：精盐5克味精2克料酒15克酱油30克湿淀粉10克花椒油25克花生油500克（约耗40克）清汤适量","p":["1。","将熟猪大肠放入锅内，加清水1000克和酱油，精盐3克，在旺火上烧沸煮一个滚捞出后，用料酒稍腌。","2，大葱白切长3厘米的段，葱段的两头打“十”字花刀。","3。","炒勺内放入花生油烧至九成热时，放入大肠，炸成枣红色捞出，切成长2厘米的段。","炒勺内留少量油，下入葱段，煸炒出香味，加入清汤、精盐、大肠段，中火烧至入味时，加味精、用湿淀粉勾芡，颠翻均匀，淋上花椒油，盛入盘内。"]},{"i":300,"n":"汤爆肚头","r":"鲁菜","o":"鲁菜300种","f":"汤清味鲜，肚头脆嫩。制熟后加速端上餐桌，必须立即食用，否则肚头烫老，不易嚼烂。","c":"汤羹","m":["爆炒","烩汆"],"g":["猪肚"],"s":["高汤","盐","葱","酱油","料酒","味精","胡椒"],"t":["炒锅"],"v":0,"a":"主料：猪肚头400克｜调料：清汤500克精盐2克．酱油1克葱根绍酒10克37味精1克胡椒面少许香莱末10克","p":["将肚头用刀劈开，剥去外皮，在清水内洗净，择去星面的筋杂，上“十”字花刀（深度为三分之二），成网包状，再切成3厘米见方的块，放入碱水内浸泡5分钟，用清水洗净碱性。2。炒勺内放入沸水1000克，肚头放入沸水内焯一下，迅速捞至汤盘内，加葱椒绍酒5克调匀，撒上胡椒面、香菜束。","炒勺内另放清汤、精盐、酱油。葱椒绍酒烧沸，撇去浮沫，加入味精，浇在有肚头的汤盘内。"]},{"i":301,"n":"糟煎肚片","r":"鲁菜","o":"鲁菜300种","f":"色白油亮，肚片滑嫩，糟香味浓。","c":"热菜","m":["煎塌"],"g":["猪肚","冬笋","白菜"],"s":["香糟","盐","高汤","料酒","味精","淀粉","葱","姜"],"t":["炒锅"],"v":0,"a":"主料：煮熟白肚200克｜配料：冬笋30克·青菜心30克｜调料：香糟10克精盐2克清汤300克料酒5克味精1克湿淀粉20克葱姜末10克葱油10克白油50克","p":["1：将熟肚切成长5厘米、宽3厘米的坡刀片；冬笋切与股同鲜大的片；青菜心切长5厘米的段。以上均用沸水焯过；香糟用50克10克清汤泡开，用洁白纱布过滤，拧出成为香栏汁。","炒勺内放白油，在中火上烧至六成热时烹入葱姜蒜末炸出香味，随即将香糟汁倒入勺内二分之一的量，再放入肚片，冬笋、精盐、料酒、清汤烧沸撇去浮沫，移至小火上稍，待汤汁剩一半时，放入菜心及余下的香糟汁，用湿淀粉勾芡，加味精，淋上葱油，颠翻均匀出锅。"]},{"i":302,"n":"云片肚片","r":"鲁菜","o":"鲁菜300种","f":"软嫩清香，形状美观，有白、红、黄、黑四种颜39色相间，因形似云层，故名。，","c":"热菜","m":["蒸"],"g":["猪肚","猪肉","冬笋","香菇","火腿"],"s":["盐","料酒","高汤","味精","淀粉","葱","姜"],"t":["炒锅","蒸锅"],"v":0,"a":"主料：熟猪白肚300克·｜配料：玉兰片50克冬菇50克熟瘦火腿50克｜调料：精盐3克清汤300克料酒10克味精1克湿淀粉：20克葱30克姜汁5克葱油25克","p":["，1，将熟猪白肚坡刀切成长6厘米，宽3厘米的斜刀片，玉兰片，火腿切厚2毫米与猪肚同样大的片，冬菇切落片，除火腿外均用沸水焯过。","2。","将冬菇，玉兰片，火腿、肚片间隔（正面朝下）摆效在大碗内（成马鞍形）。","3。","将清汤、精盐、料酒放一个碗内调匀，浇在摆好肚片的碗内，上放葱段、姜片、然后放进笼内，用旺火蒸40一50分钟，取出，去掉葱姜，津去汤汁，翻扣在盘内。","4。","炒勺内放入清汤，精盐、料酒、姜汁烧沸，用湿淀粉勾芡，放入味精，淋入葱油，浇在盘内肚片上。"]},{"i":303,"n":"糟油口条","r":"鲁菜","o":"鲁菜300种","f":"猪舌肉嫩，其清淡的糟香美味宜人。","c":"热菜","m":["炸"],"g":["猪肉"],"s":["香糟","盐","高汤","葱","花椒","料酒","味精","姜","香油"],"t":["炒锅"],"v":0,"a":"主料：生猪舌2条（约500克）｜调料：精盐15克清汤500克香糟25克葱椒料酒5克味精1克五香粉15克葱姜片50克芝麻油50克","p":["1。生猪舌用水洗净，放入清水锅内煮透捞出，刮去舌皮用水洗净。与葱姜、五香粉、精盐、清汤均放入一个锅内，用小火煮烂，取出猪舌切长5厘米、宽3厘米的薄片。","用清汤50克，葱椒料酒、味精放入一个碗内混合成汁。3。炒勺内放入芝麻油，烧至八成热时，放入香糟，炸成糟油，倒在有味精碗的汁内，用白纱布将糟渣滤去，将切好的口条片放汁内浸泡约30分钟捞出，放在盘内即成。"]},{"i":304,"n":"五香扒猪蹄","r":"鲁菜","o":"鲁菜300种","f":"","c":"热菜","m":["烧扒焖"],"g":["猪肉","口蘑"],"s":["盐","酱油","姜","白糖"],"t":["炒锅"],"v":0,"a":"主料：猪蹄50000克｜调料：精盐1500克酱油3000克药料100克口蘑100克生40姜200克糖稀500克","p":["先将猪蹄放在火上烧去毛，放入温水内泡15分钟，再用小刀刮净蝴皮，在蹄叉内择不净的毛及污垢，再用烧红的铁棍烙去，全部用清水洗净后，抹上一层糖稀，然后放油锅内炸5分钟捞出，装入锅内加水及所有以上调料，大火烧开，改用小火焖煮达3小时即熟烂。"]},{"i":305,"n":"蹄筋冻","r":"鲁菜","o":"鲁菜300种","f":"此菜色红透明，清凉爽口。注；如不用醬油和八角，也可成白色透明的冻。41","c":"凉菜","m":["蒸"],"g":["蹄筋","猪肉","白菜","火腿"],"s":["高汤","盐","酱油","花椒","八角","葱","料酒","味精"],"t":["炒锅","蒸锅"],"v":0,"a":"主料：水发蹄筋100克肉皮200克｜配料：油菜心50克火腿末10克｜调料：清汤300克酱油30克精盐2克花椒八角各0.5克葱椒料酒25克味精1克","p":["将蹄筋顺长劈成四半，油莱心洗净均用沸水焯过。","肉皮用沸水煮透切细丝，放入大碗内，加清汤、酱油10克，花椒、八角、葱、姜、料酒10克，上笼蒸至肉皮熔化取出，用洁白纱布（或小萝）过滤。","将过滤的汤汁倒在炒勺内，放入蹄筋、菜心、火腿末、精盐、葱油、葱椒料酒，烧沸撤沫，加味精倒入盆内，冷凉后，放入冰柜内冷凝成冻，切长5厘米，宽3厘米，厚五毫米的片，装盘。"]},{"i":306,"n":"松子肚卷","r":"鲁菜·济南","o":"鲁菜300种","f":"色红味香，肚卷切片后，肉皮已变成金黄光亮的冻，色彩艳丽，佐酒佳肴。是济南洛口原名厨师彭珂所创。","c":"热菜","m":["烧扒焖"],"g":["猪肚","猪肉"],"s":["酱油","盐","葱","姜","花椒","八角","桂皮"],"t":["炒锅"],"v":0,"a":"主料：猪肚子1个（约重1000克）带皮猪肉1500克｜调料：酱油250克精盐50克五香面5克松子末15克葱100克姜25克花椒桂皮八角各1克","p":["将生猪肚用白矾、食盐、醋把粘液搓洗干净，放入沸水锅内煮5分钟，·捞至冷水内翻过洗净。","带皮猪肉切成大片，放入盆内加酱油，五香面、松子末，葱姜丝、精盐15克腌溃。3。将腌过的猪肉片装入洗净的猪肚内，将肚子口用竹扦别住，放入锅内加水、花椒、八角、桂皮、酱油、盐、葱段、姜片，旺火烧沸，再改用小火煮3小时左右，熟后捞出”用白纱布包起，上放一木板，再压上重物，目的是把肚压成扁平形，解去纱布，吃时切片装盘。"]},{"i":307,"n":"葱爆羊肉","r":"鲁菜","o":"鲁菜300种","f":"肉嫩葱香。色红油亮，微露甜味。","c":"热菜","m":["爆炒"],"g":["羊肉","猪肉"],"s":["葱","盐","酱油","醋","姜","蒜","料酒","白糖","香油"],"t":["炒锅"],"v":0,"a":"主料：羊后腿肉200克｜配料：大葱白100克，｜调料：精盐1.5克酱油30克醋30克姜蒜末5克料酒15克白糖50克香油30克花生油50克","p":["1。","将羊肉用刀顶丝切成长4厘米，宽2厘米，厚2毫米的片。","大葱白切滚刀块。","2，炒勺内放入花生油，中火烧至七成热时，放入葱姜43蒜末，炸出香味，迅速烹入醋，放入羊肉片和大葱，随即煸炒，至肉片发白时，加酱油白糖、料酒、精盐，继续翻炒，湿淀粉勾芡，淋入香油出勺。"]},{"i":308,"n":"扒羊肉条","r":"鲁菜","o":"鲁菜300种","f":"羊肉软烂，香味浓厚，汁红明亮。","c":"热菜","m":["烧扒焖"],"g":["羊肉","猪肉"],"s":["盐","酱油","高汤","料酒","味精","淀粉","葱","姜"],"t":["炒锅"],"v":0,"a":"主料：熟羊肉250克｜调料：精盐2克酱油20克清汤250克料酒15克味精1克湿淀粉30克葱末3克·姜末2克花椒油15克花生油50克","p":[".1。","将熟羊肉切成长9厘米、宽3厘米，厚1厘米的片，整齐地码在盘内。","2。","炒勺内放入花生油，中火烧至六成热时烹入葱姜末，炸出香味，加入酱油、清汤、料酒、精盐，把羊肉条原样不动地推入勺内，见微开后，移在微火上煨5一6分钟后再转用旺火，用湿淀粉勾芡，加味精，淋入花椒油，大翻勺盛在盘内。","（肉条要整齐不乱）。"]},{"i":309,"n":"红烧牛肉","r":"鲁菜","o":"鲁菜300种","f":"色泽红亮，肉烂浓香。，","c":"热菜","m":["烧扒焖"],"g":["牛肉","猪肉"],"s":["酱油","花椒","八角","葱","姜","淀粉","香油"],"t":["炒锅"],"v":0,"a":"主料：牛硬肋肉400克44｜调料：酱油100克花椒1克八角1克葱50克姜25克湿淀粉30克香油20克花生油500克（约耗40克）·","p":["1：把牛肉切成4厘米见方的块，放入水锅内小火烧沸，使肉内的血污透出，捞出用清水洗干净，洁布振干水分，再浇上少许酱油拌勾。2，炒勺内放入花生油，中火烧至六成热时，将牛肉块下入油内，略炸一下成红色捞出。","原炒勺内留油10克，放入牛肉块、葱姜块、酱油、清汤、八角、花椒、白糖，旺火烧沸，移小火上慢焖（约3小时左右），至熟烂为止，将葱姜、八角拣出，湿淀粉勾芡，淋入香油出锅。"]},{"i":310,"n":"腰丁烩腐皮","r":"鲁菜","o":"鲁菜300种","f":"腰子脆嫩，荤素搭配得当，汤汁色白润滑，.口味鲜香，宜做酒席上的饭菜。","c":"汤羹","m":["烩汆"],"g":["猪腰","火腿","口蘑","冬笋"],"s":["盐","料酒","高汤","味精","姜","淀粉"],"t":["炒锅"],"v":0,"a":"主料：猪腰子150克干油皮子25克配抖，火腿口蘑冬笋各10克｜调料：精盐3克清汤300克料酒10克味精1克姜汁5克湿淀粉10克碱粉少许葱油10克","p":["1。","先将腰子从中片开，片去腰，切成2厘米见方的丁片，用凉水泡着。","干油皮子亦称付皮用温水泡软，也切2厘米见方的片，再放入六成热的温碱水内用手揉搓，使油皮子全部回软，再用清水洗去碱性，放入冷水内泡着。","452，火腿、冬笋、口蘑均切1.5厘米见方的丁片，连同油皮丁均用沸水焯过，控净水分，另将腰丁在沸水内焯过。","3，炒勺内倒入清汤，加精盐、料酒、姜汁、腐皮、冬笋、口蘑、火腿、湿淀粉烧沸撤沫，加味精倒入汤盘内。","4，炒勺内留三分之一的汤，将腰丁倒入，淋上葱油，倒在盘内腐皮上即成。"]},{"i":311,"n":"炒木肉","r":"鲁菜","o":"鲁菜300种","f":"此菜肉嫩蛋软味香，因鸡蛋炒熟后色黄更美观，形似木花，故名。46","c":"热菜","m":["爆炒"],"g":["猪肉","鸡蛋","冬笋","木耳","青蒜"],"s":["甜面酱","盐","酱油"],"t":["炒锅"],"v":0,"a":"主料：猪肥瘦肉150克鸡蛋3个｜配料：玉兰片20克水发木耳15克蒜苗75克｜调料：甜面酱25克酱油25克精盐1克花生油100克","p":["1。","将猪肥瘦肉片成大片，切长六厘米粗2毫米的丝；木耳斯成小块，玉兰片切与肉同样的丝，用沸水焯过；蒜苗切成4厘米的段；鸡蛋磕入碗内加盐搅匀。","2。","炒勺内放入花生油40克，烧至七成热时，倒入鸡蛋炒熟，盛入碗内。","炒勺内再放入油，烧至六成热时，放入肉丝炒成白色，“飞”入甜面酱炒熟放香，加酱油搅炒，随即将炒好的鸡蛋和玉兰片、木耳、蒜苗、投入炒勺内与肉丝颠翻均匀出锅。"]},{"i":312,"n":"卷煎","r":"鲁菜","o":"鲁菜300种","f":"“卷煎”是一种把肉馅包进卷形的长卷，经干蒸而成，常作酒宴冷菜和拼摆花盘的碟料，此菜鲜香软嫩，黄白相间，旋纹层层，色彩悦目","c":"热菜","m":["煎塌"],"g":["猪肉","鸡蛋"],"s":["盐","淀粉","葱","姜","香油"],"t":["炒锅","蒸锅"],"v":0,"a":"主料：猪嫩瘦肉150克鸡蛋2个4｜调料：精盐2克鸡蛋清2个湿淀粉30克葱姜末10克香油20克花生油50克","p":["1，将猪嫩瘦肉剁成泥，放在碗内，加精盐、鸡蛋清、湿淀粉、葱姜末、香油、朝一个方向顺搅成肉馅。鸡蛋磕入碗内，搅打均匀。","炒勺放在中火上烧至三成热时，倒入花生油，晃均为底，烧至五成热时，倒入搅匀的蛋汁，随即将勺端离火眼，同时晃动，使鸡蛋汁成为直径30厘米左右，厚薄均匀的薄饼。再将炒勺上口翻过来朝下对准火口，在火上嘘一嘘（嘘时用铁丝策篱挡一挡，以防蛋饼掉入火内），取下来即成“蛋皮”。","将蛋皮平铺在板上，把搅好的肉馅均匀地摊在蛋皮上。抹平后卷起，卷一圈时将两头的边向里折起，然后继续卷完为止，即成蛋卷。4。将卷好的蛋卷放在大盘内上笼用大火蒸15分钟取出用洁白纱布包起，平放在板上，上压2500克重的平板，晾凉即成。食时切厚3毫米的片装盘。"]},{"i":313,"n":"济宁面筋丸于","r":"鲁菜·济宁","o":"鲁菜300种","f":"此菜面筋软嫩而有韧性，馅香美爽口，是济宁地区传统制法。50","c":"热菜","m":["烧扒焖"],"g":["面筋","猪肉","冬笋"],"s":["盐","葱","姜","酱油","料酒","高汤","淀粉","香油"],"t":["炒锅","蒸锅"],"v":0,"a":"主料：生面筋250克肥瘦猪肉100克半｜配料：水发玉兰片50克青嫩云豆50克｜调料：精盐2.5克酱油20克葱姜末5克料酒10克蚨精1克.清汤300克湿淀粉5克芝麻油15克猪油15克","p":["1。将肥瘦猪肉，云豆，玉兰片均切成2毫米的细末，同葱姜一起放在一个碗内，加入酱油、料酒、精盐、湿淀粉，！搅匀成馅，并分成12份。","将生面筋洗净切成12份，取其1份放在平板上授成长条薄片，再取馅1份，·抹在面筋薄片的一头，此时将有馅成直径约3厘米的丸子，其它各分面筋如同法制成。","将沸水锅移至小火上，放入面筋丸子煮2分钟，捞出沥净水，盛在大碗内。4，炒勺内放入猪油，烧至七成热时；放入葱姜丝炸出香味，加清汤、酱油烧沸撤沫倒在面筋丸子的碗内，上笼蒸10分钟取出盛在汤盘中。","将蒸丸子的原汁倒入勺中烧沸撤沫，用湿淀粉勾芡，加入味精，芝麻油，然后浇在面筋丸子上即成。49"]},{"i":314,"n":"炒浮油鸡片","r":"鲁菜","o":"鲁菜300种","f":"颜色洁白，软嫩细腻，汁透明，味清香。","c":"热菜","m":["爆炒"],"g":["鸡肉","猪肉","冬笋","豌豆","鸡蛋"],"s":["盐","淀粉","葱","姜","料酒","味精","高汤"],"t":["炒锅"],"v":0,"a":"主料：鸡脯肉100克｜配料：冬笋50克青豆20粒｜调料：精盐2克鸡蛋清5个湿淀粉2.5克葱末1.5克姜汁1克料酒5克味精1克清汤100克白油1000克（耗50克半）","p":["先将鸡脯肉剔净脂皮、白筋，用刀背砸成茸泥，盛于碗内，加鸡蛋清、精盐、姜汁、湿淀粉、清水顺搅均匀；冬笋切厚2毫米、2厘米见方的片，用沸永焯过。2。炒勺内倒入白油，在小火上烧至三成热时，用粪匙把鸡茸泥一匙一匙地入油内，待浮至油面（成薄片状，不要炸老，越嫩越好）捞出称“鸡片”，放入沸水中透出内里的油分，捞出控净水分。","炒勺内留油50克，在大火上烧至六成热时放入葱末炸出香味，再放入笋片、青豆、精盐、清汤、料酒、鸡片、味精，颠炒几下出锅即成。"]},{"i":315,"n":"芙蓉鸡片","r":"鲁菜","o":"鲁菜300种","f":"鸡肉片滑嫩清香，芙蓉色洁白艳丽。","c":"热菜","m":["爆炒"],"g":["鸡肉","猪肉","豌豆","火腿","鸡蛋"],"s":["盐","料酒","味精","高汤","淀粉"],"t":["炒锅","蒸锅"],"v":0,"a":"主料：鸡脯肉200克61配计：青豆10粒火腿2片鸡蛋清4个·｜调料：精盐3克料酒10克味精1克清汤250克湿淀粉15克葱油10克花生油500克（约耗50克）","p":["1，将鸡蛋清3个打入碗内，加清汤150克、精盐2克、味精搅打成泡沫状，再上笼蒸成嫩豆腐脑状，即成芙蓉。","鸡脯肉切成长3厘米的薄片，加入鸡蛋清和湿淀粉调匀。3，炒勺内倒入花生油在中火上烧至五成热时，倒入鸡肉片，用铁筷子打开，滑透倒入漏勺控去油。4。炒勺内倒入清汤，放入青豆、火腿、精盐、料酒在旺火上烧沸撇去浮沫，再倒入鸡肉片，湿淀粉勾芡，加味精，淋上葱油，倒在盘内芙蓉上即成。"]},{"i":316,"n":"油爆鸡丁","r":"鲁菜","o":"鲁菜300种","f":"鸡肉滑嫩，色白油亮，配料鲜脆，芡汁浓紧包裹在原料上，·鲜香味美。","c":"热菜","m":["爆炒"],"g":["鸡肉","猪肉","冬笋","香菇","黄瓜","鸡蛋"],"s":["盐","料酒","味精","淀粉","高汤","葱","姜","蒜"],"t":["炒锅"],"v":0,"a":"主料：鸡脯肉200克｜配料：冬笋25克冬菇25克黄瓜25克｜调料：精盐2.5克鸡蛋清1个料酒10克味精1克清汤50克湿淀粉40克葱姜蒜5克花生油1000克（约耗50克10克）","p":["1。将鸡脯肉上的脂皮筋膜用刀片去，两面划上刀纹，29切成1.5厘米见方的丁，放入碗内，加入精盐、鸡蛋清、湿淀粉渍匀；冬笋、冬菇、黄瓜都切成与肉丁大的方片，均用沸水焯过；清汤、料酒、味精、精盐、湿淀粉放入一个碗内对成汁。","炒勺内倒入花生油烧至五成热时，将渍过的鸡肉丁下入油内，用铁筷子打散滑至八成熟时捞出。炒勺内留底油，大火烧至六成热时，烹入葱姜蒜末炸出香味时，倒入黄瓜、冬笋、冬菇、鸡肉丁颠翻搅炒几下，随即倒入对好的汁，快速颠炒均匀即成。"]},{"i":317,"n":"炒鸡瓜","r":"鲁菜·济南","o":"鲁菜300种","f":"鸡肉色白鲜嫩，酱黄瓜脆，香美爽口，佐酒佳肴，为济南传统名菜。","c":"热菜","m":["爆炒"],"g":["鸡肉","猪肉","黄瓜","鸡蛋"],"s":["盐","料酒","淀粉","葱","姜","香油"],"t":["炒锅"],"v":0,"a":"-主料：生鸡脯肉100克｜配料：酱黄瓜韭黄各50克｜调料：精盐2克料酒5克鸡蛋清1个湿淀粉30克葱姜丝5克香油10克花生油500克（约耗50克）","p":["1。将鸡脯肉上的脂皮、、白筋片去，切成长7厘米、粗2毫米的细丝，放入碗内加精盐、鸡蛋清、湿淀粉，轻轻抓匀养好：酱黄瓜切成长4厘米、粗3毫米的丝，用凉水泡10分钟洗净咸味再挤干；韭黄择洗干净，切成与酱黄瓜同样长的段，用沸水烫过装入盘内中心。","炒勺内倒入花生油，在中火上烧至四成热时，将养53好的鸡肉丝下入油内滑透捞出。","原炒勺内留底油，放入葱姜丝炸出香味，紧接放入酱瓜丝、料酒、清汤、精盐、鸡丝颠炒两下，淋上香油，盛在盘内韭黄之上。"]},{"i":318,"n":"炒辣子鸡","r":"鲁菜","o":"鲁菜300种","f":"鸡肉鲜嫩，味道咸香。","c":"热菜","m":["爆炒"],"g":["鸡肉","辣椒"],"s":["盐","酱油","料酒"],"t":["炒锅"],"v":0,"a":"主料：宰好的雏鸡1只（约重300克）‘｜配料：辣椒100克｜调料：精盐1.5克酱油20克料酒10克花生油75克","p":["1.将宰好的雏鸡，用刀剁去嘴、爪、翅尖，洗净后剁成2厘米见方的块。","辣椒去把、籽也切2厘米见方的块。","2。","炒勺内放入花生油，烧至七成热时，放鸡块煸炒，至有八成熟时加入酱油、精盐、料酒略炒，再放入辣椒和鸡块同炒至熟。"]},{"i":319,"n":"糟炒鸡丝","r":"鲁菜","o":"鲁菜300种","f":"鸡肉丝滑嫩，色白油亮，糟香味醇。","c":"热菜","m":["爆炒"],"g":["鸡肉","猪肉","青蒜","冬笋","鸡蛋"],"s":["香糟","淀粉","高汤","盐","料酒"],"t":["炒锅"],"v":0,"a":"主料：鸡脯肉200克｜配料：菱白40克蒜苗50克冬笋40克｜调料：湿淀粉30克清汤200克精盐3克料酒10克陈精1克鸡蛋清2个香糟10克葱油500克（约耗50克）。55","p":["1，将鸡脯肉上的脂皮、白筋剔净，片成薄片，切长6厘米、粗2毫米的细丝，放入碗内加鸡蛋清、精盐、湿淀粉轻轻抓匀养好。","葵白剥去老皮、削去嫩皮和冬笋均切与鸡肉丝相同的丝；用沸水焯过；蒜苗劈成四半，截成长5厘米的段；香糟用清汤泡透，用白纱布过滤拧出糟汁待用。3。炒勺内放进葱油，在中火上烧至四成热时，将鸡肉丝下入油内，用铁筷子把鸡丝打开，滑至八成熟时，将油倒出，鸡丝搂在炒勺把根，留少量底油烹上5克糟汁，倒上白，冬笋稍微一煸，放上清汤、料酒、湿淀粉烧沸，将鸡丝推入汁内，加蒜苗、味精和余下的糟汁，搅匀颠翻即成。"]},{"i":320,"n":"油淋鸡","r":"鲁菜","o":"鲁菜300种","f":"皮酥肉嫩，味道香美，佐酒佳肴。","c":"热菜","m":["炸"],"g":["鸡肉"],"s":["姜","酱油","葱","花椒","料酒"],"t":["炒锅"],"v":0,"a":"主料：宰好的雏鸡1只（约重500克）｜调料：小茴香5克：姜汁30克酱油50克葱椒料酒30克花生油1000克（约耗50克30克）：","p":["1。","将宰好的雏鸡洗净，择去毛，用刀从脊背中间自颈至后尾劈为两半，用手一瓣，剔去脯骨，在靠近头处硬断鸡颈，剁去嘴、爪。","用刀背砸断鸡翅大拐弯处。","在鸡大腿、小腿内侧各拉开一刀口，把小腿骨砸断抽出（大小腿之间的关节保留），再将大腿骨下关节处砸断，在刀口处抽出大56腿骨。","从脊背中间剞成两段。","将鸡肉放入腕内，用酱油、葱椒料酒、姜汁、小茴香（拍碎）均匀地撒在鸡肉上，腌约半小时，取出用洁布干水分。","2，炒勺内倒入花生油，在旺火上烧至八成热时，把好地雏鸡肉放入油内炸（油温保持七一八成热），.待鸡肉八成熟外表呈红色时捞出。","待油温升至九成热时，将鸡肉重投入油内，炸至呈枣红色时把油倒出，烹入腌鸡的余汁，随即出锅，放在板上，剁成4厘米、宽2厘米的块，原样摆入盘内。","上桌时外带辣酱油、花椒面各一小碟蘸食。",".。"]},{"i":321,"n":"麻辣鸡","r":"鲁菜","o":"鲁菜300种","f":"色泽红润，鸡块软烂，麻辣干香，是酒宴上常用的冷盘佳料。","c":"热菜","m":["爆炒"],"g":["鸡肉"],"s":["盐","酱油","料酒","白糖","高汤","葱","姜","花椒","香油"],"t":["炒锅"],"v":0,"a":"主料：宰好的雏鸡1只（约重500克）｜调料：精盐5克酱油30克料酒20克白糖20克、清汤500克葱段25克姜块10克生花椒面5克香油30克花生油1000克（约耗50克30克）","p":["将宰好的雏鸡洗净，剁去嘴、翅尖、爪，从脊背中间劈成两半，再别成2厘米见方的块，放入碗内，加入酱油，15克溃匀。","炒勺放在旺火上，倒入花生油，烧至八成热时放入鸡块，炸至呈淡红色捞出。","净炒勺放火上，加入香油、白糖，炒至鸡血红色时，放入清汤、酱油、精盐、料酒、葱姜烧沸，撇去浮沫，，57倒入炸过的鸡块，移至小火上煨，待鸡块八成熟时，撒上花椒面，颠翻均匀，继续用小火煨，至汤汁将尽时，淋上香油，颠匀出勺。"]},{"i":322,"n":"黄焖鸡块","r":"鲁菜·济南","o":"鲁菜300种","f":"色泽红润明亮，鸡肉嫩烂，味香浓醇。“黄焖”是济南传统的烹调方法。七三苹果鸡主料：大苹果5个鸡脯肉200克58.配料：口蘑30克","c":"热菜","m":["烧扒焖"],"g":["鸡肉"],"s":["盐","酱油","甜面酱","料酒","高汤","白糖","葱","姜"],"t":["炒锅"],"v":0,"a":"主料：宰好的雏鸡1只（约400克）｜调料：精盐2克酱油20克甜面酱30克料酒10克清汤500克白糖25克葱段15克姜5克葱油15克白油75克","p":["1。","将宰好的雏鸡择洗干净，用刀剁去嘴、爪、翅尖，从脊背中间劈成两片，再剞成3厘米见方的块。","2。","炒勺内放入白油、白糖炒成红色，加入甜面酱炒出香味，随即将鸡块、葱姜倒入勺内，翻搅煸透后，再烹入酱油、清汤、精盐烧沸，加盖煨至鸡肉有八成熟时，放入料酒，移至小火煨，待汤汁浓稠时，淋上葱油颠匀出勺。"]},{"i":323,"n":"栗子鸡","r":"鲁菜","o":"鲁菜300种","f":"色泽红亮，味道香浓，栗子绵软，鸡肉嫩烂。","c":"热菜","m":["爆炒"],"g":["栗子","鸡肉"],"s":["甜面酱","酱油","料酒","盐","葱","高汤","姜","淀粉"],"t":["炒锅"],"v":0,"a":"主料：宰好的雏鸡1只（约400克）｜配料：栗子150克｜调料：甜面酱30克酱油20克料酒15克精盐2克59清汤500克葱段25克姜两片湿淀粉20克花椒油15克白油30克花生油500克（约耗30克）.","p":["将宰好的雏鸡择洗干净，剁去嘴、爪、翅尖，从脊背中间劈成两片，再剁成3厘米见方的块；栗子洗净，在顶部用刀剁上“十”字刀口（只剁断外壳），放入沸水锅内煮5分钟左右捞出，剥去外壳，用温水洗净，每个劈成两片。2。炒勺内倒入花生油，在旺火上烧至七成热时，放入聚子炸至四边见红时，倒在漏勺内。3。炒勺内放入白油，在中火烧至六成热时，放入葱姜略炸后“飞”入甜面酱炒出香味，再放鸡块煸透，倒入碗内。","炒勺内放入白油、白糖在小火上炒至鸡血红色时，将碗内的鸡块倒入煸炒几下，随即烹入酱油、料酒、清汤，烧沸后放入栗子、精盐，加盖煨炖，至鸡有八成熟时，移在中火上至汤剩三分之一时，加料酒、湿淀粉勾芡，淋上花椒油盛入盘内。"]},{"i":324,"n":"炸八块","r":"鲁菜","o":"鲁菜300种","f":"外酥内嫩，再配以小调料，蘸着花椒盐面或辣酱油，吃起来更觉别有风味。，","c":"热菜","m":["炸"],"g":["鸡肉"],"s":["盐","酱油","淀粉","料酒","葱","姜","椒盐"],"t":["炒锅"],"v":0,"a":"主料：宰好的雏鸡1只（约400克）｜调料：精盐3克（酱油30克湿淀粉50克料酒20克葱姜丝各10克花椒盐面5克花生油1000克（约耗50克20克）：60","p":["1。","将鸡择洗干净，刹去嘴、爪、翅尖，均匀地剁成八块（脖和臀各1块，腿、翅、脯各2块），然后逐块用刀面拍一拍，再用刀背砸一砸，剔去两条大腿骨，放入盆内加精盐、酱油、料酒、葱姜丝腌渍片刻。","2。","炒勺内倒入花生油，烧至五成热时，将鸡逐块挂上一层薄薄的湿淀粉糊，下入油内稍炸，再移到小火上慢炸，至呈金黄色时捞出。","油勺移至旺火使油温升至八成热时，再把。","鸡块重投入油内一炸，随即捞出，沥净油，按鸡的原形摆入盘内，（鸡成伏状）。","上桌时外带花椒盐面、辣酱油佐食。"]},{"i":325,"n":"清蒸鸡","r":"鲁菜","o":"鲁菜300种","f":"，汤清味鲜美，鸡肉色白嫩烂，常用于一般宴席。62","c":"热菜","m":["蒸"],"g":["鸡肉","火腿","香菇","口蘑","冬笋","白菜"],"s":["盐","味精","葱","花椒","料酒","高汤","姜"],"t":["炒锅","蒸锅"],"v":0,"a":"主料：宰好的嫩肥母鸡1只（约1250克）｜配料：火腿20克冬菇20克口蘑20克玉兰片30克青菜心50克｜调料：精盐5克味精2克葱椒料酒50克清汤1000克葱.30克姜15克","p":["1。","将宰好的鸡择洗干净，齐着眼剁去嘴和爪。","从脊背中间竖着劈开，大翅膀骨与腿骨环砸断。","冬菇、玉兰片、口蘑、青菜心均用沸水焯过。","2。","将鸡放入沸水内煮透，捞出用水洗一遍，鸡脖子弯在腹内，鸡腹朝下放在大海碗内（先将葱白铺在碗底），倒入清汤，葱椒料酒及精盐、葱姜，放在笼上蒸烂取出，去掉葱姜，鸡扣在大汤碗内。","随即将口蘑、青菜心、玉兰片摆在鸡上，火腿片放在鸡头部，冬菇放在尾部。","炒勺内倒入蒸鸡的汤，再酌加清汤、酱油2滴、精盐、葱椒料酒烧沸撤沫，加味精将汤浇在鸡碗内即成。"]},{"i":326,"n":"布袋鸡","r":"鲁菜","o":"鲁菜300种","f":"，布袋鸡外形完整，内装什锦馅料鲜香味浓，鸡肉嫩烂，为宴席中的大件菜。","c":"热菜","m":["爆炒"],"g":["鸡肉","口蘑","冬笋","海参","海米","香菇","鱼肉","猪肉","火腿"],"s":["淀粉","酱油","料酒","味精","葱","姜","高汤"],"t":["炒锅","蒸锅"],"v":0,"a":"主料：活雏鸡1只（约500克）｜配料：口蘑20克水发玉兰片水发海参20克水发海米10克水发冬菇10克水发鱼骨10克·瘦猪肉200克火腿10克｜调料：酱油50克湿淀粉10克料酒40克味精2克葱姜末20克清汤200克葱油50克10克花生油1500克（约耗50克10克）","p":[".1。将鸡宰后腿毛（注意不可把皮弄破）择洗干净，在鸡颈下刀口处至嗦袋上部用刀割破鸡皮，在刀口处切断鸡颈骨（皮不可断），用麻绳拴住颈骨挂起，用小刀自鸡脖颈贴着骨开始往下连皮带肉向下翻剥，剔净鸡胸骨、腿骨，和翅，骨，但注意不可将鸡皮弄破，并在肛门以内断去大肠，除去，五脏。然后剔出大腿骨（此时皮朝里）、翅骨上节和小腿骨。再将鸡肉翻正（皮朝外），用刀剁去翅梢将肛门和头部洗净，齐着眼剁去嘴、爪尖；劈开鸡爪，取出爪大骨，保留骨环。","将瘦猪肉的筋皮剔去，同火腿、鱼骨、口蘑、冬菇、海参、海米、玉兰片均切成5毫米见方的丁粒，除火腿外，均用沸永焊过。","炒勺内放入葱油50克10克，烧至五成热时，放入葱姜末、猪肉丁，当肉至七成熟时，放入以上所有焯过的配料63和火腿丁、酱油、料酒继续煸炒，盛入碗内晾凉，从鸡脖刀口处装入鸡腹内，用竹签将刀口别住，成布袋鸡。4。将花生油倒入炒勺内，烧至七成热时，布袋鸡放入油内，炸至四面见红色（用小铲不住拨动防止糊锅.）时捞出放在大碗内（腹朝下），再放入清汤、酱油、料酒及葱姜上笼蒸烂取出，布袋鸡扣入汤盘内（腹面朝上）。","蒸鸡的原汤倒炒勺内，酌加酱油、清汤烧沸撇去浮沫，用湿淀粉勾芡，加料酒、味精调匀浇在布袋鸡上。"]},{"i":327,"n":"奶汤鸡脯","r":"鲁菜·济南","o":"鲁菜300种","f":"奶汤鲜醇色洁白而亮，鸡脯绵软，是济南的名蒸之一。八○扒雏鸡原料，主料：宰好的雏公鸡1只（约750克）配料：鲜核桃仁15克鲜","c":"汤羹","m":["烩汆"],"g":["鸡肉","猪肉","香菇","冬笋","荸荠","火腿","鸡蛋"],"s":["高汤","淀粉","盐","葱","花椒","料酒","味精","姜"],"t":["炒锅","蒸锅"],"v":0,"a":"主料：鸡脯肉200克｜配料：猪肥肉票50克水发冬菇20克水发玉兰片50克去皮荸荠50克苔菜花蕾5朵火腿15克｜调料：清汤300克奶汤750克鸡蛋清2个湿淀粉10克.精盐4克葱椒料酒10克味精1.5克姜汁10克葱油100克","p":["1。将鸡脯肉在清水内泡15分钟取出，放在墩上用刀拍松，再用刀背轻轻砸一遍，剔净脂皮白筋后，用刀背砸成细泥，放入碗内，加清汤用竹筷子向一个方向搅匀；荸荠煮熟捞出晾凉与肥肉剞成细泥；玉兰片、冬茹切成3厘米见方的薄片，苔菜花蕾切成片，用沸水焯过。642.鸡蛋清磕入碗内，搅打起沫时，倒入鸡肉泥，加精盐少许、湿淀粉，肥肉荸荠泥一起搅匀成馅料待用。","炒锅内放入葱油，在中火上转动一下，使油沾薄锅底，然后移至小火上（火越小越好，以免煎黄）。手在清水中过后，拿起馅料挤成核桃大的丸子，用奠匙留入锅内（用手铲拨动以免沾在一起），留完后逐个再翻动几下，是颜色发白时，压成扁圆形，煎至两面有硬皮时，盛入碗内，加奶汤200克，葱椒料酒5克、精盐，上笼用旺火蒸4一5分钟取出，倒去原汤扣在大汤碗内，把苔菜花蕾片摆在上面。4。炒勺内放入葱油，烧至五成热时，放入奶汤、清汤、精盐、冬菇、玉兰片烧沸，撇去浮沫，再加姜汁、味精、葱椒料酒，浇在有鸡脯的汤碗内，撒上火腿片即成。"]},{"i":328,"n":"柴把鸡","r":"鲁菜","o":"鲁菜300种","f":"鸡肉嫩烂，清香不腻，为席中常用的大件荣。","c":"热菜","m":["蒸"],"g":["鸡肉","香菇","火腿","冬笋"],"s":["盐","酱油","葱","花椒","高汤","料酒","味精","姜"],"t":["炒锅","蒸锅"],"v":0,"a":"主料：宰好的肥母鸡1只（1000克）｜配料：·冬菇火腿玉兰片各150克青芥菜梗12根｜调料：精盐5克．酱油10克清汤500克葱椒料酒50克味精1.5克葱10克姜2大片","p":["将鸡洗净放锅内加水煮透捞出，把鸡肉全部剔下来，切成长6厘米、粗3毫米的条(不够长度的也切成条)。","将玉兰片、冬菇、火腿都切成粗3毫米的条；芥菜梗洗净，截成长15厘米的段，每段劈为两半，再用热水洗66一次。3，将玉兰片：冬菇、火腿各2条花着摆齐，再将切好地鸡脯、鸡腿肉条整齐地摆在上面（摆时鸡皮面朝下），不够长度的鸡肉条摆在中间
